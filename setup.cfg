# The canon's adoption of `audit:mutants`' Python leg (#2177): mutmut's
# own configuration, the repository's facts only. `source_paths` is what
# is mutated, `pytest_add_cli_args_test_selection` the tests that judge
# it; mutmut 3.8.1's defaults are its maximum, so nothing else is set
# (belt/mutants_python.py).

[mutmut]
source_paths = belt/
pytest_add_cli_args_test_selection = tests/
