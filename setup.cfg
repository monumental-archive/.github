# own configuration, the repository's facts only. `source_paths` is what
# is mutated, `pytest_add_cli_args_test_selection` the tests that judge
# it; every other key is the belt's policy and refused by name
# (mise/mutants.sh, belt/mutants_python.py).

[mutmut]
