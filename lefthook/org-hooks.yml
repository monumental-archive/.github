# The org's shared git hooks, consumed by every repo via lefthook remotes.
# Hooks are developer convenience — enforcement is `ci` in the shared
# workflow. A lefthook-local.yml can override these; CI cannot be overridden.
#
# Repo stub (lefthook.yml):
#   remotes:
#     - git_url: https://github.com/monumental-archive/.github
#       ref: main            # pin to a tag once this repo cuts releases
#       refetch_frequency: 24h
#       configs:
#         - lefthook/org-hooks.yml
# Then once per clone: lefthook install

---
pre-commit:
  # Mid-merge/rebase trees are legitimately inconsistent; don't fail there.
  skip:
    - merge
    - rebase
  parallel: true
  jobs:
    - name: typos
      run: mise run lint:typos
    - name: actionlint
      run: mise run lint:actions

commit-msg:
  jobs:
    - name: committed
      run: committed --commit-file {1}
    # Catch a missing DCO sign-off here rather than at push, where the fix
    # is an amend or a rebase instead of just redoing the commit.
    - name: dco
      # Quoted: the message contains a colon-space, which YAML reads as a
      # mapping inside an unquoted scalar and rejects the whole file — and a
      # broken shared config breaks hooks in every repo that pulls it.
      run: >-
        grep -qiE "^Signed-off-by: .+ <.+@.+>" {1}
        || { echo "missing DCO sign-off, commit with -s" >&2; exit 1; }

pre-push:
  jobs:
    - name: ci
      run: mise run ci
...
