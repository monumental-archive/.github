# The org's shared git hooks, consumed by every repo via lefthook remotes.
# Hooks are developer convenience — enforcement is `ci` in the shared
# workflow. A lefthook-local.yml can override these; CI cannot be overridden.
#
# Repo stub (lefthook.yml):
#   remotes:
#     - git_url: https://github.com/monumental-archive/.github
#       ref: main            # pin to a tag once this repo cuts releases
#       refetch_frequency: 24h
#       configs:
#         - lefthook/org-hooks.yml
# Then once per clone: lefthook install && lefthook run post-checkout
#
# Every job that runs mise sets MISE_CEILING_PATHS to the parent of the
# tree's top level first (#1232). mise walks up from the working
# directory and loads every config it finds, so a worktree nested inside
# its main checkout (where the desktop app makes them) ran the MAIN
# checkout's tasks and config — a parent config outranks even
# MISE_GLOBAL_CONFIG_FILE — and a hook went green on a task body the
# change had already replaced. The ceiling makes mise load nothing above
# the tree being committed or pushed, nested or not. It is computed per
# job because lefthook's `env:` takes literals only.

---
pre-commit:
  # Mid-merge/rebase trees are legitimately inconsistent; don't fail there.
  skip:
    - merge
    - rebase
  parallel: true
  jobs:
    - name: typos
      run: >-
        MISE_CEILING_PATHS="$(dirname "$(git rev-parse --show-toplevel)")"
        mise run lint:typos
    - name: actionlint
      run: >-
        MISE_CEILING_PATHS="$(dirname "$(git rev-parse --show-toplevel)")"
        mise run lint:actions

commit-msg:
  jobs:
    # Through mise, not `committed` directly: the rules are delivered by
    # the belt now (#576) and the hook shell carries no ORG_BELT_DIR of
    # its own. The task composes the org's config with this repo's
    # ORG_COMMIT_SCOPES and passes the result to committed.
    - name: committed
      run: >-
        MISE_CEILING_PATHS="$(dirname "$(git rev-parse --show-toplevel)")"
        ORG_COMMIT_MSG_FILE={1} mise run commits:check
    # Catch a missing DCO sign-off here rather than at push, where the fix
    # is an amend or a rebase instead of just redoing the commit.
    - name: dco
      # Quoted: the message contains a colon-space, which YAML reads as a
      # mapping inside an unquoted scalar and rejects the whole file — and a
      # broken shared config breaks hooks in every repo that pulls it.
      run: >-
        grep -qiE "^Signed-off-by: .+ <.+@.+>" {1}
        || { echo "missing DCO sign-off, commit with -s" >&2; exit 1; }

pre-push:
  jobs:
    # The gate over the working tree at HEAD, on every push (#1281). It
    # gates HEAD's tree, not the ref being pushed: push from the
    # checkout whose HEAD is the branch.
    #
    # Inline, never a `script:` (#1426). lefthook runs a script from its
    # remote cache, .git/info/lefthook-remotes/, which every worktree of
    # a repository shares and which holds one canon ref at a time: a
    # hook in a worktree pinned to another ref deleted the script while
    # this gate ran, and the push died with exit 127 after a green gate.
    # This command is in the config lefthook read when the hook started
    # and touches nothing in that cache. lint:hook-jobs holds it.
    #
    # `files` and `{files}` keep the job from being skipped. lefthook
    # 2.2.2 skips a pre-push `run:` job whose pushed files come out
    # empty (a delete-only push, a ref pushed while HEAD sits elsewhere),
    # unless a file template in the command resolves to at least one
    # file (build_command.go:45-49 at v2.2.2). `files` names the first
    # tracked file present on disk, and `:` discards it.
    - name: ci
      files: >-
        git ls-files | while IFS= read -r f; do
        if [ -f "$f" ]; then printf '%s\n' "$f"; break; fi; done
      run: >-
        : {files};
        MISE_CEILING_PATHS="$(dirname "$(git rev-parse --show-toplevel)")"
        mise run ci

# THE BELT OF THIS CLONE'S PIN (#1686). A clone loads the belt its gate
# stub pins, as a project config, so a laptop judges each repository
# with the tools CI judges it with, whatever else the machine holds.
#
# The pin is the tracked gate stub's
# `uses: <owner>/<repo>/.github/workflows/ci.yml@<40-hex sha>`, the line
# lint:belt-current reads; there is no second pin. The tree is cached
# once per sha, shared by every clone and worktree on the machine, and
# never written again once it exists: it is fetched into
# org-belt/.trees/<sha>.<random> under ${XDG_CACHE_HOME:-~/.cache}, its
# HEAD checked against the sha (the sha is the integrity check), and
# published as org-belt/<sha>, a symbolic link made by `ln -sn` with no
# -f: it creates the name or fails, atomically, and -n keeps ln from
# following an existing link into the tree. The loser of a race removes
# its own tree and uses the winner's, so two hooks at once leave one
# link to one whole tree. The network is touched only when the cache has
# no tree for the pin.
#
# Two links: `.config/mise/conf.d/belt.toml` (mise loads it as a
# project config) and `.config/mise/mise.lock` (mise locks a project
# conf.d file with its config directory's lock, one level up, and with
# nothing else: measured on #1686). They are machine state, never
# tracked: the job adds `.config/mise/` to the clone's info/exclude,
# under the common git directory every worktree shares, when the line
# is absent, so no repository carries an ignore line for them. Each link
# is replaced in one step (#1731): made beside it as `<link>.<pid>` and
# renamed over it with `mv -f`, so a hook running at the same time sees
# the old link or the new one, never neither and never an error. A
# temporary name whose hook is no longer running is removed; a sibling
# whose suffix is not all digits is not the hook's and is left. A line
# is printed only when a link changes. No pin (the canon, whose tree is
# its belt) does nothing.
#
# git exports its own variables to a hook (GIT_DIR among them); they are
# unset before the fetch, so the cache repository is never the clone's.
# Git runs post-checkout on `git worktree add`, so a new worktree links
# itself. Once per clone, after `lefthook install`:
#   lefthook run post-checkout
post-checkout:
  jobs:
    - name: belt
      run: &belt >-
        top="$(git rev-parse --show-toplevel)" || exit 1;
        common="$(git rev-parse --git-common-dir)" || exit 1; common="$(cd "${common}" && pwd)" || exit 1;
        pin="$(cat "${top}"/.github/workflows/*.y*ml 2>/dev/null
        | sed -nE 's|.*uses:[[:space:]]*([^[:space:]/]+/[^[:space:]/]+)/\.github/workflows/ci\.ya?ml@([0-9a-f]+).*|\1 \2|p'
        | sed -n '1p')";
        [ -n "${pin}" ] || exit 0;
        repo="${pin% *}"; sha="${pin#* }";
        [ "${#sha}" -eq 40 ] || { echo "org-belt: the gate stub pins ${sha}, not a 40-hex sha; nothing linked" >&2; exit 1; };
        cache="${XDG_CACHE_HOME:-${HOME}/.cache}/org-belt"; tree="${cache}/${sha}";
        vars="$(git rev-parse --local-env-vars)" || exit 1; for v in ${vars}; do unset "${v}"; done;
        if [ ! -d "${tree}" ]; then
        mkdir -p "${cache}/.trees" && tmp="$(mktemp -d "${cache}/.trees/${sha}.XXXXXX")" || exit 1;
        if ! { git -C "${tmp}" init -q && git -C "${tmp}" fetch -q --depth 1 "https://github.com/${repo}" "${sha}"
        && git -C "${tmp}" -c advice.detachedHead=false checkout -q FETCH_HEAD; }; then
        rm -rf "${tmp}"; echo "org-belt: could not fetch ${repo}@${sha}; nothing linked" >&2; exit 1; fi;
        got="$(git -C "${tmp}" rev-parse HEAD)";
        if [ "${got}" != "${sha}" ]; then
        rm -rf "${tmp}"; echo "org-belt: fetched ${got}, not the pinned ${sha}; nothing linked" >&2; exit 1; fi;
        ln -sn "${tmp}" "${tree}" 2>/dev/null || rm -rf "${tmp}"; fi;
        if [ ! -f "${tree}/mise/config.toml" ] || [ ! -f "${tree}/mise/mise.lock" ]; then
        echo "org-belt: ${tree} holds no mise/config.toml and mise.lock; nothing linked" >&2; exit 1; fi;
        dir="${top}/.config/mise"; mkdir -p "${dir}/conf.d" || exit 1; changed=0;
        for pair in "conf.d/belt.toml:config.toml" "mise.lock:mise.lock"; do
        link="${dir}/${pair%%:*}"; want="${tree}/mise/${pair#*:}";
        for old in "${link}".*; do p="${old#"${link}".}";
        case "${p}" in ""|*[!0-9]*) continue ;; esac;
        kill -0 "${p}" 2>/dev/null || rm -f "${old}"; done;
        cur="$(readlink "${link}" 2>/dev/null)" || cur="";
        if [ "${cur}" != "${want}" ]; then new="${link}.$$";
        { ln -sn "${want}" "${new}" && mv -f "${new}" "${link}"; } || { rm -f "${new}"; exit 1; };
        changed=1; fi; done;
        exclude="${common}/info/exclude"; mkdir -p "${common}/info" || exit 1;
        grep -qxF '.config/mise/' "${exclude}" 2>/dev/null || printf '%s\n' '.config/mise/' >> "${exclude}" || exit 1;
        [ "${changed}" -eq 0 ] || echo "org-belt: .config/mise links the belt of ${repo}@${sha}"

post-merge:
  jobs:
    - name: belt
      run: *belt

post-rewrite:
  jobs:
    - name: belt
      run: *belt
...
