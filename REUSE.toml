# REUSE.toml (spec 3.3): machine-readable licensing for every file in
# the canon. The licence is 0BSD — the public-domain-equivalent,
# OSI-approved, zero-condition licence — chosen deliberately for this
# repository (#214): the canon exists to be copied, scaffold and
# workflow-templates above all, and a licence that demands nothing of
# the copier is the licence that matches the intent. Aggregate
# precedence over the whole tree: configuration and workflows do not
# carry per-file headers.
version = 1
SPDX-PackageName = ".github"
SPDX-PackageSupplier = "Carl Allen <carl.allen313@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/monumental-archive/.github"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Carl Allen"
SPDX-License-Identifier = "0BSD"

# A fixture copied from another work carries that work's own declaration,
# not the canon's (#1589): a real fixture is required, and the bytes of
# one captured from a sister repository are that repository's. Each
# entry quotes the source's REUSE.toml verbatim; override, so the 0BSD
# blanket above never also claims them. CONTRIBUTING.md holds the rule.
[[annotations]]
path = [
  # A published crate of monumental-archive/edtf (release/ tests).
  "release/testdata/edtf-core-1.3.3.crate",
  # A git bundle of monumental-archive/edtf commits (#1422).
  "mise/testdata/queue-head/edtf-265.bundle.gz",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) the edtf contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
