# The canon's own repo-level tasks. The belt arrives globally, as it does
# everywhere; this file is the canon consuming the same `ci` contract it
# hands every other repo — the global `ci` collects an optional `test`,
# so the belt's Python helpers are exercised by the ordinary gate with
# nothing added to the belt to run them.
#
# It exists because the canon acquired a unit-testable corpus. #392's
# close-out recorded the opposite — "two Python belt helpers, no
# unit-testable corpus of its own" — and that was true of a 100-line
# skip-emitter and a shell extractor. `mise/subject_budget.py` is 700
# lines of manager walks, template resolution and budget arithmetic
# whose skip-clean guards are exactly the class #364 named: the least
# exercised code in the org, where a guard that skips when it should run
# looks precisely like success.
#
# No `[tools]` here on purpose: every tool this repo uses is the org's,
# pinned in mise/config.toml beside mise.lock, and a second tool table
# would be a second place for a pin to live.

# The pin every task-defining config in the org owes, restated here because
# this file defines a task (#700). The belt supplies the same string as
# mise's default inline shell, so in the gate and on a belt-wearing machine
# this line changes nothing; it is what makes the file true in a clone that
# has neither. `lint:belt-shell` reds any config that defines tasks and
# leaves the shell to whatever layer happens to be in play — mise's own
# default is `sh`, which is dash on an Ubuntu runner.
[task_config]
shell = "bash -euo pipefail -c"

[tasks.test]
description = "The belt's Python helpers and release scripts (stdlib unittest)"
dir = "{{cwd}}"
# Against the WORKING TREE's mise/, never ORG_BELT_DIR. In this repo the
# two resolve to the same place — gate.yml self-applies ci.yml through a
# local `uses:`, so `$/.github/actions/canon` hands the job the pull
# request's own ref — but the code under review is what a test task owes
# an answer about, and naming the tree says so without depending on that
# resolution staying true.
#
# release/ joined mise/ with #816: the release scripts had no tests at
# all (#772), and the first one written reproduces a burned release from
# a real captured listing. .github/rekor-monitor/ joined with #1250; its
# reconciler moved to stele with #1339, and what stays is the workflow's
# helpers (the issue filer, the leg's verdict, the standing issue) and
# its shape, tested on stele's own captured reports and checkpoints.
# settings/ joined with #1360: repo-baseline.sh's drift check, run
# against a stubbed forge that makes no live settings read or write.
# Explicit roots rather than a walk from `.`
# — a discovery root is a claim about what is tested, and a wildcard
# makes that claim silently.
#
# Every root runs with git aimed at a decoy repository (#1463). Under
# the pre-push hook git exports GIT_DIR, and a test that runs git without
# a scrubbed env= would write into the real repository (#857) while the
# suite stayed green. `mise/git_decoy.py run` replaces the caller's git
# environment with the decoy's, and reds by name whatever a test changed
# there — the same red in a direct run and in CI as under the hook.
#
# Each root runs through `mise/unittest_guarded.py` (#1491), which is
# `python3 -m unittest` plus a check after every test that the process
# is still in the directory the run started in: a test that leaves it
# elsewhere, or in a directory it deleted, is an ERROR on that test by
# name, instead of a "getcwd() failed" on whichever test runs next.
# It runs each test file in a worker process of its own (#1623), as many
# at once as there are cores (at most 8), and prints one merged unittest
# summary; ORG_TEST_WORKERS=1 runs a root serially, for debugging.
run = """
decoy="$(mktemp -d)"
rc=0
trap 'rc=$?; rm -rf "${decoy}"; [[ -n ${org_done:-} || ${rc} -ne 0 ]] || rc=1; exit "${rc}"' EXIT
python3 mise/git_decoy.py plant "${decoy}"
python3 mise/git_decoy.py run "${decoy}" -- python3 mise/unittest_guarded.py discover --start-directory mise --pattern "test_*.py"
python3 mise/git_decoy.py run "${decoy}" -- python3 mise/unittest_guarded.py discover --start-directory release --pattern "test_*.py"
python3 mise/git_decoy.py run "${decoy}" -- python3 mise/unittest_guarded.py discover --start-directory .github/rekor-monitor --pattern "test_*.py"
python3 mise/git_decoy.py run "${decoy}" -- python3 mise/unittest_guarded.py discover --start-directory settings --pattern "test_*.py"
org_done=1
"""
