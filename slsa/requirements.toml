# Per-track requirement mappings AS DATA (#349 S2): rendered into the
# track docs by fix:tracks and guarded by lint:tracks.
#
# Each source row carries `spec_ids`: the <tr id> values in the spec's
# own requirement tables that the row discharges. They are how
# audit:spec-drift checks COVERAGE -- that every row in the pinned
# matrix is either mapped here or declared in [[declined]]. That leg is
# what finding 4 (a requirement absent from the mapping) actually needed:
# comparing the live spec against the pin notices when the SPEC moves,
# and can never notice a requirement the spec still has and this file
# never mapped. The header here previously claimed the drift check
# covered that case; it did not, and #123 finding 3 said so.
#
# spec_ids are not a bijection: one row may discharge several ids (the
# repository-ids row) and one id may be discharged by several rows (tag
# immutability is part of access-and-history). Coverage is the union.

[[source]]
requirement = "Choose an appropriate SCS"
spec_ids = ["choose-scs"]
level = "1"
enforcement = "GitHub"

[[source]]
requirement = "Repository IDs / immutable revision IDs / human-readable diffs"
spec_ids = ["repository-ids", "revision-ids", "human-readable-diff"]
level = "1"
enforcement = "GitHub (git SHAs, PR diffs)"

[[source]]
requirement = "Source VSAs"
spec_ids = ["source-summary"]
level = "1"
enforcement = "**Emitted** per push, all three repos (#207)"

[[source]]
requirement = "Access control + reliable history"
spec_ids = ["access-and-history"]
level = "2"
enforcement = "`org-default-branch` ruleset: deletion blocked, force push blocked, linear history, org-wide, empty bypass list"

[[source]]
requirement = "History (SCS): every Named Reference change recorded — when, by whom, new revision ID"
spec_ids = ["history"]
level = "2"
enforcement = "Each chain link records the actor, `commitTime`, the revision and its parents (`source-attest` emit) — contemporaneously with the push in the ordinary case, and honestly late on healed links (`repaired` marks the deviation — `source-provenance.md`, healed links); GitHub's ref history is the platform record beneath it. Distinct from the *Organization* requirement in the row above — this row was absent until #349 finding 4, met in substance but unmapped"

[[source]]
requirement = "Tag immutability"
spec_ids = ["access-and-history"]
level = "2"
enforcement = "`org-default-tag` ruleset: update/move/delete blocked, all tags, all repos"

[[source]]
requirement = "Safe expunging process"
spec_ids = ["safe-expunging-process"]
level = "2"
enforcement = "`docs/expunging.md`"

[[source]]
requirement = "Identity management"
spec_ids = ["identity-management"]
level = "2"
enforcement = "GitHub accounts, org 2FA required, DCO signoff + `required_signatures` attribute every change"

[[source]]
requirement = "Source provenance, contemporaneous"
spec_ids = ["source-provenance"]
level = "2"
enforcement = "**Emitted** contemporaneously with the ref update, in the repo where the push authentically exists (#207) — a healed link is the named deviation: `repaired` marks it and its level is computed under the continuity guard (`source-provenance.md`, healed links)"

[[source]]
requirement = "Continuity"
spec_ids = ["continuity"]
level = "2"
enforcement = "Ruleset timestamps (GitHub-recorded); a ruleset edit that weakens a control resets its clock — see `rulesets.md`"

[[source]]
requirement = "Continuous technical controls, documented"
spec_ids = ["technical-controls"]
level = "3"
enforcement = "This document + `rulesets.md`; the control set: required `ci / ci` gate (bound to the Actions app), required signatures, linear history, review-thread resolution, squash-only merges, `v*` creation locked to the minting App, capability-boundary lint"

[[source]]
requirement = "Protected named references, org properties"
spec_ids = ["protected-refs"]
level = "3"
enforcement = "Rulesets as above; `ORG_SOURCE_GATED` emitted live in every source VSA since 2026-08-12 (#207)"

# Spec rows the org does not claim, each with the decision that declined
# it. audit:spec-drift counts these as covered: the point of the coverage
# check is that no requirement is passed over in SILENCE, not that every
# requirement is met.
[[declined]]
spec_id = "two-party-review"
reason = "Source L4 — two trusted persons; GitHub will not let a solo maintainer approve their own PR. Declined at one maintainer (#126), reopened the day a second exists"

[[build]]
requirement = "Choose an appropriate build platform"
discharged_by = "GitHub Actions plus the org's signer split — a platform whose control plane the org extended rather than trusted blind; capability assessed in [`build-assessment.md`](build-assessment.md)"

[[build]]
requirement = "Follow a consistent build process"
discharged_by = "The orchestrator (`publish.yml`): callers declare inputs, never steps; the step order is fixed in the canon and unrearrangeable by a caller; every `uses:` SHA-pinned"

[[build]]
requirement = "Distribute provenance"
discharged_by = "The attestation store (the same API `gh attestation verify` reads) plus the evidence bundle attached to every release; consumer recipes in [`runbook.md`](runbook.md)"

[[dependency]]
level = "L1"
demands = "Inventory: know what you depend on"
standing = "**Have** — lockfiles committed everywhere, per-release SBOMs on every release"

[[dependency]]
level = "L2"
demands = "Known vulnerabilities triaged per release"
standing = "**Met by construction** — deny in the gate, blast-radius on the cron, and a commit point on BOTH archetypes refuses every publish job while an advisory in its SBOM is undecided (the continuous path gained it in #717, one decision per publish rather than per version) (`stele derive vex` + the `commit-point` barrier, #349); every decision exits through a signed VEX keyed by `package@version`. First exercised on `release-lab@v0.20.0`, which it refused a release — and whose npm and GHCR uploads raced past the then-unwired graph, the defect #349 finding 1 closed — see \"Where L2 is met by construction\""

[[dependency]]
level = "L3"
demands = "Producer-controlled locations"
standing = "**Declined in writing (#121)** — permanent vendor weight for availability coverage that checksum integrity does not need"

[[dependency]]
level = "L4"
demands = "Acceptable-risk policy over L3"
standing = "**Declined (#122)** — sequential on L3"
