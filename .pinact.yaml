# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
#
# pinact enforces the half of the org's pinning convention nothing else
# did. CLAUDE.md requires every `uses:` to carry "a full commit SHA with a
# trailing version comment"; zizmor's unpinned-uses proves the SHA and is
# blind to the comment, and lint:canon-pins reads canon references only.
# The comment is what a human and Renovate both read to judge whether a
# pin is current, so an absent or untrue one is a real defect.
version: 3

# min_age is deliberately NOT set here. The org's seven-day floor lives on
# audit:action-pins' command line instead, so it holds in consumer repos
# that carry no .pinact.yaml at all, and so the number has one home rather
# than two to drift apart.

rules:
  # The signer is pinned by immutable SHA and commented `# main`, and that
  # is its permanent correct state, not a gap. monumental-archive/signer
  # is never published — no tags, no releases, by design — so there is no
  # version for a comment to name and never will be. The SHA is the whole
  # identity; `# main` says only which line it came from.
  #
  # Scoped as narrowly as the tool allows. `VersionComment` is empty
  # here — pinact does not count `# main` as a version comment, since
  # "main" is not a version, which is exactly why it errors. So the
  # condition exempts the one situation that is permanent (a signer
  # reference with no version to name) and nothing else: a signer
  # reference that ever carried a real version comment would fall
  # straight back under the check, comment truthfulness included.
  - ignore: true
    conditions:
      - expr: |
          ActionName matches "^monumental-archive/signer/" && VersionComment == ""
