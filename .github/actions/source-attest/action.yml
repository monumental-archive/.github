# The org's source-track emitter (#207): per push to a protected ref,
# read the enforcement state from the rules API, emit source provenance
# and a source VSA under the CALLING repository's frozen identity, and
# append both to the revision's chain link in refs/notes/commits.
#
# The identity contract: a Fulcio certificate names the top-level
# workflow's path plus ref, and composite steps run inside the caller's
# job — so this action can carry every line of logic while the signing
# identity stays `<repo>/.github/workflows/source-attest.yml@refs/heads/main`,
# the root-of-trust contract in docs/source-assessment.md. The identity
# guard below refuses to run from any other workflow path: an emitter
# invoked from an unreserved path would mint chain links nobody can
# verify against the published contract.
#
# Correct by construction, stated as invariants the steps enforce:
#   - Claims are read from GitHub's rules API at emission time, never
#     from configuration intent; a control that is not live is absent,
#     so a lapse under-claims and resets its own clock. A control that
#     cannot be READ is not absent — it fails the run with a named
#     error, because a consumer must never have to guess whether an
#     absent property means "lapsed" or "unreadable" (#240).
#   - The action runs in two stages in two jobs with disjoint
#     capabilities (#240): the `claims` stage holds the org-ruleset
#     read token and nothing else — no id-token, no contents: write —
#     and the `attest` stage holds the signing identity and zero
#     secrets. The read token can never mint a certificate; a
#     compromised signing job has no secret to exfiltrate.
#   - Nothing from the attested repository is ever EXECUTED. The repo is
#     touched only through git plumbing (history + notes fetch, notes
#     push) and the REST API — which is what makes the caller's
#     `id-token: write` grant safe (the capability-boundary rule).
#   - The VSA is derived from the just-signed provenance only, after
#     verifying it against the pinned identity — the L2+ requirement.
#   - The chain verifies its previous link before appending; a missing
#     genesis fails loudly rather than re-founding the chain.
name: source-attest
description: >-
  Emit signed source provenance and a source VSA for the pushed
  revision, chained in refs/notes/commits under the calling repo's
  reserved source-attest identity
inputs:
  stage:
    description: >-
      Which capability half this invocation is (#240). "claims" reads
      the enforcement state and derives the claim set — the caller's
      job must hold the source-attest environment's read token as
      GH_TOKEN and nothing else. "attest" consumes the claims payload
      and signs — the caller's job holds `id-token: write` and
      `contents: write` and no secrets.
    required: true
  claims:
    description: >-
      The claims payload from the claims stage (this action's `claims`
      output), handed across the job boundary. Required when stage is
      "attest"; ignored otherwise.
    required: false
    default: ""
  genesis:
    description: >-
      "true" founds the chain: attests the current revision with no
      previous link. Refused when any link already exists on the walked
      history — a gap is debt, never a reason to re-found. Attest stage
      only.
    required: false
    default: "false"
outputs:
  claims:
    description: >-
      base64 of the derived claims.json — data, not secret; carried as
      a job output so no artifact store sits inside the trust boundary.
    value: ${{ steps.claims.outputs.claims }}
runs:
  using: composite
  steps:
    - name: Guard the identity and resolve the canon tree
      shell: bash
      env:
        SA_STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        case "${SA_STAGE}" in
          claims | attest) ;;
          *)
            echo "::error::source-attest stage must be 'claims' or 'attest', got '${SA_STAGE}' (#240)"
            exit 1
            ;;
        esac
        expected="${GITHUB_REPOSITORY}/.github/workflows/source-attest.yml@refs/heads/main"
        if [[ "${GITHUB_WORKFLOW_REF}" != "${expected}" ]]; then
          echo "::error::source-attest invoked from '${GITHUB_WORKFLOW_REF}' — the emitter runs only under the reserved identity '${expected}' (docs/source-assessment.md)"
          exit 1
        fi
        # The action tree IS a canon tree: `uses:` fetched the whole
        # repository at the caller's pin, the same single resolution the
        # canon action relies on (#165).
        root="$(cd "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        case "${root}" in
          */_actions/monumental-archive/.github/*)
            canon_ref="$(basename "${root}")"
            ;;
          *)
            if [[ "${GITHUB_REPOSITORY}" != "monumental-archive/.github" ]]; then
              echo "::error::source-attest resolved to '${root}' in ${GITHUB_REPOSITORY} — not an _actions path and not a canon self-call"
              exit 1
            fi
            canon_ref="${GITHUB_SHA}"
            ;;
        esac
        if [[ ! -f "${root}/source-policies/default.json" ]]; then
          echo "::error::resolved canon tree at '${root}' has no source-policies/default.json"
          exit 1
        fi
        work="${RUNNER_TEMP}/source-attest"
        mkdir -p "${work}"
        {
          echo "SA_WORK=${work}"
          echo "SA_CANON_ROOT=${root}"
          echo "SA_CANON_REF=${canon_ref}"
          echo "SA_IDENTITY=https://github.com/${expected}"
          echo "SA_ISSUER=https://token.actions.githubusercontent.com"
        } >> "${GITHUB_ENV}"

    # cosign comes from the toolbelt, not from sigstore's installer
    # action: the belt pin carries per-platform checksums and provenance
    # verification (mise `locked_verify_provenance`), which is the org's
    # standing answer to "where did this binary come from", and
    # jdx/mise-action is on the org's Actions allowlist where
    # sigstore/cosign-installer is not. The signing tool arriving through
    # the same gate as every other tool is the point, not a workaround.
    # Claims stage: read enforcement under the caller's read token —
    # this step deliberately declares no GH_TOKEN of its own, so the
    # only token it can ever use is the one the calling job's
    # environment hands it, and claims.sh refuses to run without one.
    - name: Read enforcement and derive the claims
      if: ${{ inputs.stage == 'claims' }}
      id: claims
      shell: bash
      run: |
        set -euo pipefail
        "${GITHUB_ACTION_PATH}/claims.sh"
        echo "claims=$(base64 -w0 "${SA_WORK}/claims.json")" >> "${GITHUB_OUTPUT}"

    # Attest stage: the claims payload crosses the job boundary as
    # data and is shape-checked before anything downstream reads it.
    - name: Receive and validate the claims payload
      if: ${{ inputs.stage == 'attest' }}
      shell: bash
      env:
        SA_CLAIMS_B64: ${{ inputs.claims }}
      run: |
        set -euo pipefail
        [[ -n ${SA_CLAIMS_B64} ]] || {
          echo "::error::stage 'attest' requires the claims payload from the claims job — wire this input to needs.claims.outputs.claims (#240)"
          exit 1
        }
        base64 -d <<< "${SA_CLAIMS_B64}" > "${SA_WORK}/claims.json"
        jq -e '(.rulesReadAt | type == "string")
          and (.controls | type == "array")
          and all(.controls[]; (.property | type == "string") and has("evidence"))' \
          "${SA_WORK}/claims.json" > /dev/null || {
          echo "::error::the claims payload does not have the shape claims.sh emits — refusing to sign it"
          exit 1
        }

    - name: Install mise
      if: ${{ inputs.stage == 'attest' }}
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        version: 2026.8.3
        cache: false
        install: false

    - name: Install the belt's cosign
      if: ${{ inputs.stage == 'attest' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        export MISE_GLOBAL_CONFIG_FILE="${SA_CANON_ROOT}/mise/config.toml"
        export MISE_TRUSTED_CONFIG_PATHS="${SA_CANON_ROOT}"
        export MISE_LOCKED=1
        mise install "aqua:sigstore/cosign"
        dirname "$(mise which cosign)" >> "${GITHUB_PATH}"

    - name: Fetch the chain and verify the previous link
      if: ${{ inputs.stage == 'attest' }}
      shell: bash
      env:
        SA_GENESIS: ${{ inputs.genesis }}
      run: ${GITHUB_ACTION_PATH}/chain.sh

    # Signing mints Rekor entries; the push is the last step. Prove the
    # environment can carry the run to completion BEFORE anything
    # irreversible — no orphan log entries for links that never land.
    - name: Preflight — prove the run can finish before anything signs
      if: ${{ inputs.stage == 'attest' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: ${GITHUB_ACTION_PATH}/preflight.sh

    - name: Emit and sign the provenance, derive and sign the VSA
      if: ${{ inputs.stage == 'attest' }}
      shell: bash
      env:
        SA_ACTOR: ${{ github.actor }}
        SA_ACTOR_ID: ${{ github.actor_id }}
      run: ${GITHUB_ACTION_PATH}/emit.sh

    - name: Append the link and push the notes ref
      if: ${{ inputs.stage == 'attest' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: ${GITHUB_ACTION_PATH}/append.sh
