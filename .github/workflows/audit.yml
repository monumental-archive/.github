# Scheduled, network-touching checks — everything the deterministic gate
# deliberately excludes. Failures here page via the Actions UI/notifications
# rather than blocking merges.
name: audit

on:
  schedule:
    # Mondays 06:00 UTC — after a weekend of link rot and repo drift.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  links:
    name: audit / links
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Check links
        run: mise run audit:links

  actions:
    name: audit / actions (online)
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Audit workflows online
        env:
          # zizmor's API-backed audits — impostor-commit,
          # known-vulnerable-actions, ref-confusion, typosquat-uses,
          # stale-action-refs — are skipped by the gate's --offline run and
          # would otherwise execute nowhere. The default token is enough:
          # they read public advisory and commit data.
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:actions

  template-pins:
    name: audit / template pin staleness
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the staleness check diffs the pinned SHA..HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Check the template pins against shipped canon
        run: mise run audit:template-pins

  canon-pins:
    name: audit / canon pin freshness
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3

      - name: Check every canon reference against the latest canon tag
        # The alarm on the Renovate mechanism (#133): a paused or
        # misconfigured Renovate goes red here within a week instead of
        # silently costing a release its evidence (the v0.16.1 VSA).
        run: mise run audit:canon-pins

  baseline-drift:
    name: audit / repo settings drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The default token sees only the public view of repo metadata.
      # AUDIT_TOKEN is a fine-grained PAT (all org repos, Administration:
      # read AND write — the merge-settings fields in GET /repos are only
      # returned to push/admin-capable identities, and the fine-grained
      # read-only grant does not qualify; verified empirically 2026-08-09).
      # Write also enables a future self-healing `apply` job.
      GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every repo against the baseline
        run: ./settings/repo-baseline.sh check
