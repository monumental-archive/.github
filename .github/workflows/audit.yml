# Scheduled, network-touching checks — everything the deterministic gate
# deliberately excludes. Failures here page via the Actions UI/notifications
# rather than blocking merges.
---
name: audit

"on":
  schedule:
    # Mondays 06:00 UTC — after a weekend of link rot and repo drift.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  links:
    name: audit / links
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Check links
        run: mise run audit:links

  actions:
    name: audit / actions (online)
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Audit workflows online
        env:
          # zizmor's API-backed audits — impostor-commit,
          # known-vulnerable-actions, ref-confusion, typosquat-uses,
          # stale-action-refs — are skipped by the gate's --offline run and
          # would otherwise execute nowhere. The default token is enough:
          # they read public advisory and commit data.
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:actions

  action-pins:
    name: audit / action pin comments and age
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Verify pin comments and release age
        env:
          # pinact resolves each pinned SHA back to its tag to prove the
          # version comment tells the truth, and reads publish dates for
          # the release-age floor. Both are public reads, so the default
          # token suffices. The gate's offline leg (lint:action-pins)
          # cannot do either — it can only see that a comment exists.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run audit:action-pins

  template-pins:
    name: audit / template pin staleness
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the staleness check diffs the pinned SHA..HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Check the template pins against shipped canon
        run: mise run audit:template-pins

  canon-pins:
    name: audit / canon pin freshness
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Check every canon reference against the latest canon tag
        # The alarm on the Renovate mechanism (#133): a paused or
        # misconfigured Renovate goes red here within a week instead of
        # silently costing a release its evidence (the v0.16.1 VSA).
        # The token is for the staleness-age lookup — a public read, but
        # `gh api` refuses to run tokenless in CI, and an unperformable
        # read once rendered as "over 24h" (#349 finding 11).
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:canon-pins

  org-pins:
    name: audit / org-wide canon pin freshness
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Check every org repo's canon references from the canon
        env:
          # Repo enumeration only; the clones and tag reads are public.
          # Red means a consumer's canon references have been catchable
          # for over a day and Renovate has not caught them — the alarm
          # audit:canon-pins can only raise inside the lagging repo
          # itself, raised here where someone looks (#310 finding 1).
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:org-pins

  spdx-list:
    name: audit / spdx list freshness
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Check the vendored SPDX id list against upstream
        # The licence validator fails closed on ids it does not know; this
        # is the alarm that keeps "fails closed" from quietly becoming
        # "fails on every new licence forever".
        run: mise run audit:spdx-list

  biome-rules:
    name: audit / biome nursery coverage
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Check biome's nursery rules against the ones the org names
        # `preset: "all"` excludes nursery and there is no bulk switch, so
        # the config names each rule. A rule REMOVED upstream reddens the
        # gate on its own (biome rejects unknown keys); a rule ADDED is
        # silent, and this is the only thing that looks.
        run: mise run audit:biome-rules

  blast-radius:
    name: audit / advisory blast radius
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Walk every published SBOM and report the blast radius
        env:
          # Release enumeration and asset download across org repos; the
          # default token reads public releases. Red means a NEW,
          # UNDECIDED advisory (no VEX in security/vex/), a failed asset
          # verification, an unreadable SBOM, or a missed canary — the
          # decided findings are in the summary, not the failure.
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:blast-radius

  attestation-coverage:
    name: audit / attestation coverage
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Prove nothing ships unattested
        env:
          # Release and package enumeration plus attestation-store reads
          # across org repos; the default token reads public data. Red
          # means an artifact shipped without its evidence set — a
          # missing SBOM asset, class bundle, continuous-digest
          # attestation, or base-image approval (#117).
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:attestations

  actions-allowlist:
    name: audit / actions allowlist drift
    runs-on: ubuntu-24.04
    # Same environment discipline as repo-settings drift, and for the
    # same reason: `orgs/{org}/actions/permissions/selected-actions` is
    # an org-scoped read the default job token CANNOT perform. The old
    # comment here claimed the opposite, and the leg spent its CI life
    # comparing the belt against `null` — asserting drift that did not
    # exist and equally ready to assert clean that was not measured
    # (#349 finding 10). A leg's token must be able to perform its read,
    # or its only honest output is "I could not read".
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Reconcile the belt's allowlist with the live org setting
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: mise run audit:actions-allowlist

  signer-surface:
    name: audit / signing surface vs live callers
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Reconcile the declared surface with the signer and its callers
        # #349 S5: a signing capability with no live caller reddens here
        # instead of waiting a year for an audit to read the file. The
        # signer repo is public; the default token reads it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:signer-surface

  adoption:
    name: audit / obligation adoption across the org
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Enumerate the population against the required stub set
        # #349 S7, the #266 rule for every obligation: a repo missing a
        # stub with no opt-out row is a red, never a silence. Public
        # metadata; the default token reads it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:adoption

  citations:
    name: audit / docs citations resolve
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Resolve every version and run citation in docs/
        # #349 finding 2: the docs cited a tag that never existed and it
        # survived two audits — a citation is a claim about the record,
        # so it gets checked like one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:citations

  source-vsa:
    name: audit / source chain coverage
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Walk every founded chain and verify each link
        env:
          # Repo enumeration only; history, notes and Sigstore bundles
          # are public. Red means a hole or a link that fails the
          # published root of trust (#207).
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:source-vsa

  release-tags:
    name: audit / release tags
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Check every org release tag against the signing epoch
        # #349 S4. The task shipped with #353 and docs already cite it as
        # enforcing the epoch forward, but nothing scheduled it — a check
        # no workflow runs is a check nobody runs (#354). Repo
        # enumeration only; tags, notes and Sigstore bundles are public.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:release-tags

  spec-drift:
    name: audit / spec drift
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Compare the live SLSA source matrix with the pinned snapshot
        # Same gap as release-tags: slsa/requirements.toml names this task
        # as what compares it against upstream, and nothing ran it. The
        # spec page is fetched anonymously; no token needed.
        run: mise run audit:spec-drift

  caller-permissions:
    name: audit / caller permissions
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Check every consumer grant against canon HEAD's requirements
        # Seam 2 of #358, org-wide half: a consumer whose uses: grant is
        # below what a callee's jobs ask for dies as startup_failure on
        # its next pin bump, and Renovate bumps the SHA without touching
        # the stub body. A finding is a forecast, not an outage. Public
        # workflow files only; the default token reads them.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:caller-permissions

  badges:
    name: audit / badge truth
    runs-on: ubuntu-24.04
    permissions:
      contents: read # README and .badge-states reads across org repos
      # The anonymous REST endpoint 401s even for public containers
      # (#316 addendum C, measured), so the existence check needs auth.
      packages: read # the ghcr leg asks whether the named package exists
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4
          cache: false

      - name: Re-check every shield against its source of truth
        env:
          # README reads across org repos; the default token reads
          # public content plus (packages: read) the container-package
          # existence checks. Red means a shield asserting something
          # its issuer no longer says (#215) — a score below its floor,
          # a lost baseline, a non-compliant REUSE status, a package or
          # workflow shield over nothing, a fair-software dot the
          # evidence contradicts, a badge block not machine-rendered,
          # or a shield nothing here checks (#316 finding 5).
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:badges

  baseline-drift:
    name: audit / repo settings drift
    runs-on: ubuntu-24.04
    # The secret lives in this environment, not repo-wide: an org-admin
    # token referenced ambiently is drawable by any job anyone adds to
    # any workflow here; scoped to the environment, only jobs that
    # declare it are ever issued the secret (zizmor secrets-outside-env,
    # the audit persona's one standing finding).
    environment: audit
    permissions:
      contents: read
    env:
      # The default token sees only the public view of repo metadata.
      # AUDIT_TOKEN is a fine-grained PAT (all org repos, Administration:
      # read AND write — the merge-settings fields in GET /repos are only
      # returned to push/admin-capable identities, and the fine-grained
      # read-only grant does not qualify; verified empirically 2026-08-09).
      GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
      # Fine-grained PATs offer no Packages permission (measured
      # 2026-08-12), so the org-packages visibility check carries its own
      # minimal classic PAT: read:packages, nothing else.
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every repo against the baseline
        run: ./settings/repo-baseline.sh check
...
