# Scheduled, network-touching checks — everything the deterministic gate
# deliberately excludes. Failures here page via the Actions UI/notifications
# rather than blocking merges.
#
# WHAT BELONGS HERE RATHER THAN IN repo-audit.yml, stated once because a
# leg landing on the wrong side of it is invisible from inside the canon
# (#704). A leg belongs here when its subject is the ORG or a
# CANON-OWNED artefact: it enumerates the population (adoption,
# org-pins, drafts, release-tags, signer-surface, caller-permissions,
# source-vsa, attestations, blast-radius, badges), reads an org setting
# (actions-allowlist), or reads something only this repository holds —
# the belt's own config (biome-rules), the workflow templates
# (template-pins), the pinned SLSA matrix (spec-drift). Those guard on
# a canon-owned artefact, and lint:canon-policy (#579) is the join that
# stops a deleted one turning them into silent skips — for the paths it
# holds. It holds three, so the join has gaps: `docs`, `security/vex`
# and `slsa/spec-source-matrix.txt` are guarded on and held by nothing.
# Measured while classifying these legs for #704 and filed as #738,
# rather than asserted away here.
#
# A leg belongs in repo-audit.yml when its subject is a REPOSITORY'S OWN
# TREE — `git ls-files`, `.github/workflows/`, the lockfile. That test
# is what #681 and #704 applied: links, actions and action-pins were
# scheduled here, walked whatever tree they ran in, and so had only ever
# audited this one. They keep their jobs here as well, because this
# repository is also a repository: it does not call repo-audit.yml, so
# these are how its OWN tree is walked.
#
# audit:canon-pins stays here and is the one deliberate exception: it IS
# tree-local, and audit:org-pins performs the same check for every repo
# from this side, which is where someone looks (#310 finding 1).
---
name: audit

"on":
  schedule:
    # Mondays 06:00 UTC — after a weekend of link rot and repo drift.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  links:
    name: audit / links
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Check links
        run: mise run audit:links

  actions:
    name: audit / actions (online)
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Audit workflows online
        env:
          # zizmor's API-backed audits — impostor-commit,
          # known-vulnerable-actions, ref-confusion, typosquat-uses,
          # stale-action-refs — are skipped by the gate's --offline run and
          # would otherwise execute nowhere. The default token is enough:
          # they read public advisory and commit data.
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:actions

  action-pins:
    name: audit / action pin comments and age
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Verify pin comments and release age
        env:
          # pinact resolves each pinned SHA back to its tag to prove the
          # version comment tells the truth, and reads publish dates for
          # the release-age floor. Both are public reads, so the default
          # token suffices. The gate's offline leg (lint:action-pins)
          # cannot do either — it can only see that a comment exists.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run audit:action-pins

  lock-arch:
    name: audit / locked assets match the platform they name
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Verify each locked asset is built for the platform it names
        env:
          # Tree-local, and here for the reason links and action-pins are
          # here as well: this repository does not call repo-audit.yml,
          # so this job is how its OWN mise.lock is walked. The consumer
          # side is the matching leg in repo-audit.yml.
          #
          # The network half is a release listing — whether upstream
          # publishes a native asset for the platform at all, which is
          # what separates a defect from a package that only ever
          # shipped amd64. A public read; the default token serves.
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:lock-arch

  template-pins:
    name: audit / template pin staleness
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the staleness check diffs the pinned SHA..HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Check the template pins against shipped canon
        run: mise run audit:template-pins

  canon-pins:
    name: audit / canon pin freshness
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Check every canon reference against the latest canon tag
        # The alarm on the Renovate mechanism (#133): a paused or
        # misconfigured Renovate goes red here within a week instead of
        # silently costing a release its evidence (the v0.16.1 VSA).
        # The token is for the staleness-age lookup — a public read, but
        # `gh api` refuses to run tokenless in CI, and an unperformable
        # read once rendered as "over 24h" (#349 finding 11).
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:canon-pins

  org-pins:
    name: audit / org-wide canon pin freshness
    runs-on: ubuntu-24.04
    # Environment-scoped for the same reason drafts and baseline-drift
    # are: the token this needs is org-wide, and a secret referenced
    # repo-wide is drawable by any job anyone adds to any workflow here.
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Check every org repo's canon references from the canon
        env:
          # NOT github.token, and the difference is whether this walk
          # can answer at all: it lists the org, clones every member and
          # reads its tags, and the population contains a PRIVATE member
          # (#692). The default job token is entitled in THIS repository
          # alone — measured 2026-08-21, the listing it is served
          # returns 8 of the org's 9 repositories, omitting exactly the
          # private one, and an unauthenticated clone of that member
          # exits 128. The task's population guard then trips ("token
          # sees 8 repos, population is 9") and this leg is
          # CANNOT_JUDGE every Monday — honest, per #730, but never
          # green. What the token must be able to do is Contents: read
          # on EVERY member of the population, private ones included;
          # AUDIT_TOKEN is the org-wide fine-grained PAT this workflow
          # already carries for reads the public view cannot serve, and
          # is set to All repositories (#749).
          #
          # Red means a consumer's canon references have been catchable
          # for over a day and Renovate has not caught them — the alarm
          # audit:canon-pins can only raise inside the lagging repo
          # itself, raised here where someone looks (#310 finding 1).
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: mise run audit:org-pins

  biome-rules:
    name: audit / biome nursery coverage
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Check biome's nursery rules against the ones the org names
        # `preset: "all"` excludes nursery and there is no bulk switch, so
        # the config names each rule. A rule REMOVED upstream reddens the
        # gate on its own (biome rejects unknown keys); a rule ADDED is
        # silent, and this is the only thing that looks.
        run: mise run audit:biome-rules

  blast-radius:
    name: audit / advisory blast radius
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Walk every published SBOM and report the blast radius
        env:
          # Release enumeration and asset download across org repos; the
          # default token reads public releases. Red means a NEW,
          # UNDECIDED advisory (no VEX in security/vex/), a failed asset
          # verification, an unreadable SBOM, or a missed canary — the
          # decided findings are in the summary, not the failure.
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:blast-radius

  attestation-coverage:
    name: audit / attestation coverage
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Prove nothing ships unattested
        env:
          # Release and package enumeration plus attestation-store reads
          # across org repos; the default token reads public data. Red
          # means an artifact shipped without its evidence set — a
          # missing SBOM asset, class bundle, continuous-digest
          # attestation, or base-image approval (#117).
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:attestations

  actions-allowlist:
    name: audit / actions allowlist drift
    runs-on: ubuntu-24.04
    # Same environment discipline as repo-settings drift, and for the
    # same reason: `orgs/{org}/actions/permissions/selected-actions` is
    # an org-scoped read the default job token CANNOT perform. The old
    # comment here claimed the opposite, and the leg spent its CI life
    # comparing the belt against `null` — asserting drift that did not
    # exist and equally ready to assert clean that was not measured
    # (#349 finding 10). A leg's token must be able to perform its read,
    # or its only honest output is "I could not read".
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Reconcile the belt's allowlist with the live org setting
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: mise run audit:actions-allowlist

  signer-surface:
    name: audit / signing surface vs live callers
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Reconcile the declared surface with the signer and its callers
        # #349 S5: a signing capability with no live caller reddens here
        # instead of waiting a year for an audit to read the file. The
        # signer repo is public; the default token reads it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:signer-surface

  adoption:
    name: audit / obligation adoption across the org
    runs-on: ubuntu-24.04
    # Environment-scoped for the same reason drafts and baseline-drift
    # are: the token this needs is org-wide, and a secret referenced
    # repo-wide is drawable by any job anyone adds to any workflow here.
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Enumerate the population against the required stub set
        # #349 S7, the #266 rule for every obligation: a repo missing a
        # stub with no opt-out row is a red, never a silence.
        env:
          # NOT github.token: this reconciles the roster against the org
          # listing by name in both directions and then reads every
          # member's .github/workflows and tags, and the population
          # contains a PRIVATE member (#692). The default job token is
          # entitled in THIS repository alone — measured 2026-08-21, the
          # listing it is served returns 8 of the org's 9 repositories,
          # omitting exactly the private one, and contents reads on that
          # member are 404. A roster member the listing does not confirm
          # is reported ABSENT and never walked, so the leg reds every
          # Monday on the credential rather than answering anything
          # about that member's adoption. What the token must be able to
          # do is Contents: read on EVERY member of the population,
          # private ones included; AUDIT_TOKEN is the org-wide
          # fine-grained PAT this workflow already carries for reads the
          # public view cannot serve, and is set to All repositories
          # (#749).
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: mise run audit:adoption

  citations:
    name: audit / docs citations resolve
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Resolve every version and run citation in docs/
        # #349 finding 2: the docs cited a tag that never existed and it
        # survived two audits — a citation is a claim about the record,
        # so it gets checked like one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:citations

  source-vsa:
    name: audit / source chain coverage
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Walk every founded chain and verify each link
        env:
          # Repo enumeration only; history, notes and Sigstore bundles
          # are public. Red means a hole or a link that fails the
          # published root of trust (#207).
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:source-vsa

  release-tags:
    name: audit / release tags
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Check every org release tag against the signing epoch
        # #349 S4. The task shipped with #353 and docs already cite it as
        # enforcing the epoch forward, but nothing scheduled it — a check
        # no workflow runs is a check nobody runs (#354). Repo
        # enumeration only; tags, notes and Sigstore bundles are public.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:release-tags

  drafts:
    name: audit / draft releases explain themselves
    runs-on: ubuntu-24.04
    # Environment-scoped for the same reason baseline-drift is: the token
    # this needs is org-wide, and a secret referenced repo-wide is
    # drawable by any job anyone adds to any workflow here.
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
      # NOT github.token, and the difference is the audit: GitHub serves
      # draft releases only to entitled identities, and the default token
      # is entitled in THIS repository alone — every other repo's drafts
      # would come back as an empty list with a 200. AUDIT_TOKEN is the
      # org-wide fine-grained PAT this workflow already carries for reads
      # the public view cannot serve.
      #
      # The task does not take that on trust. Before believing any
      # listing it creates an ephemeral draft in this repository, asserts
      # it comes back in the same listing, and deletes it (#604) — the
      # grant it needs for that is Contents: read AND write on the
      # audited repos: read to see drafts at all, write to make the one
      # draft that proves the read. The measured grant, not the
      # documented one, is what this task now depends on; the documented
      # one is how it came to report zero against thirty-two.
      #
      # What the probe proves is the grant of ONE token, so the token
      # here must be one whose permissions are uniform across the org.
      # A fine-grained org-wide PAT is; github.token — capable in its
      # own repository and nowhere else — would pass the probe here and
      # then walk the other three repos blind. That is the contract, and
      # it is the reason this line names a secret rather than a default.
      GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Check every draft release for its record
        run: mise run audit:drafts

  spec-drift:
    name: audit / spec drift
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Compare the live SLSA source matrix with the pinned snapshot
        # Same gap as release-tags: slsa/requirements.toml names this task
        # as what compares it against upstream, and nothing ran it. The
        # spec page is fetched anonymously; no token needed.
        run: mise run audit:spec-drift

  caller-permissions:
    name: audit / caller permissions
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Check every consumer grant against canon HEAD's requirements
        # Seam 2 of #358, org-wide half: a consumer whose uses: grant is
        # below what a callee's jobs ask for dies as startup_failure on
        # its next pin bump, and Renovate bumps the SHA without touching
        # the stub body. A finding is a forecast, not an outage. Public
        # workflow files only; the default token reads them.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:caller-permissions

  badges:
    name: audit / badge truth
    runs-on: ubuntu-24.04
    permissions:
      contents: read # README and .badge-states reads across org repos
      # The anonymous REST endpoint 401s even for public containers
      # (#316 addendum C, measured), so the existence check needs auth.
      packages: read # the ghcr leg asks whether the named package exists
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          cache: false

      - name: Re-check every shield against its source of truth
        env:
          # README reads across org repos; the default token reads
          # public content plus (packages: read) the container-package
          # existence checks. Red means a shield asserting something
          # its issuer no longer says (#215) — a score below its floor,
          # a lost baseline, a non-compliant REUSE status, a package or
          # workflow shield over nothing, a fair-software dot the
          # evidence contradicts, a badge block not machine-rendered,
          # or a shield nothing here checks (#316 finding 5).
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:badges

  baseline-drift:
    name: audit / repo settings drift
    runs-on: ubuntu-24.04
    # The secret lives in this environment, not repo-wide: an org-admin
    # token referenced ambiently is drawable by any job anyone adds to
    # any workflow here; scoped to the environment, only jobs that
    # declare it are ever issued the secret (zizmor secrets-outside-env,
    # the audit persona's one standing finding).
    environment: audit
    permissions:
      contents: read
    env:
      # The default token sees only the public view of repo metadata.
      # AUDIT_TOKEN is a fine-grained PAT (all org repos, Administration:
      # read AND write — the merge-settings fields in GET /repos are only
      # returned to push/admin-capable identities, and the fine-grained
      # read-only grant does not qualify; verified empirically 2026-08-09).
      # It also carries Contents: read AND write, which this job does not
      # need and the drafts job cannot work without (#604) — do not narrow
      # the token to what this one line describes.
      GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
      # Fine-grained PATs offer no Packages permission (measured
      # 2026-08-12), so the org-packages visibility check carries its own
      # minimal classic PAT: read:packages, nothing else.
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every repo against the baseline
        run: ./settings/repo-baseline.sh check
...
