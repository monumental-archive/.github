# Release phase 2, org canon: the orchestrator. A versioned repository's
# entire phase-2 obligation is one file holding one `uses:` line:
#
#   # .github/workflows/publish.yml — the filename is canon, see below
#   jobs:
#     publish:
#       uses: monumental-archive/.github/.github/workflows/publish.yml@<sha> # vX.Y.Z
#       with:
#         classes: rust-crate
#
# THE FILENAME IS LOAD-BEARING. Both crates.io and npm pin the *caller's*
# entry workflow filename, taken from the `workflow_ref` claim — never
# `job_workflow_ref`. Renaming a caller's publish.yml breaks trusted
# publishing with nothing local going red. See docs/slsa-reference.md.
#
# The step order below is not rearrangeable, and it lives here rather than
# in each caller precisely so that it cannot be rearranged:
#
#   build -> smoke test -> push -> pull the published bytes back and prove
#   them -> attest -> verify as a stranger would -> publish the release
#
# The reusable workflows below are referenced relatively (`./`). Measured
# in the lab: a relative reference resolves against THIS repository, at the
# SAME COMMIT the caller pinned — not against the caller, and not against
# this repository's default branch. So one caller SHA pins the orchestrator,
# every build workflow, the verifier and the attach step atomically. That
# property is why there is no self-referential SHA to bootstrap.
#
# capability-boundary: the `sign` job below declares `id-token: write`,
# but this file runs no steps of its own — every job here is a `uses:`.
# The grant exists solely to be passed down to `signer`, which is the only
# place it is spent, and no job in this file that runs caller code holds
# it: `build` gets `contents: read` and nothing more. The belt lint is
# file-scoped rather than job-scoped, so this exception is written down
# rather than assumed.
#
# `uses:` accepts no expressions — GitHub's context-availability table lists
# no contexts for `jobs.<job_id>.uses` — so classes are dispatched by an
# `if:` per job rather than by interpolating the input into a path.
name: publish

on:
  workflow_call:
    inputs:
      classes:
        description: >
          Artifact classes, comma-separated. One shared build workflow per
          class; callers declare inputs, not steps.

          A repository may need several in one release and most do:
          iiif-server ships an OCI image AND musl/macOS binaries while
          publishing no crates at all, and edtf publishes crates, a
          binary, an image and a wasm package. A scalar here would have
          forced such a repository back into writing its own steps, which
          is the thing this design exists to prevent.

          `workflow_call` inputs are only string, boolean or number — there
          is no list type — so this is a string and the jobs below gate on
          `contains()`. A class that is not implemented fails the guard
          rather than silently publishing nothing.
        required: true
        type: string
      dry-run:
        description: >
          Rehearsal. Build, package, sign and attach, but exchange no
          registry token, upload nothing to a registry, and leave the
          release a draft. The verifier proves the packaged bytes against
          themselves rather than against the registry, so the shape of the
          run is identical and only the irreversible steps are absent.
          This is how the release lab exercises the chain, and how a
          production repository rehearses before its first real release.
        required: false
        type: boolean
        default: false
      dockerfile:
        description: Dockerfile path, for the oci-image class.
        required: false
        type: string
        default: Dockerfile
      context:
        description: Build context, for the oci-image class.
        required: false
        type: string
        default: "."
      smoke-test:
        description: >
          Executable proving the image does its one job, for the oci-image
          class. Run on the loaded image before anything is published, and
          again on the bytes pulled back from the registry.
        required: false
        type: string
        default: ""
      binary-targets:
        description: >
          Target subset for the rust-binary class; defaults to the canon
          four. The build's plan job refuses anything outside canon.
        required: false
        type: string
        default: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin
      binary-smoke-test:
        description: >
          Executable proving a built binary does its one job, for the
          rust-binary class. Receives the staged-binaries directory and the
          target triple; runs on every leg, on that leg's own hardware.
        required: false
        type: string
        default: ""
      crate-dir:
        description: Directory of the wasm crate, for the wasm-npm class.
        required: false
        type: string
        default: "."
      exclude:
        description: >
          Comma-separated workspace members the rust-crate and rust-binary
          classes must not touch — the pgrx-extension crate above all.
        required: false
        type: string
        default: ""
      npm-scope:
        description: npm scope (without the @), for the wasm-npm class.
        required: false
        type: string
        default: ""
      extension-crate-dir:
        description: >
          Directory of the extension crate, for the pgrx-extension class.
          Required when the class is requested (its build refuses to guess
          which crate is the extension).
        required: false
        type: string
        default: ""
      pg-majors:
        description: PG majors for the pgrx-extension class.
        required: false
        type: string
        default: 14,15,16,17,18
      extension-smoke-test:
        description: >
          Executable proving the packaged extension does its one job, for
          the pgrx-extension class. Runs inside stock postgres containers
          of both supported distros, per cell.
        required: false
        type: string
        default: ""
      sbom-basename:
        description: >
          Basename for the SPDX SBOM release asset. The asset must be named
          `<something>.spdx.json`: Scorecard's SBOM check matches
          `.+\.(…|spdx.json|…)`, so a bare `spdx.json` scores nothing and
          an SBOM that never reaches a release asset caps the check at 5.
          Defaults to the caller's repository name.
        required: false
        type: string
        default: ""
      mint-doi:
        description: >
          Mint a Zenodo version DOI after the release publishes. Needs the
          zenodo-token secret. The DOI comes last of all — after proof,
          after publish — like everything else.
        required: false
        type: boolean
        default: false
      zenodo-base-url:
        description: Zenodo instance; the lab passes the sandbox.
        required: false
        type: string
        default: https://zenodo.org
    secrets:
      app-private-key:
        description: Tag-mint App private key, for publishing the release
        required: true
      zenodo-token:
        description: Zenodo token (deposit:write + deposit:actions); only with mint-doi
        required: false
    outputs:
      version:
        description: The version published, without the leading v.
        value: ${{ jobs.guard.outputs.version }}

permissions: {}

jobs:
  # Nothing runs until the ref is proven to be a tag. A publish dispatched
  # from a branch would attest a moving pointer, and Sigstore is
  # append-only: that mistake is permanent, and it has already happened
  # once in this organisation's history.
  guard:
    name: Refuse anything that is not a release tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check the ref and the class
        id: check
        env:
          UNTRUSTED_CLASSES: ${{ inputs.classes }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::publish runs on v* tags only, got ${GITHUB_REF}"
            echo "::error::dispatching from a branch would attest a moving pointer"
            exit 1
          fi
          IFS=',' read -ra requested <<< "${UNTRUSTED_CLASSES// /}"
          if ((${#requested[@]} == 0)); then
            echo "::error::no classes requested — a release that builds nothing is not a release"
            exit 1
          fi
          for c in "${requested[@]}"; do
            case "${c}" in
              rust-crate | oci-image | rust-binary | wasm-npm | pgrx-extension) ;;
              *)
                echo "::error::unknown class requested"
                exit 1
                ;;
            esac
          done
          version="${GITHUB_REF#refs/tags/v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "::notice::publishing ${#requested[@]} class(es) at version ${version}"

  build:
    name: Build
    needs: guard
    if: contains(inputs.classes, 'rust-crate')
    uses: ./.github/workflows/build-rust-crate.yml
    permissions:
      # Restated, not inherited. A `uses:` job with no `permissions:` block
      # takes the WORKFLOW-level default — which is `permissions: {}` above
      # — and not the caller's grant. The callee then requests more than
      # its calling job holds, which is an elevation, and the whole run
      # dies as startup_failure with no jobs and no log. Measured; every
      # `uses:` job below therefore restates exactly what its callee needs.
      contents: read # checkout of the caller
      id-token: write # crates.io trusted publishing, in the publish job
    with:
      version: ${{ needs.guard.outputs.version }}
      exclude: ${{ inputs.exclude }}
      dry-run: ${{ inputs.dry-run }}

  build-oci:
    name: Build image
    needs: guard
    if: contains(inputs.classes, 'oci-image')
    uses: ./.github/workflows/build-oci-image.yml
    permissions:
      # Restated, not inherited — see the note on `build` above.
      contents: read # checkout of the caller
      packages: write # push per-arch images and the manifest list
    with:
      version: ${{ needs.guard.outputs.version }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      smoke-test: ${{ inputs.smoke-test }}
      dry-run: ${{ inputs.dry-run }}

  # An image subject is a different shape from a file one, and sign.yml
  # takes exactly one — so a repository shipping both classes signs twice,
  # under the same identity, rather than mixing unrelated subjects into one
  # certificate.
  sign-image:
    name: Sign image
    needs: build-oci
    if: ${{ contains(inputs.classes, 'oci-image') && !inputs.dry-run }}
    uses: monumental-archive/signer/.github/workflows/sign.yml@40ada01b4f6cdce65fe8e1edcacac83bea4473a4 # main
    with:
      image-name: ${{ needs.build-oci.outputs.image }}
      image-digest: ${{ needs.build-oci.outputs.digest }}
      bundle-artifact: attestation-bundle-image
    permissions:
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record

  # Runs no caller code, so it can hold the writes the build job must not.
  # It pulls the published bytes back and hashes them: the attested subject
  # is what shipped, not what we hoped shipped.
  verify:
    name: Verify published bytes
    needs: [guard, build]
    if: contains(inputs.classes, 'rust-crate')
    uses: ./.github/workflows/verify-published.yml
    permissions:
      contents: read # the verifier holds no more than this
    with:
      subjects: ${{ needs.build.outputs.subjects }}
      dry-run: ${{ inputs.dry-run }}

  # The signer never sees artifact bytes, only digests, and holds the only
  # `id-token: write` in the release path.
  sign:
    name: Sign
    needs: verify
    if: contains(inputs.classes, 'rust-crate')
    uses: monumental-archive/signer/.github/workflows/sign.yml@40ada01b4f6cdce65fe8e1edcacac83bea4473a4 # main
    with:
      subjects: ${{ needs.verify.outputs.subjects }}
      bundle-artifact: attestation-bundle-crates
    permissions:
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record

  build-binary:
    name: Build binaries
    needs: guard
    if: contains(inputs.classes, 'rust-binary')
    uses: ./.github/workflows/build-rust-binary.yml
    permissions:
      # Restated, not inherited — see the note on `build` above.
      contents: read # checkout of the caller; binaries touch no registry
    with:
      version: ${{ needs.guard.outputs.version }}
      targets: ${{ inputs.binary-targets }}
      smoke-test: ${{ inputs.binary-smoke-test }}
      exclude: ${{ inputs.exclude }}

  # Binaries have no registry to pull back from: they become release
  # assets, and GitHub's own release attestation binds tag, commit and
  # asset digests at publish. The subjects signed are the archives the
  # attach job uploads — the same bytes, proven by the collect job's
  # refuse-a-partial-set guard.
  sign-binaries:
    name: Sign binaries
    needs: build-binary
    if: contains(inputs.classes, 'rust-binary')
    uses: monumental-archive/signer/.github/workflows/sign.yml@40ada01b4f6cdce65fe8e1edcacac83bea4473a4 # main
    with:
      subjects: ${{ needs.build-binary.outputs.subjects }}
      bundle-artifact: attestation-bundle-binaries
    permissions:
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record

  build-wasm:
    name: Build wasm package
    needs: guard
    if: contains(inputs.classes, 'wasm-npm')
    uses: ./.github/workflows/build-wasm-npm.yml
    permissions:
      # Restated, not inherited — see the note on `build` above.
      contents: read # checkout of the caller
      id-token: write # npm trusted publishing, in the publish job
    with:
      version: ${{ needs.guard.outputs.version }}
      crate-dir: ${{ inputs.crate-dir }}
      npm-scope: ${{ inputs.npm-scope }}
      dry-run: ${{ inputs.dry-run }}

  verify-wasm:
    name: Verify published wasm bytes
    needs: build-wasm
    if: contains(inputs.classes, 'wasm-npm')
    uses: ./.github/workflows/verify-published.yml
    permissions:
      contents: read # the verifier holds no more than this
    with:
      subjects: ${{ needs.build-wasm.outputs.subjects }}
      npm-package: ${{ needs.build-wasm.outputs.package }}
      dry-run: ${{ inputs.dry-run }}

  sign-wasm:
    name: Sign wasm package
    needs: verify-wasm
    if: contains(inputs.classes, 'wasm-npm')
    uses: monumental-archive/signer/.github/workflows/sign.yml@40ada01b4f6cdce65fe8e1edcacac83bea4473a4 # main
    with:
      subjects: ${{ needs.verify-wasm.outputs.subjects }}
      bundle-artifact: attestation-bundle-npm
    permissions:
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record

  build-extension:
    name: Build extension
    needs: guard
    if: contains(inputs.classes, 'pgrx-extension')
    uses: ./.github/workflows/build-pgrx-extension.yml
    permissions:
      # Restated, not inherited — see the note on `build` above.
      contents: read # checkout of the caller; tarballs touch no registry
    with:
      version: ${{ needs.guard.outputs.version }}
      crate-dir: ${{ inputs.extension-crate-dir }}
      pg-majors: ${{ inputs.pg-majors }}
      smoke-test: ${{ inputs.extension-smoke-test }}

  sign-extensions:
    name: Sign extension tarballs
    needs: build-extension
    if: contains(inputs.classes, 'pgrx-extension')
    uses: monumental-archive/signer/.github/workflows/sign.yml@40ada01b4f6cdce65fe8e1edcacac83bea4473a4 # main
    with:
      subjects: ${{ needs.build-extension.outputs.subjects }}
      bundle-artifact: attestation-bundle-extensions
    permissions:
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record

  # The artifact images assemble from the SAME tarballs the signer just
  # attested — one byte path — and each per-major index gets its own
  # signature under the same identity.
  build-extension-images:
    name: Build extension images
    needs: [guard, build-extension]
    if: contains(inputs.classes, 'pgrx-extension')
    uses: ./.github/workflows/build-pgrx-images.yml
    permissions:
      # Restated, not inherited — see the note on `build` above.
      contents: read # checkout of canon for the Dockerfile and mapping
      packages: write # push the per-major indexes
    with:
      version: ${{ needs.guard.outputs.version }}
      crate-dir: ${{ inputs.extension-crate-dir }}
      pg-majors: ${{ inputs.pg-majors }}
      dry-run: ${{ inputs.dry-run }}

  sign-extension-images:
    name: Sign extension image pg${{ matrix.pg }}
    needs: build-extension-images
    if: ${{ contains(inputs.classes, 'pgrx-extension') && !inputs.dry-run }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-extension-images.outputs.images) }}
    uses: monumental-archive/signer/.github/workflows/sign.yml@40ada01b4f6cdce65fe8e1edcacac83bea4473a4 # main
    with:
      image-name: ${{ matrix.image }}
      image-digest: ${{ matrix.digest }}
      bundle-artifact: attestation-bundle-extimg-pg${{ matrix.pg }}
    permissions:
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record

  # Last, and only on proof. Attaches the evidence bundle and publishes the
  # draft — the first moment anything becomes public.
  #
  # Fan-in, by construction: `needs` names every sign job, the `if` demands
  # that nothing upstream failed AND that every REQUESTED class delivered
  # its signature (dry-run excuses the classes whose signer legitimately
  # skipped). A skipped class never blocks; a failed or missing one always
  # does. Assets and bundles travel as `release-*` / `attestation-bundle-*`
  # artifacts, so attach needs no per-class inputs and a fifth class is one
  # more job above, not a contract change here.
  attach:
    name: Attach evidence and publish
    needs: [guard, sign, sign-image, sign-binaries, sign-wasm, sign-extensions, sign-extension-images]
    if: >-
      ${{
        !cancelled() && needs.guard.result == 'success'
        && !contains(join(needs.*.result, ','), 'failure')
        && (!contains(inputs.classes, 'rust-crate') || needs.sign.result == 'success')
        && (!contains(inputs.classes, 'oci-image') || needs.sign-image.result == 'success' || inputs.dry-run)
        && (!contains(inputs.classes, 'rust-binary') || needs.sign-binaries.result == 'success')
        && (!contains(inputs.classes, 'wasm-npm') || needs.sign-wasm.result == 'success')
        && (!contains(inputs.classes, 'pgrx-extension') || (needs.sign-extensions.result == 'success' && (needs.sign-extension-images.result == 'success' || inputs.dry-run)))
      }}
    uses: ./.github/workflows/attach-release.yml
    permissions: {} # it publishes with the App token, not GITHUB_TOKEN
    with:
      version: ${{ needs.guard.outputs.version }}
      sbom-basename: ${{ inputs.sbom-basename }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      app-private-key: ${{ secrets.app-private-key }}

  # The DOI comes last of all: it cites a release that is already public,
  # proven and signed. Skipped on dry-run (a rehearsal must cite nothing).
  doi:
    name: Mint the version DOI
    needs: [guard, attach]
    # !cancelled() + explicit attach check: the implicit success() looks
    # THROUGH attach to its legitimately-skipped class ancestors and goes
    # false — the same transitive quirk attach's own condition exists for.
    # Measured on v0.14.2, where everything succeeded and doi skipped.
    if: ${{ !cancelled() && needs.attach.result == 'success' && inputs.mint-doi && !inputs.dry-run }}
    uses: ./.github/workflows/mint-doi.yml
    permissions:
      contents: read # the minting job downloads the released source
    with:
      version: ${{ needs.guard.outputs.version }}
      base-url: ${{ inputs.zenodo-base-url }}
    secrets:
      zenodo-token: ${{ secrets.zenodo-token }}
