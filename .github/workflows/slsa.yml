# The canon's SLSA checks across the org — scheduled, network-touching,
# and named for what a red means: the org's SLSA evidence does not hold
# (#1884). Failures page via the Actions UI and notifications rather
# than blocking merges.
#
# These legs, and those of org-settings.yml, pins-and-belt.yml and
# badges.yml, were one workflow named `audit` until #1884; a red read
# "Run failed: audit" and could be any of eighteen. Each file is now one
# subject, and each job is named for the fact that holds when it is
# green.
#
# WHAT BELONGS IN THESE FOUR RATHER THAN IN THE repo-*.yml SUBJECT
# WORKFLOWS, stated once here because a leg landing on the wrong side
# of it is invisible from inside the canon (#704). A leg belongs on
# this side when its subject is the ORG or a CANON-OWNED artefact: it
# enumerates the population (adoption, org-pins, drafts, release-tags,
# signer-surface, caller-permissions, source-vsa, attestations,
# blast-radius, badges), reads an org setting (actions-allowlist,
# security-config), or reads something only this repository holds —
# the belt's own config (biome-rules), the workflow templates
# (template-pins), the pinned SLSA matrix (spec-drift). Those guard on
# a canon-owned artefact, and lint:canon-policy (#579) is the join that
# stops a deleted one turning them into silent skips — for the paths it
# holds. It holds three, so the join has gaps: `docs`, `security/vex`
# and `slsa/spec-source-matrix.txt` are guarded on and held by nothing.
# Measured while classifying these legs for #704 and filed as #738,
# rather than asserted away here.
#
# A leg belongs in a repo-*.yml subject workflow (repo-dependencies,
# repo-deep-tests, repo-public-api, repo-records, repo-own-audits) when
# its subject is a REPOSITORY'S OWN TREE — `git ls-files`,
# `.github/workflows/`, the lockfile. That test is what #681 and #704
# applied: links, actions and action-pins were scheduled here, walked
# whatever tree they ran in, and so had only ever audited this one. This
# repository is also a repository, and its own tree is walked by
# calling those same workflows from self-dependencies.yml,
# self-deep-tests.yml and self-records.yml (#1858), never by a second
# copy of their jobs here.
---
name: slsa

"on":
  schedule:
    # Mondays 07:00 UTC, once, beside org-settings.yml, pins-and-belt.yml,
    # badges.yml and the canon's records (#1888). These legs ran in two
    # groups ninety minutes apart until 2026-11-21, for an API budget
    # measured on 2026-11-14 (#1169) that stele#384 then took away: it
    # moved both git-history walks off the REST API to one `git fetch`.
    # Measured 2026-11-21, both groups dispatched back to back on main at
    # 1bed67d7 inside 33 minutes, on one App installation, beside those
    # four workflows dispatched at the same time:
    #
    #   job                                         2026-11-14  2026-11-21
    #   every release has its evidence set          22m31s      27m, green
    #   every source chain link verifies            15m53s      1m26s, PASS
    #   every release tag is inside the signing     2m54s,      49s, green
    #     epoch                                     incomplete
    #   no published SBOM carries an undecided      7m16s       5m51s, green
    #     advisory
    #
    # (runs 44920569773 and 44921606612). No job's log in either run
    # carries a 403, a 429, a rate-limit message, a retry or a
    # CANNOT_JUDGE. A throttled leg ends CANNOT_JUDGE by name.
    - cron: 0 7 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  attestation-coverage:
    name: every release has its evidence set
    runs-on: ubuntu-26.04
    # Environment-scoped, like org-pins: this leg walks the POPULATION,
    # which has a private member, and the default token is served a
    # listing without it — so the population guard trips and the leg is
    # CANNOT_JUDGE every Monday (#803, #1142).
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the audit App's read token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          # Read, and only what the walks read: releases, tags and
          # trees; the attestation store; review history. Named here so
          # the token cannot widen when the App's own grants do.
          permission-contents: read
          permission-metadata: read
          permission-attestations: read
          permission-pull-requests: read
          # Every repository in the installation, on purpose: the
          # subject of these walks IS the population.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Prove nothing ships unattested
        env:
          # Release and package enumeration plus attestation-store reads
          # across org repos, the private member included. Red
          # means an artifact shipped without its evidence set — a
          # missing SBOM asset, class bundle, continuous-digest
          # attestation, or base-image approval (#117).
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: mise run audit:attestations

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  signer-surface:
    name: every signing capability has a live caller
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Reconcile the declared surface with the signer and its callers
        # #349 S5: a signing capability with no live caller reddens here
        # instead of waiting a year for an audit to read the file. The
        # signer repo is public; the default token reads it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:signer-surface

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  caller-permissions:
    name: every caller grants what the canon's workflows ask
    runs-on: ubuntu-26.04
    # Environment-scoped, like org-pins: this leg walks the POPULATION,
    # which has a private member, and the default token is served a
    # listing without it — so the population guard trips and the leg is
    # CANNOT_JUDGE every Monday (#803, #1142).
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the audit App's read token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          # Read, and only what the walks read: releases, tags and
          # trees; the attestation store; review history. Named here so
          # the token cannot widen when the App's own grants do.
          permission-contents: read
          permission-metadata: read
          permission-attestations: read
          permission-pull-requests: read
          # Every repository in the installation, on purpose: the
          # subject of these walks IS the population.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Check every consumer grant against canon HEAD's requirements
        # Seam 2 of #358, org-wide half: a consumer whose uses: grant is
        # below what a callee's jobs ask for dies as startup_failure on
        # its next pin bump, and Renovate bumps the SHA without touching
        # the stub body. A finding is a forecast, not an outage. Reads
        # every consumer's workflow files, the private member's too.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: mise run audit:caller-permissions

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  spec-drift:
    name: the pinned SLSA source matrix matches upstream
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Compare the live SLSA source matrix with the pinned snapshot
        # Same gap as release-tags: slsa/requirements.toml names this task
        # as what compares it against upstream, and nothing ran it. The
        # spec page is fetched anonymously; no token needed.
        run: mise run audit:spec-drift

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  drafts:
    name: every draft release has its record
    runs-on: ubuntu-26.04
    # Environment-scoped for the same reason baseline-drift is: the token
    # this needs is org-wide, and a secret referenced repo-wide is
    # drawable by any job anyone adds to any workflow here.
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
      # NOT github.token, and the difference is the audit: GitHub serves
      # draft releases only to entitled identities, and the default token
      # is entitled in THIS repository alone — every other repo's drafts
      # would come back as an empty list with a 200. AUDIT_TOKEN is the
      # org-wide fine-grained PAT this workflow already carries for reads
      # the public view cannot serve.
      #
      # The task does not take that on trust. Before believing any
      # listing it creates an ephemeral draft in this repository, asserts
      # it comes back in the same listing, and deletes it (#604) — the
      # grant it needs for that is Contents: read AND write on the
      # audited repos: read to see drafts at all, write to make the one
      # draft that proves the read. The measured grant, not the
      # documented one, is what this task now depends on; the documented
      # one is how it came to report zero against thirty-two.
      #
      # What the probe proves is the grant of ONE token, so the token
      # here must be one whose permissions are uniform across the org.
      # A fine-grained org-wide PAT is; github.token — capable in its
      # own repository and nowhere else — would pass the probe here and
      # then walk the other three repos blind. That is the contract, and
      # it is the reason this line names a secret rather than a default.
      GH_TOKEN: ${{ secrets.AUDIT_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Check every draft release for its record
        run: mise run audit:drafts

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  source-vsa:
    name: every source chain link verifies
    runs-on: ubuntu-26.04
    # Environment-scoped, like org-pins: this leg walks the POPULATION,
    # which has a private member, and the default token is served a
    # listing without it — so the population guard trips and the leg is
    # CANNOT_JUDGE every Monday (#803, #1142).
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the audit App's read token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          # Read, and only what the walks read: releases, tags and
          # trees; the attestation store; review history. Named here so
          # the token cannot widen when the App's own grants do.
          permission-contents: read
          permission-metadata: read
          permission-attestations: read
          permission-pull-requests: read
          # Every repository in the installation, on purpose: the
          # subject of these walks IS the population.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Walk every founded chain and verify each link
        env:
          # Enumerates the population, private member included; history,
          # notes and Sigstore bundles are public. Red means a hole or a link that fails the
          # published root of trust (#207).
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: mise run audit:source-vsa

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  release-tags:
    name: every release tag is inside the signing epoch
    runs-on: ubuntu-26.04
    # Environment-scoped, like org-pins: this leg walks the POPULATION,
    # which has a private member, and the default token is served a
    # listing without it — so the population guard trips and the leg is
    # CANNOT_JUDGE every Monday (#803, #1142).
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the audit App's read token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          # Read, and only what the walks read: releases, tags and
          # trees; the attestation store; review history. Named here so
          # the token cannot widen when the App's own grants do.
          permission-contents: read
          permission-metadata: read
          permission-attestations: read
          permission-pull-requests: read
          # Every repository in the installation, on purpose: the
          # subject of these walks IS the population.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Check every org release tag against the signing epoch
        # #349 S4. The task shipped with #353 and docs already cite it as
        # enforcing the epoch forward, but nothing scheduled it — a check
        # no workflow runs is a check nobody runs (#354). Enumerates
        # the population, private member included; the tags, notes and
        # Sigstore bundles it then reads are public.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: mise run audit:release-tags

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  blast-radius:
    name: no published SBOM carries an undecided advisory
    runs-on: ubuntu-26.04
    # Environment-scoped, like org-pins: this leg walks the POPULATION,
    # which has a private member, and the default token is served a
    # listing without it — so the population guard trips and the leg is
    # CANNOT_JUDGE every Monday (#803, #1142).
    # The token is the audit App's, not AUDIT_TOKEN (#1169): this is
    # one of five legs that only READ and that cost hundreds or
    # thousands of requests, and a personal token shares its hour with
    # every repo's source attestation. The legs still on AUDIT_TOKEN
    # are the cheap ones (under 30 requests each) and the two that
    # need a WRITE grant the App is deliberately not given.
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the audit App's read token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          # Read, and only what the walks read: releases, tags and
          # trees; the attestation store; review history. Named here so
          # the token cannot widen when the App's own grants do.
          permission-contents: read
          permission-metadata: read
          permission-attestations: read
          permission-pull-requests: read
          # Every repository in the installation, on purpose: the
          # subject of these walks IS the population.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Walk every published SBOM and report the blast radius
        env:
          # Release enumeration and asset download across org repos, the
          # private member included. Red means a NEW,
          # UNDECIDED advisory (no VEX in security/vex/), a failed asset
          # verification, an unreadable SBOM, or a missed canary — the
          # decided findings are in the summary, not the failure.
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: mise run audit:blast-radius

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887), with one issue per red
  # job (#1966): for each red job of a run on the default branch, one
  # issue titled "red: <job> (<workflow>)" and labelled red-check holds
  # its findings and each red leg's log tail; the next run with every
  # leg green or skipped closes it. mise/standing_issue.py has the
  # outcomes. Only `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - attestation-coverage
      - signer-surface
      - caller-permissions
      - spec-drift
      - drafts
      - source-vsa
      - release-tags
      - blast-radius
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # each red job's red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
