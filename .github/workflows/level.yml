# One repository's measured levels, judged and published by that
# repository (#554).
#
# Called by a repository's own `level` stub
# (`workflow-templates/level.yml`), which is where the repository says
# WHICH tracks it bears evidence on. A reusable workflow runs in the
# caller's context: `github.repository` is the caller, the token is the
# caller's, and `contents: write` is write on the CALLER's repository
# and nowhere else. That is the whole point of the per-repo model — a
# release moves its own badge without anything holding a capability in
# somebody else's repository, and the canon's Monday sweep
# (`level-assert.yml`) can be read-only because nothing here writes
# outside the repository being judged.
#
# THIS WORKFLOW EXECUTES NO CALLER CODE. The caller's tree is never
# checked out and nothing from it runs: the judge reads the forge, the
# attestation store and the published artifacts, and the only local
# inputs are the canon tree and one string of track names. It declares
# no `id-token: write` and mints nothing, so the capability boundary
# the signer split protects is not in play here at all.
#
# WHICH tracks is the caller's declaration and WHO is on the board is
# the canon's. The two meet here: the canon's `slsa/assert-policy.json`
# arrives with the canon tree and supplies the roster, the caller's
# `tracks` input supplies its own row, and every other member is zeroed
# to no tracks so this run judges exactly one repository. The roster is
# READ from the delivered canon rather than restated per repository —
# a second copy in four stubs would red all four the day the org gains
# a repository, and the delivery rule (#445) exists to make that
# unrepresentable.
#
# The narrowing is mechanical and carries no judgment: it edits
# membership and nothing else. Every determination — what a level is,
# what may replace what (stele#135), which cell leaves the board — is
# the engine's, exactly as it is in the sweep.
---
name: level

"on":
  workflow_call:
    inputs:
      tracks:
        # forwarding: universal
        description: >-
          The tracks this repository bears evidence on, space
          separated: any of `build`, `source`, `dependency`. Stated
          positively — a name that is not a track is refused by the
          engine at load rather than quietly narrowing the board.
        required: true
        type: string

permissions: {}

jobs:
  level:
    name: judge and publish this repository's levels
    runs-on: ubuntu-24.04
    permissions:
      # Write on the CALLER, which is the repository being judged, and
      # the only thing written is that repository's own levels branch.
      contents: write # pushes this repository's cells to its own levels branch
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.5
          cache: false

      - name: Declare this repository's population
        # The board form is the only form that carries stele#135's
        # never-overwrite rule, and it measures an organisation — so a
        # self-scoped run is the org roster with every other member
        # declared to bear no track. A one-member ROSTER cannot be
        # used: the engine reconciles the declaration against the
        # forge's listing in both directions and refuses a declaration
        # that does not account for a listed repository, which is the
        # right rule and not one to work around.
        #
        # Values reach bash through the environment, never through
        # `${{ }}` interpolation into a shell body.
        env:
          TRACKS: ${{ inputs.tracks }}
        run: |
          set -euo pipefail
          me="${GITHUB_REPOSITORY#*/}"
          policy=.org-canon/slsa/assert-policy.json
          if ! jq -e --arg me "${me}" \
            '.population.repositories | map(select(.repo == $me)) | length == 1' \
            "${policy}" > /dev/null; then
            echo "::error::${me} is not in the canon's declared population — the org has not said this"
            echo "::error::repository bears evidence, and a repository nobody declared publishes no levels"
            exit 1
          fi
          tracks=$(jq -cn --arg t "${TRACKS}" '$t | split("\\s+"; "") | map(select(length > 0))')
          declared=$(jq -r 'length' <<< "${tracks}")
          if [[ ${declared} -eq 0 ]]; then
            echo "::error::the level stub declared no tracks — state at least one of build, source, dependency"
            exit 1
          fi
          jq --arg me "${me}" --argjson tracks "${tracks}" '
            .population.repositories = [
              .population.repositories[]
              | if .repo == $me then
                  {repo: .repo, tracks: $tracks,
                   reason: "this repository declares its own tracks in its level stub"}
                else
                  {repo: .repo, tracks: [],
                   reason: "judged by its own level stub, onto its own levels branch"}
                end
            ]' "${policy}" > population-policy.json
          names=$(jq -r 'join(" ")' <<< "${tracks}")
          echo "level: judging ${me} on ${names}"
      - name: Fetch the previously published judgments
        # The engine decides what may replace what, and it can only do
        # that against what is already published — so the prior board
        # is the out-dir this run measures into. An absent branch is
        # the first run and not a fault.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p levels
          if git clone --quiet --depth 1 --single-branch --branch levels \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prior; then
            rm -rf prior/.git
            cp -R prior/. levels/
          else
            echo "level: no levels branch yet — this is the first publication"
          fi
      - name: Judge this repository
        # One line, because every decision in it belongs to the judge.
        # Exit 4 is the regression case and nothing else — a cell judged
        # before that cannot be judged now — and the good judgments are
        # published before the run goes red, which is the order the
        # canon's cron took for the same reason.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          stele level \
            --org "${GITHUB_REPOSITORY_OWNER}" \
            --out-dir levels \
            --policy population-policy.json || rc=$?
          if [[ ${rc} -ne 0 && ${rc} -ne 4 ]]; then
            echo "::error::stele level failed (exit ${rc}) — nothing published"
            exit "${rc}"
          fi
          echo "investigate=${rc}" >> "${GITHUB_ENV}"
      - name: Publish to this repository's levels branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd levels
          git init -q -b levels
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish measured levels" \
            -m "Rendered by stele level in ${GITHUB_REPOSITORY}; this repository judges itself."
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            levels:levels
          if [[ ${investigate} -ne 0 ]]; then
            echo "::error::a cell that was judged before cannot be judged now — investigate; good reports were not overwritten"
            exit 1
          fi
...
