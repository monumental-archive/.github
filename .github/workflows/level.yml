# One repository's measured levels, judged and published by that
# repository (#554).
#
# Called by a repository's own `level` stub
# (`workflow-templates/level.yml`), which is where the repository says
# WHICH tracks it bears evidence on. A reusable workflow runs in the
# caller's context: `github.repository` is the caller, the token is the
# caller's, and `contents: write` is write on the CALLER's repository
# and nowhere else. That is the whole point of the per-repo model — a
# release moves its own badge without anything holding a capability in
# somebody else's repository, and the canon's Monday sweep
# (`level-assert.yml`) can be read-only because nothing here writes
# outside the repository being judged.
#
# THIS WORKFLOW EXECUTES NO CALLER CODE. The caller's tree is never
# checked out and nothing from it runs: the judge reads the forge, the
# attestation store and the published artifacts, and the only local
# inputs are the canon tree and one string of track names. It declares
# no `id-token: write` and mints nothing, so the capability boundary
# the signer split protects is not in play here at all.
#
# WHO is on the board is the canon's, and the canon's
# `slsa/assert-policy.json` arrives with the canon tree to say so. The
# roster is READ from the delivered canon rather than restated per
# repository — a second copy in four stubs would red all four the day
# the org gains a repository, and the delivery rule (#445) exists to
# make that unrepresentable.
#
# This used to rewrite that roster before every run, re-emitting the
# whole population with each other member zeroed to `tracks: []`,
# because the only mode the engine had measured an ORGANISATION and a
# one-member roster is refused (correctly: the org form reconciles the
# declaration against the forge's listing in both directions). stele
# v0.20.0 scopes a board to one repository natively — `--repo`
# publishes that repository's own cells and enumerates nothing — so
# the rewrite is gone and the delivered roster is read as written
# (#891, stele#259).
#
# Every determination — what a level is, what may replace what
# (stele#135), which cell leaves the board — is the engine's, exactly
# as it is in the sweep.
---
name: level

"on":
  workflow_call:
    inputs:
      tracks:
        # forwarding: universal
        description: >-
          The tracks this repository bears evidence on, space
          separated: any of `build`, `source`, `dependency`. Stated
          positively — a name that is not a track is refused by the
          engine at load rather than quietly narrowing the board.
        required: true
        type: string

permissions: {}

jobs:
  level:
    name: judge and publish this repository's levels
    runs-on: ubuntu-24.04
    permissions:
      # Write on the CALLER, which is the repository being judged, and
      # the only thing written is that repository's own levels branch.
      contents: write # pushes this repository's cells to its own levels branch
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          cache: false

      - name: Check this repository against the canon roster
        # The engine scopes a board to one repository itself now
        # (stele#259, v0.20.0): `--repo` publishes that repository's own
        # cells and ENUMERATES NOTHING, so there is no org listing for a
        # declaration to be reconciled against and no roster to narrow.
        #
        # What this deletes is the rewrite that used to stand in for
        # that: the whole population re-emitted with every other member
        # zeroed to `tracks: []`, because the only mode available
        # measured an organisation. It was mechanical and carried no
        # judgment, which is exactly why the engine could take it.
        #
        # What stays is the membership check, which is a different
        # question and still ours: a repository nobody declared
        # publishes no levels.
        #
        # WHICH TRACKS now comes from the canon roster rather than from
        # this input, because `--repo` reads the row. The two were
        # already required to agree — the stub says so in its own
        # header and the canon's Monday sweep reds when they diverge —
        # so the answer is unchanged, but the source of it moved and a
        # disagreement must not become silent. Where the roster states
        # tracks explicitly, a stub contradicting it fails HERE instead
        # of being overridden without a word. Where the roster states
        # none, absent means every track and the sweep keeps owning it;
        # no track vocabulary is written down here, because a
        # vocabulary hardcoded in a caller goes stale the day the
        # engine gains a track.
        #
        # Values reach bash through the environment, never through
        # `${{ }}` interpolation into a shell body.
        env:
          TRACKS: ${{ inputs.tracks }}
        run: |
          set -euo pipefail
          me="${GITHUB_REPOSITORY#*/}"
          policy=.org-canon/slsa/assert-policy.json
          row=$(jq -c --arg me "${me}" \
            '[.population.repositories[] | select(.repo == $me)]' "${policy}")
          rows=$(jq -r 'length' <<< "${row}")
          if [[ ${rows} -ne 1 ]]; then
            echo "::error::${me} is not in the canon's declared population — the org has not said this"
            echo "::error::repository bears evidence, and a repository nobody declared publishes no levels"
            exit 1
          fi
          stated=$(jq -cn --arg t "${TRACKS}" \
            '$t | split("\\s+"; "") | map(select(length > 0)) | sort')
          count=$(jq -r 'length' <<< "${stated}")
          if [[ ${count} -eq 0 ]]; then
            echo "::error::the level stub declared no tracks — state at least one of build, source, dependency"
            exit 1
          fi
          roster=$(jq -c '.[0].tracks // empty | sort' <<< "${row}")
          if [[ -n ${roster} && ${roster} != "${stated}" ]]; then
            echo "::error::this stub declares ${stated} but the canon roster declares ${roster}"
            echo "::error::for ${me}; the roster is what the engine reads, so fix one of them"
            exit 1
          fi
          names=$(jq -r 'join(" ")' <<< "${stated}")
          echo "level: judging ${me} on ${names}"
      - name: Fetch the previously published judgments
        # The engine decides what may replace what, and it can only do
        # that against what is already published — so the prior board
        # is the out-dir this run measures into. An absent branch is
        # the first run and not a fault.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p levels
          if git clone --quiet --depth 1 --single-branch --branch levels \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prior; then
            rm -rf prior/.git
            cp -R prior/. levels/
          else
            echo "level: no levels branch yet — this is the first publication"
          fi
      - name: Judge this repository
        # One line, because every decision in it belongs to the judge.
        # Exit 4 is the regression case and nothing else — a cell judged
        # before that cannot be judged now — and the good judgments are
        # published before the run goes red, which is the order the
        # canon's cron took for the same reason.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          stele level \
            --repo "${GITHUB_REPOSITORY}" \
            --out-dir levels \
            --policy .org-canon/slsa/assert-policy.json || rc=$?
          if [[ ${rc} -ne 0 && ${rc} -ne 4 ]]; then
            echo "::error::stele level failed (exit ${rc}) — nothing published"
            exit "${rc}"
          fi
          echo "investigate=${rc}" >> "${GITHUB_ENV}"
      - name: Publish to this repository's levels branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd levels
          git init -q -b levels
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish measured levels" \
            -m "Rendered by stele level in ${GITHUB_REPOSITORY}; this repository judges itself."
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            levels:levels
          if [[ ${investigate} -ne 0 ]]; then
            echo "::error::a cell that was judged before cannot be judged now — investigate; good reports were not overwritten"
            exit 1
          fi
...
