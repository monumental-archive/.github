# The oci-image index assembly, extracted from build-oci-image.yml
# (#118): the index is assembled exactly once, HERE, downstream of the
# repro gate — the per-arch digest pushes are the build's last act and
# the gate compares them bit for bit. The rebuild never tags anything,
# and there is no index-level compare because the index is built
# exactly once (the same single-byte-path argument that covers the pgrx
# artifact images assembling from attested tarballs).
#
# The index is pushed BY DIGEST, with no tag (#1280). A registry tag is
# the last thing a release does: tag-images.yml names this digest after
# attach has published the release, so a run that burns between here
# and attach leaves an index nobody can pull as this version. Everything
# after the push reads by digest: pull-back smoke, facts equality, the
# report-only scan, and the image SBOM from the published bytes.
---
name: assemble-oci-index

"on":
  workflow_call:
    inputs:
      version:
        # forwarding: universal
        description: Version being released, without the leading v.
        required: true
        type: string
      smoke-test:
        # forwarding: universal
        description: >
          Script proving the image does its one job, run on the bytes
          pulled back from the registry by digest. Empty skips it.
        required: false
        type: string
        default: ""
      facts:
        # forwarding: universal
        description: >
          The resolved facts map (JSON, org.opencontainers.image.* keys)
          from the orchestrator's facts job — annotations for the index,
          and the equality target for the published-metadata assertion.
        required: true
        type: string
    outputs:
      image:
        description: Fully-qualified image name, lowercased.
        value: ${{ jobs.manifest.outputs.image }}
      digest:
        description: >
          Index digest of the manifest list. This is the attestation
          subject: measured in the lab, `gh attestation verify
          oci://<image>:<tag>` resolves the index.
        value: ${{ jobs.manifest.outputs.digest }}
      images:
        description: >
          The index as a one-element JSON array of {image, tag, digest} —
          the shape tag-images.yml takes, so the tag job after attach
          names exactly the digest pushed and signed here.
        value: ${{ jobs.manifest.outputs.images }}
      registry-subjects:
        description: >
          The same index as one target-prefixed sha256sum line —
          `image <hex>  <image>` — the shape attach-release takes for
          what a class published to a registry instead of beside the
          release (#1168). Digest and name are the pair the signer
          attests, so the manifest's claim and the provenance's subject
          come from one step.
        value: ${{ jobs.manifest.outputs.registry-subjects }}

permissions: {}

jobs:
  manifest:
    name: Assemble and prove the manifest list
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the manifest list by digest
    outputs:
      image: ${{ steps.assemble.outputs.image }}
      digest: ${{ steps.assemble.outputs.digest }}
      images: ${{ steps.assemble.outputs.images }}
      registry-subjects: ${{ steps.assemble.outputs.registry-subjects }}
    env:
      # The list is the whole install: no `mise run` installs the rest
      # (task auto-install is on by default; #1412).
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        # trivy comes from the belt. Without this the scan step dies as
        # `trivy: command not found` — exit 127, after the image is already
        # pushed and the manifest assembled, which is the worst place to
        # discover a missing tool.
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          # mise itself is a build input and floats without this pin — the
          # v0.18.2 darwin leg pulled same-day mise 2026.8.4 while every
          # pinned site ran 2026.8.3 (#117: nothing unpinned on an attested
          # path, the installer included).
          version: 2026.11.7
          cache: false
          # Only what this job's steps call (#1333): the release path is
          # uncached, so every tool in scope is paid for on every run.
          # release/test_job_installs.py holds the list to the calls.
          install_args: jq github:monumental-archive/stele trivy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oci-digest-*
          merge-multiple: true
          path: digests

      - name: Assemble the manifest list
        id: assemble
        env:
          FACTS: ${{ inputs.facts }}
          GH_TOKEN: ${{ github.token }}
          UNTRUSTED_VERSION: ${{ inputs.version }}
        # The buildx floor, the index's bytes and digest, the manifest
        # PUT by digest and the registry's answer are release/registry.py
        # (#1382), tested against a stub docker and a fake registry by
        # release/test_registry.py; its docstrings carry what this
        # block's comments did. It writes image, digest, images and
        # registry-subjects to this step's outputs.
        run: >-
          "${ORG_PYTHON}" .org-canon/release/registry.py assemble --digests digests
          --tag "${UNTRUSTED_VERSION}"
      - name: Pull the published bytes back and smoke them
        if: inputs.smoke-test != ''
        env:
          IMAGE: ${{ steps.assemble.outputs.image }}
          INDEX: ${{ steps.assemble.outputs.digest }}
          UNTRUSTED_SMOKE: ${{ inputs.smoke-test }}
        run: |
          set -euo pipefail
          # By digest, never by tag: a tag is a moving pointer, and the
          # point is to prove the exact bytes that were published.
          docker pull "${IMAGE}@${INDEX}"
          "${UNTRUSTED_SMOKE}" "${IMAGE}@${INDEX}"
      - name: Assert the published metadata equals the facts
        env:
          IMAGE: ${{ steps.assemble.outputs.image }}
          DIGEST: ${{ steps.assemble.outputs.digest }}
          FACTS: ${{ inputs.facts }}
        # At the pull-back point, like every other proof: the index media
        # type is OCI, its annotations EQUAL the map, and every per-arch
        # config's labels equal it too — equality, not presence, because
        # presence lets a wrong revision through. The mechanism is
        # stele's (registry read by digest, no daemon); the env contract
        # is unchanged from the bash it replaced (stele#39).
        run: stele assert image-facts

      - name: Scan the published image, report-only
        env:
          IMAGE: ${{ steps.assemble.outputs.image }}
          INDEX: ${{ steps.assemble.outputs.digest }}
        run: |
          set -euo pipefail
          # Report-only, deliberately: the CVE gate lives on pull requests,
          # where it blocks a change that introduces something new. A
          # publish — above all a scheduled remediation rebuild — must not
          # die because a scanner had a bad day, because blocking a rebuild
          # leaves the older and at-least-as-vulnerable image live.
          #
          # But it goes to the job summary, not only to the log. A scan
          # whose output lands in a green scheduled run is write-only, and
          # a check nobody reads is worse than no check.
          {
            echo "### Vulnerability scan (report-only)"
            echo
            echo "\`${IMAGE}@${INDEX}\`"
            echo
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          trivy image --config /dev/null --scanners vuln --exit-code 0 \
            --severity HIGH,CRITICAL --format table "${IMAGE}@${INDEX}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - name: Generate the image SBOM from the published bytes
        env:
          IMAGE: ${{ steps.assemble.outputs.image }}
          INDEX: ${{ steps.assemble.outputs.digest }}
          UNTRUSTED_VERSION: ${{ inputs.version }}
        # Class-shaped SBOM (docs/dependency-track.md): derived from the
        # published bytes at the pull-back point, like every other proof —
        # OS packages plus, via cargo-auditable's .dep-v0 section, the
        # Rust dependencies of the binaries actually inside. In the
        # versioned flow this artifact fans into the release via the
        # release-* pattern; in the continuous flow it stays a run
        # artifact until #108 annotates it onto the image. trivy exports
        # it, and stele judges it by the one admissibility rule
        # (stele#396, #1371): no PURL, or a versionless one, refuses, and
        # an export that will not parse cannot be judged. The canon's own
        # name starts with a dot, and `dist/*` globs and checksum loops
        # silently skip dotfiles — measured: every canon release before
        # the strip shipped without its SBOM, green.
        run: |
          set -euo pipefail
          base="${GITHUB_REPOSITORY##*/}"
          mkdir -p /tmp/sbom
          out="/tmp/sbom/${base#.}-${UNTRUSTED_VERSION:-continuous}-image.spdx.json"
          trivy image --config /dev/null --format spdx-json --output "${out}" "${IMAGE}@${INDEX}"
          stele assert inventory "${out}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-image
          path: /tmp/sbom/
          if-no-files-found: error
          retention-days: 7
...
