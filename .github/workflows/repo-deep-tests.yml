# A repository's tests run deeper than the gate can afford: bounded
# fuzz runs (audit:fuzz, audit:go-fuzz, #316, #445), the Rust branch and
# Go condition coverage floors (audit:coverage-branches, #1359;
# audit:coverage-go-branches, #1546), and every property at a fresh
# random seed (audit:python-properties, #1332; audit:typescript-
# properties, #1549). Each is time-bound, random or a second
# instrumented run, so none is the deterministic gate. A red here is a
# test that found something, and nothing else (#1858: one workflow per
# subject, named for what a red means). The mutation run has its own
# workflow for the same reason (repo-mutants.yml, #1355).
#
# Every leg skips clean where its language or its floor line is
# absent, so the stub stays universal. Callers pin by full SHA from
# their own `deep-tests` stub (workflow-templates/deep-tests.yml):
#
#   jobs:
#     deep-tests:
#       uses: monumental-archive/.github/.github/workflows/repo-deep-tests.yml@<sha> # vX.Y.Z
#
# The canon calls it at its running commit from self-deep-tests.yml.
# No inputs, by design — zero caller-controlled expansion.
---
name: repo-deep-tests

"on":
  workflow_call: {}
permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz targets survive a bounded run
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # Bounded libFuzzer runs under AddressSanitizer — cargo-fuzz's own
      # default — on the nightly the repo declares as FUZZ_TOOLCHAIN
      # (#445). Time-bound and non-deterministic, so it lives here, never
      # the gate (#316); the gate's lint:fuzz-build still proves the
      # targets compile, on stable. A repo with no fuzz/ skips clean.
      - name: Run every fuzz target for a bounded interval
        run: mise run audit:fuzz

      # A crash the cron cannot hand back is a crash nobody can act on:
      # libFuzzer writes the reproducing input to fuzz/artifacts/ and the
      # runner is ephemeral, so before this the audit reported a path on a
      # machine that no longer existed. Failure only — a clean run has
      # nothing to keep, and the corpus is deliberately NOT uploaded:
      # it is human-curated in-tree, and shipping machine-generated inputs
      # back would invite merging what nobody reviewed (#445).
      - name: Keep the reproducer when a target crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

      # The Go half (#445): the fuzzing engine ships in the toolchain, so
      # there is no extra binary, no sanitizer flag and no nightly — but
      # the same two properties put it here rather than in the gate. It is
      # time-bound (the documented -fuzztime default is to run forever)
      # and it writes. A repo with no Go fuzz target skips clean.
      - name: Run every Go fuzz target for a bounded interval
        run: mise run audit:go-fuzz

      # Go writes the failing input into the package's own
      # testdata/fuzz/<Target>/ rather than a dedicated artifacts
      # directory, so this necessarily carries the committed seed corpus
      # along with the new crasher. That is accepted rather than worked
      # around: the run's output names the exact file, and a filter that
      # tried to separate the two would be guessing at which of the
      # runner's files were new. Failure only, same as the Rust half, and
      # the cron still never pushes.
      - name: Keep the failing input when a Go target crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-fuzz-corpus-${{ github.run_id }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
          retention-days: 30

  coverage-branches:
    name: rust branch coverage holds its floor
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # `cargo llvm-cov --branch` on the nightly the repo declares as
      # FUZZ_TOOLCHAIN, held to the `rust-branches` line of
      # .coverage-floor (#1359). Here and never in the gate: the flag
      # needs a nightly, and a second instrumented test run on every
      # pull request is the cost the gate declines. Local only, so no
      # token. Skips clean with no Cargo.toml or no such line.
      - name: Hold the Rust branch-coverage floor
        run: mise run audit:coverage-branches

  coverage-go-branches:
    name: go condition coverage holds its floor
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # The belt pins gobco `lazy`, so the bare install above skips it.
      # This job is the one place it is installed: built from source by
      # the repository's own go pin, installed above, as gomu is
      # (repo-mutants.yml). Only where there is Go to build it with.
      - name: Install gobco, by name
        if: hashFiles('go.mod') != ''
        run: mise install go:github.com/rillig/gobco

      # gobco's condition coverage, one package per call, held to the
      # `go-branches` line of .coverage-floor (#1546). Here and never in
      # the gate: it re-runs the suite instrumented at six times its
      # cost. Local only, so no token. Skips clean with no go.mod or no
      # such line.
      - name: Hold the Go condition-coverage floor
        run: mise run audit:coverage-go-branches

  # One seed for every leg of the property job (#1631), drawn once so a
  # finding in any shard reruns with one ORG_PROPERTY_SEED.
  python-properties-seed:
    name: draw the python property seed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - name: Draw the property seed
        id: seed
        run: |
          set -euo pipefail
          seed=$(od -An -N8 -tu8 /dev/urandom)
          echo "seed=${seed// /}" >> "${GITHUB_OUTPUT}"

  python-properties:
    name: python properties hold at a random seed (${{ matrix.shard }}/8)
    needs: python-properties-seed
    runs-on: ubuntu-26.04
    # Eight legs by position, not by directory: a repository may keep
    # every property under one (#1631). Measured on the canon's 58 files,
    # audit run 44669302615 (2026-11-20): the slowest leg took 10m14s,
    # so 60 is five times it rounded up to ten minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
      ORG_PROPERTY_SHARD: ${{ matrix.shard }}/8
      ORG_PROPERTY_SEED: ${{ needs.python-properties-seed.outputs.seed }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # The cron half of #1332, the Python mirror of the Go fuzz step:
      # every tracked prop_*.py at a fresh random seed and far wider
      # bounds than the gate's fixed-seed run. Not the gate, because a
      # random seed is not deterministic. The seed prints first and a
      # failure prints Hypothesis's shrunk example: commit it as an
      # @example row with its fix and the gate replays it. Nothing to
      # upload, since the log carries both. Skips clean with no
      # prop_*.py tracked.
      - name: Run every Python property at a random seed
        run: mise run audit:python-properties

  typescript-properties:
    name: typescript properties hold at a random seed
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # The caller's own vitest and fast-check, from its own tracked
      # lockfile: the belt pins neither (#1549, the #1357 rule). The
      # coverage job's install step, for the same reason.
      - name: Install the caller's JavaScript dependencies
        if: ${{ hashFiles('pnpm-lock.yaml', 'package-lock.json') != '' }}
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      # The cron half of #1549, the TypeScript mirror of the Python
      # step above: every tracked *.prop.test.* at a fresh fast-check
      # seed and 10,000 runs per property. Not the gate, because a
      # random seed is not deterministic. The seed prints first and a
      # failure prints fast-check's shrunk counterexample: commit it as
      # a fixed example of its property with its fix and the gate
      # replays it. Skips clean where no lockfile holds fast-check.
      - name: Run every TypeScript property at a random seed
        run: mise run audit:typescript-properties

  # Every scheduled workflow ends here (#1887): while a run on the
  # default branch has a red job, one issue titled "<workflow> is red"
  # and labelled red-check holds each red job and its log tail; the next
  # green run closes it. mise/standing_issue.py has the outcomes. Only
  # `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - fuzz
      - coverage-branches
      - coverage-go-branches
      - python-properties-seed
      - python-properties
      - typescript-properties
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # the workflow's one red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}"
...
