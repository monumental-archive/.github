# A repository's tests run deeper than the gate can afford: bounded
# fuzz runs, one runner per target (audit:fuzz, audit:go-fuzz, #316,
# #445, #1899), the Rust branch and
# Go condition coverage floors (audit:coverage-branches, #1359;
# audit:coverage-go-branches, #1546), and every property at a fresh
# random seed (audit:python-properties, #1332; audit:typescript-
# properties, #1549; audit:rust-properties, #1930). Each is
# time-bound, random or a second instrumented run, so none is the
# deterministic gate. A red here is a
# test that found something, and nothing else (#1858: one workflow per
# subject, named for what a red means). The mutation run has its own
# workflow for the same reason (repo-mutants.yml, #1355). Every job runs
# nightly (#1899): since #1897 keeps what a search finds, search time
# accumulates, and the random-seed properties search as the fuzzers do.
#
# Every leg skips clean where its language or its floor line is
# absent, so the stub stays universal. Callers pin by full SHA from
# their own `deep-tests` stub (workflow-templates/deep-tests.yml):
#
#   jobs:
#     deep-tests:
#       uses: monumental-archive/.github/.github/workflows/repo-deep-tests.yml@<sha> # vX.Y.Z
#
# The canon calls it at its running commit from self-deep-tests.yml.
# No inputs, by design — zero caller-controlled expansion. Two secrets:
# the release App's key, which only the `propose` job reads (#1897),
# and the gate's atlas-token, exported as ATLAS_TOKEN on every step
# that runs the repository's code, as ci.yml's gate step does (#1927;
# mise/test_audit_legs.py holds the three to each other).
---
name: repo-deep-tests

"on":
  workflow_call:
    secrets:
      app-private-key:
        # forwarding: universal
        # Not required, so a stub that predates it still runs: only a
        # run that staged something mints a token, and that step then
        # fails naming the missing key.
        description: Tag-mint App private key (the propose job's token)
        required: false
      atlas-token:
        # forwarding: discretionary — only repos whose tests apply a schema through Atlas Pro carry the secret
        description: >
          Atlas Cloud token, exported as ATLAS_TOKEN for the ci job.
          Optional: absent, nothing reads it. atlas.hcl in a repo that
          pins a Cloud org for Pro surfaces makes every `atlas` call
          demand a login, including the one its integration tests make
          to apply the schema — so a repo that lost this on import
          (monumental-archive) had a test gate that could never go green
          (#830). The credential is the repository's own, scoped by
          Atlas to its org; the gate still forwards nothing it was not
          handed.
        required: false
permissions:
  contents: read

jobs:
  # Which jobs below apply to this tree (#1891), decided from
  # `git ls-files` and mise/audit-legs.toml before any runner installs a
  # toolchain: each conditional job's `if:` reads one output, so a
  # repository without its language shows it skipped, not run-and-
  # skipped. A job of its own because `hashFiles` is step-only
  # (repo-mutants.yml's `adoption`); mise/test_audit_legs.py holds the
  # table and the `if:`s to the tasks' own guards. `fuzz-targets` is the
  # fuzz job's matrix (#1899): the targets the coverage floor measures
  # (#1896), and `fuzz` is false where there are none.
  applies:
    name: which jobs apply
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      fuzz: ${{ steps.applies.outputs.fuzz }}
      fuzz-targets: ${{ steps.applies.outputs.fuzz-targets }}
      coverage-branches: ${{ steps.applies.outputs.coverage-branches }}
      coverage-go-branches: ${{ steps.applies.outputs.coverage-go-branches }}
      python-properties-seed: ${{ steps.applies.outputs.python-properties-seed }}
      python-properties: ${{ steps.applies.outputs.python-properties }}
      typescript-properties: ${{ steps.applies.outputs.typescript-properties }}
      rust-properties: ${{ steps.applies.outputs.rust-properties }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Decide which jobs apply
        id: applies
        run: '"${ORG_PYTHON}" .org-canon/mise/audit_legs.py repo-deep-tests >> "${GITHUB_OUTPUT}"'

  # One runner per fuzz target (#1899), each searched for FUZZ_SECONDS
  # (the belt's 1800 default; Go halves it between its plain and race
  # passes), so the wall time no longer grows with the number of
  # targets. fail-fast off: one target's crash never cancels another's
  # search. 60 minutes is the 30-minute search with the build, the
  # measurement of each candidate and the install beside it.
  fuzz:
    name: fuzz ${{ matrix.leg }} survives a bounded run
    needs: applies
    if: ${{ needs.applies.outputs.fuzz == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.applies.outputs.fuzz-targets) }}
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_PACKAGE: ${{ matrix.package }}
    steps:
      # Every branch, so origin/fuzz-corpus is there when an unmerged
      # proposal is: the search builds on it (#1897), reading only its
      # corpus paths, as data.
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # Bounded libFuzzer runs under AddressSanitizer — cargo-fuzz's own
      # default — on the nightly the repo declares as FUZZ_TOOLCHAIN
      # (#445). Time-bound and non-deterministic, so it lives here, never
      # the gate (#316); the gate's lint:fuzz-build still proves the
      # targets compile, on stable. FUZZ_TARGET names this runner's one
      # target. What it keeps (#1897) is staged under
      # ORG_FUZZ_CANDIDATES, and its summary written to ORG_FUZZ_SUMMARY.
      - name: Run the fuzz target for a bounded interval
        if: ${{ matrix.kind == 'rust' }}
        env:
          ORG_FUZZ_CANDIDATES: ${{ runner.temp }}/fuzz-corpus-candidates
          ORG_FUZZ_SUMMARY: ${{ runner.temp }}/fuzz-corpus-summary/${{ matrix.leg }}.md
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
        run: mise run audit:fuzz

      # The Go half (#445): the fuzzing engine ships in the toolchain, so
      # there is no extra binary, no sanitizer flag and no nightly — but
      # the same two properties put it here rather than in the gate. It is
      # time-bound (the documented -fuzztime default is to run forever)
      # and it writes. FUZZ_TARGET and FUZZ_PACKAGE name this runner's
      # one target.
      - name: Run the Go fuzz target for a bounded interval
        if: ${{ matrix.kind == 'go' }}
        env:
          ORG_FUZZ_CANDIDATES: ${{ runner.temp }}/fuzz-corpus-candidates
          ORG_FUZZ_SUMMARY: ${{ runner.temp }}/fuzz-corpus-summary/${{ matrix.leg }}.md
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
        run: mise run audit:go-fuzz

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

      # Whether the search passed or failed (a crash is what most needs
      # keeping): the summary goes to the job's own page, and the step's
      # `staged` output says whether this runner has anything to hand
      # on. The job has no `outputs:` (#1899): a matrix job's outputs
      # are last-writer-wins, so one runner's `staged=false` would hide
      # another's finds. Each runner hands on through its own artifacts.
      - name: Hand what the search kept to the propose job
        id: kept
        if: ${{ !cancelled() }}
        env:
          CANDIDATES: ${{ runner.temp }}/fuzz-corpus-candidates
          SUMMARY: ${{ runner.temp }}/fuzz-corpus-summary/${{ matrix.leg }}.md
        run: .org-canon/release/propose-fuzz-corpus.sh handover

      # One artifact per target (#1897, #1899), replacing the two 30-day
      # reproducer uploads: every staged file at its repository path.
      # Named by the target's floor leg, which the coverage floor's clash
      # check holds unique, so two Go packages sharing a Fuzz name never
      # share an artifact.
      - name: Upload what the search kept
        if: ${{ !cancelled() && steps.kept.outputs.staged == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-candidates-${{ matrix.leg }}
          path: ${{ runner.temp }}/fuzz-corpus-candidates/
          if-no-files-found: error
          retention-days: 30

      # This runner's summary, a file named for its target, so the
      # propose job's merged download keeps every runner's.
      - name: Upload what the search says it kept
        if: ${{ !cancelled() && steps.kept.outputs.staged == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-summary-${{ matrix.leg }}
          path: ${{ runner.temp }}/fuzz-corpus-summary/
          if-no-files-found: error
          retention-days: 30

  # What the search kept becomes a reviewed pull request (#1897), opened
  # by a job that runs NO repository code: no checkout, no mise, cargo
  # or go, and the artifact downloaded outside the workspace after the
  # canon tree is linked. It is the only job here to mint a token, and
  # it mints it only after every path in the artifact has been held to
  # the two corpus shapes: the artifact was written by the job that ran
  # the repository's code, so its paths are input, not instructions.
  # Also when the fuzz job failed, since a crash is staged then. It runs
  # whenever the fuzz job ran (#1899): whether any runner staged
  # something is read from the downloads, never from the matrix's
  # outputs, and with nothing staged it ends green before the mint.
  propose:
    name: propose what the search kept
    needs: fuzz
    if: ${{ !cancelled() && needs.fuzz.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the canon action's own install; every write is the App's
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      # Every target's artifact into one tree (#1899): each file is at
      # its repository path, so the targets' files never collide.
      - name: Download what the search kept
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-corpus-candidates-*
          merge-multiple: true
          path: ${{ runner.temp }}/fuzz-corpus-candidates

      # Every staging runner's summary into a tree of its own, so the
      # path check reads the candidates and nothing else.
      - name: Download what the search says it kept
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-corpus-summary-*
          merge-multiple: true
          path: ${{ runner.temp }}/fuzz-corpus-summaries

      # A pattern that matched nothing downloads nothing: then no runner
      # staged anything, and the job ends here, green, before the mint.
      - name: Read whether any runner staged anything
        id: staged
        env:
          CANDIDATES: ${{ runner.temp }}/fuzz-corpus-candidates
        run: .org-canon/release/propose-fuzz-corpus.sh staged

      - name: Refuse any path outside the two corpus shapes
        if: ${{ steps.staged.outputs.staged == 'true' }}
        env:
          CANDIDATES: ${{ runner.temp }}/fuzz-corpus-candidates
        run: .org-canon/release/propose-fuzz-corpus.sh check

      # The release App (TAG_MINT_APP_CLIENT_ID): it already holds these
      # two grants. With no owner or repositories named, the token is
      # for this repository alone.
      - name: Mint the proposal token
        id: token
        if: ${{ steps.staged.outputs.staged == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAG_MINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit the inputs to fuzz-corpus and open its pull request
        if: ${{ steps.staged.outputs.staged == 'true' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          CANDIDATES: ${{ runner.temp }}/fuzz-corpus-candidates
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SUMMARIES: ${{ runner.temp }}/fuzz-corpus-summaries
        run: .org-canon/release/propose-fuzz-corpus.sh propose

  coverage-branches:
    name: rust branch coverage holds its floor
    needs: applies
    if: ${{ needs.applies.outputs.coverage-branches == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # `cargo llvm-cov --branch` on the nightly the repo declares as
      # FUZZ_TOOLCHAIN, held to the `rust-branches` line of
      # .coverage-floor (#1359). Here and never in the gate: the flag
      # needs a nightly, and a second instrumented test run on every
      # pull request is the cost the gate declines. Local only, so no
      # token. Skips clean with no Cargo.toml or no such line.
      - name: Hold the Rust branch-coverage floor
        env:
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
        run: mise run audit:coverage-branches

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  coverage-go-branches:
    name: go condition coverage holds its floor
    needs: applies
    if: ${{ needs.applies.outputs.coverage-go-branches == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # The belt pins gobco `lazy`, so the bare install above skips it.
      # This job is the one place it is installed: built from source by
      # the repository's own go pin, installed above, as gomu is
      # (repo-mutants.yml). Only where there is Go to build it with.
      - name: Install gobco, by name
        if: hashFiles('go.mod') != ''
        run: mise install go:github.com/rillig/gobco

      # gobco's condition coverage, one package per call, held to the
      # `go-branches` line of .coverage-floor (#1546). Here and never in
      # the gate: it re-runs the suite instrumented at six times its
      # cost. Local only, so no token. Skips clean with no go.mod or no
      # such line.
      - name: Hold the Go condition-coverage floor
        env:
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
        run: mise run audit:coverage-go-branches

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # One seed for every leg of the property job (#1631), drawn once so a
  # finding in any shard reruns with one ORG_PROPERTY_SEED.
  python-properties-seed:
    name: draw the python property seed
    needs: applies
    if: ${{ needs.applies.outputs.python-properties-seed == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - name: Draw the property seed
        id: seed
        run: |
          set -euo pipefail
          seed=$(od -An -N8 -tu8 /dev/urandom)
          echo "seed=${seed// /}" >> "${GITHUB_OUTPUT}"

  python-properties:
    name: python properties hold at a random seed (${{ matrix.shard }}/8)
    needs:
      - applies
      - python-properties-seed
    if: ${{ needs.applies.outputs.python-properties == 'true' }}
    runs-on: ubuntu-26.04
    # Eight legs by position, not by directory: a repository may keep
    # every property under one (#1631). Measured on the canon's 58 files,
    # audit run 44669302615 (2026-11-20): the slowest leg took 10m14s,
    # so 60 is five times it rounded up to ten minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
      ORG_PROPERTY_SHARD: ${{ matrix.shard }}/8
      ORG_PROPERTY_SEED: ${{ needs.python-properties-seed.outputs.seed }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # The cron half of #1332, the Python mirror of the Go fuzz step:
      # every tracked prop_*.py at a fresh random seed and far wider
      # bounds than the gate's fixed-seed run. Not the gate, because a
      # random seed is not deterministic. The seed prints first and a
      # failure prints Hypothesis's shrunk example: commit it as an
      # @example row with its fix and the gate replays it. Nothing to
      # upload, since the log carries both. Skips clean with no
      # prop_*.py tracked.
      - name: Run every Python property at a random seed
        env:
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
        run: mise run audit:python-properties

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  typescript-properties:
    name: typescript properties hold at a random seed
    needs: applies
    if: ${{ needs.applies.outputs.typescript-properties == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # The caller's own vitest and fast-check, from its own tracked
      # lockfile: the belt pins neither (#1549, the #1357 rule). The
      # coverage job's install step, for the same reason.
      - name: Install the caller's JavaScript dependencies
        if: ${{ hashFiles('pnpm-lock.yaml', 'package-lock.json') != '' }}
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      # The cron half of #1549, the TypeScript mirror of the Python
      # step above: every tracked *.prop.test.* at a fresh fast-check
      # seed and 10,000 runs per property. Not the gate, because a
      # random seed is not deterministic. The seed prints first and a
      # failure prints fast-check's shrunk counterexample: commit it as
      # a fixed example of its property with its fix and the gate
      # replays it. Skips clean where no lockfile holds fast-check.
      - name: Run every TypeScript property at a random seed
        env:
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
        run: mise run audit:typescript-properties

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  rust-properties:
    name: rust properties hold at a random seed
    needs: applies
    if: ${{ needs.applies.outputs.rust-properties == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # The cron half of #1930: the repository's own `test` task at a
      # fresh proptest seed, with its own case counts. The gate draws
      # from seed 1 (the belt's `[env]`); here the seed prints first and
      # a failure prints proptest's minimal failing input:
      # ORG_PROPERTY_SEED=<n> mise run test writes it into the
      # *.proptest-regressions file beside the test, committed with the
      # fix, and the gate replays it. Applies where a tracked Cargo.lock
      # locks proptest (audit_legs.py's `rust-properties`).
      - name: Run the repository's tests at a random proptest seed
        env:
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
        run: mise run audit:rust-properties

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887): while a run on the
  # default branch has a red job, one issue titled "<workflow> is red"
  # and labelled red-check holds each red job and its log tail; the next
  # green run closes it. mise/standing_issue.py has the outcomes. Only
  # `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - applies
      - fuzz
      - propose
      - coverage-branches
      - coverage-go-branches
      - python-properties-seed
      - python-properties
      - typescript-properties
      - rust-properties
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # the workflow's one red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
