# The canon's own deep-tests run — this repository running the stub every
# other repository runs (#1858).
#
# The same file `workflow-templates/deep-tests.yml` ships, with the one
# difference every canon self-application has: the `uses:` is local,
# because the canon calls its own workflow at the running commit rather
# than pinning a release of itself (the gate.yml and self-mutants.yml
# convention). Named `self-deep-tests.yml` because `repo-deep-tests.yml` is
# the callee.
---
name: deep-tests

"on":
  schedule:
    # Every night at 07:00 UTC, the canon's own slot (#1899): a search
    # that keeps what it finds is worth running every night.
    - cron: 0 7 * * *
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deep-tests:
    permissions:
      contents: read # this repository's contents, read-only
      issues: write # the callee's report job: its workflow's red-check issue (#1887)
      actions: read # the callee's report job: the run's job list and job logs (#1887)
    uses: ./.github/workflows/repo-deep-tests.yml # zizmor: ignore[self-repository]
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }} # the propose job's token (#1897)
...
