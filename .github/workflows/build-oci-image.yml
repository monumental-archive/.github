# Artifact class: oci-image. Every rule below was arrived at in three
# repositories before it was written down here (docs/release.md).
#
#   Native hardware per architecture. No QEMU, and therefore no single
#   `--platform linux/amd64,linux/arm64` build: emulation tests the image
#   on the wrong machine, and an image that passes under emulation has not
#   been shown to work where it runs.
#
#   Build and push are separate. A combined build-and-push has no moment at
#   which a testable image exists un-published, so it is built, loaded,
#   smoke-tested, and only then pushed. The manifest list is assembled from
#   the per-architecture images afterwards.
#
#   The published bytes are pulled back BY DIGEST and proved again before
#   anything is signed. A signature must assert something demonstrated of
#   the artifact a stranger will pull, never of a local twin.
#
#   This workflow stops after the per-arch digest pushes (#118): the
#   index is assembled and TAGGED exactly once, post-gate, in
#   assemble-oci-index.yml — no public reference exists until the
#   repro gate has compared the per-arch digests bit for bit.
#
# No `docker/*` actions: `docker buildx` and `docker login` are preinstalled
# on the runners, proven in the lab, and using them keeps the organisation's
# Actions allowlist at four patterns instead of eight.
#
# No cache of any kind. A workflow that publishes carries none — everything
# downstream of it gets signed.
#
#   The compile lives OUTSIDE the Dockerfile (#295). The repro gate
#   measured the containerised cargo build nondeterministic while the
#   same crates built bit-for-bit under the belt's pinned rust — so the
#   binary is built by the `prepare` script in the caller's mise-pinned
#   toolchain, and the Dockerfile stays pure assembly over pinned
#   inputs. One toolchain, not two; determinism by construction, proven
#   by the gate.
name: build-oci-image

on:
  workflow_call:
    inputs:
      version:
        # forwarding: universal
        description: Version being released, without the leading v.
        required: true
        type: string
      dockerfile:
        # forwarding: universal
        description: Path to the Dockerfile, relative to the context.
        required: false
        type: string
        default: Dockerfile
      context:
        # forwarding: universal
        description: Build context directory.
        required: false
        type: string
        default: "."
      smoke-test:
        # forwarding: universal
        description: >
          Script proving the image does the one thing it exists to do —
          booted, extensions loaded, server answering. Receives the image
          reference as $1. Run twice: once on the loaded image before
          anything is published, and again on the bytes pulled back from
          the registry. Empty means no smoke test, which is permitted and
          unwise.
        required: false
        type: string
        default: ""
      prepare:
        # forwarding: universal
        description: >
          Script materialising build artifacts into the context before the
          image build, run with the caller's own mise-pinned toolchain
          under the same reproducibility flags as the rust-binary class.
          Receives the matrix architecture (amd64|arm64) as $1. This is
          the correct-by-construction answer to #295: a compile inside
          BuildKit runs a second toolchain the belt does not pin (the lab
          ran rust:1.97-slim by tag while the belt's pinned rust built the
          same crates bit-for-bit), and the repro gate proved that path
          nondeterministic. With the compile out here, the Dockerfile is
          pure assembly — a digest-pinned or scratch base plus COPY of
          bytes this job just built — and nothing nondeterministic remains
          inside the image build. The repro leg runs the same script,
          which is what makes the gate a proof of the whole path. Empty
          means the Dockerfile is self-contained; a Dockerfile that
          compiles is the #295 failure mode.
        required: false
        type: string
        default: ""
      facts:
        # forwarding: universal
        description: >
          The resolved facts map (JSON, org.opencontainers.image.* keys)
          from the orchestrator's facts job. Builds consume it — as config
          labels on every per-arch image and annotations on the index —
          and derive nothing themselves. Both build invocations below take
          the SAME label set from it: a label changes the config digest
          while every layer stays identical, so a drifted set would
          publish an image that was never smoked.
        required: true
        type: string
      source-epoch:
        # forwarding: universal
        description: >
          Committer epoch of the released commit, resolved beside the
          facts. Exported as SOURCE_DATE_EPOCH, which BuildKit propagates
          into the config and index `created` fields — so the one
          wall-clock value this build could otherwise publish beside a
          commit-pinned one is unwritable, not merely avoided.
        required: true
        type: string
      dry-run:
        # forwarding: discretionary — rehearsal is versioned-only; continuous has no gate to rehearse
        description: Rehearsal — build and prove, push nothing.
        required: false
        type: boolean
        default: false
      repro:
        # forwarding: discretionary — the repro leg sets it; omission means a first build
        description: >
          Rebuild leg of the repro gate (#118): build and push by digest
          exactly like the first build (digest pushes are idempotent — a
          reproduced rebuild is a no-op landing on the same digest, a
          mismatch leaves an unreferenced, untagged, harmless digest and
          the gate goes red), skip the smoke test, and record the digest
          under a repro- prefixed artifact so the gate can compare.
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build and smoke ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the per-architecture image by digest
    env:
      # The prepare environment, mirrored from build-rust-binary (same
      # rationale, same flags — see its header): the caller's own pinned
      # toolchain, nothing global, and reproducibility by construction
      # rather than by audit. Inert when no prepare script is given.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the caller's pinned toolchain
        if: inputs.prepare != ''
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # mise itself is a build input and floats without this pin
          # (#117: nothing unpinned on an attested path, the installer
          # included).
          version: 2026.8.3
          # No tool cache anywhere downstream of a signature.
          cache: false

      - name: Materialise build artifacts into the context (prepare)
        if: inputs.prepare != ''
        env:
          ARCH: ${{ matrix.arch }}
          UNTRUSTED_PREPARE: ${{ inputs.prepare }}
        run: |
          set -euo pipefail
          if [[ ! -x "${UNTRUSTED_PREPARE}" ]]; then
            echo "::error::prepare ${UNTRUSTED_PREPARE} is not executable"
            exit 1
          fi
          "${UNTRUSTED_PREPARE}" "${ARCH}"

      - name: Resolve the image name
        id: name
        run: |
          set -euo pipefail
          # ghcr.io rejects an owner with capitals and the failure lands at
          # push time, so it is lowercased here rather than discovered
          # three minutes into a release.
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Create a container-driver builder
        run: |
          set -euo pipefail
          # The runner's default buildx builder uses the `docker` driver,
          # which cannot push by digest — "push-by-digest is currently not
          # implemented for docker driver". The docker-container driver
          # can, and it still supports --load for the smoke test, so one
          # builder serves both halves.
          #
          # No --driver-opt cache settings and no registry mirror: this
          # workflow publishes, so it carries no cache of any kind.
          docker buildx create --use --name org-oci --driver docker-container

      - name: Build for testing, loaded and unpublished
        env:
          ARCH: ${{ matrix.arch }}
          FACTS: ${{ inputs.facts }}
          SOURCE_DATE_EPOCH: ${{ inputs.source-epoch }}
          UNTRUSTED_CONTEXT: ${{ inputs.context }}
          UNTRUSTED_DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          # The SAME labels as the push below, from the same map: labels
          # are part of the config the smoke test runs against.
          pairs=$(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "${FACTS}")
          LABELS=()
          while IFS= read -r kv; do LABELS+=(--label "${kv}"); done <<< "${pairs}"
          # No --platform: the runner IS the target architecture, so the
          # default native build is the guarantee that no emulation crept
          # in. --load puts it in the local daemon, where it can be tested
          # and cannot be pulled by anyone.
          docker buildx build \
            --file "${UNTRUSTED_CONTEXT}/${UNTRUSTED_DOCKERFILE}" \
            "${LABELS[@]}" \
            --load --tag "oci-under-test:${ARCH}" \
            "${UNTRUSTED_CONTEXT}"

      - name: Smoke the loaded image
        if: ${{ inputs.smoke-test != '' && !inputs.repro }}
        env:
          ARCH: ${{ matrix.arch }}
          UNTRUSTED_SMOKE: ${{ inputs.smoke-test }}
        run: |
          set -euo pipefail
          if [[ ! -x "${UNTRUSTED_SMOKE}" ]]; then
            echo "::error::smoke-test ${UNTRUSTED_SMOKE} is not executable"
            exit 1
          fi
          "${UNTRUSTED_SMOKE}" "oci-under-test:${ARCH}"

      - name: Push by digest
        id: push
        if: ${{ !inputs.dry-run }}
        env:
          ARCH: ${{ matrix.arch }}
          FACTS: ${{ inputs.facts }}
          SOURCE_DATE_EPOCH: ${{ inputs.source-epoch }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.name.outputs.image }}
          UNTRUSTED_CONTEXT: ${{ inputs.context }}
          UNTRUSTED_DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          pairs=$(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "${FACTS}")
          LABELS=()
          while IFS= read -r kv; do LABELS+=(--label "${kv}"); done <<< "${pairs}"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          # push-by-digest: no tag yet. A tag would make the untested
          # per-architecture image pullable by name before the manifest
          # exists and before anything has been proved.
          #
          # This rebuilds, but from the same builder in the same job, so
          # every layer is already resolved. That is builder state, not a
          # cache anyone else can poison.
          # Build as its own statement, then read the metadata. Sequencing
          # the two inside one command substitution would hand the exit
          # status to jq and mask a failed build entirely, and silencing
          # the build would throw away the log needed to explain it.
          #
          # oci-mediatypes=true is load-bearing, not cosmetic: the exporter
          # default is false, a Docker-mediatype manifest makes imagetools
          # create assemble a Docker manifest list, and that format has no
          # annotations field — buildx drops index annotations SILENTLY
          # (docker/buildx#1965). The assert step downstream proves the
          # published index is OCI precisely because this is the failure
          # mode that looks exactly like success.
          # --provenance=false and --sbom=false, measured (#118): buildx
          # otherwise embeds a per-build attestation manifest carrying
          # wall-clock metadata, so two identical builds NEVER share a
          # digest — the lab's first full-width gate run proved it on
          # every image class. The org's provenance is its own signed
          # evidence (the signer), never the embedded blob, so nothing
          # is lost. rewrite-timestamp=true clamps layer mtimes to
          # SOURCE_DATE_EPOCH — RUN and COPY otherwise record the
          # build's own clock into the layer bytes.
          docker buildx build \
            --file "${UNTRUSTED_CONTEXT}/${UNTRUSTED_DOCKERFILE}" \
            "${LABELS[@]}" \
            --provenance=false --sbom=false \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,rewrite-timestamp=true" \
            --metadata-file /tmp/meta.json \
            "${UNTRUSTED_CONTEXT}"
          digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest from the push"
            exit 1
          fi
          # Written to a file, not to a job output. Outputs of a MATRIX
          # job overwrite one another — the legs share one output map — so
          # a digest passed that way is a race that surfaces later as a
          # manifest silently missing an architecture.
          mkdir -p /tmp/digests
          printf '%s' "${digest}" > "/tmp/digests/${ARCH}"
          echo "::notice::${ARCH} pushed as ${digest}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.dry-run }}
        with:
          name: ${{ inputs.repro && 'repro-' || '' }}oci-digest-${{ matrix.arch }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

