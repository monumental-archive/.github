# A repository's public API against its latest published release
# (audit:semver, #1341): a break the version number does not declare
# is a red here. It reads the registry's baseline, so it is network and
# never the deterministic gate. A red here is an API change the version
# does not admit, and nothing else (#1858: one workflow per subject,
# named for what a red means).
#
# Callers pin by full SHA from their own `public-api` stub
# (workflow-templates/public-api.yml):
#
#   jobs:
#     public-api:
#       uses: monumental-archive/.github/.github/workflows/repo-public-api.yml@<sha> # vX.Y.Z
#
# The canon publishes no API with a registry baseline, so it has no
# caller of this. No inputs, by design — zero caller-controlled
# expansion.
---
name: repo-public-api

"on":
  workflow_call: {}
permissions:
  contents: read

jobs:
  # Which jobs below apply to this tree (#1891), decided from
  # `git ls-files` and mise/audit-legs.toml before any runner installs a
  # toolchain: each conditional job's `if:` reads one output, so a
  # repository without its language shows it skipped, not run-and-
  # skipped. A job of its own because `hashFiles` is step-only
  # (repo-mutants.yml's `adoption`); mise/test_audit_legs.py holds the
  # table and the `if:`s to the tasks' own guards.
  applies:
    name: which jobs apply
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      semver: ${{ steps.applies.outputs.semver }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Decide which jobs apply
        id: applies
        run: '"${ORG_PYTHON}" .org-canon/mise/audit_legs.py repo-public-api >> "${GITHUB_OUTPUT}"'

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  semver:
    name: the public API is compatible with the published release
    needs: applies
    if: ${{ needs.applies.outputs.semver == 'true' }}
    runs-on: ubuntu-26.04
    # Measured (#1341): edtf's whole judgment, five pgrx majors built twice
    # each (the crate and its baseline) plus its plain crates, took 706s on
    # an M1 Pro (8 cores) with a cold target directory; the toolchain install
    # took 4 minutes on the runner (edtf run 43884069155). The runner
    # builds slower than the Mac, so the ceiling is about three times the
    # sum: a hung build stops here, a slow one does not.
    timeout-minutes: 50
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.10
          cache: false

      - name: Check the public API against the latest published release
        run: mise run audit:semver

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887), with one issue per red
  # job (#1966): for each red job of a run on the default branch, one
  # issue titled "red: <job> (<workflow>)" and labelled red-check holds
  # its findings and each red leg's log tail; the next run with every
  # leg green or skipped closes it. mise/standing_issue.py has the
  # outcomes. Only `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - applies
      - semver
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # each red job's red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
