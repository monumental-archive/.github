# The org CI gate. Callers pin by full SHA:
#
#   jobs:
#     ci:
#       uses: monumental-archive/.github/.github/workflows/ci.yml@<sha> # vX.Y.Z
#
# One SHA pins this file, the toolbelt, and its lockfile atomically: the
# canon tree below arrives via `$/.github/actions/canon` — the same
# self-repository resolution that fetched this file — so the file and
# the tree are the same release by construction, with no second
# derivation to disagree (#165; the prior carriers, a runtime context
# var and a release-time stamp, both failed — #158, #164). No inputs,
# by design — zero caller-controlled expansion.
---
name: ci

"on":
  workflow_call:
    secrets:
      codecov-token:
        # forwarding: discretionary — only repos with coverage carry the secret
        description: >
          Codecov upload token, for the coverage badge. Optional: absent,
          the coverage job skips clean. The gate's coverage RATCHET does
          not live here — coverage:check runs inside the ci job,
          deterministic against the committed floor; this job only makes
          the number visible.
        required: false

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    env:
      # Both checkouts are trusted mise config roots; nothing else is.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The lock is law: no network resolution at run time.
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: lint:commits checks the origin/main..HEAD range.
          fetch-depth: 0
          # Tags too: checkout passes --no-tags by default even at depth
          # 0, and lint:template-pins asserts each pin names a released
          # tag (#233). Part of the checkout that already happens, so the
          # gate stays deterministic — no runtime network of its own.
          fetch-tags: true
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      # unattested-path: this gate signs and publishes nothing, so the
      # cold-build rule (#117, docs/release.md) permits caches exactly
      # here — a human is waiting on a pull request. Every signing and
      # publishing workflow builds cold and carries no cache; this
      # marker is reviewed by lint:cold-attested, which fails any
      # workflow that caches without one. Integrity does not ride the
      # cache: Go re-verifies every module read against go.sum and
      # cargo checks registry sources against Cargo.lock, so a
      # poisoned entry cannot change what compiles — and GitHub scopes
      # cache writes per branch, so a pull request cannot write the
      # default branch's entries. Restore-keys make a stale cache a
      # slower run, never a wrong one.
      - name: Restore the Go caches (unsigned gate only)
        if: ${{ hashFiles('go.sum') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gate-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gate-go-${{ runner.os }}-

      - name: Restore the cargo caches (unsigned gate only)
        if: ${{ hashFiles('Cargo.lock') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: gate-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gate-cargo-${{ runner.os }}-

      # PRs squash-merge, and the PERMANENT commit subject is the PR
      # title with GitHub's " (#N)" appended — a subject lint:commits
      # structurally cannot see, because it walks the branch's commits
      # and the squash subject exists only at merge. That is how an
      # 84-character subject reached main past a 72-column ceiling
      # (v1.26.0's belt merge): every branch commit was clean, the
      # title was not, and nothing looked. Compose the subject the
      # merge will mint and hold it to the same tool and config the
      # branch commits answer to. Values via env, never ${{ }} into
      # shell (the injection rule).
      #
      # HUMAN-AUTHORED TITLES ONLY (#576). A bot owns its titles and
      # regenerates them from a template: on #574 a manual retitle was
      # reverted by Renovate two minutes later, so this step blocked a
      # merge nobody present could unblock. Validating an output is
      # right exactly when the author is here to act on the error.
      # Machine-minted subjects are bounded at their INPUTS instead —
      # lint:subject-budget proves, on the pull request that introduces
      # a dependency, that every title the owned template could mint
      # for it fits. By the time the bot runs, there is nothing to
      # catch.
      - name: The squash subject is the PR title — hold it to the commit canon
        if: >-
          ${{ github.event_name == 'pull_request'
          && github.event.pull_request.user.type != 'Bot' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf '%s (#%s)\n' "${PR_TITLE}" "${PR_NUMBER}" > "${RUNNER_TEMP}/squash-subject"
          export ORG_COMMIT_MSG_FILE="${RUNNER_TEMP}/squash-subject"
          if ! mise run commits:check; then
            emsg="the PR title becomes the permanent squash subject (plus ' (#${PR_NUMBER})') and it fails the commit canon"
            emsg+=" — fix the TITLE, not a commit"
            echo "::error::${emsg}"
            exit 1
          fi
          echo "squash-subject: title mints a conforming subject"
      # (no blank line above: lint:shell-embedded captures trailing
      # blanks into the run: block and shfmt refuses them)
      - name: Run the gate
        run: mise run ci

  # The badge feed, never the gate: uploads the coverage report to
  # Codecov on pushes to main. Separate job so the required check  stays deterministic; skips clean without a floor or a token.
  coverage-upload:
    name: coverage upload (badge only)
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      # unattested-path: this gate signs and publishes nothing, so the
      # cold-build rule (#117, docs/release.md) permits caches exactly
      # here — a human is waiting on a pull request. Every signing and
      # publishing workflow builds cold and carries no cache; this
      # marker is reviewed by lint:cold-attested, which fails any
      # workflow that caches without one. Integrity does not ride the
      # cache: Go re-verifies every module read against go.sum and
      # cargo checks registry sources against Cargo.lock, so a
      # poisoned entry cannot change what compiles — and GitHub scopes
      # cache writes per branch, so a pull request cannot write the
      # default branch's entries. Restore-keys make a stale cache a
      # slower run, never a wrong one.
      - name: Restore the Go caches (unsigned gate only)
        if: ${{ hashFiles('go.sum') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gate-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gate-go-${{ runner.os }}-

      - name: Restore the cargo caches (unsigned gate only)
        if: ${{ hashFiles('Cargo.lock') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: gate-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gate-cargo-${{ runner.os }}-

      - name: Generate the report
        id: gen
        env:
          HAS_TOKEN: ${{ secrets.codecov-token != '' }}
        run: |
          set -euo pipefail
          if [[ ! -f .coverage-floor || ${HAS_TOKEN} != "true" ]] \
            || [[ ! -f Cargo.toml && ! -f go.mod ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::no floor or no token; badge upload skipped"
            exit 0
          fi
          # The belt task, never a second inline invocation: it carries
          # the repo's COVERAGE_EXCLUDE set and the llvm-tools assertion,
          # so the badge feed and the gate ratchet cannot disagree about
          # what is coverable (#316 — they did, and it reddened main).
          mise run coverage:report
          # The upload list is what the task WROTE, never a guess from
          # repo shape: a repo tracking both languages renders both
          # reports, and the previous `hashFiles('go.mod')` selector
          # named coverage.txt for every such repo — including the ones
          # whose Rust-only leg had written lcov.info.
          files=""
          [[ -f lcov.info ]] && files="lcov.info"
          [[ -f coverage.txt ]] && files="${files:+${files},}coverage.txt"
          if [[ -z ${files} ]]; then
            echo "::error::coverage:report wrote no report — nothing to upload"
            exit 1
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
      # fail_ci_if_error: TRUE, deliberately. The job is
      # continue-on-error, so a broken feed never blocks a merge — but it
      # must not report clean either. With it false, release-lab's first
      # upload died inside the CLI ("Failed to run upload-coverage") and
      # the job went green over it, which is the audit-claims defect this
      # org refuses everywhere else: a step that read nothing reporting
      # success (#316). A red badge-feed job means the badge is stale,
      # which is exactly what it means.
      - name: Upload to Codecov
        if: steps.gen.outputs.skip == 'false'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.codecov-token }}
          # The reports the task actually rendered, derived above by
          # detection rather than guessed from repo shape — a mixed repo
          # uploads both. Codecov parses lcov and Go coverprofiles
          # natively (#392).
          files: ${{ steps.gen.outputs.files }}
          fail_ci_if_error: true
...
