# The org CI gate. Callers pin by full SHA:
#
#   jobs:
#     ci:
#       uses: monumental-archive/.github/.github/workflows/ci.yml@<sha> # vX.Y.Z
#
# One SHA pins this file, the toolbelt, and its lockfile atomically: the
# canon tree below arrives via `$/.github/actions/canon` — the same
# self-repository resolution that fetched this file — so the file and
# the tree are the same release by construction, with no second
# derivation to disagree (#165; the prior carriers, a runtime context
# var and a release-time stamp, both failed — #158, #164). No inputs,
# by design — zero caller-controlled expansion.
name: ci

on:
  workflow_call:
    secrets:
      codecov-token:
        # forwarding: discretionary — only repos with coverage carry the secret
        description: >
          Codecov upload token, for the coverage badge. Optional: absent,
          the coverage job skips clean. The gate's coverage RATCHET does
          not live here — coverage:check runs inside the ci job,
          deterministic against the committed floor; this job only makes
          the number visible.
        required: false

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    env:
      # Both checkouts are trusted mise config roots; nothing else is.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The lock is law: no network resolution at run time.
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: lint:commits checks the origin/main..HEAD range.
          fetch-depth: 0
          # Tags too: checkout passes --no-tags by default even at depth
          # 0, and lint:template-pins asserts each pin names a released
          # tag (#233). Part of the checkout that already happens, so the
          # gate stays deterministic — no runtime network of its own.
          fetch-tags: true
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          cache: false

      - name: Run the gate
        run: mise run ci

  # The badge feed, never the gate: uploads the coverage report to
  # Codecov on pushes to main. Separate job so the required check  stays deterministic; skips clean without a floor or a token.
  coverage-upload:
    name: coverage upload (badge only)
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          cache: false

      - name: Generate the report
        id: gen
        env:
          HAS_TOKEN: ${{ secrets.codecov-token != '' }}
        run: |
          set -euo pipefail
          if [[ ! -f .coverage-floor || ! -f Cargo.toml || "${HAS_TOKEN}" != "true" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::no floor or no token; badge upload skipped"
            exit 0
          fi
          # The belt task, never a second inline invocation: it carries
          # the repo's COVERAGE_EXCLUDE set and the llvm-tools assertion,
          # so the badge feed and the gate ratchet cannot disagree about
          # what is coverable (#316 — they did, and it reddened main).
          mise run coverage:report
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Upload to Codecov
        if: steps.gen.outputs.skip == 'false'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.codecov-token }}
          files: lcov.info
          fail_ci_if_error: false
