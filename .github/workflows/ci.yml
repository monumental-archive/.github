# The org CI gate. Callers pin by full SHA:
#
#   jobs:
#     ci:
#       uses: monumental-archive/.github/.github/workflows/ci.yml@<sha> # vX.Y.Z
#
# One SHA pins this file, the toolbelt, and its lockfile atomically: the
# canon tree below arrives via `$/.github/actions/canon` — the same
# self-repository resolution that fetched this file — so the file and
# the tree are the same release by construction, with no second
# derivation to disagree (#165; the prior carriers, a runtime context
# var and a release-time stamp, both failed — #158, #164). No inputs,
# by design — zero caller-controlled expansion.
---
name: ci

"on":
  workflow_call:
    secrets:
      codecov-token:
        # forwarding: discretionary — only repos with coverage carry the secret
        description: >
          Codecov upload token, for the coverage badge. Optional: absent,
          the coverage job skips clean. The gate's coverage RATCHET does
          not live here — coverage:check runs inside the ci job,
          deterministic against the committed floor; this job only makes
          the number visible.
        required: false
      atlas-token:
        # forwarding: discretionary — only repos whose tests apply a schema through Atlas Pro carry the secret
        description: >
          Atlas Cloud token, exported as ATLAS_TOKEN for the ci job.
          Optional: absent, nothing reads it. atlas.hcl in a repo that
          pins a Cloud org for Pro surfaces makes every `atlas` call
          demand a login, including the one its integration tests make
          to apply the schema — so a repo that lost this on import
          (monumental-archive) had a test gate that could never go green
          (#830). The credential is the repository's own, scoped by
          Atlas to its org; the gate still forwards nothing it was not
          handed.
        required: false

permissions:
  contents: read # checkout of the caller and of the toolbelt

# WHICH RUNS WRITE A CACHE, AND WHICH FALL BACK (#1406). GitHub scopes a
# cache to the ref that saved it, and only the default branch's entries
# are readable from any other ref — so every pull request and queue entry
# that saved its own copy wrote an entry nobody else could read, and
# those copies held every repository at the 10 GB limit, evicting the
# one copy every ref could use (stele held the same 793 MB Go cache five
# times). So the gate's caches are written on a push to the default
# branch and nowhere else, and every other ref restores and never saves.
#
# These are the CALLER's run: a reusable workflow sees the caller's
# `github` context. `push` to the default branch: ref
# `refs/heads/<default>`, both true of SAVE, FALLBACK false. `pull_request`:
# ref `refs/pull/<n>/merge`, never the default branch, so SAVE false and
# FALLBACK true. `merge_group`: ref `refs/heads/gh-readonly-queue/...`,
# a branch that is not the default one, so the same. `event_name` is in
# SAVE as well as the ref, so a run on the default branch's ref that is
# not a push (`pull_request_target` runs there with a pull request's
# inputs) writes nothing. An event whose payload carries no repository
# reads as not the default branch: it restores with the fallback and
# saves nothing, which is never a write.
#
# The fallback is the other half. Off the default branch a restore may
# take the nearest earlier entry by prefix — the default branch's last
# — so a pin or lockfile change compiles or installs the difference
# instead of everything. ON the default branch it may not: a fallback
# there, saved back under the new key, carried every version ever used
# forward (#1285, #1330), so the default branch takes an exact hit or
# builds clean. Off it, nothing restored is ever saved, so nothing
# carried over is written back. release/test_gate_caches.py holds each
# cache step in ci.yml to this.
env:
  ORG_GATE_CACHE_SAVE: >-
    ${{ github.event_name == 'push'
    && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  ORG_GATE_CACHE_FALLBACK: >-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
  # The config globs jdx/mise-action v5.2.7 hashes into its cache key
  # (src/config-hash.ts MISE_CONFIG_FILE_PATTERNS, in its order, at the
  # workspace root where the action runs). The workflow's hashFiles walks
  # and digests them exactly as the action's own glob.hashFiles does, so
  # mise/gate_cache_key.py renders the key the action rendered, and then
  # adds the belt's lockfile, which these globs never reach (#1414).
  ORG_MISE_CONFIG_GLOBS: |-
    .config/mise/conf.d/*.toml
    .config/mise/conf.d/*/mise*.toml
    .config/mise/config.toml
    .config/mise/config.lock
    .config/mise/config.*.toml
    .config/mise/config.*.lock
    .config/mise/mise.toml
    .config/mise/mise.*.toml
    .config/mise/mise.lock
    .config/mise/mise.*.lock
    .config/mise.toml
    .config/mise.lock
    .config/mise.*.toml
    .config/mise.*.lock
    .mise/conf.d/*.toml
    .mise/conf.d/*/mise*.toml
    .mise/config.toml
    .mise/config.lock
    .mise/config.*.toml
    .mise/config.*.lock
    mise/conf.d/*.toml
    mise/conf.d/*/mise*.toml
    mise/config.toml
    mise/config.lock
    mise/config.*.toml
    mise/config.*.lock
    .mise.toml
    .mise.lock
    .mise.*.toml
    .mise.*.lock
    mise.toml
    mise.lock
    mise.*.toml
    mise.*.lock
    .tool-versions

jobs:
  # WHICH POSTGRES MAJORS GET A LEG (#1148). A matrix has to exist before
  # its jobs do, so the list is made first, alone, and cheaply — the
  # runner's own cargo and python3, no toolchain install — by the same
  # derivation every belt task uses (gate_surface.py over the crate's
  # `pgNN` features). It is a PLAN and is trusted as one: the `gate` job
  # below re-derives the list from the pinned toolchain and reds on any
  # difference, so an unpinned tool here can fail a gate and can never
  # pass one. A tree with no pgrx extension plans `[]` and pays about
  # twenty seconds for it.
  plan:
    name: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      majors: ${{ steps.plan.outputs.majors }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Plan one leg per declared Postgres major
        id: plan
        run: |
          set -euo pipefail
          # The canon's one writer of workflow commands (#1660).
          . .org-canon/mise/workflow-command.sh
          majors=$(.org-canon/mise/pgrx-plan.sh .org-canon)
          echo "majors=${majors}" >> "${GITHUB_OUTPUT}"
          org_notice "pgrx legs planned: ${majors}"
  # Everything the gate runs except the extension's own suite, which the
  # `pgrx` legs below run one major each. This was the job named `ci`;
  # that name now belongs to the final job, because `ci / ci` is the one
  # check the org ruleset requires and it has to mean "all of it passed".
  gate:
    name: gate
    needs: plan
    runs-on: ubuntu-26.04
    # A hung gate must fail in minutes, not at GitHub's six-hour default:
    # on #969 mise never exited after a task failed and the job held a
    # runner for 6h00m. Sized from the org's own history (2026-11-13, nine
    # repos, 167 runs): the slowest gate anywhere took 5m56s, so 30 is five
    # times the worst case and leaves room for a cold cache.
    timeout-minutes: 30
    # The artifact holding the coverage reports this run's coverage:check
    # wrote, or empty when it wrote none (#1528).
    outputs:
      coverage-reports: ${{ steps.coverage-reports.outputs.artifact-id }}
    env:
      # Both checkouts are trusted mise config roots; nothing else is.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The lock is law: no network resolution at run time.
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: lint:commits checks the origin/main..HEAD range.
          fetch-depth: 0
          # Tags too: checkout passes --no-tags by default even at depth
          # 0, and lint:template-pins asserts each pin names a released
          # tag (#233). Part of the checkout that already happens, so the
          # gate stays deterministic — no runtime network of its own.
          fetch-tags: true
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      # A MERGE GROUP IS ITS PULL REQUEST'S CURRENT HEAD (#1422). On
      # edtf#265 a push landed in the second the pull request was queued,
      # the queue built the group from the old head, and the gate passed
      # it under the new title. The group's tree must equal the pull
      # request's current head merged onto the group's base; anything
      # else, or anything unverifiable, is red by name. The token is the
      # job's own `contents: read`, for one git fetch of
      # refs/pull/<n>/head: the checkout keeps no credentials.
      - name: A merge group is the pull request's current head
        if: ${{ github.event_name == 'merge_group' }}
        env:
          ORG_QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          ORG_QUEUE_GROUP: ${{ github.event.merge_group.head_sha }}
          ORG_QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          ORG_QUEUE_TOKEN: ${{ github.token }}
        run: '"${ORG_PYTHON}" .org-canon/mise/queue_head.py'

      # The Rust toolchains live INSIDE the directory the tool cache
      # below restores (#1165). mise installs rust through rustup, and
      # rustup's home is ~/.rustup — outside mise's data directory, which
      # is the one path mise-action caches. So the cache restored every
      # tool but these, and each job downloaded each pinned toolchain
      # again: measured on a warm PR at about nine seconds a toolchain,
      # one after another, plus the components — 5 to 9 seconds for the
      # install step in a repository that pins no Rust, 39 with two
      # toolchains, 55 with four, in every job of the gate.
      #
      # Only this workflow sets it. Every signing and publishing workflow
      # installs cold with `cache: false` and keeps rustup where it was,
      # so nothing attested moves. CARGO_HOME is left alone: the cargo
      # cache below names ~/.cargo/registry.
      - name: Keep the Rust toolchains inside the tool cache
        run: echo "MISE_RUSTUP_HOME=${HOME}/.local/share/mise/rustup" >> "${GITHUB_ENV}"

      # ONLY THE BELT TOOLS THIS TREE'S TASKS CALL (#1410). The gate
      # installed all 34 belt tools in every repository, then 29 of 74
      # lints skipped on stele. mise/gate-tools.toml says when each tool
      # is needed — derived from the tasks and held to them by
      # mise/test_gate_tools.py — and the helper disables the rest
      # (MISE_DISABLE_TOOLS): not installed, not auto-installed by
      # `mise run`, not on PATH, so a lint that needs one reds by name.
      # The caller's own config installs exactly as it did, and no tool
      # it pins is ever disabled. Local runs are unchanged: nothing sets
      # it there.
      - name: Leave out the belt tools this tree does not need
        run: '"${ORG_PYTHON}" .org-canon/mise/gate_tools.py disable'

      # The tool cache's name (#1406): the key jdx/mise-action v5.2.7
      # rendered when it restored and saved this cache itself, reproduced
      # by mise/gate_cache_key.py and pinned by its test to a key the
      # action logged, then `-b` and the sha256 of the delivered belt's
      # mise.lock (#1414), so a belt tool bump names a new cache.
      # A tree that leaves belt tools out (#1410) ends it in `-off` and
      # their digest: what it installs changes with its files, which
      # neither hash sees. The prefix is untouched, so a pull request
      # still falls back to the default branch's entry.
      #
      # `mise-v2` is the cache's NAME, moved by hand when its CONTENTS
      # must change and its key would not (#1165). The key hashes the
      # mise configs and an exact hit is never re-saved, so a change to
      # WHAT is cached that touches no config keeps restoring the old
      # copy: the Rust toolchains moved inside the cached directory in
      # v1.64.2, the key stayed the same through v1.64.4, and every job
      # went on restoring a cache without them and fetching them again
      # at about ten seconds a toolchain. v2 is that change. Only this
      # job uses it: the pgrx legs name their own cache (#1408), and the
      # coverage upload installs nothing (#1528). A bump costs each
      # repository one cold install.
      - name: Name the tool cache
        id: tool-key
        env:
          ORG_MISE_CONFIG_HASH: ${{ hashFiles(env.ORG_MISE_CONFIG_GLOBS) }}
        run: '"${ORG_PYTHON}" .org-canon/mise/gate_cache_key.py mise-v2 .org-canon'

      # unattested-path: this gate signs and publishes nothing, so the
      # cold-build rule (#117, docs/release.md) permits caches exactly
      # here — a human is waiting on a pull request. The rule covers
      # TOOLS as well as build artifacts (#660): the toolchain
      # installed below restores from cache, and so do the Go and
      # cargo caches under it. Every signing and publishing workflow
      # builds cold and carries no cache; this marker is reviewed by
      # lint:cold-attested, which fails any workflow that caches
      # without one.
      #
      # The tool cache is not free, and this is the property it
      # spends: mise verifies every tool against mise.lock's
      # per-platform checksum and its GitHub attestation at INSTALL
      # time, and a restored cache skips that verification — so a
      # poisoned entry could hold a lint open that should have closed.
      # Accepted here because this gate signs nothing, because the
      # cargo cache below already accepts the identical property, and
      # because writing an Actions cache at all implies an attacker
      # already inside CI write scope. Same trust class, applied
      # consistently.
      #
      # Staleness is not the exposure: mise installs what mise.lock
      # pins, and a restored directory only spares it the download, so
      # an older cache is a slower run, never a different one. The key
      # names what is installed (mise/gate_cache_key.py): the mise
      # configs mise-action's globs find at the workspace root — on the
      # canon's own gate, mise/config.toml then mise.toml — and the
      # delivered belt's .org-canon/mise/mise.lock (#1414). #660
      # measured an earlier pin's glob following the .org-canon tree
      # through its symlink; v5.2.7's globs stop at the workspace root,
      # so the belt was out of the key and a belt tool bump was
      # installed on every run and never saved. The lockfile, not the
      # belt's config.toml: it changes exactly when a belt tool does,
      # where config.toml changes with every task body. Off the default
      # branch a missed key restores the nearest earlier entry by
      # prefix and installs only what changed (#1406).
      - name: Restore the tool cache (unsigned gate only)
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tool-key.outputs.dir }}
          key: ${{ steps.tool-key.outputs.key }}
          restore-keys: ${{ env.ORG_GATE_CACHE_FALLBACK == 'true' && steps.tool-key.outputs.prefix || '' }}

      # `cache: false` (#1406): the action restores by exact key only —
      # its restoreMiseCache passes no restore keys — and saves from
      # every ref, so the steps either side of it do both instead.
      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
          cache: false

      # unattested-path: the write half of the tool cache restored
      # above, on the same standing. It runs on a push to the default
      # branch only, and only when the restore missed: an exact hit is
      # already saved, and every other ref writes nothing (#1406).
      - name: Save the tool cache (default branch only)
        if: ${{ env.ORG_GATE_CACHE_SAVE == 'true' && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tool-key.outputs.dir }}
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}

      # unattested-path: this gate signs and publishes nothing, so
      # the cold-build rule (#117, docs/release.md) permits the Go
      # module and build caches exactly here. Each cache carries
      # its own marker (#676): the exemption is per declaration,
      # never per file.
      #
      # Integrity does not ride the artifact caches either: Go
      # re-verifies every module read against go.sum and cargo checks
      # registry sources against Cargo.lock, so a poisoned entry
      # cannot change what compiles — and GitHub scopes cache writes
      # per branch, so a pull request cannot write the default
      # branch's entries, and since #1406 it writes none at all. A
      # stale cache is a slower run, never a wrong one.
      #
      # On the default branch the Go cache takes an exact hit or
      # nothing (#1285). With restore-keys there, a go.sum change
      # restored the last cache, the run added to it and saved the
      # whole under the new key, so every module version ever used
      # rode along (stele: 1.87 GB restored in 3m58s, where one run's
      # fill is 775 MB in 17s); so a go.sum change is one cold run on
      # the default branch, 247s on stele. Every other ref takes the
      # fallback and saves nothing (#1406): a pull request or queue
      # entry that changes go.sum starts from the default branch's last
      # cache and compiles the difference, and what it carried over is
      # never written back — the growth #1285 measured has no way in.
      # Before #1406 those refs paid the cold run too, each saving a
      # copy no other ref could read. Both paths stay cached: modules
      # alone measured 241s against 62s (#1181). v2 leaves the
      # oversized v1 entries behind.
      - name: Restore the Go caches (unsigned gate only)
        id: go-cache
        if: ${{ hashFiles('go.sum') != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gate-go-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ env.ORG_GATE_CACHE_FALLBACK == 'true' && format('gate-go-v2-{0}-', runner.os) || '' }}

      # unattested-path: same standing as the Go caches above — this
      # gate signs and publishes nothing, cargo checks every registry
      # source against Cargo.lock, and GitHub scopes cache writes per
      # branch; since #1406 only the default branch writes at all.
      # Marked per declaration (#676). The fallback is off the default
      # branch only, for the Go cache's reason: a fallback restored and
      # saved back under a new key is the growth #1330 measured.
      #
      # ~/.pgrx/config.toml rides with `target` because the two are one
      # unit (#1165): pgrx-pg-sys's build script declares
      # `rerun-if-changed` on that file, so a restored `target` beside
      # a config.toml written fresh this run is a cache that hits and
      # then recompiles pgrx-pg-sys and everything above it — measured
      # as 65 of a leg's 70 seconds. Restored together, the file keeps
      # the timestamp the cached build was made against, and
      # `org_pgrx_init` keeps it when the registrations are unchanged.
      # A path that does not exist — every repository without an
      # extension — is skipped by the action.
      - name: Restore the cargo caches (unsigned gate only)
        id: cargo-cache
        if: ${{ hashFiles('Cargo.lock') != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.pgrx/config.toml
            target
          key: gate-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ env.ORG_GATE_CACHE_FALLBACK == 'true' && format('gate-cargo-{0}-', runner.os) || '' }}

      # PRs squash-merge, and the PERMANENT commit message is the PR
      # title with GitHub's " (#N)" appended, then the PR body — neither
      # of which lint:commits can see, because it walks the branch's
      # commits and the squash message exists only at merge. That is how
      # an 84-character subject reached main past a 72-column ceiling
      # (v1.26.0's belt merge): every branch commit was clean, the title
      # was not, and nothing looked. Compose the message the merge will
      # mint and hold it to the same tool and config the branch commits
      # answer to. Values via env, never ${{ }} into shell (the
      # injection rule) — and the BODY especially: it is
      # attacker-controlled on a fork PR, which is the template
      # injection shape lint:zizmor exists to refuse.
      #
      # The body half is #880, and it is a gap rather than a tolerated
      # norm — measured before extending, because "everyone's bodies run
      # long" is the obvious excuse and it is false: zero body-line
      # failures in 60 consumer commits across five repos. The rule is
      # wrap-aware, so the bare URLs and trailers that push real bodies
      # past column 72 pass; what fails is prose and wide tables. The
      # only failing body on main is 4914509's, which is the commit that
      # motivated this and the regression fixture for it.
      #
      # HUMAN-AUTHORED TITLES ONLY (#576). A bot owns its titles and
      # regenerates them from a template: on #574 a manual retitle was
      # reverted by Renovate two minutes later, so this step blocked a
      # merge nobody present could unblock. Validating an output is
      # right exactly when the author is here to act on the error.
      # Machine-minted subjects are bounded at their INPUTS instead —
      # lint:subject-budget proves, on the pull request that introduces
      # a dependency, that every title the owned template could mint
      # for it fits. By the time the bot runs, there is nothing to
      # catch.
      - name: The squash message is the PR title and body — hold it to the commit canon
        if: >-
          ${{ github.event_name == 'pull_request'
          && github.event.pull_request.user.type != 'Bot' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The composition, the title's own-reference refusal (#800) and
        # the CRLF body (#880): mise/squash_message.py (#1386).
        run: '"${ORG_PYTHON}" .org-canon/mise/squash_message.py'
      # (no blank line above: lint:shell-embedded captures trailing
      # blanks into the run: block and shfmt refuses them)
      - name: Run the gate
        env:
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
          # The planned legs. With this set, test:pgrx runs no suite here
          # — the legs do — and instead holds the plan to the list it
          # derives from the pinned toolchain.
          ORG_PGRX_FANNED: ${{ needs.plan.outputs.majors }}
          # Where coverage:check writes its reports: outside the
          # checkout, so nothing the gate measures lands in the tree
          # (#1628). The step below keeps this directory.
          ORG_COVERAGE_REPORTS: ${{ runner.temp }}/coverage-reports
        run: mise run ci

      # COVERAGE IS MEASURED ONCE, HERE (#1528). coverage:check, which
      # `ci` runs, writes the report each leg's number came from into
      # ORG_COVERAGE_REPORTS and prints `coverage:check: upload
      # <paths>`; this is that directory, kept for the badge job, which
      # downloads it beside the checkout, uploads it and measures
      # nothing (#1628).
      # It used to run the whole suite a second time with five tools
      # where the gate has the belt, and on main it hung in a test the
      # gate passes, for its 30 minutes, on every push for a day. On a
      # push to the default branch only, where the badge is fed; a tree
      # without a floor writes none, and the badge job skips.
      - name: Keep the coverage reports for the badge (default branch only)
        id: coverage-reports
        if: >-
          ${{ github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: ${{ runner.temp }}/coverage-reports
          if-no-files-found: ignore
          retention-days: 1

      # The figures the release job derives the floor from (#1622). The
      # same `<leg> <percent>` lines coverage:check judged, written beside
      # the reports, kept under the commit's own name on the two runs
      # that judge the tree that lands: the merge queue's (in a squash
      # queue the group commit IS the commit that lands) and the push to
      # the default branch. Never a pull request's run: its commit is not
      # the one that lands. The release job reads this artifact for its
      # commit and measures nothing; without it, it measures as before.
      - name: Keep the coverage figures for the release
        if: >-
          ${{ github.event_name == 'merge_group'
          || (github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-figures-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-reports/coverage-figures.txt
          if-no-files-found: ignore
          retention-days: 7

      # unattested-path: the write half of the Go caches restored
      # above, on their standing: a push to the default branch that
      # missed them saves them, and every other ref writes nothing
      # (#1406).
      - name: Save the Go caches (default branch only)
        if: >-
          ${{ env.ORG_GATE_CACHE_SAVE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
          && hashFiles('go.sum') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # unattested-path: the write half of the cargo caches restored
      # above, on their standing: a push to the default branch that
      # missed them saves them, and every other ref writes nothing
      # (#1406).
      - name: Save the cargo caches (default branch only)
        if: >-
          ${{ env.ORG_GATE_CACHE_SAVE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
          && hashFiles('Cargo.lock') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.pgrx/config.toml
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # ONE POSTGRES MAJOR PER RUNNER. Serially, inside the gate job, the
  # five took the gate from about a minute to 8m14s (release-lab) and
  # 8m48s (edtf) — paid twice per merge, since the merge queue runs it
  # again. Each leg runs the SAME task a laptop runs, `test:pgrx`, with
  # one major named; locally the task runs every major side by side. One
  # derivation, one unit, two places to run it.
  #
  # fail-fast is off: which majors pass is the information, and a leg
  # cancelled because its neighbour failed reports nothing.
  pgrx:
    name: pgrx (pg${{ matrix.major }})
    needs: plan
    if: ${{ needs.plan.outputs.majors != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(needs.plan.outputs.majors) }}
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
      # The list holds only if `mise run` keeps to it (#1408). Measured
      # on mise 2026.11.6: by default `mise run` installs every tool the
      # config pins and the data directory lacks, before the task, so
      # the whole toolset would install in the next step instead.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      # Same placement as the `gate` job's, for the same reason (#1165).
      - name: Keep the Rust toolchains inside the tool cache
        run: echo "MISE_RUSTUP_HOME=${HOME}/.local/share/mise/rustup" >> "${GITHUB_ENV}"

      # WHAT A LEG INSTALLS (#1408): what `test:pgrx` calls, and nothing
      # else. It installed the caller's whole config — measured on edtf,
      # 222 to 278 s per leg to run an 8 to 9 s suite, or a 1.7 GB cache
      # restore on a hit — for linters, node, cargo-fuzz, the MSRV
      # toolchains and four Postgres majors it never ran. The caller's
      # config decides the versions, the canon decides which tools
      # (#1333): the first Rust, cargo-pgrx, and the one Postgres entry
      # at this leg's major. release/test_job_installs.py holds the list
      # to the calls of pgrx-test.sh and pgrx-env.sh.
      - name: Read the caller's pinned build inputs
        id: pins
        env:
          ORG_PGRX_MAJOR: ${{ matrix.major }}
        run: |
          "${ORG_PYTHON}" .org-canon/release/caller_pins.py install \
            --input-of "every pgrx leg of the gate" \
            --major "postgresql-binaries=${ORG_PGRX_MAJOR}" \
            rust cargo-pgrx >> "${GITHUB_OUTPUT}"
      # The tool cache's name (#1406, #1414), apart from the gate's
      # (#1408). The NAME carries the leg's major, so it is the fallback
      # prefix: a pg14 leg never restores a pg18 leg's cache. The KEY
      # also carries a digest of the install list (`--install`), so a
      # pin bump names a new cache while the prefix still finds the last
      # one and installs only what moved. ORG_TOOL_INSTALL is the
      # install step's install_args, word for word
      # (release/test_gate_caches.py). Move `v1` when the cache's
      # CONTENTS must change and its key would not (#1165).
      - name: Name the tool cache
        id: tool-key
        env:
          ORG_MISE_CONFIG_HASH: ${{ hashFiles(env.ORG_MISE_CONFIG_GLOBS) }}
          ORG_PGRX_MAJOR: ${{ matrix.major }}
          ORG_TOOL_INSTALL: jq aqua:taiki-e/cargo-llvm-cov ${{ steps.pins.outputs.install }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/gate_cache_key.py "mise-pgrx-v1-pg${ORG_PGRX_MAJOR}" \
            .org-canon --install "${ORG_TOOL_INSTALL}"
      # unattested-path: this gate signs and publishes nothing, so the
      # cold-build rule (#117, docs/release.md) permits the tool cache
      # exactly here, on the same reasoning and with the same accepted
      # property as the `gate` job's own tool cache above, and is
      # restored and saved as it is there (#1406).
      - name: Restore the tool cache (unsigned gate only)
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tool-key.outputs.dir }}
          key: ${{ steps.tool-key.outputs.key }}
          restore-keys: ${{ env.ORG_GATE_CACHE_FALLBACK == 'true' && steps.tool-key.outputs.prefix || '' }}

      # `cache: false` (#1406): the action restores by exact key only —
      # its restoreMiseCache passes no restore keys — and saves from
      # every ref, so the steps either side of it do both instead.
      - name: Install mise and the leg's tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
          cache: false
          # belt tools by the belt's keys, then the caller's inputs.
          # cargo-llvm-cov: a repository with a floor measures its
          # extension in this run (#1656).
          install_args: jq aqua:taiki-e/cargo-llvm-cov ${{ steps.pins.outputs.install }}

      # unattested-path: the write half of the tool cache restored
      # above, on the same standing. It runs on a push to the default
      # branch only, and only when the restore missed: an exact hit is
      # already saved, and every other ref writes nothing (#1406).
      - name: Save the tool cache (default branch only)
        if: ${{ env.ORG_GATE_CACHE_SAVE == 'true' && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tool-key.outputs.dir }}
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}

      # unattested-path: this gate signs and publishes nothing, so the
      # cold-build rule (#117, docs/release.md) permits the cargo cache
      # exactly here. Keyed per major, because each major's build of the
      # extension is its own artifact set; cargo checks registry sources
      # against Cargo.lock, so a poisoned entry cannot change what
      # compiles. ~/.pgrx/config.toml rides with `target`, as in the
      # `gate` job and for the reason given there (#1165).
      - name: Restore the cargo caches (unsigned gate only)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.pgrx/config.toml
            target
          key: gate-pgrx-${{ matrix.major }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: >-
            ${{ env.ORG_GATE_CACHE_FALLBACK == 'true'
            && format('gate-pgrx-{0}-{1}-', matrix.major, runner.os) || '' }}

      - name: Run the extension's suite at this major
        env:
          ORG_PGRX_MAJOR: ${{ matrix.major }}
          # Where a measured run writes its report: outside the working
          # tree (#1628), the directory the next step keeps.
          ORG_COVERAGE_REPORTS: ${{ runner.temp }}/coverage-reports
        run: mise run test:pgrx

      # This major's figure, for the release job (#1692): the
      # `pgrx-pgNN <percent>` line test:pgrx held to the floor above,
      # written beside its report, kept under the major's and the
      # commit's name on the two runs that judge the tree that lands (as
      # the gate job's figures, #1622). The release job reads one per
      # declared major and measures the extension only when one is
      # missing.
      - name: Keep the leg's coverage figure for the release
        if: >-
          ${{ github.event_name == 'merge_group'
          || (github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-figures-pgrx-pg${{ matrix.major }}-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-reports/coverage-figures.txt
          if-no-files-found: ignore
          retention-days: 7

      # The leg's own coverage report (#1656): where the repository holds
      # a floor, test:pgrx measured this major's run and wrote
      # lcov-pgrx-pgNN.info into ORG_COVERAGE_REPORTS. Kept for the badge
      # job on a push to the default branch only, like the gate's
      # reports; a tree with no floor writes none.
      - name: Keep the leg's coverage report for the badge (default branch only)
        if: >-
          ${{ github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports-pgrx-pg${{ matrix.major }}
          path: ${{ runner.temp }}/coverage-reports
          if-no-files-found: ignore
          retention-days: 1

      # unattested-path: the write half of the cargo caches restored
      # above, on their standing: a push to the default branch that
      # missed them saves them, and every other ref writes nothing
      # (#1406).
      - name: Save the cargo caches (default branch only)
        if: >-
          ${{ env.ORG_GATE_CACHE_SAVE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.pgrx/config.toml
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # THE REQUIRED CHECK. `ci / ci` is the one context the org ruleset
  # names, so it must be red unless every part of the gate was green.
  # `always()` is load-bearing: without it a failed `gate` SKIPS this
  # job, and a skipped required check counts as passing. The legs may be
  # skipped only when none were planned.
  ci:
    name: ci
    needs:
      - plan
      - gate
      - pgrx
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        env:
          PLAN: ${{ needs.plan.result }}
          GATE: ${{ needs.gate.result }}
          PGRX: ${{ needs.pgrx.result }}
          MAJORS: ${{ needs.plan.outputs.majors }}
        # Prints what the jobs above computed, one name/result pair at a
        # time; the pgrx legs may be skipped only when none were planned.
        # Every branch is a row in mise/test_gate_verdict.py (#1386).
        run: |
          set -euo pipefail
          status=0
          for pair in "plan=${PLAN}" "gate=${GATE}" "pgrx legs=${PGRX}"; do
            name=${pair%%=*} result=${pair#*=}
            [[ ${result} != success ]] || continue
            if [[ ${name} == "pgrx legs" && ${result} == skipped ]]; then
              [[ ${MAJORS} != "[]" ]] || continue
              # No canon tree in this job: the command is a literal, and the
              # outside text follows on a plain line, never at its start (#1660).
              echo "::error::pgrx legs were skipped although majors were planned"
              printf '  planned: %q\n' "${MAJORS}"
            else
              echo "::error::a job the gate needs did not succeed"
              printf '  job %q: %q\n' "${name}" "${result}"
            fi
            status=1
          done
          [[ ${status} -eq 0 ]] || exit 1
          printf 'ci: plan, gate and every pgrx leg (%q) passed\n' "${MAJORS}"
  # The badge feed, never the gate: uploads the coverage reports the
  # gate's own coverage:check wrote to Codecov, on pushes to main.
  # Separate job so the required check stays deterministic; skips clean
  # without a floor or a token.
  #
  # IT MEASURES NOTHING (#1528). It re-ran every leg with a toolset of
  # its own, five tools where the gate has the belt, and a test that
  # needs a tool it lacked hung it for its 30 minutes on every push to
  # main. Now it installs nothing and runs no task: the number the
  # badge shows is the number the gate enforced, from one run.
  # release/test_job_installs.py holds it to that.
  coverage-upload:
    name: coverage upload (badge only)
    needs:
      - gate
      - ci
    # `!cancelled()` and the explicit result are load-bearing (#1161).
    # An `if:` with no status function gets an implicit `success()`,
    # and that is false when ANY ancestor was skipped — which the pgrx
    # leg is in every repository with no extension crate. From the day
    # that leg arrived this job was skipped in stele and iiif-server on
    # every push: stele's Codecov figure froze, iiif-server's never
    # existed, and nothing went red because a skip is not a failure.
    if: >-
      ${{ !cancelled() && needs.ci.result == 'success'
      && needs.gate.outputs.coverage-reports != ''
      && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # The tree the reports name, for Codecov's path mapping.
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gate's artifact and each pgrx leg's (#1656), into one
      # directory: their file names never collide.
      - name: Fetch the reports the gate wrote
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-reports*
          merge-multiple: true

      # The list is what the gate's artifact holds, in coverage:check's
      # order, and the step names it: the files the gate wrote.
      - name: List the reports
        id: gen
        env:
          HAS_TOKEN: ${{ secrets.codecov-token != '' }}
        run: |
          set -euo pipefail
          files=""
          if [[ ${HAS_TOKEN} != "true" ]]; then
            echo "::notice::no token; badge upload skipped"
          else
            for f in lcov.info lcov-typescript.info coverage.txt coverage.xml lcov-pgrx-pg*.info; do
              [[ ! -f ${f} ]] || files="${files:+${files},}${f}"
            done
            if [[ -z ${files} ]]; then
              echo "::error::the gate's coverage-reports artifact holds no report"
              exit 1
            fi
            printf 'upload %q\n' "${files}"
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
      # fail_ci_if_error: TRUE, deliberately. The job is
      # continue-on-error, so a broken feed never blocks a merge — but it
      # must not report clean either. With it false, release-lab's first
      # upload died inside the CLI ("Failed to run upload-coverage") and
      # the job went green over it, which is the audit-claims defect this
      # org refuses everywhere else: a step that read nothing reporting
      # success (#316). A red badge-feed job means the badge is stale,
      # which is exactly what it means.
      - name: Upload to Codecov
        if: steps.gen.outputs.files != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.codecov-token }}
          # The reports the gate's coverage:check wrote and the step
          # above listed. Codecov parses lcov, Cobertura XML and Go
          # coverprofiles natively (#392).
          files: ${{ steps.gen.outputs.files }}
          fail_ci_if_error: true
...
