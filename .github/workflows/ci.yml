# The org CI gate. Callers pin by full SHA:
#
#   jobs:
#     ci:
#       uses: monumental-archive/.github/.github/workflows/ci.yml@<sha> # vX.Y.Z
#
# One SHA pins this file, the toolbelt, and its lockfile atomically: the
# canon tree below arrives via `$/.github/actions/canon` — the same
# self-repository resolution that fetched this file — so the file and
# the tree are the same release by construction, with no second
# derivation to disagree (#165; the prior carriers, a runtime context
# var and a release-time stamp, both failed — #158, #164). No inputs,
# by design — zero caller-controlled expansion.
---
name: ci

"on":
  workflow_call:
    secrets:
      codecov-token:
        # forwarding: discretionary — only repos with coverage carry the secret
        description: >
          Codecov upload token, for the coverage badge. Optional: absent,
          the coverage job skips clean. The gate's coverage RATCHET does
          not live here — coverage:check runs inside the ci job,
          deterministic against the committed floor; this job only makes
          the number visible.
        required: false
      atlas-token:
        # forwarding: discretionary — only repos whose tests apply a schema through Atlas Pro carry the secret
        description: >
          Atlas Cloud token, exported as ATLAS_TOKEN for the ci job.
          Optional: absent, nothing reads it. atlas.hcl in a repo that
          pins a Cloud org for Pro surfaces makes every `atlas` call
          demand a login, including the one its integration tests make
          to apply the schema — so a repo that lost this on import
          (monumental-archive) had a test gate that could never go green
          (#830). The credential is the repository's own, scoped by
          Atlas to its org; the gate still forwards nothing it was not
          handed.
        required: false

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    env:
      # Both checkouts are trusted mise config roots; nothing else is.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The lock is law: no network resolution at run time.
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: lint:commits checks the origin/main..HEAD range.
          fetch-depth: 0
          # Tags too: checkout passes --no-tags by default even at depth
          # 0, and lint:template-pins asserts each pin names a released
          # tag (#233). Part of the checkout that already happens, so the
          # gate stays deterministic — no runtime network of its own.
          fetch-tags: true
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      # unattested-path: this gate signs and publishes nothing, so the
      # cold-build rule (#117, docs/release.md) permits caches exactly
      # here — a human is waiting on a pull request. The rule covers
      # TOOLS as well as build artifacts (#660): the toolchain
      # installed below restores from cache, and so do the Go and
      # cargo caches under it. Every signing and publishing workflow
      # builds cold and carries no cache; this marker is reviewed by
      # lint:cold-attested, which fails any workflow that caches
      # without one.
      #
      # The tool cache is not free, and this is the property it
      # spends: mise verifies every tool against mise.lock's
      # per-platform checksum and its GitHub attestation at INSTALL
      # time, and a restored cache skips that verification — so a
      # poisoned entry could hold a lint open that should have closed.
      # Accepted here because this gate signs nothing, because the
      # cargo cache below already accepts the identical property, and
      # because writing an Actions cache at all implies an attacker
      # already inside CI write scope. Same trust class, applied
      # consistently.
      #
      # Staleness is not the exposure: mise-action keys its cache on
      # the hash of every mise config the workspace exposes — the
      # delivered .org-canon tree included, which its glob follows
      # through the symlink — so a canon pin bump asks for a key that
      # does not exist yet and installs cold. Measured against the
      # pinned action's own glob (#660): changing the delivered
      # config.toml changes the key, changing mise.lock alone changes
      # the key, an unrelated workspace file leaves it identical.
      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.12
          cache: true

      # unattested-path: this gate signs and publishes nothing, so
      # the cold-build rule (#117, docs/release.md) permits the Go
      # module and build caches exactly here. Each cache carries
      # its own marker (#676): the exemption is per declaration,
      # never per file.
      #
      # Integrity does not ride the artifact caches either: Go
      # re-verifies every module read against go.sum and cargo checks
      # registry sources against Cargo.lock, so a poisoned entry
      # cannot change what compiles — and GitHub scopes cache writes
      # per branch, so a pull request cannot write the default
      # branch's entries. Restore-keys make a stale cache a slower
      # run, never a wrong one.
      - name: Restore the Go caches (unsigned gate only)
        if: ${{ hashFiles('go.sum') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gate-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gate-go-${{ runner.os }}-

      # unattested-path: same standing as the Go caches above — this
      # gate signs and publishes nothing, cargo checks every registry
      # source against Cargo.lock, and GitHub scopes cache writes per
      # branch. Marked per declaration (#676).
      - name: Restore the cargo caches (unsigned gate only)
        if: ${{ hashFiles('Cargo.lock') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: gate-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gate-cargo-${{ runner.os }}-

      # PRs squash-merge, and the PERMANENT commit message is the PR
      # title with GitHub's " (#N)" appended, then the PR body — neither
      # of which lint:commits can see, because it walks the branch's
      # commits and the squash message exists only at merge. That is how
      # an 84-character subject reached main past a 72-column ceiling
      # (v1.26.0's belt merge): every branch commit was clean, the title
      # was not, and nothing looked. Compose the message the merge will
      # mint and hold it to the same tool and config the branch commits
      # answer to. Values via env, never ${{ }} into shell (the
      # injection rule) — and the BODY especially: it is
      # attacker-controlled on a fork PR, which is the template
      # injection shape lint:zizmor exists to refuse.
      #
      # The body half is #880, and it is a gap rather than a tolerated
      # norm — measured before extending, because "everyone's bodies run
      # long" is the obvious excuse and it is false: zero body-line
      # failures in 60 consumer commits across five repos. The rule is
      # wrap-aware, so the bare URLs and trailers that push real bodies
      # past column 72 pass; what fails is prose and wide tables. The
      # only failing body on main is 4914509's, which is the commit that
      # motivated this and the regression fixture for it.
      #
      # HUMAN-AUTHORED TITLES ONLY (#576). A bot owns its titles and
      # regenerates them from a template: on #574 a manual retitle was
      # reverted by Renovate two minutes later, so this step blocked a
      # merge nobody present could unblock. Validating an output is
      # right exactly when the author is here to act on the error.
      # Machine-minted subjects are bounded at their INPUTS instead —
      # lint:subject-budget proves, on the pull request that introduces
      # a dependency, that every title the owned template could mint
      # for it fits. By the time the bot runs, there is nothing to
      # catch.
      - name: The squash message is the PR title and body — hold it to the commit canon
        if: >-
          ${{ github.event_name == 'pull_request'
          && github.event.pull_request.user.type != 'Bot' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The title is this composition's INPUT, so it must not already
          # contain its OUTPUT: GitHub appends " (#N)" unconditionally,
          # and a title ending in this PR's own number mints the
          # reference twice in the permanent subject. It happened on both
          # PRs where an author wrote the number in (#783 and #788), and
          # the 72-column ceiling structurally cannot catch it — an
          # appended "(#N)" is an unwrappable tail, and committed is
          # wrap-aware by ruling (mise/committed.toml), so the 78-column
          # duplicate passed legitimately. This is that mechanism one
          # composition step short, asked here where the author is
          # present and the fix is a title edit (#800, #576's test).
          #
          # This PR's OWN number only. A title ending in the ISSUE's
          # reference is the convention — 39 subjects on main carry the
          # issue ref then the PR's — so a check refusing any trailing
          # reference would refuse the convention it exists to protect.
          if [[ ${PR_TITLE} == *"(#${PR_NUMBER})" ]]; then
            emsg="the PR title already ends in this pull request's own reference (#${PR_NUMBER}),"
            emsg+=" and the merge appends it again — the permanent subject would carry it twice"
            emsg+=" — fix the TITLE: it carries the ISSUE reference only, the squash appends the PR's"
            echo "::error::${emsg}"
            exit 1
          fi
          msg="${RUNNER_TEMP}/squash-message"
          printf '%s (#%s)\n' "${PR_TITLE}" "${PR_NUMBER}" > "${msg}"
          # The BODY is the other permanent half (#880). The API serves
          # it CRLF-terminated, so strip the CR before measuring: a
          # Windows author must not fail on characters they cannot see.
          body=${PR_BODY:-}
          body=${body//$'\r'/}
          # A body that is empty or only whitespace composes to the
          # subject alone — exactly the behaviour before this, so the
          # change is strictly additive and adds no trailing blank.
          if [[ -n ${body//[[:space:]]/} ]]; then
            printf '\n%s\n' "${body}" >> "${msg}"
          fi
          export ORG_COMMIT_MSG_FILE="${msg}"
          if ! mise run commits:check; then
            emsg="the PR title and body become the permanent squash subject (plus ' (#${PR_NUMBER})') and body,"
            emsg+=" and they fail the commit canon — fix the TITLE or the BODY, not a commit"
            echo "::error::${emsg}"
            exit 1
          fi
          echo "squash-message: title and body mint a conforming commit"
      # (no blank line above: lint:shell-embedded captures trailing
      # blanks into the run: block and shfmt refuses them)
      - name: Run the gate
        env:
          ATLAS_TOKEN: ${{ secrets.atlas-token }}
        run: mise run ci

  # The badge feed, never the gate: uploads the coverage report to
  # Codecov on pushes to main. Separate job so the required check  stays deterministic; skips clean without a floor or a token.
  coverage-upload:
    name: coverage upload (badge only)
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      # unattested-path: this gate signs and publishes nothing, so the
      # cold-build rule (#117, docs/release.md) permits caches exactly
      # here — a human is waiting on a pull request. The rule covers
      # TOOLS as well as build artifacts (#660): the toolchain
      # installed below restores from cache, and so do the Go and
      # cargo caches under it. Every signing and publishing workflow
      # builds cold and carries no cache; this marker is reviewed by
      # lint:cold-attested, which fails any workflow that caches
      # without one.
      #
      # The tool cache is not free, and this is the property it
      # spends: mise verifies every tool against mise.lock's
      # per-platform checksum and its GitHub attestation at INSTALL
      # time, and a restored cache skips that verification — so a
      # poisoned entry could hold a lint open that should have closed.
      # Accepted here because this gate signs nothing, because the
      # cargo cache below already accepts the identical property, and
      # because writing an Actions cache at all implies an attacker
      # already inside CI write scope. Same trust class, applied
      # consistently.
      #
      # Staleness is not the exposure: mise-action keys its cache on
      # the hash of every mise config the workspace exposes — the
      # delivered .org-canon tree included, which its glob follows
      # through the symlink — so a canon pin bump asks for a key that
      # does not exist yet and installs cold. Measured against the
      # pinned action's own glob (#660): changing the delivered
      # config.toml changes the key, changing mise.lock alone changes
      # the key, an unrelated workspace file leaves it identical.
      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.12
          cache: true

      # unattested-path: this gate signs and publishes nothing, so
      # the cold-build rule (#117, docs/release.md) permits the Go
      # module and build caches exactly here. Each cache carries
      # its own marker (#676): the exemption is per declaration,
      # never per file.
      #
      # Integrity does not ride the artifact caches either: Go
      # re-verifies every module read against go.sum and cargo checks
      # registry sources against Cargo.lock, so a poisoned entry
      # cannot change what compiles — and GitHub scopes cache writes
      # per branch, so a pull request cannot write the default
      # branch's entries. Restore-keys make a stale cache a slower
      # run, never a wrong one.
      - name: Restore the Go caches (unsigned gate only)
        if: ${{ hashFiles('go.sum') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gate-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gate-go-${{ runner.os }}-

      # unattested-path: same standing as the Go caches above — this
      # gate signs and publishes nothing, cargo checks every registry
      # source against Cargo.lock, and GitHub scopes cache writes per
      # branch. Marked per declaration (#676).
      - name: Restore the cargo caches (unsigned gate only)
        if: ${{ hashFiles('Cargo.lock') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: gate-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gate-cargo-${{ runner.os }}-

      - name: Generate the report
        id: gen
        env:
          HAS_TOKEN: ${{ secrets.codecov-token != '' }}
        run: |
          set -euo pipefail
          if [[ ! -f .coverage-floor || ${HAS_TOKEN} != "true" ]] \
            || [[ ! -f Cargo.toml && ! -f go.mod ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::no floor or no token; badge upload skipped"
            exit 0
          fi
          # The belt task, never a second inline invocation: it carries
          # the repo's COVERAGE_EXCLUDE set and the llvm-tools assertion,
          # so the badge feed and the gate ratchet cannot disagree about
          # what is coverable (#316 — they did, and it reddened main).
          mise run coverage:report
          # The upload list is what the task WROTE, never a guess from
          # repo shape: a repo tracking both languages renders both
          # reports, and the previous `hashFiles('go.mod')` selector
          # named coverage.txt for every such repo — including the ones
          # whose Rust-only leg had written lcov.info.
          files=""
          [[ -f lcov.info ]] && files="lcov.info"
          [[ -f coverage.txt ]] && files="${files:+${files},}coverage.txt"
          if [[ -z ${files} ]]; then
            echo "::error::coverage:report wrote no report — nothing to upload"
            exit 1
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
      # fail_ci_if_error: TRUE, deliberately. The job is
      # continue-on-error, so a broken feed never blocks a merge — but it
      # must not report clean either. With it false, release-lab's first
      # upload died inside the CLI ("Failed to run upload-coverage") and
      # the job went green over it, which is the audit-claims defect this
      # org refuses everywhere else: a step that read nothing reporting
      # success (#316). A red badge-feed job means the badge is stale,
      # which is exactly what it means.
      - name: Upload to Codecov
        if: steps.gen.outputs.skip == 'false'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.codecov-token }}
          # The reports the task actually rendered, derived above by
          # detection rather than guessed from repo shape — a mixed repo
          # uploads both. Codecov parses lcov and Go coverprofiles
          # natively (#392).
          files: ${{ steps.gen.outputs.files }}
          fail_ci_if_error: true
...
