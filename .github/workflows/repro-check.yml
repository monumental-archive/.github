# Reproducibility audit: rebuild the latest release and prove the bytes.
#
# Best Practices Silver's build_repeatable is a MUST, and the org's answer
# is proof rather than assertion: this workflow re-runs the REAL class
# workflow (rust-binary, go-binary or pgrx-extension) — same file, same
# steps, no parallel
# implementation to drift — against the released tag, and compares the
# rebuilt archives' digests with the checksums the release published. A
# mismatch means a build input escaped the pinning (a nondeterministic
# proc macro, an environment leak) and files loudly.
#
# ONE class per run, and the verdict is scoped to it (#595). The released
# evidence manifest types every artifact with the class that built it
# (stele#185), so the population is that class's artifacts and nothing
# else. Judging the whole release against one class's rebuild called
# every OTHER class missing from it — thirteen of fourteen artifacts on
# release-lab v0.25.3, and two supply-chain issues filed against a
# release that was fine (release-lab#226, #227). A release carrying no
# such typing keeps the whole-release population, and the run states
# which of the two it judged rather than letting one read as the other.
#
# One target by default: reproducibility across REBUILDS is the property
# under test; the per-target archives already differ from each other by
# construction. That target is DECLARED to the judge (#637): the same
# input that drives the rebuild matrix is passed as `--targets`, so the
# judged population is the targets this run covered and the class's other
# targets produce nothing — no finding, no count, no cell. How many
# targets a run declares is a caller-side dial and a recurring-spend
# decision; the mechanism is correct at every setting.
# audit-shaped, never in a gate: it
# takes minutes of compile time and proves a property of the release,
# not of a diff.
---
name: repro-check

"on":
  workflow_call:
    inputs:
      class:
        description: Which class workflow rebuilds the release.
        required: false
        type: string
        default: rust-binary
      target:
        description: Canary target (rust-binary class).
        required: false
        type: string
        default: x86_64-unknown-linux-musl
      go-target:
        description: Canary target (go-binary class), named <goos>-<goarch>.
        required: false
        type: string
        default: linux-amd64
      extension-crate-dir:
        description: Extension crate dir (pgrx-extension class).
        required: false
        type: string
        default: ""
      pg-major:
        description: Canary PG major (pgrx-extension class).
        required: false
        type: string
        default: "18"
      exclude:
        description: >-
          Workspace members to exclude from the runner-side cargo build
          (rust-binary class) — same value the caller's publish passes.
          Without it a workspace with a pgrx crate rebuilds that crate on
          the bare runner and dies on the missing PGRX_HOME.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  resolve:
    name: Resolve the latest release and its published checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
      checksums: ${{ steps.rel.outputs.checksums }}
      manifest: ${{ steps.rel.outputs.manifest }}
    steps:
      - name: Read the latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)
          if [[ ! ${tag} =~ ^v[0-9] ]]; then
            echo "::error::latest release tag ${tag} is not a v* release"
            exit 1
          fi
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern checksums.txt --output checksums.txt
          if [[ ! -s checksums.txt ]]; then
            echo "::error::release ${tag} has no checksums.txt — nothing to prove against"
            exit 1
          fi
          # Which artifacts a class built is the RELEASE's own answer, and
          # it lives in the evidence manifest's per-entry typing. Fetched
          # best-effort because not every release has one to give: a
          # release older than the manifest, or one below the schema that
          # types entries, carries no answer — schema 1 has no `entries`
          # key at all.
          #
          # Such a manifest is NOT handed on. Its build-subject population
          # is zero, which seals CANNOT_JUDGE and exits non-zero, filing a
          # false issue of a new shape (measured: exit 4). A release that
          # cannot answer keeps the whole-release comparison it shipped
          # under, and the verdict says so. Same reasoning, same schema-1
          # case, as attach-release.yml's resume guard.
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --pattern evidence-manifest.json --output evidence-manifest.json 2> /dev/null || true
          typed=""
          if [[ -s evidence-manifest.json ]]; then
            typed=$(jq -r '(.entries // [])[0].name // empty' evidence-manifest.json)
          fi
          manifest=""
          if [[ -n ${typed} ]]; then
            manifest=$(< evidence-manifest.json)
            echo "::notice::${tag} types its entries — the rebuilt class scopes the population"
          else
            echo "::notice::${tag} carries no per-class typing — judging every build subject it published"
          fi
          {
            echo "checksums<<CHECKSUMS_EOF"
            cat checksums.txt
            echo "CHECKSUMS_EOF"
            echo "manifest<<MANIFEST_EOF"
            printf '%s\n' "${manifest}"
            echo "MANIFEST_EOF"
            echo "tag=${tag}"
            echo "version=${tag#v}"
          } >> "${GITHUB_OUTPUT}"
          echo "::notice::proving ${tag} reproduces"
  # The genuine article: the class workflow itself, pointed at the tag.
  # One job per class because `uses:` takes no expressions; exactly one
  # runs, and compare takes whichever produced subjects.
  rebuild:
    name: Rebuild the release (binaries)
    needs: resolve
    if: inputs.class == 'rust-binary'
    uses: ./.github/workflows/build-rust-binary.yml
    permissions:
      # Restated, not inherited — the startup_failure trap.
      contents: read # checkout of the caller at the released tag
    with:
      version: ${{ needs.resolve.outputs.version }}
      targets: ${{ inputs.target }}
      ref: ${{ needs.resolve.outputs.tag }}
      exclude: ${{ inputs.exclude }}
      # Stated, not omitted: this is a comparator rebuild — the subjects
      # are compared, never shipped, so there is nothing to smoke.
      smoke-test: ""

  rebuild-go:
    name: Rebuild the release (Go binaries)
    needs: resolve
    if: inputs.class == 'go-binary'
    uses: ./.github/workflows/build-go-binary.yml
    permissions:
      # Restated, not inherited — the startup_failure trap.
      contents: read # checkout of the caller at the released tag
    with:
      version: ${{ needs.resolve.outputs.version }}
      targets: ${{ inputs.go-target }}
      ref: ${{ needs.resolve.outputs.tag }}
      # Stated, not omitted: comparator rebuild, nothing to smoke.
      smoke-test: ""

  rebuild-extension:
    name: Rebuild the release (extension)
    needs: resolve
    if: inputs.class == 'pgrx-extension'
    uses: ./.github/workflows/build-pgrx-extension.yml
    permissions:
      # Restated, not inherited — the startup_failure trap.
      contents: read # checkout of the caller at the released tag
    with:
      version: ${{ needs.resolve.outputs.version }}
      crate-dir: ${{ inputs.extension-crate-dir }}
      pg-majors: ${{ inputs.pg-major }}
      ref: ${{ needs.resolve.outputs.tag }}
      # Stated, not omitted: comparator rebuild, nothing to smoke.
      smoke-test: ""

  compare:
    name: Same bytes, or say so loudly
    needs:
      - resolve
      - rebuild
      - rebuild-go
      - rebuild-extension
    if: ${{
        !cancelled() && needs.resolve.result == 'success'
        && (needs.rebuild.result == 'success' || needs.rebuild-go.result == 'success'
          || needs.rebuild-extension.result == 'success')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # the verdict runs from the caller tree and the canon belt
      issues: write # a broken reproducibility claim must page
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          cache: false

      - name: Compare rebuilt digests with the published ones
        # The judgment is `stele verify repro` (stele#96): the RELEASED
        # manifest is the population and the rebuild is the lookup, so
        # a published artifact the rebuild failed to produce at all is
        # a typed absent-from-rebuild finding — the bash loop this
        # replaces walked the rebuild instead and could not see that
        # case (a partial rebuild read exactly like a complete one).
        env:
          PUBLISHED: ${{ needs.resolve.outputs.checksums }}
          MANIFEST: ${{ needs.resolve.outputs.manifest }}
          REBUILT: >-
            ${{ needs.rebuild.outputs.subjects
            || needs.rebuild-go.outputs.subjects
            || needs.rebuild-extension.outputs.subjects }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CLASS: ${{ inputs.class }}
          # The declaration, taken from the SAME inputs that drove the
          # rebuild matrix above — one string per class, selected the
          # way REBUILT is, so the targets judged and the targets built
          # cannot disagree. It is stated up front, never derived from
          # what the rebuild produced: a population drawn from output
          # passes a rebuild that silently produced nothing, which is
          # the stele#96 inversion restated.
          TARGETS: >-
            ${{ inputs.class == 'rust-binary' && inputs.target
            || inputs.class == 'go-binary' && inputs.go-target
            || inputs.class == 'pgrx-extension' && inputs.pg-major
            || '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "${REBUILT}" > rebuilt.sha256
          printf '%s\n' "${PUBLISHED}" > released.sha256
          # The released manifest is passed WHOLE. It lists build
          # artifacts and the evidence documents published beside them,
          # and the two carry opposite obligations: an artifact must
          # rebuild bit-for-bit, while a signature bundle CANNOT —
          # Sigstore embeds a fresh timestamp and certificate on every
          # signing, which is a security property and not a defect. The
          # engine draws that line now (stele#156), from the typing a
          # manifest carries or, for a legacy sha256sum manifest like
          # this one, from the evidence vocabulary --assert-policy
          # declares. This step used to classify the assets itself, in
          # ~40 lines of jq and case: the org's one vocabulary read by a
          # second implementation, which is the shape the port exists to
          # remove. An entry it cannot classify refuses the manifest and
          # an empty subject population seals CANNOT_JUDGE, both in the
          # engine, so nothing here decides what a build artifact is.
          #
          # WHICH released manifest is handed over decides what can be
          # asked of it, so that choice is made once — in resolve, which
          # emits the typed manifest only when the release can answer with
          # it. Here the document is used, never re-judged.
          #
          # --class is passed either way, and that is the point: on a
          # typed manifest it narrows the population to the artifacts that
          # class built, and on one that cannot answer it makes the engine
          # SAY the scope went unmet (classScopeUnmet=no-class-answer)
          # instead of leaving a whole-release verdict looking like a
          # scoped one. A class the release never declared refuses rather
          # than sealing over the empty population it would otherwise
          # draw.
          released="released.sha256"
          if [[ -n ${MANIFEST//[[:space:]]/} ]]; then
            printf '%s\n' "${MANIFEST}" > released-manifest.json
            released="released-manifest.json"
          fi
          # --targets is the second half of the same statement --class
          # makes, at the grain a rebuild actually has: this run rebuilt
          # ONE target of one class, so the population is that class's
          # artifacts OF THAT TARGET (stele#223, #637). Without it a
          # healthy rebuild of one target returned FAIL over every other
          # target the class published — 25 absent findings and two
          # issues filed against a release that was fine
          # (release-lab#226, #227). Nothing inside the declaration is
          # muted: a declared target that produced nothing, or produced
          # other bytes, is as loud as it ever was, and a declared
          # target the release cannot place is CANNOT_JUDGE by name.
          #
          # Refused rather than omitted when empty: omitting it means
          # "this rebuild covered every target", which is exactly the
          # false claim this edit exists to stop a class from making.
          if [[ -z ${TARGETS//[[:space:]]/} ]]; then
            echo "::error::${CLASS} declares no rebuild target — an undeclared population judges every target the class published"
            exit 1
          fi
          stele verify repro \
            --repo "${GITHUB_REPOSITORY}" --tag "${TAG}" \
            --released "${released}" --rebuilt rebuilt.sha256 \
            --class "${CLASS}" --targets "${TARGETS}" \
            --assert-policy .org-canon/slsa/assert-policy.json
      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          MANIFEST: ${{ needs.resolve.outputs.manifest }}
          CLASS: ${{ inputs.class }}
        run: |
          set -euo pipefail
          # Named, never implied. One run rebuilds ONE class, so a finding
          # belongs to that class and to the population the verdict
          # actually judged. The old wording asserted "a build input has
          # escaped the pinning" over the whole release, including every
          # artifact nobody rebuilt — which is how release-lab#226 and
          # #227 were filed twice, under identical titles, against a
          # release that was fine. The title carries the class for the
          # same reason: two legs of one audit must not mint two issues a
          # reader cannot tell apart.
          #
          # The scope sentence reads the SAME input that chose the
          # document the verdict judged, so the two cannot disagree about
          # what was under test.
          if [[ -n ${MANIFEST//[[:space:]]/} ]]; then
            scope="the ${CLASS} artifacts ${TAG} published"
          else
            scope="every build subject ${TAG} published — it carries no per-class typing, so this"
            scope+=" ${CLASS} rebuild could not be scoped to its own class"
          fi
          body="The reproducibility audit rebuilt ${TAG} with the ${CLASS} class workflow and the verdict"
          body+=" is not a pass. Judged population: ${scope}."
          body+=" A digest that DIFFERS from the published one means a build input escaped the pinning."
          body+=" An artifact reported ABSENT is one in the judged population this rebuild did not produce;"
          body+=" read the scope the run states before treating it as a pinning defect."
          body+=" Read the run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "repro-check: ${TAG} ${CLASS} did not rebuild to the published bytes (run ${GITHUB_RUN_ID})" \
            --body "${body}"
...
