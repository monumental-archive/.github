# Artifact class: pgrx-extension. A Postgres extension packaged per PG
# major × architecture, tested against the Postgres build consumers run,
# with a verified glibc floor and reproducible tarballs (docs/release.md).
#
#   Built INSIDE `postgres:<major>-bookworm`, digest-pinned from
#   docker/pgrx-base-images.toml. Two properties are structural, not
#   remembered: the consumer's pg_config (pgrx's own downloaded Postgres
#   builds green and fails at CREATE EXTENSION for exactly the person the
#   artifact serves), and the glibc floor (bookworm's 2.36 covers Debian
#   12 and 13; build against the oldest, smoke on the newest).
#
#   Tests run inside the SAME container, per cell — the native-hardware
#   principle applied to the Postgres dimension. Smoke runs on bookworm
#   AND trixie, so forward compatibility is demonstrated, never assumed.
#
#   The floor is asserted, not presumed: readelf proves no GLIBC_ symbol
#   exceeds the mapping's floor, so a dependency dragging in a newer
#   symbol fails the release instead of failing at dlopen on Debian 12.
#
# rust and cargo-pgrx are CALLER BUILD INPUTS, pinned in the caller's own
# mise config. No cache of any kind: everything downstream is signed.
---
name: build-pgrx-extension

"on":
  workflow_call:
    inputs:
      version:
        # forwarding: universal
        description: Version being released, without the leading v.
        required: true
        type: string
      crate-dir:
        # forwarding: universal
        description: Directory of the extension crate, relative to the root.
        required: true
        type: string
      pg-majors:
        # forwarding: universal
        description: >
          Comma-separated PG majors to build. The plan job refuses anything
          the base-image mapping does not carry — a typo must fail the
          release, not quietly ship four majors instead of five.
        required: false
        type: string
        default: 14,15,16,17,18
      smoke-test:
        # forwarding: universal
        description: >
          Script proving the packaged extension does the one thing it
          exists to do, run INSIDE a stock postgres container of each
          distro. Receives the extracted package root as $1 and the PG
          major as $2. Empty means only CREATE EXTENSION is proven, which
          is permitted and unwise.
        required: false
        type: string
        default: ""
      ref:
        # forwarding: discretionary — only the repro-check comparator rebuilds at a foreign ref
        description: >
          Ref of the caller repository to build; empty means the
          triggering commit. Exists for the reproducibility audit.
        required: false
        type: string
        default: ""
      repro:
        # forwarding: discretionary — the repro leg sets it; omission means a first build
        description: >
          Rebuild leg of the repro gate (#118): build and hash the same
          bytes, upload NO release-* artifact, skip the smoke tests, and
          prefix intermediate artifacts with repro- so the two builds of
          one run cannot collide or cross-contaminate a glob.
        required: false
        type: boolean
        default: false
    outputs:
      subjects:
        description: sha256sum manifest of the extension tarballs.
        value: ${{ jobs.collect.outputs.subjects }}
      leg-subjects:
        # The same digests, carrying the target whose leg produced them
        # (schema 4, stele#223). This class's target is the PG MAJOR,
        # not the pg×arch cell the matrix runs: a rebuild of this class
        # is requested by major (`pg-major`, repro-check.yml) and
        # produces every arch of it, so the major is the grain at which
        # a rebuild's coverage can be declared. What a target IS
        # belongs to the publisher; this is that declaration.
        description: >
          sha256sum manifest of the extension tarballs, each line
          prefixed with the PG major whose leg produced it.
        value: ${{ jobs.collect.outputs.leg-subjects }}
      artifact-name:
        description: Actions artifact holding the tarballs.
        value: ${{ jobs.collect.outputs.artifact-name }}

permissions: {}

jobs:
  # The matrix is constructed against the canon base-image mapping: a
  # major with no digest-pinned image cannot be requested, and the mapping
  # travels at the same SHA as this workflow.
  plan:
    name: Validate the majors against the base-image mapping
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Derive the matrix
        id: plan
        env:
          UNTRUSTED_MAJORS: ${{ inputs.pg-majors }}
        # One derivation and its tests (#1385), against the mapping that
        # travels at this workflow's SHA.
        run: |
          .org-canon/release/matrix.py pgrx-extension \
            .org-canon/docker/pgrx-base-images.toml \
            "${UNTRUSTED_MAJORS}" >> "${GITHUB_OUTPUT}"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      floor: ${{ steps.plan.outputs.floor }}

  build:
    name: Build and prove pg${{ matrix.pg }} (${{ matrix.arch }})
    needs: plan
    strategy:
      # One failing cell must not hide the state of the other nine.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PG: ${{ matrix.pg }}
      ARCH: ${{ matrix.arch }}
      BUILD_IMAGE: ${{ matrix.build }}
      SMOKE_IMAGE: ${{ matrix.smoke }}
      GLIBC_FLOOR: ${{ needs.plan.outputs.floor }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify the base images are org-approved
        # Verify-before-instantiation (#117): the digest pin says which
        # bytes; this proves the org attested those bytes as the approved
        # base (base-attest.yml in the canon), before any container
        # exists. Fails closed — an unapproved base is a red build, not a
        # warning. The upstream publisher applies no Sigstore signature,
        # which is why the identity checked is ours; the attestation
        # lives in the canon's store.
        #
        # This is BuildEnv L1's verification obligation, not BuildEnv L1:
        # the level's provenance obligation falls on the build image
        # producer, and these bases are upstream. See base-attest.yml's
        # header and docs/slsa-reference.md for what upstream does and
        # does not publish. The attestation verified here is itself the
        # signed verification result L1's third obligation asks for
        # (#212): base-attest verified the upstream provenance names the
        # docker-library source before signing, so this check consumes a
        # verification, not a bare hash approval.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in "${BUILD_IMAGE}" "${SMOKE_IMAGE}"; do
            repo="${ref%%@*}"
            repo="${repo%%:*}"
            digest="${ref##*@}"
            [[ ${repo} == */* ]] || repo="docker.io/library/${repo}"
            gh attestation verify "oci://${repo}@${digest}" \
              --repo monumental-archive/.github \
              --predicate-type https://monumental-archive.github.io/attestations/base-image-approval/v1 \
              --signer-workflow monumental-archive/.github/.github/workflows/base-attest.yml \
              --deny-self-hosted-runners \
              > /dev/null
            echo "::notice::approved base: ${ref}"
          done
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Resolve the caller's build-input pins
        # rust, cargo-pgrx and cargo-auditable come from the caller's mise
        # config, like every build input, read by the canon's one reader
        # of a caller's pins (#1333) under whichever backend key pins
        # them. The runner's python, because the build happens inside the
        # container and the belt has no business on a build leg. A list
        # of rust versions yields the first, the one mise puts on PATH
        # (.github#445).
        run: |
          .org-canon/release/caller-pins.py env \
            --input-of "the pgrx-extension class" \
            RUST_VERSION=rust PGRX_VERSION=cargo-pgrx \
            AUDITABLE_VERSION=cargo-auditable >> "${GITHUB_ENV}"
      - name: Refuse a tag whose version disagrees with the manifests
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_CRATE_DIR: ${{ inputs.crate-dir }}
        run: |
          set -euo pipefail
          manifest=$(python3 -c '
          import sys, tomllib
          with open("'"${UNTRUSTED_CRATE_DIR}"'/Cargo.toml", "rb") as f:
              t = tomllib.load(f)
          v = t.get("package", {}).get("version")
          if isinstance(v, dict):
              # version.workspace = true
              with open("Cargo.toml", "rb") as f:
                  w = tomllib.load(f)
              v = w["workspace"]["package"]["version"]
          print(v)
          ')
          if [[ ${manifest} != "${UNTRUSTED_VERSION}" ]]; then
            echo "::error::tag says ${UNTRUSTED_VERSION}, manifest says ${manifest}"
            exit 1
          fi
      - name: Refuse a control file that strands existing installations
        # The backstop for a tag minted around the Release PR's derived
        # upgrade path: release/pgrx/previous-release.py, which reads the
        # previous release through gh and names every path it takes.
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_CRATE_DIR: ${{ inputs.crate-dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .org-canon/release/pgrx/previous-release.py guard \
            --repo "${GITHUB_REPOSITORY}" --version "${UNTRUSTED_VERSION}" \
            --crate-dir "${UNTRUSTED_CRATE_DIR}"
      - name: Build, test and package inside the target Postgres
        # The canon's release/pgrx is mounted read-only at /pgrx and runs
        # as plain scripts (#1380): build-root.sh installs the headers at
        # the image's own server and sets the PostgreSQL floor (#1157,
        # #1274), then becomes postgres for build.sh — the suite, the
        # package, the debug split (debug-split.sh) and the floor block
        # (floor.sh, floor.sql.in). Source mounted read-only and copied
        # inside: the container must not write into the checkout, and
        # target/ never enters it.
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_CRATE_DIR: ${{ inputs.crate-dir }}
        run: |
          set -euo pipefail
          epoch=$(git log -1 --pretty=%ct)
          mkdir -p /tmp/out
          pgrx=$(realpath .org-canon/release/pgrx)
          docker run --rm \
            --env PG --env RUST_VERSION --env PGRX_VERSION --env AUDITABLE_VERSION \
            --env BUILD_IMAGE \
            --env VERSION="${UNTRUSTED_VERSION}" \
            --env CRATE_DIR="${UNTRUSTED_CRATE_DIR}" \
            --env SOURCE_DATE_EPOCH="${epoch}" \
            --volume "${PWD}:/src:ro" \
            --volume "${pgrx}:/pgrx:ro" \
            --volume /tmp/out:/out \
            "${BUILD_IMAGE}" \
            bash /pgrx/build-root.sh
      - name: Assert the glibc floor
        # readelf over the packaged library, against the mapping's floor
        # (release/pgrx/glibc-floor.sh).
        run: .org-canon/release/pgrx/glibc-floor.sh /tmp/out/pkgroot "${GLIBC_FLOOR}"
      - name: Smoke the package on both distros
        # CREATE EXTENSION on a fresh cluster, then the caller's smoke
        # script (release/pgrx/smoke.sh), on bookworm and trixie.
        if: ${{ !inputs.repro }}
        env:
          UNTRUSTED_SMOKE: ${{ inputs.smoke-test }}
        run: |
          set -euo pipefail
          pgrx=$(realpath .org-canon/release/pgrx)
          for image in "${BUILD_IMAGE}" "${SMOKE_IMAGE}"; do
            docker run --rm \
              --env PG \
              --env UNTRUSTED_SMOKE \
              --volume /tmp/out/pkgroot:/pkgroot:ro \
              --volume "${PWD}:/src:ro" \
              --volume "${pgrx}:/pgrx:ro" \
              "${image}" \
              bash /pgrx/smoke.sh
          done
      - name: Execute the upgrade from the previous release
        # Behavioural, like the smoke: proven once, on the first build.
        # The static guard proved the upgrade SQL exists; this proves it
        # RUNS: install the previous release's real tarball, CREATE
        # EXTENSION at the old version, install the new package over it,
        # ALTER EXTENSION UPDATE, and read the version back
        # (release/pgrx/upgrade.sh). Skips cleanly when no previous
        # release shipped this cell (release/pgrx/previous-release.py
        # fetch prints no version) — the fresh-install smokes above are
        # then the whole story.
        if: ${{ !inputs.repro }}
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_CRATE_DIR: ${{ inputs.crate-dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=$(.org-canon/release/pgrx/previous-release.py fetch \
            --repo "${GITHUB_REPOSITORY}" --version "${UNTRUSTED_VERSION}" \
            --crate-dir "${UNTRUSTED_CRATE_DIR}" --pg "${PG}" --arch "${ARCH}" --tarball /tmp/prev.tar.gz --dest /tmp/prevroot)
          [[ -n ${prev} ]] || exit 0
          name=$(basename "${UNTRUSTED_CRATE_DIR}" | tr '-' '_')
          pgrx=$(realpath .org-canon/release/pgrx)
          docker run --rm \
            --env PG --env NAME="${name}" \
            --env PREV="${prev}" --env NEW="${UNTRUSTED_VERSION}" \
            --volume /tmp/prevroot/pkgroot:/prev:ro \
            --volume /tmp/out/pkgroot:/new:ro \
            --volume "${pgrx}:/pgrx:ro" \
            "${SMOKE_IMAGE}" bash /pgrx/upgrade.sh
          echo "::notice::pg${PG}/${ARCH}: ${prev} -> ${UNTRUSTED_VERSION} upgrade executed"
      - name: Archive, normalised
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_CRATE_DIR: ${{ inputs.crate-dir }}
        run: |
          set -euo pipefail
          epoch=$(git log -1 --pretty=%ct)
          name=$(basename "${UNTRUSTED_CRATE_DIR}" | tr '-' '_')
          mkdir -p dist
          # One copy of the payload (#1274): the installable tree, and
          # beside it the split debug info, same normalisation, each its
          # own subject.
          base="dist/${name}-${UNTRUSTED_VERSION}-pg${PG}-linux-${ARCH}"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${epoch}" -C /tmp/out -cf - pkgroot \
            | gzip -n > "${base}.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${epoch}" -C /tmp/out -cf - debugroot \
            | gzip -n > "${base}-debug.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.repro && 'repro-' || '' }}extension-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Emit the inventory plan (what this cell built, from its own inputs)
        # The artifact-to-package mapping exists with certainty exactly
        # once — here: this cell built exactly this crate with exactly
        # `--features pg${PG}` into exactly this tarball, because those
        # are its own build inputs (#537). The plan is that mapping as
        # data; the sbom job derives the closure from it on the prove
        # leg. --artifact names the DOCUMENT apart from the package —
        # the purl keeps the crate's real identity, because advisory
        # matching runs on what the artifact IS, not what the tarball is
        # called (stele#126). Both arches of a major state the same
        # plan; the sbom job collapses identical entries and refuses
        # divergent ones. Not on the repro leg: the comparator proves
        # bytes, not inventories.
        #
        # plan-producer: pgrx-extension sbom-pgrx-
        if: ${{ !inputs.repro }}
        env:
          UNTRUSTED_CRATE_DIR: ${{ inputs.crate-dir }}
        run: |
          set -euo pipefail
          pkg=$(python3 -c '
          import tomllib
          with open("'"${UNTRUSTED_CRATE_DIR}"'/Cargo.toml", "rb") as f:
              t = tomllib.load(f)
          print(t["package"]["name"])
          ')
          mkdir -p plan
          jq -n --arg pkg "${pkg}" --arg pg "${PG}" \
            '[{class: "pgrx-extension",
               doc: ("sbom-pgrx-" + $pkg + "-pg" + $pg),
               artifact: ($pkg + "-pg" + $pg),
               params: {cargoPackage: $pkg,
                        features: [("pg" + $pg)],
                        noDefaultFeatures: true}}]' \
            > plan/plan.json
          jq -r '.[] | "::notice::plans inventory \(.doc) for package \(.params.cargoPackage)"' plan/plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.repro }}
        with:
          name: sbom-plan-extension-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: plan/plan.json
          if-no-files-found: error
          retention-days: 1

  collect:
    name: Collect and refuse a partial set
    needs:
      - plan
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions: {}
    outputs:
      subjects: ${{ steps.manifest.outputs.subjects }}
      leg-subjects: ${{ steps.manifest.outputs.leg-subjects }}
      artifact-name: release-extensions
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.repro && 'repro-extension-pg*' || 'extension-pg*' }}
          merge-multiple: true
          path: dist

      - name: Compute the subject manifest
        id: manifest
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          cell_list=$(jq -r '.[]' <<< "${EXPECTED}")
          cells=()
          while IFS= read -r c; do
            if [[ -n ${c} ]]; then cells+=("${c}"); fi
          done <<< "${cell_list}"
          for c in "${cells[@]}"; do
            pg="${c%-*}"
            arch="${c#*-}"
            matches=(./*-pg"${pg}"-linux-"${arch}".tar.gz)
            if ((${#matches[@]} != 1)); then
              echo "::error::expected exactly one tarball for pg${pg}/${arch}, found ${#matches[@]}"
              exit 1
            fi
            matches=(./*-pg"${pg}"-linux-"${arch}"-debug.tar.gz)
            if ((${#matches[@]} != 1)); then
              echo "::error::expected exactly one debug tarball for pg${pg}/${arch}, found ${#matches[@]}"
              exit 1
            fi
          done
          # Two per cell: the installable tarball and its debug sibling.
          archives=(./*.tar.gz)
          if ((${#archives[@]} != 2 * ${#cells[@]})); then
            echo "::error::${#archives[@]} tarballs for ${#cells[@]} planned cells (two each)"
            exit 1
          fi
          manifest=$(sha256sum ./*.tar.gz | sed 's| \./| |')
          # The same digests once more, each prefixed with the PG major
          # whose leg produced it — this class's target grain. The
          # prefix comes from the PLANNED cell list this step has just
          # proved matches exactly one tarball each, so both arches of
          # one major carry that major and nothing parses a target back
          # out of a filename.
          legs=()
          for c in "${cells[@]}"; do
            pg="${c%-*}"
            arch="${c#*-}"
            sums=$(sha256sum ./*-pg"${pg}"-linux-"${arch}".tar.gz \
              ./*-pg"${pg}"-linux-"${arch}"-debug.tar.gz)
            sums="${sums// .\// }"
            while IFS= read -r line; do
              legs+=("${pg} ${line}")
            done <<< "${sums}"
          done
          {
            echo "subjects<<SUBJECTS_EOF"
            printf '%s\n' "${manifest}"
            echo "SUBJECTS_EOF"
            echo "leg-subjects<<LEGS_EOF"
            printf '%s\n' "${legs[@]}"
            echo "LEGS_EOF"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${manifest}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.repro }}
        with:
          name: release-extensions
          path: dist/*.tar.gz
          if-no-files-found: error
...
