# A fixed main becomes a release, org canon (#1167). Callers pin by
# full SHA:
#
#   jobs:
#     security-release:
#       uses: monumental-archive/.github/.github/workflows/security-release.yml@<sha> # vX.Y.Z
#       secrets:
#         app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
#
# The defect: Renovate lands a security fix on main within hours, and
# then nothing turns it into a release anyone can install. Measured on
# 2026-11-14, stele's and iiif-server's current releases carried 26 and
# 11 undecided advisories with every fix already on main; stele's
# Release PR had been green and unmerged for twelve weeks.
#
# So a repository that adopts this stub asks itself, on a schedule:
# is my supported release affected, and does my main remedy it? Only
# when both are true — and the pending release is not a breaking one,
# is not held, and would pass the publish path's own advisory checks —
# the Release PR is merged, and the ordinary release path does the rest
# (release.yml tags on that merge, the publish workflow builds, proves
# and signs). Nothing here tags, builds or signs. docs/release.md, "A
# fixed main becomes a release", holds the whole argument, including
# what this takes out of a human's hands and what it leaves there.
#
# Two jobs, split on the same line as release.yml: the first reads and
# decides with no secret at all; the second holds the App token and
# does exactly one thing with it.
---
name: security-release

"on":
  workflow_call:
    secrets:
      app-private-key:
        # forwarding: universal
        description: Tag-mint App private key
        required: true

permissions: {}

jobs:
  assess:
    name: Is the supported release affected, and does main remedy it?
    runs-on: ubuntu-26.04
    permissions:
      # Each grant is a read of this repository except the last, and the
      # last is not on the release path: it is the issue that says "the
      # supported release is affected and main does not fix it", the one
      # outcome here that needs a maintainer.
      contents: read # checkout; this repository's release listing and SBOM assets
      attestations: read # every SBOM is held against the store before it is scanned
      pull-requests: read # the Release PR's title, labels and merge state
      issues: write # the needs-a-maintainer issue, filed once
    outputs:
      merge: ${{ steps.decide.outputs.merge }}
      pr: ${{ steps.decide.outputs.pr }}
      reason: ${{ steps.decide.outputs.reason }}
    env:
      # The list is the whole install: no `mise run` installs the rest
      # (task auto-install is on by default; #1412).
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `stele derive release-plan` derives the pending version from
          # the whole local history and refuses to network for refs the
          # workflow did not fetch.
          fetch-depth: 0
          persist-credentials: false
          # A schedule runs on the default branch already; stated so a
          # dispatch from another ref still judges what would release.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Read the caller's pinned build inputs
        # The caller's config decides the versions; the canon decides
        # which tools (#1333). One reader, release/caller_pins.py.
        id: pins
        run: |
          "${ORG_PYTHON}" .org-canon/release/caller_pins.py install \
            --input-of "the release's advisory triage" \
            --if-pinned rust --if-pinned go --if-pinned govulncheck >> "${GITHUB_OUTPUT}"
      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          # The same reasoning as the release jobs: what this decides
          # ends in a signed release, so no tool cache.
          cache: false
          # Only what this job's steps call (#1333): the release path is
          # uncached, so every tool in scope is paid for on every run.
          # release/test_job_installs.py holds the list to the calls.
          install_args: >-
            jq github:monumental-archive/stele aqua:google/osv-scanner
            aqua:EmbarkStudios/cargo-deny
            ${{ steps.pins.outputs.install }}

      - name: Prepare the release
        # No token. The same script the Release PR is built from, so the
        # tree judged below is the tree that would be tagged — version
        # mirrors and refreshed lockfiles included.
        id: prepare
        run: .org-canon/release/prepare-release.sh

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ steps.prepare.outputs.plan }}
          ORG_CANON_DIR: ${{ github.workspace }}/.org-canon
          FILE_ISSUE: "true"
        run: |
          if [[ -z ${PLAN} ]]; then
            echo "security-release: no — nothing to release: main carries no releasable change since the last tag"
            echo "merge=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          .org-canon/release/security-release.sh
      - name: Say what was decided
        if: always()
        env:
          MERGE: ${{ steps.decide.outputs.merge }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          {
            echo "### security release"
            echo
            echo "- release: ${MERGE:-undecided}"
            echo "- why: ${REASON:-the decision step did not finish}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1
  merge:
    name: Merge the Release PR
    needs: assess
    if: needs.assess.outputs.merge == 'true'
    runs-on: ubuntu-26.04
    # Nothing ambient: the one credential this job uses is the App
    # token minted below.
    permissions: {}
    steps:
      - name: Mint the merge token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAG_MINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          # The App, not the ambient token, and for a reason that is the
          # whole mechanism: a merge made with GITHUB_TOKEN triggers no
          # workflows, so the tag job would never fire and the merged
          # Release PR would sit on main releasing nothing — the
          # silent-success shape release.yml's header warns about.
          permission-contents: write
          permission-pull-requests: write

      - name: Merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ needs.assess.outputs.pr }}
          REASON: ${{ needs.assess.outputs.reason }}
        run: |
          # Squash, like every merge in the org; where a merge queue
          # owns the strategy this enqueues instead, which is the same
          # outcome one gate run later. Never `--auto`: the decision job
          # required a PR that is mergeable NOW, and arming a merge for
          # some later state would merge a tree nobody assessed.
          gh pr merge "${PR}" --repo "${GITHUB_REPOSITORY}" --squash
          gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" --body \
            "Merged by the scheduled security release: ${REASON}."

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887), with one issue per red
  # job (#1966): for each red job of a run on the default branch, one
  # issue titled "red: <job> (<workflow>)" and labelled red-check holds
  # its findings and each red leg's log tail; the next run with every
  # leg green or skipped closes it. mise/standing_issue.py has the
  # outcomes. Only `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - assess
      - merge
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # each red job's red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
