# The canon's own SLSA levels — this repository running the stub every
# other repository runs (#554).
#
# It is the same file `workflow-templates/level.yml` ships, with the
# one difference every canon self-application has: the `uses:` is
# local, because the canon calls its own workflow at the running commit
# rather than pinning a release of itself (the gate.yml and
# self-publish.yml convention). The canon is consumer #1 and wears the
# mechanism it delivers, with no special case.
#
# Named `self-level.yml` and not `level.yml` because here that filename
# is the CALLEE — the reusable workflow this calls. `fix:badges` finds
# this file by its `uses:`, never by its name, for exactly that reason.
#
# The canon's `levels` branch carried every repository's cells until
# the other three began publishing their own. The first run of THIS
# workflow prunes it to the canon's own — which is correct and is why
# it must not be dispatched until the other three have repointed their
# shields at their own branches.
---
name: self-level

# zizmor's `dangerous-triggers` audit fires on the `workflow_run`
# below, at high confidence, and it is right to by default: that
# trigger runs in the BASE repository with a writable token and access
# to secrets, so the classic exploit is a workflow that then checks out
# the triggering pull request's head and executes it.
#
# Ignored here because this stub does none of that, and neither does
# its callee. Nothing is checked out — not this repository, not the
# triggering ref — and no step reads workspace content or any
# attacker-influenced field of the event. The single thing read from
# the triggering context is `workflow_run.conclusion`, a value GitHub
# computes, in an `if:`. The judgment itself reads the forge, the
# attestation store and published artifacts, never a tree. The callee
# is pinned by SHA and declares no `id-token`.
#
# The alternative was refused upstream: `release: published` fires
# while the publish workflow is still attaching the evidence being
# judged, so it races the thing it measures (.github#554).
"on": # zizmor: ignore[dangerous-triggers]
  # A release is when build evidence materially changes, so the badge
  # moves with it — but on the PUBLISH WORKFLOW COMPLETING, never on
  # `release: published`, which fires while that workflow is still
  # attaching the very evidence about to be judged. Name the workflow
  # this repository publishes with; a repository that publishes
  # nothing simply never matches, and its weekly run below is its only
  # firing trigger.
  workflow_run:
    # `self-publish`, not `publish`: `workflow_run` fires for the
    # top-level workflow of a run, and the canon's `publish.yml` is the
    # REUSABLE one consumers call — in this repository it only ever runs
    # as a called job of `self-publish`, which would never match.
    workflows:
      - self-publish
    types:
      - completed
  schedule:
    # Mondays 05:00 UTC — before the canon's 05:30 sweep reads this
    # branch. A level degrades with no release at all (a ruleset
    # weakened, an advisory left undecided, a chain link never
    # emitted), so the weekly run is not a backstop for the trigger
    # above; it is the other half of the question.
    - cron: 0 5 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # a queued run must not cancel a publication

jobs:
  level:
    # A failed publish attached no evidence worth re-judging, and
    # `types: [completed]` fires on failure too. The scheduled and
    # dispatched runs carry no `workflow_run` context and always pass.
    if: >-
      ${{ github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      # Stated, not inherited: a `uses:` job takes the WORKFLOW-level
      # default, never the caller's ambient grant, so a shared workflow
      # that gains a permission kills silent callers as
      # startup_failure (lint:nested-permissions enforces the writing;
      # lint:caller-permissions checks it against what the callee
      # asks).
      contents: write # pushes this repository's cells to its own levels branch
    uses: ./.github/workflows/level.yml
    with:
      tracks: build source dependency
...
