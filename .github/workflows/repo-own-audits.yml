# The audit:* tasks a repository defines in its own mise.toml, every
# one collected and run (`mise run audit`, #704). The belt's own legs
# each have a subject workflow; this one is the caller's, so a red
# here is one of the repository's own checks, and nothing else (#1858:
# one workflow per subject, named for what a red means).
# lint:audit-scheduled accepts a caller of this workflow as the
# scheduler of every audit task the repository defines.
#
# Callers pin by full SHA from their own `own-audits` stub
# (workflow-templates/own-audits.yml):
#
#   jobs:
#     own-audits:
#       uses: monumental-archive/.github/.github/workflows/repo-own-audits.yml@<sha> # vX.Y.Z
#
# The canon defines no audit task outside its belt, so it has no
# caller of this. No inputs, by design — zero caller-controlled
# expansion.
---
name: repo-own-audits

"on":
  workflow_call: {}
permissions:
  contents: read

jobs:
  repo-audits:
    name: this repository's own audit tasks pass
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.10
          cache: false

      # The `lint:*` symmetry the audit surface went without (#704). Every
      # leg above is a BELT task named by hand, so an `audit:<name>` a
      # consumer defined in its own mise.toml was run by nothing, ever —
      # the task existed, `mise run` found it, and no cron called it.
      # `mise run audit` collects the CALLER's audit tasks (the ones mise
      # reports as non-global) and runs each, so a repo declares a
      # network-bound check and this leg runs it with no canon change.
      # Skips clean in a repo that defines none.
      #
      # NO TOKEN, deliberately. What a collected task needs is unknown to
      # the canon, and an ambient credential handed to every future
      # caller task is a grant nobody decided. A task that needs one
      # fails closed and its need is settled here, with a reason, the way
      # every other leg's env was.
      - name: Run every audit:* this repository defines
        run: mise run audit

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887), with one issue per red
  # job (#1966): for each red job of a run on the default branch, one
  # issue titled "red: <job> (<workflow>)" and labelled red-check holds
  # its findings and each red leg's log tail; the next run with every
  # leg green or skipped closes it. mise/standing_issue.py has the
  # outcomes. Only `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - repo-audits
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # each red job's red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
