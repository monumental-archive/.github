# The last step, and the first moment anything becomes public. Attaches the
# evidence bundle to the draft release and publishes it.
#
# Runs no caller code, which is the whole reason it is a separate job: the
# canon's "attestation happens last, and only on proof" is enforceable only
# while the job that publishes cannot be reached from a build step.
#
# The bundle shape is dictated by what the scoring checks actually match,
# read from Scorecard's source rather than its documentation:
#
#   <name>.spdx.json   Scorecard's SBOM check matches
#                      `.+\.(cdx.json|…|spdx.json|…)`, and awards the full
#                      10 only for an SBOM that is a RELEASE ASSET — 5 if
#                      it exists solely in the repo or the pipeline. Only
#                      the five most recent releases are examined, so this
#                      is a standing obligation, not a one-off.
#   <artifact>.intoto.jsonl
#                      Signed-Releases awards 8 for a signature and 10 only
#                      when provenance is present; `*.intoto.jsonl` is one
#                      of the recognised patterns, and it is also the
#                      filename SLSA's distributing-provenance SHOULD asks
#                      for. One convention satisfies both.
#   checksums.txt      so a consumer can check bytes without tooling.
---
name: attach-release

"on":
  workflow_call:
    inputs:
      version:
        # forwarding: universal
        description: Version being released, without the leading v.
        required: true
        type: string
      classes:
        # forwarding: universal
        description: >
          Comma-separated evidence classes this release ships. The
          evidence manifest declares them, and the manifest is written
          here because here is where every asset exists.
        required: true
        type: string
      dry-run:
        # forwarding: universal
        description: Rehearsal — attach the bundle, leave the release a draft.
        required: false
        type: boolean
        default: false
    secrets:
      app-private-key:
        # forwarding: universal
        description: Tag-mint App private key
        required: true

permissions: {}

jobs:
  attach:
    name: Attach the evidence bundle and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      # By pattern, not by name: every build class uploads its assets as
      # `release-*` and every sign job its bundle as `attestation-bundle-*`,
      # so any subset of classes fans in here with no per-class input. A
      # class that pushed only to a registry (oci-image) contributes a
      # bundle and no files, which is why an empty dist is legal below
      # while an empty bundle set is not.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: attestation-bundle-*
          path: bundle

      - name: Name each provenance after the class it describes
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          # SLSA distributing-provenance: provenance "SHOULD have a
          # filename that is directly related to the build artifact
          # filename". One bundle covers one class's subjects, so each is
          # named for its class — attestations-<class>.intoto.jsonl, still
          # inside the `*.intoto.jsonl` pattern Scorecard's Signed-Releases
          # check recognises.
          mkdir -p dist
          found=0
          for dir in bundle/attestation-bundle-*/; do
            [[ -d ${dir} ]] || continue
            class=$(basename "${dir}")
            class="${class#attestation-bundle-}"
            src=$(find "${dir}" -type f | head -n 1)
            [[ -n ${src} ]] || {
              echo "::error::empty bundle for ${class}"
              exit 1
            }
            mv "${src}" "dist/attestations-${class}.intoto.jsonl"
            found=$((found + 1))
          done
          if ((found == 0)); then
            # download-artifact is layout-inconsistent, measured across two
            # releases: two matched artifacts arrive in per-name
            # subdirectories, exactly one arrives FLAT in the target path.
            # The flat case carries no artifact name, so the class cannot
            # be recovered — and with a single bundle it need not be: one
            # bundle covering the whole release truthfully takes the
            # umbrella name, which is the same `*.intoto.jsonl` pattern
            # Scorecard recognises and SLSA's naming SHOULD asks for.
            flat=$(find bundle -maxdepth 1 -type f 2> /dev/null | head -n 1)
            if [[ -n ${flat} ]]; then
              mv "${flat}" "dist/attestations.intoto.jsonl"
              found=1
            fi
          fi
          if ((found == 0)); then
            if [[ ${DRY_RUN} == "true" ]]; then
              # An oci-only rehearsal signs nothing: its signer runs only
              # against a really-pushed digest. Loud, never silent.
              echo "::warning::rehearsal: no Sigstore bundle to attach"
            else
              echo "::error::no Sigstore bundle — a release without evidence does not publish"
              exit 1
            fi
          fi
          echo "::notice::${found} attestation bundle(s) attached"
      - name: Assert the SBOM arrived
        run: |
          set -euo pipefail
          # Generation moved to the publish orchestrator's sbom job (and,
          # for images, the build's pull-back step) — class-shaped, derived
          # from what actually ships (docs/dependency-track.md). This job
          # runs no tooling, so it only asserts the inventory is present:
          # a release without one blinds audit:blast-radius and caps
          # Scorecard's SBOM check, silently.
          #
          # -name over a glob: the dist/* glob skips dotfiles, which is
          # how every canon release (.github -> .github-x.y.z.spdx.json)
          # shipped SBOM-less with everything green. Names are dot-proofed
          # at generation now; this assertion is the backstop.
          n=$(find dist -maxdepth 1 -name "*.spdx.json" | wc -l | tr -d " ")
          if [[ ${n} -eq 0 ]]; then
            echo "::error::no SBOM in dist — the sbom job should have delivered one"
            exit 1
          fi
          hidden=$(find dist -maxdepth 1 -name ".*" -type f | wc -l | tr -d " ")
          if [[ ${hidden} -ne 0 ]]; then
            echo "::error::dotfile in dist — dist/* globs and the checksum loop would silently skip it"
            exit 1
          fi
          echo "::notice::${n} SBOM(s) in the bundle"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.5
          cache: false

      # The declared contract, attested at the tag (stele#40, from
      # #109): which classes shipped, the verdict layout, the machinery
      # version obligations are derived from, and every asset pinned and
      # TYPED as a build subject or an evidence document — written by
      # `stele emit manifest` through the same definition the assert
      # reader decodes, and proven readable on its own rendered bytes
      # before anything ships it.
      #
      # It is written HERE, in the fan-in, because here is the first
      # moment the release's assets all exist. Written in the sbom job
      # it saw only the inventory that job had just derived, and typed
      # one entry where the release published five — the build subject
      # among them, so the repro walk's population was empty and its
      # verdict CANNOT_JUDGE. Measured on v1.45.0.
      - name: Write the evidence manifest
        env:
          CLASSES: ${{ inputs.classes }}
        run: |
          set -euo pipefail
          # The machinery version is the canon tree's own, read from the
          # version mirror the pinned tree carries — the caller's `uses:`
          # ref is a commit SHA (the tag-pin rule), so the version is a
          # fact about the TREE, not about the ref's spelling. For the
          # canon's own releases the mirror already carries the version
          # being cut, so one read covers both cases.
          machinery=$(awk '/^version:/{print $2; exit}' .org-canon/CITATION.cff)
          [[ -n ${machinery} ]] || {
            echo "::error::the pinned canon tree's CITATION.cff names no version — the manifest cannot state its machinery"
            exit 1
          }
          # Pass one of two: everything the release ships BEFORE the
          # manifest exists, because a manifest cannot pin itself and
          # the format says so. The checksum step below is pass two and
          # covers everything including it.
          (cd dist && sha256sum ./* | sed 's| \./| |') > "${RUNNER_TEMP}/assets.sha256"
          stele emit manifest \
            --classes "${CLASSES}" \
            --store-vsa true \
            --machinery-version "${machinery}" \
            --assets "${RUNNER_TEMP}/assets.sha256" \
            --assert-policy .org-canon/slsa/assert-policy.json \
            --out dist/evidence-manifest.json
      - name: Checksum everything that ships
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* | sed 's| \./| |' > checksums.txt
      - name: Mint the publishing token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAG_MINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Attach and publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          # Post-publish resume converges, never clobbers (#316, found on
          # v1.20.0's first mint): the DOI job runs AFTER publish, so a
          # mint-only failure (the issuer down) is re-dispatched into a
          # release that is already published and immutable — where
          # --clobber's delete is refused with a 422 and the resume dies
          # before reaching the one job that actually failed. If the
          # release is out, prove the rebuilt bytes equal the published
          # bytes and pass through; a mismatch is a real failure, not a
          # resume.
          draft=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)
          if [[ ${draft} == "false" ]]; then
            gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern checksums.txt --output published-checksums.txt
            # What must be identical is the BUILD SUBJECTS, and which
            # assets those are is the published manifest's own typing to
            # say (stele#156) — not this step's guess. Comparing the
            # whole manifest made a resume impossible whenever an
            # evidence document legitimately differed: a Sigstore
            # signature embeds a fresh timestamp and certificate on
            # every signing, so a re-signed bundle changes bytes by
            # design, and an SBOM exported live from the forge's
            # dependency graph can too. Measured on v1.44.1's duplicate
            # tag push, where the resume could never converge.
            gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern evidence-manifest.json --output published-manifest.json 2> /dev/null || true
            subjects=""
            if [[ -s published-manifest.json ]]; then
              subjects=$(jq -r '(.entries // [])[] | select(.type == "build-subject") | .name' \
                published-manifest.json)
            fi
            if [[ -z ${subjects} ]]; then
              # A release published before entries were typed (schema 1
              # carries no `entries`) has no answer to give, so the
              # whole-set comparison stands for it. Pre-epoch releases
              # keep the guard they shipped under; nothing is rewritten
              # to make them look newer than they are.
              if ! diff -u published-checksums.txt dist/checksums.txt; then
                emsg="${TAG} is published and immutable but the rebuilt assets differ from the published set — this is"
                emsg+=" not a resume"
                echo "::error::${emsg}"
                exit 1
              fi
            else
              differing=""
              while IFS= read -r name; do
                [[ -n ${name} ]] || continue
                was=$(awk -v n="${name}" '$2 == n {print $1}' published-checksums.txt)
                now=$(awk -v n="${name}" '$2 == n {print $1}' dist/checksums.txt)
                if [[ -z ${was} || -z ${now} || ${was} != "${now}" ]]; then
                  differing="${differing} ${name}"
                fi
              done <<< "${subjects}"
              if [[ -n ${differing} ]]; then
                emsg="${TAG} is published and immutable but these build subjects differ from the published bytes:"
                emsg+="${differing} — this is not a resume"
                echo "::error::${emsg}"
                exit 1
              fi
            fi
            echo "::notice::${TAG} already published; build subjects verified identical, converging"
            exit 0
          fi
          gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          if [[ ${DRY_RUN} == "true" ]]; then
            echo "::warning::rehearsal: ${TAG} left as a draft, nothing published"
            exit 0
          fi
          # Publishing is the commitment point. Immutable releases apply at
          # publish, and GitHub mints its own release attestation binding
          # tag, commit and asset digests at the same moment.
          gh release edit "${TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
          echo "::notice::published ${TAG}"
...
