# The org's level board, asserted — and no longer published from here
# (#554).
#
# Renamed from `level-publish.yml`, which is what it was until this
# workflow stopped publishing anything: a file called level-publish
# sitting beside `level.yml`, which does publish, is a name that
# actively misleads. Nothing pins this path — it is neither a reusable
# workflow nor a signing identity — so the rename costs a doc line and
# the run history's association with the old name.
#
# Levels are published PER REPOSITORY now. Each population repository
# runs the level stub (`workflow-templates/level.yml`), judges itself
# under its own `contents: write`, and pushes its own cells to its own
# `levels` branch. Two things follow, and both were the point: a
# release moves its own badge the moment its evidence is attached
# rather than on the next Monday, and no capability crosses a
# repository line — a consumer's release needs no write into the canon
# and no dispatch token in every caller, which is the signer-split
# boundary problem wearing a different costume.
#
# What survives here is the drift catcher, and it writes NOTHING. The
# central write of consumer cells is gone; the canon's own cells are
# published by the canon's own copy of the same stub, exactly like
# every other member.
#
# The one failure the per-repo model introduces is a stub that quietly
# stopped running, and this job exists to catch it. It reds when the
# board a repository published disagrees with what the org measurement
# computes, when a declared cell was never published at all, or when a
# `levels` branch has stopped moving.
#
# Seeding is what makes the comparison honest rather than noisy. The
# measurement runs OVER the fetched board, so the engine's own rule
# (stele#135) applies here as it does in a stub: a cell it cannot
# judge today keeps the level somebody proved yesterday instead of
# publishing grey over it. So "the forge was unreadable this morning"
# arrives as exit 4 with the level intact, and never as a spurious
# grey-against-L3 difference — which is the shape that would have
# taught everyone to ignore this job.
#
# Shields are compared, never reports: a report carries `sealedAt` and
# the continuity dates the judge computed, so two honest runs a minute
# apart differ in bytes. The shield is the sealed judgment with no
# clock in it, and it is what a badge renders.
#
# Every judgment here is the engine's — the population, the seeding
# and the comparison included (#1379). This workflow fetches the
# published branches and reads their dates.
---
name: slsa-level-board

"on":
  schedule:
    # Mondays 05:30 UTC — after the stubs' own weekly 05:00 run, so a
    # healthy branch is half an hour old rather than seven days, and
    # before the audit reads the shields. Ninety minutes clear of the
    # audit's first group (07:00), because this walk and those legs
    # draw one App installation's hourly budget (#1169).
    - cron: 30 5 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  assert:
    name: assert the published board
    runs-on: ubuntu-26.04
    # The token is the audit App's, and which token is the whole story
    # of this job (#1143, #1169). The default token is served an org
    # listing without the private member, so `stele level --org`
    # refuses to enumerate. A personal token sees it, and was tried
    # (#1154) and withdrawn the same day (#1162): this walk measured
    # 3,736 REST requests in 28 minutes, one person has one
    # 5,000-request hour, and while it was at zero `source-attest /
    # claims` failed on main in three repositories — it reads the
    # ruleset through a PAT in the same bucket. An App installation
    # has a budget of its own. The cron keeps 05:30 so that budget's
    # hour is over before the canon's first Monday group starts at 07:00.
    # Environment-scoped like the audit legs: the key is drawable only
    # by a job that declares the environment.
    environment: audit
    # Read-only, and that is the #554 change stated in one line: this
    # job used to hold `contents: write` to publish every repository's
    # cells from here.
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
      # One weekly stub run may be missed before a branch is called
      # dead: the stubs run weekly and this sweep runs weekly, so a
      # seven-day floor would red on ordinary clock skew between two
      # crons. Eight days is the smallest number that cannot.
      STALE_AFTER_DAYS: "8"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the audit App's read token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          # Read, and only what the walks read: releases, tags and
          # trees; the attestation store; review history. Named here so
          # the token cannot widen when the App's own grants do.
          permission-contents: read
          permission-metadata: read
          permission-attestations: read
          permission-pull-requests: read
          # Every repository in the installation, on purpose: the
          # subject of these walks IS the population.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      - name: Fetch what every population repository published
        # The roster is the canon's declared population and nothing
        # else, and stele reads it (#1379, stele#388): `derive
        # population` reconciles the roster against the org listing and
        # names each member, so the canon keeps no reading of `tracks`
        # here. A member that is an exclusion bears no cell and so has
        # no branch to fetch; asking for one would red over a
        # repository behaving exactly as declared. A roster the listing
        # contradicts (exit 1) or a population nobody could read
        # (exit 4) is no population to fetch, and reds here.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          touch missing.txt ages.txt
          stele derive population --org "${GITHUB_REPOSITORY_OWNER}" --policy slsa/assert-policy.json \
            | jq -r '.members[] | select(.exclusion | not) | .repo' > roster.txt
          while read -r repo; do
            if git clone --quiet --depth 1 --single-branch --branch levels \
              "https://github.com/${GITHUB_REPOSITORY_OWNER}/${repo}.git" "fetched/${repo}"; then
              git -C "fetched/${repo}" log -1 --format="${repo} %cI" >> ages.txt
              rm -rf "fetched/${repo}/.git"
              cp -R "fetched/${repo}/." published/
            else
              echo "${repo}" >> missing.txt
            fi
          done < roster.txt
      - name: Measure the org and compare it with the published board
        # One call (#1379, stele#418). stele seeds the empty --out-dir
        # from the published board, so the engine decides what may
        # replace what (stele#135): a cell it cannot judge today keeps
        # the level somebody proved yesterday instead of publishing grey
        # over it. It then compares shields, never reports, and names
        # every difference as `level: drift:` — measured, never
        # published; published and different, with both messages;
        # published, outside the declared population. Exit 4 is a cell
        # judged before that cannot be judged now, 1 is drift; both are
        # recorded and reported at the end with everything else this
        # job found, rather than ending the run before the staleness
        # walk.
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p measured
          rc=0
          stele level \
            --org "${GITHUB_REPOSITORY_OWNER}" \
            --out-dir measured \
            --published published \
            --policy slsa/assert-policy.json || rc=$?
          # No canon tree in this job: one printf, whose format is a literal
          # command and a literal label; the exit is a %q argument (#1660).
          if [[ ${rc} -ne 0 && ${rc} -ne 1 && ${rc} -ne 4 ]]; then
            printf '::error::stele level failed: the board was not measured, nothing is asserted\n  exit: %q\n' "${rc}"
            exit "${rc}"
          fi
          [[ ${rc} -eq 0 ]] || printf '::error::the board comparison is red: its findings are named above\n  exit: %q\n' "${rc}"
          echo "board=${rc}" >> "${GITHUB_ENV}"
      - name: Assert every levels branch still moves
        # A branch can agree with the measurement and still be dead:
        # nothing changed, so a stub that stopped running last month
        # publishes the same bytes the measurement computes today. The
        # date is the only thing that separates the two.
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          stale=""
          while read -r repo when; do
            moved=$(date -u -d "${when}" +%s)
            age=$(((now - moved) / 86400))
            if ((age > STALE_AFTER_DAYS)); then
              stale="${stale} ${repo}(${age}d)"
            fi
          done < ages.txt
          echo "stale=${stale}" >> "${GITHUB_ENV}"
      - name: Report
        # The board's own findings are named above by stele (the
        # `level: drift:` lines and the exit-4 line) and flagged by the
        # measure step; this step makes them a red, with the two
        # findings that stay the canon's.
        run: |
          set -euo pipefail
          bad=0
          if [[ -s missing.txt ]]; then
            absent=$(tr '\n' ' ' < missing.txt)
            # No canon tree in this job: the command is a literal, and the
            # outside text follows on a plain line, never at its start (#1660).
            echo "::error::a repository has no levels branch — the stub has never run there"
            printf '  missing: %q\n' "${absent}"
            bad=1
          fi
          if [[ -n ${stale} ]]; then
            echo "::error::a levels branch has not moved within the stale limit — the stub stopped running"
            printf '  limit: %q days; stale:%q\n' "${STALE_AFTER_DAYS}" "${stale}"
            bad=1
          fi
          [[ ${board} -eq 0 ]] || bad=1
          exit "${bad}"

  # Every scheduled workflow ends here (#1887): while a run on the
  # default branch has a red job, one issue titled "<workflow> is red"
  # and labelled red-check holds each red job and its log tail; the next
  # green run closes it. mise/standing_issue.py has the outcomes. Only
  # `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - assert
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # the workflow's one red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}"
...
