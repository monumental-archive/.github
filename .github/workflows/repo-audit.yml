# The repo-side Monday audit: the scheduled, network-touching checks the
# deterministic gate deliberately excludes — the dependency advisory
# feed (audit:deny) and bounded fuzz runs (audit:fuzz, #316; skips clean
# in repos with no fuzz/, so the stub stays universal). Callers pin by
# full SHA, ci.yml-style:
#
#   jobs:
#     audit:
#       uses: monumental-archive/.github/.github/workflows/repo-audit.yml@<sha> # vX.Y.Z
#
# Failures page via the Actions UI rather than blocking merges. The
# org-wide audit surface — blast radius over published SBOMs, settings
# drift, the org-scoped pin and attestation sweeps — runs in the canon's
# own audit.yml, because each of those is a property of the ORG and one
# repository has to hold it. Everything that is a property of a repo's
# OWN TREE runs here.
#
# That sentence used to name link rot among the org-wide checks, and it
# was wrong (#681): `audit:links` builds its corpus from `git ls-files`
# and `audit:actions` from `.github/workflows/`, so both walk whatever
# repository they run in — scheduling them in the canon only ever
# checked the canon, and no consumer's markdown or workflows had been
# audited by anything. They are per-tree checks and they run here now.
# No inputs, by design — zero caller-controlled expansion.
---
name: repo-audit

"on":
  workflow_call: {}
permissions:
  contents: read

jobs:
  deny:
    name: audit / dependency advisories
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      - name: Check the advisory feed against the lock
        run: mise run audit:deny

  semver:
    name: audit / semver against the published baseline
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      - name: Check the public API against the latest published release
        run: mise run audit:semver

  fuzz:
    name: audit / fuzz targets
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      # Bounded libFuzzer runs under AddressSanitizer — cargo-fuzz's own
      # default — on the nightly the repo declares as FUZZ_TOOLCHAIN
      # (#445). Time-bound and non-deterministic, so it lives here, never
      # the gate (#316); the gate's lint:fuzz-build still proves the
      # targets compile, on stable. A repo with no fuzz/ skips clean.
      - name: Run every fuzz target for a bounded interval
        run: mise run audit:fuzz

      # A crash the cron cannot hand back is a crash nobody can act on:
      # libFuzzer writes the reproducing input to fuzz/artifacts/ and the
      # runner is ephemeral, so before this the audit reported a path on a
      # machine that no longer existed. Failure only — a clean run has
      # nothing to keep, and the corpus is deliberately NOT uploaded:
      # it is human-curated in-tree, and shipping machine-generated inputs
      # back would invite merging what nobody reviewed (#445).
      - name: Keep the reproducer when a target crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

      # The Go half (#445): the fuzzing engine ships in the toolchain, so
      # there is no extra binary, no sanitizer flag and no nightly — but
      # the same two properties put it here rather than in the gate. It is
      # time-bound (the documented -fuzztime default is to run forever)
      # and it writes. A repo with no Go fuzz target skips clean.
      - name: Run every Go fuzz target for a bounded interval
        run: mise run audit:go-fuzz

      # Go writes the failing input into the package's own
      # testdata/fuzz/<Target>/ rather than a dedicated artifacts
      # directory, so this necessarily carries the committed seed corpus
      # along with the new crasher. That is accepted rather than worked
      # around: the run's output names the exact file, and a filter that
      # tried to separate the two would be guessing at which of the
      # runner's files were new. Failure only, same as the Rust half, and
      # the cron still never pushes.
      - name: Keep the failing input when a Go target crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-fuzz-corpus-${{ github.run_id }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
          retention-days: 30

  go-vulns:
    name: audit / go vulnerabilities
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      # Call-graph-aware advisory scan against https://vuln.go.dev —
      # network-bound and feed-dependent, so it lives here, never the
      # gate (#392). A repo with no go.mod skips clean.
      - name: Check reachable Go vulnerabilities
        run: mise run audit:go-vulns

  links:
    name: audit / links
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      # Link liveness over the caller's own tracked markdown. Network-
      # bound and a property of the internet rather than the diff, so it
      # is an audit and never the gate. The belt's lychee.toml arrives
      # with the canon and is passed explicitly, so a repo-local
      # lychee.toml cannot quietly outrank it; `.lycheeignore` remains
      # the repo's own per-link escape (#681). A repo with no tracked
      # markdown skips clean.
      - name: Check links
        run: mise run audit:links

  actions:
    name: audit / actions (online)
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      - name: Audit workflows online
        env:
          # zizmor's API-backed audits — impostor-commit,
          # known-vulnerable-actions, ref-confusion, typosquat-uses,
          # stale-action-refs — are the ones the gate's --offline run
          # structurally cannot perform, so until #681 they ran against
          # no consumer at all. The default token is enough: they read
          # public advisory and commit data. It is passed rather than
          # assumed because the task FAILS CLOSED without it (#310
          # finding 3) — a tokenless zizmor degrades to offline, skips
          # every audit this job exists for, and still prints "No
          # findings to report".
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:actions

  action-pins:
    name: audit / action pin comments and age
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      - name: Verify pin comments and release age
        env:
          # The third per-tree network check, and the last one that was
          # scheduled in the canon alone (#681 named it tree-local and
          # #704's widening is what moved it). pinact resolves each
          # pinned SHA back to its tag to prove the version comment tells
          # the truth, and reads publish dates for the release-age floor;
          # `git ls-files` scopes it to whatever tree it runs in. The
          # gate's offline leg (lint:action-pins) can do neither — it can
          # only see that a comment exists — so until this leg, no
          # consumer's pin comments had been checked against the tags
          # they claim. Both are public reads; the default token serves.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run audit:action-pins

  repo-audits:
    name: audit / this repository's own audit tasks
    runs-on: ubuntu-24.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10
          cache: false

      # The `lint:*` symmetry the audit surface went without (#704). Every
      # leg above is a BELT task named by hand, so an `audit:<name>` a
      # consumer defined in its own mise.toml was run by nothing, ever —
      # the task existed, `mise run` found it, and no cron called it.
      # `mise run audit` collects the CALLER's audit tasks (the ones mise
      # reports as non-global) and runs each, so a repo declares a
      # network-bound check and this leg runs it with no canon change.
      # Skips clean in a repo that defines none.
      #
      # NO TOKEN, deliberately. What a collected task needs is unknown to
      # the canon, and an ambient credential handed to every future
      # caller task is a grant nobody decided. A task that needs one
      # fails closed and its need is settled here, with a reason, the way
      # every other leg's env was.
      - name: Run every audit:* this repository defines
        run: mise run audit
...
