# The pgrx-extension artifact images: one `FROM scratch` image per PG
# major, both architectures, built from the SAME verified tarballs whose
# digests the release attests — in-run, not from a post-release download,
# so there is one byte path and the index is signed in the same run under
# the same identity (docs/release.md).
#
# FROM scratch executes nothing, so both platforms assemble in one build
# with no emulation involved — there is nothing to emulate. The image
# carries one layout, /lib and /share/extension, on every major (#1298).
# The consumer proof afterwards pulls the pushed index back BY DIGEST and
# does what docs/release.md tells consumers to do: COPY --from into a
# stock postgres and CREATE EXTENSION — and on 18 and above, mounts the
# image whole and loads it through extension_control_path and
# dynamic_library_path, with nothing under the system directories.
#
# Since #118 the build pushes UNTAGGED (by digest): the per-major tag
# is applied post-gate by tag-images.yml, putting the exact manifest
# bytes the gate compared under the advertised name — digest preserved
# by construction.
#
# The runnable convenience image deliberately does not exist in canon:
# its CVE posture would be its base's, refreshable only by a release —
# the exact failure ma-db's own-the-installation decision documents.
---
name: build-pgrx-images

"on":
  workflow_call:
    inputs:
      version:
        # forwarding: universal
        description: Version being released, without the leading v.
        required: true
        type: string
      crate-dir:
        # forwarding: universal
        description: Directory of the extension crate (names the image).
        required: true
        type: string
      pg-majors:
        # forwarding: universal
        description: PG majors, matching what build-pgrx-extension built.
        required: false
        type: string
        default: 14,15,16,17,18
      facts:
        # forwarding: universal
        description: >
          The resolved facts map (JSON, org.opencontainers.image.* keys)
          from the orchestrator's facts job — the same map every image
          this release publishes carries. Applied as config labels and
          index annotations; this workflow derives no metadata of its own.
          (Its predecessor derived `created` from the only checkout it
          has, which is canon — every published extension image carried a
          .github commit's timestamp. Resolving in the caller's own guard
          job makes that bug unwritable.)
        required: true
        type: string
      source-epoch:
        # forwarding: universal
        description: >
          Committer epoch of the released commit, for SOURCE_DATE_EPOCH.
        required: true
        type: string
      dry-run:
        # forwarding: discretionary — rehearsal is versioned-only; continuous has no gate to rehearse
        description: Rehearsal — assemble and prove locally, push nothing.
        required: false
        type: boolean
        default: false
      repro:
        # forwarding: discretionary — the repro leg sets it; omission means a first build
        description: >
          Rebuild leg of the repro gate (#118): assemble and push the
          per-major indexes by digest exactly like the first build (a
          reproduced rebuild is an idempotent no-op; a mismatch leaves
          an unreferenced, untagged digest and the gate goes red), skip
          the behavioural proofs, and record the digests under repro-
          prefixed artifacts so the gate can compare. Both builds stage
          from the SAME release-extensions artifact, so a compare here
          isolates image-layer nondeterminism.
        required: false
        type: boolean
        default: false
    outputs:
      images:
        description: >
          JSON array of {pg, image, tag, digest} for every pushed index —
          the signing matrix, and (tag included) the verdict's tag→digest
          binding expectations.
        value: ${{ jobs.collect.outputs.images }}
      registry-subjects:
        description: >
          The same indexes as target-prefixed sha256sum lines, one per
          PG major — `<major> <hex>  <image>` — the shape attach-release
          takes for what a class published to a registry instead of
          beside the release (#1168). The major is this class's target
          grain, exactly as it is on the tarballs' leg-subjects.
        value: ${{ jobs.collect.outputs.registry-subjects }}

permissions: {}

jobs:
  plan:
    name: Derive the image matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Derive the matrix
        id: plan
        env:
          UNTRUSTED_MAJORS: ${{ inputs.pg-majors }}
        # One derivation and its tests (#1385).
        run: |
          .org-canon/release/matrix.py pgrx-images "${UNTRUSTED_MAJORS}" >> "${GITHUB_OUTPUT}"
  image:
    name: Assemble and prove the pg${{ matrix.pg }} artifact image
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the per-major index by digest and tag
    env:
      # The list is the whole install: no `mise run` installs the rest
      # (task auto-install is on by default; #1412).
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      PG: ${{ matrix.pg }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        # The facts assertion is a belt tool, not a file in the canon
        # tree: #495 replaced release/assert-image-facts.sh with
        # `stele assert image-facts`, and a binary on PATH has to be
        # installed where a script only had to be checked out.
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
          cache: false
          # Only what this job's steps call (#1333): the release path is
          # uncached, so every tool in scope is paid for on every run.
          # release/test_job_installs.py holds the list to the calls.
          install_args: jq github:monumental-archive/stele

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-extensions
          path: tarballs

      # The image's one layout (#1298), the same on every major: /lib and
      # /share/extension from the Debian tree each verified tarball
      # installs (release/pgrx-images.py, tested; #1381).
      - name: Stage the per-arch trees from the verified tarballs
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_CRATE_DIR: ${{ inputs.crate-dir }}
        run: |
          .org-canon/release/pgrx-images.py stage --pg "${PG}" \
            --version "${UNTRUSTED_VERSION}" --crate-dir "${UNTRUSTED_CRATE_DIR}"
      - name: Resolve the image name
        id: name
        env:
          UNTRUSTED_CRATE_DIR: ${{ inputs.crate-dir }}
        run: |
          set -euo pipefail
          base=$(basename "${UNTRUSTED_CRATE_DIR}" | tr '[:upper:]' '[:lower:]')
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${base}" >> "${GITHUB_OUTPUT}"
      - name: Create a container-driver builder
        run: docker buildx create --use --name org-pgrx --driver docker-container

      - name: Build both platforms and push by digest, untagged (#118)
        id: push
        if: ${{ !inputs.dry-run }}
        env:
          FACTS: ${{ inputs.facts }}
          SOURCE_DATE_EPOCH: ${{ inputs.source-epoch }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.name.outputs.image }}
          UNTRUSTED_VERSION: ${{ inputs.version }}
        # One build, both platforms: FROM scratch runs nothing, so no
        # emulation is involved and the native-hardware rule is not in
        # play. The buildx floor, labels and index annotations from the
        # facts, the push and its digest check are release/registry.py
        # (#1382), tested by release/test_registry.py. The tag NAME rides
        # along in the record, applied only post-gate by tag-images.yml,
        # so the step that names the tag is the step that records it.
        run: >-
          python3 .org-canon/release/registry.py push --image "${IMAGE}"
          --file .org-canon/docker/pgrx-artifact.Dockerfile --context .
          --digests /tmp/digests --pg "${PG}"
          --platform linux/amd64,linux/arm64
          --tag "${UNTRUSTED_VERSION}-pg${PG}-artifact"
      # By digest, never by tag, and exactly the documented recipes
      # (docs/release.md): COPY --from into a stock postgres on every
      # major, and on 18 and above the image mounted whole and loaded
      # through extension_control_path and dynamic_library_path. The
      # scripts the images run are docker/pgrx-*-proof.sh, files a person
      # can read and run; each Dockerfile is rendered by the tested helper,
      # which refuses a reference not pinned by digest
      # (release/pgrx-image-proof.sh; #1381).
      - name: Prove the pushed image the way a consumer uses it
        if: ${{ !inputs.dry-run && !inputs.repro }}
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          .org-canon/release/pgrx-image-proof.sh "${IMAGE}" \
            "/tmp/digests/pg${PG}.json" "${PG}" .org-canon \
            staged/amd64/image/share/extension
      - name: Assert the published metadata equals the facts
        if: ${{ !inputs.dry-run && !inputs.repro }}
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          FACTS: ${{ inputs.facts }}
        # Same proof as the oci-image class, at this class's own pull-back
        # point: OCI index, annotations and every per-arch config's labels
        # all EQUAL the one map.
        run: |
          set -euo pipefail
          DIGEST=$(jq -r .digest "/tmp/digests/pg${PG}.json")
          export DIGEST
          stele assert image-facts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.dry-run }}
        with:
          name: ${{ inputs.repro && 'repro-' || '' }}pgrx-image-digest-pg${{ matrix.pg }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  collect:
    name: Collect the signing matrix
    needs:
      - plan
      - image
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    env:
      # The list is the whole install: no `mise run` installs the rest
      # (task auto-install is on by default; #1412).
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    outputs:
      images: ${{ steps.collect.outputs.images }}
      registry-subjects: ${{ steps.collect.outputs.registry-subjects }}
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
          cache: false
          # Only what this job's steps call (#1333): the release path is
          # uncached, so every tool in scope is paid for on every run.
          # release/test_job_installs.py holds the list to the calls.
          install_args: jq github:monumental-archive/stele

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.repro && 'repro-pgrx-image-digest-pg*' || 'pgrx-image-digest-pg*' }}
          merge-multiple: true
          path: digests

      - name: Assemble and refuse a partial set
        id: collect
        # Every planned major left exactly one digest document and no
        # other did, judged by stele against the class's declared
        # subjects (stele#393, #1364); the registry lines are what the
        # signer is given. The documents also leave whole, as `images`,
        # for the signing matrix (kept beside the call, #1364).
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          set -euo pipefail
          stele derive subjects --policy .org-canon/slsa/assert-policy.json \
            --class pgrx-extension-image --expected /dev/stdin --dir digests \
            --registry-subjects-out "${RUNNER_TEMP}/registry" <<< "${EXPECTED}"
          images=$(jq -sc '.' digests/*.json)
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          {
            echo "registry-subjects<<REGISTRY_EOF" && cat "${RUNNER_TEMP}/registry" && echo "REGISTRY_EOF"
          } >> "${GITHUB_OUTPUT}"
...
