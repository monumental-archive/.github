# Badge truth across the org — scheduled, network-touching, and named
# for what a red means: a shield says something its source no longer
# says (#1884). Failures page via the Actions UI and notifications
# rather than blocking merges.
#
# Split out of the workflow once named `audit` by subject (#1884); which
# legs belong on the canon's side rather than in a repo-*.yml subject
# workflow is stated once, in slsa.yml.
---
name: badges

"on":
  schedule:
    # Mondays 07:00 UTC, beside slsa.yml, which runs once at the same
    # hour (#1888). Every leg here was a leg of the one workflow these
    # were split from (#1884).
    - cron: 0 7 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  badges:
    name: every badge says what its source says
    runs-on: ubuntu-26.04
    permissions:
      contents: read # README and .badge-states reads across org repos
      # The anonymous REST endpoint 401s even for public containers
      # (#316 addendum C, measured), so the existence check needs auth.
      packages: read # the ghcr leg asks whether the named package exists
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          cache: false

      - name: Re-check every shield against its source of truth
        env:
          # README reads across org repos; the default token reads
          # public content plus (packages: read) the container-package
          # existence checks. Red means a shield asserting something
          # its issuer no longer says (#215) — a score below its floor,
          # a lost baseline, a non-compliant REUSE status, a package or
          # workflow shield over nothing, a fair-software dot the
          # evidence contradicts, a badge block not machine-rendered,
          # or a shield nothing here checks (#316 finding 5).
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:badges

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887), with one issue per red
  # job (#1966): for each red job of a run on the default branch, one
  # issue titled "red: <job> (<workflow>)" and labelled red-check holds
  # its findings and each red leg's log tail; the next run with every
  # leg green or skipped closes it. mise/standing_issue.py has the
  # outcomes. Only `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - badges
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # each red job's red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
