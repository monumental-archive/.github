# Release phase 1, org canon. Callers pin by full SHA:
#
#   jobs:
#     release:
#       uses: monumental-archive/.github/.github/workflows/release.yml@<sha> # vX.Y.Z
#       secrets:
#         app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
#
# One SHA pins this file, the canonical release scripts, and the toolbelt
# atomically: the canon tree arrives via `$/.github/actions/canon`, the
# same self-repository resolution that fetched this file (#165).
#
# This workflow decides the version, maintains the Release PR, and — when
# that PR is merged — tags and cuts a DRAFT GitHub release. It builds
# nothing, publishes nothing, and signs nothing: phase 2 (the caller's own
# publish workflow, triggered by the tag this pushes) does all of that, so
# provenance names the tag rather than a moving branch. See docs/release.md
# for the full canon, including why this is a derivation step around
# `stele derive` rather than a release tool.
#
# Both jobs authenticate as the org's tag-mint App, with per-job scoped
# tokens: the Release-PR job gets contents + pull-requests, the tag job gets
# contents only. The default GITHUB_TOKEN is never used for either — its
# pushes and PRs trigger no workflows, and a release that silently triggers
# nothing looks exactly like a success.
---
name: release

"on":
  workflow_call:
    secrets:
      app-private-key:
        # forwarding: universal
        description: Tag-mint App private key
        required: true

permissions: {}

jobs:
  tag:
    name: Tag on Release PR merge
    # The two jobs are mutually exclusive by commit subject, so there is no
    # ordering race between them to serialise. workflow_dispatch is the
    # recovery path: re-run the tag step against a release commit whose
    # first attempt failed — the script refuses anything else.
    #
    # capability-boundary: this job holds `id-token: write` for exactly
    # one step — gitsign minting the keyless signature on the release
    # tag object (#349 S4). It runs no caller-supplied code: its steps
    # are the canon's tag-release.sh and the `stele derive release-plan`
    # it invokes with the canonical configuration; the caller
    # contributes a tree to read, never a step to execute. The same case
    # that admitted the scheduled workflows and verify-release: refusing
    # to sign the tag in order to protect the identity would leave the
    # release chain's one unsigned pointer unsigned forever.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-24.04
    permissions:
      # The checkout below clones the CALLER's repository with this job's
      # ambient token, and a job that declares any permission gets `none`
      # for every scope it leaves out — so until this line the clone
      # worked only because every consumer of this workflow is public
      # (#850). On a private one the tag leg would have died at checkout,
      # after the Release PR was merged, at the least recoverable moment
      # on the path.
      #
      # This is not an enlargement of the signing job's grant: it is the
      # grant the job already depended on, made visible where the
      # capability-boundary argument above is read. It adds no write
      # surface, so that argument stands as written.
      contents: read
      id-token: write # gitsign keyless tag signature, nothing else
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `stele derive release-plan`, run by tag-release.sh, derives
          # the version and the notes from the whole local history: its
          # --git-dir is "a local clone with full history and tags
          # fetched (required)", and the engine refuses to network for
          # refs the workflow did not fetch.
          fetch-depth: 0
          # The tag is pushed with the App token, so the checkout credential
          # is neither needed nor wanted.
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.12
          # No tool cache in a job that tags a release (cache poisoning):
          # everything downstream of this tag gets signed.
          cache: false

      - name: Mint the tag token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAG_MINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Tag and cut the draft release
        env:
          # The App token, and the only one this step carries: gh reads
          # GH_TOKEN in preference to GITHUB_TOKEN, so the `gh release`
          # calls in tag-release.sh and the tag push both authenticate
          # as the App. The `stele derive release-plan` beside them
          # reads no token at all — the notes come from local history.
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git config user.name "tag-mint[bot]"
          git config user.email "tag-mint[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          .org-canon/release/tag-release.sh
  release-pr:
    name: Maintain the Release PR
    # The release-published leg closes seam 5 of #358: this job runs on
    # the push of ordinary commits, which lands BEFORE the previous
    # release's publish has finished — so a derivation that reads "the
    # published release" (the pgrx upgrade path) reads a version about
    # to be superseded, and nothing re-derived it before merge (measured
    # on release-lab v0.24.3: derived from v0.24.1 at 11:04, v0.24.2
    # published at 11:11, merged stale at 15:22). Callers that add
    # `release: types: [published]` to their stub (the template carries
    # it) re-run this leg when the in-flight publish lands, so the open
    # Release PR refreshes itself with the then-true previous version.
    # The backstop for a merge inside the remaining window is
    # tag-release.sh, which refuses to mint on a stale path.
    if: >-
      (github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: release v')) ||
      (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-24.04
    permissions:
      # Two readers, both of them ambient-token reads of this
      # repository's own contents: the checkout below, and the
      # `gh release` view and asset download generate-pgrx-upgrade.sh
      # performs against `github.token` to derive the pgrx upgrade path.
      #
      # The notes need nothing here. `stele derive release-plan` builds
      # the changelog from the local history and renders pull-request
      # links from its own --pull-url template, so producing an entry
      # consults no GitHub API at all.
      #
      # `contents: read` is the whole grant either reader buys, and it
      # is read-only.
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # On a release-published refresh the payload SHA is the tag's
          # commit, not the branch head the Release PR is maintained
          # from — the refresh must derive against the default branch.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.12
          cache: false

      - name: Prepare the release
        # No token: prepare-release.sh derives the plan from the local
        # history and writes the tree it names, reaching no forge.
        id: prepare
        run: .org-canon/release/prepare-release.sh

      - name: Derive and prove pgrx upgrade scripts
        # Upgrade SQL is a build product, never authored (#132): derived
        # from the published release's own tarball and the candidate
        # build, proven with a live ALTER EXTENSION UPDATE plus catalog
        # equality against a fresh install, and committed to the Release
        # PR alongside the bump. Skips clean when the repo tracks no
        # extension control file — this step is why a pgrx repo's Release
        # PR takes a build's worth of minutes: failing here is free;
        # failing after the tag burns an immutable version number.
        if: steps.prepare.outputs.release == 'true'
        id: upgrade
        env:
          # Read-only: release metadata and tarball download on a public
          # repository.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          PREV_MANIFEST: ${{ steps.prepare.outputs.current }}
        run: .org-canon/release/generate-pgrx-upgrade.sh

      - name: Re-derive the coverage floor
        # Derived state, like the version and the changelog beside it
        # (#652): measure the tree being released, write
        # `measured - band`, and let the file ride the release commit.
        # A measurement below `floor + band` FAILS here — loudly, and
        # before a version number is spent — rather than lowering the
        # floor, because the floor only rises. A repository with no
        # `.coverage-floor` has adopted no ratchet and skips clean.
        if: steps.prepare.outputs.release == 'true'
        id: floor
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: .org-canon/release/derive-coverage-floor.sh

      - name: Mint the Release-PR token
        # A range of nothing but chore/ci/docs commits bumps no version, so
        # there is nothing to propose, no empty PR to leave lying around —
        # and no token to mint.
        if: steps.prepare.outputs.release == 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAG_MINT_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the Release PR
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The App's own slug, so the release commit can sign itself off as
          # the identity that authors it. `gh api user` cannot be used: an
          # installation token has no user context and answers 403.
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          PLAN: ${{ steps.prepare.outputs.plan }}
          # Only what the plan could not have known about: the pgrx
          # upgrade scripts, derived against the published release after
          # the plan was made, and the coverage floor, derived from a
          # measurement of the tree the plan describes. Everything else
          # the commit carries is the plan's own file list (stele#155).
          EXTRA_FILES: ${{ steps.upgrade.outputs.files }} ${{ steps.floor.outputs.files }}
        run: .org-canon/release/open-release-pr.sh
...
