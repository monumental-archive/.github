# The repo-side weekly mutation run (#1355, under #1336's testing
# standard): would the suite fail if the code were wrong? Callers pin by
# full SHA, repo-audit.yml-style, from their own scheduled stub
# (workflow-templates/mutants.yml):
#
#   jobs:
#     mutants:
#       uses: monumental-archive/.github/.github/workflows/repo-mutants.yml@<sha> # vX.Y.Z
#
# ITS OWN WORKFLOW, NOT A LEG OF repo-audit.yml (owner's ruling on
# #1355). A mutation run's red is a survivor to kill, and folded into the
# audit it turned the whole weekly audit red, so nobody could tell what
# else had passed. The audit's result keeps meaning what it meant; this
# file's result means one thing: is there an unexplained survivor.
#
# A mutation run repeats the suite once per mutant, which is why it is a
# cron and never the gate. The measure is no unexplained surviving
# mutant, never a score; adoption is each language's own config file in
# the repository (`.cargo/mutants.toml` for Rust, a pattern-free root
# `.gomuignore` for Go), and a repository that
# adopts nothing has every leg skip clean by name. The belt's
# `audit:mutants` task runs one leg per language (mise/mutants-*.sh).
#
# EACH LANGUAGE HAS ITS OWN JOBS (owner's ruling): a shard matrix and a
# totals job per language, each running only its language's leg
# (MUTANTS_LEG). Two adopted languages are two ticks, two shard counts
# and two timeouts, and a red names its language at the job level. A
# language's jobs run only where `adoption` finds its config tracked: a
# repository without it shows them skipped, not run-and-skipped. The
# guard is a job of its own because `hashFiles` is step-only — measured,
# actionlint refuses it in `jobs.<id>.if` ("only available in
# jobs.<job_id>.steps.*").
#
# Rust is SHARDED FROM THE START (owner's ruling): four shards, each
# judging its slice and naming its own survivors, then one job stating
# the answer across them. The count and the timeout are adjusted from
# the first run measured on a runner — release-lab's dispatched run —
# and recorded on the issue.
# No inputs, by design — zero caller-controlled expansion.
---
name: repo-mutants

"on":
  workflow_call: {}
permissions:
  contents: read

jobs:
  adoption:
    name: mutants / which languages adopt
    runs-on: ubuntu-26.04
    # One output per language: "true" when that tool's own config is in
    # the checkout — a fresh checkout holds tracked files only, so this
    # is the leg's own test (git ls-files). `hashFiles` is allowed in a
    # step's env, never a job's `if`. A language adds one step and one
    # output line.
    outputs:
      rust: ${{ steps.rust.outputs.adopted }}
      go: ${{ steps.go.outputs.adopted }}
      python: ${{ steps.python.outputs.adopted }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python's adoption is a SECTION, not a file: pyproject.toml is in
      # most Python repositories whether they adopt or not.
      - name: Python adopts with [tool.mutmut] (or setup.cfg [mutmut])
        id: python
        run: |
          adopted=false
          if grep -qs '^\[tool\.mutmut\]' pyproject.toml || grep -qs '^\[mutmut\]' setup.cfg; then
            adopted=true
          fi
          echo "adopted=${adopted}" >> "${GITHUB_OUTPUT}"

      - name: Rust adopts with a tracked .cargo/mutants.toml
        id: rust
        env:
          ADOPTED: ${{ hashFiles('.cargo/mutants.toml') != '' }}
        run: echo "adopted=${ADOPTED}" >> "${GITHUB_OUTPUT}"

      - name: Go adopts with a tracked root .gomuignore
        id: go
        env:
          ADOPTED: ${{ hashFiles('.gomuignore') != '' }}
        run: echo "adopted=${ADOPTED}" >> "${GITHUB_OUTPUT}"

  mutants-rust:
    name: mutants / rust shard ${{ matrix.shard }}
    needs: adoption
    if: needs.adoption.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    # The count is written twice, here and in MUTANTS_SHARDS below; move
    # both together. No fail-fast: every shard reports its own survivors.
    # No timeout of its own yet: it is set from the first runner run.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
      MUTANTS_SHARDS: "4"
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          cache: false

      # The belt pins cargo-mutants `lazy`, so the bare install above —
      # and every gate and release job — skips it (measured, #1355).
      # This job is the one place it is built: from source (no arm64 or
      # checksummed asset upstream), from the lock, with the
      # repository's own rust pin installed above.
      - name: Install cargo-mutants, by name
        run: mise install cargo:cargo-mutants

      # The leg writes its counts for the totals job into the summary
      # directory (it creates it) as rust.tsv.
      - name: Mutate this shard, and name every unexplained survivor
        env:
          MUTANTS_LEG: rust
          MUTANTS_SHARD: ${{ matrix.shard }}/${{ env.MUTANTS_SHARDS }}
          MUTANTS_SUMMARY_DIR: ${{ runner.temp }}/mutants-summary
        run: mise run audit:mutants

      # Survivors or not: the totals job needs every shard's counts. A
      # shard whose run judged nothing writes none, and is named there.
      - name: Keep this shard's counts for the totals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-rust-summary-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants-summary/
          if-no-files-found: ignore
          retention-days: 7

  mutants-rust-totals:
    name: mutants / rust totals
    # The measure is one answer across the shards: no unexplained
    # survivor in the whole population. Runs whatever the shards did,
    # wherever Rust adopts.
    needs:
      - adoption
      - mutants-rust
    if: always() && needs.adoption.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Collect every shard's counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-rust-summary-*
          path: ${{ runner.temp }}/mutants-summaries

      - name: State the totals across shards
        env:
          SUMMARIES: ${{ runner.temp }}/mutants-summaries
        run: bash .org-canon/mise/mutation-totals.sh "${SUMMARIES}" rust

  mutants-go:
    name: mutants / go shard ${{ matrix.shard }}
    needs: adoption
    if: needs.adoption.outputs.go == 'true'
    runs-on: ubuntu-26.04
    # Go's own count, written twice, here and in MUTANTS_SHARDS below;
    # move both together. The leg runs gomu with ONE worker (#1356: four
    # parallel -overlay workers were running when a Mac ran out of
    # memory), so the parallelism is the shards. No fail-fast: every
    # shard reports its own survivors. No timeout of its own yet: it is
    # set from the first runner run, stele's dispatched one.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
      MUTANTS_SHARDS: "4"
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          cache: false

      # The belt pins gomu `lazy`, so the bare install above — and every
      # gate and release job — skips it. This job is the one place it is
      # installed: the prebuilt binary, checksummed in the lock. The
      # repository's own go pin was installed above.
      - name: Install gomu, by name
        run: mise install github:sivchari/gomu

      # The leg writes its counts for the totals job into the summary
      # directory (it creates it) as go.tsv.
      - name: Mutate this shard, and name every unexplained survivor
        env:
          MUTANTS_LEG: go
          MUTANTS_SHARD: ${{ matrix.shard }}/${{ env.MUTANTS_SHARDS }}
          MUTANTS_SUMMARY_DIR: ${{ runner.temp }}/mutants-summary
        run: mise run audit:mutants

      # Survivors or not: the totals job needs every shard's counts. A
      # shard whose run judged nothing writes none, and is named there.
      - name: Keep this shard's counts for the totals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-go-summary-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants-summary/
          if-no-files-found: ignore
          retention-days: 7

  mutants-go-totals:
    name: mutants / go totals
    # One answer across Go's shards, whatever they did, wherever Go
    # adopts.
    needs:
      - adoption
      - mutants-go
    if: always() && needs.adoption.outputs.go == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Collect every shard's counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-go-summary-*
          path: ${{ runner.temp }}/mutants-summaries

      - name: State the totals across shards
        env:
          SUMMARIES: ${{ runner.temp }}/mutants-summaries
        run: bash .org-canon/mise/mutation-totals.sh "${SUMMARIES}" go

  mutants-python:
    name: mutants / python
    needs: adoption
    if: needs.adoption.outputs.python == 'true'
    runs-on: ubuntu-26.04
    # One job: mutmut 3.8.1 cannot shard. No timeout of its own yet: it
    # is set from the canon's first run on a runner (#1354).
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          cache: false

      # The belt pins mutmut `lazy`, so the bare install above — and
      # every gate and release job — skips it. This job is the one
      # place it is installed, on the belt's pinned Python (#1354).
      - name: Install mutmut, by name
        run: mise install pipx:mutmut

      # The leg writes its counts for the totals job into the summary
      # directory (it creates it) as python.tsv.
      - name: Mutate, and name every unexplained survivor
        env:
          MUTANTS_LEG: python
          MUTANTS_SHARD: 0/1
          MUTANTS_SUMMARY_DIR: ${{ runner.temp }}/mutants-summary
        run: mise run audit:mutants

      - name: Keep the counts for the totals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-python-summary-0
          path: ${{ runner.temp }}/mutants-summary/
          if-no-files-found: ignore
          retention-days: 7

  mutants-python-totals:
    name: mutants / python totals
    # The same one answer every language states, from its own job. A
    # run that judged nothing writes no counts and is named here.
    needs:
      - adoption
      - mutants-python
    if: always() && needs.adoption.outputs.python == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Collect the counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-python-summary-*
          path: ${{ runner.temp }}/mutants-summaries

      - name: State the totals
        env:
          SUMMARIES: ${{ runner.temp }}/mutants-summaries
        run: bash .org-canon/mise/mutation-totals.sh "${SUMMARIES}" python
...
