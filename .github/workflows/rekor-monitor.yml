# Signer-identity monitoring — the detective control for the one risk
# `--signer-workflow` verification cannot prevent: a branch push in the
# signer repository minting a certificate whose SAN matches the pinned
# identity. Verification pins the path, not the ref; this watches
# Fulcio's certificate transparency log, the record of every certificate
# Fulcio issues. Every certificate found is reconciled against a signing
# the org performed, and one that does not reconcile files an issue
# (#1250) — the org's own releases match on every signing, so a match
# alone tells nobody anything. The log also shows a certificate issued
# and never used to sign, which a watch on the signature log could not.
#
# What runs: `stele assert signer-certificates` (#1339, stele#387), the
# belt's pinned stele, one verb. It reads the log in chunks from its
# checkpoint, verifies the tree head and its consistency with the last
# one, reconciles every match against the forge, rewrites the checkpoint
# after each done chunk, and seals a report. The log, the signer and its
# callers are policy (slsa/assert-policy.json, `signerCertificates`).
# This workflow keeps the checkpoint between runs and says who is told.
# It used to build a patched sigstore/rekor-monitor and judge in Python;
# that reader held the whole range in memory and kept nothing unless all
# of it was read, so a backlog fed itself (#1339). The file keeps its
# name so the workflow stays dispatchable and its history in one place
# (#1237). github-owned actions only, so the allowlist stays as it is.
#
# The checkpoint rides the Actions cache. That is safe HERE and would not
# be in a build workflow: nothing downstream is signed, main's cache is
# not writable from pull requests, and stele proves the log consistent
# with the checkpoint's tree head before it reads an entry.
---
name: rekor-monitor

"on":
  schedule:
    # Sized by measurement (#1339). stele judged 50,000 entries in a
    # 20-minute run (about 42/s, five bare 429s); the log grows about
    # 69,000 an hour (19.3/s). A 40-minute budget judges about 100,000.
    # GitHub created this hourly schedule's runs every 4 to 10 hours
    # (2026-11-15 to 11-17), when 280,000 to 700,000 entries had arrived:
    # the schedule alone loses ground every run. So a run that advanced
    # short of the head starts the next (the last step): back to back,
    # about 1.3 runs and 133,000 entries an hour, the backlog shrinking by
    # about 64,000 an hour. The schedule restarts the watch after it has
    # caught up, or after a run that did not advance.
    - cron: 17 * * * *
  workflow_dispatch:
    inputs:
      start-at:
        # stele refuses this when a checkpoint exists, and refuses to
        # start with no checkpoint and none given: where the watch starts
        # is a decision a person makes, never a missing cache (#1145).
        # The first run of this reader is 445241315, the old monitor's
        # last checkpoint; never the log's head, which skips the range.
        description: Found a new checkpoint at this tree size (refused when one exists)
        required: false
        default: ""
        type: string
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Watch the log for the signer identity
    runs-on: ubuntu-26.04
    # The budget is 40 minutes and stele stops at its last done chunk
    # when it ends; ten more cover set-up, filing and the save. The App
    # token lives an hour, so a longer budget would reach matches it can
    # no longer read the forge for.
    timeout-minutes: 50
    # The audit App's credentials live in this environment, as they do
    # for audit.yml's legs; stele reads the forge with that App's token
    # (#1250). The environment carries no protection rules and no branch
    # policy, so it gates nothing here.
    environment: audit
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      actions: write # the next run while a range is outstanding (the last step)
      contents: read # the canon's policy, belt and helpers
      issues: write # a certificate that does not reconcile must page, not just log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # unattested-path: this workflow builds and signs nothing — the
      # cache holds stele's CT-log checkpoint, which is exactly the state
      # it exists to carry between runs (the consistency proof runs from
      # the checkpoint's tree head). Poisoning it degrades the watch,
      # never an artifact; the cold-build rule (lint:cold-attested)
      # governs attested paths only. The prefix is new with stele's
      # reader (#1339): the old monitor's file is never restored into it.
      - name: Restore the previous checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint.json
          key: ct-watch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ct-watch-

      # Read-only, and only what the reconciliation reads: workflow runs,
      # the workflow files and commits they name, and the population.
      # Every repository in the installation, on purpose: the population
      # has a private member, and a listing without it refuses to start.
      # Named here so the token cannot widen when the App's own grants do.
      # The job still declares no id-token and runs no caller-supplied
      # code.
      - name: Mint the audit App's read token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-metadata: read
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          cache: false
          # Only what this job's steps call (#1333).
          install_args: github:monumental-archive/stele

      # Exit 0 judged to the head, 1 a certificate did not reconcile, 4 a
      # range is outstanding; each is judged by the last steps, so this
      # one records the status and stays green. The restored checkpoint is
      # copied first: stele rewrites the file, and a run whose save is
      # skipped names the one that persists. stdout is the report alone.
      - name: Judge the log from the checkpoint
        id: stele
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          START_AT: ${{ inputs.start-at }}
        run: |
          set -euo pipefail
          if [[ -f checkpoint.json ]]; then
            cp checkpoint.json "${RUNNER_TEMP}/checkpoint-before.json"
          fi
          args=(--policy slsa/assert-policy.json --checkpoint checkpoint.json
            --org "${GITHUB_REPOSITORY_OWNER}" --budget 40m --json)
          if [[ -n ${START_AT} ]]; then
            args+=(--start-at "${START_AT}")
          fi
          rc=0
          stele assert signer-certificates "${args[@]}" > "${RUNNER_TEMP}/report.json" || rc=$?
          echo "code=${rc}" >> "${GITHUB_OUTPUT}"
          echo "stele exited ${rc}"
      # One issue per certificate that did not reconcile, deduplicated by
      # its CT index, from the report's findings whatever its verdict: a
      # run that stopped partway carries the findings of every chunk it
      # finished, and the next run starts past them.
      - name: File an issue for each certificate that did not reconcile
        id: findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/rekor-monitor/findings.py --report "${RUNNER_TEMP}/report.json" --run-url "${RUN_URL}"

      # unattested-path: the save half of the checkpoint restore
      # marked above — same cache, same reasoning: this workflow
      # builds and signs nothing, and the entry holds only stele's
      # CT-log checkpoint. Marked per declaration (#676); the restore
      # step's marker does not carry the file.
      # Saved only once stele has exited, its report is written and every
      # finding in it has its issue — never on stele's exit status, since
      # 1 and 4 both advance the file. A run killed before this persists
      # nothing and its range is judged again (#1339).
      - name: Save the checkpoint
        id: save
        if: ${{ steps.findings.outcome == 'success' && hashFiles('checkpoint.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint.json
          key: ct-watch-${{ github.run_id }}-${{ github.run_attempt }}

      # The run's colour and the standing issue (#1353), from stele's exit
      # status, its report and the checkpoint that persists. `always()`:
      # a job ended by its own timeout is CANCELLED, and that is exactly a
      # run that must say the watch is behind. standing-issue.py's header
      # has the outcomes.
      - name: Judge the run and keep the standing issue
        id: judge
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.stele.outputs.code }}
          SAVED: ${{ steps.save.outcome == 'success' }}
        run: |
          python3 .github/rekor-monitor/standing-issue.py --exit-code "${CODE}" \
            --report "${RUNNER_TEMP}/report.json" --checkpoint checkpoint.json \
            --before "${RUNNER_TEMP}/checkpoint-before.json" --saved "${SAVED}" \
            --run-url "${RUN_URL}"
      # A run that advanced a saved checkpoint short of the head starts
      # the next: the schedule is delivered every 4 to 10 hours and one
      # run judges about 100,000 entries, so a backlog is read off back to
      # back, never left to the schedule (#1339). The concurrency group
      # queues it behind this run. No start-at: the next run resumes from
      # the checkpoint just saved. A run that did not advance asks for
      # nothing, so a watch that is failing does not loop.
      - name: Start the next run while a range is outstanding
        if: ${{ !cancelled() && steps.judge.outputs.dispatch == 'true' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rekor-monitor.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
...
