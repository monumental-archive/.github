# Rekor identity monitoring — the detective control for the one risk
# `--signer-workflow` verification cannot prevent: a branch push in the
# signer repository minting a certificate whose SAN matches the pinned
# identity. Verification pins the path, not the ref; this watches the
# transparency log for every certificate issued to that identity, so an
# unexpected issuance surfaces as a filed issue instead of never.
#
# SELF-CONTAINED, deliberately. sigstore/rekor-monitor ships a reusable
# workflow, and this org briefly allowlisted it — but its base workflow
# runs `dawidd6/action-download-artifact` (third-party, single-maintainer)
# and a slsa-github-generator action, so admitting it meant admitting
# those: the first dispatch died as startup_failure on the org's own
# Actions policy. What the reusable actually does is run
# ./cmd/rekor_monitor --once around a checkpoint file, so this workflow
# does exactly that with github-owned actions only — the same trade as
# hand-rolled `docker buildx` over the docker/* actions, and the
# allowlist stays at four patterns.
#
# Known gap, recorded in issue #28 and accepted: identity matching covers
# the hashedrekord entry type only, and GitHub artifact attestations are
# DSSE — so this watches the identity's use in signing flows generally,
# not each attestation individually. A detective control with a gap beats
# declining to watch the log; revisit when rekor-monitor grows DSSE
# identity matching.
#
# The checkpoint rides the Actions cache. That is safe HERE and would not
# be in a build workflow: nothing downstream is signed, main's cache is
# not writable from pull requests, and the worst a stale or lost
# checkpoint causes is re-scanning a log range — the monitor's consistency
# proof runs from whatever checkpoint it is given.
---
name: rekor-monitor

"on":
  schedule:
    # Twice daily. The monitor advances from its stored checkpoint, so no
    # interval loses log entries — a shorter one only shortens the window
    # between a forged issuance and its issue being filed.
    - cron: 17 5,17 * * *
  workflow_dispatch:
    inputs:
      found:
        description: Start a new checkpoint (the log before now goes unmonitored)
        required: false
        default: "false"
        type: string
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Watch the log for the signer identity
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout of the pinned monitor source
      issues: write # an unexpected issuance must page, not just log
    steps:
      - name: Check out rekor-monitor (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sigstore/rekor-monitor
          ref: 2cbcfa260c42a9b2f060c7769adb5d1c31a3b7c7 # main 2026-08-10
          persist-credentials: false

      # unattested-path: setup-go's `cache:` defaults to true, so this
      # step warms a Go module cache — same verdict as the checkpoint
      # cache below, and for the same reason: this workflow builds and
      # signs nothing, so a poisoned module cache degrades the monitor
      # and can reach no artifact. Marked rather than disabled because
      # the monitor is built from source and the cache is the only
      # thing keeping that off a cold module download twice a day.
      - name: Set up Go from the monitor's own go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod

      # unattested-path: this workflow builds and signs nothing — the
      # cache holds the monitor's own Rekor checkpoint, which is exactly
      # the state it exists to carry between runs (consistency proofs
      # need the previous checkpoint). Poisoning it degrades the monitor,
      # never an artifact; the cold-build rule (lint:cold-attested)
      # governs attested paths only.
      - name: Restore the previous checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint_log.txt
          key: rekor-checkpoint-${{ github.run_id }}
          restore-keys: rekor-checkpoint-

      # A run with no checkpoint starts from the head of the log and
      # finishes in seconds, having monitored nothing before now — and it
      # is GREEN. Measured 2026-11-13: the first run on ubuntu-26.04 found
      # no cache ("Cache not found for input keys"), passed in under a
      # minute, and so silently skipped every entry since the last run
      # that had completed, on 2026-10-18. Starting from nothing is a
      # decision a person makes, by dispatch, never something a missing
      # cache decides (#1145).
      - name: Refuse to start from no checkpoint
        if: ${{ hashFiles('checkpoint_log.txt') == '' && github.event.inputs.found != 'true' }}
        run: |
          set -euo pipefail
          echo "::error::no checkpoint was restored — the log since the last completed run is unmonitored"
          echo "::error::dispatch this workflow with found=true to start a new checkpoint knowingly"
          exit 1
      # Built once and run as a binary, not `go run`: the signal below
      # must reach the monitor itself, and `go run` would take it in the
      # go command's place (#1145).
      - name: Build the monitor
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/rekor_monitor" ./cmd/rekor_monitor
      # The checkpoint's hash and its origin and size lines, before the
      # run and after it. The file is one line, the signed note with its
      # newlines written as a literal `\n`; the first field names the
      # log tree, the second is its size. A run that succeeded without
      # moving the checkpoint is then visible in one place (#1145).
      - name: Record the checkpoint before the run
        id: before
        run: |
          set -euo pipefail
          if [[ ! -s checkpoint_log.txt ]]; then
            echo "checkpoint before: none"
            echo "sha256=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          line=$(tail -n 1 checkpoint_log.txt)
          origin=${line%%\\n*}
          rest=${line#*\\n}
          size=${rest%%\\n*}
          sha=$(sha256sum checkpoint_log.txt | cut -d' ' -f1)
          echo "checkpoint before: sha256 ${sha}"
          echo "checkpoint before: ${origin} / size ${size}"
          {
            echo "sha256=${sha}"
            echo "origin=${origin}"
            echo "size=${size}"
          } >> "${GITHUB_OUTPUT}"
      # SIGQUIT at 25 minutes, five before the job's own timeout: a Go
      # program that receives it prints every goroutine's stack and
      # exits, so a hung run ends with the frame it was stuck in, in its
      # own log. GOTRACEBACK=all makes "every goroutine" explicit. No
      # --kill-after: the runner's timeout is uutils coreutils 0.10.0,
      # which sends the KILL straight behind the QUIT rather than after
      # the grace period, so the monitor died with exit 137 at 25:00 and
      # wrote no stack (measured 2026-11-14). The run printed "Root hash
      # consistency verified" and then nothing for 29 minutes on 12 of
      # 13 runs on 2026-11-14 (#1145).
      - name: Run the monitor once
        env:
          GOTRACEBACK: all
        run: |
          set -euo pipefail
          cat > /tmp/monitor-config.yaml << 'CONFIG'
          monitoredValues:
            certIdentities:
              - certSubject: https://github\.com/monumental-archive/signer/\.github/workflows/sign\.yml@.*
                issuers:
                  - https://token\.actions\.githubusercontent\.com
          CONFIG
          config=$(cat /tmp/monitor-config.yaml)
          rc=0
          timeout --signal=QUIT 25m \
            "${RUNNER_TEMP}/rekor_monitor" \
            --file checkpoint_log.txt \
            --once=true \
            --user-agent "monumental-archive/.github/rekor-monitor/${GITHUB_RUN_ID}" \
            --config "${config}" || rc=$?
          if ((rc == 124)); then
            echo "::error::the monitor hung and was stopped at 25 minutes; its goroutine stacks are above"
          fi
          exit "${rc}"
      # A checkpoint that did not move while the log did is a failure,
      # whatever the monitor exited with: on 2026-10-15 and 2026-10-18
      # two runs three days apart, with a success between them, both
      # started from size 2,457,808,563. The log's head is read from
      # Rekor directly, not from the monitor's output, so a monitor that
      # said nothing cannot vouch for itself (#1145).
      - name: Record the checkpoint after the run
        if: ${{ always() && steps.before.outcome == 'success' }}
        env:
          BEFORE_SHA256: ${{ steps.before.outputs.sha256 }}
          BEFORE_ORIGIN: ${{ steps.before.outputs.origin }}
          BEFORE_SIZE: ${{ steps.before.outputs.size }}
        run: |
          set -euo pipefail
          if [[ ! -s checkpoint_log.txt ]]; then
            echo "::error::no checkpoint after the run"
            exit 1
          fi
          line=$(tail -n 1 checkpoint_log.txt)
          origin=${line%%\\n*}
          rest=${line#*\\n}
          size=${rest%%\\n*}
          sha=$(sha256sum checkpoint_log.txt | cut -d' ' -f1)
          echo "checkpoint after: sha256 ${sha}"
          echo "checkpoint after: ${origin} / size ${size}"
          if [[ -z ${BEFORE_SHA256} ]]; then
            echo "no checkpoint before the run (found=true): nothing to compare"
            exit 0
          fi
          if [[ ${sha} != "${BEFORE_SHA256}" ]]; then
            echo "checkpoint advanced: size ${BEFORE_SIZE} -> ${size}"
            exit 0
          fi
          sth=$(curl --fail --silent --show-error --retry 3 \
            --user-agent "monumental-archive/.github/rekor-monitor/${GITHUB_RUN_ID}" \
            https://rekor.sigstore.dev/api/v1/log | jq -r .signedTreeHead)
          log_origin=$(sed -n 1p <<< "${sth}")
          log_size=$(sed -n 2p <<< "${sth}")
          echo "log now: ${log_origin} / size ${log_size}"
          if [[ ${log_origin} == "${BEFORE_ORIGIN}" && ${log_size} == "${BEFORE_SIZE}" ]]; then
            echo "checkpoint unchanged and the log has not moved"
            exit 0
          fi
          echo "::error::the checkpoint did not advance although the log grew" \
            "(checkpoint size ${BEFORE_SIZE}, log size ${log_size})"
          exit 1
      # unattested-path: the save half of the checkpoint restore
      # marked above — same cache, same reasoning: this workflow
      # builds and signs nothing, and the entry holds only the
      # monitor's own Rekor checkpoint. Marked per declaration
      # (#676); the restore step's marker does not carry the file.
      - name: Save the advanced checkpoint
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint_log.txt
          key: rekor-checkpoint-${{ github.run_id }}

      # `cancelled()` beside `failure()`: the job's own 30-minute timeout
      # ends it as CANCELLED, which `failure()` does not match. For seven
      # weeks from 2026-09-24 the monitor timed out twice a day and this
      # step was skipped every time, so a dead monitor filed nothing.
      - name: File an issue on failure
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A monitoring failure and an identity finding land the same way:
          # loudly. The run log carries the distinction.
          body="The Rekor identity monitor failed or matched an unexpected certificate for the"
          body+=" signer identity. Read the run:"
          body+=" ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "rekor-monitor: failure or unexpected signer issuance (run ${GITHUB_RUN_ID})" \
            --body "${body}"
...
