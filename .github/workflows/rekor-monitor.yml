# Rekor identity monitoring — the detective control for the one risk
# `--signer-workflow` verification cannot prevent: a branch push in the
# signer repository minting a certificate whose SAN matches the pinned
# identity. Verification pins the path, not the ref; this watches the
# transparency log for every certificate issued to that identity, so an
# unexpected issuance surfaces as a filed issue instead of never.
#
# SELF-CONTAINED, deliberately. sigstore/rekor-monitor ships a reusable
# workflow, and this org briefly allowlisted it — but its base workflow
# runs `dawidd6/action-download-artifact` (third-party, single-maintainer)
# and a slsa-github-generator action, so admitting it meant admitting
# those: the first dispatch died as startup_failure on the org's own
# Actions policy. What the reusable actually does is `go run
# ./cmd/rekor_monitor --once` around a checkpoint file, so this workflow
# does exactly that with github-owned actions only — the same trade as
# hand-rolled `docker buildx` over the docker/* actions, and the
# allowlist stays at four patterns.
#
# Known gap, recorded in issue #28 and accepted: identity matching covers
# the hashedrekord entry type only, and GitHub artifact attestations are
# DSSE — so this watches the identity's use in signing flows generally,
# not each attestation individually. A detective control with a gap beats
# declining to watch the log; revisit when rekor-monitor grows DSSE
# identity matching.
#
# The checkpoint rides the Actions cache. That is safe HERE and would not
# be in a build workflow: nothing downstream is signed, main's cache is
# not writable from pull requests, and the worst a stale or lost
# checkpoint causes is re-scanning a log range — the monitor's consistency
# proof runs from whatever checkpoint it is given.
---
name: rekor-monitor

"on":
  schedule:
    # Twice daily. The monitor advances from its stored checkpoint, so no
    # interval loses log entries — a shorter one only shortens the window
    # between a forged issuance and its issue being filed.
    - cron: 17 5,17 * * *
  workflow_dispatch: {}
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Watch the log for the signer identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout of the pinned monitor source
      issues: write # an unexpected issuance must page, not just log
    steps:
      - name: Check out rekor-monitor (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sigstore/rekor-monitor
          ref: 2cbcfa260c42a9b2f060c7769adb5d1c31a3b7c7 # main 2026-08-10
          persist-credentials: false

      - name: Set up Go from the monitor's own go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod

      # unattested-path: this workflow builds and signs nothing — the
      # cache holds the monitor's own Rekor checkpoint, which is exactly
      # the state it exists to carry between runs (consistency proofs
      # need the previous checkpoint). Poisoning it degrades the monitor,
      # never an artifact; the cold-build rule (lint:cold-attested)
      # governs attested paths only.
      - name: Restore the previous checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint_log.txt
          key: rekor-checkpoint-${{ github.run_id }}
          restore-keys: rekor-checkpoint-

      - name: Run the monitor once
        run: |
          set -euo pipefail
          cat > /tmp/monitor-config.yaml << 'CONFIG'
          monitoredValues:
            certIdentities:
              - certSubject: https://github\.com/monumental-archive/signer/\.github/workflows/sign\.yml@.*
                issuers:
                  - https://token\.actions\.githubusercontent\.com
          CONFIG
          config=$(cat /tmp/monitor-config.yaml)
          go run ./cmd/rekor_monitor \
            --file checkpoint_log.txt \
            --once=true \
            --user-agent "monumental-archive/.github/rekor-monitor/${GITHUB_RUN_ID}" \
            --config "${config}"
      # unattested-path: the save half of the checkpoint restore
      # marked above — same cache, same reasoning: this workflow
      # builds and signs nothing, and the entry holds only the
      # monitor's own Rekor checkpoint. Marked per declaration
      # (#676); the restore step's marker does not carry the file.
      - name: Save the advanced checkpoint
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkpoint_log.txt
          key: rekor-checkpoint-${{ github.run_id }}

      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A monitoring failure and an identity finding land the same way:
          # loudly. The run log carries the distinction.
          body="The Rekor identity monitor failed or matched an unexpected certificate for the"
          body+=" signer identity. Read the run:"
          body+=" ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "rekor-monitor: failure or unexpected signer issuance (run ${GITHUB_RUN_ID})" \
            --body "${body}"
...
