# This repo eats its own gate: every PR runs the reusable workflow at the
# PR's own ref (local uses: needs no pin — it is the code under review).
---
name: gate

"on":
  # The trigger set must be closed over the gate's inputs. The squash-
  # subject check reads the PR TITLE and the merge targets the BASE —
  # both change only on `edited`, which the default types omit, so a
  # title fixed (or broken) after the last push kept its stale verdict
  # (#427). Payload stays the only source: on `edited` it carries the
  # new title, deterministically. Do not slim this back to defaults,
  # and do not skip body-only edits via event.changes — a skipped
  # required check counts as passing.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
  # The merge queue's own run. A queued pull request is squashed onto the
  # real tip of main in a temporary `gh-readonly-queue/…` branch and the
  # required check must report THERE, or the queue waits for a status
  # that never arrives. This is what retires "behind main": the queue
  # tests each entry against what it will actually land on, so nobody
  # rebases a branch to earn a merge. Inert until a ruleset requires the
  # queue.
  #
  # The range lints see the queue's squash commit, not the branch's
  # commits: its subject is the PR title (already held to the canon on
  # the pull_request run) and it carries the sign-off the repo's
  # web-commit-signoff setting writes — measured on main's own squash
  # commits, every one signed off and verified.
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

# A pull request's runs group by its number, so they can only cancel
# each other. Everything else groups by ref AND commit and is never
# cancelled. By ref alone, two defects: an event on a pull request that
# has already merged has no merge ref, so its github.ref is the base
# branch and it cancelled main's push gate (edtf run 43620265494,
# #1195); and the forge holds ONE pending run per group, a newer one
# replacing it as `cancelled`, so a burst of merges judged only its
# first and last commit — 27 of 28 push runs cancelled with no job,
# 2026-11-19 19:00Z-19:53Z (#1617). Grouped by commit, each commit on
# main and each merge-queue entry keeps its own verdict. `queue: max`
# would also keep them, serialised, but actionlint rejects the key
# (#1116); it would not be wanted here, where runs do not conflict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      # Stated, not inherited. A `uses:` job takes the WORKFLOW-level
      # default rather than any ambient grant, so when a shared workflow
      # gains a permission every caller that stayed silent dies as
      # startup_failure with no jobs and no log — which is exactly how
      # adding `contents: read` to release.yml broke the release lab.
      # Saying it here makes the contract a diff rather than a mystery.
      contents: read # checkout of this repo and of the toolbelt
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    secrets:
      # The coverage badge feed (#1331): the canon measures its Python
      # under a derived floor, and the upload job skips clean without
      # the token. The org secret, visibility all.
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
...
