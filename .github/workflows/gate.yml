# This repo eats its own gate: every PR runs the reusable workflow at the
# PR's own ref (local uses: needs no pin — it is the code under review).
---
name: gate

"on":
  # The trigger set must be closed over the gate's inputs. The squash-
  # subject check reads the PR TITLE and the merge targets the BASE —
  # both change only on `edited`, which the default types omit, so a
  # title fixed (or broken) after the last push kept its stale verdict
  # (#427). Payload stays the only source: on `edited` it carries the
  # new title, deterministically. Do not slim this back to defaults,
  # and do not skip body-only edits via event.changes — a skipped
  # required check counts as passing.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      # Stated, not inherited. A `uses:` job takes the WORKFLOW-level
      # default rather than any ambient grant, so when a shared workflow
      # gains a permission every caller that stayed silent dies as
      # startup_failure with no jobs and no log — which is exactly how
      # adding `contents: read` to release.yml broke the release lab.
      # Saying it here makes the contract a diff rather than a mystery.
      contents: read # checkout of this repo and of the toolbelt
    uses: ./.github/workflows/ci.yml
...
