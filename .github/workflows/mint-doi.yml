# Mint the version DOI on Zenodo, after the release is public — after
# proof, like everything else (docs/release.md). This is the deliberate
# replacement for Zenodo's flip-switch GitHub integration, whose webhook
# carries no shared-secret token (a Critical-risk Webhooks posture): here
# DOI minting is a job in the attested release flow, authenticated with a
# scoped token the repository owns.
#
# Runs no caller code. The deposit is the release's source tarball plus
# metadata read from CITATION.cff at the released tag — the file
# fix:citation derives from REUSE.toml and lint:citation keeps honest,
# so the permanent record's licence and creators are the tree's own
# declarations, never a literal or a fallback (#316 findings 1+6: the
# v0.22.1 sandbox record said MIT for a 0BSD repo and credited the
# machine account, because both fields were hard-coded fallbacks). The
# file is REQUIRED here even though the lint already gates it upstream:
# a permanent record fails closed, never publishes a guess.
#
# Versioning: Zenodo's concept DOI covers the software; each release gets
# a version DOI. The concept is found by the concept-DOI identifier
# CITATION.cff records — a direct fetch, not a search, so the title
# listing's 100-deposition page cap can never mis-resolve it (#316
# addendum A: past the cap a title search either errors on newversion
# or silently splits the citation record). With no identifier recorded
# this is the FIRST mint: guarded by asserting no submitted deposition
# already bears the title, and the summary tells the human to record
# the minted concept DOI in CITATION.cff before the next release.
name: mint-doi

on:
  workflow_call:
    inputs:
      version:
        # forwarding: universal
        description: Version being released, without the leading v.
        required: true
        type: string
    secrets:
      zenodo-token:
        # forwarding: universal
        description: Zenodo personal access token (deposit:write + deposit:actions)
        required: true

permissions: {}

jobs:
  mint:
    name: Deposit and publish the version DOI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # download the release source tarball
    steps:
      - name: Deposit, then publish — the DOI names the released bytes
        env:
          ZENODO_TOKEN: ${{ secrets.zenodo-token }}
          # Production, always — there is no sandbox lever (#316): a lab
          # that rehearses DOIs against sandbox never proves the DOI
          # path, and the sandbox's mirrored API is where the false
          # v0.22.1 record hid. A DOI squats no namespace, so rehearsal
          # releases minting real version DOIs under one concept is the
          # design, stated in release-lab's README.
          BASE_URL: https://zenodo.org
          UNTRUSTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api() {
            # Token in the header, never the URL — URLs land in logs.
            curl -sSf -H "Authorization: Bearer ${ZENODO_TOKEN}" "$@"
          }
          repo="${GITHUB_REPOSITORY}"
          title="${repo}"

          # The released source, from GitHub's own tarball of the tag.
          gh api "repos/${repo}/tarball/${TAG}" > source.tar.gz

          # Metadata: CITATION.cff at the released tag — the attested
          # revision, so the record states what the tag's tree states.
          # Required: a permanent record never publishes a fallback
          # (#316 findings 1+6). Test gh's exit status, not the
          # pipeline's: on a 404 gh prints the JSON error body to
          # stdout, and piping that into base64 -d would fail only
          # because an error body happens not to be valid base64. Decide
          # on "does the file exist", not "did the decoder choke".
          if ! content=$(gh api "repos/${repo}/contents/CITATION.cff?ref=${TAG}" --jq .content 2> /dev/null) \
            || ! printf '%s\n' "${content}" | base64 -d > cff.yaml; then
            echo "::error::no CITATION.cff at ${TAG} — a DOI-minting repo derives one from REUSE.toml (fix:citation; lint:citation gates this upstream)"
            exit 1
          fi
          # The file is fix:citation's render, so its format is the
          # generator's: these reads parse what the generator writes.
          name_lines=$(grep -A1 '^[[:space:]]*- family-names:' cff.yaml \
            | paste - - | sed -E 's/.*family-names: *"?([^"]*)"?.*given-names: *"?([^"]*)"?.*/\1, \2/' || true)
          if [[ -z "${name_lines}" ]]; then
            echo "::error::CITATION.cff carries no authors — the record credits people, never an account name"
            exit 1
          fi
          creators=$(printf '%s\n' "${name_lines}" | jq -R '{name: .}' | jq -sc '.')
          licence=$(sed -n 's/^license: //p' cff.yaml | head -1)
          if [[ ! "${licence}" =~ ^[A-Za-z0-9.+-]+$ ]]; then
            echo "::error::CITATION.cff license '${licence}' is not a single SPDX id — Zenodo's vocabulary holds ids, not expressions"
            exit 1
          fi
          desc="Release ${TAG} of ${repo}. Built, proven and signed by the monumental-archive release pipeline; verification instructions ship with the GitHub release."
          metadata=$(jq -nc \
            --arg title "${title}" \
            --arg desc "${desc}" \
            --arg version "${UNTRUSTED_VERSION}" \
            --arg licence "${licence}" \
            --argjson creators "${creators}" \
            '{metadata: {title: $title, upload_type: "software",
              description: $desc, version: $version, creators: $creators,
              access_right: "open", license: ($licence | ascii_downcase)}}')

          # The concept, from the identifier CITATION.cff records — a
          # direct fetch that resolves the concept record to its latest
          # version. No title listing, so the 100-deposition page cap
          # can never mis-resolve the concept or split the citation
          # record (#316 addendum A).
          concept_doi=$(awk '/^identifiers:/{f=1} f && /value:/{print $NF; exit}' cff.yaml)
          if [[ -z "${concept_doi}" ]]; then
            # First mint. Refuse if a submitted deposition already bears
            # this title — a concept the tree failed to record; minting
            # again would split the citation record permanently.
            listing=$(api "${BASE_URL}/api/deposit/depositions?q=title:%22${repo##*/}%22&size=10")
            existing=$(jq -r --arg t "${title}" '[.[] | select(.title == $t and .submitted == true)] | length' <<< "${listing}")
            if [[ "${existing}" != "0" ]]; then
              echo "::error::a submitted deposition already bears this title but CITATION.cff records no concept DOI — record it under identifiers: before minting again"
              exit 1
            fi
            dep=$(api -X POST "${BASE_URL}/api/deposit/depositions" \
              -H 'Content-Type: application/json' --data '{}')
          else
            # New version of the recorded concept; its draft carries the
            # previous files, which are removed so the deposit is exactly
            # this release.
            concept_recid="${concept_doi##*.}"
            if [[ ! "${concept_recid}" =~ ^[0-9]+$ ]]; then
              echo "::error::CITATION.cff concept DOI '${concept_doi}' does not end in a Zenodo record id"
              exit 1
            fi
            # A PUBLIC read that REDIRECTS: the concept record 302s to its
            # latest version, so this needs -L — and deliberately not the
            # api() helper, which carries the token: credentials are never
            # sent through a redirect for a read that needs none. Measured
            # on canon v1.22.0, the first release where a recorded concept
            # existed (both earlier mints were first-mints taking the other
            # branch): the helper returned the HTML redirect body, jq died
            # on it, and the DOI was lost after the commitment point (#316).
            latest=$(curl -sSfL "${BASE_URL}/api/records/${concept_recid}/versions/latest" \
              | jq -r '.id // empty') || true
            if [[ ! "${latest}" =~ ^[0-9]+$ ]]; then
              echo "::error::the concept record ${concept_recid} did not resolve to a latest version id (got '${latest:-nothing}')"
              exit 1
            fi
            newv=$(api -X POST "${BASE_URL}/api/deposit/depositions/${latest}/actions/newversion")
            draft=$(jq -r '.links.latest_draft' <<< "${newv}")
            dep=$(api "${draft}")
            depself=$(jq -r .links.self <<< "${dep}")
            file_ids=$(jq -r '.files[].id' <<< "${dep}")
            while IFS= read -r f; do
              if [[ -n "${f}" ]]; then
                api -X DELETE "${depself}/files/${f}" > /dev/null
              fi
            done <<< "${file_ids}"
          fi
          bucket=$(jq -r '.links.bucket' <<< "${dep}")
          self=$(jq -r '.links.self' <<< "${dep}")
          publish=$(jq -r '.links.publish' <<< "${dep}")

          api -X PUT "${bucket}/${repo##*/}-${UNTRUSTED_VERSION}.tar.gz" \
            --data-binary @source.tar.gz -H 'Content-Type: application/octet-stream' > /dev/null
          api -X PUT "${self}" -H 'Content-Type: application/json' \
            --data "${metadata}" > /dev/null
          published=$(api -X POST "${publish}")
          doi=$(jq -r '.doi' <<< "${published}")
          concept=$(jq -r '.conceptdoi // "first release — concept DOI equals this version"' <<< "${published}")
          if [[ -z "${doi}" || "${doi}" == "null" ]]; then
            echo "::error::publish returned no DOI"
            exit 1
          fi
          {
            echo "### DOI minted"
            echo
            echo "- version: \`${doi}\`"
            echo "- concept: \`${concept}\`"
            if [[ -z "${concept_doi}" ]]; then
              echo
              echo "**First mint** — record the concept DOI in CITATION.cff"
              echo "(\`identifiers:\`, via fix:citation's preserved field) before"
              echo "the next release; later mints resolve the concept from it."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::DOI ${doi} (concept ${concept})"
