# The canon eats its own release machinery: phase 1 runs at this repo's
# own ref, the gate.yml pattern. The local `uses:` is load-bearing, not a
# shortcut — a repository cannot SHA-pin itself without being permanently
# one commit behind. Inside the called workflows the canon tree arrives
# via `$/.github/actions/canon`, which for a local call resolves to the
# very commit running — so scripts + toolbelt + lockfile ride the commit
# being released, with no special case for caller == canon (#165).
#
# Phase 2 is self-publish.yml: the tag this phase mints triggers the
# shared orchestrator on the source-archive class — the canon's artifact
# is the tagged tree, archived, signed through the one signer, attached
# with its evidence and published on proof, exactly like every other
# versioned repository. (Source-track attestations — the git-notes kind —
# remain #120's standup: contemporaneous with pushes, not release-time.)
name: self-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Serialise, never cancel: a run that is minting a tag must not be killed
# by the next push to main.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      # Stated, not inherited (see gate.yml): the release-pr job inside
      # release.yml authenticates git-cliff's GitHub API calls with the
      # caller's token, and `contents: read` is the whole grant that buys.
      contents: read
      # Passed through to release.yml's tag job, where gitsign spends it
      # on the keyless tag signature (#349 S4) — the callee's
      # capability-boundary marker carries the argument.
      id-token: write # gitsign's keyless tag signature (see above)
    uses: ./.github/workflows/release.yml
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
