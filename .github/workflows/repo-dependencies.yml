# A repository's dependencies and the pins that fetch them, held to the
# live feeds and registries: the Rust advisory feed (audit:deny), Go's
# reachable vulnerabilities (audit:go-vulns, #392), zizmor's online
# action audits and the truth of each action pin's comment
# (audit:actions, audit:action-pins), and each mise lock against the
# platforms it names and against what `mise lock` writes today
# (audit:lock-arch, audit:lock-idempotent, #904). Network-bound, so
# never the deterministic gate. A red here is a dependency or a pin
# that needs a decision, and nothing else (#1858: one workflow per
# subject, named for what a red means).
#
# Every leg walks the tree it runs in — `git ls-files`,
# `.github/workflows/`, the lockfile — so each is a property of the
# caller's OWN TREE and runs from the caller (#681, #704). Callers pin
# by full SHA from their own `dependencies` stub
# (workflow-templates/dependencies.yml):
#
#   jobs:
#     dependencies:
#       uses: monumental-archive/.github/.github/workflows/repo-dependencies.yml@<sha> # vX.Y.Z
#
# The canon calls it at its running commit from self-dependencies.yml.
# No inputs, by design — zero caller-controlled expansion.
---
name: repo-dependencies

"on":
  workflow_call: {}
permissions:
  contents: read

jobs:
  # Which jobs below apply to this tree (#1891), decided from
  # `git ls-files` and mise/audit-legs.toml before any runner installs a
  # toolchain: each conditional job's `if:` reads one output, so a
  # repository without its language shows it skipped, not run-and-
  # skipped. A job of its own because `hashFiles` is step-only
  # (repo-mutants.yml's `adoption`); mise/test_audit_legs.py holds the
  # table and the `if:`s to the tasks' own guards.
  applies:
    name: which jobs apply
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      deny: ${{ steps.applies.outputs.deny }}
      go-vulns: ${{ steps.applies.outputs.go-vulns }}
      actions: ${{ steps.applies.outputs.actions }}
      action-pins: ${{ steps.applies.outputs.action-pins }}
      lock-arch: ${{ steps.applies.outputs.lock-arch }}
      lock-idempotent: ${{ steps.applies.outputs.lock-idempotent }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Decide which jobs apply
        id: applies
        run: '"${ORG_PYTHON}" .org-canon/mise/audit_legs.py repo-dependencies >> "${GITHUB_OUTPUT}"'

  deny:
    name: no undecided advisory in the Rust lock
    needs: applies
    if: ${{ needs.applies.outputs.deny == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      - name: Check the advisory feed against the lock
        run: mise run audit:deny

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  go-vulns:
    name: no reachable Go vulnerability
    needs: applies
    if: ${{ needs.applies.outputs.go-vulns == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      # Call-graph-aware advisory scan against https://vuln.go.dev —
      # network-bound and feed-dependent, so it lives here, never the
      # gate (#392). A repo with no go.mod skips clean.
      - name: Check reachable Go vulnerabilities
        run: mise run audit:go-vulns

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  actions:
    name: workflows pass the online action audits
    needs: applies
    if: ${{ needs.applies.outputs.actions == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      - name: Audit workflows online
        env:
          # zizmor's API-backed audits — impostor-commit,
          # known-vulnerable-actions, ref-confusion, typosquat-uses,
          # stale-action-refs — are the ones the gate's --offline run
          # structurally cannot perform, so until #681 they ran against
          # no consumer at all. The default token is enough: they read
          # public advisory and commit data. It is passed rather than
          # assumed because the task FAILS CLOSED without it (#310
          # finding 3) — a tokenless zizmor degrades to offline, skips
          # every audit this job exists for, and still prints "No
          # findings to report".
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:actions

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  action-pins:
    name: action pin comments match their tags and age
    needs: applies
    if: ${{ needs.applies.outputs.action-pins == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      - name: Verify pin comments and release age
        env:
          # The third per-tree network check, and the last one that was
          # scheduled in the canon alone (#681 named it tree-local and
          # #704's widening is what moved it). pinact resolves each
          # pinned SHA back to its tag to prove the version comment tells
          # the truth, and reads publish dates for the release-age floor;
          # `git ls-files` scopes it to whatever tree it runs in. The
          # gate's offline leg (lint:action-pins) can do neither — it can
          # only see that a comment exists — so until this leg, no
          # consumer's pin comments had been checked against the tags
          # they claim. Both are public reads; the default token serves.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run audit:action-pins

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  lock-arch:
    name: locked assets match the platform they name
    needs: applies
    if: ${{ needs.applies.outputs.lock-arch == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      - name: Verify each locked asset is built for the platform it names
        env:
          # Tree-local by the same test as the three legs above: the
          # subject is this repository's own mise.lock, reached through
          # `git ls-files`. The gate cannot answer it — a lock entry
          # naming `macos-arm64` while resolving an x86_64 asset is a
          # disagreement the diff shows, but whether it is a DEFECT
          # depends on whether upstream publishes a native asset at all,
          # and that lives in a release listing. A public read; the
          # default token serves.
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:lock-arch

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  lock-idempotent:
    name: each lock is what mise lock writes today
    needs: applies
    if: ${{ needs.applies.outputs.lock-idempotent == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      - name: Regenerate each lock in scratch and diff it
        env:
          # Tree-local by the same test as lock-arch above: the subject
          # is this repository's own mise.lock, reached through
          # `git ls-files`, and the question is whole-file (#904) — is
          # it what `mise lock` resolves today? The registry is the
          # resolver, so this is network and never the gate. It WILL
          # red whenever upstream changes a registry mapping, and that
          # cost was accepted on #904: a red asks for the #899-style
          # proof that the newly resolved assets run, not just a
          # regenerated file. Public reads; the default token serves.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run audit:lock-idempotent

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887), with one issue per red
  # job (#1966): for each red job of a run on the default branch, one
  # issue titled "red: <job> (<workflow>)" and labelled red-check holds
  # its findings and each red leg's log tail; the next run with every
  # leg green or skipped closes it. mise/standing_issue.py has the
  # outcomes. Only `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - applies
      - deny
      - go-vulns
      - actions
      - action-pins
      - lock-arch
      - lock-idempotent
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # each red job's red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
