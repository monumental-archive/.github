# The canon's own records run — this repository running the stub every
# other repository runs (#1858).
#
# The same file `workflow-templates/records.yml` ships, with the one
# difference every canon self-application has: the `uses:` is local,
# because the canon calls its own workflow at the running commit rather
# than pinning a release of itself (the gate.yml and self-mutants.yml
# convention). Named `self-records.yml` because `repo-records.yml` is
# the callee.
#
# And one job no other repository has: `citations`, which resolves
# every version and run cited in this repository's own docs/. Its
# subject is this repository's records, so it runs here rather than in
# the org-side workflows it came from (#1884).
---
name: records

"on":
  schedule:
    # Mondays 07:00 UTC, the canon's own Monday slot.
    - cron: 0 7 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  records:
    permissions:
      contents: read # this repository's contents, read-only
      issues: write # the callee's report job: its workflow's red-check issue (#1887)
      actions: read # the callee's report job: the run's job list and job logs (#1887)
    uses: ./.github/workflows/repo-records.yml # zizmor: ignore[self-repository]

  citations:
    name: docs citations resolve
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          cache: false

      - name: Resolve every version and run citation in docs/
        # #349 finding 2: the docs cited a tag that never existed and it
        # survived two audits — a citation is a claim about the record,
        # so it gets checked like one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:citations

  # Every scheduled workflow ends here (#1887): while a run on the
  # default branch has a red job, one issue titled "<workflow> is red"
  # and labelled red-check holds each red job and its log tail; the next
  # green run closes it. mise/standing_issue.py has the outcomes. Only
  # `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - records
      - citations
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # the workflow's one red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}"
...
