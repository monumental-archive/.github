# What a repository's tree says about the world, held to the world:
# its tracked links resolve (audit:links, #681), its best practices
# entry matches its .bestpractices.json (audit:bestpractices, #1536),
# and its history reports the fixes that came with a regression test
# (audit:regression-tests, #1335). A red here is a record that no
# longer matches what it describes, and nothing else (#1858: one
# workflow per subject, named for what a red means).
#
# Link liveness was once scheduled in the canon alone and so only ever
# walked the canon (#681): `audit:links` builds its corpus from
# `git ls-files`, so it is a property of the caller's OWN TREE and runs
# from the caller. Callers pin by full SHA from their own `records`
# stub (workflow-templates/records.yml):
#
#   jobs:
#     records:
#       uses: monumental-archive/.github/.github/workflows/repo-records.yml@<sha> # vX.Y.Z
#
# The canon calls it at its running commit from self-records.yml.
# No inputs, by design — zero caller-controlled expansion.
---
name: repo-records

"on":
  workflow_call: {}
permissions:
  contents: read

jobs:
  # Which jobs below apply to this tree (#1891), decided from
  # `git ls-files` and mise/audit-legs.toml before any runner installs a
  # toolchain: each conditional job's `if:` reads one output, so a
  # repository without its language shows it skipped, not run-and-
  # skipped. A job of its own because `hashFiles` is step-only
  # (repo-mutants.yml's `adoption`); mise/test_audit_legs.py holds the
  # table and the `if:`s to the tasks' own guards.
  applies:
    name: which jobs apply
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      bestpractices: ${{ steps.applies.outputs.bestpractices }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Decide which jobs apply
        id: applies
        run: '"${ORG_PYTHON}" .org-canon/mise/audit_legs.py repo-records >> "${GITHUB_OUTPUT}"'

  links:
    name: tracked links resolve
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache: false

      # Link liveness over the caller's own tracked markdown. Network-
      # bound and a property of the internet rather than the diff, so it
      # is an audit and never the gate. The belt's lychee.toml arrives
      # with the canon and is passed explicitly, so a repo-local
      # lychee.toml cannot quietly outrank it; `.lycheeignore` remains
      # the repo's own per-link escape (#681). A repo with no tracked
      # markdown skips clean. The job's own token lets lychee ask the
      # API whether a failed github.com link's repository exists, so a
      # private repository's links to itself pass (#1344). It reads
      # this repository and nothing else private; a dead path inside a
      # private repository is taken on trust, the most lychee can do.
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run audit:links

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  bestpractices:
    name: best practices entry matches its file
    needs: applies
    if: ${{ needs.applies.outputs.bestpractices == 'true' }}
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache: false

      # Tree-local by the #681 test (#1536): this repository's own
      # .bestpractices.json against the bestpractices.dev entry its
      # README's shield names. Red names each criterion the published
      # entry has not caught up with, and the step is re-entering the
      # form from the file, never editing the file. One anonymous read
      # of bestpractices.dev, so no token. Skips clean with no tracked
      # file or no shield.
      - name: Compare the published entry with .bestpractices.json
        run: mise run audit:bestpractices

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  regression-tests:
    name: report fixes with and without a regression test
    runs-on: ubuntu-26.04
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    steps:
      # Full history: the leg reads six months of commits, and the
      # helper refuses a shallow clone rather than print a ratio over
      # whatever one commit's depth happened to fetch (#1335).
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          cache: false

      # Tree-local by the #681 test: the subject is this repository's
      # own history. A report, never red on the ratio (#1335): the six-
      # month share of fix commits that came with a test, and the last
      # seven days' that did not, go to the job summary. Local git
      # only, so no token.
      - name: Report fixes with and without a regression test
        run: mise run audit:regression-tests

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887), with one issue per red
  # job (#1966): for each red job of a run on the default branch, one
  # issue titled "red: <job> (<workflow>)" and labelled red-check holds
  # its findings and each red leg's log tail; the next run with every
  # leg green or skipped closes it. mise/standing_issue.py has the
  # outcomes. Only `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - applies
      - links
      - bestpractices
      - regression-tests
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # each red job's red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
