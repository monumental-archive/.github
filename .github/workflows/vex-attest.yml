# VEX statements become signed claims the moment they land on main. The
# changed document in security/vex/ is signed through the org's one signer
# (the OpenVEX predicate type is on its allowlist) over the digests of the
# releases DERIVED to be affected — decisions are keyed by the dependency
# (pkg:<type>/…/<name>@<version>), and the affected-release set is
# computed from published SBOMs, the same join blast-radius and
# stele derive vex runs — so a consumer queries the verdict from the
# attestation store (`gh attestation verify --predicate-type
# https://openvex.dev/ns/v0.2.0`) without waiting for a release to carry
# the raw document.
#
# ONE statement per merge, enforced: a VEX statement is a reviewed
# decision, and a push that changes several has bundled decisions the way
# the release flow refuses to bundle releases. The plan job fails loudly
# on more than one changed document.
#
# The predicate-content contract sign.yml states: predicates must be
# assembled in a job that runs no caller-supplied code. This workflow runs
# in the canon on merged main — the document was reviewed into the tree,
# and the assembly below reads it, the published SBOMs (verified before
# trust) and the published checksums, nothing else. Published releases
# are immutable, so the decision reaches the document surface on the
# NEXT release of each affected repository, derived into that release's
# own VEX asset (stele derive vex, publish.yml); this workflow makes the
# decision public and verifiable now rather than at the next release.
---
name: vex-attest

"on":
  push:
    branches:
      - main
    paths:
      - security/vex/*.openvex.json
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve the statement and its subjects
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      subjects: ${{ steps.collect.outputs.subjects }}
      predicate: ${{ steps.collect.outputs.predicate }}
      any: ${{ steps.collect.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push range diff needs the before commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.5
          cache: false

      - name: Resolve subjects from the products the statement names
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Changed documents only: re-signing every statement on every
          # merge would pile duplicate attestations onto old digests. On
          # dispatch (or an unusable before-sha) the most recently
          # committed statement is the recovery target.
          if [[ -n ${BEFORE:-} ]] && git cat-file -e "${BEFORE}^{commit}" 2> /dev/null; then
            files=$(git diff --name-only --diff-filter=AM "${BEFORE}..HEAD" \
              -- "security/vex/*.openvex.json")
          else
            files=$(git log -1 --name-only --diff-filter=AM --format="" \
              -- "security/vex/*.openvex.json")
          fi
          files=$(grep -v "^$" <<< "${files}" || true)
          if [[ -z ${files} ]]; then
            echo "any=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::no changed statements"
            exit 0
          fi
          n=$(wc -l <<< "${files}")
          n="${n//[[:space:]]/}"
          if [[ ${n} -ne 1 ]]; then
            echo "::error::more than one VEX document changed — one decision per merge, like one release per PR"
            exit 1
          fi
          f="${files}"
          jq -e '.["@context"] and .statements' "${f}" > /dev/null || {
            echo "::error::${f} is not an OpenVEX document"
            exit 1
          }
          # Products are the org contract from security/vex/README.md:
          # pkg:<type>/…/<name>@<version> — the DEPENDENCY the judgment
          # is about, never a release tag. Which RELEASES that reaches
          # is an evidence cross-walk, and it lives in the engine
          # (stele#149): the org's published SBOMs walked, each one
          # verified as a release asset before it is trusted, matched
          # against the decision's package@version pairs, and the
          # affected releases' checksums collected as subjects. It is
          # the same traversal assert blast-radius runs from the other
          # direction, shared rather than restated — this step carried
          # ~70 lines of it, which is one join with two implementations.
          # The vocabulary it needs (the SBOM suffix, the checksums
          # asset, the OS ecosystems) is read from the policy that
          # already declares it, so the flags are a policy, a decision
          # and a population and nothing else.
          stele derive vex-subjects \
            --decision "${f}" \
            --policy slsa/assert-policy.json \
            --org "${OWNER}" \
            --out vex-subjects.json
          # The signer takes a sha256sum manifest; the document is the
          # source of both it and the notice, so the two cannot disagree
          # about which releases were bound.
          subjects=$(jq -r '.subjects[] | "\(.sha256)  \(.name)"' vex-subjects.json)
          matched=$(jq -r '[.releases[] | "\(.repo)@\(.tag)"] | join(" ")' vex-subjects.json)
          echo "::notice::affected releases: ${matched}"
          predicate=$(jq -c . "${f}")
          count=$(grep -c . <<< "${subjects}") || true
          {
            echo "subjects<<SUBJECTS_EOF"
            printf "%s" "${subjects}"
            echo "SUBJECTS_EOF"
            echo "predicate=${predicate}"
            echo "any=true"
          } >> "${GITHUB_OUTPUT}"
          echo "::notice::signing ${f} over ${count} subject(s)"
  sign-vex:
    name: Sign the statement
    needs: plan
    if: needs.plan.outputs.any == 'true'
    uses: monumental-archive/signer/.github/workflows/sign.yml@65007b2d596ea691d118584899bdacc28e1ce425 # main
    with:
      subjects: ${{ needs.plan.outputs.subjects }}
      predicate-type: https://openvex.dev/ns/v0.2.0
      predicate: ${{ needs.plan.outputs.predicate }}
      bundle-artifact: attestation-bundle-vex
    permissions:
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the claim
      artifact-metadata: write # the signer creates the storage record
...
