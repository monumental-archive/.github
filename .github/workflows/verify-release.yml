# The release verifier: one identity for every check the org's verdict
# rests on. Two modes, two invocations per release, same file:
#
#   mode: bytes    — pull the published bytes back from the registry and
#                    prove them against the built digests. Runs BEFORE the
#                    signer, and its output manifest is what the signer
#                    attests — so the attested subject is what shipped,
#                    not what we hoped shipped.
#   mode: verdict  — runs AFTER the signer. Re-proves the bytes, then
#                    opens the provenance being summarised: fetches the
#                    attestation bundles for every verified digest from
#                    the same API a stranger would use, verifies each
#                    against the org signer identity at the pinned commit
#                    (security/signer.pin in the canon tree), checks the
#                    provenance subjects equal the verified manifest,
#                    asserts buildType and externalParameters against this
#                    run's own identity (all four of verifying-artifacts'
#                    comparisons, #210), and
#                    only then assembles the VSA predicate
#                    (slsa.dev/verification_summary/v1) and signs it
#                    ITSELF (#264).
#
# Correct by construction (#208): every field of the predicate is an
# output of a check performed in this job. `verificationResult: PASSED`
# is only reachable after both the byte loop and the attestation loop
# exit clean; `verifiedLevels` is emitted only after the builder identity
# checks pass; `inputAttestations` is appended inside the same loop that
# verifies each bundle, so it cannot list what was not read or omit what
# was. The verdict is not asserted beside the verification — it is the
# verification's return value.
#
# capability-boundary: this workflow holds `id-token: write` and runs NO
# caller-supplied code — no checkout, typed inputs validated against
# whitelist shapes, a body of curl/sha256sum/jq/gh api/imagetools. It is
# sign.yml's category, not a build job's. It signs the verdict ITSELF
# (#264) because a verdict routed through the org signer makes
# `verifier.id` a string in a caller-supplied predicate: any workflow
# able to call the signer could mint a syntactically perfect PASSED
# naming this file without this file having run. Self-signing makes the
# (signer, verifier) pair a tautology — `verifier.id` IS the certificate
# subject. The org therefore carries TWO roots of trust: provenance and
# producer evidence under monumental-archive/signer/sign.yml, verdicts
# under this file (docs/runbook.md, two recipes; verdicts published
# before canon v1.14.0 verify under the signer identity instead — the
# version boundary is documented there).
#
# The one byte-handling residual, stated: this job pulls published
# artifacts, so a steered fetch could at most influence a subject
# digest — and a tenant-generated subject is the spec's explicit
# carve-out, with forging one a declared non-threat (threats E2). The
# signing material never shares a job with caller-defined build steps,
# which is the actual L3 line. The only caller-controlled bytes touched
# are the declared inputs, validated to the same whitelist shape
# sign.yml enforces.
#
# Class coverage (#209): every class gets a verdict, because every class
# has a public store to prove against — three shapes, one manifest:
#
#   registry files   — crates.io and npm serve published bytes by stable
#                      URL; pulled back and hash-compared.
#   release assets   — fetchable by public URL once the release is
#                      published, and immutable from that moment, so the
#                      proved bytes cannot drift under the verdict. Only
#                      reachable AFTER attach publishes: verdicts for
#                      these classes run post-publish, and their VSAs
#                      live in the attestation store alone (the release
#                      is sealed before the verdict exists).
#   images           — content addressing already proves the bytes;
#                      fetching a blob to re-hash it would prove nothing.
#                      What is NOT self-proving is the tag: the binding
#                      the release advertises is a mutable pointer, so
#                      the proof asserted here is that the tag resolves
#                      in the registry to the attested index digest. The
#                      policy claims exactly that, nothing more.
name: verify-release

on:
  # forwarding-default: discretionary — multi-mode verifier; each mode consumes its own input subset
  workflow_call:
    inputs:
      subjects:
        description: >
          sha256sum manifest of file subjects. In bytes mode: produced by
          the build, proven here. In verdict mode: the manifest the signer
          attested — verify-release's own bytes-mode output for registry
          classes, the build's own manifest for release-asset classes
          (whose first pull-back is necessarily here, post-publish). A VSA
          over unproven digests would be a verdict about nothing, which is
          why this step re-proves everything regardless. Optional when
          `images` carries the subjects instead; at least one of the two
          must be non-empty.
        required: false
        type: string
        default: ""
      images:
        description: >
          Image subjects as a JSON array of {image, tag, digest} — the
          untagged lowercase registry reference, the tag this release
          advertises, and the attested index digest (sha256:<hex>). Extra
          keys are ignored, so a build's signing-matrix output passes
          through unchanged. Proven by tag→digest binding, not pull-back:
          see the header.
        required: false
        type: string
        default: ""
      release-tag:
        description: >
          Declares that file subjects matched by no registry are assets of
          this published release, fetched from its public download URL.
          The declaration is proven, never inferred: with the tag set, a
          missing asset is a failure; without it, an unclaimed subject is
          a failure. There is no path on which a subject is skipped.
        required: false
        type: string
        default: ""
      mode:
        description: bytes (default) or verdict — see the header.
        required: false
        type: string
        default: bytes
      version:
        description: >
          The version released, without the leading v. Required in verdict
          mode (it names the resourceUri); ignored in bytes mode.
        required: false
        type: string
        default: ""
      npm-package:
        description: >
          For .tgz subjects: the npm package as name@version. Required
          because a scoped package's tarball filename mangles the scope
          (`@org/pkg` packs as `org-pkg-<v>.tgz`), so the registry path
          cannot be reconstructed from the file. Empty is fine when no
          subject is a tarball; a .tgz subject with no package name fails.
        required: false
        type: string
        default: ""
      dry-run:
        description: >
          Rehearsal. Nothing was published, so there are no registry bytes
          to pull back. In bytes mode the manifest passes through unchanged
          and the run says so loudly — a rehearsal must never be mistaken
          for proof. Verdict mode REFUSES a dry-run outright: a rehearsal
          must never assemble a PASSED.
        required: false
        type: boolean
        default: false
    outputs:
      subjects:
        description: The manifest, re-derived from the published bytes.
        value: ${{ jobs.verify.outputs.subjects }}

permissions: {}

jobs:
  verify:
    name: Verify the release (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # contents: read scopes the token the verdict step uses to read the
      # attestations API. The three write grants are the verdict's own
      # signing identity (#264) — see the capability-boundary marker in
      # the header for why a job that handles artifact bytes may hold
      # them: it runs zero caller code, and the spec declares a forged
      # tenant subject a non-threat (E2). Declared at the job
      # unconditionally because a called workflow's permissions are
      # checked statically; every caller inside publish.yml already
      # grants this set for its signer legs.
      contents: read
      id-token: write # the verdict's Sigstore identity — verifier.id IS the certificate
      attestations: write # persist the VSA where the runbook's consumer recipe reads
      artifact-metadata: write # the attestation storage record
    outputs:
      subjects: ${{ steps.prove.outputs.subjects }}
    steps:
      - name: Prove each declared subject against the registry
        id: prove
        env:
          UNTRUSTED_SUBJECTS: ${{ inputs.subjects }}
          UNTRUSTED_IMAGES: ${{ inputs.images }}
          UNTRUSTED_NPM_PACKAGE: ${{ inputs.npm-package }}
          UNTRUSTED_RELEASE_TAG: ${{ inputs.release-tag }}
          UNTRUSTED_MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          case "${UNTRUSTED_MODE}" in
            bytes | verdict) ;;
            *)
              echo "::error::mode must be bytes or verdict"
              exit 1
              ;;
          esac
          if [[ "${UNTRUSTED_MODE}" == "verdict" && "${DRY_RUN}" == "true" ]]; then
            echo "::error::a rehearsal must never assemble a PASSED verdict"
            exit 1
          fi
          if [[ -n "${UNTRUSTED_RELEASE_TAG}" && ! "${UNTRUSTED_RELEASE_TAG}" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::release-tag is not a plausible release tag"
            exit 1
          fi
          record='^[0-9a-f]{64}  [^[:space:]]'
          # The pulled bytes outlive this step on purpose: the verdict
          # step verifies the attestation bundles against these exact
          # files, so both checks open the same evidence.
          workdir="${RUNNER_TEMP}/verified-subjects"
          mkdir -p "${workdir}"
          out="${workdir}/verified.sha256"
          : > "${out}"
          count=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [[ -n "${line}" ]] || continue
            count=$((count + 1))
            if [[ ! "${line}" =~ ${record} ]]; then
              # Not echoed: the line is caller-controlled.
              echo "::error::subject line ${count} is not a sha256sum record"
              exit 1
            fi
            digest="${line%% *}"
            name="${line##*  }"
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "${digest}  ${name}" >> "${out}"
              echo "::warning::rehearsal: ${name} was NOT proved against a registry"
              continue
            fi
            # Each registry serves the exact bytes it stored, under a
            # stable path. Anything else here would be proving the
            # artifact against itself. The registry is dispatched on the
            # subject's extension; an extension nothing claims is a
            # failure, never a skip.
            case "${name}" in
              *.crate)
                crate="${name%-*}"
                ver="${name##*-}"; ver="${ver%.crate}"
                url="https://static.crates.io/crates/${crate}/${crate}-${ver}.crate"
                ;;
              *.tgz)
                if [[ -z "${UNTRUSTED_NPM_PACKAGE}" ]]; then
                  echo "::error::${name} is an npm tarball but no npm-package was declared"
                  exit 1
                fi
                # name@version, scope included; the version splits off the
                # LAST @ so scoped names survive.
                pkg="${UNTRUSTED_NPM_PACKAGE%@*}"
                ver="${UNTRUSTED_NPM_PACKAGE##*@}"
                if [[ -z "${pkg}" || -z "${ver}" || "${pkg}" == "${UNTRUSTED_NPM_PACKAGE}" ]]; then
                  echo "::error::npm-package must be name@version, got ${UNTRUSTED_NPM_PACKAGE}"
                  exit 1
                fi
                # The tarball path always uses the unscoped basename.
                url="https://registry.npmjs.org/${pkg}/-/${pkg##*/}-${ver}.tgz"
                ;;
              *)
                # Declared a release asset (see the release-tag input) or
                # refused — never guessed from the filename. Publishing is
                # what makes this URL exist AND what makes it immutable,
                # so this leg only runs post-publish.
                if [[ -z "${UNTRUSTED_RELEASE_TAG}" ]]; then
                  echo "::error::${name}: no registry claims this subject type and no release-tag was declared"
                  exit 1
                fi
                url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${UNTRUSTED_RELEASE_TAG}/${name}"
                ;;
            esac
            echo "::group::${name}"
            # --retry covers transient server errors; the outer loop covers
            # the 404 window while a just-published release propagates.
            fetched=""
            for attempt in 1 2 3 4 5; do
              if curl -sSfL --retry 5 --retry-connrefused -o "${workdir}/${name}" "${url}"; then
                fetched=1
                break
              fi
              echo "fetch of ${name} not ready (attempt ${attempt}), retrying"
              sleep $((attempt * 5))
            done
            if [[ -z "${fetched}" ]]; then
              echo "::error::${name}: the published bytes could not be fetched"
              exit 1
            fi
            actual=$(sha256sum "${workdir}/${name}" | cut -d' ' -f1)
            if [[ "${actual}" != "${digest}" ]]; then
              echo "::error::${name}: built ${digest}, registry served ${actual}"
              exit 1
            fi
            echo "${actual}  ${name}" >> "${out}"
            echo "verified ${name}"
            echo "::endgroup::"
          done <<< "${UNTRUSTED_SUBJECTS}"
          # Image subjects: the proof is the tag→digest binding — the one
          # claim content addressing does not make (see the header). The
          # manifest line carries the UNTAGGED reference, because that is
          # the subject name the signer attested (sign.yml, image mode)
          # and the coverage equality below compares names exactly.
          imgcount=0
          if [[ -n "${UNTRUSTED_IMAGES//[[:space:]]/}" ]]; then
            if ! jq -e 'type == "array" and length > 0 and all(.[];
                (.image | type == "string") and (.tag | type == "string")
                and (.digest | type == "string"))' \
              <<< "${UNTRUSTED_IMAGES}" > /dev/null 2>&1; then
              echo "::error::images is not a JSON array of {image, tag, digest}"
              exit 1
            fi
            # jq runs as its own statement so a parse failure surfaces as
            # itself rather than as an empty loop (SC2312).
            jq -r '.[] | [.image, .tag, .digest] | @tsv' \
              <<< "${UNTRUSTED_IMAGES}" > "${workdir}/images.tsv"
            while IFS=$'\t' read -r image tag idigest; do
              imgcount=$((imgcount + 1))
              if [[ ! "${image}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
                echo "::error::image ${imgcount} is not a lowercase ghcr.io reference"
                exit 1
              fi
              if [[ ! "${tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::image ${imgcount} has an implausible tag"
                exit 1
              fi
              if [[ ! "${idigest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::image ${imgcount} digest is not sha256:<64 lowercase hex>"
                exit 1
              fi
              if [[ "${DRY_RUN}" == "true" ]]; then
                echo "${idigest#sha256:}  ${image}" >> "${out}"
                echo "::warning::rehearsal: ${image}:${tag} was NOT resolved against the registry"
                continue
              fi
              # The registry is asked what the tag serves; the answer must
              # be the attested index. Anonymous read: the package is
              # public by the time this runs. Inspect as its own statement
              # so a failed resolution surfaces as itself, never masked by
              # the pipe into jq (SC2312).
              docker buildx imagetools inspect "${image}:${tag}" \
                --format '{{json .Manifest}}' > "${workdir}/tag-manifest.json"
              resolved=$(jq -r '.digest' "${workdir}/tag-manifest.json")
              if [[ "${resolved}" != "${idigest}" ]]; then
                echo "::error::${image}:${tag} resolves to ${resolved}, attested ${idigest}"
                exit 1
              fi
              echo "${idigest#sha256:}  ${image}" >> "${out}"
              echo "verified tag binding for ${image}:${tag}"
            done < "${workdir}/images.tsv"
          fi
          if ((count + imgcount == 0)); then
            echo "::error::nothing to verify — an empty proof is not a proof"
            exit 1
          fi
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          {
            echo "subjects<<SUBJECTS_EOF"
            cat "${out}"
            echo "SUBJECTS_EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "::notice::${count} file subject(s) and ${imgcount} image subject(s) proved"

      # The ref the caller pinned, read from the same $/ resolution that
      # fetched this workflow — it names the exact canon tree (workflows,
      # scripts, toolbelt, signer pin) that rendered this verdict, which
      # is what a VSA's policy URI is for. Never re-derived: the two prior
      # carriers disagreed with the resolution or could not be written at
      # all (#158, #165).
      - name: Resolve the canon tree (the ref the caller pinned)
        id: canon
        if: inputs.mode == 'verdict'
        uses: $/.github/actions/canon

      - name: Open the evidence and assemble the verdict
        id: verdict
        if: inputs.mode == 'verdict'
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          POLICY_REF: ${{ steps.canon.outputs.ref }}
          CANON_PATH: ${{ steps.canon.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "${UNTRUSTED_VERSION}" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::version is not a plausible version string"
            exit 1
          fi
          # The v0.16.3 VSA shipped a bare .../tree/ because the ref
          # expression came back empty (#158). The carrier is the $/
          # resolution now, but a signed verdict naming no policy must
          # never recur — refuse rather than render.
          if [[ -z "${POLICY_REF}" ]]; then
            echo "::error::POLICY_REF is empty — refusing a verdict with no policy"
            exit 1
          fi

          # The signer identity this verdict verifies against comes from
          # the canon tree the SAME resolution delivered — one pin, one
          # tree, no second derivation. lint:signer-pin keeps this file
          # equal to every sign.yml uses: literal, so a half-bump reddens
          # the gate instead of verifying against a stale signer.
          pin=$(grep -Eo '^[0-9a-f]{40}$' "${CANON_PATH}/security/signer.pin" | head -1)
          if [[ -z "${pin}" ]]; then
            echo "::error::security/signer.pin holds no 40-hex commit — cannot verify the signer"
            exit 1
          fi
          signer_path="monumental-archive/signer/.github/workflows/sign.yml"

          manifest="${WORKDIR}/verified.sha256"
          bundles="${WORKDIR}/bundles"
          mkdir -p "${bundles}"
          covered="${WORKDIR}/covered"      # subject lines proven by verified provenance
          seen="${WORKDIR}/seen-bundles"    # bundle digests already verified
          atts="${WORKDIR}/input-attestations.json"
          : > "${covered}"; : > "${seen}"
          echo '[]' > "${atts}"

          # Iterate over a copy: the subset check greps the manifest while
          # the loop reads it, and one file in both roles reads like a
          # read/write hazard even when both are reads (SC2094).
          cp "${manifest}" "${WORKDIR}/manifest-iter"
          while IFS= read -r line; do
            [[ -n "${line}" ]] || continue
            digest="${line%% *}"
            name="${line##*  }"
            api="repos/${GITHUB_REPOSITORY}/attestations/sha256:${digest}"
            # The same API a stranger queries: fetching from the store —
            # not this run's artifact — also proves the attestation was
            # persisted. Retried: the signer finished moments ago.
            fetched=""
            for attempt in 1 2 3 4 5; do
              if gh api "${api}" --jq '.attestations[].bundle' > "${WORKDIR}/raw-bundles.jsonl" 2> /dev/null \
                && [[ -s "${WORKDIR}/raw-bundles.jsonl" ]]; then
                fetched=1
                break
              fi
              echo "attestation fetch for ${name} not ready (attempt ${attempt}), retrying"
              sleep $((attempt * 5))
            done
            if [[ -z "${fetched}" ]]; then
              echo "::error::${name}: no attestation retrievable for sha256:${digest}"
              exit 1
            fi
            while IFS= read -r bundle; do
              [[ -n "${bundle}" ]] || continue
              # Only build provenance is the evidence this verdict
              # summarises; other predicate types over the same subject
              # (the VSA itself, VEX) are claims, not evidence.
              ptype=$(printf '%s' "${bundle}" \
                | jq -r '.dsseEnvelope.payload' | base64 -d \
                | jq -r '.predicateType')
              [[ "${ptype}" == "https://slsa.dev/provenance/v1" ]] || continue
              bsha=$(printf '%s' "${bundle}" | sha256sum | cut -d' ' -f1)
              bfile="${bundles}/${bsha}.json"
              if ! grep -qx "${bsha}" "${seen}"; then
                printf '%s' "${bundle}" > "${bfile}"
                # The cryptographic check: this exact bundle, over this
                # exact artifact, signed by the org signer. gh rebuilds
                # the Sigstore trust root and walks the chain; a verdict
                # field is written only after it passes. A file subject
                # is the bytes the prove step pulled back; an image
                # subject is addressed oci:// at the digest whose tag
                # binding the prove step just verified.
                case "${name}" in
                  ghcr.io/*) target="oci://${name}@sha256:${digest}" ;;
                  *) target="${WORKDIR}/${name}" ;;
                esac
                gh attestation verify "${target}" \
                  --bundle "${bfile}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --signer-workflow "${signer_path}" \
                  --deny-self-hosted-runners \
                  --predicate-type https://slsa.dev/provenance/v1 \
                  --format json > "${WORKDIR}/result.json"
                # Identity, to the commit: the certificate's signer digest
                # must be the pinned signer tree, and builder.id must name
                # the signer file — the L3 legs a run CAN measure.
                cert_digest=$(jq -r \
                  '.[0].verificationResult.signature.certificate.buildSignerDigest // empty' \
                  "${WORKDIR}/result.json")
                if [[ "${cert_digest}" != "${pin}" ]]; then
                  echo "::error::${name}: provenance signed at '${cert_digest}', pin is '${pin}'"
                  exit 1
                fi
                builder=$(jq -r \
                  '.[0].verificationResult.statement.predicate.runDetails.builder.id // empty' \
                  "${WORKDIR}/result.json")
                if [[ "${builder}" != "https://github.com/${signer_path}@"* ]]; then
                  echo "::error::${name}: builder.id does not name the org signer"
                  exit 1
                fi
                # The other two of verifying-artifacts' four comparisons
                # (#210): the CLI covers builder identity and source repo
                # by flag but has nothing for buildType or
                # externalParameters, so both are asserted here, over the
                # SAME statement the verify call just returned. Every
                # expectation is derived from this run's own identity —
                # the provenance was minted in this workflow run, so the
                # run is the expectation, and it cannot drift from
                # reality because it is read from reality.
                buildtype=$(jq -r \
                  '.[0].verificationResult.statement.predicate.buildDefinition.buildType // empty' \
                  "${WORKDIR}/result.json")
                if [[ "${buildtype}" != "https://actions.github.io/buildtypes/workflow/v1" ]]; then
                  echo "::error::${name}: buildType is not the GitHub Actions buildType"
                  exit 1
                fi
                # The buildType defines exactly two externalParameters
                # keys, workflow and inputs. The spec says REJECT
                # unrecognised fields, not ignore them: an unknown key is
                # where unofficial behaviour hides.
                unrecognized=$(jq -r \
                  '.[0].verificationResult.statement.predicate.buildDefinition.externalParameters
                   | keys[] | select(. != "workflow" and . != "inputs")' \
                  "${WORKDIR}/result.json")
                if [[ -n "${unrecognized}" ]]; then
                  # Not echoed: the field name is attacker-controlled.
                  echo "::error::${name}: externalParameters carries an unrecognised field"
                  exit 1
                fi
                # workflow identity: repository, ref and path must equal
                # this run's own. GITHUB_WORKFLOW_REF is
                # "<owner>/<repo>/<path>@<ref>" — the caller's entry
                # workflow, which is the same top-level run the signer
                # ran in.
                expected_path="${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}"/}"
                expected_path="${expected_path%@*}"
                jq -r '.[0].verificationResult.statement.predicate.buildDefinition.externalParameters.workflow
                  | [.repository // "", .ref // "", .path // ""] | @tsv' \
                  "${WORKDIR}/result.json" \
                  | {
                    IFS=$'\t' read -r wf_repo wf_ref wf_path
                    fail=""
                    [[ "${wf_repo}" == "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" ]] || fail="repository"
                    [[ "${wf_ref}" == "${GITHUB_REF}" ]] || fail="${fail} ref"
                    [[ "${wf_path}" == "${expected_path}" ]] || fail="${fail} path"
                    if [[ -n "${fail}" ]]; then
                      # Field names only; the values are attacker-controlled.
                      echo "::error::${name}: externalParameters.workflow does not match this run:${fail}"
                      exit 1
                    fi
                  }
                # No subject the manifest does not claim: the statement's
                # subject set must be a subset of what this run verified.
                jq -r '.[0].verificationResult.statement.subject[]
                  | "\(.digest.sha256)  \(.name)"' "${WORKDIR}/result.json" \
                  > "${WORKDIR}/stmt-subjects"
                while IFS= read -r sline; do
                  if ! grep -qxF "${sline}" "${manifest}"; then
                    echo "::error::provenance covers a subject this run did not verify"
                    exit 1
                  fi
                  echo "${sline}" >> "${covered}"
                done < "${WORKDIR}/stmt-subjects"
                echo "${bsha}" >> "${seen}"
                # Appended HERE, inside the verification of this bundle —
                # the list and the checks are the same iteration, which is
                # what makes inputAttestations complete by construction.
                jq -c --arg uri "https://api.github.com/${api}" --arg sha "${bsha}" \
                  '. + [{uri: $uri, digest: {sha256: $sha}}]' "${atts}" \
                  > "${atts}.tmp" && mv "${atts}.tmp" "${atts}"
                echo "verified provenance ${bsha} (via ${name})"
              fi
            done < "${WORKDIR}/raw-bundles.jsonl"
          done < "${WORKDIR}/manifest-iter"

          # ...and no verified subject the provenance does not cover: the
          # union of statement subjects must equal the manifest exactly.
          missing=$(grep -vxFf "${covered}" "${manifest}" || true)
          if [[ -n "${missing}" ]]; then
            echo "::error::a verified subject has no verified provenance covering it"
            exit 1
          fi
          opened=$(jq 'length' "${atts}")
          if ((opened == 0)); then
            echo "::error::no provenance opened — a verdict over nothing is not a verdict"
            exit 1
          fi

          # policy.digest pins WHICH canon tree rendered this verdict. The
          # ref may be a tag; the commit is the digest the spec wants.
          if [[ "${POLICY_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            policy_sha="${POLICY_REF}"
          else
            policy_sha=$(gh api "repos/monumental-archive/.github/commits/${POLICY_REF}" --jq '.sha')
          fi
          if [[ ! "${policy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve the policy ref to a commit"
            exit 1
          fi

          # jq --arg/--slurpfile does all quoting: nothing caller-
          # controlled is spliced into JSON by hand. Every field below is
          # an output of the checks above; this line is unreachable if
          # any of them failed.
          # Rendered through the shared assembler (#267): one file owns
          # the VSA field set for both of the org's VSA kinds, so a field
          # added for one cannot fail to appear in the other. The build
          # verdict's extra — inputAttestations — is merged on top.
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base=$(jq -cn \
            --arg verifier "https://github.com/monumental-archive/.github/.github/workflows/verify-release.yml" \
            --arg time "${now}" \
            --arg resource "pkg:github/${GITHUB_REPOSITORY}@v${UNTRUSTED_VERSION}" \
            --arg policyUri "https://github.com/monumental-archive/.github/tree/${POLICY_REF}" \
            --arg policySha "${policy_sha}" \
            --arg result "PASSED" \
            --argjson levels '["SLSA_BUILD_LEVEL_3"]' \
            -f "${CANON_PATH}/release/vsa-predicate.jq")
          jq -cn --argjson base "${base}" --slurpfile atts "${atts}" \
            '$base + {inputAttestations: $atts[0]}' > "${RUNNER_TEMP}/vsa-predicate.json"
          # The subjects the verdict covers are exactly the manifest this
          # run just re-proved — the same lines, no re-derivation.
          cp "${manifest}" "${RUNNER_TEMP}/vsa-subjects.sha256"
          echo "::notice::verdict assembled: ${opened} attestation(s) opened and verified"

      # The verdict signs ITSELF (#264): the predicate above is an output
      # of the checks this job just ran, and the certificate this step
      # mints names this file — so "who computed this verdict" is a
      # cryptographic fact, not a field a caller could have supplied. The
      # verdict lives in the attestation store alone (#209); consumers
      # verify with --signer-workflow .../verify-release.yml
      # (docs/runbook.md).
      - name: Sign the verdict under this workflow's own identity
        if: inputs.mode == 'verdict'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/vsa-subjects.sha256
          predicate-type: https://slsa.dev/verification_summary/v1
          predicate-path: ${{ runner.temp }}/vsa-predicate.json

      # Enrichment (#200): the implicit build facts become verifiable
      # claims — the toolbelt lock (from which every tool version and
      # checksum is derivable), the pgrx base-image digests, and the
      # released repository's own lockfiles at the attested source
      # revision. SLSA makes resolvedDependencies completeness a SHOULD
      # at every level and demands that at L3 provenance fields be
      # generated or verified by the control plane — which is why these
      # facts live in a COMPANION predicate computed entirely HERE, in
      # the verification control plane, rather than as tenant-generated
      # fields inside the platform's provenance: the stock provenance
      # stays unforgeable, and the enrichment is signed by the identity
      # that computed every byte of it. The source revision is read from
      # the provenance this job just verified; repo lockfiles are
      # fetched at exactly that commit; canon facts are read from the
      # same pinned tree that rendered the verdict.
      - name: Compute the enrichment facts (control plane only)
        id: enrich
        if: inputs.mode == 'verdict'
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_IMAGES: ${{ inputs.images }}
          POLICY_REF: ${{ steps.canon.outputs.ref }}
          CANON_PATH: ${{ steps.canon.outputs.path }}
        run: |
          set -euo pipefail
          # The attested source revision, from the last provenance this
          # run verified (all bundles in one release share it; the
          # subset/coverage checks above already proved coherence).
          src=$(jq -r '.[0].verificationResult.statement.predicate.buildDefinition
            .resolvedDependencies[0] | (.digest.gitCommit // empty)' "${WORKDIR}/result.json")
          if [[ ! "${src}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the verified provenance carries no source gitCommit — enrichment would claim nothing"
            exit 1
          fi

          deps='[]'
          adddep() { # name, uri, sha256 (empty = digestless oci entry)
            local entry
            if [[ -n "${3}" ]]; then
              entry=$(jq -cn --arg n "${1}" --arg u "${2}" --arg d "${3}" \
                '{name: $n, uri: $u, digest: {sha256: $d}}')
            else
              entry=$(jq -cn --arg n "${1}" --arg u "${2}" '{name: $n, uri: $u}')
            fi
            deps=$(jq -c --argjson e "${entry}" '. + [$e]' <<< "${deps}")
          }

          # Canon facts: the toolbelt lock and the base-image mapping,
          # hashed from the pinned tree this verdict was rendered from.
          lock_sha=$(sha256sum "${CANON_PATH}/mise/mise.lock" | cut -d" " -f1)
          adddep "toolbelt-lock" \
            "https://github.com/monumental-archive/.github/blob/${POLICY_REF}/mise/mise.lock" \
            "${lock_sha}"
          # Base-image facts are claimed only when THIS release built
          # images (#290 finding 5): the guard is the release's own image
          # subjects — the ones the prove step verified against the
          # registry — never the canon tree, where the mapping file always
          # exists. A file-only release claiming ten postgres containers
          # as resolvedDependencies is a signed over-claim. Granularity is
          # per-release, not per-image: an image release claims the full
          # pinned base set its policy tree ran under.
          built_images=0
          if [[ -n "${UNTRUSTED_IMAGES//[[:space:]]/}" ]]; then
            built_images=$(jq -r 'length' <<< "${UNTRUSTED_IMAGES}")
          fi
          if [[ "${built_images}" -gt 0 \
            && -f "${CANON_PATH}/docker/pgrx-base-images.toml" ]]; then
            map_sha=$(sha256sum "${CANON_PATH}/docker/pgrx-base-images.toml" | cut -d" " -f1)
            adddep "pgrx-base-images" \
              "https://github.com/monumental-archive/.github/blob/${POLICY_REF}/docker/pgrx-base-images.toml" \
              "${map_sha}"
            grep -Eo 'postgres:[A-Za-z0-9.-]+@sha256:[0-9a-f]{64}' \
              "${CANON_PATH}/docker/pgrx-base-images.toml" > "${RUNNER_TEMP}/base-images.raw"
            sort -u "${RUNNER_TEMP}/base-images.raw" > "${RUNNER_TEMP}/base-images.list"
            while IFS= read -r img; do
              [[ -n "${img}" ]] || continue
              adddep "pgrx-base" "oci://docker.io/library/${img}" ""
            done < "${RUNNER_TEMP}/base-images.list"
          fi

          # The released repository's own lockfiles, at the attested
          # revision — fetched from the commit the provenance names, so
          # the claim is bound to the source that built, not to a branch
          # that may have moved. Absence is normal (not every repo has
          # every ecosystem); an absent file is simply not claimed.
          for lf in Cargo.lock package-lock.json mise.toml; do
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${src}/${lf}"
            if curl -sSfL --retry 5 --retry-connrefused -o "${RUNNER_TEMP}/${lf}" "${url}" 2> /dev/null; then
              lf_sha=$(sha256sum "${RUNNER_TEMP}/${lf}" | cut -d" " -f1)
              adddep "${lf}" "${url}" "${lf_sha}"
              echo "enriched: ${lf} at ${src}"
            fi
          done

          jq -cn \
            --arg resource "pkg:github/${GITHUB_REPOSITORY}@v${UNTRUSTED_VERSION}" \
            --arg repo "https://github.com/${GITHUB_REPOSITORY}" \
            --arg src "${src}" \
            --arg canon "${POLICY_REF}" \
            --argjson deps "${deps}" \
            '{
              resourceUri: $resource,
              sourceRevision: {repository: $repo, digest: {gitCommit: $src}},
              canon: {ref: $canon},
              resolvedDependencies: $deps
            }' > "${RUNNER_TEMP}/enrichment-predicate.json"
          depcount=$(jq length <<< "${deps}")
          echo "::notice::enrichment assembled: ${depcount} resolved dependencies"

      - name: Sign the enrichment under this workflow's own identity
        if: inputs.mode == 'verdict'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/vsa-subjects.sha256
          predicate-type: https://monumental-archive.github.io/attestations/build-enrichment/v1
          predicate-path: ${{ runner.temp }}/enrichment-predicate.json
