# The release verifier: one identity for every check the org's verdict
# rests on. Three modes, same file:
#
#   mode: bytes    — pull the published bytes back from the registry and
#                    prove them against the built digests. Runs BEFORE the
#                    signer, and its output manifest is what the signer
#                    attests — so the attested subject is what shipped,
#                    not what we hoped shipped.
#   mode: verdict  — runs AFTER the signer. Re-proves the bytes, then
#                    opens the provenance being summarised: fetches the
#                    attestation bundles for every verified digest from
#                    the same API a stranger would use, verifies each
#                    against the org signer identity at the pinned commit
#                    (derived from the canon tree's own sign.yml uses:
#                    pin), checks the
#                    provenance subjects equal the verified manifest,
#                    asserts buildType and externalParameters against this
#                    run's own identity (all four of verifying-artifacts'
#                    comparisons, #210), and
#                    only then assembles the VSA predicate
#                    (slsa.dev/verification_summary/v1) and signs it
#                    ITSELF (#264). Where the assert policy owes a
#                    source verdict for the tag, it reads the one the
#                    release published and refuses unless it binds the
#                    commit the release's provenance names (#1350).
#   mode: source   — once per release, AFTER the signers and BEFORE
#                    attach: `stele emit source-vsa` proves the release
#                    tag, finds the chain link at the tag's target in a
#                    fetched history, and signs the tag's source verdict
#                    under this same identity (stele#468). It reads no
#                    release, so it can run while the release can still
#                    take an asset; attach ships the envelope under the
#                    name the assert policy declares
#                    (evidence.sourceVerdictBundle). It refuses a
#                    dry-run: a rehearsal has no release to carry it.
#
# Correct by construction (#208): every field of the predicate is an
# output of a check performed in this job. `verificationResult: PASSED`
# is only reachable after both the byte loop and the attestation loop
# exit clean; `verifiedLevels` is emitted only after the builder identity
# checks pass; `inputAttestations` is appended inside the same loop that
# verifies each bundle, so it cannot list what was not read or omit what
# was. The verdict is not asserted beside the verification — it is the
# verification's return value.
#
# capability-boundary: this workflow holds `id-token: write` and runs NO
# caller-supplied code — no checkout, typed inputs validated against
# whitelist shapes, a body of four stele calls (assert published, emit
# vsa, emit enrichment, emit source-vsa) and the printf/cat/cp/tee/sed
# that pass their files. The source and verdict modes also FETCH the
# caller's git history (`git fetch` of branches, tags and notes into a
# bare repository: objects read, never a work tree checked out, never
# a hook or script run), and read the release's own published asset
# back with `gh release download`. It is
# sign.yml's category, not a build job's. It signs the verdict ITSELF
# (#264) because a verdict routed through the org signer makes
# `verifier.id` a string in a caller-supplied predicate: any workflow
# able to call the signer could mint a syntactically perfect PASSED
# naming this file without this file having run. Self-signing makes the
# (signer, verifier) pair a tautology — `verifier.id` IS the certificate
# subject. The org therefore carries TWO roots of trust: provenance and
# producer evidence under monumental-archive/signer/sign.yml, verdicts
# under this file (docs/runbook.md, two recipes; verdicts published
# before canon v1.14.0 verify under the signer identity instead — the
# version boundary is documented there).
#
# The one byte-handling residual, stated: this job pulls published
# artifacts, so a steered fetch could at most influence a subject
# digest — and a tenant-generated subject is the spec's explicit
# carve-out, with forging one a declared non-threat (threats E2). The
# signing material never shares a job with caller-defined build steps,
# which is the actual L3 line. The only caller-controlled bytes touched
# are the declared inputs, validated to the same whitelist shape
# sign.yml enforces.
#
# Class coverage (#209): every class gets a verdict, because every class
# has a public store to prove against — three shapes, one manifest:
#
#   registry files   — crates.io and npm serve published bytes by stable
#                      URL; pulled back and hash-compared.
#   release assets   — fetchable by public URL once the release is
#                      published, and immutable from that moment, so the
#                      proved bytes cannot drift under the verdict. Only
#                      reachable AFTER attach publishes: verdicts for
#                      these classes run post-publish, and their VSAs
#                      live in the attestation store alone (the release
#                      is sealed before the verdict exists).
#   images           — content addressing already proves the bytes;
#                      fetching a blob to re-hash it would prove nothing.
#                      What is NOT self-proving is the tag: the binding
#                      the release advertises is a mutable pointer, so
#                      the proof asserted here is that the tag resolves
#                      in the registry to the attested index digest. The
#                      policy claims exactly that, nothing more.
---
name: verify-release

"on":
  # forwarding-default: discretionary — multi-mode verifier; each mode consumes its own input subset
  workflow_call:
    inputs:
      subjects:
        description: >
          sha256sum manifest of file subjects. In bytes mode: produced by
          the build, proven here. In verdict mode: the manifest the signer
          attested — verify-release's own bytes-mode output for registry
          classes, the build's own manifest for release-asset classes
          (whose first pull-back is necessarily here, post-publish). A VSA
          over unproven digests would be a verdict about nothing, which is
          why this step re-proves everything regardless. Optional when
          `images` carries the subjects instead; at least one of the two
          must be non-empty.
        required: false
        type: string
        default: ""
      inventories:
        description: >
          The release's PLANNED inventory documents, as the JSON array
          the publish workflow's sbom job emitted from the judged plan
          set. Each one owes its own release decision and the verdict
          aggregates over them (stele#158): the invariant is one
          decision per planned inventory, with the plan as the
          denominator, so ambiguity is unrepresentable rather than
          refused. `[""]` or empty declares a release with no plan,
          judged under the whole-release invariant every release before
          per-artifact inventories shipped under. Never a filename
          guess and never re-derived here — it is the same list the
          decisions were minted over.
        required: false
        type: string
        default: ""
      images:
        description: >
          Image subjects as a JSON array of {image, tag, digest} — the
          untagged lowercase registry reference, the tag this release
          advertises, and the attested index digest (sha256:<hex>). Extra
          keys are ignored, so a build's signing-matrix output passes
          through unchanged. Proven by tag→digest binding, not pull-back:
          see the header.
        required: false
        type: string
        default: ""
      base-majors:
        description: >
          Comma-separated PG majors whose digest-pinned base images this
          class's build actually instantiated; the enrichment claims
          exactly those rows of docker/pgrx-base-images.toml (build and
          smoke both — every leg runs in each) as resolvedDependencies.
          Empty (the default) claims nothing: a FROM scratch class has no
          base, and a signed false dependency is worse than an omitted
          one (#316 finding 3, which found the previous boolean
          declaring the ENTIRE pinned set for classes with no base at
          all). Declared by the caller, which knows the artifact class —
          never inferred from subject shape: that proxy missed
          pgrx-extension tarballs, file subjects built INSIDE the pinned
          base (#310 finding 4). Consumed in verdict mode; ignored in
          bytes mode.
        required: false
        type: string
        default: ""
      release-tag:
        description: >
          Declares that file subjects matched by no registry are assets of
          this published release, fetched from its public download URL.
          The declaration is proven, never inferred: with the tag set, a
          missing asset is a failure; without it, an unclaimed subject is
          a failure. There is no path on which a subject is skipped.
        required: false
        type: string
        default: ""
      mode:
        description: bytes (default), verdict or source — see the header.
        required: false
        type: string
        default: bytes
      version:
        description: >
          The version released, without the leading v. Required in verdict
          mode (it names the resourceUri); ignored in bytes mode.
        required: false
        type: string
        default: ""
      npm-package:
        description: >
          For .tgz subjects: the npm package as name@version. Required
          because a scoped package's tarball filename mangles the scope
          (`@org/pkg` packs as `org-pkg-<v>.tgz`), so the registry path
          cannot be reconstructed from the file. Empty is fine when no
          subject is a tarball; a .tgz subject with no package name fails.
        required: false
        type: string
        default: ""
      dry-run:
        description: >
          Rehearsal. Nothing was published, so there are no registry bytes
          to pull back. In bytes mode the manifest passes through unchanged
          and the run says so loudly — a rehearsal must never be mistaken
          for proof. Verdict mode REFUSES a dry-run outright: a rehearsal
          must never assemble a PASSED.
        required: false
        type: boolean
        default: false
    outputs:
      subjects:
        description: The manifest, re-derived from the published bytes.
        value: ${{ jobs.verify.outputs.subjects }}

permissions: {}

jobs:
  verify:
    name: Verify the release (${{ inputs.mode }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      # contents: read scopes the token the verdict step uses to read the
      # attestations API. The three write grants are the verdict's own
      # signing identity (#264) — see the capability-boundary marker in
      # the header for why a job that handles artifact bytes may hold
      # them: it runs zero caller code, and the spec declares a forged
      # tenant subject a non-threat (E2). Declared at the job
      # unconditionally because a called workflow's permissions are
      # checked statically; every caller inside publish.yml already
      # grants this set for its signer legs.
      contents: read
      id-token: write # the verdict's Sigstore identity — verifier.id IS the certificate
      attestations: write # persist the VSA where the runbook's consumer recipe reads
      artifact-metadata: write # the attestation storage record
    outputs:
      subjects: ${{ steps.prove.outputs.subjects }}
    env:
      # The list is the whole install: no `mise run` installs the rest
      # (task auto-install is on by default; #1412).
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      # The ref the caller pinned, read from the same $/ resolution that
      # fetched this workflow — it names the exact canon tree (workflows,
      # policies, toolbelt, signer identity) both modes judge by, which is
      # what a VSA's policy URI is for. Never re-derived: the two prior
      # carriers disagreed with the resolution or could not be written at
      # all (#158, #165). Both modes need it: the byte proof reads the
      # assert policy's published section, the verdict the verify policy.
      - name: Resolve the canon tree (the ref the caller pinned)
        id: canon
        uses: $/.github/actions/canon

      # stele is a belt tool (pinned, locked, provenance verified at lock
      # time). A named list keeps the job cold: only the tools the job
      # runs (#1333), held to its calls by release/test_job_installs.py —
      # stele in every mode, and for the source and verdict modes the jq
      # that reads the source verdict's asset name and the cosign `stele
      # emit source-vsa` signs through. One step per job, so bytes mode
      # carries the two small binaries too.
      - name: Install the belt's stele, jq and cosign
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ steps.canon.outputs.path }}/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ steps.canon.outputs.path }}
          MISE_LOCKED: "1"
        with:
          version: 2026.11.8
          cache: false
          install_args: github:monumental-archive/stele jq aqua:sigstore/cosign

      # Every declared subject is pulled back from the store that serves
      # it and compared to its built digest, and every image tag resolved
      # to its attested index: `stele assert published` (stele#392), the
      # assert policy's published section saying which registry serves
      # which file. A 404 is waited on for ten minutes (a registry serves
      # 404 for a while after accepting a publish, #1204), any other
      # failure is tried three times, and a store that will not answer is
      # CANNOT_JUDGE (exit 4), never a pass. A rehearsal passes the
      # manifest through unproved, saying so per subject, and stele
      # refuses one in verdict mode: a rehearsal never assembles a PASSED.
      # The proven manifest is what the signer attests in bytes mode and
      # what the verdict covers in verdict mode.
      - name: Prove each declared subject against the registry
        id: prove
        if: inputs.mode != 'source'
        env:
          UNTRUSTED_SUBJECTS: ${{ inputs.subjects }}
          UNTRUSTED_IMAGES: ${{ inputs.images }}
          UNTRUSTED_NPM_PACKAGE: ${{ inputs.npm-package }}
          UNTRUSTED_RELEASE_TAG: ${{ inputs.release-tag }}
          UNTRUSTED_MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry-run }}
          CANON_PATH: ${{ steps.canon.outputs.path }}
          MISE_GLOBAL_CONFIG_FILE: ${{ steps.canon.outputs.path }}/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ steps.canon.outputs.path }}
          MISE_LOCKED: "1"
        run: |
          set -euo pipefail
          printf '%s\n' "${UNTRUSTED_SUBJECTS}" > "${RUNNER_TEMP}/subjects.sha256"
          printf '%s\n' "${UNTRUSTED_IMAGES}" > "${RUNNER_TEMP}/images.json"
          args=()
          [[ -z ${UNTRUSTED_NPM_PACKAGE} ]] || args+=(--package ".tgz=${UNTRUSTED_NPM_PACKAGE}")
          [[ -z ${UNTRUSTED_RELEASE_TAG} ]] || args+=(--release-tag "${UNTRUSTED_RELEASE_TAG}")
          [[ ${DRY_RUN} != "true" ]] || args+=(--rehearsal)
          stele assert published --policy "${CANON_PATH}/slsa/assert-policy.json" \
            --repo "${GITHUB_REPOSITORY}" --mode "${UNTRUSTED_MODE}" \
            --subjects "${RUNNER_TEMP}/subjects.sha256" --images "${RUNNER_TEMP}/images.json" \
            "${args[@]}" --out "${RUNNER_TEMP}/verified.sha256"
          { echo "subjects<<SUBJECTS_EOF" && cat "${RUNNER_TEMP}/verified.sha256" && echo "SUBJECTS_EOF"; } >> "${GITHUB_OUTPUT}"

      # A rehearsal has no release to carry a source verdict, so the
      # source mode refuses one, as verdict mode does.
      - name: Refuse a rehearsal
        if: inputs.mode == 'source' && inputs.dry-run
        run: |
          echo "::error::a rehearsal has no release to carry a source verdict — refusing a dry-run"
          exit 1

      # The history a source verdict is proven and read against: every
      # branch and tag commits-only, and the notes refs whole — a bare
      # repository, objects only, nothing checked out and nothing run.
      # The ledger's ref and the protected branches are the verify
      # policy's, read by stele; fetching every head and every notes ref
      # means this step restates neither. The credential rides in the
      # environment, never on a command line a process listing shows.
      - name: Fetch the history the source verdict reads
        id: history
        if: inputs.mode != 'bytes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git="${RUNNER_TEMP}/source-history"
          git init -q --bare "${git}"
          git -C "${git}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git -C "${git}" fetch -q --filter=tree:0 origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          git -C "${git}" fetch -q --no-filter origin '+refs/notes/*:refs/notes/*'
          echo "git-dir=${git}" >> "${GITHUB_OUTPUT}"

      # The two facts the source verdict is judged by, from the pinned
      # canon tree: the machinery version, read the way the plans
      # judgment reads it, and the asset name the assert policy declares.
      - name: Read the canon's version and the source verdict's asset name
        id: facts
        if: inputs.mode != 'bytes'
        env:
          CANON_PATH: ${{ steps.canon.outputs.path }}
          MISE_GLOBAL_CONFIG_FILE: ${{ steps.canon.outputs.path }}/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ steps.canon.outputs.path }}
          MISE_LOCKED: "1"
        run: |
          set -euo pipefail
          machinery=$(awk '/^version:/{print $2; exit}' "${CANON_PATH}/CITATION.cff")
          [[ -n ${machinery} ]] || {
            echo "::error::the pinned canon tree's CITATION.cff names no version — the owed epochs cannot be judged"
            exit 1
          }
          asset=$(jq -r '.evidence.sourceVerdictBundle // empty' "${CANON_PATH}/slsa/assert-policy.json")
          { echo "machinery=${machinery}" && echo "asset=${asset}"; } >> "${GITHUB_OUTPUT}"

      # The tag's source verdict (stele#468): proven, signed under this
      # workflow's identity and self-proved by `stele emit source-vsa`,
      # before attach so the release can still take it as an asset.
      # stele validates the tag and refuses a release that owes no
      # verdict. stele resolves the pinned policy ref to the commit the
      # verdict names as its policy digest (stele#472), as it does for
      # the release verdict; GH_TOKEN is that read.
      - name: Sign the tag's source verdict (stele emit source-vsa)
        if: inputs.mode == 'source'
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          POLICY_REF: ${{ steps.canon.outputs.ref }}
          CANON_PATH: ${{ steps.canon.outputs.path }}
          GIT_DIR_SOURCE: ${{ steps.history.outputs.git-dir }}
          MACHINERY: ${{ steps.facts.outputs.machinery }}
          ASSET: ${{ steps.facts.outputs.asset }}
          GH_TOKEN: ${{ github.token }}
          MISE_GLOBAL_CONFIG_FILE: ${{ steps.canon.outputs.path }}/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ steps.canon.outputs.path }}
          MISE_LOCKED: "1"
        run: |
          set -euo pipefail
          [[ -n ${ASSET} ]] || { echo "::error::the assert policy names no sourceVerdictBundle" && exit 1; }
          mkdir -p "${RUNNER_TEMP}/source-verdict"
          stele emit source-vsa --policy "${CANON_PATH}/slsa/verify-policy.json" \
            --assert-policy "${CANON_PATH}/slsa/assert-policy.json" --repo "${GITHUB_REPOSITORY}" \
            --tag "v${UNTRUSTED_VERSION}" --git-dir "${GIT_DIR_SOURCE}" --machinery-version "${MACHINERY}" \
            --policy-ref "${POLICY_REF}" --policy-repo monumental-archive/.github --policy-tree "${CANON_PATH}" \
            --out "${RUNNER_TEMP}/source-verdict/${ASSET}"
      # Carried to attach as a `release-*` artifact: attach ships every
      # one as a release asset, this one under the name the policy
      # declares.
      - name: Hand the source verdict to attach
        if: inputs.mode == 'source'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source-verdict
          path: ${{ runner.temp }}/source-verdict/
          if-no-files-found: error

      # The source verdict the release published, read back for `emit
      # vsa` to hold against the release's own commit. Absent when no
      # source mode ran for this release; stele says by name whether one
      # was owed.
      - name: Read back the published source verdict
        id: published-source
        if: inputs.mode == 'verdict'
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          ASSET: ${{ steps.facts.outputs.asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z ${ASSET} ]]; then
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/published-source"
          if gh release download "v${UNTRUSTED_VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET}" --dir "${RUNNER_TEMP}/published-source"; then
            echo "path=${RUNNER_TEMP}/published-source/${ASSET}" >> "${GITHUB_OUTPUT}"
          fi

      # Everything verb-shaped is `stele emit vsa` (stele#21, stele#392):
      # the store fetch, the four verifying-artifacts comparisons, subject
      # coverage equality, the source-revision fold, the release decision
      # and the predicate render, so a PASSED predicate cannot exist
      # unearned (#208). It also resolves its own inputs: the policy ref to
      # the commit the verdict names (refusing a verdict with no policy,
      # #158), the signer pin from this canon tree's own sign.yml uses:
      # lines (#314's pattern; lint:signer-pin keeps them equal, and a
      # tree that disagrees with itself is refused), the release's SBOM
      # assets as the decision candidates, and the planned inventories
      # filtered from them by name (#354, stele#158). Naming no
      # --trusted-root resolves one through TUF from the anchor pinned in
      # the binary (stele#85). The source revision and the policy commit
      # it states are handed to the enrichment, never re-derived there
      # (#349 finding 7).
      - name: Verify the release and render the verdict (stele emit vsa)
        id: verdict
        if: inputs.mode == 'verdict'
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_INVENTORIES: ${{ inputs.inventories }}
          GIT_DIR_SOURCE: ${{ steps.history.outputs.git-dir }}
          MACHINERY: ${{ steps.facts.outputs.machinery }}
          SOURCE_VERDICT: ${{ steps.published-source.outputs.path }}
          POLICY_REF: ${{ steps.canon.outputs.ref }}
          CANON_PATH: ${{ steps.canon.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          # The shim resolves a version from the config, not from the
          # install: without these the step dies "No version is set for
          # shim: stele" even though the tool is installed (v1.34.0).
          MISE_GLOBAL_CONFIG_FILE: ${{ steps.canon.outputs.path }}/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ steps.canon.outputs.path }}
          MISE_LOCKED: "1"
        run: |
          set -euo pipefail
          # The published source verdict, when one was read back; stele
          # decides whether one is owed and refuses either mismatch by
          # name.
          source_args=()
          [[ -z ${SOURCE_VERDICT} ]] || source_args=(--source-verdict "${SOURCE_VERDICT}")
          stele emit vsa --policy "${CANON_PATH}/slsa/verify-policy.json" \
            --assert-policy "${CANON_PATH}/slsa/assert-policy.json" --git-dir "${GIT_DIR_SOURCE}" \
            --machinery-version "${MACHINERY}" "${source_args[@]}" \
            --repo "${GITHUB_REPOSITORY}" --tag "v${UNTRUSTED_VERSION}" \
            --subjects "${RUNNER_TEMP}/verified.sha256" --sbom-assets .spdx.json \
            --inventory-plan "${UNTRUSTED_INVENTORIES}" --signer-workflows "${CANON_PATH}/.github/workflows" \
            --policy-ref "${POLICY_REF}" --policy-repo monumental-archive/.github --policy-tree "${CANON_PATH}" \
            --out "${RUNNER_TEMP}/vsa-predicate.json" | tee "${RUNNER_TEMP}/emit-vsa.log"
          sed -n -e 's/^emit: source revision /src=/p' -e 's/^emit: policy ref .* is commit /policy-sha=/p' \
            "${RUNNER_TEMP}/emit-vsa.log" >> "${GITHUB_OUTPUT}"
          # The subjects the verdict covers are exactly the manifest this
          # run just re-proved — the same lines, no re-derivation.
          cp "${RUNNER_TEMP}/verified.sha256" "${RUNNER_TEMP}/vsa-subjects.sha256"
      # The verdict signs ITSELF (#264): the predicate above is an output
      # of the checks this job just ran, and the certificate this step
      # mints names this file — so "who computed this verdict" is a
      # cryptographic fact, not a field a caller could have supplied. The
      # verdict lives in the attestation store alone (#209); consumers
      # verify with --signer-workflow .../verify-release.yml
      # (docs/runbook.md).
      - name: Sign the verdict under this workflow's own identity
        if: inputs.mode == 'verdict'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/vsa-subjects.sha256
          predicate-type: https://slsa.dev/verification_summary/v1
          predicate-path: ${{ runner.temp }}/vsa-predicate.json

      # Enrichment (#200): the implicit build facts become verifiable
      # claims — the toolbelt lock (from which every tool version and
      # checksum is derivable), the pgrx base-image digests, and the
      # released repository's own lockfiles at the attested source
      # revision. SLSA makes resolvedDependencies completeness a SHOULD
      # at every level and demands that at L3 provenance fields be
      # generated or verified by the control plane — which is why these
      # facts live in a COMPANION predicate computed entirely HERE, in
      # the verification control plane, rather than as tenant-generated
      # fields inside the platform's provenance: the stock provenance
      # stays unforgeable, and the enrichment is signed by the identity
      # that computed every byte of it. The source revision is read from
      # the provenance this job just verified; repo lockfiles are
      # fetched at exactly that commit; canon facts are read from the
      # same pinned tree that rendered the verdict.
      #
      # `stele emit enrichment` (stele#392) computes it. Which names the
      # claim must and may carry is the verify policy's build.enrichment;
      # where each name's bytes come from is declared here, the canon's
      # own mapping: the toolbelt lock and the base-image table from this
      # pinned tree, that table's rows for exactly the majors the CALLER
      # declares its build instantiated (build and smoke both; empty
      # claims none, and not the table either — #290, #310, #316 finding
      # 3), and the released repository's lockfiles at the attested
      # revision, an absent one simply not claimed.
      - name: Compute the enrichment facts (control plane only)
        id: enrich
        if: inputs.mode == 'verdict'
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
          UNTRUSTED_BASE_MAJORS: ${{ inputs.base-majors }}
          POLICY_SHA: ${{ steps.verdict.outputs.policy-sha }}
          SRC: ${{ steps.verdict.outputs.src }}
          CANON_PATH: ${{ steps.canon.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          MISE_GLOBAL_CONFIG_FILE: ${{ steps.canon.outputs.path }}/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ steps.canon.outputs.path }}
          MISE_LOCKED: "1"
        run: |
          set -euo pipefail
          stele emit enrichment --policy "${CANON_PATH}/slsa/verify-policy.json" \
            --policy-tree "${CANON_PATH}" --policy-repo monumental-archive/.github \
            --machinery-digest "${POLICY_SHA}" --source-revision "${SRC}" \
            --repo "${GITHUB_REPOSITORY}" --tag "v${UNTRUSTED_VERSION}" \
            --file toolbelt-lock=policy:mise/mise.lock \
            --rows pgrx-base=policy:docker/pgrx-base-images.toml --rows-tables pgrx-base=build,smoke \
            --rows-prefix pgrx-base=oci://docker.io/library/ --rows-file pgrx-base=pgrx-base-images \
            --rows-keys "pgrx-base=${UNTRUSTED_BASE_MAJORS}" \
            --file Cargo.lock=source:Cargo.lock --file package-lock.json=source:package-lock.json \
            --file mise.toml=source:mise.toml --out "${RUNNER_TEMP}/enrichment-predicate.json"
      - name: Sign the enrichment under this workflow's own identity
        if: inputs.mode == 'verdict'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/vsa-subjects.sha256
          predicate-type: https://monumental-archive.github.io/attestations/build-enrichment/v2
          predicate-path: ${{ runner.temp }}/enrichment-predicate.json
