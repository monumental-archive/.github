# Artifact class: rust-binary. Statically linked Linux binaries and native
# macOS binaries, built on the hardware they will run on (docs/release.md).
#
#   Native hardware per target. No cross-compilation between architectures
#   and no emulation: a binary tested under emulation has not been shown to
#   work where it runs. The only "cross" is libc — musl instead of glibc on
#   the Linux legs, which the same machine links and executes natively.
#
#   musl-tools comes from apt, deliberately. Rust's *-musl targets bundle
#   their own musl libc and self-link pure-Rust code, but one C dependency
#   (ring, mimalloc — both in iiif-server's lock) needs a musl-targeting C
#   compiler, and a transitive C dep can arrive in any PR. Installing it
#   unconditionally keeps every build identical. Distro-signed via Ubuntu's
#   own mirrors; Scorecard's Pinned-Dependencies does not examine apt (read
#   from checks/raw/shell_download_validate.go, not from the docs).
#
#   Builds are reproducible by construction (Best Practices Silver
#   build_repeatable): SOURCE_DATE_EPOCH from the released commit,
#   incremental compilation off, paths remapped, symbols kept (stripping
#   would destroy the cargo-auditable section), archives normalised.
#
# No cache of any kind: everything downstream of this job gets signed.
name: build-rust-binary

on:
  workflow_call:
    inputs:
      version:
        description: Version being released, without the leading v.
        required: true
        type: string
      targets:
        description: >
          Comma-separated subset of the canon targets. The plan job refuses
          anything outside the canon list — a typo must fail the release,
          not quietly build three targets instead of four.
        required: false
        type: string
        default: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin
      smoke-test:
        description: >
          Script proving a built binary does the one thing it exists to do.
          Receives the directory holding the leg's binaries as $1 and the
          target triple as $2, and runs on every leg — on the machine class
          the binaries will ship for. Empty means no smoke test, which is
          permitted and unwise.
        required: false
        type: string
        default: ""
    outputs:
      subjects:
        description: sha256sum manifest of the release archives.
        value: ${{ jobs.collect.outputs.subjects }}
      artifact-name:
        description: Actions artifact holding the release archives.
        value: ${{ jobs.collect.outputs.artifact-name }}

permissions: {}

jobs:
  # The matrix is constructed, not configured: this job validates the
  # requested targets against canon and emits the include list the build
  # job consumes. A target GitHub's `if:` would have silently skipped is
  # instead a target that either builds or fails the whole release here.
  plan:
    name: Validate the target list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - name: Derive the matrix from the requested targets
        id: plan
        env:
          UNTRUSTED_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          IFS=',' read -ra requested <<< "${UNTRUSTED_TARGETS// /}"
          if ((${#requested[@]} == 0)); then
            echo "::error::no targets requested — a release that builds nothing is not a release"
            exit 1
          fi
          include="[]"
          for t in "${requested[@]}"; do
            case "${t}" in
              x86_64-unknown-linux-musl) runner=ubuntu-latest ;;
              aarch64-unknown-linux-musl) runner=ubuntu-24.04-arm ;;
              x86_64-apple-darwin) runner=macos-15-intel ;;
              aarch64-apple-darwin) runner=macos-latest ;;
              *)
                echo "::error::unknown target ${t}; canon targets only"
                exit 1
                ;;
            esac
            include=$(jq -c --arg t "${t}" --arg r "${runner}" \
              '. + [{target: $t, runner: $r}]' <<< "${include}")
          done
          dupes=$(jq -r '[.[].target] | length - (unique | length)' <<< "${include}")
          if [[ "${dupes}" != "0" ]]; then
            echo "::error::duplicate target requested"
            exit 1
          fi
          matrix=$(jq -c '{include: .}' <<< "${include}")
          expected=$(jq -c '[.[].target]' <<< "${include}")
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "expected=${expected}" >> "${GITHUB_OUTPUT}"
          jq -r '.[] | "::notice::will build \(.target) on \(.runner)"' <<< "${include}"

  build:
    name: Build and smoke ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-toolbelt/mise/config.toml
      # Reproducibility, by construction rather than by audit:
      #   CARGO_INCREMENTAL=0        incremental artifacts embed local state
      #   remap-path-prefix          no runner paths in the binary
      #   CARGO_PROFILE_RELEASE_STRIP=false
      #                              stripping destroys the section
      #                              cargo-auditable will live in
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out org toolbelt (same SHA the caller pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: monumental-archive/.github
          ref: ${{ github.job_workflow_sha }}
          path: .org-toolbelt
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # No tool cache anywhere downstream of a signature.
          cache: false

      - name: Install the target and the musl C toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "${TARGET}"
          if [[ "${TARGET}" == *-linux-musl ]]; then
            # Unconditional on the Linux legs: pure Rust self-links without
            # it, but a C dependency can arrive transitively in any PR, and
            # identical environments beat conditional ones.
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools
          fi

      - name: Refuse a tag whose version disagrees with the manifest
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1)
          manifest=$(jq -r '[.packages[].version] | unique | .[]' <<< "${meta}")
          versions=$(wc -l <<< "${manifest}")
          if [[ "${versions}" -ne 1 ]]; then
            echo "::error::workspace members disagree on version; canon is [workspace.package] inheritance"
            exit 1
          fi
          if [[ "${manifest}" != "${UNTRUSTED_VERSION}" ]]; then
            echo "::error::tag says ${UNTRUSTED_VERSION}, manifest says ${manifest}"
            exit 1
          fi

      - name: Test on the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Against the release target, not the host default: the musl legs
          # prove the statically linked test binaries actually run, which is
          # the property the shipped binary claims.
          cargo test --workspace --locked --target "${TARGET}"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH is the released commit's own time, so the same
          # tag rebuilds to the same bytes on any machine on any day.
          epoch=$(git log -1 --pretty=%ct)
          export SOURCE_DATE_EPOCH="${epoch}"
          cargo build --workspace --locked --release --target "${TARGET}"

      - name: Stage the binaries
        id: stage
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The bin list comes from cargo's own metadata, never from a
          # directory listing: target/release also holds build scripts and
          # deps, and a glob over it would ship someone else's bytes.
          mkdir -p staged
          meta=$(cargo metadata --no-deps --format-version 1)
          bin_list=$(jq -r \
            '[.packages[].targets[] | select(.kind[] == "bin") | .name] | unique | .[]' \
            <<< "${meta}")
          bins=()
          while IFS= read -r b; do
            if [[ -n "${b}" ]]; then bins+=("${b}"); fi
          done <<< "${bin_list}"
          if ((${#bins[@]} == 0)); then
            echo "::error::no bin targets in this workspace — rust-binary is the wrong class"
            exit 1
          fi
          for b in "${bins[@]}"; do
            src="target/${TARGET}/release/${b}"
            if [[ ! -x "${src}" ]]; then
              echo "::error::expected binary ${src} was not produced"
              exit 1
            fi
            cp "${src}" "staged/${b}"
          done
          echo "count=${#bins[@]}" >> "${GITHUB_OUTPUT}"

      - name: Smoke the binaries
        if: inputs.smoke-test != ''
        env:
          TARGET: ${{ matrix.target }}
          UNTRUSTED_SMOKE: ${{ inputs.smoke-test }}
        run: |
          set -euo pipefail
          if [[ ! -x "${UNTRUSTED_SMOKE}" ]]; then
            echo "::error::smoke-test ${UNTRUSTED_SMOKE} is not executable"
            exit 1
          fi
          "${UNTRUSTED_SMOKE}" "${PWD}/staged" "${TARGET}"

      - name: Archive, normalised
        env:
          TARGET: ${{ matrix.target }}
          UNTRUSTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Same source, same bytes: fixed member order, zeroed ownership,
          # mtimes clamped to the released commit, gzip stripped of its
          # timestamp. macOS runners get gnu-tar as gtar; tar there is bsdtar,
          # which has none of these flags.
          tar=tar
          if command -v gtar > /dev/null; then tar=gtar; fi
          epoch=$(git log -1 --pretty=%ct)
          name="${GITHUB_REPOSITORY##*/}-${UNTRUSTED_VERSION}-${TARGET}"
          mkdir -p dist
          "${tar}" --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${epoch}" -C staged -cf - . | gzip -n > "dist/${name}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Outputs of a MATRIX job overwrite one another, so the legs hand their
  # archives over as artifacts and this job — the only place with all of
  # them — refuses a missing leg and emits the one subject manifest.
  collect:
    name: Collect and refuse a partial set
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    outputs:
      subjects: ${{ steps.manifest.outputs.subjects }}
      artifact-name: release-binaries
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Compute the subject manifest
        id: manifest
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          # Every planned target must have produced exactly its archive; a
          # release quietly missing a platform looks like a success to
          # everyone who runs the other three.
          target_list=$(jq -r '.[]' <<< "${EXPECTED}")
          targets=()
          while IFS= read -r t; do
            if [[ -n "${t}" ]]; then targets+=("${t}"); fi
          done <<< "${target_list}"
          for t in "${targets[@]}"; do
            matches=(./*-"${t}".tar.gz)
            if ((${#matches[@]} != 1)); then
              echo "::error::expected exactly one archive for ${t}, found ${#matches[@]}"
              exit 1
            fi
          done
          archives=(./*.tar.gz)
          if ((${#archives[@]} != ${#targets[@]})); then
            echo "::error::${#archives[@]} archives for ${#targets[@]} planned targets"
            exit 1
          fi
          manifest=$(sha256sum ./*.tar.gz | sed 's| \./| |')
          {
            echo "subjects<<SUBJECTS_EOF"
            printf '%s\n' "${manifest}"
            echo "SUBJECTS_EOF"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${manifest}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: dist/*.tar.gz
          if-no-files-found: error
