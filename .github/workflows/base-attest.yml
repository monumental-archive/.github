# Base-image approval, org canon (#117): the pinned-digest approval set.
#
# The pgrx builds instantiate postgres containers as their build
# environment, which makes this org the build platform at that layer —
# and the draft BuildEnv track's L1 wants the build image's provenance
# verified before the environment exists. This workflow mints, under the
# org's own identity, an approval asserting the expected hash of every
# digest pinned in docker/pgrx-base-images.toml. The builds then verify
# that approval before any container runs and fail closed
# (build-pgrx-extension.yml).
#
# What this is NOT, stated so the claim never drifts (docs/direction.md,
# docs/slsa-reference.md):
#
#   - It is not the spec's fallback clause. That clause covers a build
#     image producer who CANNOT PUBLISH the image; it does not cover a
#     consumer whose upstream publishes an image without provenance.
#   - It does not make the org BuildEnv L1. L1 puts the provenance
#     obligation on the build image PRODUCER, and these bases are stock
#     Docker Official Images — the org is the platform, not the producer.
#   - The bases are not provenance-less, as an earlier note here claimed.
#     They carry BuildKit in-toto provenance (slsa.dev/provenance/v0.2,
#     naming the docker-library source commit) as unknown/unknown
#     attestation manifests; `cosign verify` cannot see those, which is
#     what the original measurement got wrong. It is unsigned, so it is
#     Build L1 provenance — one level below what BuildEnv L1 requires.
#
# The stronger claim available without owning postgres builds is BUILT
# (#212): each run fetches that upstream provenance, asserts — for every
# platform in the index — that it names the docker-library/postgres
# source and the <major>/<suite> directory the pinned tag implies, and
# signs THAT verification under the org identity. The predicate carries
# the upstream facts alongside the pin, so "the org approved these
# bytes" became "the org verified these bytes carry upstream provenance
# naming this source". The same artefact discharges BuildEnv L1's third
# obligation — a signed attestation of the provenance-verification
# result — which was previously a ::notice:: log line in the build leg
# and nothing more. The build legs' fail-closed verification of THIS
# attestation is unchanged (build-pgrx-extension.yml).
#
# Runs on push when the pin set changes (a Renovate digest roll re-attests
# immediately), on a weekly schedule (freshness floor), and on dispatch.
#
# capability-boundary: this workflow declares `id-token: write` but is
# not a `workflow_call` workflow and runs no caller-supplied code — it
# reads one committed TOML file from this repository's tree and mints
# attestations over the digests found there. Same standing as
# scorecard.yml and rekor-monitor.yml: a standalone scheduled workflow
# whose identity the attestation is supposed to bear.
---
name: base-attest

"on":
  push:
    branches:
      - main
    paths:
      - docker/pgrx-base-images.toml
      # Changing the approval machinery re-runs it — and lands the first
      # approval set the moment this workflow merges.
      - .github/workflows/base-attest.yml
  schedule:
    # Mondays 05:20 UTC, before slsa.yml (07:00) reads the results.
    - cron: 20 5 * * 1
  workflow_dispatch: {}
permissions: {}

# One approval run at a time: a Renovate roll landing mid-schedule must
# queue behind the running set, never interleave with it.
concurrency:
  group: base-attest
  cancel-in-progress: false

jobs:
  plan:
    name: Read the pinned base set
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the canon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON, for the helpers this job runs
      # (#1543): never the runner's python3.
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      - name: Enumerate every pinned digest
        id: plan
        # One derivation and its tests: release/matrix.py (#1385).
        run: |
          "${ORG_PYTHON}" release/matrix.py base-images docker/pgrx-base-images.toml \
            >> "${GITHUB_OUTPUT}"

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1
  attest:
    name: Attest the base image (${{ matrix.role }} pg${{ matrix.pg }})
    needs: plan
    strategy:
      # One image's failure must not hide the approval state of the rest.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # mints the Sigstore identity for the approval
      attestations: write # persists it in this repo's attestation store
    env:
      # The list is the whole install (#1412), from this tree's belt.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out the canon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.9
          cache: false
          # Only what this job's steps call (#1333).
          install_args: jq github:monumental-archive/stele

      - name: Confirm the digest resolves upstream
        # The approval asserts bytes that exist. A digest is content-
        # addressed so it cannot lie, but a pin that no longer resolves
        # (registry GC, repo rename) must fail HERE, loudly, not at the
        # next release's build leg.
        env:
          REF: ${{ matrix.ref }}
        # BY DIGEST ALONE. Given `name:tag@digest`, docker resolves the TAG
        # and verifies what it finds against the digest, so the moment
        # upstream republishes the tag the pinned bytes are reported as
        # "manifest verification failed" while still resolving perfectly.
        # Measured 2026-11-14 against postgres:18-bookworm: tag+pinned
        # digest fails, `postgres@<pinned>` succeeds, and the registry
        # serves the pinned index and all ten of its children with
        # matching hashes. That made this job red from 2026-10-26, for as
        # long as a newer upstream build sat in Renovate's stability
        # window — the opposite of the question it asks (#1144).
        run: |
          set -euo pipefail
          docker manifest inspect "${REF%%:*}@${REF##*@}" > /dev/null
          # No canon tree in this job: the command is a literal, and the
          # outside text follows on a plain line, never at its start (#1660).
          echo "::notice::the base image resolves"
          printf '  ref: %q\n' "${REF}"
      - name: Verify the upstream provenance names this source (#212)
        # Docker Official Images carry BuildKit in-toto provenance
        # (slsa.dev/provenance/v0.2) as attestation manifests — unsigned,
        # which is why it is Build L1 and why the org's SIGNED statement
        # about having verified it is the strongest claim available
        # without owning the build. The judgment is `stele verify base`
        # (stele#402) under the policy's `upstream` entry for postgres:
        # every platform of the pinned index must carry provenance whose
        # config source names docker-library/postgres at the
        # <major>/<suite> the pinned tag implies, fail-closed. `--bind`
        # holds the tag's major to the pin file's row; `--facts-out`
        # writes, on PASS only, the facts the predicate below signs.
        id: upstream
        env:
          REF: ${{ matrix.ref }}
          PG: ${{ matrix.pg }}
        run: >-
          stele verify base --assert-policy slsa/assert-policy.json
          --ref "${REF}" --bind "major=${PG}" --facts-out upstream.json
      - name: Write the verification predicate
        env:
          ROLE: ${{ matrix.role }}
          PG: ${{ matrix.pg }}
          REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          jq -n \
            --arg role "${ROLE}" --arg pg "${PG}" --arg ref "${REF}" \
            --arg source "docker/pgrx-base-images.toml" \
            --arg revision "${GITHUB_SHA}" \
            --slurpfile upstream upstream.json \
            '{role: $role, pgMajor: $pg, pinnedRef: $ref,
              pinSource: $source, pinRevision: $revision,
              upstreamProvenance: ($upstream[0] + {verified: true})}' \
            > predicate.json
      - name: Attest the expected hash under the org identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}
          predicate-type: https://monumental-archive.github.io/attestations/base-image-approval/v1
          predicate-path: predicate.json

      # This job's findings records, for the report job (#1933).
      - name: Hand the findings to the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
          retention-days: 1

  # Every scheduled workflow ends here (#1887), with one issue per red
  # job (#1966): for each red job of a run on the default branch, one
  # issue titled "red: <job> (<workflow>)" and labelled red-check holds
  # its findings and each red leg's log tail; the next run with every
  # leg green or skipped closes it. mise/standing_issue.py has the
  # outcomes. Only `needs:` names the jobs above, so it grows with them.
  report:
    name: Report red jobs
    needs:
      - plan
      - attest
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout
      issues: write # each red job's red-check issue
      actions: read # the run's job list and each red job's log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The belt's Python as ORG_PYTHON and the canon tree at
      # .org-canon, the ref this run resolved (#165, #1543).
      - name: Resolve the canon tree and the belt's Python
        uses: $/.github/actions/canon

      # Every job's findings records, in one directory (#1933): each job
      # that ran a belt task handed its own on.
      - name: Collect the findings every job recorded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          merge-multiple: true
          path: ${{ runner.temp }}/findings

      # A cancelled run changes nothing: the job still runs (always()),
      # this step does not.
      - name: Keep the red-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "${ORG_PYTHON}" .org-canon/mise/standing_issue.py --workflow "${WORKFLOW}" \
            --run-id "${RUN_ID}" --ref "${REF}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --findings "${RUNNER_TEMP}/findings"
...
