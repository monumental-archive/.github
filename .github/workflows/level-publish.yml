# Publish the measured SLSA levels (#540, the canon half of stele#5).
#
# `stele level` computes the honest current level per repository and
# track from live evidence, taking no declaration; this cron publishes
# the report and its shields.io endpoint document to the `levels`
# branch, so every SLSA badge in the org is a RENDER of the computed
# level with no copy in between — drift is unrepresentable, not
# detected. The canon only hosts bytes: the shield is derived from the
# same seal as the report inside stele, and nothing here restates a
# level.
#
# A cell that cannot be judged never publishes over a good report
# (stele#135): the sealed judgment stands. What that means depends
# entirely on whether the cell was ever judgeable, and the two must
# not be confused:
#
#   - never judged, still not judgeable — a repository that publishes
#     nothing has no build level. That is a fact about it, not a
#     fault: grey `unmeasured` is published and NOTHING pages. An
#     alarm here would fire every week forever over repositories
#     behaving exactly as intended, and a board that is permanently
#     amber is a board nobody reads.
#   - judged before, not judgeable now — evidence went missing, a
#     credential narrowed, a forge read degraded. The previous
#     judgment stands and the job goes red, because something that
#     could be proven no longer can.
---
name: level-publish

"on":
  schedule:
    # Mondays 05:30 UTC — before the 06:00 audit reads the shields.
    - cron: 30 5 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: measure and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the published judgments to the levels branch
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.5
          cache: false

      - name: Fetch the previously published judgments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p levels
          if git fetch --depth 1 origin levels 2> /dev/null; then
            git --work-tree levels checkout FETCH_HEAD -- . 2> /dev/null || true
          fi
      - name: Measure every repository and track
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repos=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/repos" --paginate --jq '.[].name')
          [[ -n ${repos} ]] || {
            echo "::error::the org listing is empty — a walk over nothing publishes nothing"
            exit 1
          }
          investigate=0
          while read -r repo; do
            [[ -n ${repo} ]] || continue
            mkdir -p "levels/${repo}"
            for track in build source dependency; do
              report="levels/${repo}/${track}.report.json"
              shield="levels/${repo}/${track}.shield.json"
              if stele level "${track}" \
                --repo "${GITHUB_REPOSITORY_OWNER}/${repo}" \
                --json --shield "${RUNNER_TEMP}/shield.json" \
                > "${RUNNER_TEMP}/report.json"; then
                mv "${RUNNER_TEMP}/report.json" "${report}"
                mv "${RUNNER_TEMP}/shield.json" "${shield}"
              elif [[ -f ${shield} ]] \
                && ! grep -q '"message"[[:space:]]*:[[:space:]]*"unmeasured"' "${shield}"; then
                # REGRESSION, and the only state worth waking anyone for:
                # this cell carried a real level and can no longer be
                # judged. Evidence went missing, a credential narrowed,
                # a forge read degraded. The good judgment stands.
                investigate=1
                echo "::error::${repo} ${track}: was judged before and cannot be judged now; the previous judgment stands"
              else
                # No evidence to measure, and none last time either — a
                # repository that publishes nothing has no build level,
                # which is a fact about it and not a fault. Grey
                # `unmeasured` is the honest badge (stele#135); it is
                # NOT a finding and must never page, or the board goes
                # permanently amber over repositories behaving exactly
                # as intended.
                mv "${RUNNER_TEMP}/report.json" "${report}" 2> /dev/null || true
                mv "${RUNNER_TEMP}/shield.json" "${shield}" 2> /dev/null || true
                echo "::notice::${repo} ${track}: no evidence to measure; published unmeasured"
              fi
            done
          done <<< "${repos}"
          echo "investigate=${investigate}" >> "${GITHUB_ENV}"
      - name: Publish to the levels branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd levels
          git init -q -b levels
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish measured levels" \
            -m "Rendered by stele level; the canon hosts bytes and derives nothing."
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            levels:levels
          if [[ ${investigate} -ne 0 ]]; then
            echo "::error::a cell that was judged before cannot be judged now — investigate; good reports were not overwritten"
            exit 1
          fi
...
