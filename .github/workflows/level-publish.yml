# Publish the measured SLSA levels (#540, the canon half of stele#5).
#
# `stele level` computes the honest current level per repository and
# track from live evidence, taking no declaration; this cron publishes
# the report and its shields.io endpoint document to the `levels`
# branch, so every SLSA badge in the org is a RENDER of the computed
# level with no copy in between — drift is unrepresentable, not
# detected. The canon only hosts bytes: the shield is derived from the
# same seal as the report inside stele, and nothing here restates a
# level.
#
# WHICH cells exist is the policy's declared population to say, and
# nothing here narrows it (stele#153). A repository that bears no
# evidence on a track is declared out and produces no file at all —
# not a grey cell, not a finding, not a row. Before that declaration
# existed, signer's build and dependency cells published grey every
# week over a repository behaving exactly as intended, which is how a
# board becomes permanently amber and stops being read.
#
# A cell that cannot be judged never publishes over a good report
# (stele#135): the sealed judgment stands. Inside the population the
# two remaining cases must not be confused:
#
#   - never judged, still not judgeable — a declared cell whose
#     evidence has not arrived yet. Grey `unmeasured` is published and
#     NOTHING pages: it is honest, and it resolves itself the first
#     time the evidence exists.
#   - judged before, not judgeable now — evidence went missing, a
#     credential narrowed, a forge read degraded. The previous
#     judgment stands and the job goes red, because something that
#     could be proven no longer can. A published shield this run
#     cannot even READ counts as holding a level, because overwriting
#     an unknown with "could not see" is the direction that loses
#     information.
---
name: level-publish

"on":
  schedule:
    # Mondays 05:30 UTC — before the 06:00 audit reads the shields.
    - cron: 30 5 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: measure and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the published judgments to the levels branch
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.5
          cache: false

      - name: Fetch the previously published judgments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p levels
          if git fetch --depth 1 origin levels 2> /dev/null; then
            git --work-tree levels checkout FETCH_HEAD -- . 2> /dev/null || true
          fi
      - name: Measure every repository and track
        # One line, because every decision in it belongs to the judge.
        # This step used to enumerate the org, loop repository × track,
        # and implement stele#135's publish rule in workflow `if`s — a
        # bash branch sitting between a judgment and the state it
        # publishes, which is a place the two can disagree. The engine
        # owns all of it now (stele#152): the population comes from the
        # policy's declaration, so a cell nobody bears evidence on is
        # not measured, not reported and not a file. A cell the
        # population no longer holds is REMOVED and named, because a
        # board is this engine's output whole and a cell left behind is
        # a published level for something nobody measured. Expect
        # deletions in the first publish commit under a declaration.
        #
        # Exit 4 is the regression case and nothing else, so the step's
        # own status is the signal. Anything else non-zero is a broken
        # run whose out-dir is not worth pushing, and only 4 reaches the
        # publish step — the good judgments are published before the run
        # goes red, which is the order the bash also took.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          stele level \
            --org "${GITHUB_REPOSITORY_OWNER}" \
            --out-dir levels \
            --policy slsa/assert-policy.json || rc=$?
          if [[ ${rc} -ne 0 && ${rc} -ne 4 ]]; then
            echo "::error::stele level failed (exit ${rc}) — nothing published"
            exit "${rc}"
          fi
          echo "investigate=${rc}" >> "${GITHUB_ENV}"
      - name: Publish to the levels branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd levels
          git init -q -b levels
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish measured levels" \
            -m "Rendered by stele level; the canon hosts bytes and derives nothing."
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            levels:levels
          if [[ ${investigate} -ne 0 ]]; then
            echo "::error::a cell that was judged before cannot be judged now — investigate; good reports were not overwritten"
            exit 1
          fi
...
