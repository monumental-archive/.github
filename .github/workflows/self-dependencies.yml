# The canon's own dependencies run — this repository running the stub every
# other repository runs (#1858).
#
# The same file `workflow-templates/dependencies.yml` ships, with the one
# difference every canon self-application has: the `uses:` is local,
# because the canon calls its own workflow at the running commit rather
# than pinning a release of itself (the gate.yml and self-mutants.yml
# convention). Named `self-dependencies.yml` because `repo-dependencies.yml` is
# the callee.
---
name: dependencies

"on":
  schedule:
    # Mondays 07:00 UTC, the canon's own Monday slot.
    - cron: 0 7 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dependencies:
    permissions:
      contents: read # this repository's contents, read-only
    uses: ./.github/workflows/repo-dependencies.yml # zizmor: ignore[self-repository]
...
