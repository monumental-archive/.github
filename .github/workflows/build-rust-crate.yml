# Artifact class: rust-crate. Two jobs, split on the only line that
# matters — whether the job runs caller-supplied code. The capability split
# is per job, not per file (docs/release.md).
#
#   build   runs cargo, so it runs caller code (build.rs, proc macros).
#           It gets `contents: read` and nothing else.
#   The registry publish lives in publish-rust-crate.yml (#118): the
#   repro gate sits between build and upload, so the irreversible step
#   cannot share a workflow with the build it gates.
name: build-rust-crate

on:
  workflow_call:
    inputs:
      version:
        # forwarding: universal
        description: Version being released, without the leading v.
        required: true
        type: string
      exclude:
        # forwarding: universal
        description: >
          Comma-separated workspace members this class must not touch —
          the pgrx-extension crate above all, which builds only inside
          its Postgres container. Declared by the caller once, applied to
          every cargo invocation here.
        required: false
        type: string
        default: ""
      repro:
        # forwarding: discretionary — the repro leg sets it; omission means a first build
        description: >
          Rebuild leg of the repro gate (#118): build and hash the same
          bytes, upload NO release-* artifact (the gate needs only the
          subjects), skip the smoke tests (the gate proves bytes; the
          first build already proved behaviour), and publish nothing.
          Intermediate artifacts carry a repro- prefix so the two builds
          of one run cannot collide or cross-contaminate a glob.
        required: false
        type: boolean
        default: false
    outputs:
      subjects:
        description: sha256sum manifest of the packaged crates.
        value: ${{ jobs.build.outputs.subjects }}
      artifact-name:
        description: Actions artifact holding the packaged crates.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions: {}

jobs:
  build:
    name: Package and prove the crates build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
      artifact-name: release-crates
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # mise itself is a build input and floats without this pin — the
          # v0.18.2 darwin leg pulled same-day mise 2026.8.4 while every
          # pinned site ran 2026.8.3 (#117: nothing unpinned on an attested
          # path, the installer included).
          version: 2026.8.3
          # No tool cache anywhere downstream of a signature: a poisoned
          # cache would be signed along with everything else.
          cache: false

      - name: Resolve the exclusion flags
        env:
          UNTRUSTED_EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -euo pipefail
          flags=""
          IFS=',' read -ra members <<< "${UNTRUSTED_EXCLUDE// /}"
          for m in "${members[@]}"; do
            if [[ -n "${m}" ]]; then flags="${flags} --exclude ${m}"; fi
          done
          echo "EXCLUDE_FLAGS=${flags}" >> "${GITHUB_ENV}"

      - name: Refuse a tag whose version disagrees with the manifest
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1)
          manifest=$(jq -r '[.packages[].version] | unique | .[]' <<< "${meta}")
          versions=$(wc -l <<< "${manifest}")
          if [[ "${versions}" -ne 1 ]]; then
            echo "::error::workspace members disagree on version; canon is [workspace.package] inheritance"
            exit 1
          fi
          if [[ "${manifest}" != "${UNTRUSTED_VERSION}" ]]; then
            echo "::error::tag says ${UNTRUSTED_VERSION}, manifest says ${manifest}"
            exit 1
          fi

      - name: Test
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # the flags are flag-shaped on purpose
          cargo test --workspace --locked ${EXCLUDE_FLAGS}

      - name: Package
        # Verification is ON here, deliberately: this is the job that is
        # allowed to build. `cargo package` extracts the tarball and
        # compiles it, which catches the crate that builds in-workspace and
        # fails from its packaged form.
        # No --allow-dirty: it is a flag, not a boolean option, and
        # omitting it is what refuses a dirty tree. `--allow-dirty=false`
        # is rejected outright by cargo.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # the flags are flag-shaped on purpose
          cargo package --workspace --locked ${EXCLUDE_FLAGS}

      - name: Compute the subject manifest
        id: hash
        run: |
          set -euo pipefail
          cd target/package
          manifest=$(sha256sum ./*.crate | sed 's| \./| |')
          {
            echo "subjects<<SUBJECTS_EOF"
            printf '%s\n' "${manifest}"
            echo "SUBJECTS_EOF"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${manifest}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.repro }}
        with:
          name: release-crates
          path: target/package/*.crate
          if-no-files-found: error

