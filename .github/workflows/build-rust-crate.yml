# Artifact class: rust-crate. Two jobs, split on the only line that
# matters — whether the job runs caller-supplied code. The capability split
# is per job, not per file (docs/release.md).
#
#   build   runs cargo, so it runs caller code (build.rs, proc macros).
#           It gets `contents: read` and nothing else.
#   The registry publish lives in publish-rust-crate.yml (#118): the
#   repro gate sits between build and upload, so the irreversible step
#   cannot share a workflow with the build it gates.
---
name: build-rust-crate

"on":
  workflow_call:
    inputs:
      version:
        # forwarding: universal
        description: Version being released, without the leading v.
        required: true
        type: string
      exclude:
        # forwarding: universal
        description: >
          Comma-separated workspace members this job cannot compile —
          the pgrx-extension crate above all, which builds only inside
          its Postgres container. They are left out of `cargo test` and
          of the verified `cargo package`, then packaged without
          compiling, so their .crate is still built, hashed, planned and
          published. It does not affect publishing: a member that must
          not publish says `publish = false` in its manifest (#1273).
        required: false
        type: string
        default: ""
      repro:
        # forwarding: discretionary — the repro leg sets it; omission means a first build
        description: >
          Rebuild leg of the repro gate (#118): build and hash the same
          bytes, upload NO release-* artifact (the gate needs only the
          subjects), skip the smoke tests (the gate proves bytes; the
          first build already proved behaviour), and publish nothing.
          Intermediate artifacts carry a repro- prefix so the two builds
          of one run cannot collide or cross-contaminate a glob.
        required: false
        type: boolean
        default: false
    outputs:
      subjects:
        description: sha256sum manifest of the packaged crates.
        value: ${{ jobs.build.outputs.subjects }}
      leg-subjects:
        # The same digests, carrying the target whose leg produced them
        # (schema 4, stele#223). This class has one leg and packages
        # source crates for no platform, so its target is `crate` — a
        # name the publisher declares for the one thing this class ever
        # produces, so no artifact ships untyped.
        description: >
          sha256sum manifest of the packaged crates, each line prefixed
          with the target whose leg produced it.
        value: ${{ jobs.build.outputs.leg-subjects }}
      artifact-name:
        description: Actions artifact holding the packaged crates.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions: {}

jobs:
  build:
    name: Package and prove the crates build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The list is the whole install: no `mise run` installs the rest
      # (task auto-install is on by default; #1412).
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_LOCKED: "1"
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.org-canon/mise/config.toml
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
      leg-subjects: ${{ steps.hash.outputs.leg-subjects }}
      artifact-name: release-crates
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the canon tree (the ref the caller pinned)
        uses: $/.github/actions/canon

      - name: Read the caller's pinned build inputs
        # The caller's config decides the versions; the canon decides
        # which tools (#1333). One reader, release/caller_pins.py.
        id: pins
        run: |
          "${ORG_PYTHON}" .org-canon/release/caller_pins.py install \
            --input-of "the rust-crate class" \
            rust >> "${GITHUB_OUTPUT}"
      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # mise itself is a build input and floats without this pin — the
          # v0.18.2 darwin leg pulled same-day mise 2026.8.4 while every
          # pinned site ran 2026.8.3 (#117: nothing unpinned on an attested
          # path, the installer included).
          version: 2026.11.10
          # No tool cache anywhere downstream of a signature: a poisoned
          # cache would be signed along with everything else.
          cache: false
          # Only what this job's steps call (#1333): the release path is
          # uncached, so every tool in scope is paid for on every run.
          # release/test_job_installs.py holds the list to the calls.
          install_args: jq github:monumental-archive/stele ${{ steps.pins.outputs.install }}

      - name: Resolve the exclusion flags
        env:
          UNTRUSTED_EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -euo pipefail
          flags=""
          IFS=',' read -ra members <<< "${UNTRUSTED_EXCLUDE// /}"
          for m in "${members[@]}"; do
            if [[ -n ${m} ]]; then flags="${flags} --exclude ${m}"; fi
          done
          echo "EXCLUDE_FLAGS=${flags}" >> "${GITHUB_ENV}"
      - name: Refuse a tag whose version disagrees with the manifest
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The canon's finding writer (#1934), and its workflow commands (#1660).
          . .org-canon/mise/findings.sh
          meta=$(cargo metadata --no-deps --format-version 1)
          manifest=$(jq -r '[.packages[].version] | unique | .[]' <<< "${meta}")
          versions=$(wc -l <<< "${manifest}")
          if [[ ${versions} -ne 1 ]]; then
            org_finding_annotated "" "workspace members disagree on version; canon is [workspace.package] inheritance"
            exit 1
          fi
          if [[ ${manifest} != "${UNTRUSTED_VERSION}" ]]; then
            org_finding_annotated "" "tag says ${UNTRUSTED_VERSION}, manifest says ${manifest}"
            exit 1
          fi
      - name: Test
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # the flags are flag-shaped on purpose
          cargo test --workspace --locked ${EXCLUDE_FLAGS}
      - name: Package
        # Verification is ON here, deliberately: this is the job that is
        # allowed to build. `cargo package` extracts the tarball and
        # compiles it, which catches the crate that builds in-workspace and
        # fails from its packaged form. An excluded member is packaged by
        # a second, unverified run that must rewrite every verified crate
        # byte for byte (#1273), and the set is then cut to what crates.io
        # receives (#1310). release/package_crates.py, which says why.
        run: '"${ORG_PYTHON}" .org-canon/release/package_crates.py'
      - name: Compute the subject manifest
        id: hash
        run: |
          set -euo pipefail
          cd target/package
          manifest=$(sha256sum ./*.crate | sed 's| \./| |')
          # One leg, one target: `crate`. The prefix is the publisher's
          # name for what this class builds, not a platform parsed out
          # of anything.
          legs="crate ${manifest//$'\n'/$'\n'crate }"
          {
            echo "subjects<<SUBJECTS_EOF"
            printf '%s\n' "${manifest}"
            echo "SUBJECTS_EOF"
            echo "leg-subjects<<LEGS_EOF"
            printf '%s\n' "${legs}"
            echo "LEGS_EOF"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${manifest}"
      - name: Emit the inventory plan (which packages these crates ship)
        # The artifact-to-package mapping exists with certainty exactly
        # once — here, over the very tarballs `cargo package` just wrote
        # and the publisher will upload (#537): what the Package step
        # leaves is exactly the members crates.io will receive — the
        # caller's excludes included (#1273), `publish = false` members
        # removed (#1310). Not on the repro leg: the comparator proves
        # bytes, not inventories.
        #
        # One call (stele#396, #1371). The class's `inventory`
        # declaration in slsa/assert-policy.json (kind `crates`, suffix
        # `-crate`) names each document `<prefix><crate>-crate`, under
        # the class's ONE planned prefix — so the producer and `stele
        # assert plans` read one name, and a source crate's document
        # stays apart from a binary built out of it (#833). A crate not
        # named for the version, and an empty set, refuse.
        #
        # plan-producer: rust-crate sbom-cargo-
        if: ${{ !inputs.repro }}
        env:
          UNTRUSTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p plan
          stele derive inventory-plan --class rust-crate --policy .org-canon/slsa/assert-policy.json \
            --dir target/package --version "${UNTRUSTED_VERSION}" --out plan/plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.repro }}
        with:
          name: release-crates
          path: target/package/*.crate
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.repro }}
        with:
          name: sbom-plan-crate
          path: plan/plan.json
          if-no-files-found: error
          retention-days: 1
...
