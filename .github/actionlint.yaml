# actionlint's github-context model does not yet include
# job_workflow_sha — a real, documented property that exists precisely
# for reusable workflows (the SHA the caller pinned the reusable at,
# which is what the canon/toolbelt checkouts ride). Ignore exactly that
# false positive and nothing else; drop this when actionlint learns the
# property.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'property "job_workflow_sha" is not defined in object type'
