---
name: mechanism change
description: a defect or design decision, written to be picked up cold by any session
body:
  - type: textarea
    id: defect
    attributes:
      label: Defect
      description: >-
        What is wrong, with measured evidence. Quote real output. State
        where it is live and where it is not. If a guard fired correctly
        on a wrong assumption, say so — the guard and the assumption are
        judged separately.
    validations:
      required: true
  - type: textarea
    id: decided-build
    attributes:
      label: Decided build
      description: >-
        The correct-by-construction shape, recorded as a dated decision
        once one has been made. State contracts and invariants, not flag
        spellings — surface details belong to the build, and a spec
        written before the code should not be trusted for them. Until a
        decision is made, list the options and what each costs. State
        the standing mechanics the build must obey (jsonx-only
        decoding, findings through the sealed Report, table tests per
        guard branch, the failing-writer pattern) rather than betting
        on them being known.
    validations:
      required: true
  - type: textarea
    id: canon-consequence
    attributes:
      label: Canon consequence
      description: >-
        Outcomes in the canon once a release carries this: what dies,
        what is declared, what converts. Removal conditions, never
        command lines. Remember the pin rule — the stele pin bump lands
        before any policy edit that needs it. Write "none" when true.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Observable states, on both sides, that mean closed.
    validations:
      required: true
  - type: textarea
    id: sequencing
    attributes:
      label: Sequencing
      description: >-
        Dependencies and lanes, stated so a cold session cannot
        start too early: what this is BLOCKED BY (hard — do not start
        before it merges), what it should be BUILT WITH in one session,
        what it blocks or exposes, and which files it shares with other
        open work. Say "independent" explicitly when true — absence
        reads as unknown, not as none.
    validations:
      required: false
...
