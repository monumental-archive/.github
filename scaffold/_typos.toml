# Repo-specific vocabulary for `typos` (belt task `lint:typos`).
#
# COPY THIS whenever you copy scaffold/ruff.toml: that file's ignore
# list contains `CPY001`, which typos reads as a misspelling of COPY,
# so a repo taking the org's Python config without this one fails
# lint:typos on the config it was told to copy (found conforming
# release-lab, canon #445).
#
# The belt runs locale `en`, which accepts en-US and en-GB. This file is
# only for jargon the dictionary cannot know about — not for spelling
# preferences.

[default.extend-words]
# in-toto's attestation bundles are named `<artifact>.intoto.jsonl`. That
# filename is fixed by the in-toto spec and is what OpenSSF Scorecard's
# Signed-Releases check looks for, so it appears verbatim in prose and in
# the evidence bundle. `typos` reads it as a misspelling of "into".
intoto = "intoto"
# `CPY001` is ruff's missing-copyright-notice rule code (the CPY prefix is
# flake8-copyright). It appears in ruff.toml's ignore list and in the
# verdict that explains why it is ignored. `typos` reads the prefix as a
# misspelling of "COPY" — which is, in fairness, exactly what it abbreviates.
CPY = "CPY"

[default.extend-identifiers]
# "SHOULDs" — RFC-2119 keyword pluralised, in prose and in commit
# subjects the changelog reproduces. The tokenizer splits the trailing
# lowercase s as its own word ("SHOUL" + "Ds") and flags the stem,
# which reddened the v1.14.0 release PR's generated CHANGELOG.
SHOULDs = "SHOULDs"
