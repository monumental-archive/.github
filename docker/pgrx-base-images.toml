# Base images for the pgrx-extension class, digest-pinned. One mapping,
# org-wide: every extension builds against the oldest supported glibc
# (bookworm, 2.36 — the floor consumers inherit) and smokes on both
# bookworm and trixie, so forward compatibility is demonstrated rather
# than assumed.
#
# Renovate's custom manager in renovate.json keeps tag AND digest current
# together — the pairing that makes pinning safe. A pinned-but-stale base
# would be worse than a floating one.

[build]
# renovate: pgrx-base-image
"14" = "postgres:14-bookworm@sha256:5a05f61a534e50e679d27fb45953afec7821f2ffc2aa6c738b94515ca0891ac2"
# renovate: pgrx-base-image
"15" = "postgres:15-bookworm@sha256:539ceaaae49b3a7c8a04467cf00cc6788d8e3f1675df41860d86eebc4c40524f"
# renovate: pgrx-base-image
"16" = "postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4"
# renovate: pgrx-base-image
"17" = "postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826"
# renovate: pgrx-base-image
"18" = "postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650"

[smoke]
# renovate: pgrx-base-image
"14" = "postgres:14-trixie@sha256:c2427de38f998489d36de7ca3553db2134872c400f2b08be4b824e5c50e4d619"
# renovate: pgrx-base-image
"15" = "postgres:15-trixie@sha256:724292da1f2e50bdccfc3302ce75bbba7f4a6076701b588cc795fcac65683550"
# renovate: pgrx-base-image
"16" = "postgres:16-trixie@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54"
# renovate: pgrx-base-image
"17" = "postgres:17-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f"
# renovate: pgrx-base-image
"18" = "postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722"

# The glibc floor the [build] images guarantee, asserted per-build with
# readelf: an extension whose symbols exceed this fails the release
# instead of failing at dlopen on someone's Debian 12.
[floor]
glibc = "2.36"
