# Base images for the pgrx-extension class, digest-pinned. One mapping,
# org-wide: every extension builds against the oldest supported glibc
# (bookworm, 2.36 — the floor consumers inherit) and smokes on both
# bookworm and trixie, so forward compatibility is demonstrated rather
# than assumed.
#
# Renovate's custom manager in renovate.json keeps tag AND digest current
# together — the pairing that makes pinning safe. A pinned-but-stale base
# would be worse than a floating one.

[build]
# renovate: pgrx-base-image
"14" = "postgres:14-bookworm@sha256:185c7c7a36448bcb7e0d3d6aef97ac973ddfae0cc4fa29581ce4e789988a74b1"
# renovate: pgrx-base-image
"15" = "postgres:15-bookworm@sha256:5d1d70e254e3c5d7d76847a9deebb18478cd518df37abf6b278d4bdb1fe5d96c"
# renovate: pgrx-base-image
"16" = "postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537"
# renovate: pgrx-base-image
"17" = "postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad"
# renovate: pgrx-base-image
"18" = "postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af"

[smoke]
# renovate: pgrx-base-image
"14" = "postgres:14-trixie@sha256:2fdfb9b432d4a73bd3eea3d989752c1e669b68d502347e0bfd2cc6d709f3d6b4"
# renovate: pgrx-base-image
"15" = "postgres:15-trixie@sha256:5f72c7b5bd616308ccfd2e74d6be16fb06364e5eecbb815fe9dc6ab9761d2111"
# renovate: pgrx-base-image
"16" = "postgres:16-trixie@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5"
# renovate: pgrx-base-image
"17" = "postgres:17-trixie@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449"
# renovate: pgrx-base-image
"18" = "postgres:18-trixie@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941"

# The glibc floor the [build] images guarantee, asserted per-build with
# readelf: an extension whose symbols exceed this fails the release
# instead of failing at dlopen on someone's Debian 12.
[floor]
glibc = "2.36"
