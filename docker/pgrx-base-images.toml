# Base images for the pgrx-extension class, digest-pinned. One mapping,
# org-wide: every extension builds against the oldest supported glibc
# (bookworm, 2.36 — the floor consumers inherit) and smokes on both
# bookworm and trixie, so forward compatibility is demonstrated rather
# than assumed.
#
# Renovate's custom manager in renovate.json keeps tag AND digest current
# together — the pairing that makes pinning safe. A pinned-but-stale base
# would be worse than a floating one.

[build]
# renovate: pgrx-base-image
"14" = "postgres:14-bookworm@sha256:a54c8b1e143b22f16b0fd3e249e9297a6f08828a143ee7108b1b5ca51f352765"
# renovate: pgrx-base-image
"15" = "postgres:15-bookworm@sha256:72ccb1ad4dc9d5813ea40a8c1c87af746f16658fb029c17fe570ea9b881f68b3"
# renovate: pgrx-base-image
"16" = "postgres:16-bookworm@sha256:a49f7438ba03589f9b1ca062f2da82e899b48ea1dc50d2449fa09a70be83ebca"
# renovate: pgrx-base-image
"17" = "postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536"
# renovate: pgrx-base-image
"18" = "postgres:18-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f"

[smoke]
# renovate: pgrx-base-image
"14" = "postgres:14-trixie@sha256:980b7cb415aa0f812f65bdec8f6f599be408d8ed9c83ffcaa12650eac397b264"
# renovate: pgrx-base-image
"15" = "postgres:15-trixie@sha256:5a407822929c3789ff5154d3d35bd7e2090318149344c8a3d4ca942b035822ed"
# renovate: pgrx-base-image
"16" = "postgres:16-trixie@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9"
# renovate: pgrx-base-image
"17" = "postgres:17-trixie@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07"
# renovate: pgrx-base-image
"18" = "postgres:18-trixie@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553"

# The glibc floor the [build] images guarantee, asserted per-build with
# readelf: an extension whose symbols exceed this fails the release
# instead of failing at dlopen on someone's Debian 12.
[floor]
glibc = "2.36"
