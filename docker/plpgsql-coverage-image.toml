# The database the PL/pgSQL coverage leg's own tests run on (#2163),
# digest-pinned: the org's database image, which carries plpgsql_check's
# files and loads it only where a test start preloads it (#2106). The
# rows in tests/test_plpgsql_coverage.py that need a real Postgres start
# this image with the profiler on; every other row answers from a stub
# psql. The gate pulls it, an approved cost (#2163, 2026-11-28).
#
# Renovate's custom manager in renovate.json keeps tag AND digest
# current together, as it does for docker/pgrx-base-images.toml. The
# tag is the image's stream tag: the image has no version tags, and its
# README says consumers pin the digest and the tag exists so Renovate
# has something to resolve digest updates against. A new digest skips
# the org's release-age floor through the preset's first-party image
# rule (`ghcr.io/monumental-archive/**`, #2172), from the canon release
# that carries it: this repository's renovate.json extends a tagged
# preset.

# renovate: plpgsql-coverage-image
image = "ghcr.io/monumental-archive/monumental-archive-db:latest@sha256:fb14ff4579f57872d61a0a0a2992a6f77ed23ab8cd63427ef1d67529fe58d2cd"
