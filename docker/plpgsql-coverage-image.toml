# README says consumers pin the digest and the tag exists so Renovate
# has something to resolve digest updates against. A new digest waits
# out the org's release-age floor like any other update until #2172
# lets first-party images (`ghcr.io/monumental-archive/**`) skip it.

# renovate: plpgsql-coverage-image
