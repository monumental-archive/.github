# The org's mypy config (#1604): delivered, never copied. The belt
# passes it with --config-file, which REPLACES discovery (measured on
# 2.4.1): a repository's own mypy.ini, .mypy.ini, setup.cfg or
# pyproject.toml [tool.mypy] is not read at all.
#
# The strictest setting mypy has, measured from the tool: `strict`
# (a group that grows with mypy, so it is named, never spelled out),
# every flag `strict` leaves off, and every error code that is off by
# default (`mypy.errorcodes`, 13 at 2.4.1). docs/tooling-verdicts.md
# holds the measurement and why `Any` is the point: the property tests
# of #1555-#1557 found 14 bugs that were an unvalidated `json.loads` or
# `tomllib` value read as the wrong type, and `disallow_any_expr`
# refuses each where it is first read.
#
# An unknown key here, or a file mypy cannot parse, is a WARNING and
# exit 0 with mypy's defaults in force; mise/python-types.sh reds any
# line mypy prints about this file.
#
# No python_version: mypy takes the interpreter's, and the interpreter
# is the belt's python pin (python-types.sh asserts it).

[mypy]
strict = True
disallow_any_expr = True
disallow_any_explicit = True
disallow_any_decorated = True
disallow_any_unimported = True
warn_unreachable = True
strict_equality_for_none = True
warn_unused_configs = True
enable_error_code =
    deprecated,
    exhaustive-match,
    explicit-override,
    ignore-without-code,
    mutable-override,
    possibly-undefined,
    redundant-expr,
    redundant-self,
    truthy-bool,
    truthy-iterable,
    unimported-reveal,
    unused-awaitable,
    unused-ignore
# Two files of one basename in two directories are one module to mypy,
# and the run stops ("Duplicate module named"); package bases from the
# working directory keep them apart (measured: same findings over the
# canon either way).
explicit_package_bases = True
# The gate writes nothing in the tree.
cache_dir = /dev/null
