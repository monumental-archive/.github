# Max enforcement: every stable rule, plus preview. Ruff's `ALL` selector
# deliberately excludes preview rules, so `preview = true` is what makes
# ALL actually mean all — the same call as biome's nursery, and the same
# mitigation: the version is pinned and bumped by Renovate, so an unstable
# rule change arrives as a red bump PR, never a surprise in main. Ruff is
# pre-1.0 and its minor versions may change lint results by design.
#
# Ruff is the tool that HAS the one-line switch. #445 found that biome
# does not: its `preset: "all"` excludes nursery, nothing turns the group
# on in bulk, and this comment's confident parallel was written while 87
# biome rules sat off. Where a switch is claimed, run the tool and watch
# a rule from the group fire before writing that down.
preview = true

# The interpreter this code actually runs on, which is now a fact the belt
# decides rather than a floor guessed from whatever a machine ships.
#
# This started as "py39", reasoned from the belt not pinning Python: the
# script ran on ambient `python3`, and macOS ships 3.9.6. That premise
# stopped being true when `python` joined the belt (#82) — mise pins the
# interpreter, `activate_aggressive` puts it first on PATH, and every
# caller of this script runs inside a mise task, so `python3` resolves to
# the pinned build on every machine and in CI alike.
#
# `lint:python-target` guards the one direction that breaks things: this
# may not claim a NEWER Python than the pinned interpreter, because the
# pyupgrade rules rewrite code into whatever it names, and ruff has no
# idea what will run the result. Targeting lower stays legal — a repo
# publishing a library deliberately supports older interpreters than it
# develops on.
target-version = "py314"

[lint]
select = ["ALL"]
ignore = [
  # Ruff's own published formatter-incompatible list: these rules demand
  # output `ruff format` will not produce, and `ruff format` emits a
  # warning on every run while they are enabled. Not a preference —
  # two halves of one tool contradicting each other.
  "W191",
  "E111",
  "E114",
  "E117",
  "D206",
  "D300",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "COM812",
  "COM819",
  "ISC002",
  # Ruff already disables both of these itself: each is one half of a
  # mutually-exclusive docstring pair (D203/D211, D212/D213) and `ALL`
  # selects both halves. Naming them changes no enforcement whatsoever —
  # it only stops ruff printing two "are incompatible" warnings on every
  # check and every format run, in the gate, forever.
  "D203",
  "D213",
  # Per-file copyright headers are refused org-wide: the licence is
  # declared once in REUSE.toml and proven in the gate by lint:reuse, so
  # a header is a second copy of a machine-verified fact with nothing to
  # gain and drift to lose — which is exactly how an MIT header reached a
  # 0BSD tree (#316). Scaffold files make it worse: they are copied into
  # repos that are deliberately licensed differently.
  "CPY001",
  # `print` is this tool's output mechanism, not a debugging leftover.
  # T201 exists to catch strays in library code; the belt's Python is a
  # CLI check that emits its findings on stdout and stderr by design.
  "T201",
]

[lint.per-file-ignores]
# The two rules that encode PYTEST's idiom, off for stdlib unittest
# files. Same shape as the formatter-incompatible list above — two
# halves of one tool contradicting each other, not a preference. PT009
# demands a bare `assert` in place of `self.assertEqual`, and PT027
# `pytest.raises` in place of `self.assertRaises`; taking either means
# taking pytest, which is a belt tool the org does not have and refused
# to add on #364's reasoning (a test framework is a further thing to
# port). Bare asserts would then trip S101 in turn, so this is the one
# arrangement that lets `ALL` and `unittest` coexist. Nothing is
# weakened for a repo that DOES use pytest: neither rule fires on a
# pytest-style test in the first place.
"**/test_*.py" = ["PT009", "PT027"]

[format]
docstring-code-format = true
