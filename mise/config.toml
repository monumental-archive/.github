# The org toolbelt: universal tools every repo gets, locally and in CI.
#
# Local: symlink into the global fragment directory —
#   ln -s ~/Projects/org-github/mise/config.toml ~/.config/mise/conf.d/toolbelt.toml
# CI: the shared workflow checks out this repo (SHA-pinned) and sets
#   MISE_GLOBAL_CONFIG_FILE to this file, so the layering is identical to local.
#
# Every tool enters this file only after its own docs-first standup, pinned
# exact. mise.lock alongside carries checksums; CI runs MISE_LOCKED=1.
# Regenerate the lock with `mise lock` from this directory.
# The mise/config.toml name is deliberate: both mise and Renovate's mise
# manager recognise it natively — do not rename.
#
# Layering caveat: a repo's mise.toml can override a task or tool version from
# this file — that is mise working as designed. Enforcement lives in the shared
# workflow, not here.

[settings]
# mise.lock records resolved versions, per-platform URLs and checksums.
lockfile = true
# `locked` is set by the shared workflow as MISE_LOCKED=1, not here. In the
# config it also applies to local task runs, where mise re-resolves per task
# directory and cannot find this file's lock through the conf.d symlink —
# every task then warns that every tool "is not in the lockfile". The
# enforcement belongs where the lock is guaranteed reachable: CI.
# Re-verify each tool's provenance attestation on install, even when the
# lockfile already has an entry. A checksum proves the bytes did not change;
# this proves who produced them.
locked_verify_provenance = true
# `mise use` writes exact versions, never ranges.
pin = true
# Pinned tools go to the FRONT of PATH, so a system install can never shadow
# the pinned one — the failure where CI and a laptop run different binaries
# while both look correct.
activate_aggressive = true
# Never install a release younger than seven days: the same number as
# Renovate's minimumReleaseAge, so the two layers agree instead of one
# quietly undercutting the other.
minimum_release_age = "168h"
# asdf plugins are unsigned single-maintainer bash; ubi is deprecated
# upstream in favour of the github backend. Neither belongs under a
# checksum-and-attestation policy.
disable_backends = ["asdf", "ubi"]
# lockfile_platforms is deliberately NOT set. The lock currently covers
# seven platforms including linux-*-musl and macos-x64, and repos in this
# org build musl statics and Intel macOS binaries. Narrowing the list is a
# decision that needs evidence about what actually runs where, and getting
# it wrong drops a platform silently — the lock simply stops carrying it.
# The org's aqua registry corrections (mise/aqua-registry.yaml), loaded
# BEFORE the registry baked into mise. A package named there overrides
# the baked definition; a package absent from it falls through
# untouched, so this changes exactly one tool's resolution and nothing
# else — measured, with `aqua:rhysd/actionlint` still resolving its
# native asset from the baked registry in the same run.
#
# BY URL RATHER THAN BY PATH, and that is measured rather than
# preferred. `aqua.registries` accepts an absolute `file://` or an
# `https://` URL, and nothing else here works: a relative entry beside
# this file resolves to nothing AND SAYS NOTHING (mise's own
# documentation states it resolves against the config file's directory;
# on the pinned version it does not), `[settings]` values are not
# templated so `ORG_BELT_DIR` cannot be interpolated, and setting
# `MISE_AQUA_REGISTRIES` from `[env]` arrives after registry resolution
# — it writes a lock with the WRONG architecture and exits 0, which is
# worse than failing. A file shared across every machine cannot carry a
# machine-specific absolute path, so the URL is what is left. The commit
# SHA pins its content exactly as every `uses:` pin does.
#
# WHEN TO DELETE THIS, and it is not when upstream merges the fix.
# mise does not read aqua-registry HEAD — it reads a snapshot compiled
# into its own binary (`aqua.baked_registry`, default true), measured on
# 2026-08-24 to be byte-identical to HEAD at aqua-registry 6291c29d. So
# the correction is retired by the MISE BUMP carrying a new snapshot,
# not by the upstream merge (aquaproj/aqua-registry#59338). The test is
# mechanical: drop the entry, run `mise lock`, and keep the deletion
# only if the lock does not move. `audit:lock-arch` is the backstop
# either way — it reds if any lock names an architecture it does not
# carry.
#
# The SHA is an N-1 self-pin: a commit cannot contain its own (#227), so
# this names the commit that added the file. Renovate does not manage
# it; a change to mise/aqua-registry.yaml needs this line bumped in the
# commit after it.
aqua.registries = [
  "https://raw.githubusercontent.com/monumental-archive/.github/3cb9dd4ff2a75d587e35bbb372045e157df2ffb4/mise/aqua-registry.yaml",
]

# THE DEFAULT INLINE SHELL FOR EVERY TASK IN EVERY REPO, not just the ones
# below (#700). `[task_config]` governs the tasks declared in the file it is
# written in and reaches no further, so until this line a repo's own
# `mise.toml` task ran under mise's default — `sh -c -o errexit`, which is
# dash on an Ubuntu runner and bash-in-posix-mode on macOS. Settings, unlike
# `[task_config]`, DO layer: the belt sets the default here and every repo
# task inherits it through the same conf.d symlink and the same
# MISE_GLOBAL_CONFIG_FILE that deliver everything else.
#
# The divergence this closes was silent and one-directional — green where
# the author is, red where nobody is watching. Measured 2026-08-21 on a
# planted repo task, dash forced as the default to stand in for the runner:
#
#   set -euo pipefail; …    exit 2   (`set: Illegal option -o pipefail`)
#   false | cat; echo …     exit 0   ← the quiet one: the pipeline FAILED
#   [[ 1 == 1 ]] && …       exit 127    and the task went green anyway
#   grep -c x <<< "xx"      exit 2
#
# With this line all four are exit 0, 1, 0, 0 — the failing pipeline is the
# only one that reds, which is the whole point. Note the second row: dash
# does accept `-o errexit` on the command line, so an unpinned body was
# never missing errexit — it was missing PIPEFAIL and nounset, and a body
# whose failure signal is a tool's exit status inside a pipeline passed
# having not checked. That is #82 finding 2 exactly, one layer out.
#
# `[task_config]` below stays: it is what the tasks IN THIS FILE run under,
# it is what `lint:belt-shell` reads to model them, and a default a repo can
# override is not the same statement as a declaration this file makes about
# itself.
unix_default_inline_shell_args = "bash -euo pipefail -c"

# Environment the belt exports to every mise-run process, including the
# subprocesses mise itself spawns to INSTALL tools — verified by setting an
# absurd cutoff here and watching the pipx install fail (#82).
[env]
# WHERE THE BELT IS, resolved once here so no task ever resolves it again.
#
# Every config that only a belt tool reads is delivered FROM the canon at
# run time rather than copied into each repo — so there is no second copy
# to drift, and nothing to write a drift check about. That was impossible
# until this line: mise has no template for a global config's own
# directory ({{config_root}} is the home directory for one), so tasks
# had begun carrying their own resolution blocks. Six of them, at the
# point this replaced them.
#
# Both carriers, one expression: CI sets MISE_GLOBAL_CONFIG_FILE to the
# canon tree that `$/.github/actions/canon` linked; locally the belt is a
# ~/.config/mise/conf.d symlink into a checkout. The symlink's NAME is not
# assumed — the belt is identified by a file only the belt has, so a
# machine that named it something else still works. Empty when the belt
# did not arrive — which is not a quiet state: `ci` is itself
# belt-defined, so a tree with no belt dies at `mise run ci` as an
# unknown command, before any lint task exists to skip (measured
# 2026-08-21 in a consumer tree with `MISE_GLOBAL_CONFIG_FILE=/dev/null`:
# `mise ERROR unknown command: ci`, exit 1). The canon's own checkout
# cannot reach that state — mise loads `mise/config.toml` from the
# project root as a local config, the same filename fact stated above.
#
# "Empty" must mean exit 0 with no output, not exit 1: mise runs this under
# `sh -o errexit`, and a template that exits nonzero aborts EVERY mise
# invocation of this config — including Renovate's `mise lock`, which runs
# in a container with neither carrier present (#569, measured on #567). The
# not-found branches are therefore `if`-guarded, never bare AND-lists whose
# failure errexit promotes to a crash.
ORG_BELT_DIR = "{{ exec(command='d=\"${MISE_GLOBAL_CONFIG_FILE:-}\"; if [ -z \"$d\" ]; then for f in \"${XDG_CONFIG_HOME:-$HOME/.config}\"/mise/conf.d/*.toml; do t=$(readlink \"$f\" 2>/dev/null || echo \"$f\"); if [ -f \"$(dirname \"$t\")/clippy.toml\" ]; then d=\"$t\"; break; fi; done; fi; if [ -n \"$d\" ]; then cd \"$(dirname \"$d\")\" && pwd; fi') }}"
# WHERE THE CANON TREE IS, derived from the belt and never resolved a
# second time. The belt is one directory inside the canon; the tasks
# that need the canon proper need what sits BESIDE it — slsa/ policies,
# release/, security/. Both carriers put the belt inside a full canon
# tree by construction: CI's `$/.github/actions/canon` refuses any tree
# with no mise/config.toml before linking it, and locally the conf.d
# symlink points into a checkout. So this is a dirname, not a second
# search, and it cannot disagree with ORG_BELT_DIR about which tree is
# in play. Empty when the belt did not arrive, for the same #569 reason
# stated above — `dirname` of empty is empty, not an error.
ORG_CANON_DIR = "{{ env.ORG_BELT_DIR | dirname }}"
# The org's seven-day release-age floor, extended to Python.
#
# `minimum_release_age = "168h"` above governs how mise resolves a tool's
# own version. It does NOT reach inside a `pipx:` install: mise shells out
# to `uv tool install <pkg>==<ver>`, and uv then resolves the package's
# whole transitive closure with no floor at all. Standing up reuse pulled
# six further packages that way — license-expression, markupsafe,
# python-debian, python-magic, tomlkit, charset-normalizer — each of which
# could have been published minutes earlier. The org's stated supply-chain
# policy simply stopped at the language boundary.
#
# uv accepts a relative duration here, not only a fixed date, so this
# tracks with the clock and never needs bumping — the objection that
# killed the fixed-date form. Proven to bite: at "1825 days" resolution
# drops to a reuse old enough that its build fails, at "7 days" it
# resolves 6.2.0 unchanged.
UV_EXCLUDE_NEWER = "7 days"
# Already uv's default, pinned explicitly on the ruby.compile precedent: a
# default flip would land unattended through an automerged mise or uv
# bump, and this particular default is the one standing between a
# `pipx:` install and dependency confusion. "first-index" stops at the
# first index that has the name; the alternatives keep looking and can be
# convinced to prefer an attacker's copy from elsewhere.
UV_INDEX_STRATEGY = "first-index"
# uv may not choose or fetch an interpreter of its own. Without these it
# does exactly that, silently: a `pipx:` install on a machine whose system
# Python is too old makes uv download CPython into ~/.local/share/uv/python
# and build the tool venv there — pinned nowhere, absent from mise.lock,
# recorded in no verdict. The measured consequence was two different
# interpreters for one tool: this maintainer's Mac built reuse on uv's
# downloaded 3.12.13 (macOS ships 3.9.6, too old for it) while CI built the
# same reuse on whatever the runner happened to ship. That is precisely the
# "CI and a laptop run different binaries while both look correct" failure
# activate_aggressive exists to prevent, one layer further down. With these
# set, uv builds on the interpreter pinned below — verified by inspecting
# the tool venv's pyvenv.cfg before and after.
UV_NO_MANAGED_PYTHON = "1"
UV_PYTHON_DOWNLOADS = "never"

[task_config]
# Tasks are written in bash (guards use [[ ]] and <<<); mise's own default
# task shell is sh, which is dash on Ubuntu runners and chokes on both.
#
# This declaration covers THIS FILE's tasks only — `[task_config]` does not
# layer, which is #700. What reaches a repo's own `mise.toml` is the
# `unix_default_inline_shell_args` setting above, and `lint:belt-shell`
# reds any repo that defines tasks without restating the pin here.
#
# -euo pipefail, not a bare `bash -c` (#82 finding 2). Without it a task
# whose failure signal is a tool's exit status passes if anything follows
# it: `lint:python` shipped that way, running `ruff check` then
# `ruff format --check`, where a lint error was masked by the formatter
# passing. That class of defect is invisible — the check goes green
# having not checked.
#
# This is the DEFAULT, and the few commands that are genuinely allowed to
# fail say so at the site with `|| true` and a reason. That direction
# matters: the alternative considered was leaving the shell permissive
# and adding `set -euo pipefail` to each of the 78 bodies by hand, which
# is the same reading with a worse result — an unsafe default, opt-in,
# and no way to prove every body was covered. A rule you have to remember
# to apply is not a rule.
shell = "bash -euo pipefail -c"

[tools]
actionlint = "1.7.12"
# actionlint shells out to shellcheck for `run:` script analysis; without it
# that entire check class silently vanishes.
shellcheck = "0.11.0"
typos = "1.49.0"
lefthook = "2.1.11"
trivy = "0.74.0"
zizmor = "1.29.0"
committed = "1.1.11"
taplo = "0.10.0"
shfmt = "3.13.1"
# rumdl over markdownlint-cli2: same rule family, aqua-backed instead of
# npm-backed — keeps Node out of the belt. Revisit if a JS suite lands.
rumdl = "0.2.60"
lychee = "0.24.2"
# JSON on the command line, used by eleven belt tasks — nine audit tasks
# parsing GitHub API responses, fix:tracks, and lint:bestpractices in the
# gate. It was a hard dependency of the gate and was never pinned, which
# is not bad luck: nothing checks. See docs/tooling-verdicts.md for the
# check that was attempted for that class and why it was abandoned (#82).
jq = "1.8.2"
# The other half of the pinning convention (#82). CLAUDE.md requires every
# `uses:` to carry a full SHA AND a trailing version comment; zizmor's
# unpinned-uses proves the SHA and cannot see the comment, and
# lint:canon-pins reads canon references only. pinact closes that, brings
# the seven-day floor to the one layer without it, and supplies the fixer
# nine other fix:* tasks had and action pins did not.
"aqua:suzuki-shunsuke/pinact" = "4.1.1"
# Python lint + format in one binary (#82), at `select = ["ALL"]`. Ruff
# is a standalone Rust binary: it needs no Python interpreter to run, so
# it lints Python whether or not one is pinned. (One now is, but for uv's
# sake, not ruff's.) Adopted for
# security/workflow-permissions.py, which computed the caller/callee
# permissions join until stele#148 replaced it; that file is gone and
# the reason with it. Re-adjudicated 2026-08-20 and KEPT: the belt's
# own helpers are Python (mise/deny-skips.py, mise/embedded-shell.py),
# so the language a belt tool must cover is still in the tree, and a
# universal layer that dropped Python the moment the canon's own count
# fell to two would have to re-adopt it for the first adopter who
# writes one.
ruff = "0.16.4"
# The org's JS/TS/JSON layer (#82), at every rule biome has: `preset:
# "all"` for the eight stable groups plus each nursery rule NAMED in
# mise/biome-org.json. 514 rules at 2.5.7, not the 525 this comment
# claimed until #445 measured them. `preset: "all"` does NOT include
# nursery and no bulk switch does — naming them is the only mechanism
# biome offers, so the list is an enable-list and fail-open in exactly
# one direction (a rule ADDED by a version bump is silently absent).
# Removals and renames are fail-closed: biome hard-errors on an unknown
# key. `audit:biome-rules` covers the open direction weekly, off the
# gate, because the check is a network fetch of the pinned schema.
# Written as the explicit aqua backend, never the
# `biome` short name: that name resolves to aqua AND npm, and an npm
# resolution records version only in the lock — no checksum, no
# attestation. Biome rules org-wide where it and eslint overlap; eslint
# and its plugin graph stay repo-side because a flat config imports its
# plugins from the repo's own node_modules, which no central pin can
# supply. Unlike every other belt tool this one cannot be proven here:
# the canon has 22 JSON files and no JavaScript, so its linter is
# exercised first in a consumer, not in this gate (docs/tooling-verdicts.md)
# — which is precisely how three defects rode along in it for three days.
"aqua:biomejs/biome" = "2.5.7"
# TypeScript type checking (#445), the one thing on the belt that reasons
# about what a value IS rather than how it is written — biome lints the
# same files and never resolves a type.
#
# TypeScript 7 is the Go port, and that is what makes this pinnable at
# all: `tsc` is now a native executable (`package/lib/tsc` in the
# platform tarball), so the type checker enters the belt WITHOUT
# bringing Node with it — the "keeps Node out of the belt" line on rumdl
# still holds. No aqua package exists, so this is the third `github:`
# backend after cargo-machete and cargo-semver-checks, and the weakest
# of the three on provenance: the release carries no attestation at all
# (`gh attestation verify` 404s on the asset) while mise still prints
# "verify SLSA provenance" and passes, so the lock's per-platform
# checksums are the only integrity control. Recorded in
# docs/tooling-verdicts.md rather than glossed.
#
# `version_prefix` because upstream tags releases `typescript/v7.0.2`,
# and `bin_path` because the executable sits inside the npm package
# layout the tarball preserves.
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }
# Coverage ratchet (docs/runbook.md): repos commit a floor in
# .coverage-floor and the canonical coverage:check enforces it in the
# gate — deterministic (local run against a committed number), guarded
# on the repo's manifests, skip-clean everywhere else. Best Practices
# Silver requires >=80% statement coverage. The floor is DERIVED STATE
# since #652: the release machinery writes it as `measured - band` and
# it only ever rises, so it can no longer drift below a ceiling nobody
# is watching.
"aqua:taiki-e/cargo-llvm-cov" = "0.9.0"
# The dependency track (docs/dependency-track.md). cargo-deny is the gate
# half (bans+licenses+sources, deterministic over the lock) and the
# advisories half (audit:deny, network). cargo-audit is skipped-subsumed:
# same RustSec DB, strictly a subset.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# Blast-radius scanning over published SBOMs (audit:blast-radius). The
# aqua registry lags upstream by one release at standup (2.5.0 exists);
# the pin advances via Renovate like everything else.
"aqua:google/osv-scanner" = "2.5.1"
# OpenVEX assembly (vex:new). The statement is the triage record; the
# signer signs it, blast-radius filters on it.
"aqua:openvex/vexctl" = "0.4.4"
# Keyless x509 tag signing at the mint (#349 S4): the release tag object
# was the one pointer in the release chain resting on a platform control
# instead of a signature, and a hand-minted break-glass tag left no
# cryptographic trace at all. Same Sigstore root of trust as cosign —
# one identity model, no standing key. aqua-backed: checksums, no
# install script (docs/tooling-verdicts.md).
"aqua:sigstore/gitsign" = "0.17.1"
# REUSE compliance (#316): the tool the api.reuse.software badge runs,
# executed in the gate over tracked files so compliance is machine-checked
# BEFORE registration — "compliant at registration" was an unenforced
# adjective until three defects shipped past it (an MIT header in a 0BSD
# tree, a CC0 header with no licence text, and the scaffold stub parsing
# as a real nested REUSE.toml). PyPI-only, no aqua package: the pipx
# backend rides aqua-backed uv (checksummed) — a documented exception in
# the cargo: class (tooling-verdicts.md).
"aqua:astral-sh/uv" = "0.12.7"
# The interpreter every `pipx:` tool venv is built on, pinned here so mise
# locks it and Renovate bumps it like any other tool rather than uv
# choosing one per machine (#82). This is not a new cost: a Python was
# already being fetched, just invisibly and unpinned — the earlier "a whole
# runtime for one script" objection rested on the belief that the belt
# had no interpreter, which was false. Precompiled, so it installs in
# about four seconds rather than the minutes a source build would take.
# 3.14.6 rather than 3.14.7: the standalone release carrying .7 is six days
# old and the seven-day floor refuses it.
python = "3.14.7"
"pipx:reuse" = { version = "6.2.0", uvx_args = "--with charset-normalizer", pipx_args = "--preinstall charset-normalizer" }
# The chain-link emitter's signing half: `stele emit chain` execs
# cosign sign-blob under the workflow's ambient identity — the binary
# deliberately has none of its own, and the signing tool still arrives
# through the belt like every other tool.
"aqua:sigstore/cosign" = "3.1.3"
# The org's own verifier, pinned and locked like every other tool. It
# replaces the `go run <module>@<commit>` bootstrap the source and
# verdict paths carried while stele had no release class (stele#7):
# same delivery as cosign or trivy — exact version, per-platform
# checksums in mise.lock, Renovate bumps it. Every call site now runs
# `stele` and no call site needs a Go toolchain.
#
# Inline by decision (#579): this key is a mise tool coordinate — the
# source the checksummed install resolves — and a TOML [tools] key can
# read no declaration; Renovate's mise manager owns the line.
"github:monumental-archive/stele" = "v0.20.0"
# NO go toolchain here, deliberately — the rust precedent (#403). The
# belt carried one for exactly one reason: audit:source-vsa compiled
# stele. Nothing in the belt compiles Go now, and a toolchain in the
# universal layer would be a build input every repo pays for and one
# repo uses.
#
# Go tooling stays: golangci-lint and the Go belt tasks below are
# universal-by-guard like the Rust ones — they skip clean without a
# tracked go.mod, and a repo that tracks one pins its own `go` (stele
# pins 1.26.6). Each task asserts the toolchain with the remedy rather
# than installing it, because a toolchain a repo did not choose is a
# build input it cannot reproduce.
# The Go layer (#392): one aqua-backed binary — checksums and GitHub
# artifact attestations verified at install — carrying ~105 lint
# analyzers plus the formatters (gofumpt with extra rules, gci). Like
# biome, this tool cannot be proven in this repository: the canon
# tracks no Go, so its rule set is exercised first in a consumer
# (stele) — recorded in docs/tooling-verdicts.md. The org's enable
# policy is `default: all` with per-rule written disables, carried in
# scaffold/.golangci.yml; lint:go refuses a Go repo that lacks the
# config, because golangci-lint's DEFAULT selection is five linters of
# ~105 — the ruff-defaults trap in a new costume. govulncheck is
# deliberately NOT here: it needs a go toolchain to build (no upstream
# binary releases, no aqua package), so it is a repo-side build input
# via the go: backend, the cargo-fuzz pattern — audit:go-vulns asserts
# it with the remedy.
"aqua:golangci/golangci-lint" = "2.13.2"
# SQL lint + format check (#403): the THIRD pipx: exception after reuse
# and yamllint — PyPI-only, no aqua package, riding checksummed uv
# under the same UV_* floor env. All core rules on (sqlfluff's default
# IS its maximum rule set); the config a repo must track exists to
# declare the DIALECT, which sqlfluff refuses to guess — postgres
# org-wide, the only SQL the org ships (pgrx extensions,
# monumental-archive-db). Zero SQL in the canon: like biome, golangci
# and the Rust pair, exercised first in a consumer.
"pipx:sqlfluff" = "4.3.0"
# Semver honesty for published crates (#403): the public API is checked
# against the latest release on crates.io. audit:*, NEVER lint:* — the
# baseline is fetched from the registry at run time, and the gate is
# deterministic by rule; #403's close-condition wording said lint:<tool>,
# and this is the recorded deviation, forced by the older rule. No aqua
# package and no upstream checksum assets, so the github: backend locks
# a trust-on-first-use checksum — weaker than aqua's published sums,
# recorded as such in docs/tooling-verdicts.md. Needs cargo+rustdoc at
# run time (repo-side toolchain, the lint:deny shape). Like the other
# Rust tools, unprovable in the canon — no Rust tracked.
"github:obi1kenobi/cargo-semver-checks" = "v0.50.0"
# Unused Rust dependencies (#403): every dependency in Cargo.toml must
# be imported somewhere, or carry a written ignored entry under
# [package.metadata.cargo-machete] with a reason. Static analysis, no
# cargo/rustc needed, so the gate run is deterministic and touches
# nothing. --with-metadata is deliberately NOT used in the gate: it
# shells out to cargo metadata --all-features and can rewrite
# Cargo.lock — a gate must not mutate the tree it is judging. Not in
# the aqua registry (404 at standup); the github: backend delivers the
# upstream binary with its published sha256 into the lock — the
# closest-to-policy path without aqua. Like biome and golangci-lint,
# unprovable here: the canon tracks no Rust, so it is exercised first
# in a consumer (docs/tooling-verdicts.md).
"github:bnjbvr/cargo-machete" = "v0.9.2"
# Dockerfile lint (#403): every hadolint rule at maximum reach —
# --failure-threshold style fails on ALL severities including style,
# and RUN lines get shellcheck via hadolint itself. Overlap with trivy
# stated in docs/tooling-verdicts.md: trivy runs policy checks
# (misconfig), hadolint runs best-practice + shell analysis — the DL
# and AVD rule families barely intersect. aqua-backed.
"aqua:hadolint/hadolint" = "2.15.1"
# Secret scanning at commit depth (#403): `gitleaks git` reads history
# via git log -p, so it is tracked-only by construction and reaches
# every commit, not just the tip. The overlap with trivy is a split,
# not a duplicate: trivy's secret scanner guards ARTIFACTS (Dockerfile
# context and published image layers, docs/dependency-track.md);
# gitleaks guards SOURCE at commit depth — a secret committed and then
# deleted is invisible to every tip scanner and still live to anyone
# who clones. No config file: gitleaks' default ruleset IS its maximum
# (the opposite of the ruff/biome default trap), so a config exists
# only once a real finding demands a written allowlist.
"aqua:gitleaks/gitleaks" = "8.30.1"
# Whole-file hygiene against .editorconfig (#403): the org's ONE written
# indentation rule lives in .editorconfig and this enforces it — six
# properties (charset, end_of_line, insert_final_newline, indent_style,
# indent_size, trim_trailing_whitespace) plus per-type max_line_length.
# aqua-backed: checksums, binary releases, no install script.
"aqua:editorconfig-checker/editorconfig-checker" = "3.11.2"
# YAML lint (#403): full rule inventory at error, policy in .yamllint.yaml.
# PyPI-only — no aqua package (404 in the registry; pure Python, no binary
# releases) — so the SECOND pipx: exception after reuse, riding
# checksummed uv under the same UV_* floor env above. Pinned here BEFORE
# the first install: a one-off `mise install` writes a bare lock entry
# with zero platforms, which works locally and fails CI with "No lockfile
# URL found".
"pipx:yamllint" = "1.38.0"

# Canonical tasks: available in every repo via the global layer. Repos may
# override a name; the shared workflow is the enforcement backstop.
#
# The task contract, in full:
#   - `mise run ci` must pass in every repo. Repos do NOT define `ci`; the
#     global task below assembles it.
#   - `lint:*` is claimed by the belt and wildcard-collected into `ci`, so a
#     linter added here is enforced in every repo with no repo change. Repos
#     may add their own `lint:<thing>` tasks; same collection applies.
#   - `test` and `build` are reserved names: define them and `ci` runs them,
#     omit them and `ci` skips them (optional depends).
#   - Belt linters guard for applicability and exit 0 when a repo has
#     nothing for them to check. A linter that can't skip can't be universal.
#   - Every enumerating `git ls-files` walk excludes ':!vendor/**':
#     vendored dependency trees are upstream's code, linted by their
#     upstreams — the belt checks the repo's OWN code. Measured on
#     stele, the org's first repo with a committed vendor/ (the go mod
#     vendor law): bash-portability red on x/sys's codegen scripts,
#     exec-bits on eight upstream .sh modes, shell on shfmt-formatting
#     upstream trees — none of them the repo's defects. Existence
#     probes (--error-unmatch, the licence emptiness check) and the
#     repro full-tree copies deliberately keep the whole tree.
#   - Write-mode siblings live under `fix:*`, never run by `ci`.
[tasks.ci]
description = "The gate: everything the org enforces, plus this repo's tasks"
dir = "{{cwd}}"
depends = [
  "lint:*",
  { task = "test", optional = true },
  { task = "build", optional = true },
  # The coverage ratchet joins the gate the moment a repo commits a
  # floor; without one it skips clean like every guarded belt task.
  "coverage:check",
  # The extension suite, named rather than collected (#813). `test` is
  # the REPOSITORY's task and the belt cannot define it without
  # colliding with every repo's own, so the belt's own test leg needs a
  # name of its own and a line here. Calling it `lint:pgrx` to reach the
  # wildcard was the alternative and is refused: a test named lint to
  # get itself collected is how `pg:lint` came to sit outside the gate
  # in the first place. Guarded and skip-clean like every belt task, so
  # a repo with no pgrx crate pays nothing.
  "test:pgrx",
]
run = "echo 'ci: all gates green'"

[tasks.fix]
description = "Run every write-mode fixer (the fix:* siblings ci deliberately excludes)"
dir = "{{cwd}}"
# The counterpart to `ci`, and deliberately not reachable from it: `ci`
# proves the tree is already right, this makes it right. Without an
# aggregate the fixers were N separate commands to remember, so the ones
# nobody remembered never ran. Same collection semantics as `lint:*`, and
# the same caveat: mise's `*` matches within ONE colon group, so a repo's
# `fix:web:types` would be silently uncollected — name fixers with a
# single colon.
depends = ["fix:*"]
run = "echo 'fix: all fixers applied'"

[tasks.audit]
description = "Run this repository's OWN audit:* tasks (the caller half of the audit surface)"
dir = "{{cwd}}"
# The third member of the `ci` / `fix` trio, and the one the org went
# without (#704). `ci` collects `lint:*` by wildcard, so a repo adds a
# deterministic check and the gate runs it with no workflow change.
# There was no such collection on the audit side: repo-audit.yml named
# belt legs one by one and every one of them was a BELT task, so a task
# a consumer defined in its own mise.toml was run by nothing, ever. The
# failure mode was silence — `mise run` finds the task, and no cron
# calls it.
#
# NOT `depends = ["audit:*"]`, which is the obvious symmetry and is
# wrong here: the belt arrives as mise's global config, so its own two
# dozen audit tasks are visible to every consumer and the wildcard
# would re-run the belt's legs inside the leg collecting them. Which
# tasks are the CALLER's is derived once, in own-audits.sh — by the
# file that defines them, NOT by mise's `global` flag, which reports
# how a config was loaded and calls the belt's own tasks non-global in
# the canon (own-audits.sh carries the measurement).
#
# EVERY TASK RUNS, THEN THE FAILURES ARE REPORTED. Failing fast would
# let one red task hide the rest — and the belt's own legs do not hide
# each other, because they are separate GitHub jobs. Collecting into
# one job would have quietly lost that property, so it is restored by
# hand here. Nothing is continue-on-error: measured while building
# this, `continue-on-error` appears nowhere in repo-audit.yml or
# audit.yml, so there is no per-leg tolerance ruling for a collected
# task to be inconsistent with. A red audit task reds the audit.
run = '''
. "${ORG_BELT_DIR}/own-audits.sh"
tasks=$(own_audit_tasks)
if [[ -z ${tasks} ]]; then
  echo "audit: no repo-defined audit:* tasks, skipped"
  exit 0
fi
failed=""
count=0
while IFS= read -r t; do
  [[ -n ${t} ]] || continue
  count=$((count + 1))
  echo "audit: running ${t}"
  # nested-mise: dispatching by name IS this task's job, and mise offers
  # no other form of it — the names come from the CALLER's own config, so
  # there is no derivation to extract the way lint:citation's was (#764).
  # The #82 race this marker answers for is a race with the PARALLEL lint
  # fan-out: `audit` is collected by nothing (`ci` wildcards `lint:*`, and
  # `depends = ["audit:*"]` is the shape own-audits.sh exists to refuse),
  # so this nesting never runs inside one.
  mise run "${t}" || failed="${failed} ${t}"
done <<< "${tasks}"
if [[ -n ${failed} ]]; then
  echo "audit: repo-defined audit task(s) failed:${failed}" >&2
  exit 1
fi
echo "audit: ${count} repo-defined audit task(s), all green"
'''

[tasks."hooks:install"]
description = "Wire this clone's git hooks to lefthook (run once per clone)"
dir = "{{cwd}}"
run = "lefthook install"

[tasks."lint:typos"]
description = "Spell-check contents and filenames (typos)"
dir = "{{cwd}}"
# Locale stays `en` (accepts en-US and en-GB): the org register convention
# is en-US in code and en-GB in prose, which no per-file locale can split.
# Repo-specific jargon goes in that repo's own _typos.toml (extend-words).
run = 'typos -c "${ORG_BELT_DIR}/typos.toml"'

[tasks."lint:toml"]
description = "TOML format check + lint (taplo, the delivered org format)"
dir = "{{cwd}}"
# No schema catalogs in the gate: catalog resolution is a network fetch.
# Tracked files only: taplo's own walker wanders into .git (lefthook's
# remote cache lives there) and has no exclude flag.
#
# The config is DELIVERED (#691). taplo was the last config-taking belt
# linter running with none, and it auto-discovers a repo-local
# `taplo.toml`, so the org's TOML format was whatever each repo happened
# to say — or taplo's defaults where a repo said nothing. Measured on
# edtf: remove its `taplo.toml` and this task reddens on four files.
# Not the vacuous-green trap — taplo's defaults are a real standard — but
# the quieter one, where the verdict depends on a file nothing tells a
# repo to carry.
#
# Two measured facts shape the guards, the same pair `lint:shell` met at
# #696 and for the same reasons:
#
#   A repo-local `taplo.toml` or `.taplo.toml` is REFUSED. `--config`
#   REPLACES the discovered file rather than merging with it (measured:
#   with the belt's config passed, a local `array_trailing_comma = false`
#   changes nothing), so a repo copy cannot lower the org format — it can
#   only be a file a maintainer believes in that does nothing. This also
#   ends the asymmetry #691 names: lint:rust hard-fails on a repo-local
#   clippy.toml while lint:toml silently DEPENDED on a repo-local config.
#
#   An unreadable `--config` is a WARN on stderr and exit 0 — taplo falls
#   back to its own defaults and formats on. So a belt that did not
#   arrive would produce a green run at a level nobody chose, and the
#   file is checked here before either half runs.
run = '''
set -euo pipefail
files=$(git ls-files ":!vendor/**" "*.toml")
[[ -n ${files} ]] || {
  echo "lint:toml: no TOML tracked, skipped"
  exit 0
}
tracked=$(git ls-files "taplo.toml" "*/taplo.toml" ".taplo.toml" "*/.taplo.toml")
if [[ -n ${tracked} ]]; then
  echo "lint:toml: the belt delivers the org TOML format; a repo must not track its own" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  tracked: /' <<< "${tracked}" >&2
  echo "  git rm --cached it: --config replaces it, so it changes nothing and reads as if it did" >&2
  echo "  its exclude globs steer taplo's walker, which the belt never uses — the file list is git's" >&2
  exit 1
fi
config="${ORG_BELT_DIR}/taplo-org.toml"
[[ -r ${config} ]] || {
  echo "lint:toml: the org TOML format is not readable at ${config}" >&2
  echo "  taplo only WARNS on an unreadable --config and formats on at its own defaults, so a" >&2
  echo "  belt that did not arrive would produce a green run at a level nobody chose." >&2
  exit 1
}
xargs taplo fmt --config "${config}" --check --diff <<< "${files}"
xargs taplo lint --config "${config}" <<< "${files}"
count=$(wc -l <<< "${files}" | tr -d " ")
echo "lint:toml: ${count} file(s) checked"
'''

[tasks."fix:toml"]
description = "Rewrite TOML to canonical format (taplo, the delivered org format)"
dir = "{{cwd}}"
# The same delivered config the check reads, on the fix:biome rule: a
# fixer working from a different config than the check that judges it
# produces edits the gate then rejects.
run = '''
set -euo pipefail
files=$(git ls-files ":!vendor/**" "*.toml")
[[ -n ${files} ]] || {
  echo "fix:toml: no TOML tracked, nothing to fix"
  exit 0
}
config="${ORG_BELT_DIR}/taplo-org.toml"
[[ -r ${config} ]] || {
  echo "fix:toml: the org TOML format is not readable at ${config}" >&2
  exit 1
}
xargs taplo fmt --config "${config}" <<< "${files}"
'''

[tasks."lint:markdown"]
description = "Markdown lint (rumdl, full rule set)"
dir = "{{cwd}}"
run = '''
files=$(git ls-files ":!vendor/**" "*.md" "*.markdown")
if [[ -n ${files} ]]; then xargs rumdl check --config "${ORG_BELT_DIR}/rumdl.toml" <<< "${files}"; else echo "lint:markdown: no markdown tracked, skipped"; fi
'''

[tasks."lint:sql"]
description = "SQL lint + format check (sqlfluff, all core rules)"
dir = "{{cwd}}"
# Subject-named like lint:python — sqlfluff covers one language. The
# config is DELIVERED, never copied: mise/sqlfluff.cfg is passed
# explicitly as --config from ORG_BELT_DIR (it joined the delivered set
# in dd5eea7, #455), so a repo tracks no .sqlfluff and there is nothing
# here to assert — the run body goes from the git ls-files guard
# straight to the lint. The dialect reasoning is why that delivered
# file states `dialect = postgres`: sqlfluff refuses to guess a
# dialect, so a run without one is a loud error, never a weak green —
# the reverse of the ruff/biome trap, where a missing config is a
# silent fallback to something weaker. Tracked files only, on the
# standing rule.
#
# THE BELT SHIPS NO ESCAPE, and does not need to (#708, #694). sqlfluff
# has two of its own, both repo content, both live under the delivered
# config — measured on the belt's pin, 4.3.0:
#   .sqlfluffignore is honoured even though this task gives explicit
#   paths (a named file leaves the run with a WARNING, exit 0). It is
#   for GENERATED files — a transcript of what a tool emits, which
#   conforming would stop being a transcript — with a written reason per
#   entry, on the _typos.toml footing: repo-shaped, never a silent
#   lowering. Whether to ignore or rewrite is the repository's call,
#   decided inside the repository; nothing is declared to the belt.
#   -- noqa: CODE suppresses one finding, and TRAPS: everything after
#   `noqa:` is parsed as a comma-separated CODE LIST, so a reason on the
#   same line is read as further codes and the suppression is discarded
#   in silence — 1 finding with `-- noqa: RF04 real column`, 0 with
#   `-- noqa: RF04`, and no warning either way. The reason goes on the
#   line ABOVE; the noqa carries codes and nothing else.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.sql")
[[ -n ${files} ]] || {
  echo "lint:sql: no SQL tracked, skipped"
  exit 0
}
xargs sqlfluff lint --config "${ORG_BELT_DIR}/sqlfluff.cfg" <<< "${files}"
count=$(wc -l <<< "${files}" | tr -d " ")
echo "lint:sql: ${count} file(s) linted"
'''

[tasks."fix:sql"]
description = "Apply sqlfluff's fixes and rewrite SQL to canonical form"
dir = "{{cwd}}"
# The write-mode sibling, never in the gate. --force is the
# non-interactive mode, not an unsafe-fix flag: sqlfluff fix applies
# only its own rule fixes, the same class as fix:python's safe fixes.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.sql")
[[ -n ${files} ]] || {
  echo "fix:sql: no SQL tracked, skipped"
  exit 0
}
xargs sqlfluff fix --config "${ORG_BELT_DIR}/sqlfluff.cfg" --force <<< "${files}"
'''

[tasks."audit:semver"]
description = "Public API vs the latest published release (cargo-semver-checks — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: the baseline is whatever crates.io currently
# publishes, which is remote state — a red can arrive with no local
# change, a property of the registry, not the diff. The release path is
# where this bites hardest (a major-worthy API break shipping as a
# minor), so a red here means: fix the API or bump the major in the
# next release — never both silently. Guarded on a publishable crate:
# publish = false workspaces have no registry baseline to diverge from.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n ${manifests} ]] || {
  echo "audit:semver: no Cargo.toml tracked, skipped"
  exit 0
}
command -v cargo > /dev/null || {
  echo "audit:semver: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
publishable=0
while IFS= read -r m; do
  [[ -n ${m} ]] || continue
  grep -q '^\[package\]' "${m}" || continue
  grep -q '^publish[[:space:]]*=[[:space:]]*false' "${m}" && continue
  publishable=1
done <<< "${manifests}"
[[ ${publishable} -eq 1 ]] || {
  echo "audit:semver: no publishable crate, skipped"
  exit 0
}
cargo-semver-checks check-release
'''

[tasks."lint:pg-upgrade-path"]
description = "Every published pgrx extension version reaches the current one"
dir = "{{cwd}}"
# Delivered rather than copied (#816). This check existed in exactly one
# repository, and it is what caught a Release PR that had derived no
# upgrade path at all after a burned release — a conforming repo without
# it ships a version every existing installation is stranded on, silently.
# The helper is the belt's; the graph it reads is the repo's.
#
# Deterministic and offline: it reads tracked filenames and the crate
# version. It belongs in `ci`, never in `audit:*`.
run = 'bash "${ORG_BELT_DIR}/pg-upgrade-path.sh"'

[tasks."lint:machete"]
description = "No unused Rust dependencies (cargo-machete, static)"
dir = "{{cwd}}"
# Static: parses Cargo.toml and greps source, needs no toolchain, so
# unlike lint:deny there is no cargo-missing failure mode — the binary
# is the belt's. A false positive (renamed crate, macro-only use) gets
# a written [package.metadata.cargo-machete] ignored entry beside the
# dependency it excuses, never a task-level skip. Exit 2 is a
# processing error and fails like everything else.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n ${manifests} ]] || {
  echo "lint:machete: no Cargo.toml tracked, skipped"
  exit 0
}
cargo-machete
echo "lint:machete: no unused dependencies"
'''

[tasks."lint:hadolint"]
description = "Dockerfile lint, every severity fails (hadolint --failure-threshold style)"
dir = "{{cwd}}"
# --failure-threshold style: the default (info) lets style findings sit
# in the tree unnoticed, which is what preset-max belts exist to
# prevent — the same reasoning as biome's --error-on-warnings. RUN
# lines get shellcheck through hadolint itself, mirroring the tool that
# already solved embedded-shell extraction rather than reinventing it.
# No .hadolint.yaml: like gitleaks, hadolint's default rule set is its
# maximum, so a config exists only to weaken (ignores) or to add label
# schema — neither is wanted, and an unexplained config is a review
# finding. Tracked files only; same glob family as lint:from-digests.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "Dockerfile" "*/Dockerfile" "*.Dockerfile" "Dockerfile.*" "*/Dockerfile.*")
[[ -n ${files} ]] || {
  echo "lint:hadolint: no Dockerfile tracked, skipped"
  exit 0
}
xargs hadolint --failure-threshold style --no-color <<< "${files}"
count=$(wc -l <<< "${files}" | tr -d " ")
echo "lint:hadolint: ${count} Dockerfile(s) clean at style threshold"
'''

[tasks."lint:gitleaks"]
description = "Secret scan at commit depth, full history (gitleaks git)"
dir = "{{cwd}}"
# `git` mode, never `dir`: history scanning is tracked-only by
# construction (no walker to wander into .git/lefthook caches), reaches
# secrets that were committed and deleted — invisible to every
# tip-of-tree scanner, still live to anyone who clones — and is
# deterministic over the commit set. --redact because a CI log line
# printing the matched secret would itself be a disclosure in a public
# repo. No config file by design: gitleaks' DEFAULT ruleset is its
# maximum, so requiring a config would invert the ruff/biome trap — a
# .gitleaks.toml appears only when a real finding demands a written
# allowlist, and an unexplained one is a finding in review.
# A red here is a rotation, then an ignore: the secret is in history,
# so removing it from the tip fixes nothing — rotate the credential,
# record the dead finding's fingerprint in .gitleaksignore with a
# comment naming the rotation.
run = '''
set -euo pipefail
git rev-parse --git-dir > /dev/null 2>&1 || {
  echo "lint:gitleaks: not a git repository, skipped"
  exit 0
}
gitleaks git --redact --no-banner .
'''

[tasks."lint:editorconfig"]
description = "Whole-file hygiene against .editorconfig (editorconfig-checker)"
dir = "{{cwd}}"
# The enforcement half of the org's one written indentation rule. A
# tracked .editorconfig is REQUIRED (the config-required trap, fifth
# costume: without the file every check silently vacuously passes).
# Tracked files only, passed as arguments — ec's own git-aware walker is
# not used, on the standing lefthook-cache rule.
#
# -disable-indent-size, with the reason about the CHECK: ec's indent
# test is "leading spaces are a multiple of N" and cannot know
# continuation alignment, so it fights every formatter that owns a
# language's layout — measured at standup: 73 of 76 findings were ec
# disagreeing with ruff-formatted Python, shfmt-formatted shell,
# rumdl-clean markdown list continuations, and yamllint-clean YAML.
# Indent SIZE is enforced per language by its owner (ruff, shfmt, taplo,
# biome, yamllint, rumdl); ec still enforces indent_style (a tab in a
# space file), charset, end_of_line, insert_final_newline,
# trim_trailing_whitespace and per-type max_line_length — the checks no
# other belt tool covers. The binary is named `ec` by aqua.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**')
[[ -n ${files} ]] || {
  echo "lint:editorconfig: empty tree, skipped"
  exit 0
}
if ! git ls-files --error-unmatch ".editorconfig" > /dev/null 2>&1; then
  echo "lint:editorconfig: no .editorconfig tracked — copy scaffold/.editorconfig (#403)" >&2
  echo "  without it every editorconfig-checker check vacuously passes" >&2
  exit 1
fi
xargs ec -disable-indent-size <<< "${files}"
count=$(wc -l <<< "${files}" | tr -d " ")
echo "lint:editorconfig: ${count} file(s) checked"
'''

[tasks."lint:yaml"]
description = "YAML lint (yamllint, full rule inventory at error + --strict)"
dir = "{{cwd}}"
# The org's yamllint config is DELIVERED, never copied: the run body
# passes -c "${ORG_BELT_DIR}/yamllint.yaml" explicitly, so delivery
# never depends on yamllint's upward discovery and a repo tracks no
# copy of its own (it joined the delivered set in dd5eea7, #455). The
# rule set matters because yamllint's fallback is its own `default`
# preset, a fraction of the org policy — but that fallback is
# unreachable while --config is passed, so the belt asserts nothing
# here. No fix:* sibling exists to wire: yamllint ships no writer, so
# findings are hand edits by design.
# Tracked files only — yamllint's own discovery is never used, on the
# standing lefthook-cache rule.
#
# WHAT THIS CHECK IS FOR is YAML a human wrote (#718). A package
# manager's lockfile is that manager's serialiser output, rewritten
# wholesale on every install, and grading it checks nothing: its line
# widths and quoting are the writer's, the repo cannot change them, and
# the finding cannot be cleared. Measured on monumental-archive #262 at
# canon v1.53.0 — 865 findings, every one of them in `pnpm-lock.yaml`,
# every hand-written YAML file in that repo already clean. And measured
# at the writer, on a lockfile hand-conformed to this very config
# (pnpm 11.22.0, `pnpm install --lockfile-only`): one run put the `---`
# back at the top and re-flowed both block mappings to `{...}`. There is
# also no repo-side lever to reach for — yamllint's whole surface is
# `-c CONFIG` / `-d DATA` with no ignore file, and a `# yamllint
# disable-file` line would be a waiver and would not survive the next
# install either.
#
# So this is APPLICABILITY, the same class of rule as "tracked files
# only": it names the check's subject, once, in the belt. It is NOT a
# seam, and #694's closure still holds for everything a human writes —
# the list below is org-owned and CLOSED, a repo cannot extend it, and
# nothing in a repo declares anything. A file enters the list only with
# its writer measured, never on its name looking lockfile-shaped.
run = '''
set -euo pipefail
# The closed list: files a package manager rewrites wholesale. Each entry
# is matched by NAME, at the root and at any depth — never by a
# `*lock*` shape, so `my-pnpm-lock.yaml` is ordinary YAML and is linted.
locks=(pnpm-lock.yaml)
subject=(':!vendor/**')
machine=()
for lock in "${locks[@]}"; do
  subject+=(":!${lock}" ":!*/${lock}")
  machine+=("${lock}" "*/${lock}")
done
skipped=$(git ls-files "${machine[@]}")
if [[ -n ${skipped} ]]; then
  # Named out loud: a gate that silently drops files reads like one that
  # read them.
  echo "lint:yaml: machine-written, outside this check's subject (#718):"
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  /' <<< "${skipped}"
fi
files=$(git ls-files "${subject[@]}" "*.yml" "*.yaml")
[[ -n ${files} ]] || {
  echo "lint:yaml: no hand-written YAML tracked, skipped"
  exit 0
}
xargs yamllint -c "${ORG_BELT_DIR}/yamllint.yaml" --strict <<< "${files}"
count=$(wc -l <<< "${files}" | tr -d " ")
echo "lint:yaml: ${count} file(s) linted"
'''

[tasks."fix:markdown"]
description = "Auto-fix markdown (rumdl)"
dir = "{{cwd}}"
# Guarded on its own subject, like lint:markdown beside it (#860). What
# this replaced piped the tracked list straight into xargs, and an empty
# list is not the same event on the two platforms the org runs on: BSD
# xargs declines to run the command, GNU xargs runs it with NO arguments.
# Argless rumdl does not fail — it falls back to WALKING THE DIRECTORY
# and rewriting whatever markdown it finds. Measured 2026-08-24 in a
# scratch git repo holding one untracked .md: four fixes applied, file
# rewritten, exit 0. That is the belt's tracked-files-only rule broken
# silently and in write mode, which is worse than the red its fix:shell
# sibling produced from the same shape.
run = '''
files=$(git ls-files ":!vendor/**" "*.md" "*.markdown")
[[ -n ${files} ]] || {
  echo "fix:markdown: no markdown tracked, skipped"
  exit 0
}
xargs rumdl check --config "${ORG_BELT_DIR}/rumdl.toml" --fix <<< "${files}"
'''

# The JS/TS/JSON layer (#82). Extension list is the set biome parses
# WITHOUT an experimental flag: html/vue/svelte/astro need
# `html.experimentalFullSupportEnabled` and are deliberately out until a
# repo has them — with `files.ignoreUnknown` left at its false default, an
# unexpected format is a loud diagnostic rather than a silent pass.
# `biome ci` is the no-write CI command; --error-on-warnings means an
# info/warn rule cannot sit in the tree unnoticed, which is what
# `preset: "all"` is for.
#
# NURSERY IS ON, ruled here rather than left implicit (#695). 87 rules,
# each named in mise/biome-org.json because biome offers no bulk switch,
# and biome prints "not yet stable and may change in the future" beside
# every one of them. That instability is real and it is also contained:
# the version is pinned exact with `minimum_release_age` at 168h, so a
# changed rule set can only arrive as a Renovate bump, which reddens THAT
# pull request and never main. A gate that goes red on a version bump is
# the gate working. `audit:biome-rules` covers the other direction —
# rules biome adds and this config does not yet name.
#
# THE SORTING FAMILY IS RULED ONE ACTION AT A TIME, and all ten are named
# so none is ever silently inherited from `preset: "all"` again (#695).
# The org has answered this question twice already — taplo
# (`reorder_keys` off) and yamllint (`key-ordering` disabled) — both
# times with the same reason written down: alphabetical order destroys
# semantic grouping. So `useSortedKeys`, `useSortedInterfaceMembers`,
# `useSortedTypeFields`, `useSortedProperties`, `useSortedSelectionSet`,
# `useSortedEnumMembers` and `useSortedAttributes` are OFF — each
# alphabetises a structure whose order its author chose, and CSS
# property order in particular decides which declaration wins, so
# `useSortedProperties` is a correctness argument as well as a
# legibility one.
#
# `useSortedPackageJson` is ON, and it is not the exception it looks
# like: it does not alphabetise. Measured on monumental-archive, it
# rewrote `name,private,type,engines,devDependencies` to
# `name,private,type,devDependencies,engines` — neither the input order
# nor alphabetical, but the conventional package.json field order, which
# its own documentation attributes to sort-package-json. Imposing a
# semantic grouping is what the anti-alphabetisation ruling is FOR.
# `organizeImports` and `noDuplicateClasses` stay on for plainer
# reasons: import statements carry no author-chosen order, and removing
# a duplicate class is not sorting.
#
# THIS WAS RULED TWICE IN ONE DAY AND THE SECOND RULING IS THIS ONE.
# The first reading was that the org runs every tool at its maximum and
# the tree complies, which would delete this block entirely; measured,
# that costs 622 `useSortedKeys` findings on the fixture and reorders 24
# of the canon's own JSON files. It was reversed because the org's rule
# is narrower than "max always": max by DEFAULT, and an exclusion only
# where max is measurably worse, with the measurement written down.
# Alphabetising a hand-authored file is that case, it was already
# adjudicated twice for two other tools, and one tool shipping the
# behaviour is not evidence against a ruling made on evidence. Keeping
# biome off here and clippy's `arbitrary_source_item_ordering` off in
# #701 is the consistent position, not the inconsistent one.
#
# What the family is NOT is a fixer-only concern. `lint:biome` fails on
# assist findings exactly as it fails on lint findings, so an action left
# on is enforcement, not a convenience.
#
# One correction worth keeping, because the issue that reported this
# named the wrong rule: the action that rewrote package.json was
# `useSortedPackageJson`, not `useSortedKeys` — the latter was off and
# provably so (delete this block and it fires; as shipped, zero) — and
# the knip.jsonc rewrite blamed on sorting was the formatter expanding
# an array. `useSortedEnumMembers` was also checked for a value-changing
# hazard on numeric TypeScript enums and does not have one: it sorts
# only enums with string initializers, and a planted numeric enum came
# back in its original order.
[tasks."lint:biome"]
description = "JS/TS/JSON lint + format check + assist (biome, every rule, every severity)"
dir = "{{cwd}}"
# The config is MATERIALISED at the repo root and never handed over from
# the belt directory, and that is mechanism, not taste: biome computes
# the project root from the directory its config FILE SITS IN. Given the
# belt's copy, its scanner looks for the project beside that copy, finds
# none, and every rule needing project or type information stops working
# — silently, while the syntactic ones carry on. Measured on
# monumental-archive at #445, one byte-identical config in two
# locations: 69 findings never reported (noUnnecessaryConditions 65,
# noUnresolvedImports 2, useImportExtensions 1, useArraySortCompare 1)
# and 73 FALSE ones invented — noUndeclaredDependencies read 93 where
# the truth is 20, because it was looking for package.json in the canon.
# 17 of biome's rules are type-aware and every one of them was dead.
#
# So the file is GENERATED for the length of one run and removed by a
# trap, leaving the tree exactly as found — no residue, and nothing for
# ten repos to remember to .gitignore. That is also the whole of the
# enforcement, and the reason this is not the #455 pattern with an extra
# step: a repo-root config that `extends` the belt's copy anchors
# correctly too, but a repo's own config is merged ON TOP and a repo can
# switch an org rule off in it (proven). A config that exists only during
# the run has no repo-side surface to lower.
#
# WHAT THE REPO STILL OWNS IS ONE FACT (#695): which of biome's rule
# DOMAINS it is. Under `preset: "all"` every domain's rules run whatever
# the tree contains — measured on monumental-archive, ten
# `useQwikValidLexicalScope` findings on a React app — and declaring
# `react` fixes nothing, because the declaration is already implied.
# Measured both ways on the same tree: adding `domains: {react: "all"}`
# left the run at 2164 diagnostics with an identical histogram, while
# `qwik: "none"` took it to 2154 and the ten Qwik findings to zero. Only
# the negative has an effect, and a repository must never be the thing
# writing a negative.
#
# So the repository writes `biome.json` containing `linter.domains` and
# NOTHING else, values "all" and nothing else, over the eleven identity
# domains and none of the three that are org strictness; the belt writes
# every "none" itself. `biome-config.py` refuses the rest by name, and
# refuses SILENCE too — a repo whose own package.json declares `react`
# must claim `react`, or this mechanism would turn react's rules off for
# it. The generated config is what biome is actually run against, so
# even a hostile declaration never reaches the tool: proven by planting
# a `biome.json` that claimed `qwik` and switched `noNodejsModules` off,
# and measuring no change in either (0 Qwik findings, 33 noNodejsModules).
#
# THE PRESET HAD NEVER MET TYPESCRIPT THAT CROSSES A DATABASE BOUNDARY,
# and three of its four largest rules broke on that one seam (#759,
# #767). monumental-archive is the first repo in the org where column
# names and row types enter TypeScript as Postgres spells them.
#
# `style/noTernary` is OFF. 164 findings, and 123 of them sit in
# expression positions where no statement can go — `...(c ? { k: v } :
# {})` has no if/else form, because an object literal admits expressions
# and not statements. The remaining 41 are convertible and measured a
# wash: turning `const x = c ? a : b` into `let` plus if/else trades the
# finding for a formatting finding and costs the `const`. A rule whose
# remedy is impossible for three quarters of its sites and a downgrade
# for the rest is max being measurably worse.
#
# `style/useNamingConvention` stays ON and is NARROWED, not dropped,
# because only two of its selectors touch the boundary. The org has
# already ruled this question one tool over: sqlfluff's `RF04` flags
# `public`/`method`/`label`, and #672 concluded that renaming a column
# is a migration and not a lint fix. The same column seen from
# TypeScript cannot become a naming defect. `typeProperty` and
# `objectLiteralProperty` therefore admit `snake_case` and
# `CONSTANT_CASE` beside `camelCase` — a name the DATABASE owns and a
# name the ENVIRONMENT owns (a container reads `POSTGRES_DB` by that
# exact key) are the same class of fact, and they land on the same two
# selectors. The widening holds to the SELECTOR, never to the case
# style at large.
#
# Everything else stays at maximum, and that is planted rather than
# asserted: on a file carrying `merged_ark`, `POSTGRES_DB`,
# `bad_function_name`, `bad_variable_name`, `bad_class_name` and
# `bad_type_name`, the two property names pass and the other four are
# still reported. camelCase at the row-mapping edge is the door's job,
# and the belt still enforces it everywhere the row is not.
#
# Measured on monumental-archive: 157 findings, not the 147 the issue
# reported. The split is what matters — 147 are properties, and the
# other 10 are function-scoped CONSTANT_CASE consts in that repo's own
# tests, which are NOT owned by anything outside TypeScript and stay
# enforced. After the narrowing: 11 remain, being those 10 plus one
# PascalCase `TextEncoder` in a type literal. One site is what per-site
# `biome-ignore` is actually for; 147 of them would have been the waiver
# #694 refused.
#
# IN A TEST THE LITERAL IS THE SPECIFICATION, so two rules are off for
# test files and nowhere else (#783). This is applicability declared
# once and owned by the org — the #718 shape — not a suppression at
# every site, which is what #694 refused.
#
# `expect(x).toBe(3)` and `rejects.toThrow(/append-only/u)` are the
# thing the test asserts. Naming them — `expect(x).toBe(EXPECTED)`,
# `const APPEND_ONLY = /append-only/u` — moves the specification out of
# the assertion and leaves the reader chasing a constant. Measured on
# monumental-archive at 43df3482, after every production literal was
# named: `style/noMagicNumbers` 40 and `performance/useTopLevelRegex`
# 19. `useTopLevelRegex` is 19/19 in tests, 16 of them
# `toThrow(/…/u)` and kin, and the rule's payoff — not recompiling a
# regex in a hot loop — does not exist for a regex evaluated once.
#
# ONE CORRECTION TO THE ISSUE, from re-deriving rather than re-reading:
# it is 38 of the 40, not 40 of 40. The other two are genuine
# production magic numbers in `packages/ark/src/index.ts` — a
# rejection-sampling bound (`if (b < 232)`) and a prefix width
# (`s.slice(4)`) — and they still red, which is the rule working. After
# the override: `useTopLevelRegex` 19 → 0, `noMagicNumbers` 40 → 2, and
# no other rule moves by one finding.
#
# THE GLOB LIST IS CLOSED AND MEASURED, not a guess at what a test file
# might be called. Every JS/TS file in the org was enumerated:
# release-lab, stele, signer and this repo have zero, so
# monumental-archive is the whole population, and across its branches
# and its history the only shapes that exist are `*.test.ts` (21 files)
# under `apps/door/test/` and `tests/unit/`. `**/test/**` and
# `**/tests/**` also carry that repo's test support — `stack.ts`,
# `global-setup.ts` — which hold fixture literals for the same reason.
# Looked for and NOT found anywhere, so deliberately not named:
# `*.spec.*`, `__tests__/**`, `*.test.tsx`, `*.test.js`. A repo that
# needs one of those comes here; that is the mechanism, not a gap.
#
# A REPO CANNOT WIDEN IT. `overrides` is refused by name in a
# repository's own `biome.json` (`biome-config.py`), and the generated
# config is what biome is run against, so a declaration that carried
# one would never reach the tool. The org's entry survives generation
# untouched, pinned by a test.
#
# THE OVERRIDE MERGES WITH `preset: "all"`, MEASURED, because the docs
# do not say so — they say only that an override "will be override the
# top-level configuration", which read strictly could mean the test
# glob loses every other rule. Planted on six files, one rule per
# direction: `noDebugger` still fires in all four test-glob files while
# the two named rules go silent. Both directions and the near miss:
# `src/prod.ts` still reds on both, `src/probe-test.ts` — test-shaped
# but a hyphen, not a dot — still reds on both, and `probe.test.ts`,
# `src/colocated.test.ts`, `test/probe.test.ts` and
# `tests/unit/probe.test.ts` are clean.
#
# A DESCRIBE'S SPAN IS THE SUM OF ITS TESTS, so a third rule is off in
# the same entry: `complexity/noExcessiveLinesPerFunction` (#804).
# Measured on monumental-archive #262: of 40 findings in tests, 27 are
# `describe(...)` callbacks; 215 cases have a median of 20 lines and
# only 20 (9%) exceed the bound of 50 — the bound is right about test
# bodies — but 33 of 60 `describe` blocks exceed it at 4.7 cases each.
# Splitting a long test makes its describe LONGER; the only compliant
# move is fewer cases per group, 33 groups becoming ~133, which is
# complying with a measurement of the wrong thing. In production the
# rule means "this function does too much"; on a describe it means
# "this subject has too many tests". `noExcessiveLinesPerFile` and
# `noExcessiveCognitiveComplexity` stay ON in tests: a 1,400-line test
# file genuinely splits and a test body's branching is real.
#
# THE COST IS PER-FILE AND STATED: the rule's 2.5.7 options are
# `maxLines`, `skipBlankLines`, `skipIifes` — no per-construct
# selector — so a 60-line helper in a `.test.ts` file goes quiet with
# the describes. Planted: `src/prod.ts` with a 60-line function still
# reds; `tests/x.test.ts` with a 60-line describe AND a 60-line helper
# reports nothing. And a trap met while planting: `biome lint --only=`
# BYPASSES `overrides` entirely — the same tree reports all three under
# `--only`, so never measure an override with it.
#
# ONE ENTRY, and the count is load-bearing: biome documents that "if a
# file can match three patterns, only the first one is used". A second
# entry added later does not compose with this one for a file matching
# both — it replaces it.
#
# `suspicious/noMisplacedAssertion` IS NOT IN THIS OVERRIDE, ruled
# separately and deliberately. Its 8 findings on the same tree are all
# false, but not because they are in test files: six are the
# assertion-helper pattern (a helper literally named `expectValidArk`)
# and two are the rule not recognising `test.prop(...)` from
# `@fast-check/vitest`. Switching it off for test globs would remove
# the only class it guards — an `expect` genuinely stranded outside
# `it`/`test`, which reports nothing and lets the suite pass green. So
# the rule stays on, the eight sites take per-site `biome-ignore` with
# their reasons in the repo, and the library blindness went upstream as
# https://github.com/biomejs/biome/issues/11454 — searched first, no
# existing report, confirmed on the pinned 2.5.7 against the control
# that `test.each` (fixed in biomejs/biome#10680) is clean in the same
# run. Same library as #11453; two rules, one unrecognised test API.
#
# Inert in this repository by construction: the canon tracks no file
# matching any of the three globs, which is the same standing caveat as
# every other biome rule here (#82).
#
# `nursery/noConditionalExpect` IS OFF ORG-WIDE, and this is the org
# accepting the loss of a detector rather than the loss of a true
# positive (#788). Eight findings on monumental-archive at 43df3482,
# eight false positives, re-derived site by site against the pinned
# 2.5.7 rather than taken from the issue:
#
#   apps/door/src/submit.ts:176        PRODUCTION — the door's `assert`
#                                      VERB read as a test assertion
#   apps/door/test/matrix.test.ts:224  try/catch, BOTH branches assert
#   apps/door/test/matrix.test.ts:227  "
#   apps/door/test/matrix.test.ts:229  "
#   apps/door/test/matrix.test.ts:324  " — the try ends in
#                                      `throw new Error("unreachable")`
#   apps/door/test/matrix.test.ts:325  "
#   apps/door/test/boundary.test.ts:682  filtered universal assertion
#   apps/door/test/replay.test.ts:925    "
#
# The rule cannot tell a FILTER from a BRANCH. "For every act with a
# null payload, assert a tombstone exists" is vacuously true when no act
# qualifies, which is the correct meaning; a branch that might never be
# taken is the defect. Both are `if (…) expect(…)`. And where every
# branch of a try/catch asserts, no path is silent — at 324 the `try`
# ends in an unconditional `throw`, so the `catch` is guaranteed.
#
# A TEST-GLOB OVERRIDE CANNOT CONTAIN THIS, which is why it is not in
# #783's entry: the first site is in `apps/door/src`. The `test` domain
# is org-fixed at "all" and is enabled by a `vitest` devDependency, so
# the rule reaches every file in the project, and the defect is not
# file-shaped. Per-site suppression is refused for the other reason —
# a rule wrong as a CLASS suppressed at every site is the waiver #694
# refused, and the vacuous-assertion class it exists for was not found
# anywhere on the tree.
#
# THE COST IS REAL AND IS PLANTED, not asserted. A genuinely vacuous
# test — `try { await doThing() } catch (e) { expect(…) }`, which
# passes having run no assertion at all when the call succeeds — is
# reported with the rule on and SILENT with it off. The org is losing a
# detector that had zero true positives and one production false
# positive on the first real tree it met, and that trade is the whole
# ruling; it is not a claim that the rule detects nothing.
#
# THIS EXCLUSION HAS AN EXPIRY, the difference between an exception and
# scar tissue: reported upstream as
# https://github.com/biomejs/biome/issues/11455 — searched first
# (`noConditionalExpect in:title` returned nothing), confirmed on the
# pinned 2.5.7 with a minimal reproduction of both classes, and with
# the control that renaming the imported `assert` to `applyVerb` clears
# the production finding while changing nothing else. The rule returns
# when biome (a) stops reporting a try/catch in which every branch
# asserts and (b) stops reading a call whose callee is not an assertion
# import as an assertion — its own sibling `noMisplacedAssertion`
# already carries the import allowlist that would fix (b), and in the
# same run is silent on the file this rule reports. `audit:biome-rules`
# keeps the watch on the other direction.
#
# The rule is NAMED "off" rather than deleted from the block on
# purpose: `preset: "all"` does not reach nursery, so the org's 87
# names are an enable-list, and a deleted name is indistinguishable
# from a rule nobody has ruled on. `lint:biome-domains` holds the block
# against `biome-nursery-domains.tsv` in both directions.
#
# TWO SAFE FIXES WERE NOT SAFE, and the belt now says so in the config
# rather than trusting biome's own classification (#758).
#
# `correctness/useImportExtensions` rewrote `from "./App"` to
# `from "./App.tsx"`, which `moduleResolution: bundler` without
# `allowImportingTsExtensions` rejects outright (TS5097). The rule is
# right that a relative import should carry an extension and wrong about
# WHICH — so it is configured rather than demoted. `forceJsExtensions`
# was that configuration and was half of it (#868): it answers `.js` for
# every source extension, which is right for `.ts` and `.tsx` and wrong
# for `.mts` and `.cts`, whose TypeScript counterparts are `.mjs` and
# `.cjs`. `extensionMappings` states all four instead, so each extension
# maps to the one TypeScript itself emits and resolves.
#
# Measured on biome 2.5.7 and TypeScript 7.0.2 — the three option
# settings crossed with the three project shapes the org has and all four
# TypeScript source extensions, one extensionless relative import each,
# full dial set, `fix:biome` then `tsc` then `biome`. What the fixer
# writes never depends on the project shape, so the specifier is stated
# once and the verdicts follow it:
#
#                      writes:  .ts   .tsx  .mts   .cts
#   shipped default             .ts   .tsx  .mts   .cts
#   forceJsExtensions           .js   .js   .js    .js
#   extensionMappings           .js   .js   .mjs   .cjs
#
#   verdict, per shape           shipped   force        mappings
#   bundler, no allowImportingTs TS5097 ×4 ok ok ✗ ✗    ok ok ok ✗
#   nodenext + allowImportingTs  ok ×4     ok ok ✗ ✗    ok ok ok ✗
#   nodenext, plain (scaffold)   TS5097 ×4 ok ok ✗ ✗    ok ok ok ✗
#
# ✗ is TS2307 for `force` and, for `mappings`, the `.cts` note below —
# never a resolution failure. Read the `force` column: the project shape
# never changed its answer, the source EXTENSION did, and the extension
# was the variable the #758 measurement did not vary. Note also that the
# shipped default was broken for the scaffold's own default project, so
# this was never the per-repo accident the first issue took it for.
#
# What the `.mts` cell cost before this: `./helper.js` cannot resolve
# `helper.mts`, because TypeScript maps `.js`→`.ts`/`.tsx`, `.mjs`→`.mts`
# and `.cjs`→`.cts`. So the fixer wrote a specifier `tsc` refused
# (TS2307) and biome's OWN `noUnresolvedImports` refused as well — one
# tool contradicting itself, with no repo-side edit that satisfies both.
#
# `.cts` is mapped because the mapping is what is true, and it cannot be
# exercised: under the org's `verbatimModuleSyntax` + `erasableSyntaxOnly`
# a `.cts` file can express no module syntax at all — ESM import/export
# is TS1286/TS1287, and `import x = require()` / `export =` is TS1294.
# The mapping does remove the resolution error (TS2307 is gone in all
# three shapes); the two walls that remain are those dials working, each
# named by the compiler in its own message, so the belt adds no ban of
# its own on top.
#
# The option is used OUTSIDE its documented rationale, deliberately, and
# the table above is why that is safe. biome documents
# `forceJsExtensions` as "useful if you use the `module: node16` setting
# when building your code with tsc" and `extensionMappings` as being for
# bundling to a package — neither mentions `moduleResolution: bundler`,
# and 2.5.7 ships NO bundler-aware option: both keys choose WHICH
# extension is suggested and neither can suppress the suggestion.
# Reading the docs alone gives the wrong answer here — it says no
# configuration can serve the bundler case, which is what the first lane
# concluded. Measuring says one does, in all three shapes. Docs
# cross-check, binary decides — and the correction to the correction is
# that a measurement is only as wide as the inputs it varied.
#
# `nursery/useConsistentTestIt` renamed `test.prop(...)` to
# `it.prop(...)` and left `import { test } from "@fast-check/vitest"`
# alone, so the module threw on load and two property tests stopped
# existing — 22 files/337 tests became 21/335, with nothing saying a
# fixer had removed coverage. Its FIX is off; the diagnostic stays on
# (measured: still reported under `fix: "none"`).
#
# The defect is not the rule's preferred direction, and swapping it does
# not help: with `options.function: "test"`, an `it` imported by name
# from vitest is renamed to `test(...)` and ITS import is left alone
# too. Measured both ways. The rule renames a call whose callee is an
# imported binding without touching the binding, which is not a safe
# application of a style opinion in either direction.
#
# THIS EXCLUSION HAS AN EXPIRY: reported upstream as
# https://github.com/biomejs/biome/issues/11453 — searched first, no
# existing report, confirmed on the pinned 2.5.7 with the symmetric
# reproduction above. When biome reclassifies the fix as unsafe or stops
# firing on an imported binding, delete the `fix` key and let the fixer
# do its job again. Without that link this is scar tissue nobody can
# ever retire.
#
# ONE STABLE RULE IS OFF, and it is a mechanical contradiction rather
# than a preference (#759). `complexity/useLiteralKeys` wants
# `row["id"]` written `row.id`. `noPropertyAccessFromIndexSignature` —
# an org tsc dial, forced on the command line and, since #731, required
# in every repo's tsconfig.json — makes exactly that rewrite an error.
# Proven on two files rather than inferred: given an index-signature
# type, the bracket form draws `useLiteralKeys` and type-checks clean,
# and the dot form is biome-clean and `TS4111: Property 'id' comes from
# an index signature, so it must be accessed with ['id']`. There is no
# order of edits in which both are green.
#
# The tsc dial wins because it is the correctness distinction — it marks
# an index-signature lookup as one, which is the whole reason the dial
# was adjudicated into tsc-flags.txt — where the biome rule is a style
# preference that recommends the one form TypeScript rejects. Scale on
# monumental-archive: 590 sites, every one of them a database row read
# through `postgres`'s index-signature `Row`. 590 per-site
# `biome-ignore` comments for a rule wrong as a CLASS is the shape #694
# refused; that is a waiver, not an exception.
#
# Naming one rule in a group does NOT reset the group under
# `preset: "all"` — measured on the same tree, the other five complexity
# rules that fire (noExcessiveLinesPerFunction 53,
# noExcessiveCognitiveComplexity 22, useMaxParams 4,
# useSimplifiedLogicExpression 3, noUselessUndefined 2) are unchanged.
# The invariant is pinned by a test rather than left to prose:
# `test_biome_config.py` refuses a config that enables this rule while
# `tsc-flags.txt` still names the dial, so the pair cannot silently
# disagree again.
#
# THE DOMAINS REACH NURSERY TOO, and did not at first (#720). biome's
# `preset: "all"` excludes nursery, so the org names all 87 rules one by
# one, and a NAMED rule beats its own domain being "none" — measured,
# `noReactNativeRawText` fired on the React fixture with
# `reactNative: "none"` set, and stopped only when the name was removed.
# 56 of the 87 carry a domain, so the mechanism above was true of the
# eight stable groups and false of the ninth. The generator now writes
# "off" for a nursery rule whose domain the repo did not claim, reading
# `biome-nursery-domains.tsv`; the 31 rules with no domain, and every
# rule in the org-fixed domains, are untouched. Measured on the fixture:
# noReactNativeRawText 1 → 0, useExplicitType 33 → 33,
# noConditionalExpect 8 → 8, and no measurable time added (20 generator
# runs, 0.818s either way). That org-fixed-domain control is off since
# #788, so the live one is `useConsistentTestIt` — `test` domain, 2 → 2
# on the same fixture whether or not the repo claims react.
#
# One rule the domains cannot reach, recorded so its absence is not read
# as an oversight: `noNodejsModules` has NO domain at all (`biome
# explain`), so no belt mechanism can scope it to browser code. A Node
# application answers it where the org's rule is answered everywhere
# else — in the repo, per file, with `biome-ignore-all
# lint/correctness/noNodejsModules: <reason>` (#694).
#
# The severity floor is belt-side because --error-on-warnings is NOT one:
# 123 of the 514 rules default to `info`, and an info diagnostic prints
# and exits 0. Proven with the org's own config — a magic number reports
# noMagicNumbers and the gate goes green. The JSON reporter's summary is
# the honest gate: any diagnostic, any severity, fails. On failure the
# run repeats under the human reporter, because JSON has no code frames
# and the second run only ever happens on the red path.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.js" "*.jsx" "*.mjs" "*.cjs" "*.ts" "*.tsx" "*.mts" "*.cts" \
  "*.json" "*.jsonc" "*.css" "*.graphql" "*.gql")
[[ -n ${files} ]] || {
  echo "lint:biome: nothing biome parses is tracked, skipped"
  exit 0
}
tracked=$(git ls-files "biome.jsonc" "*/biome.json" "*/biome.jsonc")
if [[ -n ${tracked} ]]; then
  echo "lint:biome: a repo declares its biome domains in a root biome.json and nowhere else" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  tracked: /' <<< "${tracked}" >&2
  echo "  a nested config takes root:false + extends and may then switch a rule off in one" >&2
  echo "  subtree — biome's own monorepo guide demonstrates exactly that; the org has no" >&2
  echo "  such surface. A .jsonc root is refused for the plainer reason: one shape, one name." >&2
  exit 1
fi
generated="biome-org.generated.json"
generated_tracked=$(git ls-files "${generated}")
if [[ -n ${generated_tracked} ]]; then
  echo "lint:biome: ${generated} is tracked; the belt writes it for the length of one run" >&2
  exit 1
fi
trap 'rm -f "${generated}"' EXIT
git ls-files ':!vendor/**' "package.json" "*/package.json" \
  | python3 "${ORG_BELT_DIR}/biome-config.py" \
    --org "${ORG_BELT_DIR}/biome-org.json" \
    --domains "${ORG_BELT_DIR}/biome-domains.tsv" \
    --nursery "${ORG_BELT_DIR}/biome-nursery-domains.tsv" \
    --out "${generated}"
report=$(mktemp)
xargs biome ci --config-path "${generated}" --reporter=json --reporter-file="${report}" \
  <<< "${files}" > /dev/null || true
counts=$(jq -r '[.summary.errors, .summary.warnings, .summary.infos] | @tsv' "${report}")
read -r errors warnings infos <<< "${counts}"
for n in "${errors}" "${warnings}" "${infos}"; do
  [[ ${n} =~ ^[0-9]+$ ]] && continue
  echo "lint:biome: biome's JSON summary is not the shape this task reads — the reporter is" >&2
  echo "  experimental and may move in a PATCH release, so a shape change fails rather than" >&2
  echo "  silently counting zero. Re-read the reporter output and update the task." >&2
  exit 1
done
if [[ $((errors + warnings + infos)) -ne 0 ]]; then
  xargs biome ci --config-path "${generated}" <<< "${files}" || true
  echo "lint:biome: ${errors} error(s), ${warnings} warning(s), ${infos} info(s) — every severity fails" >&2
  exit 1
fi
count=$(wc -l <<< "${files}" | tr -d ' ')
echo "lint:biome: clean across ${count} files"
'''

[tasks."fix:biome"]
description = "Rewrite JS/TS/JSON to canonical format and apply safe fixes (biome)"
dir = "{{cwd}}"
# Safe fixes only: --unsafe is never wired into a belt task, because an
# unsafe fix may change behaviour and a fixer must be runnable without
# reading its diff first.
#
# That promise is the BELT'S, not biome's, and #758 is why the
# distinction matters: two rules biome classifies as `safe` changed
# behaviour on a real tree — one broke a typecheck, the other deleted
# two tests by renaming a call and leaving its import behind. Both are
# now configured or demoted in mise/biome-org.json with the measurement
# beside them. What the belt guarantees is therefore this and no more:
# every fix biome calls safe, MINUS the ones the org has measured
# breaking code. A rule that starts miscategorising a fix tomorrow will
# get through, and the honest mitigation is that a fixer runs on a
# branch and its diff reaches a gate — not that the tool is infallible.
#
# Materialises the same generated config as lint:biome, through the same
# helper, and for the same reason: a fixer reading a differently-anchored
# config — or one that resolved different DOMAINS — would produce
# different edits from the check that judges them. The two halves have to
# see one project and one identity.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.js" "*.jsx" "*.mjs" "*.cjs" "*.ts" "*.tsx" "*.mts" "*.cts" \
  "*.json" "*.jsonc" "*.css" "*.graphql" "*.gql")
[[ -n ${files} ]] || {
  echo "fix:biome: nothing biome parses is tracked, skipped"
  exit 0
}
tracked=$(git ls-files "biome.jsonc" "*/biome.json" "*/biome.jsonc")
if [[ -n ${tracked} ]]; then
  echo "fix:biome: a repo declares its biome domains in a root biome.json and nowhere else" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  tracked: /' <<< "${tracked}" >&2
  echo "  a nested config takes root:false + extends and may then switch a rule off in one" >&2
  echo "  subtree — biome's own monorepo guide demonstrates exactly that; the org has no" >&2
  echo "  such surface. A .jsonc root is refused for the plainer reason: one shape, one name." >&2
  exit 1
fi
generated="biome-org.generated.json"
generated_tracked=$(git ls-files "${generated}")
if [[ -n ${generated_tracked} ]]; then
  echo "fix:biome: ${generated} is tracked; the belt writes it for the length of one run" >&2
  exit 1
fi
trap 'rm -f "${generated}"' EXIT
git ls-files ':!vendor/**' "package.json" "*/package.json" \
  | python3 "${ORG_BELT_DIR}/biome-config.py" \
    --org "${ORG_BELT_DIR}/biome-org.json" \
    --domains "${ORG_BELT_DIR}/biome-domains.tsv" \
    --nursery "${ORG_BELT_DIR}/biome-nursery-domains.tsv" \
    --out "${generated}"
xargs biome check --config-path "${generated}" --write <<< "${files}"
'''

# The delivered domain table, re-derived against the pinned binary (#695).
#
# `mise/biome-domains.tsv` is what turns "the repo says react" into a
# full fourteen-key `linter.domains` block, and every value in it came
# out of `biome explain`. A table nobody re-derives is a second list, and
# the org has ruled against second lists everywhere else it found one
# (tsc-flags.txt, the clippy enable-list). This is that ruling applied to
# this file: fourteen `biome explain` calls, ~0.7s, and a renamed rule or
# a moved trigger reddens instead of rotting into a domain that silently
# stops being claimable.
#
# GUARDED ON THE TRACKED TABLE, so it runs in the canon and skips clean
# in every consumer — the canon is where the file is edited, and paying
# 0.7s in ten repos to re-check a file only one of them can change is
# the cost with none of the benefit. The direction this cannot see —
# biome growing a FIFTEENTH domain, which would sit outside the table
# and stay on under `preset: "all"` — is the network half, and
# `audit:biome-rules` holds it against the published schema weekly.
[tasks."lint:biome-domains"]
description = "The org's biome domain table still matches what biome says (canon only)"
dir = "{{cwd}}"
run = '''
set -euo pipefail
table=$(git ls-files "mise/biome-domains.tsv")
[[ -n ${table} ]] || {
  echo "lint:biome-domains: the domain table is delivered, not tracked here, skipped"
  exit 0
}
command -v biome > /dev/null || {
  echo "lint:biome-domains: biome missing from the belt" >&2
  exit 1
}
problems=""
rows=0
while IFS=$'\t' read -r domain kind rule triggers; do
  line="${domain%%#*}"
  [[ -n ${line//[[:space:]]/} ]] || continue
  [[ ${domain} != \#* ]] || continue
  rows=$((rows + 1))
  explained=$(biome explain "${rule}" 2> /dev/null) || {
    problems+="${domain}: biome does not know the rule ${rule}"$'\n'
    continue
  }
  said=$(awk '/^Domains/ { f = 1; next } f && /^- Name:/ { print $3; exit }' <<< "${explained}")
  [[ ${said} == "${domain}" ]] || {
    problems+="${domain}: ${rule} now reports domain \"${said:-none}\""$'\n'
    continue
  }
  [[ ${kind} == "identity" ]] || continue
  # The trigger names only, versions dropped: a dependency spec bumping
  # its floor is biome tightening a rule, not the table going wrong.
  #
  # The end-of-list test runs BEFORE the rewrite and never after it. Both
  # sub() calls mutate $0, so a rule ordered the other way round stops
  # matching its own list pattern the moment it edits the line, and the
  # exit fires on the first entry — which read as biome having dropped
  # qwik's second trigger package (caught by this task's first real run).
  found=$(awk '
    /dependencies are detected/ { f = 1; next }
    f && !/^  - / { exit }
    f { dep = $0; sub(/^  - /, "", dep); sub(/@>=.*$/, "", dep); print dep }
  ' <<< "${explained}" | paste -sd, -)
  [[ ${found} == "${triggers}" ]] || {
    problems+="${domain}: triggers are now \"${found}\", the table says \"${triggers}\""$'\n'
  }
done < "${table}"
if [[ -n ${problems} ]]; then
  echo "lint:biome-domains: the table no longer matches the pinned biome" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed '/^$/d; s/^/  /' <<< "${problems}" >&2
  # shellcheck disable=SC2016  # the backticks quote a command NAME in prose
  echo '  re-derive it from `biome explain` — a repo claims domains through this file' >&2
  exit 1
fi
version=$(biome --version | awk '{print $2}')
# The nursery half (#720). Same file, same alarm, one level down: which
# nursery RULE belongs to which domain, so the generator can switch off
# the ones whose framework a repository is not. 87 explain calls, 1.0s
# measured — paid here and nowhere else, exactly as above.
nursery=$(git ls-files "mise/biome-nursery-domains.tsv")
[[ -n ${nursery} ]] || {
  echo "lint:biome-domains: ${rows} domains agree with biome ${version}; no nursery table"
  exit 0
}
named=$(jq -r '.linter.rules.nursery // {} | keys[]' mise/biome-org.json | sort)
recorded=$(awk -F'\t' '!/^#/ && NF { print $1 }' "${nursery}" | sort)
drift=$(comm -3 <(echo "${named}") <(echo "${recorded}"))
if [[ -n ${drift} ]]; then
  echo "lint:biome-domains: the nursery table and the org config name different rules" >&2
  comm -23 <(echo "${named}") <(echo "${recorded}") | sed 's/^/  enforced but unmapped: /' >&2
  comm -13 <(echo "${named}") <(echo "${recorded}") | sed 's/^/  mapped but not enforced: /' >&2
  echo "  an unmapped rule escapes its domain and runs in every repo whatever the repo is" >&2
  exit 1
fi
nrows=0
while IFS=$'\t' read -r rule domain; do
  [[ -n ${rule} ]] || continue
  [[ ${rule} != \#* ]] || continue
  nrows=$((nrows + 1))
  explained=$(biome explain "${rule}" 2> /dev/null) || {
    problems+="${rule}: biome does not know it"$'\n'
    continue
  }
  said=$(awk '/^Domains/ { f = 1; next } f && /^- Name:/ { print $3; exit }' <<< "${explained}")
  [[ ${said:--} == "${domain}" ]] || {
    problems+="${rule}: biome says domain \"${said:--}\", the table says \"${domain}\""$'\n'
  }
done < "${nursery}"
if [[ -n ${problems} ]]; then
  echo "lint:biome-domains: the nursery table no longer matches the pinned biome" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed '/^$/d; s/^/  /' <<< "${problems}" >&2
  # shellcheck disable=SC2016  # the backticks quote a command NAME in prose
  echo '  re-derive it from `biome explain` — a wrong row is a rule in the wrong repo' >&2
  exit 1
fi
echo "lint:biome-domains: ${rows} domains and ${nrows} nursery rules agree with biome ${version}"
'''

# Named for the subject, not the tool, matching lint:shell / lint:toml /
# lint:markdown — ruff covers exactly one language. (lint:biome is
# tool-named because biome covers five.)
[tasks."lint:python"]
description = "Python lint + format check (ruff, select ALL + preview)"
dir = "{{cwd}}"
# A tracked ruff config is REQUIRED once Python is tracked, for the same
# reason biome's config is generated rather than defaulted, and with a
# sharper edge: ruff's DEFAULT selection is E4/E7/E9/F, a few dozen rules
# out of ~900. Measured at standup on this repo's own script — 48
# findings under `ALL`, ZERO under the defaults. A repo that forgets the
# config does not get a weaker gate, it gets a green one that checked
# almost nothing.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.py" "*.pyi")
[[ -n ${files} ]] || {
  echo "lint:python: no Python tracked, skipped"
  exit 0
}
xargs ruff check --config "${ORG_BELT_DIR}/ruff.toml" <<< "${files}"
xargs ruff format --config "${ORG_BELT_DIR}/ruff.toml" --check <<< "${files}"
'''

[tasks."lint:python-target"]
description = "ruff's target-version does not claim a newer Python than the pinned interpreter"
dir = "{{cwd}}"
# The hazard is one-directional, so the check is too. Ruff's pyupgrade
# rules rewrite code INTO the syntax of `target-version`; if that names a
# newer Python than the interpreter the belt pins, the fixer produces a
# script the runner cannot execute — and it does so on a green gate,
# because ruff has no idea which interpreter will run the result.
#
# Targeting LOWER than the pin is allowed and stays allowed: a repo
# publishing a library deliberately supports interpreters older than the
# one it develops on. Only "claims newer than it can run" is a defect.
run = '''
files=$(git ls-files ':!vendor/**' "*.py" "*.pyi")
[[ -n ${files} ]] || {
  echo "lint:python-target: no Python tracked, skipped"
  exit 0
}
# The belt's ruff config, not a repo's: since #445 lint:python passes it
# with --config, so a repo has none to find and looking for one here made
# this check skip clean — the vacuous skip it exists to prevent.
cfg="${ORG_BELT_DIR}/ruff.toml"
[[ -f ${cfg} ]] || {
  echo "lint:python-target: the belt's ruff.toml is missing — the belt did not arrive" >&2
  exit 1
}
target=$(grep -oE '^target-version[[:space:]]*=[[:space:]]*"py[0-9]+"' "${cfg}" | grep -oE 'py[0-9]+')
[[ -n ${target} ]] || {
  echo "lint:python-target: no target-version set, skipped"
  exit 0
}
actual=$(python3 -c 'import sys; print("py%d%d" % sys.version_info[:2])')
# Numeric compare on the digits: py39 < py310 lexically is false, which is
# exactly the trap this check exists to avoid falling into itself.
t=${target#py}
a=${actual#py}
tmaj=${t%"${t#?}"}
tmin=${t#?}
amaj=${a%"${a#?}"}
amin=${a#?}
if ((tmaj > amaj || (tmaj == amaj && 10#${tmin} > 10#${amin}))); then
  echo "lint:python-target: ${cfg} targets ${target} but the pinned interpreter is ${actual}" >&2
  echo "  ruff's pyupgrade rules would rewrite this code into syntax ${actual} cannot execute" >&2
  exit 1
fi
echo "lint:python-target: ${target} <= ${actual}, ok"
'''

[tasks."lint:action-pins"]
description = "Every `uses:` carries a version comment beside its SHA (pinact, offline)"
dir = "{{cwd}}"
# The comment half of the pinning convention. zizmor's unpinned-uses
# proves the SHA and is blind to what follows it; lint:canon-pins reads
# canon references only; so `uses: foo/bar@<sha>` with no comment at all
# passed every check the org had, while CLAUDE.md required one. The
# comment is what a human and Renovate read to judge whether a pin is
# current, so its absence is a real defect and not a style point.
#
# -no-api keeps this deterministic and offline, which is what makes it
# gate-eligible: it asserts a 40-character SHA and a comment, and asks
# GitHub nothing. Whether the comment is TRUE needs the API and lives in
# audit:action-pins.
#
# Tracked files only, and composite actions included: pinact's own
# discovery covers .github/workflows only, so action.yml files would go
# unchecked exactly as they did under zizmor's old scope.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n ${files} ]] || {
  echo "lint:action-pins: no workflows or actions, skipped"
  exit 0
}
xargs pinact run --config "${ORG_BELT_DIR}/pinact.yaml" -fix=false -no-api <<< "${files}"
echo "lint:action-pins: ok"
'''

[tasks."fix:actions"]
description = "Pin every `uses:` to a SHA and write its version comment (pinact)"
dir = "{{cwd}}"
# The fixer nine other fix:* tasks had and action pins did not — pinning
# by hand meant looking up a commit and pasting it. Network-bound, which
# is fine: fix:* never runs in the gate. --update is deliberately NOT
# wired in; bumping pins is Renovate's job, and a fixer that also
# upgraded would fight it.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n ${files} ]] || {
  echo "fix:actions: no workflows or actions, skipped"
  exit 0
}
xargs pinact run --config "${ORG_BELT_DIR}/pinact.yaml" <<< "${files}"
'''

[tasks."fix:python"]
description = "Apply ruff's safe fixes and rewrite Python to canonical format"
dir = "{{cwd}}"
# Safe fixes only: --unsafe-fixes is never wired into a belt task, on the
# same rule as fix:biome — a fixer must be runnable without reading its
# diff first.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.py" "*.pyi")
[[ -n ${files} ]] || {
  echo "fix:python: no Python tracked, skipped"
  exit 0
}
xargs ruff check --config "${ORG_BELT_DIR}/ruff.toml" --fix <<< "${files}"
xargs ruff format --config "${ORG_BELT_DIR}/ruff.toml" <<< "${files}"
'''

[tasks."lint:shell"]
description = "Shell format check AND lint (shfmt + shellcheck at the delivered org config)"
dir = "{{cwd}}"
# shfmt --find filters the tracked list to shell files itself, including
# extensionless scripts with shell shebangs that an extension glob misses.
#
# shellcheck was pinned in the belt and listed in the availability canary
# that used to stand beside these tasks, and NO TASK RAN IT (#82). That
# canary proved a binary was present, which reads like coverage and is
# not — so 2732 lines of standalone shell, including
# the source-attest emitter that produces the Source L3 chain, were linted
# by nothing. Verified by putting `rm $f` and `which git` into lib.sh:
# shellcheck reported 22 findings and the gate stayed green.
#
# The settings are DELIVERED (#696), not discovered. They used to sit in a
# `.shellcheckrc` at this repo's root and be found by shellcheck walking
# up from each script, which is a mechanism that works in exactly the
# repository that carries the file: `.shellcheckrc` was in no scaffold, in
# no other repo, and asserted by nothing, so this task ran at shellcheck's
# DEFAULTS everywhere but here — the config-required trap in a fifth
# costume, after ruff, biome, golangci and yamllint. Measured 2026-08-21
# in release-lab, on a four-line script whose only fault is an unbraced
# `$x`: silent and exit 0 without the file, SC2250 and exit 1 with it,
# same belt and same tree. `mise/shellcheckrc` states the level and the
# reasoning; `--rcfile` hands it over.
#
# Two measured facts shape the guards below.
#
#   A repo-local `.shellcheckrc` is REFUSED, the way lint:rust refuses a
#   repo-local clippy.toml and lint:biome a tracked biome.json. Not
#   because it would win — `--rcfile` beats discovery in both directions,
#   measured on a repo file and on $HOME/.shellcheckrc, each carrying
#   `disable=SC2250` and neither able to silence it — but because it
#   would be a config a maintainer believes in that does nothing.
#
#   An unreadable `--rcfile` is a WARNING ON STDERR AND EXIT 0.
#   shellcheck falls back to its defaults and lints on, so a belt that
#   did not arrive would look exactly like a clean run. Every other
#   delivered config in this file is passed to a tool that dies on a
#   missing path; this one has to be checked here.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' | xargs shfmt --find)
[[ -n ${files} ]] || {
  echo "lint:shell: no shell tracked, skipped"
  exit 0
}
tracked=$(git ls-files ".shellcheckrc" "*/.shellcheckrc")
if [[ -n ${tracked} ]]; then
  echo "lint:shell: the belt delivers the org's shellcheck settings; a repo must not track its own" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  tracked: /' <<< "${tracked}" >&2
  echo "  git rm --cached it: --rcfile beats discovery, so it changes nothing and reads as if it did" >&2
  echo "  a check genuinely wrong for one site takes a # shellcheck disable=SCxxxx there, with a reason" >&2
  exit 1
fi
rc="${ORG_BELT_DIR}/shellcheckrc"
[[ -r ${rc} ]] || {
  echo "lint:shell: the org shellcheck config is not readable at ${rc}" >&2
  echo "  shellcheck only WARNS on an unreadable --rcfile and lints on at its defaults, so a" >&2
  echo "  belt that did not arrive would produce a clean run instead of a red one. Checked here." >&2
  exit 1
}
xargs shfmt -i 2 -bn -ci -sr -s -d <<< "${files}"
xargs shellcheck --rcfile="${rc}" <<< "${files}"
count=$(wc -l <<< "${files}" | tr -d " ")
echo "lint:shell: ${count} script(s) formatted and linted"
'''

[tasks."lint:shell-embedded"]
description = "Shell inside `run:` blocks is formatted and linted, workflows and composite actions alike"
dir = "{{cwd}}"
# The two halves neither shfmt nor actionlint could reach (#82):
#
#   shfmt cannot see into YAML at all — `git ls-files | xargs shfmt --find`
#   returns zero workflow files — so 2584 lines of embedded shell were
#   never formatted by anything, which is where 268-character lines came
#   from.
#
#   actionlint delegates run: blocks to shellcheck, but only for
#   WORKFLOWS. Pointed at a composite action it parses it as a workflow
#   and fails on the missing `jobs:` key, so 152 lines in
#   .github/actions/*/action.yml were checked by nothing. Verified by
#   planting `rm $UNQUOTED` in verify-signed's action.yml: lint:actions
#   exited 0.
#
# The technique is actionlint's own — extract each block, run the real
# tool on it — and the code deliberately does NOT move. Extraction to .sh
# would hide it from zizmor, whose github-env and template-injection
# audits read run: content and cannot follow a script call.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n ${files} ]] || {
  echo "lint:shell-embedded: no workflows or actions, skipped"
  exit 0
}
# From the belt, like every other canon-owned input. This used to try
# mise/ then .org-canon/ and SKIP CLEAN when it found neither — so a
# consumer running the gate locally checked no embedded shell at all and
# said nothing. ORG_BELT_DIR resolves in both worlds (#445).
helper="${ORG_BELT_DIR}/embedded-shell.py"
# shellcheck disable=SC2086  # the file list is newline-separated on purpose
python3 "${helper}" ${files}
'''

[tasks."lint:belt-tree"]
description = "The belt answering this gate is the belt in this tree (#867)"
dir = "{{cwd}}"
# CLAUDE.md promises `mise run ci` locally is exactly what CI runs. That
# is only true if the belt answering is the belt in the tree under test,
# and nothing said when it was not. `ORG_BELT_DIR` falls back to the
# `~/.config/mise/conf.d` symlink whenever MISE_GLOBAL_CONFIG_FILE is
# unset, and that symlink names ONE canon checkout on the machine —
# whatever commit it happens to sit on. A fresh canon clone carrying its
# own complete belt still resolved ORG_BELT_DIR to a DIFFERENT checkout.
#
# It fires both ways and the dangerous one is silent. The false red froze
# a merge queue on 2026-08-24: canon main was reported red on
# lint:cold-attested while main was green three ways, because the
# machine's belt was one commit behind and its older task body did not
# know the cache shape #851 had just added. The false green ships: a lane
# that DELETES or renames a belt task still passes pre-push, because the
# machine's belt still has the old one (#857).
#
# CONTENT, NOT PATH, and that is measured rather than chosen. In CI the
# belt arrives as `.org-canon`, a symlink the canon action points at the
# resolved tree — and even when the canon calls ITSELF that resolves into
# `_actions/monumental-archive/.github/<sha>`, never the workspace
# checkout. Measured by reading the action's own `canon resolved:` line
# out of a real gate run: it named an `_actions` path under the runner's
# work directory, at the very commit the workspace already held. So the
# two belts are byte-identical at DIFFERENT paths, and a path-equality
# guard would red the canon's own gate on every run.
#
# Therefore: always green in CI, by construction — the canon action
# delivers belt and tree at one resolution (#165). This guard is a LOCAL
# control and must not be mistaken for a CI one.
#
# Silent in consumers, structurally: they carry no `mise/` directory at
# all, so the "a belt beside it" test skips them rather than exempting
# them. A consumer running a foreign belt is the design, not a defect.
#
# What it CANNOT see: which belt supplies the task BODIES is a second,
# independently resolved thing, and the two disagree in practice — same
# clone, `mise tasks info` naming the tree's own config while
# ORG_BELT_DIR named another checkout. A guard living in a task body
# cannot catch the case where the body itself came from the stale belt:
# a belt predating this task simply has no task to run. That gap closes
# once the machine belt carries this, and the failure text names the
# `mise tasks info` Source line so the other axis stays checkable by
# hand. Deterministic, no network — belongs in `ci`.
run = '''
if [[ ! -f mise/config.toml || ! -f mise/clippy.toml ]]; then
  echo "lint:belt-tree: no belt in this tree, skipped"
  exit 0
fi
# The remedy is literal text for a human to paste: $PWD must reach them
# unexpanded, so the single quotes are the point, not an oversight.
# shellcheck disable=SC2016
remedy='    MISE_GLOBAL_CONFIG_FILE="$PWD/mise/config.toml" mise run ci'
if [[ -z ${ORG_BELT_DIR:-} || ! -d ${ORG_BELT_DIR} ]]; then
  echo "lint:belt-tree: ORG_BELT_DIR is unset or names no directory —" >&2
  echo "  the belt cannot locate itself, so no delivered config any task" >&2
  echo "  reads is trustworthy. Re-run pinned to the tree under test:" >&2
  echo "${remedy}" >&2
  exit 1
fi
if command -v sha256sum > /dev/null 2>&1; then
  sha256=(sha256sum)
else
  sha256=(shasum -a 256)
fi
belt_digest() {
  (
    cd "$1" || exit 1
    # Names AND contents: hashing each file leaves its path in the
    # listing, so a renamed helper is a different belt. __pycache__ is
    # gitignored residue `mise run test` leaves behind, measured as the
    # ONLY difference between the belt on disk and the belt in git (39
    # files either way) — so excluding it compares tracked content
    # without needing git, which the delivered copy has not got.
    find . -type f ! -path './__pycache__/*' ! -name '*.pyc' -print0 \
      | LC_ALL=C sort -z \
      | xargs -0 "${sha256[@]}" \
      | "${sha256[@]}" \
      | cut -d ' ' -f 1
  )
}
tree_belt=$(belt_digest "${PWD}/mise")
run_belt=$(belt_digest "${ORG_BELT_DIR}")
if [[ ${tree_belt} == "${run_belt}" ]]; then
  echo "lint:belt-tree: the belt answering is this tree's belt"
  exit 0
fi
echo "lint:belt-tree: the belt answering this gate is NOT the belt in" >&2
echo "  this tree, so the gate is measuring a different revision of the" >&2
echo "  canon than the one you are changing (#867)." >&2
echo "    this tree's belt: ${PWD}/mise (${tree_belt:0:12})" >&2
echo "    belt answering:   ${ORG_BELT_DIR} (${run_belt:0:12})" >&2
echo "  Re-run pinned to the tree under test:" >&2
echo "${remedy}" >&2
echo "  Which belt supplies a task BODY is a separate resolution that can" >&2
echo "  disagree with this one — read the Source line of:" >&2
echo "    mise tasks info <task>" >&2
exit 1
'''

[tasks."lint:belt-shell"]
description = "Shell inside mise task `run` bodies is formatted and linted, this file included"
dir = "{{cwd}}"
# The third shell surface, and the one nothing reached (#619). `lint:shell`
# finds files through `shfmt --find` and a `run = '''…'''` string is not a
# file; `lint:shell-embedded` reads YAML `run:` blocks; `lint:toml` checks
# the syntax around the string and never looks inside it. So ~2900 lines of
# bash — every belt task in this file, including the ones that produce the
# release chain — were linted by nothing. Verified by planting
# `PROBE=$(echo probe); echo $PROBE; cd /tmp; rm -f $PROBE` in a task body:
# `mise run ci` stayed green, and the same line in a `.sh` file is ten
# findings. Six `# shellcheck disable=SC…` directives already sat in these
# bodies suppressing findings nothing produced — a maintainer expecting
# coverage that was not there. This is the #82 finding one layer in.
#
# The technique is `lint:shell-embedded`'s and the bar is `lint:shell`'s:
# extract each body, run the real tools, exclude nothing. Deterministic,
# offline, tracked files only — so it belongs in the gate.
#
# The glob is by NAME, covering every config file mise reads (`*` matches
# `/` in a pathspec, so one pattern reaches `mise.toml`, `.mise.toml`,
# `.config/mise.toml` and any depth of each). A file that merely ends in
# the name is read only if it declares `[tasks]`, and contributes nothing
# if it does not.
#
# Universal, not canon-only: a consumer's own `mise.toml` bodies are
# checked at its next pin bump, and a tree carrying no mise config skips
# clean by name.
run = '''
files=$(git ls-files ':!vendor/**' "*mise.toml" "*mise.*.toml" \
  "*mise/config.toml" "*mise/config.*.toml")
[[ -n ${files} ]] || {
  echo "lint:belt-shell: no mise config tracked, skipped"
  exit 0
}
# From the belt, like every other canon-owned input. The belt's config is
# also handed over as an ENV source rather than a target: a repo's task
# body reads ORG_BELT_DIR the way a workflow step reads its `env:`, and
# the name is declared there, not here. Nothing restates it.
helper="${ORG_BELT_DIR}/belt-shell.py"
# shellcheck disable=SC2086  # the file list is newline-separated on purpose
python3 "${helper}" --env-from "${ORG_BELT_DIR}/config.toml" \
  --source-path "${ORG_BELT_DIR}" ${files}
'''

[tasks."fix:shell"]
description = "Rewrite shell to canonical format (shfmt)"
dir = "{{cwd}}"
# The same list lint:shell computes, guarded the same way (#860). The
# second xargs was the defect and a Mac could not see it: on an empty
# list BSD xargs runs nothing and exits 0, GNU xargs runs `shfmt -w`
# with no arguments, which reads standard input and refuses — `-w cannot
# be used on standard input`, exit 1. So `mise run fix` was red on every
# Linux runner in any repository tracking no shell, and green for
# whoever wrote it. Measured on the #777 probe's first CI run (canon run
# 32680564529) and reproduced locally by invoking shfmt the way GNU
# xargs would.
run = '''
files=$(git ls-files ":!vendor/**" | xargs shfmt --find)
[[ -n ${files} ]] || {
  echo "fix:shell: no shell tracked, skipped"
  exit 0
}
xargs shfmt -i 2 -bn -ci -sr -s -w <<< "${files}"
'''

[tasks."fix:belt-shell"]
description = "Rewrite mise task `run` bodies to the org's shell format (shfmt)"
dir = "{{cwd}}"
# The write-mode sibling of lint:belt-shell (#619). Every rewritten body
# lands as a `'''` literal block: it needs no escaping, it survives a
# formatter adding lines, and it is the form the corpus already uses. The
# splice is never trusted on its own bookkeeping — the file is decoded
# again through the reader the lint half uses, and a body that did not
# land is named.
#
# A body carrying Tera statements (`{% raw %}`) round-trips: the markers
# are shell comments while the tools hold them and go back afterwards,
# and a mismatched count refuses the rewrite rather than guessing.
run = '''
files=$(git ls-files ':!vendor/**' "*mise.toml" "*mise.*.toml" \
  "*mise/config.toml" "*mise/config.*.toml")
[[ -n ${files} ]] || {
  echo "fix:belt-shell: no mise config tracked, nothing to fix"
  exit 0
}
helper="${ORG_BELT_DIR}/belt-shell.py"
# shellcheck disable=SC2086  # the file list is newline-separated on purpose
python3 "${helper}" --write ${files}
'''

[tasks."lint:commits"]
description = "Conventional-commit check for the branch (committed)"
dir = "{{cwd}}"
# Only meaningful on a branch with an origin/main to diverge from. The
# `[[ -f committed.toml ]]` half of this guard went with the file (#576):
# the rules are delivered now, so there is no longer a state in which a
# repo has commits to check and no config to check them against. It was
# a fail-open — a repo that never copied the file skipped the commit
# canon entirely and nothing said so.
# On pull_request events CI sits on GitHub's synthetic merge commit; the
# PR's real commits are its second parent.
run = '''
if git rev-parse --verify -q origin/main > /dev/null; then
  tip=HEAD
  parents=$(git rev-list --parents -n 1 HEAD | wc -w)
  if [[ ${parents} -gt 2 ]]; then tip="HEAD^2"; fi
  "${ORG_BELT_DIR}/committed.sh" "origin/main..${tip}"
else echo "lint:commits: no origin/main, skipped"; fi
'''

[tasks."commits:check"]
description = "Hold ONE commit message (ORG_COMMIT_MSG_FILE) to the commit canon"
dir = "{{cwd}}"
# Outside the lint: namespace on purpose — `ci` wildcard-collects lint:*,
# and this task is meaningless without a message to check. The
# coverage:check precedent: tasks the gate calls by name, never by
# wildcard.
#
# Two callers, both of which have a message and neither of which can
# reach the belt on its own: lefthook's commit-msg hook (the hook shell
# carries no ORG_BELT_DIR, so it must come through mise like every other
# hook job) and ci.yml's squash-subject step (which composes the subject
# the merge will mint). The path arrives in the environment rather than
# as an argument because mise APPENDS task arguments to the last command
# as text — $1 is never set inside a task body (measured on 2026.8.3).
run = '''
if [[ -z ${ORG_COMMIT_MSG_FILE:-} || ! -f ${ORG_COMMIT_MSG_FILE} ]]; then
  echo "commits:check: set ORG_COMMIT_MSG_FILE to a commit-message file" >&2
  exit 1
fi
"${ORG_BELT_DIR}/committed.sh" --commit-file "${ORG_COMMIT_MSG_FILE}"
'''

[tasks."lint:subject-budget"]
description = "Every declared dependency mints a commit subject that fits (#576)"
dir = "{{cwd}}"
# The inversion this task exists for: a permanent commit subject is
# minted from BOUNDED inputs, and the bound is checked when a human adds
# the input — not when a bot renders the output and no one is there to
# fix it. Renovate owns its pull request titles and regenerates them from
# a template, so a title that fails the gate is a merge nobody present
# can unblock (#574). By the time the bot runs, every title it could emit
# has already been proven to fit.
#
# Tracked files only, and it skips clean where it does not apply: a repo
# with no renovate.json has no machine minting subjects, and a repo that
# declares no dependencies has nothing to bound. That second branch is
# nearly unreachable and is not dead code: extending the org preset is
# itself a declared dependency through default.json's own customManager,
# so any repo that reaches this task at all counts at least one. The
# ceiling is read from the delivered committed.toml rather than restated
# — one definition of 72, which is what made the file's delivery the
# first step of #576.
run = 'git ls-files ":!vendor/**" | python3 "${ORG_BELT_DIR}/subject-budget.py"'

[tasks."lint:zizmor"]
description = "Security-audit GitHub Actions workflows (zizmor, pedantic)"
dir = "{{cwd}}"
# --offline: with a token present zizmor auto-enables online audits, whose
# results change with remote state — the gate checks the diff, not the
# internet. Pedantic, no severity floor: every actionable finding fails.
# The auditor persona (includes likely false positives) lives in
# audit:actions for human-run reviews, not the gate.
# Scope covers composite actions, not just workflows. zizmor audits
# `action.yml` files and flags unpinned `uses:` in them exactly as it does
# for workflows — it had simply never been pointed at them, so
# .github/actions/source-attest/action.yml carried a live third-party
# reference that no check in the org could see (#82).
run = '''
paths=""
compgen -G ".github/workflows/*.y*ml" > /dev/null && paths=".github/workflows/"
[[ -d .github/actions ]] && paths="${paths} .github/actions/"
[[ -n ${paths} ]] || {
  echo "lint:zizmor: no workflows or actions, skipped"
  exit 0
}
# shellcheck disable=SC2086  # the path list is newline-separated on purpose
zizmor --offline --persona=pedantic ${paths}
'''

[tasks."lint:dco"]
description = "Every commit carries a Developer Certificate of Origin sign-off"
dir = "{{cwd}}"
# OSPS-LE-01.01: contributors must assert legal authorisation for their
# contributions. `git commit -s` adds the trailer; the sign-off email must
# match the commit author, so a sign-off asserts something about the person
# who wrote the change rather than whoever happened to run git.
#
# Bots sign off too — the release commit and Renovate both add the trailer —
# so there is no exemption list to drift out of date.
run = '''
git rev-parse --verify -q origin/main > /dev/null || {
  echo "lint:dco: no origin/main, skipped"
  exit 0
}
tip=HEAD
parents=$(git rev-list --parents -n 1 HEAD | wc -w)
[[ ${parents} -gt 2 ]] && tip="HEAD^2"
range="origin/main..${tip}"
shas=$(git rev-list "${range}")
count=0
bad=""
while read -r sha; do
  [[ -n ${sha} ]] || continue
  count=$((count + 1))
  email=$(git log -1 --format=%ae "${sha}")
  # Fixed-string match on the address: a real email contains regex
  # metacharacters (the + in a GitHub noreply address is the common one),
  # and interpolating it into a pattern silently matches the wrong thing.
  git log -1 --format=%B "${sha}" | grep -i "^Signed-off-by:" \
    | grep -qF "<${email}>" \
    || bad="${bad} ${sha:0:8}"
done <<< "${shas}"
if [[ -n ${bad} ]]; then
  echo "lint:dco: commits missing a sign-off matching their author:${bad}" >&2
  echo "  fix with: git commit -s   (or: git rebase --signoff origin/main)" >&2
  exit 1
fi
echo "lint:dco: ${count} commits signed off"
'''

[tasks."lint:exec-bits"]
description = "Every tracked shell script is executable (exit-126 trap)"
dir = "{{cwd}}"
# Found by the v1.5.0 publish: fix:shell recreated collect-vex.sh
# without its mode, workflows exec release scripts by path, and the
# release died at run time with exit 126 — after the tag, which is
# immutable, so the version was burned. Nothing else checks a mode.
run = '''
files=$(git ls-files ':!vendor/**' "*.sh")
[[ -n ${files} ]] || {
  echo "lint:exec-bits: no shell scripts tracked, skipped"
  exit 0
}
bad=""
while IFS= read -r f; do
  [[ -n ${f} ]] || continue
  mode=$(git ls-files -s "${f}" | cut -d" " -f1)
  [[ ${mode} == "100755" ]] || bad="${bad} ${f}(${mode})"
done <<< "${files}"
if [[ -n ${bad} ]]; then
  echo "lint:exec-bits: tracked scripts missing the executable bit:${bad}" >&2
  echo "  workflows exec these by path; a lost mode is exit 126 after the tag" >&2
  echo "  fix with: chmod +x <file> && git add <file>" >&2
  exit 1
fi
count=$(wc -l <<< "${files}" | tr -d " ")
echo "lint:exec-bits: ${count} scripts executable"
'''

[tasks."lint:deny"]
description = "Dependency policy: bans + licenses + sources (cargo-deny, deterministic over the lock)"
dir = "{{cwd}}"
# No wait_for: the rustup concurrency race this chain once served
# (measured twice on the lab's v0.18.0 release PR) was task-time
# toolchain driving on a cold runner. The toolchain — components
# included — is now fully installed before any task runs (#117:
# coverage:check asserts llvm-tools as a declared build input instead of
# installing it), and cargo's own locking handles concurrent fetches.
# The gate half of the dependency track (docs/dependency-track.md).
# Deterministic: the outcome is a function of Cargo.lock + the committed
# deny.toml. `cargo fetch --locked` first — fetching pinned inputs is the
# same category as fetching the toolchain. Advisories are deliberately
# NOT here: RustSec is a moving feed, so they live in audit:deny.
run = '''
locks=$(git ls-files ':!vendor/**' "Cargo.lock" "*/Cargo.lock")
[[ -n ${locks} ]] || {
  echo "lint:deny: no Cargo.lock tracked, skipped"
  exit 0
}
# A repo with a lock has rust pinned as a build input; cargo absent is a
# broken toolchain, and skipping would be the vacuous-success failure.
command -v cargo > /dev/null || {
  echo "lint:deny: Cargo.lock present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
[[ -f deny.toml ]] || {
  echo "lint:deny: Cargo.lock present but no deny.toml — copy scaffold/deny.toml from the canon" >&2
  exit 1
}
cargo fetch --locked
cargo deny check bans licenses sources
# An exception that outlives its cause is the failure `#[expect]` was
# chosen to prevent everywhere else, and cargo-deny does not have that
# property: a `skip`/`skip-tree` entry matching nothing is silent
# (measured). So necessity is tested rather than assumed — each declared
# skip is removed in turn and the check re-run. A variant that still
# passes proves its entry does nothing, and the gate names it. The
# helper resolves from the belt, which is where the org's policy lives;
# a repo running without the canon cannot quietly skip this.
helper="${ORG_BELT_DIR}/deny-skips.py"
variants=$(python3 "${helper}" deny.toml)
stale=""
while IFS=$'\t' read -r name variant; do
  [[ -n ${name} ]] || continue
  if cargo deny --config "${variant}" check bans > /dev/null 2>&1; then
    stale="${stale} ${name}"
  fi
done <<< "${variants}"
if [[ -n ${stale} ]]; then
  echo "lint:deny: duplicate-version skip no longer needed:${stale}" >&2
  echo "  the check passes without it, so the upstream lag it was written for is over" >&2
  echo "  delete the entry from deny.toml — an exception that outlives its cause is not a decision" >&2
  exit 1
fi
'''

[tasks."audit:deny"]
description = "Dependency advisories (cargo-deny + RustSec — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: a new advisory fails unrelated work, which is a
# property of the feed, not the diff. Every `ignore` in deny.toml carries
# a reason and cites the VEX statement recording the decision — the L2
# exit is a written decision, never an override.
run = '''
locks=$(git ls-files ':!vendor/**' "Cargo.lock" "*/Cargo.lock")
[[ -n ${locks} ]] || {
  echo "audit:deny: no Cargo.lock tracked, skipped"
  exit 0
}
command -v cargo > /dev/null || {
  echo "audit:deny: Cargo.lock present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
[[ -f deny.toml ]] || {
  echo "audit:deny: Cargo.lock present but no deny.toml — copy scaffold/deny.toml from the canon" >&2
  exit 1
}
cargo fetch --locked
cargo deny check advisories
'''

[tasks."lint:rust"]
description = "Rust lint + format check (clippy at every group, restriction minus named contradictions; rustfmt at its stable maximum)"
dir = "{{cwd}}"
# The Rust half of the language layer (#445). clippy compiles PACKAGES
# through cargo, not a file list, so `git ls-files` cannot feed it — the
# lint:go situation exactly, and safe for the same reason: an untracked
# .rs file inside a tracked crate is a build input rustc would also see.
#
# LEVELS ARE STATED AS GROUPS MINUS NAMED EXCLUSIONS, never as a list of
# lints to enable. The two forms measure identically today (97 findings
# on release-lab either way) and fail in opposite directions. An enable
# list is fail-OPEN: the restriction group grew by N lints in the last
# toolchain bump, none of them are in our list, and enforcement quietly
# fails to grow. The exclusion form is fail-CLOSED: a new lint arrives
# already enforced with no canon edit, and if one of the excluded names
# is ever renamed away the exclusion stops applying, the contradiction
# fires, and the gate goes red where someone will read it.
#
# THE EXCLUSIONS ARE MECHANICAL CONTRADICTIONS, not taste. No count is
# spelled here, and none should be: the run counts the flags it applied
# and prints that. Written by hand this line and the one it prints
# disagreed, in the same task body, from the day #687 added an exclusion
# until #752. clippy's
# own book says the restriction group must not be enabled wholesale
# because its lints contradict each other; these are the pairs where
# obeying one lint is disobeying another, each ruled toward the
# idiomatic form (docs/tooling-verdicts.md carries the full reasoning):
#   implicit_return          — contradicts style's needless_return
#   question_mark_used       — contradicts style's question_mark
#   self_named_module_files  — pairs with mod_module_files; the org
#                              enforces self-named layout, the 2018 idiom
#   pub_with_shorthand       — the name is inverted: this lint BANS
#                              `pub(crate)`. The org keeps the shorthand,
#                              so pub_without_shorthand is the one on
#   semicolon_outside_block  — pairs with semicolon_inside_block
#   separated_literal_suffix — the org writes 1_u32, so the lint that
#                              bans it is off and unseparated_* is on
#   big_endian_bytes,        — all three on bans every byte conversion;
#   little_endian_bytes        the org bans only target-dependent
#                              _ne_bytes, because explicit endianness is
#                              what reproducibility requires
#   inline_asm_x86_intel_syntax — Rust's own asm! default is Intel
#   arbitrary_source_item_ordering — demands alphabetical source
#                              items. The org has already decided
#                              this question twice the other way, in
#                              rustfmt.toml (reorder_keys off,
#                              "alphabetical reordering destroys
#                              semantic grouping") and yamllint.yaml
#                              (key-ordering off, same reason). A
#                              lint contradicting two standing org
#                              rulings is a contradiction like the
#                              rest of this list, not a taste call
#                              (#687; on edtf 113 of 955, measured
#                              by lint:rust at belt 1818749 — a count
#                              from this ladder means nothing without
#                              the belt SHA that produced it)
#
# blanket_clippy_restriction_lints fires because we enable the group on
# purpose; allowed with that as its reason. multiple_crate_versions is
# allowed because the duplicate policy is stated once, in the repo's
# deny.toml at `multiple-versions = "deny"` — this file is org-wide, so
# an exception here would exempt every repo (docs/dependency-track.md).
#
# `-D warnings` also denies rustc's own warn-by-default lints, which is
# the point: it is what makes the org answer `warnings_strict` truthfully
# (docs/best-practices.md). It rides `--` rather than RUSTFLAGS, which
# the clippy book's CI page suggests, because `--` args reach only
# workspace members through RUSTC_WORKSPACE_WRAPPER — RUSTFLAGS would
# apply to every dependency and invalidate the whole build cache.
#
# Deterministic: the outcome is a function of the tree, the lock and the
# pinned toolchain. `cargo fetch --locked` first, the lint:deny
# precedent — fetching pinned inputs is the same category as fetching the
# toolchain.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n ${manifests} ]] || {
  echo "lint:rust: no Cargo.toml tracked, skipped"
  exit 0
}
# A repo with a Cargo.toml has rust pinned as a build input; cargo absent
# is a broken toolchain, and skipping would be the vacuous-success
# failure.
command -v cargo > /dev/null || {
  echo "lint:rust: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
# clippy is a rustup COMPONENT of the repo's own pin, not a belt binary.
# mise installs rust through rustup and inherits whatever profile the
# machine already has, so on a minimal profile clippy is simply absent
# and this task would lint nothing. Asserted with a remedy, never
# installed: a task-time rustup races every other task driving the
# toolchain (measured twice on the lab's v0.18.0 release PR, #117).
if ! rustup component list --installed 2> /dev/null | grep -q "^clippy"; then
  echo "lint:rust: clippy component missing — declare it with the rust pin in mise.toml:" >&2
  echo '  rust = { version = "1.xx.x", components = "clippy,rustfmt,llvm-tools" }' >&2
  echo "  (installed with the toolchain, before tasks run — never mid-run)" >&2
  exit 1
fi
# The knobs are org policy, so a repo-local clippy.toml is a silent
# lowering of them — the unexplained .gitleaks.toml ruling.
#
# ONE TREE TRACKS THESE NAMES LEGITIMATELY. The belt delivers
# mise/clippy.toml and mise/rustfmt.toml, and `*/clippy.toml` matches
# them, so on the canon this refusal names the canon's own delivered
# configs and tells the maintainer to delete the files the belt runs on
# (#746). Latent only because the task skips a repo with no tracked
# Cargo.toml and the canon tracks none; the same collision fired the day
# taplo's refusal ran here, which is how #691 found it.
#
# #691's way out was a rename — taplo-org.toml, biome-org.json — and for
# clippy it does not exist. CLIPPY_CONF_DIR names a DIRECTORY, and
# clippy reads `clippy.toml` or `.clippy.toml` inside it and nothing
# else. Measured, both ways: the same file under a -org name is not an
# error, it is SILENCE — clippy lints on at its own defaults, exit 0,
# every org knob gone and the gate green. A rename here would not fail
# to deliver loudly; it would deliver nothing quietly. Renaming rustfmt
# alone would then put the two Rust configs on two different roads to
# buy nothing.
#
# So the exclusion is by IDENTITY, not by path: only a tree that tracks
# the canon's own identity declaration (#579) may hold these two exact
# paths, and a consumer that tracks its own mise/clippy.toml is refused
# exactly as before — no shadow config hides behind the belt's layout.
# This is not #691's rejected ORG_BELT_DIR comparison, which assumed the
# belt directory and the working tree name one checkout and went false-
# negative on a second clone; an identity file assumes nothing about
# where the belt came from.
conf_spec=("clippy.toml" ".clippy.toml" "*/clippy.toml" "*/.clippy.toml"
  "rustfmt.toml" ".rustfmt.toml" "*/rustfmt.toml" "*/.rustfmt.toml")
if git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1; then
  conf_spec+=(":!mise/clippy.toml" ":!mise/rustfmt.toml")
fi
local_conf=$(git ls-files "${conf_spec[@]}")
if [[ -n ${local_conf} ]]; then
  echo "lint:rust: repo-local Rust tool configuration is not the org's:${local_conf}" >&2
  echo "  the knobs live in the canon's mise/clippy.toml and mise/rustfmt.toml," >&2
  echo "  delivered through CLIPPY_CONF_DIR and rustfmt's --config-path" >&2
  echo "  a setting this repo genuinely needs is argued into the canon, not kept locally" >&2
  exit 1
fi
# Locate the canon's clippy.toml. CI sets MISE_GLOBAL_CONFIG_FILE to it;
# locally the belt arrives as a ~/.config/mise/conf.d symlink into a
# canon checkout. No mise template variable resolves the config file's
# own directory ({{config_root}} is the home directory for a global
# config), so both carriers are read here — and an unresolvable belt is
# fatal, because clippy would otherwise silently run at its own defaults.
export CLIPPY_CONF_DIR="${ORG_BELT_DIR}"
out=""
fmt_out=""
trap 'rm -f "${out}" "${fmt_out}"' EXIT
# The rustfmt leg, first because it is seconds against clippy's minutes.
# rustfmt is a rustup component of the repo's own pin exactly like clippy,
# asserted with a remedy and never installed.
if ! rustup component list --installed 2> /dev/null | grep -q "^rustfmt"; then
  echo "lint:rust: rustfmt component missing — declare it with the rust pin in mise.toml:" >&2
  echo '  rust = { version = "1.xx.x", components = "clippy,rustfmt,llvm-tools" }' >&2
  exit 1
fi
# Formatting suppression, held to the same standard as clippy's — except
# that rustfmt's attribute takes no reason and has no `#[expect]`
# analogue, so it can never retire itself. A whole-file `#![rustfmt::skip]`
# is refused outright, and a narrow one states why in the marker-comment
# idiom `lint:capability-boundary` already uses.
rs=$(git ls-files ':!vendor/**' "*.rs")
skips=""
while IFS= read -r f; do
  [[ -n ${f} ]] || continue
  if grep -qE '^[[:space:]]*#!\[rustfmt::skip' "${f}"; then
    skips="${skips} ${f}(whole-file)"
    continue
  fi
  if grep -qE '^[[:space:]]*#\[rustfmt::skip' "${f}" && ! grep -q "rustfmt-skip:" "${f}"; then
    skips="${skips} ${f}(no marker)"
  fi
done <<< "${rs}"
if [[ -n ${skips} ]]; then
  echo "lint:rust: formatting suppressed without a written decision:${skips}" >&2
  echo "  #![rustfmt::skip] exempts an entire file — never allowed" >&2
  echo "  #[rustfmt::skip] must carry a '// rustfmt-skip: <why>' marker above it" >&2
  echo "  rustfmt has no #[expect] analogue, so the comment is the only thing a reviewer sees" >&2
  exit 1
fi
# `cargo fmt` rather than a tracked-file list — the lint:go deviation with
# the argument running the other way. rustfmt walks each target's module
# tree, so a .rs file no crate references is never visited; but a file no
# crate references is not a build input either, and rustc cannot see it
# any more than rustfmt can. Feeding `git ls-files` would also mean
# choosing an edition here, when Cargo.toml states it per crate and
# `cargo fmt` reads it from there.
fmt_out=$(mktemp)
fmt_status=0
cargo fmt --all --check -- --config-path "${ORG_BELT_DIR}/rustfmt.toml" > "${fmt_out}" 2>&1 || fmt_status=$?
# Both of rustfmt's config failure modes are WARNINGS that exit 0
# (measured): an unknown key, and a nightly-only option on a stable
# toolchain. Either formats to a weaker standard behind a green gate, so
# the warnings are the check and the exit code is only half of it.
if grep -q "^Warning" "${fmt_out}"; then
  cat "${fmt_out}" >&2
  echo "lint:rust: rustfmt warned — an ignored option means a weaker format, silently" >&2
  exit 1
fi
if [[ ${fmt_status} -ne 0 ]]; then
  cat "${fmt_out}" >&2
  echo "lint:rust: formatting differs from the org's — run 'mise run fix:rust'" >&2
  exit 1
fi
echo "lint:rust: formatting clean"
# The one suppression clippy itself cannot forbid: a crate-level allow of
# a whole group silences every flag above and exits 0 (measured — even
# `-F` only warns about it). A narrow, reasoned
# `#[expect(clippy::x, reason = "...")]` is the exception mechanism, and
# restriction's allow_attributes + allow_attributes_without_reason —
# both enabled by the group — make it the ONLY one that compiles.
groups="all|pedantic|nursery|cargo|restriction|style|complexity|perf|correctness|suspicious"
blanket=""
while IFS= read -r f; do
  [[ -n ${f} ]] || continue
  if grep -qE "^[[:space:]]*#!\\[(allow|expect)\\([^]]*clippy::(${groups})\\b" "${f}"; then
    blanket="${blanket} ${f}"
  fi
done <<< "${rs}"
if [[ -n ${blanket} ]]; then
  echo "lint:rust: crate-level suppression of a whole clippy group:${blanket}" >&2
  echo "  a group allow silences every level this task sets and the gate still goes green" >&2
  echo "  suppress one lint at the narrowest scope instead, with a reason:" >&2
  echo '    #[expect(clippy::the_lint, reason = "why this code is right as written")]' >&2
  echo "  an expect fails once it stops being needed; an allow rots silently" >&2
  exit 1
fi
# Members that cannot build on a gate runner are declared, never implied:
# reading `default-members` instead would let a repo drop a crate from
# linting by editing an unrelated field. CLIPPY_EXCLUDE is the
# COVERAGE_EXCLUDE pattern ([env] in the repo's mise.toml), written down
# where a reviewer sees it.
#
# CLIPPY_FEATURES lets a repo whose features are mutually exclusive say
# so; everything else gets --all-features, because an unlinted feature is
# unlinted code.
features="${CLIPPY_FEATURES:---all-features}"
# THE LADDER LIVES IN THE BELT'S clippy-ladder.sh, not here (#813). It
# moved the day a SECOND task acquired the same obligation:
# `lint:pg-clippy` sets this exact level on the pgrx crate the gate never
# compiled, and a second copy of a ten-name list is the drift #752
# recorded — the list said ten and the prose above it said nine.
#
# Sourcing it also retires #846's hand-rolled counter. That counter
# existed because bash's array-length syntax — dollar, brace, hash — is
# also how a Tera comment OPENS, and mise renders every task body through
# Tera before bash sees it, so a body using it dies at render time and
# never runs. A .sh file is not a task body and is not rendered, so the
# count is read off the list itself where it belongs.
. "${ORG_BELT_DIR}/clippy-ladder.sh"
ladder=$(org_clippy_ladder)
contradiction_count=$(org_clippy_contradiction_count)
# THE WHOLE WORKSPACE IS LINTED EVERY RUN, one `-p` pass per crate
# (#726). Under `-D warnings` a finding IS a compile error, so a red
# crate emits no metadata and every crate that depends on it is never
# linted at all — and the number this task prints then reads as a
# workspace total when it is one crate's. Measured on both Rust imports:
# clearing the last `iiif-core` finding moved iiif-server's count 24 ->
# 319, because the S3 backend behind it had never once been linted
# (#671); on edtf every total ever recorded — 896, 955, ~840 — was
# `edtf-core` alone with four crates unseen (#669).
#
# `--keep-going` is the flag cargo offers for this and it is NOT enough.
# The Cargo Book defines it as "Build as many crates in the dependency
# graph as possible, rather than aborting the build on the first one that
# fails to build": SIBLINGS, never a DEPENDENT, which has nothing to
# compile against. Measured at -j1 on a two-crate fixture carrying the
# flags below — independent crates, the plain run reported 1 of 2 and
# --keep-going reported 2 of 2; b depending on a, BOTH runs reported a
# alone. It is kept, per pass, because inside one pass it is what makes a
# red lib still report its own test target (measured at -j1: one unit
# without it, two with).
#
# `--no-deps` is what makes a per-crate pass work at all. The clippy
# book's Workspaces section: a `-p` run "includes dependencies that are
# members of the workspace, like path dependencies" — so without it the
# red dependency fails the pass before its dependent is ever reached.
# With it, a member compiled as somebody else's dependency runs as plain
# rustc and only the primary package is linted. Every member is still
# primary in exactly one pass, so coverage equals the old single pass
# when nothing is red and is strictly larger when something is: this is
# a truncation removed, not a level lowered.
#
# NOT fail-open through the build cache, measured in both orders: a pass
# that compiled a member as an unlinted dependency does not stop that
# member's own pass reporting it red, and re-running a pass replays the
# failure rather than serving a green cache.
cargo fetch --locked
# THE POPULATION COMES FROM THE BELT'S ONE DERIVATION (#813), not from a
# jq expression here and three more elsewhere. gate-surface.py reads
# cargo's own account — `workspace_members`, not
# `workspace_default_members` — and classifies each member, so this task,
# `lint:pg-clippy`, `test:pgrx` and `lint:msrv` cannot disagree about
# which crates exist or what kind each one is.
#
# A pgrx extension is SKIPPED HERE and linted by `lint:pg-clippy` at the
# same level: its pgNN features are mutually exclusive, so `--all-features`
# is a hard error on it, and the old answer was a repo naming it in
# CLIPPY_EXCLUDE — which is how a published crate went forty releases
# without being compiled at all. Derived, never declared: the repo says
# nothing and cannot get it wrong.
surface=$(cargo metadata --no-deps --format-version 1 --locked \
  | python3 "${ORG_BELT_DIR}/gate-surface.py" --exclude "${CLIPPY_EXCLUDE:-}")
[[ -n ${surface} ]] || {
  echo "lint:rust: a Cargo.toml is tracked but cargo metadata names no workspace member" >&2
  exit 1
}
out=$(mktemp)
status=0
count=0
linted=""
red=""
excluded=""
extensions=""
while IFS=$'\t' read -r record spec kind _majors _dir; do
  [[ -n ${spec} ]] || continue
  name="${spec%@*}"
  if [[ ${record} == excluded ]]; then
    excluded="${excluded} ${name}"
    continue
  fi
  if [[ ${kind} == pgrx ]]; then
    extensions="${extensions} ${name}"
    continue
  fi
  count=$((count + 1))
  linted="${linted} ${name}"
  pass=0
  # shellcheck disable=SC2086  # ${features} and ${ladder} hold whole flag
  # WORDS, which cargo and clippy must receive as separate arguments
  cargo clippy -p "${spec}" --no-deps --all-targets ${features} --locked --keep-going -- \
    ${ladder} 2>&1 | tee -a "${out}" || pass=$?
  if [[ ${pass} -ne 0 ]]; then
    red="${red} ${name}"
    status=${pass}
  fi
done <<< "${surface}"
# A bare `--features NAME` means different things to the two shapes:
# cargo accepts a name held by ANY member when one pass covers the
# workspace, and rejects it for a member that lacks it when each crate
# gets its own pass (measured, both). No repo in the org sets
# CLIPPY_FEATURES today, so this is a signpost and not a migration.
if grep -q "does not contain this feature" "${out}"; then
  echo "lint:rust: CLIPPY_FEATURES names a feature some crate in this workspace lacks" >&2
  echo "  every crate is linted as its own package (#726), so the value has to be one" >&2
  echo "  each member accepts — --all-features, or --no-default-features — and a crate" >&2
  echo "  that genuinely cannot take it is named in CLIPPY_EXCLUDE instead" >&2
  exit 1
fi
# A lint name rustc does not recognise is warning E0602, and `-D
# warnings` cannot reach it: it is emitted by the command-line parser
# before lint levels apply, so `-D unknown_lints` and `-D
# renamed_and_removed_lints` both still exit 0 (measured). With levels
# stated as exclusions a stale name fails closed anyway — the lint it
# excluded starts firing — but the run must say WHY rather than leave a
# maintainer reading a contradiction that looks like a false positive.
if grep -qE "E0602|has been renamed to" "${out}"; then
  echo "lint:rust: a lint name above is unknown to this toolchain (see E0602/renamed above)" >&2
  echo "  clippy renamed or removed it — update the exclusion list in mise/config.toml" >&2
  exit 1
fi
# The population, printed before the verdict and in BOTH directions, so
# that no run of this task can read as a whole workspace when it was not
# one (#726).
echo "lint:rust: ${count} crate(s) linted:${linted}"
[[ -z ${extensions} ]] || echo "lint:rust: pgrx extension(s), linted by lint:pg-clippy:${extensions}"
[[ -z ${excluded} ]] || echo "lint:rust: excluded by CLIPPY_EXCLUDE:${excluded}"
if [[ -n ${red} ]]; then
  echo "lint:rust: red:${red}" >&2
  exit "${status}"
fi
echo "lint:rust: clean at every group (restriction minus ${contradiction_count} named contradictions)"
'''

[tasks."fix:rust"]
description = "Apply clippy's machine-applicable suggestions (write mode, never in the gate)"
dir = "{{cwd}}"
# The write-mode sibling. `cargo clippy --fix` implies --no-deps and
# --all-targets. Only a subset of lints is machine-applicable; the rest
# are the author's judgement, which is why this is a sibling and not a
# gate.
#
# `cargo fix` also refuses to run against uncommitted work, and this task
# used to leave that refusal in place on the reasoning that "a dirty tree
# is the caller's to resolve" (#892). No caller could: the dirt is this
# task's OWN. `cargo fmt` runs six lines below, before clippy, so every
# repository whose Rust is not already canonical at the belt's
# rustfmt.toml handed cargo a tree the task had dirtied one step earlier
# — and `mise run fix`'s other fixers dirtied it again from the side.
# Measured 2026-08-24 on a pristine clone of iiif-server with no other
# fixer run: `fix:rust: formatted`, then the refusal naming the seven
# .rs files cargo fmt had just written, exit 101, 3/3. The clippy leg had
# therefore never run in such a repository at all.
#
# --allow-dirty is the answer rather than an ordering change, because
# there is no order that helps: the formatter must run first (see below)
# and its output is the dirt. What the refusal protects against is
# supplied here by the same thing that supplies it for the other fourteen
# fixers, none of which asks for a clean tree — a fixer runs on a branch
# and its diff reaches a gate. One flag and not two: measured on cargo
# 1.97.1, --allow-dirty admits STAGED changes as well as unstaged, so
# --allow-staged would add nothing (`git add -p` then `mise run fix` is
# the case that would otherwise still red).
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n ${manifests} ]] || {
  echo "fix:rust: no Cargo.toml tracked, skipped"
  exit 0
}
command -v cargo > /dev/null || {
  echo "fix:rust: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
if ! rustup component list --installed 2> /dev/null | grep -q "^clippy"; then
  echo "fix:rust: clippy component missing — declare it with the rust pin in mise.toml" >&2
  exit 1
fi
export CLIPPY_CONF_DIR="${ORG_BELT_DIR}"
if ! rustup component list --installed 2> /dev/null | grep -q "^rustfmt"; then
  echo "fix:rust: rustfmt component missing — declare it with the rust pin in mise.toml" >&2
  exit 1
fi
# Format first: clippy --fix rewrites source, and handing it canonically
# formatted input keeps its edits from arriving pre-mangled.
cargo fmt --all -- --config-path "${ORG_BELT_DIR}/rustfmt.toml"
echo "fix:rust: formatted"
features="${CLIPPY_FEATURES:---all-features}"
# The POPULATION is declared here too (#726). `cargo clippy --fix`
# without `--workspace` selects the workspace's DEFAULT members, so a
# repo could drop a crate from the write-mode twin by editing a field
# nobody reads as a lint setting — measured on a two-crate fixture with
# `default-members = ["a"]`: `--fix` rewrote a/src/lib.rs and never
# touched b/src/lib.rs, and `--fix --workspace` rewrote both.
# CLIPPY_EXCLUDE applies for the reason it applies to the gate leg — a
# crate that cannot build on a runner cannot be fixed on one either
# (measured: `--exclude` is accepted under `--fix`).
#
# What this leg does NOT need is the gate leg's per-crate iteration.
# `cargo fix` caps lint denials to warnings and says so in its own note,
# "the `clippy::<lint>` lint ignores `-D warnings`", so a red crate never
# stops the crates behind it: measured on the same fixture with b
# depending on a and both red, ONE `--fix` pass rewrote both and exited
# 0. The defect #726 names is the gate leg's, and the mirror this leg
# owes it is the population, not the mechanism.
. "${ORG_BELT_DIR}/clippy-ladder.sh"
ladder=$(org_clippy_ladder)
cargo fetch --locked
# Same derivation as the gate leg, for the same reason: this leg's mirror
# of #726 is the POPULATION, and a population computed twice is two
# populations (#813).
surface=$(cargo metadata --no-deps --format-version 1 --locked \
  | python3 "${ORG_BELT_DIR}/gate-surface.py" --exclude "${CLIPPY_EXCLUDE:-}")
excludes=""
fixing=""
excluded=""
extensions=""
ext_majors=""
while IFS=$'\t' read -r record spec kind majors _dir; do
  [[ -n ${spec} ]] || continue
  name="${spec%@*}"
  if [[ ${record} == excluded ]]; then
    excludes="${excludes} --exclude ${name}"
    excluded="${excluded} ${name}"
  elif [[ ${kind} == pgrx ]]; then
    # Held out of the workspace pass and fixed in its own below: its pgNN
    # features contradict each other, so --all-features cannot compile it.
    excludes="${excludes} --exclude ${name}"
    extensions="${extensions} ${name}"
    ext_majors="${majors}"
  else
    fixing="${fixing} ${name}"
  fi
done <<< "${surface}"
# shellcheck disable=SC2086  # all three hold whole flag words, which
# cargo and clippy must receive as separate arguments
cargo clippy --fix --allow-dirty --workspace ${excludes} ${features} --locked -- ${ladder}
echo "fix:rust:${fixing:- none} rewritten where clippy could"
# The extension pass. Without it `mise run fix` could not touch a crate
# the gate now lints, which is the asymmetry #691 named wearing a new
# hat: a finding a developer cannot ask the machine to fix is a finding
# they will fix by hand or not at all.
if [[ -n ${extensions} ]]; then
  . "${ORG_BELT_DIR}/pgrx-env.sh"
  org_pgrx_darwin_flags
  mise ls "aqua:theseus-rs/postgresql-binaries" --json \
    | python3 "${ORG_BELT_DIR}/pgrx-postgres.py" --majors "${ext_majors}" \
    | org_pgrx_init
  for name in ${extensions}; do
    # shellcheck disable=SC2086  # ${ladder} holds whole flag words
    # --allow-dirty for the reason the workspace pass carries it, and
    # doubly so here: the workspace pass ran first and wrote.
    cargo clippy --fix --allow-dirty -p "${name}" --no-deps --all-targets \
      --locked --no-default-features --features "pg${ext_majors##*,}" \
      -- ${ladder}
  done
  echo "fix:rust: pgrx extension(s) fixed at pg${ext_majors##*,}:${extensions}"
fi
[[ -z ${excluded} ]] || echo "fix:rust: excluded by CLIPPY_EXCLUDE:${excluded}"
echo "fix:rust: applied what is machine-applicable — the rest is judgement"
'''

[tasks."lint:msrv"]
description = "Every declared rust-version is compiled at a pinned toolchain of exactly that version"
dir = "{{cwd}}"
# The promise nobody was keeping (#820). `rust-version` is not a comment:
# cargo refuses to resolve the package for a downstream user on an older
# toolchain, so the declared minimum is a public API of the crate and
# raising the real one is a silent breaking change. edtf carried an
# `msrv:` job as a REQUIRED status check before its import; it vanished
# on conformance and nobody ruled that it should, which is the same
# class as #813 — a check that stopped existing rather than one that
# went red.
#
# NOT `cargo msrv verify`, which is the tool built for this and is the
# wrong tool here: it resolves the declared toolchain through rustup at
# run time, and the gate's one hard law is that nothing network-dependent
# belongs in `ci`. So the repository PINS its MSRV toolchain like every
# other input — a second entry in `rust`, carried by mise.lock with
# per-platform checksums and provenance — and this compiles at it. The
# cost is that the version is now a fact in two files, and the answer to
# a shared fact in this org is an agreement check, not a convention:
# msrv-plan.py reads the promise from cargo's own metadata and reds when
# nothing pins exactly that version, naming both files. Cargo.toml stays
# the source; the pin is only ever the thing checked against it. What
# that prevents is not "no check" — it is a GREEN check at the wrong
# version, which is what bumping the pin alone would otherwise buy.
#
# Measured while building this, and the reason the comparison is
# zero-padded rather than textual: edtf declares `rust-version = "1.82"`
# and mise publishes rust `1.82.0` with no bare `1.82`, so the org's
# declared form and the org's pinnable form differ by exactly one
# component. Also measured, and the reason `+toolchain` works at all
# here: mise's rust backend installs THROUGH rustup — `mise install
# rust@1.82.0` puts `1.82.0-<host>` in ~/.rustup/toolchains and
# `RUSTUP_TOOLCHAIN=1.82.0 rustc --version` reports 1.82.0 — so the
# second pin is reachable by name, the audit:fuzz precedent for the
# dated nightly.
#
# THE COMPILE SURFACE IS THE GATE'S, and it is stated once: CLIPPY_EXCLUDE
# and CLIPPY_FEATURES are read here rather than given MSRV-flavoured
# twins, so a repo declares what the gate can compile in ONE place and
# this check moves with it. The names say clippy and the meaning is
# wider — a wart worth keeping, because the alternative is a second list
# that drifts. A member excluded there while declaring a minimum is
# UNVERIFIED, and msrv-plan.py prints it as such on every run instead of
# leaving the hole silent; #813 is what removes the exclusion, and this
# check widens with it needing no edit.
#
# No `--all-targets`: dev-dependencies are not part of the promise. A
# consumer building this crate compiles its lib and bins, never its test
# harness, so a proptest or criterion that needs a newer rustc than the
# crate does is not a broken promise and must not red the gate.
#
# Deterministic in the same sense lint:rust is: the outcome is a function
# of the tree, the lock and two pinned toolchains. `cargo fetch --locked`
# first, same precedent.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n ${manifests} ]] || {
  echo "lint:msrv: no Cargo.toml tracked, skipped"
  exit 0
}
# A repo with a Cargo.toml has rust pinned as a build input; cargo absent
# is a broken toolchain, and skipping would be the vacuous-success
# failure.
command -v cargo > /dev/null || {
  echo "lint:msrv: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
# The pins this reads are mise's own account of them, so mise itself is
# an input. It is always present inside a mise task; asserted anyway,
# because the alternative to a red here is a check that silently sees no
# pins and calls a repo unpinned.
command -v mise > /dev/null || {
  echo "lint:msrv: mise missing — the toolchain pins this reads are mise's" >&2
  exit 1
}
tmp=$(mktemp -d)
trap 'rm -rf "${tmp}"' EXIT
cargo fetch --locked
mise ls rust --json > "${tmp}/toolchains.json"
cargo metadata --no-deps --format-version 1 --locked > "${tmp}/metadata.json"
# The belt's one derivation says which members are pgrx extensions and at
# which majors (#813); a pgrx crate cannot be compiled with
# --all-features, so its own flags ride the plan rather than this task
# guessing. `${major##*,}` is the highest declared, the same choice
# lint:pg-clippy makes and for the same reason.
pgrx=""
extensions=""
# Assigned before the loop reads it, never spliced in as `<<< "$(...)"`:
# a command substitution's failure is discarded, so a red derivation
# would arrive as an EMPTY here-string and this task would report having
# verified a workspace it never saw (SC2312, and the fail-open shape the
# gate exists to refuse).
surface=$(python3 "${ORG_BELT_DIR}/gate-surface.py" \
  --exclude "${CLIPPY_EXCLUDE:-}" < "${tmp}/metadata.json")
while IFS=$'\t' read -r record spec kind majors _dir; do
  [[ ${record} == crate && ${kind} == pgrx ]] || continue
  extensions="${extensions} ${spec%@*}"
  pgrx="${pgrx}${pgrx:+,}${spec%@*}:${majors##*,}"
done <<< "${surface}"
plan=$(python3 "${ORG_BELT_DIR}/msrv-plan.py" \
  --toolchains "${tmp}/toolchains.json" --exclude "${CLIPPY_EXCLUDE:-}" \
  --pgrx "${pgrx}" < "${tmp}/metadata.json")
[[ -n ${plan} ]] || {
  echo "lint:msrv: no crate declares rust-version, skipped"
  exit 0
}
# A pgrx crate needs a Postgres before it can be compiled at all, at the
# MSRV exactly as at the stable pin. Provisioned only when one is in the
# plan, so a repo without an extension pays nothing.
if [[ -n ${extensions} && ${plan} == *"--features pg"* ]]; then
  . "${ORG_BELT_DIR}/pgrx-env.sh"
  org_pgrx_darwin_flags
  majors="${pgrx##*:}"
  mise ls "aqua:theseus-rs/postgresql-binaries" --json \
    | python3 "${ORG_BELT_DIR}/pgrx-postgres.py" --majors "${majors}" \
    | org_pgrx_init > /dev/null
fi
features="${CLIPPY_FEATURES:---all-features}"
checked=0
while IFS=$'\t' read -r kind first own rest; do
  [[ -n ${kind} ]] || continue
  case ${kind} in
    note)
      echo "lint:msrv: ${first}"
      ;;
    check)
      checked=$((checked + 1))
      flags=""
      for spec in ${rest}; do
        flags="${flags} -p ${spec}"
      done
      # A crate with feature flags of its own gets them INSTEAD of the
      # workspace default, never as well: they contradict each other.
      # `default` rather than an empty field, because bash collapses a
      # run of tabs and an empty field would shift the specs into it.
      use="${features}"
      [[ ${own} == "default" ]] || use="${own}"
      echo "lint:msrv: compiling at ${first}: ${rest}"
      # shellcheck disable=SC2086  # ${use} and ${flags} hold whole flag
      # WORDS, which cargo must receive as separate arguments
      RUSTUP_TOOLCHAIN="${first}" cargo check --locked ${use} ${flags}
      ;;
    *)
      echo "lint:msrv: unreadable plan record from msrv-plan.py: ${kind}" >&2
      exit 1
      ;;
  esac
done <<< "${plan}"
# Both directions printed, the lint:rust precedent: a run that verified
# nothing must not read like a run that verified everything.
if [[ ${checked} -eq 0 ]]; then
  echo "lint:msrv: every declared minimum sits outside the gate's compile surface"
  echo "lint:msrv: nothing verified — the exclusions above are what to remove"
  exit 0
fi
echo "lint:msrv: ${checked} declared minimum(s) compiled at the toolchain they name"
'''

[tasks."lint:pg-clippy"]
description = "The pgrx extension the gate never compiled, at the same clippy level as every other crate"
dir = "{{cwd}}"
# The crate that could not fail (#813). edtf's v1.3.0 publish died in all
# ten pgrx jobs on a parse error, and the gate had been green: it had
# never compiled that crate. A task existed and could not matter —
# `pg:lint` sat outside the `lint:*` wildcard so `ci` never collected it,
# and it exited 101 on an unmodified tree, so it had never once passed.
# That is #687's class exactly: not a test that was skipped, a test that
# could not fail.
#
# NAMED `lint:` SO THE WILDCARD TAKES IT. The whole defect was a naming
# accident with a four-hundred-release blast radius, and the fix is not a
# better repo-local task — it is a belt task the wildcard collects, so no
# repository can lose it again by not remembering it.
#
# The crate is DERIVED, never declared: gate-surface.py calls a member a
# pgrx extension when it depends on pgrx AND carries pgNN features, so a
# repository states nothing and cannot state it wrong. `CLIPPY_EXCLUDE`
# is not how this crate is recognised — it is what used to hide it.
#
# ONE MAJOR, THE HIGHEST DECLARED. Its bindings are per-major, so linting
# all five would multiply the cost by five to re-lint mostly identical
# code; `test:pgrx` compiles every major anyway, which is where a
# major-specific break shows up. Highest rather than lowest because that
# is where a newly-deprecated API surfaces first, and stated here rather
# than left to be inferred from the code.
#
# `--no-deps` is load-bearing and was learned the hard way in edtf: without
# it clippy also lints the workspace's other crates under
# --no-default-features, where their lint expectations do not fire and
# `-D warnings` turns each one into an error.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n ${manifests} ]] || {
  echo "lint:pg-clippy: no Cargo.toml tracked, skipped"
  exit 0
}
command -v cargo > /dev/null || {
  echo "lint:pg-clippy: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
cargo fetch --locked
specs=""
majors=""
# Assigned first: a `<<< "$(...)"` discards the derivation's exit status,
# so a red derivation would read as a workspace with no extension and
# this task would skip clean having checked nothing.
surface=$(cargo metadata --no-deps --format-version 1 --locked \
  | python3 "${ORG_BELT_DIR}/gate-surface.py" --exclude "${CLIPPY_EXCLUDE:-}")
while IFS=$'\t' read -r record spec kind crate_majors _dir; do
  [[ ${record} == crate && ${kind} == pgrx ]] || continue
  specs="${specs} ${spec}:${crate_majors##*,}"
  majors="${majors}${majors:+,}${crate_majors##*,}"
done <<< "${surface}"
[[ -n ${specs} ]] || {
  echo "lint:pg-clippy: no pgrx extension tracked, skipped"
  exit 0
}
# clippy is a rustup COMPONENT of the repo's own pin, asserted with a
# remedy and never installed mid-run — the lint:rust reasoning verbatim.
if ! rustup component list --installed 2> /dev/null | grep -q "^clippy"; then
  echo "lint:pg-clippy: clippy component missing — declare it with the rust pin in mise.toml:" >&2
  echo '  rust = { version = "1.xx.x", components = "clippy,rustfmt,llvm-tools" }' >&2
  exit 1
fi
export CLIPPY_CONF_DIR="${ORG_BELT_DIR}"
. "${ORG_BELT_DIR}/clippy-ladder.sh"
# The pgrx ladder: the org's, plus the one contradiction a pgrx crate
# cannot escape (the reason is written at the list, in clippy-ladder.sh).
ladder=$(org_clippy_pgrx_ladder)
contradiction_count=$(org_clippy_pgrx_contradiction_count)
. "${ORG_BELT_DIR}/pgrx-env.sh"
org_pgrx_darwin_flags
mise ls "aqua:theseus-rs/postgresql-binaries" --json \
  | python3 "${ORG_BELT_DIR}/pgrx-postgres.py" --majors "${majors}" \
  | org_pgrx_init > /dev/null
count=0
linted=""
for entry in ${specs}; do
  spec="${entry%:*}"
  major="${entry##*:}"
  count=$((count + 1))
  linted="${linted} ${spec%@*}(pg${major})"
  # shellcheck disable=SC2086  # ${ladder} holds whole flag WORDS, which
  # clippy must receive as separate arguments
  cargo clippy -p "${spec}" --no-deps --all-targets --locked --keep-going \
    --no-default-features --features "pg${major}" -- ${ladder}
done
echo "lint:pg-clippy: ${count} extension(s) linted:${linted}"
echo "lint:pg-clippy: clean at every group (restriction minus ${contradiction_count} named contradictions)"
'''

[tasks."test:pgrx"]
description = "The Postgres extension's own suite, at every major the crate declares"
dir = "{{cwd}}"
# The other half of #813, and the half a compile check cannot cover: the
# extension's SQL-level behaviour. edtf's `pg:test` ran it at one major,
# from a task nothing collected, so the release containers were the first
# thing to execute the extension at pg14 through pg17.
#
# EVERY MAJOR THE CRATE DECLARES, read from its `[features]` and never
# guessed — a repository that drops a major must not have the gate keep
# testing it, and one that adds a major must not have the gate quietly
# skip it. The stub's `pg-majors` is checked against the same features by
# `lint:gate-surface` rather than being a second source.
#
# NOT NAMED `test`, which is the repository's own task and would collide,
# and not named `lint:` either, because it is a test and calling it a
# lint to reach the wildcard would be the naming accident that caused
# this issue in the first place. It is wired into `ci` explicitly below.
#
# Measured cost before it was wired in (recorded on #813): 91s for the
# first major on the runner and 37s for each one after it, so five majors
# is about four minutes, and mise-action's cache makes the Postgres
# install a once-per-pin-bump cost rather than a per-run one.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n ${manifests} ]] || {
  echo "test:pgrx: no Cargo.toml tracked, skipped"
  exit 0
}
command -v cargo > /dev/null || {
  echo "test:pgrx: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
crates=""
majors=""
# Assigned first, for the reason the sibling tasks give: an empty
# here-string from a failed derivation would skip this suite silently,
# which is the exact failure #813 exists to end.
surface=$(cargo metadata --no-deps --format-version 1 --locked \
  | python3 "${ORG_BELT_DIR}/gate-surface.py" --exclude "${CLIPPY_EXCLUDE:-}")
while IFS=$'\t' read -r record spec kind crate_majors dir; do
  [[ ${record} == crate && ${kind} == pgrx ]] || continue
  [[ ${dir} != "-" ]] || {
    echo "test:pgrx: ${spec} is a pgrx extension cargo reports no directory for" >&2
    exit 1
  }
  crates="${crates} ${dir}:${crate_majors}"
  majors="${majors}${majors:+,}${crate_majors}"
done <<< "${surface}"
[[ -n ${crates} ]] || {
  echo "test:pgrx: no pgrx extension tracked, skipped"
  exit 0
}
cargo fetch --locked
. "${ORG_BELT_DIR}/pgrx-env.sh"
org_pgrx_darwin_flags
mise ls "aqua:theseus-rs/postgresql-binaries" --json \
  | python3 "${ORG_BELT_DIR}/pgrx-postgres.py" --majors "${majors}" \
  | org_pgrx_init > /dev/null
count=0
tested=""
for entry in ${crates}; do
  dir="${entry%%:*}"
  list="${entry#*:}"
  for one in ${list//,/ }; do
    count=$((count + 1))
    tested="${tested} ${dir}(pg${one})"
    echo "test:pgrx: ${dir} at pg${one}"
    (cd "${dir}" && cargo pgrx test "pg${one}")
  done
done
echo "test:pgrx: ${count} suite run(s):${tested}"
'''

[tasks."lint:gate-surface"]
description = "Every crate the publish path builds is compiled by the gate"
dir = "{{cwd}}"
# THE INVARIANT, so that no repository can recreate the blind spot (#813).
# Both instances of it were the same shape: a crate the publish path
# builds, held out of the gate by a repository's own `CLIPPY_EXCLUDE`,
# with nothing anywhere that compared the two lists. edtf found out at a
# tag; release-lab had not found out yet.
#
# The publish path's crates are read from the stub's own `with:` block —
# `rust-crate`/`rust-binary` take every member except its declared
# `exclude`, `pgrx-extension` takes `extension-crate-dir`, `wasm-npm`
# takes `crate-dir` — and joined against the gate's compile surface. A
# crate in both the publish set and the exclusion set is red, with the
# remedy being to delete the exclusion rather than to annotate it: an
# exclusion hides a WHOLE CRATE, so a member held out of the gate is a
# member whose first compile is the release's (the recorded burn).
#
# It also cross-checks `pg-majors` against the crate's features, because
# the stub carries a copy of a fact the manifest owns. The features win:
# they are what cargo compiles.
#
# Deterministic and offline — it reads two tracked files.
run = '''
set -euo pipefail
[[ -f .github/workflows/publish.yml ]] || {
  echo "lint:gate-surface: no publish.yml, nothing is published from here, skipped"
  exit 0
}
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n ${manifests} ]] || {
  echo "lint:gate-surface: no Cargo.toml tracked, skipped"
  exit 0
}
command -v cargo > /dev/null || {
  echo "lint:gate-surface: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
surface=$(cargo metadata --no-deps --format-version 1 --locked \
  | python3 "${ORG_BELT_DIR}/gate-surface.py" --exclude "${CLIPPY_EXCLUDE:-}" \
    --publish .github/workflows/publish.yml)
count=0
while IFS=$'\t' read -r record _spec _kind _majors _dir; do
  [[ ${record} == crate ]] || continue
  count=$((count + 1))
done <<< "${surface}"
echo "lint:gate-surface: ${count} crate(s) compiled by the gate, and the publish path builds no others"
'''

[tasks."lint:go"]
description = "Go lint + format check (golangci-lint, default: all + curated disables)"
dir = "{{cwd}}"
# The Go half of the language layer (#392). golangci-lint analyzes
# PACKAGES via the go toolchain, not a file list — `git ls-files` cannot
# feed it. That is safe against the lefthook-cache trap anyway: go
# package loading ignores dot-directories, so nothing under .git/ is
# reachable, and an untracked .go file inside a tracked package is a
# build input the compiler would also see — hiding it from the linter
# would be lying to ourselves, not hygiene.
#
# A tracked .golangci.yml is REQUIRED once Go is tracked, the
# ruff/biome rule with the same sharp edge: golangci-lint's default
# selection is five linters out of ~105, so a repo that forgets the
# config gets a green gate that checked almost nothing. Copy
# scaffold/.golangci.yml — the org policy is `default: all` with
# per-rule written disables, and v2 `run` also reports the enabled
# formatters (gofumpt extra-rules, gci) as findings, so format drift
# reds here too.
#
# Multi-module trees are linted per go.mod, because golangci-lint
# resolves one module context per invocation.
#
# The cache is pinned INSIDE the invoking checkout's own git dir (#572).
# golangci-lint keys its cache on import path and defaults to one
# user-global directory, so every checkout of one module shares it: two
# worktrees of github.com/monumental-archive/stele at different revisions
# are, to that cache, the same packages with different contents — and
# `lint:go` in one worktree reported 144 findings, none of them in the
# tree it was looking at. `git rev-parse --absolute-git-dir` resolves to
# .git/worktrees/<name>/ in a worktree, which dies with the worktree, and
# to .git/ in a plain clone, which also ends one user-global cache
# accumulating every repository's analysis state. --git-common-dir is
# NOT what is wanted here: it is the shared dir a worktree points back
# at, which is the sharing itself. Costs one cold run per new checkout
# and nothing after; the invariant is that no invocation can read
# analysis state produced from a different checkout.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n ${mods} ]] || {
  echo "lint:go: no go.mod tracked, skipped"
  exit 0
}
# A repo with a go.mod has go pinned as a build input; go absent is a
# broken toolchain, and skipping would be the vacuous-success failure.
command -v go > /dev/null || {
  echo "lint:go: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
command -v golangci-lint > /dev/null || {
  echo "lint:go: golangci-lint missing from the belt" >&2
  exit 1
}
# The one language config that stays repo-side: it names the module path
# (gci's import prefix) and, in stele, wrapcheck globs for that module's
# own packages. Per-repo CONTENT, like deny.toml's skips — the belt can
# deliver a config, not invent a repo's identity (#445).
if ! git ls-files --error-unmatch ".golangci.yml" > /dev/null 2>&1; then
  echo "lint:go: Go is tracked but no .golangci.yml is — copy scaffold/.golangci.yml (#392)" >&2
  echo "  without it golangci-lint runs its five default linters, not the org's default: all" >&2
  exit 1
fi
count=0
while IFS= read -r m; do
  [[ -n ${m} ]] || continue
  count=$((count + 1))
  d=$(dirname "${m}")
  cache="$(cd "${d}" && git rev-parse --absolute-git-dir)/golangci-lint"
  (cd "${d}" && export GOLANGCI_LINT_CACHE="${cache}" && golangci-lint run)
done <<< "${mods}"
echo "lint:go: ${count} module(s) linted and format-checked"
'''

[tasks."lint:tsc-flags"]
description = "Every type-checking option the pinned tsc has is passed or adjudicated"
dir = "{{cwd}}"
# The enable-list alarm, and unlike biome's it is offline and lives in
# the gate. TypeScript cannot express its checks as a group minus
# exclusions — `--strict` grows on its own, but every dial outside that
# family is named one at a time in mise/tsc-flags.txt. So a strictness
# option added by a toolchain bump would simply be absent, and
# enforcement would stop growing with nothing to say so: the exact
# failure the clippy standup rejected an explicit enable-list for.
#
# `tsc --all` is the pinned compiler's own account of what it has, so
# the comparison needs no network and no vendored list — the belt asks
# the binary it is running. Unconditional, because it checks the ORG's
# config rather than a repo's code: the canon tracks no TypeScript, and
# a check that only runs where TypeScript exists would never run here,
# which is how three biome defects survived three days (#445).
run = '''
set -euo pipefail
command -v tsc > /dev/null || {
  echo "lint:tsc-flags: tsc missing from the belt" >&2
  exit 1
}
list="${ORG_BELT_DIR}/tsc-flags.txt"
[[ -f ${list} ]] || {
  echo "lint:tsc-flags: ${list} missing from the belt" >&2
  exit 1
}
known=$({
  grep -oE '^--[a-zA-Z]+' "${list}"
  sed -n 's/^# adjudicated: \([a-zA-Z]*\) .*/--\1/p' "${list}"
} | sort -u)
version=$(tsc --version | tr -d '\n')
have=$(tsc --all | sed -n '/^### Type Checking/,/^### Watch/p' \
  | awk '/^--/{name=$1} /^type: boolean/{print name}' | tr -d ',' | sort -u)
unruled=$(comm -23 <(echo "${have}") <(echo "${known}"))
if [[ -n ${unruled} ]]; then
  echo "lint:tsc-flags: ${version} has type-checking options the org has not ruled on:" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  /' <<< "${unruled}" >&2
  echo "  pass it in mise/tsc-flags.txt, or add an '# adjudicated:' line saying why not" >&2
  exit 1
fi
echo "lint:tsc-flags: every type-checking option of ${version} is passed or ruled"
'''

[tasks."lint:types"]
description = "TypeScript type checking (tsc, every dial forced from the command line)"
dir = "{{cwd}}"
# The TypeScript half of the language layer (#445). Named for the subject
# like lint:go and lint:python — tsc checks one thing, and biome already
# owns the tool-named task over the same files.
#
# Every dial is passed on the COMMAND LINE, and that is the whole design
# FOR TSC: a compiler flag beats the same key in tsconfig.json even under
# `-p` (proven), so a repo cannot lower the org's level from its own
# config. Stronger than clippy, where a source attribute could still
# defeat the belt.
#
# What that argument does NOT cover is every other type-aware tool, and
# #699 measured the cost: typescript-eslint and biome read
# tsconfig.json and never see this command line, so the scaffold's old
# "carry no strictness settings" instruction lowered them silently — 935
# new eslint errors on monumental-archive from stripping the keys, and
# nothing about the code changed. The repo's tsconfig.json therefore
# carries the org's dials as well, and `lint:tsconfig-dials` holds it
# there. Two readers, one fact, stated where both can see it.
#
# Per project with `-p`, never `tsc -b`: build mode refuses every
# compiler option it is handed (TS5094), so the org's flags and
# reference-following are mutually exclusive, and enforcement wins.
# Project references are therefore refused outright rather than half
# supported — under `-p` a referenced project's declarations do not
# exist (TS6305) and the alternative is a build that writes. TS 7 checks
# ~360 files a second, so the build-orchestration case references exist
# to solve is not one the org has.
#
# `--noEmit` is not optional: without it tsc writes .js beside the
# sources, and writes it even when checking FAILED (noEmitOnError
# defaults false). .tsbuildinfo is redirected to a temp dir for the same
# reason — the gate does not write to the tree (#374).
#
# File selection is the one thing the command line cannot force, so it
# is checked instead: every tracked .ts file must appear in some
# project's program. A repo cannot `exclude` its way to a green gate.
run = '''
set -euo pipefail
ts=$(git ls-files ':!vendor/**' "*.ts" "*.tsx" "*.mts" "*.cts")
[[ -n ${ts} ]] || {
  echo "lint:types: no TypeScript tracked, skipped"
  exit 0
}
cfgs=$(git ls-files ':!vendor/**' "tsconfig.json" "*/tsconfig.json" "*/*/tsconfig.json" \
  "*/*/*/tsconfig.json")
if [[ -z ${cfgs} ]]; then
  echo "lint:types: TypeScript is tracked but no tsconfig.json is — copy scaffold/tsconfig.json" >&2
  echo "  tsc refuses a file list when a project exists, so a project is how the org checks" >&2
  exit 1
fi
command -v tsc > /dev/null || {
  echo "lint:types: tsc missing from the belt" >&2
  exit 1
}
# The suppression ladder, and it is clippy's exactly. @ts-expect-error is
# the only survivor: it self-retires, because TypeScript errors (TS2578)
# when the error it covers goes away — the #[expect] property. @ts-ignore
# suppresses forever and silently, and biome's noTsIgnore already bans it
# org-wide. @ts-nocheck silences a WHOLE FILE, the crate-level
# #![allow] in a new costume, and nothing catches it: biome ran clean
# over a file containing one. No compiler flag defeats either, so the
# belt greps, exactly as it does for clippy's crate-level allows.
banned=$(xargs grep -Hn '@ts-nocheck' <<< "${ts}" || true)
if [[ -n ${banned} ]]; then
  echo "lint:types: @ts-nocheck disables checking for an entire file" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  /' <<< "${banned}" >&2
  echo "  use @ts-expect-error with a written reason on the single line that needs it" >&2
  exit 1
fi
bare=$(xargs grep -Hn '@ts-expect-error[[:space:]]*$' <<< "${ts}" || true)
if [[ -n ${bare} ]]; then
  echo "lint:types: @ts-expect-error without a written reason" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  /' <<< "${bare}" >&2
  echo "  the compiler retires the directive when the error goes; it cannot supply the why" >&2
  exit 1
fi
# shellcheck disable=SC2086  # the file list is newline-separated on purpose
refs=$(grep -l '"references"' ${cfgs} || true)
if [[ -n ${refs} ]]; then
  echo "lint:types: project references are not supported org-wide" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  declares references: /' <<< "${refs}" >&2
  echo "  tsc -b refuses the org's compiler flags (TS5094), so following references would" >&2
  echo "  mean checking at whatever level the repo chose. Give each project its own config." >&2
  exit 1
fi
pkgs=$(git ls-files "package.json" "*/package.json")
if [[ -n ${pkgs} && ! -d node_modules ]]; then
  echo "lint:types: dependencies are not installed, so their types cannot be read" >&2
  echo "  install from the tracked lockfile before checking (a check against absent types" >&2
  echo "  is not a weaker check, it is a green one that resolved nothing)" >&2
  exit 1
fi
flags=()
while IFS= read -r line; do
  line="${line%%#*}"
  [[ -n ${line//[[:space:]]/} ]] || continue
  read -ra parts <<< "${line}"
  flags+=("${parts[@]}")
done < "${ORG_BELT_DIR}/tsc-flags.txt"
tmp=$(mktemp -d)
trap 'rm -rf "${tmp}"' EXIT
count=0
while IFS= read -r cfg; do
  [[ -n ${cfg} ]] || continue
  count=$((count + 1))
  tsc -p "${cfg}" --tsBuildInfoFile "${tmp}/${count}.tsbuildinfo" "${flags[@]}"
  tsc -p "${cfg}" --noEmit --noCheck --listFiles \
    --tsBuildInfoFile "${tmp}/${count}.info" >> "${tmp}/seen"
done <<< "${cfgs}"
sed "s|^${PWD}/||" "${tmp}/seen" | sort -u > "${tmp}/checked"
sort -u <<< "${ts}" > "${tmp}/tracked"
escaped=$(comm -23 "${tmp}/tracked" "${tmp}/checked")
if [[ -n ${escaped} ]]; then
  echo "lint:types: tracked TypeScript that no project checks" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  /' <<< "${escaped}" >&2
  echo "  add it to a project's include, or give it a project — an excluded file is" >&2
  echo "  unchecked, and the gate cannot tell that apart from checked-and-clean" >&2
  exit 1
fi
covered=$(wc -l < "${tmp}/tracked" | tr -d ' ')
echo "lint:types: ${count} project(s) checked, ${covered} files covered"
'''

# The other half of the TypeScript level, and the half `lint:types`
# structurally cannot enforce (#699).
#
# `lint:types` forces every dial on the command line, where a compiler
# flag beats the same key in a repo's config even under `-p`. That is
# true of `tsc` and false of every other type-aware tool, because those
# tools read `tsconfig.json` and never see the belt's command line. The
# scaffold read the flag's primacy as licence to carry no strictness at
# all — "a copy of those settings here would be either duplication or a
# lie" — and following that instruction silently lowered every reader
# but one.
#
# Measured on monumental-archive, three states, one variable:
#
#   its own config, strictness present     eslint --max-warnings 0 →   0
#   stripped per the old scaffold text                            → 935
#   raised to the full org level                                  →   0
#
# The 935 are typescript-eslint reading a weaker program —
# `dot-notation` 590 once `noPropertyAccessFromIndexSignature` is gone,
# `no-unnecessary-condition` 345 once the null-checking dials move.
# Nothing about the code changed. biome is exposed identically: its
# `types` and `project` domains resolve the same TypeScript program.
#
# So the keys are neither duplication nor a lie — they are the only
# statement of the level the second reader can see, which is exactly
# what `.editorconfig` already does for caps that belt formatters also
# enforce. This task makes that true rather than advisory.
#
# THE COMPARISON IS DERIVED FROM tsc-flags.txt AND NOWHERE ELSE — the
# same file `lint:types` passes to the compiler and `lint:tsc-flags`
# holds against `tsc --all`. A bare flag means the key must be `true`;
# `--flag false` means it must be `false`. Absent FAILS, because absent
# is the defect. Stricter is never inspected: a repo may name dials the
# org does not, and the hazard is one-directional — the
# `lint:python-target` shape.
#
# The config being judged is what `tsc --showConfig` RESOLVES, not the
# file's text. That is TypeScript's own parser, so JSONC comments,
# trailing commas and `extends` behave exactly as they do for the
# compiler, and a repo that states the dials once in a root config and
# extends it everywhere passes without stating them twice. Measured:
# `--showConfig` does not materialise a default for a dial the config
# never mentions, which is the only reason "absent" is detectable.
#
# Same config enumeration as `lint:types`, deliberately character for
# character: a config one task checks and the other does not is a
# program checked at a level nobody stated.
[tasks."lint:tsconfig-dials"]
description = "Every tracked tsconfig.json states the org's dials, none weaker (#699)"
dir = "{{cwd}}"
run = '''
set -euo pipefail
cfgs=$(git ls-files ':!vendor/**' "tsconfig.json" "*/tsconfig.json" "*/*/tsconfig.json" \
  "*/*/*/tsconfig.json")
[[ -n ${cfgs} ]] || {
  echo "lint:tsconfig-dials: no tsconfig.json tracked, skipped"
  exit 0
}
command -v tsc > /dev/null || {
  echo "lint:tsconfig-dials: tsc missing from the belt" >&2
  exit 1
}
tmp=$(mktemp -d)
trap 'rm -rf "${tmp}"' EXIT
rc=0
count=0
while IFS= read -r cfg; do
  [[ -n ${cfg} ]] || continue
  count=$((count + 1))
  if ! tsc -p "${cfg}" --showConfig > "${tmp}/resolved.json" 2> "${tmp}/err"; then
    echo "lint:tsconfig-dials: ${cfg} does not resolve" >&2
    # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
    sed 's/^/  /' "${tmp}/err" >&2
    rc=1
    continue
  fi
  python3 "${ORG_BELT_DIR}/tsconfig-dials.py" --flags "${ORG_BELT_DIR}/tsc-flags.txt" \
    --name "${cfg}" < "${tmp}/resolved.json" || rc=1
done <<< "${cfgs}"
[[ ${rc} -eq 0 ]] || {
  echo "lint:tsconfig-dials: ${count} config(s) checked, at least one below the org's level" >&2
  exit 1
}
'''

[tasks."lint:scaffold-assembly"]
description = "A repository built from scaffold/ survives the org's own fixers and gate (canon only)"
dir = "{{cwd}}"
# `scaffold/` is the entire per-repo footprint of the governance stack —
# what every new repository copies at creation and every import copies at
# migration — and until this task nothing ever RAN it as a repository
# (#777). The stubs were linted as text: `lint:tsconfig-dials` reads the
# dials, `lint:biome` lints the JSON. Neither answers the only question
# that matters, which is whether a repo assembled from them passes the
# gate those same stubs opt it into.
#
# #758 is what fell through the gap: a repository built verbatim from
# these stubs deadlocked its own fixer against its own checker —
# `fix:biome` wrote `./helper.ts`, `tsc` refused it (TS5097), forever —
# while every canon gate stayed green, because the canon has no
# TypeScript. A green canon gate is not evidence about the scaffold.
#
# So: assemble, fix, then gate, all in a scratch tree. RED BEFORE THE
# FIXERS IS EXPECTED and is not measured — the assembled tree is checked
# after `fix:*`, because that is the state a repo is asked to be in.
# A red is not automatically a defect in `scaffold/` either, so the
# report names WHICH task spoke and prints what it said; reading it is
# the point.
#
# Deterministic and offline: the belt is already installed, the stubs are
# tracked files, and every task the assembled gate runs is one the canon
# already runs on itself. What the assembly cannot provide is printed,
# never silently dropped — the Rust and Go legs (the belt pins no `rust`
# or `go`; a repo declares its own) and `ci`'s `test`/`build` collection
# (the stub `mise.toml` ships a deliberately failing TODO test, which is
# the scaffold working). No FIXER is excluded any more: the two this
# check found unguarded were the defect, not the assembly, and #860
# guarded them.
run = '''
tracked=$(git ls-files "scaffold/")
[[ -n ${tracked} ]] || {
  echo "lint:scaffold-assembly: no tracked scaffold/, not the canon, skipped"
  exit 0
}
command -v mise > /dev/null || {
  echo "lint:scaffold-assembly: mise missing from the belt" >&2
  exit 1
}
# THE BELT UNDER TEST IS THIS COMMIT'S, not the one the machine happens
# to wear. ORG_BELT_DIR is right for reading delivered configs and wrong
# here: locally it resolves through the ~/.config/mise/conf.d symlink to
# whichever checkout was linked, so a belt change in the branch would be
# assembled against the belt on main and the run would prove nothing
# about the pull request. The canon tracks the belt, so the canon's own
# copy is the answer, in CI and on a laptop alike.
belt="${PWD}/mise/config.toml"
git ls-files --error-unmatch "mise/config.toml" > /dev/null 2>&1 || {
  echo "lint:scaffold-assembly: scaffold/ is tracked but mise/config.toml is not" >&2
  echo "  the assembled repository is run against this repository's own belt" >&2
  exit 1
}
# stub:destination. A tracked stub must appear here or in the list
# below, so a stub added to scaffold/ without a decision reds this check
# instead of escaping it.
assembled="mise.toml:mise.toml
tsconfig.json:tsconfig.json
biome.json.stub:biome.json
deny.toml:deny.toml
renovate.json:renovate.json
lefthook.yml:lefthook.yml
.editorconfig:.editorconfig
.bestpractices.json:.bestpractices.json
.golangci.yml:.golangci.yml
SECURITY-INSIGHTS.yml:SECURITY-INSIGHTS.yml
CHANGELOG.md:CHANGELOG.md
CODEOWNERS:.github/CODEOWNERS"
# stub:why not. Printed with the run: a stub this check does not
# exercise is a stub it does not speak for.
declined="README.md:the directory's own documentation, not a file a repo copies
README-badges.md:the badge catalogue fix:badges reads from the canon
REUSE.toml.stub:its holes are the licence identity only the repo can choose (#214)
CITATION.cff:fix:citation renders it from REUSE.toml; a copy would be hand-filled"
# task:why not. EMPTY, and the check is stronger for it: every fixer the
# belt names runs against the assembled repository. It was two entries on
# the day this landed — `fix:tracks` and `fix:shell`, both unguarded,
# both found HERE and neither fixed here — and #860 guarded them (and a
# third, `fix:markdown`, that only a GNU runner would have reached).
# An entry belongs here when this check finds a belt defect it must not
# also fix, and it names that defect's issue; it comes out when the issue
# closes. An excluded task is printed with every run, because an
# exclusion nobody can see is a hole. The | is not decoration: a task
# name carries a colon, so this table cannot be split on one.
excluded=""
decided=$(cut -d: -f1 <<< "${assembled}
${declined}")
missing=""
while IFS= read -r f; do
  stub="${f#scaffold/}"
  grep -qxF "${stub}" <<< "${decided}" && continue
  missing="${missing} ${stub}"
done <<< "${tracked}"
if [[ -n ${missing} ]]; then
  echo "lint:scaffold-assembly: tracked stub(s) the assembly does not name:${missing}" >&2
  echo "  add each to the assembled list with a destination, or to the declined list with" >&2
  echo "  the reason — an unnamed stub is one nothing ever runs" >&2
  exit 1
fi
tmp=$(mktemp -d)
trap 'rm -rf "${tmp}"' EXIT
count=0
while IFS=: read -r stub dest; do
  [[ -n ${stub} ]] || continue
  mkdir -p "${tmp}/$(dirname "${dest}")"
  cp "scaffold/${stub}" "${tmp}/${dest}" || {
    echo "lint:scaffold-assembly: scaffold/${stub} is tracked but unreadable here" >&2
    exit 1
  }
  count=$((count + 1))
done <<< "${assembled}"
# The probe's own scaffolding, which is NOT the scaffold: the smallest
# repository the stubs describe. Kept minimal and listed in the report,
# because anything added here can draw findings of its own — a
# hand-written package.json did exactly that while this was being built.
#   LICENSE      — lint:licence asks only that the choice was MADE, and
#                  the choice is the one thing a stub cannot make (#214);
#                  the canon's own 0BSD text stands in for one.
#   package.json — `"type": "module"`, without which nodenext reads a
#                  .ts file as CommonJS and verbatimModuleSyntax refuses
#                  its export (TS1287). No dependencies, so the empty
#                  node_modules below is what "installed" means here —
#                  lint:types otherwise refuses a tracked package.json
#                  whose dependencies are absent, which is that guard
#                  working rather than anything about scaffold/.
#   src/<ext>/   — one extensionless relative import per TypeScript
#                  source extension: #758's shape, and the one line that
#                  makes the fixer/checker pair speak. TWO extensions,
#                  because #868 was `.js` being right for one of them and
#                  wrong for the other — a probe that varies neither
#                  proves neither. Each pair gets its own directory: with
#                  helper.ts and helper.mts side by side, `./helper` is
#                  ambiguous and tsc names the wrong counterpart.
mkdir -p "${tmp}/node_modules"
cp LICENSE "${tmp}/LICENSE"
printf '{\n  "name": "scaffold-probe",\n  "private": true,\n  "type": "module"\n}\n' \
  > "${tmp}/package.json"
for ext in ts mts; do
  mkdir -p "${tmp}/src/${ext}"
  printf 'export const helped = (): string => "probe";\n' > "${tmp}/src/${ext}/helper.${ext}"
  printf 'import { helped } from "./helper";\n\nexport const main = (): string => helped();\n' \
    > "${tmp}/src/${ext}/index.${ext}"
done
# GIT_DIR, GIT_INDEX_FILE and GIT_WORK_TREE override the working
# directory, so an inherited one would make this `git init` and commit
# write into the CALLING repository instead of the scratch tree. Scrubbed
# for every git and every inner task, not assumed absent.
clean=(env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR)
(
  cd "${tmp}"
  "${clean[@]}" git init -q -b main
  "${clean[@]}" git config user.name "scaffold probe"
  "${clean[@]}" git config user.email "probe@invalid"
  "${clean[@]}" git config commit.gpgsign false
  "${clean[@]}" git add -A
  "${clean[@]}" git commit -q -m "chore: assemble a repository from the scaffold" \
    -m "Signed-off-by: scaffold probe <probe@invalid>"
) || {
  echo "lint:scaffold-assembly: the scratch repository could not be committed" >&2
  exit 1
}
# Every belt linter reads `git ls-files`, so an uncommitted tree measures
# nothing. Committed ONCE, here: the fixers below rewrite files and are
# meant to, and re-adding afterwards would track whatever a tool left
# behind (biome-org.generated.json is written into the tree for the
# length of one run).
run_task() { # task -> 0, or 1 with the task's own words on stderr
  local task="${1}" out
  # nested-mise: running the assembled repository's OWN gate is what this
  # check IS (#764, #777). There is no derivation to share and no task to
  # depend on — the names come from the scratch tree, not from here — so
  # this is `audit`'s dispatcher case, not lint:citation's.
  #
  # It differs from `audit` in the way that matters, and the difference
  # was weighed rather than missed: `audit` is collected by nothing,
  # while this task is a `lint:*` and therefore runs inside the parallel
  # fan-out — the exact condition #82 raced under. What makes it safe is
  # structural, not luck: the env is scrubbed of every GIT_* above and
  # the belt is pinned by MISE_GLOBAL_CONFIG_FILE below, so the inner
  # mise resolves ITS OWN lockfile in the scratch tree instead of racing
  # the outer run for the caller's. Keep both, or this marker stops
  # being true.
  if out=$(cd "${tmp}" && "${clean[@]}" \
    MISE_GLOBAL_CONFIG_FILE="${belt}" \
    MISE_TRUSTED_CONFIG_PATHS="${tmp}" mise run "${task}" 2>&1); then
    return 0
  fi
  echo "lint:scaffold-assembly: ${task} spoke:" >&2
  grep -v "^mise WARN" <<< "${out}" | tail -20 | sed 's/^/    /' >&2
  return 1
}
tasks_named() { # prefix -> the belt's task names, one per line
  (cd "${tmp}" && "${clean[@]}" MISE_GLOBAL_CONFIG_FILE="${belt}" \
    MISE_TRUSTED_CONFIG_PATHS="${tmp}" mise tasks ls --json 2> /dev/null) \
    | jq -r --arg p "${1}" '.[] | select(.name | startswith($p)) | .name' | sort
}
echo "lint:scaffold-assembly: ${count} stub(s) assembled into a scratch repository"
while IFS=: read -r stub why; do
  [[ -n ${stub} ]] || continue
  echo "  not assembled: ${stub} — ${why}"
done <<< "${declined}"
echo "  added by the probe, not the scaffold: LICENSE, package.json, src/ts/ and"
echo "    src/mts/ (an index and a helper each), an empty node_modules/ — the"
echo "    repository declares no dependencies, so that is what installed means here"
echo "  not exercised: .tsx and .cts — the scaffold's tsconfig declares no jsx, which"
echo "    a .tsx file needs (TS6142), and under verbatimModuleSyntax +"
echo "    erasableSyntaxOnly a .cts file can hold no module syntax at all (#868)"
echo "  not exercised: the Rust and Go legs — the belt pins no rust or go toolchain, so"
echo "    deny.toml and .golangci.yml are assembled as files and their tasks skip clean"
echo "  not exercised: ci's test/build collection — the stub mise.toml ships a failing"
echo "    TODO test on purpose, so this runs the lint:* layer the same collection gathers"
while IFS= read -r line; do
  [[ -n ${line} ]] || continue
  echo "  not exercised: ${line%%|*} — ${line#*|}"
done <<< "${excluded}"
rc=0
fix_tasks=$(tasks_named "fix:")
gate_tasks=$(tasks_named "lint:")
skipped=$(cut -d'|' -f1 <<< "${excluded}")
fixers=0
while IFS= read -r task; do
  [[ -n ${task} ]] || continue
  grep -qxF "${task}" <<< "${skipped}" && continue
  fixers=$((fixers + 1))
  # shellcheck disable=SC2310  # deliberate: every task runs and the failures are
  # collected, so one red task cannot hide the rest (the `audit` task's ruling)
  run_task "${task}" || rc=1
done <<< "${fix_tasks}"
# A run that enumerated nothing and reported success would be this check
# announcing that it checked nothing — the belt always has both families.
[[ ${fixers} -gt 0 ]] || {
  echo "lint:scaffold-assembly: the belt named no fix:* tasks inside the assembled repo" >&2
  exit 1
}
if [[ ${rc} -ne 0 ]]; then
  echo "lint:scaffold-assembly: a fixer failed on a repository built from scaffold/" >&2
  exit 1
fi
gates=0
while IFS= read -r task; do
  [[ -n ${task} ]] || continue
  gates=$((gates + 1))
  # shellcheck disable=SC2310  # deliberate, as above
  run_task "${task}" || rc=1
done <<< "${gate_tasks}"
[[ ${gates} -gt 0 ]] || {
  echo "lint:scaffold-assembly: the belt named no lint:* tasks inside the assembled repo" >&2
  exit 1
}
if [[ ${rc} -ne 0 ]]; then
  echo "lint:scaffold-assembly: a repository built from scaffold/ fails the org's gate" >&2
  echo "  the task above is what spoke — a red is a defect in scaffold/ only if the task" >&2
  echo "  is judging a stub; read what it said before changing anything" >&2
  exit 1
fi
echo "lint:scaffold-assembly: ${fixers} fixer(s) then ${gates} gate task(s), all green"
'''

[tasks."lint:go-tidy"]
description = "go.mod and go.sum match the source (go mod tidy -diff)"
dir = "{{cwd}}"
# The Go dependency-hygiene half (#445), and the one belt task whose tool
# would normally REWRITE the tree to answer the question. `-diff` is what
# makes it a gate check rather than a fixer: it prints the unified diff
# tidy would apply and exits non-zero when that diff is non-empty,
# writing nothing (#374, proven in both directions — an unused `require`
# and an import with no requirement).
#
# What it catches that nothing else does: a dependency imported but never
# required, a requirement nothing imports any more, and go.sum entries
# that drifted from either. golangci-lint reads packages and never reads
# the manifest, so this is invisible to it — the cargo-machete gap in Go
# form, except the toolchain answers it itself and needs no extra tool.
#
# One honest limit: for a MISSING requirement, tidy resolves the latest
# version over the network, so the suggested diff is time-dependent. The
# verdict is not — that tree is untidy today and tomorrow — and a repo in
# that state is already failing, so the gate stays stable where it counts.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n ${mods} ]] || {
  echo "lint:go-tidy: no go.mod tracked, skipped"
  exit 0
}
command -v go > /dev/null || {
  echo "lint:go-tidy: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
count=0
while IFS= read -r m; do
  [[ -n ${m} ]] || continue
  count=$((count + 1))
  if ! (cd "$(dirname "${m}")" && go mod tidy -diff); then
    echo "lint:go-tidy: ${m} does not match the source — apply the diff above" >&2
    echo "  mise run fix:go-tidy" >&2
    exit 1
  fi
done <<< "${mods}"
echo "lint:go-tidy: ${count} module(s) match their source"
'''

[tasks."fix:go-tidy"]
description = "Rewrite go.mod and go.sum to match the source (go mod tidy)"
dir = "{{cwd}}"
# The write-mode sibling, and the same command without -diff. Safe by the
# fix:* rule — tidy adds what the source imports and removes what it does
# not, so it is derivable from the tree rather than a judgement call.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n ${mods} ]] || {
  echo "fix:go-tidy: no go.mod tracked, skipped"
  exit 0
}
while IFS= read -r m; do
  [[ -n ${m} ]] || continue
  (cd "$(dirname "${m}")" && go mod tidy)
done <<< "${mods}"
'''

[tasks."lint:go-fuzz-seeds"]
description = "Every Go fuzz target compiles and its seed corpus passes, race detector on"
dir = "{{cwd}}"
# CGO_ENABLED=1 here and only here, the same measured exception stele
# documents for its own test task: -race requires cgo on linux (the gate
# runner) while darwin tolerates it without, so a local run would stay
# green over a red one in CI. Repos that ship CGO_ENABLED=0 binaries keep
# doing so — this is a test instrument, not a build setting.
env = { CGO_ENABLED = "1" }
# The gate half of Go fuzzing (#445), and the reason it is a belt task
# rather than something a repo's own `test` remembers to cover: a seed
# corpus IS the regression suite. When the cron finds a crasher, the
# engine writes it into testdata/fuzz/<Target>/, and from that moment
# plain `go test` fails on it — proven on a probe, where a 15s run found
# an invalid-UTF-8 reverse, wrote the input, and the next ordinary test
# run went red on it. So the seeds must run under the org's enforcement,
# not under whatever a repo chose to define as `test` (which `ci` runs
# only if it exists).
#
# Deterministic by construction: without -fuzz the engine never
# generates, never writes, and only replays the committed corpus. The
# generated corpus lives in $GOCACHE/fuzz and is not consulted here.
#
# -race costs 0.33s -> 1.35s on a seed corpus (measured), which is
# nothing, and the seeds are exactly the inputs already known to reach
# interesting code. Determinism survives it: the detector reports races
# it observes and invents none.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n ${mods} ]] || {
  echo "lint:go-fuzz-seeds: no go.mod tracked, skipped"
  exit 0
}
command -v go > /dev/null || {
  echo "lint:go-fuzz-seeds: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
total=0
while IFS= read -r m; do
  [[ -n ${m} ]] || continue
  d=$(dirname "${m}")
  n=$( (cd "${d}" && go test -list '^Fuzz' ./... 2> /dev/null) | grep -c '^Fuzz' || true)
  [[ ${n} -gt 0 ]] || continue
  total=$((total + n))
  (cd "${d}" && go test -race -run '^Fuzz' ./...)
done <<< "${mods}"
[[ ${total} -gt 0 ]] || {
  echo "lint:go-fuzz-seeds: no Go fuzz targets, skipped"
  exit 0
}
echo "lint:go-fuzz-seeds: ${total} target(s) built, seed corpora clean"
'''

[tasks."fix:go"]
description = "Apply golangci-lint's auto-fixes and rewrite Go to canonical format (gofumpt, gci)"
dir = "{{cwd}}"
# The write-mode sibling. `run --fix` applies only fixes the analyzers
# themselves mark safe, and `fmt` applies the formatters — the same
# no-unsafe rule as fix:biome and fix:python: a fixer must be runnable
# without reading its diff first.
#
# Same per-checkout cache as lint:go (#572), and the reason it is an
# `export` rather than a `VAR=x cmd` prefix is here: a prefix binds to one
# command, so `fmt` after the && would have run on the user-global cache.
# A fixer reading another checkout's analysis state would WRITE that
# mistake into this one's source.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n ${mods} ]] || {
  echo "fix:go: no go.mod tracked, skipped"
  exit 0
}
command -v go > /dev/null || {
  echo "fix:go: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
while IFS= read -r m; do
  [[ -n ${m} ]] || continue
  d=$(dirname "${m}")
  cache="$(cd "${d}" && git rev-parse --absolute-git-dir)/golangci-lint"
  (cd "${d}" && export GOLANGCI_LINT_CACHE="${cache}" && golangci-lint run --fix && golangci-lint fmt)
done <<< "${mods}"
'''

[tasks."audit:go-vulns"]
description = "Go vulnerability scan, call-graph aware (govulncheck — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: govulncheck fetches https://vuln.go.dev at run
# time, and a new advisory fails unrelated work — a property of the
# feed, not the diff. Call-graph aware, so strictly more precise than
# dependency matching: it reds only when a vulnerable FUNCTION is
# reachable from this module's code, which is the honesty the VEX
# triage wants as input. govulncheck is a repo-side build input (the
# cargo-fuzz pattern — it has no binary releases and no aqua package,
# so the go: backend builds it from a pinned source version with the
# repo's own pinned toolchain); asserted with the remedy, never
# installed mid-run.
#
# THE EXIT IS A WRITTEN DECISION, NEVER AN OVERRIDE (#615) — the Rust
# leg's contract, now this leg's too. A reachable advisory with no fixed
# version was previously a permanent red no decision could clear: the
# publish re-runs at the tagged checkout with the tag's pinned belt, so
# the release was unrescuable and the tag burned (stele v0.17.0,
# GO-2026-5932). The exit is the canon's OpenVEX decisions, joined on
# the exact module@version, printed with the statement each one cites.
#
# THE JUDGMENT IS stele's (#640, stele#221) — `assert advisories`, one
# line, offline from the forge. The hand-maintained Python join is
# deleted with this edit: one rule with two implementations was the
# #392 defect class, and the released join is the oracle. What is left
# here is the loop and the scanner's own exit, which carry no judgment.
# The spec lives in stele's docs/vex-join.md; this task states no rule
# of its own.
#
# -json, and the exit code is NOT the verdict: `govulncheck -json` exits
# 0 whether or not it found anything (measured, v1.7.0 — 21 findings,
# exit 0), so the verdict is computed from the findings. The scanner's
# exit code is still checked, because a scan that FAILED to build exits
# nonzero having emitted a partial stream, and that is not a clean scan.
# Hence the explicit status capture rather than a pipe: under pipefail a
# broken scan would reach the judge as a truncated stream first.
#
# The subject is the module PATH, read from the go.mod being scanned —
# a report names what it judged, and the directory is a fact about this
# checkout's layout, not about the module.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n ${mods} ]] || {
  echo "audit:go-vulns: no go.mod tracked, skipped"
  exit 0
}
command -v go > /dev/null || {
  echo "audit:go-vulns: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
command -v govulncheck > /dev/null || {
  echo "audit:go-vulns: govulncheck missing — pin it as a build input:" >&2
  echo '  mise.toml: "go:golang.org/x/vuln/cmd/govulncheck" = "<version>"' >&2
  exit 1
}
command -v stele > /dev/null || {
  echo "audit:go-vulns: stele missing from the belt" >&2
  exit 1
}
vex="${ORG_CANON_DIR}/security/vex"
[[ -d ${vex} ]] || {
  echo "audit:go-vulns: ${vex} is not a directory, so the org's triage decisions cannot be read" >&2
  echo "  the org belt did not arrive: CI sets MISE_GLOBAL_CONFIG_FILE, locally a ~/.config/mise/conf.d symlink into a canon checkout" >&2
  exit 1
}
scan=$(mktemp)
trap 'rm -f "${scan}"' EXIT
while IFS= read -r m; do
  [[ -n ${m} ]] || continue
  d=$(dirname "${m}")
  status=0
  (cd "${d}" && govulncheck -json ./...) > "${scan}" || status=$?
  if [[ ${status} -ne 0 ]]; then
    echo "audit:go-vulns: ${d}: govulncheck exited ${status} — the scan did not complete" >&2
    exit "${status}"
  fi
  module=$(awk '/^module /{print $2; exit}' "${m}")
  [[ -n ${module} ]] || {
    echo "audit:go-vulns: ${m} names no module" >&2
    exit 1
  }
  stele assert advisories --scan "${scan}" --vex "${vex}" --subject "${module}"
done <<< "${mods}"
'''

[tasks."audit:blast-radius"]
description = "Advisory blast radius over every published SBOM (stele assert — network, canon only)"
dir = "{{cwd}}"
# The L2 triage mechanism at scale: which published releases ship an
# affected package? The walk, the verify-before-trust of every SBOM
# asset, the osv scan, the exact (advisory, package, version) VEX join,
# the canary that proves the scanner can see, and the loud zero-package
# failure mode all live in stele (docs/assert-policy-schema.md there);
# the org's conventions — ecosystem classes, the canary pin, where
# decisions live — are data in slsa/assert-policy.json. Red means NEW
# AND UNDECIDED; a decision matching no finding surfaces as stale, a
# retirement candidate.
#
# Canon-only, on the family's identity guard (#738): security/vex/ is
# what this leg READS, so on the canon its absence is a red that names
# it — never the skip that a directory-shaped guard used to buy.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:blast-radius: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
missing=""
for f in slsa/assert-policy.json security/vex; do
  [[ -e ${f} ]] || missing="${missing} ${f}"
done
[[ -z ${missing} ]] || {
  echo "audit:blast-radius: on the canon, and input(s) this leg reads are missing:${missing}" >&2
  echo "  a canon-only audit reds on a missing input, never skips (#738)." >&2
  exit 1
}
command -v osv-scanner > /dev/null || {
  echo "audit:blast-radius: osv-scanner missing from the belt" >&2
  exit 1
}
command -v stele > /dev/null || {
  echo "audit:blast-radius: stele missing from the belt" >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:blast-radius walks an org the environment names (#579) — Actions sets it; a local run exports it}"
stele assert blast-radius \
  --org "${GITHUB_REPOSITORY_OWNER}" \
  --policy slsa/assert-policy.json \
  --vex security/vex
'''

[tasks."audit:attestations"]
description = "Nothing ships unattested: every published artifact carries its full evidence set (network, canon only)"
dir = "{{cwd}}"
# The difference between "we attest" and "nothing ships unattested"
# (#117). The walk — release evidence contracts (manifest-first, the
# publish.yml-at-the-tag adapter for history), store-resident VSAs
# (#209), the continuous-digest and base-approval halves, the
# legacy/debt/burned taxonomy — is stele's evidence walk, specified in
# its docs/assert-policy-schema.md; the org's conventions are data in
# slsa/assert-policy.json and security/attestation-debt.txt. A zero
# population or a missed canary is CANNOT_JUDGE, never PASS: the
# 200-with-empty-body degraded read the 2026-08-17 outage served is
# answered by refusing to judge (stele#69). The store halves verify
# cryptographically, so the trusted root is fetched here — the trust
# boundary is the caller\'s to state (stele#19 tracks in-tool fetch).
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:attestations: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
missing=""
for f in slsa/assert-policy.json slsa/verify-policy.json; do
  [[ -e ${f} ]] || missing="${missing} ${f}"
done
[[ -z ${missing} ]] || {
  echo "audit:attestations: on the canon, and input(s) this leg reads are missing:${missing}" >&2
  echo "  a canon-only audit reds on a missing input, never skips (#738)." >&2
  exit 1
}
command -v gh > /dev/null || {
  echo "audit:attestations: gh missing" >&2
  exit 1
}
command -v stele > /dev/null || {
  echo "audit:attestations: stele missing from the belt" >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:attestations walks an org the environment names (#579) — Actions sets it; a local run exports it}"
stele assert evidence \
  --org "${GITHUB_REPOSITORY_OWNER}" \
  --policy slsa/assert-policy.json \
  --depth full \
  --verify-policy slsa/verify-policy.json
'''

[tasks."audit:source-vsa"]
description = "Every protected-ref revision since genesis has a verified chain link (network, canon only)"
dir = "{{cwd}}"
# The source track's coverage audit (#207): the emitter is per-push, so
# a lapse leaves a hole in the chain rather than going red anywhere —
# this is the cadence that finds the holes, the attestation-debt pattern
# for evidence gaps. The whole walk is `stele assert chains` (stele#94):
# the population is the org listing, never the enrolled set (#266); a
# repository with no founded chain is a finding unless a declared
# exception in slsa/assert-policy.json (chains.exceptions) names it
# with a written reason — and an exception excuses absence alone,
# structurally never a founded chain's defect. Each founded chain is
# walked cloneless over the forge's API and verified end to end per
# protected branch through the verify engine, the same binary a
# stranger runs. A zero population is CANNOT_JUDGE, never PASS
# (stele#69). The trusted root resolves through TUF from the anchor
# pinned in the binary; the spec is stele's docs.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:source-vsa: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
missing=""
for f in slsa/assert-policy.json slsa/verify-policy.json; do
  [[ -e ${f} ]] || missing="${missing} ${f}"
done
[[ -z ${missing} ]] || {
  echo "audit:source-vsa: on the canon, and input(s) this leg reads are missing:${missing}" >&2
  echo "  a canon-only audit reds on a missing input, never skips (#738)." >&2
  exit 1
}
command -v stele > /dev/null || {
  echo "audit:source-vsa: stele missing from the belt" >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:source-vsa walks an org the environment names (#579) — Actions sets it; a local run exports it}"
stele assert chains \
  --org "${GITHUB_REPOSITORY_OWNER}" \
  --policy slsa/assert-policy.json \
  --verify-policy slsa/verify-policy.json
'''

[tasks."audit:badges"]
description = "Every README shield re-checked against its source of truth (network, canon only)"
dir = "{{cwd}}"
# A badge is a fact computed by somebody else's service, earned once and
# then trusted forever — exactly the claim shape this org refuses
# everywhere else (#215; audit:attestations is the pattern). This walks
# every org repo's README and, for every shield found, asks the issuer
# whether it still agrees. Loud by construction: an unrecognised shield
# fails (a badge nobody can check is a badge nobody is checking), an
# issuer returning nothing fails (a check that reads nothing must never
# report clean), and a Scorecard shield with no floor line fails. The
# Scorecard leg is a per-repo ratcheted floor (security/
# scorecard-floors.txt) — regression is the signal, never the absolute.
#
# Presence is asserted through the derivation, not re-derived here
# (#316 finding 5): each repo's badge block must be fix:badges' render
# (the markers prove it; lint:badges in that repo's own gate proves the
# render matches its tree), so a shield this walk does not see is one
# the derivation said does not apply — never one nobody looked for.
# .badge-states' declared lines (pending a human step / exemplary, no
# data by construction) are reported by name, so a Monday summary reads
# as state, not as expected-red noise (dependency-track.md:46).
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:badges: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
# The ratcheted floors are this leg's own data, and the guard above no
# longer stands in for them (#738): a Scorecard shield judged against a
# floor file that is not there is a badge nobody is checking.
floors="security/scorecard-floors.txt"
[[ -f ${floors} ]] || {
  echo "audit:badges: on the canon, and the input this leg reads is missing: ${floors}" >&2
  echo "  a canon-only audit reds on a missing input, never skips (#738)." >&2
  exit 1
}
command -v gh > /dev/null || {
  echo "audit:badges: gh missing" >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:badges walks an org the environment names (#579) — Actions sets it; a local run exports it}"
# The shield endpoints are identity, not scope (#579): a shield is only
# checkable when it points at this org's own projects on each issuer,
# and fix:badges renders the same URLs — the declaration is what both
# legs agree a shield is.
. "${ORG_BELT_DIR}/identity.sh"
sc_prefix=$(org_identity shield-scorecard)
wf_prefix=$(org_identity shield-actions)
ghcr_prefix=$(org_identity shield-ghcr)
cc_prefix=$(org_identity shield-codecov)
cc_api=$(org_identity shield-codecov-api)
repos=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/repos" --paginate --jq '.[].name')
failed=""
checked=0
note() {
  echo "audit:badges: ${1}"
  [[ -n ${GITHUB_STEP_SUMMARY:-} ]] && echo "- ${1}" >> "${GITHUB_STEP_SUMMARY}" || true
}
while read -r repo; do
  [[ -n ${repo} ]] || continue
  readme=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/readme" --jq '.content' 2> /dev/null || true)
  if [[ -z ${readme} ]]; then
    note "${repo}: no README, nothing asserted"
    continue
  fi
  body=$(base64 -d <<< "${readme}")
  # Adoption is asserted, not assumed (#316 finding 5): the block must
  # be fix:badges' render — the repo's own gate (lint:badges) proves
  # the render matches its tree, so this audit never re-derives; it
  # only needs the markers to exist to know a missing shield means
  # "the derivation said not applicable" rather than "nobody looked".
  if ! grep -q "<!-- badges:begin -->" <<< "${body}"; then
    failed="${failed} ${repo}(badge block not machine-rendered — no badges:begin marker; presence-blindness is only closed where fix:badges owns the block)"
    continue
  fi
  # Declared states: the debt lines the render could not derive.
  states=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/contents/.badge-states" --jq '.content' 2> /dev/null | base64 -d 2> /dev/null | grep -v "^#" || true)
  while read -r sk sv; do
    [[ -n ${sk} ]] || continue
    case "${sv}" in
      pending) note "${repo}: ${sk} pending a human step (declared)" ;;
      exemplary) note "${repo}: ${sk} exemplary, no data by construction (declared)" ;;
      # Any other value is not one of the two declared states, so it
      # claims nothing and the shield walk below judges the badge.
      *) ;;
    esac
  done <<< "${states}"
  # Shields are markdown images; comments are stripped first so a
  # deferred (commented-out) badge line is not audited as live. The
  # strip must handle a comment that opens and closes on ONE line —
  # every marker and every pending line is exactly that shape, and a
  # sed range address cannot end on the line it started on, so the
  # first `<!-- badges:begin -->` used to swallow every shield down to
  # the next `-->`: the walk read 25 live shields org-wide as zero and
  # reported clean. Inline comments are cut in place; only a genuinely
  # unterminated one opens the multi-line state.
  urls=$(awk '{
    while (match($0, /<!--.*-->/)) { $0 = substr($0, 1, RSTART - 1) substr($0, RSTART + RLENGTH) }
    if (inc) { if (sub(/.*-->/, "")) inc = 0; else next }
    if (sub(/<!--.*/, "")) inc = 1
    print
  }' <<< "${body}" | grep -oE '!\[[^]]*\]\([^)]+\)' | sed -E 's/^!\[[^]]*\]\(([^) ]+).*\)$/\1/' || true)
  if [[ -z ${urls} ]]; then
    # fix:badges renders the three SLSA shields unconditionally, so a
    # rendered block can never be shield-free: empty means the block
    # was truncated or the strip ate it, never "nothing applies".
    failed="${failed} ${repo}(badge block rendered no shields — the derivation always emits the SLSA row, so this block is truncated or unparsable)"
    continue
  fi
  while read -r url; do
    [[ -n ${url} ]] || continue
    checked=$((checked + 1))
    case "${url}" in
      "${sc_prefix}"/*/badge)
        proj="${url#https://api.scorecard.dev/projects/}"
        proj="${proj%/badge}"
        score=$(curl -sf "https://api.scorecard.dev/projects/${proj}" | jq -r '.score // empty')
        if [[ -z ${score} ]]; then
          failed="${failed} ${repo}(scorecard: issuer returned no score — a shield over nothing)"
          continue
        fi
        floor=$(awk -v r="${repo}" '$1 == r {print $2}' "${floors}")
        if [[ -z ${floor} ]]; then
          failed="${failed} ${repo}(scorecard: no floor in ${floors} — an unfloored badge is unwatched)"
        elif awk -v s="${score}" -v f="${floor}" 'BEGIN {exit !(s < f)}'; then
          failed="${failed} ${repo}(scorecard: ${score} below floor ${floor} — regression)"
        elif awk -v s="${score}" -v f="${floor}" 'BEGIN {exit !(s >= f + 0.3)}'; then
          note "${repo}: scorecard ${score} well above floor ${floor} — ratchet: raise the floor"
        else
          note "${repo}: scorecard ${score} (floor ${floor})"
        fi
        ;;
      https://www.bestpractices.dev/projects/*/badge | https://bestpractices.dev/projects/*/badge)
        id="${url##*/projects/}"
        id="${id%/badge}"
        bp=$(curl -sf "https://www.bestpractices.dev/projects/${id}.json" || true)
        if [[ -z ${bp} ]]; then
          failed="${failed} ${repo}(bestpractices: issuer returned nothing for project ${id})"
        elif ! jq -e '(.badge_percentage_0 // 0) >= 100' <<< "${bp}" > /dev/null; then
          failed="${failed} ${repo}(bestpractices: passing percentage below 100)"
        elif jq -e '[.lost_baseline_1_at, .lost_baseline_2_at, .lost_baseline_3_at] | any(. != null)' <<< "${bp}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(bestpractices: issuer records a LOST baseline)"
        else
          note "${repo}: bestpractices ${id} passing"
        fi
        ;;
      https://www.bestpractices.dev/projects/*/baseline | https://bestpractices.dev/projects/*/baseline)
        # The OSPS Baseline shield on the same entry. Its own truth is
        # the achieved/lost pair, not the metal percentage: a shield
        # claiming a level the issuer never recorded, or one it has
        # since withdrawn, is the drift #168 watches for.
        id="${url##*/projects/}"
        id="${id%/baseline}"
        bp=$(curl -sf "https://www.bestpractices.dev/projects/${id}.json" || true)
        if [[ -z ${bp} ]]; then
          failed="${failed} ${repo}(baseline: issuer returned nothing for project ${id})"
        elif ! jq -e '[.achieved_baseline_1_at, .achieved_baseline_2_at, .achieved_baseline_3_at] | any(. != null)' <<< "${bp}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(baseline: shield worn but the issuer records no achieved level)"
        elif jq -e '[.lost_baseline_1_at, .lost_baseline_2_at, .lost_baseline_3_at] | any(. != null)' <<< "${bp}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(baseline: issuer records a LOST level)"
        else
          lvl=$(jq -r '[.achieved_baseline_3_at, .achieved_baseline_2_at, .achieved_baseline_1_at] | map(. != null) | index(true) | if . == 0 then 3 elif . == 1 then 2 else 1 end' <<< "${bp}")
          note "${repo}: OSPS Baseline level ${lvl} achieved"
        fi
        ;;
      https://api.reuse.software/badge/*)
        proj="${url#https://api.reuse.software/badge/}"
        st=$(curl -sf "https://api.reuse.software/status/${proj}" | jq -r '.status // empty')
        if [[ ${st} != "compliant" ]]; then
          failed="${failed} ${repo}(reuse: status '${st:-none}' is not compliant)"
        else
          note "${repo}: reuse compliant"
        fi
        ;;
      https://img.shields.io/endpoint?url=*)
        # A measured claim (#540, stele#5's endpoint addendum): the
        # badge is a render of the judgment `stele level` published,
        # so there is no value here to cross-check — the only thing
        # this leg can honestly ask is whether the published document
        # is live and shield-shaped. Level truth belongs to the
        # repository's own `level` stub, which publishes it, and to
        # the canon's `level-assert.yml`, which reds when a published
        # board disagrees with the org measurement (#554); a stale or
        # missing document is the finding here, never a number
        # disagreeing with a table.
        doc="${url#https://img.shields.io/endpoint?url=}"
        doc="${doc//%3A/:}"
        doc="${doc//%2F//}"
        sj=$(curl -sf "${doc}" || true)
        if [[ -z ${sj} ]]; then
          failed="${failed} ${repo}(level-shield: published judgment ${doc} unreadable — the badge renders nothing)"
        elif ! jq -e '.schemaVersion == 1 and .label and .message' > /dev/null 2>&1 <<< "${sj}"; then
          failed="${failed} ${repo}(level-shield: ${doc} is not a shields endpoint document)"
        else
          shield=$(jq -r '.label + " " + .message' <<< "${sj}")
          note "${repo}: level shield ${shield} published and live"
        fi
        ;;
      "${wf_prefix}"/*/actions/workflows/*/badge.svg)
        wfp="${url#"${wf_prefix}"/}"
        wfr="${wfp%%/*}"
        wfn="${wfp##*/workflows/}"
        wfn="${wfn%/badge.svg}"
        # A badge.svg with no ?branch= renders the DEFAULT branch's
        # status, so the leg must ask the same question: an unfiltered
        # run query answers "newest run on any branch", which makes a
        # red PR-branch run read as a lying shield while the shield is
        # honestly green (observed on signer during #354, latent since
        # #322). Default branch read from the API, never assumed main.
        wfb=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${wfr}" --jq '.default_branch // empty' 2> /dev/null || true)
        if [[ -z ${wfb} ]]; then
          failed="${failed} ${repo}(workflow-shield: could not read ${wfr}'s default branch)"
          continue
        fi
        conc=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${wfr}/actions/workflows/${wfn}/runs?per_page=1&status=completed&branch=${wfb}" \
          --jq '.workflow_runs[0].conclusion // empty' 2> /dev/null || true)
        if [[ -z ${conc} ]]; then
          failed="${failed} ${repo}(workflow-shield: ${wfn} has no completed runs on ${wfb} — a status badge over nothing)"
        elif [[ ${conc} != "success" ]]; then
          failed="${failed} ${repo}(workflow-shield: ${wfn} latest completed run on ${wfb} is ${conc})"
        else
          note "${repo}: workflow ${wfn} green on ${wfb}"
        fi
        ;;
      https://img.shields.io/badge/fair--software.eu-*)
        # Computed by fix:badges dot-by-dot; this leg re-checks the
        # three contingent dots against what the same README shows —
        # registry (dot 3: any registry shield), citation (dot 4:
        # CITATION.cff), checklist (dot 5: a live bestpractices
        # shield). A static 5/5 image fails here (#316 addendum E).
        dots="${url#*fair--software.eu-}"
        dots="${dots%-*}"
        e3="%E2%97%8B"
        grep -qE 'img.shields.io/(crates|npm)/|img.shields.io/badge/ghcr' <<< "${urls}" && e3="%E2%97%8F"
        e4="%E2%97%8B"
        gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/contents/CITATION.cff" > /dev/null 2>&1 && e4="%E2%97%8F"
        e5="%E2%97%8B"
        grep -q 'bestpractices.dev/projects/' <<< "${urls}" && e5="%E2%97%8F"
        expect="%E2%97%8F%20%E2%97%8F%20${e3}%20${e4}%20${e5}"
        if [[ ${dots} != "${expect}" ]]; then
          failed="${failed} ${repo}(fair-software: dots ${dots} disagree with the repo's own evidence ${expect})"
        else
          note "${repo}: fair-software dots agree with the evidence"
        fi
        ;;
      https://zenodo.org/badge/DOI/*)
        doi="${url#https://zenodo.org/badge/DOI/}"
        doi="${doi%.svg}"
        if ! curl -sfI "https://doi.org/${doi}" > /dev/null; then
          failed="${failed} ${repo}(doi: ${doi} does not resolve)"
        else
          note "${repo}: DOI resolves"
        fi
        ;;
      https://img.shields.io/crates/v/* | https://img.shields.io/docsrs/*)
        crate="${url##*/}"
        crate="${crate%.svg}"
        if ! curl -sf "https://crates.io/api/v1/crates/${crate}" > /dev/null; then
          failed="${failed} ${repo}(crates: ${crate} not on crates.io)"
        else
          note "${repo}: crate ${crate} exists"
        fi
        ;;
      https://img.shields.io/npm/v/*)
        pkg="${url#https://img.shields.io/npm/v/}"
        pkg="${pkg%.svg}"
        if ! curl -sf "https://registry.npmjs.org/${pkg//%2F//}" > /dev/null; then
          failed="${failed} ${repo}(npm: package not on the registry)"
        else
          note "${repo}: npm package exists"
        fi
        ;;
      "${ghcr_prefix}"*)
        # The shield names an image; ask GitHub whether that package
        # exists. The old leg HEAD-requested the org packages page,
        # which returns 200 for ANY org that exists — a check that
        # reads nothing (#316 addendum C). The anonymous REST endpoint
        # 401s even for public containers, so this goes through gh;
        # the cron token carries packages: read for it.
        img="${url#"${ghcr_prefix}"}"
        img="${img%%-blue*}"
        img="${img//--/-}"
        if ! gh api "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${img}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(ghcr: package '${img}' does not exist in the org registry)"
        else
          note "${repo}: ghcr package ${img} exists"
        fi
        ;;
      "${cc_prefix}"/*/graph/badge.svg | "${cc_prefix}"/*/branch/*/graph/badge.svg)
        cc="${url#"${cc_prefix}"/}"
        cc="${cc%%/*}"
        if curl -sf "${cc_api}/${cc}" | jq -e '.name' > /dev/null 2>&1; then
          note "${repo}: codecov live"
        else
          failed="${failed} ${repo}(codecov: issuer has no data for ${cc} and no declared state covers it)"
        fi
        ;;
      *)
        # Not silently skipped, by design: silently skipping reproduces
        # the exact gap this audit closes.
        failed="${failed} ${repo}(unrecognised shield — nobody is checking it: ${url})"
        ;;
    esac
  done <<< "${urls}"
done <<< "${repos}"
if [[ -n ${failed} ]]; then
  echo "audit:badges: shield defects:${failed}" >&2
  echo "  every shield must agree with its source of truth; fix the fact, the floor, or the badge" >&2
  exit 1
fi
# The same law the legs enforce, applied to the walk itself: a check
# that read nothing must never report clean. The canon alone renders
# three SLSA shields, so zero here is always a broken walk, never a
# quiet org.
if ((checked == 0)); then
  echo "audit:badges: walked the org and checked zero shields — the walk is broken, not the org" >&2
  exit 1
fi
echo "audit:badges: ${checked} shield(s) checked, all agree with their issuers"
'''

[tasks."audit:links"]
description = "Check links in tracked markdown (lychee — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: link liveness is a property of the internet, not the
# diff. Runs on demand locally and on a schedule in CI — in the canon's
# audit.yml and, since #681, in repo-audit.yml for every consumer too:
# this walk is `git ls-files` in whatever repository it runs in, so the
# canon scheduling it only ever checked the canon.
#
# --config, and it is load-bearing rather than tidy: lychee
# auto-discovers a `lychee.toml` from the working directory, so without
# an explicit config a consumer's own file silently outranks the belt —
# `exclude = [".*"]` beside a README buys a green run over an unchecked
# tree. An explicit --config replaces that discovery (measured both
# directions, #681). The org's link policy — the scaffold placeholder
# exclusions above all — therefore lives in the belt's lychee.toml, and
# `.lycheeignore`, which lychee reads independently of --config, stays
# the repo's per-link escape.
# --include-fragments: without it lychee verifies that a page exists and
# never that the `#anchor` on the end of the link points at anything, so
# every deep link into a heading was half-checked (#82 max audit). A
# renamed heading is the common way a link rots while still returning
# 200. Enabled at zero cost — measured on this tree at adoption, it adds
# no findings. It stays a FLAG rather than moving into the delivered
# config with the exclusions: the config form takes an enum
# (none|anchor-only|text-only|full) and the bare flag's default could
# not be shown equal to any single one of them on this tree, so
# re-encoding it would have changed what the audit means as a side
# effect of tidying where it is written.
run = '''
files=$(git ls-files ":!vendor/**" "*.md" "*.markdown")
if [[ -n ${files} ]]; then xargs lychee --no-progress --include-fragments --config "${ORG_BELT_DIR}/lychee.toml" <<< "${files}"; else echo "audit:links: no markdown tracked, skipped"; fi
'''

[tasks."audit:actions"]
description = "zizmor online + auditor persona — the audits the gate cannot run"
dir = "{{cwd}}"
# The gate runs zizmor --offline, which necessarily skips every audit that
# needs the GitHub API: impostor-commit, known-vulnerable-actions,
# ref-confusion, typosquat-uses, stale-action-refs. Those are exactly the
# checks that catch a compromised or impersonated action, so they run here
# on a schedule instead of nowhere. Auditor persona adds secrets-outside-env
# and misfeature. Needs GH_TOKEN.
#
# FAIL CLOSED ON BLINDNESS (#310 finding 3, the claims.sh/#240 pattern):
# without a token zizmor silently degrades to offline — skipping every
# audit this task exists to run — and still prints "No findings to
# report" with exit 0, distinguishable only by a non-fatal WARN
# (measured on zizmor 1.29.0). So the token is asserted up front, and
# the offline-degradation WARN is fatal — a token that is present but
# rejected degrades the same way, and only zizmor knows.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "audit:actions: no workflows, skipped"
  exit 0
}
[[ -n ${GH_TOKEN:-} ]] || {
  echo "audit:actions: GH_TOKEN is unset — the offline run skips every" >&2
  echo "  API-backed audit this task exists for; refusing to pass blind" >&2
  exit 1
}
err=$(mktemp)
status=0
zizmor --persona=auditor .github/workflows/ 2> "${err}" || status=$?
cat "${err}" >&2
if grep -q "running in offline mode" "${err}"; then
  echo "audit:actions: zizmor degraded to offline despite GH_TOKEN —" >&2
  echo "  the online audits did not run; a green result would be blind" >&2
  exit 1
fi
exit "${status}"
'''

[tasks."audit:template-pins"]
description = "Warn when the template pin misses shipped canon changes (scheduled, not the gate)"
dir = "{{cwd}}"
# The judgement call lint:template-pins deliberately leaves out, measured
# by the right yardstick. Days-behind is a proxy — the #110 incident was a
# ONE-day lag that already predated three shipped fixes, so no day
# threshold catches it. What makes a stale pin dangerous is commits between
# the pin and HEAD touching what the pin actually delivers: the shared
# workflows and the toolbelt (one SHA pins both). Diff those paths; HEAD
# moving on docs, rulesets or the profile README is not staleness worth a
# bump. audit:*, not lint:*: pin-vs-HEAD drift is a property of time
# passing on main, not of the diff under review.
run = '''
compgen -G "workflow-templates/*.y*ml" > /dev/null || {
  echo "audit:template-pins: no workflow-templates/, skipped"
  exit 0
}
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
canon_re="${canon//./\\.}"
sha=$(grep -hoE "uses:[[:space:]]*${canon_re}/[^@]+@[0-9a-f]{40}" \
  workflow-templates/*.y*ml | grep -oE "[0-9a-f]{40}" | sort -u)
[[ -n ${sha} ]] || {
  echo "audit:template-pins: no org pins in templates, skipped"
  exit 0
}
pins=$(wc -l <<< "${sha}" | tr -d " ")
if [[ ${pins} -gt 1 ]]; then
  echo "audit:template-pins: templates pin more than one SHA (lint:template-pins should have failed)" >&2
  exit 1
fi
if ! git cat-file -e "${sha}^{commit}" 2> /dev/null; then
  echo "audit:template-pins: pinned SHA ${sha:0:8} not in local history (shallow clone?)" >&2
  exit 1
fi
drift=$(git diff --name-only "${sha}..HEAD" -- .github/workflows/ mise/)
if [[ -n ${drift} ]]; then
  # The post-release window (#290 finding 4, same shape as
  # audit:canon-pins): a release commit cannot pin itself (#227), so
  # right after a release the templates lawfully sit behind until
  # Renovate's chore(canon) bump lands. The grace is measured as
  # STALENESS DURATION, not releases-behind (#310 finding 1): the alarm
  # is "this pin has been catchable for over a day and nothing caught
  # it", so the clock starts at the EARLIEST tag newer than the pin — a
  # burst of releases inside one bot cycle is one short staleness, not
  # a multi-release alarm, while a week-old lag stays red no matter how
  # recent the newest tag is. All local: tags and dates are in the clone.
  pin_tag=$(git tag --points-at "${sha}" --list "v[0-9]*" | sed -n 1p)
  succ_tag=$(git tag --list "v[0-9]*" | sort -V \
    | awk -v p="${pin_tag}" '$0 == p { getline; print; exit }')
  if [[ -n ${pin_tag} && -n ${succ_tag} ]]; then
    age=$(($(date -u +%s) - $(git log -1 --format=%ct "${succ_tag}")))
    if [[ ${age} -lt 86400 ]]; then
      echo "audit:template-pins: post-release window — pin at ${pin_tag}, stale for $((age / 3600))h (since ${succ_tag})"
      echo "  the lag is structural (#227); Renovate's chore(canon) bump"
      echo "  closes it. Red only past the 24h grace (#290, #310)."
      exit 0
    fi
  fi
  echo "audit:template-pins: pin ${sha:0:8} misses shipped canon changes:" >&2
  git log --no-decorate --oneline "${sha}..HEAD" -- .github/workflows/ mise/ | sed "s/^/  /" >&2
  echo "  a repo standing up from the templates would not get these —" >&2
  echo "  bump the template pins to current canon (see #110, #111)." >&2
  exit 1
fi
echo "audit:template-pins: pin ${sha:0:8} carries all shipped workflow and belt changes"
'''

[tasks."audit:canon-pins"]
description = "Warn when any canon reference lags the canon's latest tag (scheduled, not the gate)"
dir = "{{cwd}}"
# The alarm on the mechanism: Renovate bumps canon references (#133), and
# when Renovate is paused, misconfigured or dead, nothing else goes red —
# the v0.16.1 release shipped without its VSA off a three-merge-stale pin
# with every board green. lint:canon-pins proves the references are
# bumpable (shape, offline); this compares each claimed version against
# the canon's latest tag. Network-bound and time-dependent, so audit:*,
# never the gate.
#
# THE POST-RELEASE WINDOW IS EXPECTED, NOT MALFUNCTION (#290 finding 4).
# A commit cannot contain its own release SHA (#227), so every canon
# release vN structurally ships self-references at vN-1, and consumers
# sit at vN-1 until Renovate's chore(canon) bump lands — which the notes
# deliberately skips, so the bump never triggers a release of its own.
#
# THE GRACE IS STALENESS DURATION, NOT RELEASES-BEHIND (#310 finding 1).
# Releases-behind is a proxy, the same mistake audit:template-pins names
# for days-behind: three canon releases cut in 73 minutes made a healthy
# consumer "three behind" for under an hour — hosted Renovate polls
# roughly hourly, and no reference can move faster than the next poll —
# while a pin one release behind for a week is the real v0.16.1 failure.
# So the alarm is on TIME SPENT CATCHABLE: the clock starts at the
# EARLIEST tag newer than the stale reference, and only past 24 hours is
# the state red. The 24-hour ceiling is generous by design — with
# prPriority and the first-party group (default.json) the bump lands in
# one bot cycle plus CI, measured 10-30 minutes — and exists so a Monday
# cron landing just after a Sunday release does not cry wolf. Red means
# Renovate paused, misconfigured or dead.
run = '''
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
canon_re="${canon//./\\.}"
tags=$(git ls-remote --tags "https://github.com/${canon}" "v[0-9]*" \
  | sed -n "s|.*refs/tags/\(v[0-9][0-9.]*\)$|\1|p" | sort -V)
latest=$(tail -1 <<< "${tags}")
[[ -n ${latest} ]] || {
  echo "audit:canon-pins: canon has no tags, skipped"
  exit 0
}
stale=""
found=0
claims=$(
  git ls-files ':!vendor/**' "*.yml" "*.yaml" | while IFS= read -r f; do
    grep -hE "^[^#]*uses:[[:space:]]*${canon_re}/" "${f}" \
      | grep -oE "# v[0-9][0-9.]*" | sed "s|# |${f}:|"
    if grep -qF "github.com/${canon}" "${f}"; then
      grep -E "^[[:space:]]*ref:[[:space:]]*v[0-9]" "${f}" \
        | grep -oE "v[0-9][0-9.]*" | sed "s|^|${f}:|"
    fi
  done
  git ls-files ':!vendor/**' "renovate.json" "*/renovate.json" ".github/renovate.json" \
    | while IFS= read -r f; do
      grep -oE "github>${canon_re}#v[0-9][0-9.]*" "${f}" \
        | sed "s|.*#|${f}:|"
    done
)
while IFS= read -r claim; do
  [[ -n ${claim} ]] || continue
  found=$((found + 1))
  v="${claim##*:}"
  [[ ${v} != "${latest}" ]] && stale="${stale} ${claim}"
done <<< "${claims}"
[[ ${found} -gt 0 ]] || {
  echo "audit:canon-pins: no canon references, skipped"
  exit 0
}
if [[ -n ${stale} ]]; then
  # Staleness duration per distinct stale version: the age of the
  # EARLIEST tag newer than it, via the API (public repo; unauthenticated
  # works) — the date arithmetic lives in jq because ISO parsing in bash
  # is not portable between GNU and BSD date. An unlookupable age fails
  # closed: unknown staleness is not fresh.
  # Unknown and stale are BOTH red, but they are different reds, and the
  # message must never assert a measurement that did not happen: this
  # leg once printed "over 24h" for a release 23 minutes old because the
  # age lookup had failed, not because any clock had run (#349 finding
  # 11). A finding's evidence is the read that produced it.
  red=0
  unmeasured=""
  oldest=0
  for v in $(tr " " "\n" <<< "${stale}" | sed "s|.*:||" | sort -uV); do
    [[ -n ${v} ]] || continue
    succ=$(awk -v p="${v}" '$0 == p { getline; print; exit }' <<< "${tags}")
    [[ -n ${succ} ]] || {
      unmeasured="${unmeasured} ${v}(no successor tag resolved)"
      continue
    }
    age=$(gh api "repos/${canon}/commits/${succ}" \
      --jq '((now - (.commit.committer.date | fromdateiso8601)) | floor)' \
      2> /dev/null || true)
    [[ ${age} =~ ^[0-9]+$ ]] || {
      unmeasured="${unmeasured} ${v}(age lookup failed: repos/${canon}/commits/${succ})"
      continue
    }
    [[ ${age} -ge 86400 ]] && red=1
    [[ ${age} -gt ${oldest} ]] && oldest="${age}"
  done
  if [[ ${red} -eq 0 && -z ${unmeasured} ]]; then
    echo "audit:canon-pins: post-release window — canon at ${latest}, references stale for $((oldest / 3600))h:${stale}"
    echo "  the lag is structural (#227): a commit cannot contain its own"
    echo "  release SHA, and Renovate's chore(canon) bump closes it in one"
    echo "  bot cycle. Red only past the 24h grace (#290, #310)."
    exit 0
  fi
  if [[ ${red} -eq 1 ]]; then
    echo "audit:canon-pins: references behind canon ${latest}, MEASURED over the 24h grace (oldest $((oldest / 3600))h):${stale}" >&2
    echo "  Outside the post-release grace — Renovate should have bumped" >&2
    echo "  these within one bot cycle. Check the Renovate dashboard and" >&2
    echo "  default.json's first-party rules before bumping by hand" >&2
    echo "  (#133, #290, #310)." >&2
  fi
  if [[ -n ${unmeasured} ]]; then
    echo "audit:canon-pins: staleness age UNKNOWN — the lookup failed, no duration was measured:${unmeasured}" >&2
    echo "  Unknown staleness is not fresh (fail closed), but it is not" >&2
    echo "  'over 24h' either — fix the read (GH_TOKEN present? API up?)" >&2
    echo "  and re-run before concluding anything about Renovate (#349 f11)." >&2
  fi
  exit 1
fi
echo "audit:canon-pins: ${found} canon references, all at ${latest}"
'''

[tasks."audit:org-pins"]
description = "Every org repo's canon references, checked from the canon (network, canon only)"
dir = "{{cwd}}"
# The vantage half of #310 finding 1: audit:canon-pins checks the repo
# it runs in, so a lagging consumer only reddens an audit inside that
# consumer — the signer sat three releases behind with the canon's own
# Monday audit green, because the canon checked only itself. This is
# the org-wide alarm, run where someone looks: enumerate the POPULATION
# (the #266 / repo-baseline pattern — a token that sees fewer repos
# than the org holds is a red run, not a quieter one), shallow-clone
# each repo, extract its canon references with exactly audit:canon-pins'
# patterns, and apply the same staleness-duration grace. A repo with no
# canon references at all is a finding too: every org repo pins the
# canon by construction (scaffold/), so zero references means the
# extraction — or the repo — is broken.
#
# The population contains a PRIVATE member (#692), and that splits the
# old single failure bucket in two. "I cloned it and found no canon
# reference" is a finding about the repository. "I could not read it"
# is a fact about the credential, and printing it as the first was the
# defect: an unauthenticated clone of a private member fails, and the
# task recorded `monumental-archive(clone)` — a finding against a repo
# whose only offence was being invisible to the token. Unreadable is
# CANNOT_JUDGE: still red, because unknown is not clean (#266), never
# a finding against the member.
#
# Every git read here is authenticated from GH_TOKEN, through an
# http.extraheader supplied in the ENVIRONMENT rather than on the
# command line or in a clone URL — the token never reaches argv, a
# config file, or the cloned repo's remote. The token must carry
# Contents: read across the org; without it this walk can only report
# that it could not look.
run = '''
# The identity guard is the whole guard here (#738): this leg reads no
# tree data at all — the org listing, the clones and the canon's own
# tags are its inputs — so it has no required input to red on.
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:org-pins: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
command -v gh > /dev/null || {
  echo "audit:org-pins: gh missing" >&2
  exit 1
}
[[ -n ${GH_TOKEN:-} ]] || {
  echo "audit:org-pins: GH_TOKEN is unset — CANNOT_JUDGE. This walk lists," >&2
  echo "  clones and reads tags for every member of the population, and a" >&2
  echo "  private member is invisible without a credential. A tokenless run" >&2
  echo "  would clone what it can and print the rest as findings against" >&2
  echo "  repositories it never saw (#692)." >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:org-pins walks an org the environment names (#579) — Actions sets it; a local run exports it}"
# Authenticate every github.com git read for the rest of this task.
# GIT_CONFIG_COUNT is git's environment-only config channel: no file is
# written and no argument carries the secret.
git_auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
export GIT_CONFIG_COUNT=1
export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
export GIT_CONFIG_VALUE_0="${git_auth_header}"
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
canon_re="${canon//./\\.}"
tags=$(git ls-remote --tags "https://github.com/${canon}" "v[0-9]*" \
  | sed -n "s|.*refs/tags/\(v[0-9][0-9.]*\)$|\1|p" | sort -V)
latest=$(tail -1 <<< "${tags}")
[[ -n ${latest} ]] || {
  echo "audit:org-pins: canon has no tags, skipped"
  exit 0
}
repos=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/repos" --paginate --jq '.[].name')
expected_repos=9
seen_repos=$(wc -w <<< "${repos}" | tr -d " ")
if [[ ${seen_repos} -ne ${expected_repos} ]]; then
  echo "audit:org-pins: token sees ${seen_repos} repos, population is ${expected_repos} —" >&2
  echo "  an unseen repo is unchecked, not clean (#290 finding 7)." >&2
  exit 1
fi
total=0
stale=""
failed=""
unreadable=""
for repo in ${repos}; do
  dir=$(mktemp -d)
  git clone -q --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/${repo}.git" "${dir}" || {
    unreadable="${unreadable} ${repo}"
    continue
  }
  claims=$(
    cd "${dir}" && git ls-files ':!vendor/**' "*.yml" "*.yaml" | while IFS= read -r f; do
      grep -hE "^[^#]*uses:[[:space:]]*${canon_re}/" "${f}" \
        | grep -oE "# v[0-9][0-9.]*" | sed "s|# |${repo}/${f}:|"
      if grep -qF "github.com/${canon}" "${f}"; then
        grep -E "^[[:space:]]*ref:[[:space:]]*v[0-9]" "${f}" \
          | grep -oE "v[0-9][0-9.]*" | sed "s|^|${repo}/${f}:|"
      fi
    done
    cd "${dir}" && git ls-files ':!vendor/**' "renovate.json" "*/renovate.json" ".github/renovate.json" \
      | while IFS= read -r f; do
        grep -oE "github>${canon_re}#v[0-9][0-9.]*" "${f}" \
          | sed "s|.*#|${repo}/${f}:|"
      done
  )
  count=$(grep -c . <<< "${claims}" || true)
  if [[ ${count} -eq 0 ]]; then
    failed="${failed} ${repo}(no canon references)"
    continue
  fi
  total=$((total + count))
  while IFS= read -r claim; do
    [[ -n ${claim} ]] || continue
    v="${claim##*:}"
    [[ ${v} != "${latest}" ]] && stale="${stale} ${claim}"
  done <<< "${claims}"
done
if [[ -n ${unreadable} ]]; then
  echo "audit:org-pins: CANNOT_JUDGE — the token could not read:${unreadable}" >&2
  echo "  This is a statement about the credential, NOT a finding against" >&2
  echo "  those repositories: the walk never saw them, so it knows nothing" >&2
  echo "  about their canon references. Red because unknown is not clean" >&2
  echo "  (#266). Grant the token Contents: read on every member of the" >&2
  echo "  population — a private member needs it (#692)." >&2
  exit 1
fi
if [[ -n ${failed} ]]; then
  echo "audit:org-pins: cloned clean and carry no canon reference:${failed}" >&2
  echo "  Every org repo pins the canon by construction (scaffold/), so" >&2
  echo "  zero references means the repo — or this extraction — is broken." >&2
  exit 1
fi
if [[ -n ${stale} ]]; then
  # Same staleness-duration grace as audit:canon-pins (#310 finding 1):
  # the clock starts at the earliest tag newer than the stale reference;
  # red only past 24h. Unknown age fails closed.
  red=0
  oldest=0
  for v in $(tr " " "\n" <<< "${stale}" | sed "s|.*:||" | sort -uV); do
    [[ -n ${v} ]] || continue
    succ=$(awk -v p="${v}" '$0 == p { getline; print; exit }' <<< "${tags}")
    [[ -n ${succ} ]] || {
      red=1
      continue
    }
    age=$(gh api "repos/${canon}/commits/${succ}" \
      --jq '((now - (.commit.committer.date | fromdateiso8601)) | floor)' \
      2> /dev/null || true)
    [[ ${age} =~ ^[0-9]+$ ]] || {
      red=1
      continue
    }
    [[ ${age} -ge 86400 ]] && red=1
    [[ ${age} -gt ${oldest} ]] && oldest="${age}"
  done
  if [[ ${red} -eq 0 ]]; then
    echo "audit:org-pins: post-release window — canon at ${latest}, ${total} references across ${seen_repos} repos, stale for $((oldest / 3600))h:${stale}"
    echo "  hosted Renovate polls roughly hourly; the bump lands in one bot"
    echo "  cycle (#227, #310). Red only past the 24h grace."
    exit 0
  fi
  echo "audit:org-pins: references behind canon ${latest} for over 24h:${stale}" >&2
  echo "  Renovate should have bumped these within one bot cycle — check" >&2
  echo "  that repo's Renovate dashboard and default.json's first-party" >&2
  echo "  rules before bumping by hand (#133, #290, #310)." >&2
  exit 1
fi
echo "audit:org-pins: ${total} canon references across ${seen_repos} repos, all at ${latest}"
'''

[tasks."audit:biome-rules"]
description = "Warn when biome ships nursery rules or domains the org does not name (scheduled, not the gate)"
dir = "{{cwd}}"
# The one direction the enable-list in mise/biome-org.json is fail-open.
# `preset: "all"` covers biome's eight stable groups and NOT nursery, and
# no bulk switch exists — naming each rule is the only mechanism biome
# offers (#445). Removals and renames are already fail-closed: biome
# hard-errors on an unknown key, so a graduated rule reddens the gate.
# An ADDED rule is the silent case, and this is its alarm.
#
# The rule list is not derivable offline: the binary ships no schema and
# `biome explain` answers one name at a time. So the pinned version's
# published schema is fetched — network, therefore audit:*, never the
# gate. Guarded on the config, so it skips clean in every repo but canon.
run = '''
cfg="${ORG_BELT_DIR}/biome-org.json"
[[ -f ${cfg} ]] || {
  echo "audit:biome-rules: no belt biome config, skipped"
  exit 0
}
version=$(biome --version | awk '{print $2}')
[[ ${version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
  # shellcheck disable=SC2016  # the backticks quote a command NAME in prose
  echo 'audit:biome-rules: cannot read a version from `biome --version`, skipped'
  exit 0
}
schema=$(mktemp)
curl -sfL "https://biomejs.dev/schemas/${version}/schema.json" -o "${schema}" || {
  echo "audit:biome-rules: schema for ${version} unreachable, skipped"
  exit 0
}
upstream=$(jq -r '(.["$defs"] // .definitions).Nursery.properties | keys[]
  | select(. != "recommended" and . != "preset")' "${schema}" | sort)
named=$(jq -r '.linter.rules.nursery // {} | keys[]' "${cfg}" | sort)
missing=$(comm -23 <(echo "${upstream}") <(echo "${named}"))
if [[ -n ${missing} ]]; then
  echo "audit:biome-rules: biome ${version} has nursery rules the org config does not name:" >&2
  # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
  sed 's/^/  /' <<< "${missing}" >&2
  echo "  add them to mise/biome-org.json — an unnamed nursery rule is simply not enforced" >&2
  exit 1
fi
# The same fail-open direction one level up (#695). A domain the table
# does not name is never written into the generated config, so its rules
# stay on under `preset: "all"` for every repo whatever they are — the
# very state #695 was filed about. `lint:biome-domains` re-derives the
# rows that ARE named and is offline; only the published schema knows
# that a new domain exists at all.
table="${ORG_BELT_DIR}/biome-domains.tsv"
if [[ -f ${table} ]]; then
  shipped=$(jq -r '(.["$defs"] // .definitions).RuleDomain.oneOf[].const' "${schema}" | sort)
  recorded=$(awk -F'\t' '!/^#/ && NF { print $1 }' "${table}" | sort)
  unnamed=$(comm -23 <(echo "${shipped}") <(echo "${recorded}"))
  if [[ -n ${unnamed} ]]; then
    echo "audit:biome-rules: biome ${version} has rule domains the org table does not name:" >&2
    # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
    sed 's/^/  /' <<< "${unnamed}" >&2
    echo "  add each to mise/biome-domains.tsv as identity or org — an unnamed domain runs" >&2
    echo "  its rules in every repo regardless of what the repo is" >&2
    exit 1
  fi
fi
count=$(wc -l <<< "${upstream}" | tr -d ' ')
echo "audit:biome-rules: all ${count} nursery rules of ${version} are named"
'''

[tasks."lint:trivy"]
description = "Misconfiguration + committed-secret scan (trivy)"
dir = "{{cwd}}"
# Deterministic scanners only: misconfig and secrets are properties of the
# diff. Vulnerability scanning is deliberately absent from the gate — it is
# non-deterministic CI (a new CVE fails unrelated PRs) and already enforced
# org-wide via Dependabot alerts/security updates + Renovate.
# The license scanner is off for a different reason, recorded because its
# absence otherwise reads as an oversight (#82 max audit): licences are
# already answered twice on the belt — lint:reuse runs the tool the
# api.reuse.software badge runs, over tracked files, and cargo-deny's
# licenses half decides the Rust closure from the lock. Trivy would be a
# third opinion on a question two checks already answer, and a heuristic
# one: it infers from package metadata and file text, where REUSE is
# declarative. One winner per rule family, so the family already has two
# and does not need a third.
# --exit-code 1: trivy exits 0 on findings by default.
# Tracked files only, like every belt linter — but trivy has no file-list
# mode, so the tracked set is materialised into a scratch tree and the
# walker runs there. Walking the working tree directly broke twice: the
# checked-out canon toolbelt (.org-toolbelt, the lefthook-remotes trap in
# a new costume) and — because ci runs lint:* and test concurrently — a
# race against cargo rewriting target/, which failed release-lab's gate
# on files that vanished mid-walk (#316 finding 4). The scratch tree
# holds only committed paths, so neither class of untracked content can
# ever be seen. --skip-dirs is gone because there is nothing to skip.
run = '''
scratch=$(mktemp -d)
trap 'rm -rf "${scratch}"' EXIT
# rsync, not cpio: BSD cpio refuses to extract through tracked
# symlinks (the canon's self-* workflow links), GNU cpio does not —
# rsync -l recreates them identically on both.
git ls-files -z | rsync -a0 --files-from=- . "${scratch}"
trivy fs --scanners misconfig,secret --exit-code 1 "${scratch}"
'''

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows (actionlint)"
# {{cwd}}: global-layer tasks otherwise run from the config root (~ locally)
dir = "{{cwd}}"
# The one shellcheck surface that CANNOT read the delivered config, and
# the reason is mechanical: actionlint calls shellcheck with --norc, and
# --norc beats --rcfile in either order (measured on 0.11.0 — the org
# file passed alongside --norc silences nothing). So this is the single
# place the org level is restated in flag form rather than read from
# mise/shellcheckrc, and the two are kept in step by hand.
#
# Drift here cannot lower what the org actually enforces: lint:shell-embedded
# reads the SAME `run:` blocks out of the same files and runs them against
# the delivered config, so this line is a floor under a check that already
# holds the code to the file. Keep it equal to mise/shellcheckrc anyway —
# a floor that disagrees with the ceiling is a puzzle for the next reader.
env = { SHELLCHECK_OPTS = "--enable=all --external-sources --extended-analysis=true" }
# Guard: actionlint exits 3 when a repo has no workflow YAML (including an
# existing-but-empty workflows directory).
# The -ignore is a documented exception in the capability-boundary
# spirit: GitHub's `$/` self-repository syntax (shipped 2026-07-30, the
# canon's only sanctioned way to reach its own tree — #165) postdates
# actionlint 1.7.12, the newest release. Remove the flag when
# rhysd/actionlint#711 lands. The regex is anchored to the `$/` prefix
# so every other malformed `uses:` still goes red.
run = '''
if compgen -G ".github/workflows/*.y*ml" > /dev/null; then actionlint -color -ignore "specifying action \"\\$/"; else echo "lint:actions: no workflows, skipped"; fi
'''

[tasks."release:preview"]
description = "What the next release would be (stele derive — read-only, not in ci)"
dir = "{{cwd}}"
# The same pinned binary the shared release workflow runs, answering
# locally: the version decision with its reasoning lines. Guarded: repos
# without a release stub (the continuous archetype, this repo) skip
# clean.
run = 'if [[ -f .github/workflows/release.yml ]]; then stele derive version --git-dir .; else echo "release:preview: no release.yml, skipped"; fi'

[tasks."lint:version-mirrors"]
description = "Every version mirror carries the released version (stele derive bump --check)"
dir = "{{cwd}}"
# The drift gate between releases (stele#102, #514): version mirrors —
# the workspace version, internal path-dependency constraints,
# CITATION.cff — are derived state, and one found not carrying the
# last released version is refused BY NAME at the PR that drifted it,
# never repaired in passing and never discovered at the next release.
# Every state is the tool's own stated outcome, none of them this
# task's opinion: check=ok, check=agreement-only (pre-first-release),
# check=no-mirrors (tag-only repos), and check=pending — mirrors
# carrying exactly the version the range derives, which is the
# release being cut on the Release PR branch or on the merged
# release commit before phase 2 mints its tag (stele#115). This body
# briefly carried two context guards for that last state, keyed on
# branch name and on commit subject; both are retired, because a
# gate that pattern-matches prose to decide whether to run is a
# second source of truth about a fact the derivation already holds.
run = '''
[[ -f .github/workflows/release.yml ]] || {
  echo "lint:version-mirrors: no release.yml, not a versioned repo, skipped"
  exit 0
}
command -v stele > /dev/null || {
  echo "lint:version-mirrors: stele missing from the belt" >&2
  exit 1
}
stele derive bump --git-dir . --check
'''

[tasks."lint:workspace-inherit"]
description = "Every [workspace.package] key is inherited by at least one member (#863)"
dir = "{{cwd}}"
# Dead policy nobody could see (#863). `[workspace.package]` inheritance
# is opt-in per member AND per key: a key declared at the workspace root
# reaches nothing until a member writes `<key>.workspace = true`. Found
# by running #820's lint:msrv against release-lab, which reported "no
# crate declares rust-version, skipped" against a root manifest whose
# line 26 says `rust-version = "1.97"` — so the MSRV a consumer reads was
# nothing at all, and clippy's `incompatible_msrv` had no version to
# compare against and had been inert on every gate run since it was
# written. Measured both ways on a copy of that tree with a post-MSRV
# API planted in lab-core: inheritance absent, clippy emits nothing;
# inheritance present, it objects at 1.85-against-1.63. One line of
# difference, and the check that fires is the whole of what was lost.
#
# The #687/#813 shape — not a check that went red, a check that could
# not fire — and invisible to every lint in the belt, because they all
# read the manifest TEXT or the workspace table. This reads cargo's
# account of the RESOLVED packages, which is the same source msrv-plan.py
# reads and what a consumer of the published crate actually sees.
#
# Only the declared KEYS are read as text, from the root manifest cargo
# itself names; whether anyone takes them is never text. Grepping the
# members for `.workspace = true` was rejected on #863 — it is the
# manifest-text reading that made the class invisible, and it cannot see
# a key cargo resolved some other way.
#
# The rule is minimal and fail-closed: a key NO member takes is red. Not
# "every member takes every key" — a workspace legitimately declares a
# key only some members want, and release-lab keeps `description` per
# crate on purpose. A key nobody takes is dead in a way a partly-taken
# key is not.
#
# CLIPPY_EXCLUDE is deliberately NOT read here, unlike lint:msrv and
# lint:rust. Those two ask what the gate can COMPILE; this asks what the
# published manifest says, and a key inherited only by a member outside
# the compile surface still reaches every consumer of that crate.
# Filtering by the compile surface would hide a live reader and red a
# key that has one.
#
# Deterministic: the outcome is a function of the tree and the lock.
# `cargo fetch --locked` first, the lint:rust precedent.
run = '''
set -euo pipefail
root=$(git ls-files ':!vendor/**' "Cargo.toml")
[[ -n ${root} ]] || {
  echo "lint:workspace-inherit: no root Cargo.toml tracked, skipped"
  exit 0
}
# A repo with a Cargo.toml has rust pinned as a build input; cargo absent
# is a broken toolchain, and skipping would be the vacuous-success
# failure this task exists to refuse.
command -v cargo > /dev/null || {
  echo "lint:workspace-inherit: Cargo.toml tracked but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
cargo fetch --locked
cargo metadata --no-deps --format-version 1 --locked \
  | python3 "${ORG_BELT_DIR}/workspace-inherit.py"
'''

[tasks."lint:gate-stub"]
description = "A gate stub's trigger set must be closed over the gate's inputs (#427)"
dir = "{{cwd}}"
# The squash-subject check reads the PR title, and the merge targets the
# base — both change only on `edited`, which the default pull_request
# types omit, so a caller on defaults holds stale verdicts (#427). The
# trigger lives in each caller's stub where the shared workflow cannot
# reach it, and Renovate manages the stub's pin, never its YAML — so
# this lint is the fan-out: it rides the pin bump Renovate does deliver
# and turns a stale stub red in that repo's own gate, fix in the
# message. Deterministic — parses tracked files only — so gate-eligible.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:gate-stub: no workflows, skipped"
  exit 0
}
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
canon_re="${canon//./\\.}"
bad=""
for f in .github/workflows/*.y*ml; do
  grep -qE "uses:[[:space:]]*(${canon_re}/|\./)\.github/workflows/ci\.ya?ml" "${f}" || continue
  grep -qE "^[[:space:]]*pull_request" "${f}" || continue
  grep -qE "^[[:space:]]*-[[:space:]]*edited|types:[^#]*\bedited\b" "${f}" || bad="${bad} ${f}"
done
if [[ -n ${bad} ]]; then
  echo "lint:gate-stub: gate caller's pull_request trigger lacks the edited type," >&2
  echo "  so title/base edits keep a stale verdict (#427). Set" >&2
  echo "  types: [opened, synchronize, reopened, edited] in:${bad}" >&2
  exit 1
fi
echo "lint:gate-stub: ok"
'''

[tasks."lint:capability-boundary"]
description = "No caller-code workflow may hold a signing identity (SLSA L3 boundary)"
dir = "{{cwd}}"
# The org's L3 boundary, made mechanical. A job holding `id-token: write`
# must not also execute caller-supplied code, or a certificate bearing this
# repo's identity gets minted while running someone else's steps — and
# nothing goes red. `workflow_call` is the machine-checkable proxy for
# "runs caller code".
#
# The escape hatch is deliberate and visible: a signer legitimately IS a
# workflow_call workflow holding id-token, and must say so with a
# `capability-boundary:` comment explaining why it runs none. An exception
# you have to write down is an exception somebody reviews.
#
# A marker is a comment line whose FIRST token is `capability-boundary:`
# (#676, rule 1). A bare token grep let prose ABOUT the marker read as
# the marker — the shape that made lint:cold-attested skip publish.yml
# entirely. Audited here in the same pass: six workflows reach this
# exemption (continuous, publish-rust-crate, publish-wasm-npm, publish,
# release, verify-release) and every one carries a real first-token
# marker, so nothing was riding prose and this line changes no verdict
# on the tree today. It closes the same hole before something does.
#
# Scope stays per FILE, and that is a measured difference from
# lint:cold-attested, not a seam: what this marker asserts is that the
# workflow runs no caller-supplied code, which is a property of the
# whole file — a new job in it inherits the same standing. A cache is a
# per-declaration build input, so its marker anchors per declaration.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:capability-boundary: no workflows, skipped"
  exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  grep -qE "^[[:space:]]*workflow_call:" "${f}" || continue
  # Only a real grant counts. A workflow that says "no id-token, ever" in
  # a comment is documenting the boundary, not breaching it — matching
  # comment text flagged exactly the files that get this right.
  grep -qE "^[^#]*id-token:[[:space:]]*write" "${f}" || continue
  grep -qE "^[[:space:]]*#[[:space:]]*capability-boundary:" "${f}" && continue
  bad="${bad} ${f}"
done
if [[ -n ${bad} ]]; then
  echo "lint:capability-boundary: workflow_call workflow holds id-token" >&2
  echo "  without a capability-boundary marker:${bad}" >&2
  exit 1
fi
echo "lint:capability-boundary: ok"
'''

[tasks."lint:release-phases"]
description = "The release graph's commitment barrier cannot be bypassed or silently unwired (#349)"
dir = "{{cwd}}"
# The shape that closed #349 finding 1, kept closed. On lab v0.20.0 the
# SBOM/triage gate failed and npm publish started eleven seconds later:
# the ordering the docs claimed was a race the org kept winning, because
# nothing publish-side carried the `needs` edge. The fix is a single
# commit-point job between proof and consequence; this lint makes the
# fix structural. Deterministic — parses tracked files — so it is
# gate-eligible.
#
# APPLICABILITY IS THE FILE'S OWN SHAPE, and the predicate is not a new
# one (#858): "in the canon itself these two files ARE the reusable
# implementations (they declare workflow_call), not caller stubs" is
# lint:release-stub's sentence, and lint:capability-boundary selects
# reusable workflows the same way. A repository that calls the
# orchestrator declares no workflow_call and implements no phases, so
# it is not judged — because of what its file IS, not because of what
# sits next to it.
#
# What that replaced was `-d security`, an identity claim by directory
# name, and it was not merely inelegant: five org repos carry a
# publish.yml (the filename is canon for trusted publishing), and the
# only thing keeping their gates green was that none of them happened
# to have a directory called security/. Creating an untracked one
# reddened a correct file — measured on iiif-server and edtf. Two of
# those five write their own multi-job publish workflows rather than a
# caller stub; whether they belong under this barrier is an org policy
# question with its own blast radius, and this lint does not answer it
# by accident.
#
# BOTH archetype orchestrators are judged (#717). The continuous path
# gained the same barrier for the same reason, and a rule that covered
# only publish.yml would have made the second one convention while
# calling the first structural — the exact split #349 finding 1 was.
# Each file is parsed on its own: the awk carries per-file state, and
# one invocation over both would let one archetype's guard satisfy the
# other's.
#
# Enforced, from the `# phase:` markers in each orchestrator:
#   1. every job carries exactly one marker, from the closed vocabulary
#   2. exactly one commit-point job, named commit-point
#   3. commit-point's needs EQUAL `guard` plus every prove-phase job —
#      equality, so a new proof added without wiring goes red instead
#      of silently not gating
#   4. every publish job needs commit-point directly and its block
#      tests `needs.commit-point.result == 'success'`
#   5. every attest job reaches commit-point through transitive needs
#   6. no admit, build or prove job holds `id-token: write` or
#      `contents: write` — the capability boundary derived from the
#      phase rather than restated beside it
#   7. a `record` job is terminal and unprivileged: nothing may `needs`
#      it and it holds no `id-token: write`. `record` is the one phase
#      that is not on the way to shipping (#597 — the burn annotation
#      runs precisely when the barrier did NOT open), so it is the one
#      phase that could become a route around the commit point. It
#      cannot: nothing downstream can depend on it, and it signs nothing
run = '''
orchestrators=""
for f in .github/workflows/publish.yml .github/workflows/continuous.yml; do
  [[ -f ${f} ]] || continue
  grep -qE "^[[:space:]]+workflow_call:" "${f}" || continue
  orchestrators="${orchestrators}${f} "
done
[[ -n ${orchestrators} ]] || {
  echo "lint:release-phases: no workflow_call release orchestrator here, skipped"
  exit 0
}
red=0
for f in ${orchestrators}; do
  awk '
  /^jobs:$/ { injobs = 1; next }
  !injobs { next }
  /^  # phase: / { pending = $NF; next }
  /^  [a-z][a-z0-9-]*:$/ {
    job = substr($1, 1, length($1) - 1)
    order[++n] = job
    if (pending == "") miss = miss " " job
    phase[job] = pending; pending = ""
    next
  }
  # a marker not immediately followed by a job id is itself a defect
  pending != "" { stray = stray " " pending; pending = "" }
  job == "" { next }
  /^    needs: \[/ {
    s = $0; sub(/^    needs: \[/, "", s); sub(/\].*$/, "", s)
    gsub(/ /, "", s); needs[job] = s; next
  }
  /^    needs: [a-z]/ { needs[job] = $2; next }
  # Block-style needs lists: the only form the tree carries since the
  # yamllint standup (#403) — its brackets rule forbids non-empty flow
  # sequences, so the flow branches above are kept only as parser
  # completeness.
  /^    needs:$/ { nblock = 1; needs[job] = ""; next }
  nblock && /^      - / { needs[job] = needs[job] (needs[job] == "" ? "" : ",") $2; next }
  nblock { nblock = 0 }
  /^      id-token: write/ { idtok[job] = 1 }
  /^      contents: write/ { cwrite[job] = 1 }
  /needs\.commit-point\.result == .success./ { testscp[job] = 1 }
  END {
    bad = ""
    valid = ",admit,build,prove,commit-point,publish,attest,record,"
    cp = ""; proves = ""
    for (i = 1; i <= n; i++) {
      j = order[i]; p = phase[j]
      if (index(valid, "," p ",") == 0) bad = bad "\n  " j ": unknown phase \"" p "\""
      if (p == "commit-point") { if (cp != "") bad = bad "\n  " j ": second commit-point (" cp " already is)"; cp = j }
      if (p == "prove") proves = proves "," j
    }
    if (miss != "") bad = bad "\n  jobs with no # phase: marker:" miss
    if (stray != "") bad = bad "\n  markers not directly above a job id:" stray
    if (cp == "") bad = bad "\n  no commit-point job"
    else if (cp != "commit-point") bad = bad "\n  the commit-point job must be named commit-point, got " cp
    if (cp != "") {
      want = "guard" proves
      m = split(want, w, ","); have = "," needs[cp] ","
      for (k = 1; k <= m; k++) if (index(have, "," w[k] ",") == 0)
        bad = bad "\n  commit-point needs is missing " w[k]
      m = split(needs[cp], g, ",")
      for (k = 1; k <= m; k++) if (index("," want ",", "," g[k] ",") == 0)
        bad = bad "\n  commit-point needs " g[k] ", which is neither guard nor a prove job"
    }
    for (i = 1; i <= n; i++) {
      j = order[i]; p = phase[j]
      if (p == "publish") {
        if (index("," needs[j] ",", ",commit-point,") == 0)
          bad = bad "\n  publish job " j " does not need commit-point directly"
        if (!(j in testscp))
          bad = bad "\n  publish job " j " never tests needs.commit-point.result"
      }
      if (p == "publish" || p == "attest") {
        # BFS over needs for reachability of commit-point
        delete seen; nq = 0; q[++nq] = j; head = 0; found = 0
        while (head < nq && !found) {
          cur = q[++head]
          m = split(needs[cur], e, ",")
          for (k = 1; k <= m; k++) {
            if (e[k] == "commit-point") { found = 1; break }
            if (!(e[k] in seen)) { seen[e[k]] = 1; q[++nq] = e[k] }
          }
        }
        if (!found) bad = bad "\n  " p " job " j " cannot reach commit-point through needs"
      }
      if ((p == "admit" || p == "build" || p == "prove") && (j in idtok || j in cwrite))
        bad = bad "\n  " p " job " j " holds id-token or contents write — pre-barrier jobs sign and publish nothing"
      if (p == "record") {
        if (j in idtok)
          bad = bad "\n  record job " j " holds id-token — a record writes down what happened, it signs nothing"
        for (r = 1; r <= n; r++)
          if (index("," needs[order[r]] ",", "," j ",") > 0)
            bad = bad "\n  " order[r] " needs record job " j " — a record is terminal and cannot gate anything"
      }
    }
    if (bad != "") {
      printf "lint:release-phases: %s: the commitment barrier is unwired:%s\n", FILENAME, bad > "/dev/stderr"
      exit 1
    }
    printf "lint:release-phases: %s: %d jobs, barrier intact\n", FILENAME, n
  }
' "${f}" || red=1
done
if [[ ${red} -ne 0 ]]; then
  echo "  every publish/attest job must reach commit-point (#349 finding 1);" >&2
  echo "  see the PHASES header in the orchestrator named above" >&2
  exit 1
fi
'''

[tasks."lint:signer-pin"]
description = "Every sign.yml uses: agrees on one signer digest, and no second copy or hand-written --signer-digest literal exists"
dir = "{{cwd}}"
# A tree states the trusted signer exactly once: the sign.yml@<sha>
# `uses:` lines, the only representation Renovate manages natively.
# Everything that needs the expected signer identity — the verify-signed
# action for consumers, verify-release.yml's verdict mode for the canon —
# derives it from those lines at run time. This lint keeps the
# derivation single-valued: all `uses:` lines must carry the same
# digest, so a partial Renovate bump (some lines moved, some not)
# reddens the gate instead of leaving the tree disagreeing with itself.
# Deterministic — reads only tracked files — so it belongs in the gate.
#
# There used to be a second copy, security/signer.pin, the file the
# verdict checked against. Its Renovate manager needed a URL package
# name (git-refs datasource), which the first-party group's
# `monumental-archive/**` glob could not match, so #296's groupName
# split the one value into two branches — uses:-only and pin-only —
# neither of which could pass this lint alone (#316 finding 2; every
# signer bump since 2026-08-12 reddened). The fix is not re-grouping
# the copies but deleting the second one: the pin file is gone, the
# verdict derives from the same uses: lines, and the split state is
# unrepresentable. Reintroducing the file is refused loudly below.
#
# Hand-written `--signer-digest <40-hex>` literals are banned outright
# (#314 finding 1): the flag is the value a consumer's verification
# turns on (OID .10), Renovate has no manager for a SHA inside a shell
# command, and the lab's literal sat frozen at the signer's FIRST commit
# while its uses: line was bumped twice — every dispatch a guaranteed
# identity mismatch, silently.
run = '''
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml")
[[ -n ${files} ]] || {
  echo "lint:signer-pin: no workflows, skipped"
  exit 0
}
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
signer_wf=$(org_identity signer-workflow)
signer_re="${signer_wf//./\\.}"
literals=$(xargs grep -nE -- "--signer-digest[[:space:]]+[0-9a-f]{40}" <<< "${files}" || true)
if [[ -n ${literals} ]]; then
  echo "lint:signer-pin: hand-written --signer-digest literal — nothing bumps it, so it drifts from the uses: pin the certificate will carry (#314):" >&2
  echo "${literals}" >&2
  echo "  derive it instead: uses: ${canon}/.github/actions/verify-signed" >&2
  echo '  ($/.github/actions/verify-signed from a canon-owned workflow)' >&2
  exit 1
fi
if [[ -f security/signer.pin ]]; then
  echo "lint:signer-pin: security/signer.pin exists — the second copy of the signer identity was deleted (#316 finding 2)" >&2
  echo "  the uses: lines are the single statement of the trusted signer; verifiers derive from them" >&2
  echo "  (a standalone pin file has no Renovate manager the first-party group can match, so it" >&2
  echo "  bumps on a separate branch that can never pass this lint — the two-branch split)" >&2
  exit 1
fi
readers=$(xargs grep -lE "^[^#]*security/signer\.pin" <<< "${files}" || true)
if [[ -n ${readers} ]]; then
  echo "lint:signer-pin: workflows read security/signer.pin (on a non-comment line) but the file is deleted (#316 finding 2) — derive from the sign.yml uses: pin instead:${readers}" >&2
  exit 1
fi
refs=$(xargs grep -hoE "${signer_re}@[0-9a-f]{40}" <<< "${files}" | sort -u || true)
[[ -n ${refs} ]] || {
  echo "lint:signer-pin: no signer references, skipped"
  exit 0
}
count=$(wc -l <<< "${refs}" | tr -d " ")
if [[ ${count} != "1" ]]; then
  echo "lint:signer-pin: sign.yml pinned at more than one digest — a tree states the trusted signer once:" >&2
  echo "${refs}" >&2
  echo "  a partial bump left the tree disagreeing with itself; move every uses: line together" >&2
  exit 1
fi
echo "lint:signer-pin: all signer references agree on ${refs##*@}"
'''

[tasks."lint:input-forwarding"]
description = "Every local caller forwards every universal input its callee declares (#305)"
dir = "{{cwd}}"
# The #299 failure class: two callers of one reusable workflow disagree
# about which inputs they forward, and omitting an optional input is
# legal YAML — actionlint validates it, zizmor has no opinion, and only
# the caller the PR happened to exercise goes red. The contract is
# therefore declared where each input is BORN, not at the call sites
# that consume it: every input and secret of a locally-called
# `workflow_call` workflow carries a `# forwarding: universal` (every
# local caller must set the key — any value, literals included) or
# `# forwarding: discretionary — <reason>` marker, and an unmarked
# input fails closed, so the classification #299 silently skipped is
# structurally unskippable. Consumer-surface workflows whose defaults
# ARE the API may declare `# forwarding-default: discretionary` once,
# file-level; a file-level default is never allowed to be universal.
# The marker lives in a comment because GitHub's workflow_call schema
# rejects extension fields — the platform ceiling, not a preference.
#
# Interlock: this lint forces the forwarding line; actionlint, ahead of
# it in the same gate, forces the caller-surface declaration any
# `${{ inputs.* }}` it forwards refers to. The chain closes only with
# both — do not "simplify" either away.
#
# Scope is local `uses: ./` call sites only: cross-repo callers pin by
# SHA and never reach the class builds directly. Indentation-keyed
# parsing is defensible because actionlint guarantees well-formed YAML
# and the canon's two-space style ahead of this in the same gate.
# Deterministic, tracked files only — belongs in `ci`. The error line
# format is fix:input-forwarding's parsing API; change them together.
run = '''
# From the belt (#445). The walk is a delivered script, not a body:
# fix:input-forwarding consumes these findings as its API, and a nested
# `mise run` was how it used to reach them — the #82 race, in the file
# that documents it (#764).
bash "${ORG_BELT_DIR}/input-forwarding.sh"
'''

[tasks."fix:input-forwarding"]
description = "Insert the missing universal forwarding lines lint:input-forwarding demands"
dir = "{{cwd}}"
# The write-mode sibling (#305): universal forwarding lines are
# machine-written, never hand-authored — drift can only exist as an
# uncommittable dirty tree. Consumes the lint's error lines as its API
# (change the formats together) and inserts `key: ${{ inputs.key }}` /
# `key: ${{ secrets.key }}` at the top of the offending job's block.
# The inserted expression is the mechanical guess: review it (the right
# value may be a `needs.*` output or a literal), and declare the input
# on the caller's own surface if actionlint then reddens — that
# interlock is the other half of the chain.
run = '''
{% raw %}
missing=$(bash "${ORG_BELT_DIR}/input-forwarding.sh" 2>&1 | awk '
/does not forward universal/ {
  for (i = 4; i < NF; i++)
    if ($i == "forward" && $(i + 1) == "universal") print $(i - 3), $(i + 2), $(i + 3)
}' || true)
if [[ -z ${missing} ]]; then
  echo "fix:input-forwarding: nothing to fix"
  exit 0
fi
while read -r loc kind key; do
  [[ -n ${loc} ]] || continue
  file="${loc%%:*}"
  jobname="${loc##*:}"
  # shellcheck disable=SC2016  # ${{ }} is GitHub's expression syntax, written
  # literally into the workflow — expanding it here is the defect
  if [[ ${kind} == "secret" ]]; then
    blk="secrets:"
    val='${{ secrets.'"${key}"' }}'
  else
    blk="with:"
    val='${{ inputs.'"${key}"' }}'
  fi
  awk -v job="${jobname}" -v key="${key}" -v blk="${blk}" -v val="${val}" '
  { print }
  /^  [A-Za-z0-9_-]+:/ { cur = $1; sub(/:.*/, "", cur) }
  cur == job && $0 ~ "^    " blk "$" && !done { printf "      %s: %s\n", key, val; done = 1 }
  ' "${file}" > "${file}.fix-tmp" && mv "${file}.fix-tmp" "${file}"
  echo "fix:input-forwarding: ${file}:${jobname} += ${key}"
done <<< "${missing}"
echo "fix:input-forwarding: review the inserted expressions; rerun mise run lint:input-forwarding and lint:actions"
{% endraw %}
'''

[tasks."lint:source-attest"]
description = "Dry-run the claims derivation against recorded enforcement (#236, stele#40)"
dir = "{{cwd}}"
# The claims stage is `stele derive claims` over the control table the
# policy declares; this exercises exactly that — the real engine, the
# real committed policy, recorded rule snapshots, no network — so it
# belongs in the gate. Three scenarios, the #240 outcomes by name:
# the full fixture derives the complete claim set; a BLIND tag read
# (rulesets visible to nobody) refuses loudly; a LAPSED ruleset
# (readable, content no longer matching) drops exactly its own
# property and nothing else. The degraded fixture sets are DERIVED
# from the one canonical snapshot — jq transforms, never second
# copies that drift. Only the canon carries the emitter; everywhere
# else this skips clean.
#
# Canon-only, on the family's identity guard (#738, extended to the
# gate by #858). The fixtures used to be the guard, which read the
# wrong subject: the EMITTER is what makes this check applicable and
# the fixtures are what it reads, so deleting them left the emitter in
# place with nothing exercising it — quietly, in the gate, on the
# identity half of the Source track.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "lint:source-attest: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
fixtures=".github/actions/source-attest/testdata"
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
missing=""
for f in "${fixtures}/${canon}/rules" slsa/verify-policy.json; do
  [[ -e ${f} ]] || missing="${missing} ${f}"
done
[[ -z ${missing} ]] || {
  echo "lint:source-attest: on the canon, and input(s) this check reads are missing:${missing}" >&2
  echo "  a canon-only check reds on a missing input, never skips (#738)." >&2
  exit 1
}
command -v stele > /dev/null || {
  echo "lint:source-attest: stele missing from the belt" >&2
  exit 1
}
tmp=$(mktemp -d)
trap 'rm -rf "${tmp}"' EXIT
head_sha=$(git rev-parse HEAD)
derive() { # snapshot-dir out-file
  stele derive claims --policy slsa/verify-policy.json \
    --repo "${canon}" --branch main \
    --canon-root . --canon-digest "${head_sha}" \
    --snapshot "${1}" --out "${2}"
}
# Full snapshot: every declared property derives.
derive "${fixtures}" "${tmp}/claims.json"
jq -e '[.controls[].property] | sort == [
  "ORG_SOURCE_CAPABILITY_BOUNDARY", "ORG_SOURCE_DCO", "ORG_SOURCE_GATED",
  "ORG_SOURCE_HISTORY_PROTECTED", "ORG_SOURCE_RELEASE_TAG_MINTED",
  "ORG_SOURCE_REVIEWED_THREADS", "ORG_SOURCE_SIGNED", "ORG_SOURCE_TAG_IMMUTABLE"]' \
  "${tmp}/claims.json" > /dev/null || {
  echo "lint:source-attest: the full snapshot did not derive the complete claim set" >&2
  exit 1
}
# Blind: no tag ruleset visible — a property is declared against that
# scope, so an empty read is a credential proving its own incapability.
rules="${fixtures}/${canon}/rules"
blind="${tmp}/blind/${canon}/rules"
mkdir -p "${blind}/branches" "${blind}/rulesets"
cp "${rules}/branches/main.json" "${blind}/branches/"
cp "${rules}"/rulesets/*.json "${blind}/rulesets/"
jq '[.[] | select(.target != "tag")]' "${rules}/rulesets.json" > "${blind}/rulesets.json"
# shellcheck disable=SC2310  # deliberate predicate: this asserts that derive
# REFUSES, so suspending set -e around it is the whole point of the test
if out=$(derive "${tmp}/blind" "${tmp}/blind.json" 2>&1); then
  echo "lint:source-attest: a blind tag read was accepted — the blindness guard is gone (#240)" >&2
  exit 1
fi
grep -q "blind read" <<< "${out}" || {
  echo "lint:source-attest: the blind read refused without its named error (#240)" >&2
  exit 1
}
# Lapsed: a bypass granted on the all-tags ruleset — readable, content
# no longer matching, so exactly ORG_SOURCE_TAG_IMMUTABLE drops.
lapsed="${tmp}/lapsed/${canon}/rules"
mkdir -p "${lapsed}/branches" "${lapsed}/rulesets"
cp "${rules}/branches/main.json" "${lapsed}/branches/"
cp "${rules}/rulesets.json" "${lapsed}/rulesets.json"
for f in "${rules}"/rulesets/*.json; do
  jq 'if .conditions.ref_name.include == ["~ALL"]
      then .bypass_actors += [{actor_id: 1, actor_type: "OrganizationAdmin", bypass_mode: "always"}]
      else . end' "${f}" > "${lapsed}/rulesets/$(basename "${f}")"
done
# shellcheck disable=SC2310  # deliberate predicate: the || branch reports the
# failure with its own message, so set -e has nothing to add
derive "${tmp}/lapsed" "${tmp}/lapsed.json" || {
  echo "lint:source-attest: a readable-but-lapsed ruleset failed the run — a lapse must under-claim (#240)" >&2
  exit 1
}
jq -e '[.controls[].property] | (index("ORG_SOURCE_TAG_IMMUTABLE") == null)
  and (index("ORG_SOURCE_RELEASE_TAG_MINTED") != null)' "${tmp}/lapsed.json" > /dev/null || {
  echo "lint:source-attest: a lapsed tag ruleset did not drop exactly its own property (#240)" >&2
  exit 1
}
echo "lint:source-attest: ok — full set derives, blindness refuses, a lapse under-claims"
'''

[tasks."lint:actions-allowed"]
description = "Every uses: names an action the org allowlist permits (workflows AND composite actions)"
dir = "{{cwd}}"
# The org restricts Actions to GitHub-owned plus four patterns. GitHub
# enforces it at `Set up job` — the run dies before a single step
# executes, with nothing red until then. Found by driving the first
# source-track activation (#207): sigstore/cosign-installer passed every
# local lint, every gate and code review, and died in the lab.
#
# The list below is the enforcement copy, delivered to every repo by the
# belt; security/README.md is the record and audit:actions-allowlist
# compares both against the live org setting on Mondays. Same shape as
# the rulesets decision (docs/rulesets.md): the org setting is the
# enforcement, this is the early warning.
#
# Composite actions are linted too, deliberately: every other workflow
# lint globs .github/workflows/ only, which is exactly the blind spot
# that let the bad `uses:` through.
run = '''
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n ${files} ]] || {
  echo "lint:actions-allowed: no workflows or actions, skipped"
  exit 0
}
# github_owned_allowed=true covers the actions/ and github/ orgs.
# verified_allowed=false — a Marketplace verification badge is a
# publisher check, not a supply-chain one, and it is not ours to revoke.
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
allowed="actions/* github/* ${canon_owner}/* jdx/mise-action@* codecov/codecov-action@* ossf/scorecard-action@*"
bad=""
checked=0
while IFS= read -r f; do
  [[ -n ${f} ]] || continue
  uses_refs=$(grep -hoE "^[^#]*uses:[[:space:]]*[A-Za-z0-9._$/-]+/[A-Za-z0-9._-]+[^[:space:]]*" "${f}" \
    | sed -E "s|^.*uses:[[:space:]]*||") || true
  while IFS= read -r ref; do
    [[ -n ${ref} ]] || continue
    # Local refs (./path, $/path) are the repo's own tree, never a
    # third party — the allowlist does not govern them.
    case "${ref}" in ./* | \$/*) continue ;; *) ;; esac
    checked=$((checked + 1))
    owner_repo="${ref%%@*}"
    ok=""
    for pat in ${allowed}; do
      case "${pat}" in
        *@\*) [[ ${owner_repo} == "${pat%@\*}" ]] && ok=1 ;;
        */\*) [[ ${owner_repo} == "${pat%/\*}/"* ]] && ok=1 ;;
        # A pattern with neither suffix is a literal owner/repo the org does
        # not use; it matches nothing rather than everything.
        *) ;;
      esac
    done
    [[ -n ${ok} ]] || bad="${bad} ${f}(${ref})"
  done <<< "${uses_refs}"
done <<< "${files}"
if [[ -n ${bad} ]]; then
  echo "lint:actions-allowed: uses: an action the org allowlist forbids:${bad}" >&2
  echo "  allowed: GitHub-owned plus ${allowed}" >&2
  echo "  GitHub refuses these at 'Set up job', so nothing goes red until a run dies" >&2
  echo "  widen the org setting deliberately, or use an allowed action" >&2
  exit 1
fi
echo "lint:actions-allowed: ${checked} action reference(s), all permitted"
'''

[tasks."audit:actions-allowlist"]
description = "The live org Actions allowlist still matches the belt's enforcement copy (network, canon only)"
dir = "{{cwd}}"
# The drift half of lint:actions-allowed. That lint is only as true as
# its embedded list: widen the org setting and the lint silently over-
# blocks; narrow it and the lint silently under-blocks while runs start
# dying. This is the reconciliation, on the same cadence as every other
# settings-drift check.
run = '''
# The identity guard is the whole guard here (#738): the two things
# compared are the live org setting and the belt's own enforcement
# copy, so this leg has no tree input of its own to red on.
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:actions-allowlist: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
command -v gh > /dev/null || {
  echo "audit:actions-allowlist: gh missing" >&2
  exit 1
}
# The read comes first, and a read that fails is its own red — never an
# input to the comparison. This leg once compared the belt against the
# `null` an unauthorised read returned, reporting drift that was the
# exact opposite of the live setting (#349 finding 10): a blind leg has
# one honest output, and it is "I could not read", with the endpoint
# named. The org-scoped endpoint needs an org-admin-capable token
# (AUDIT_TOKEN via the audit environment in CI); the default job token
# cannot perform it.
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
if ! live=$(gh api "orgs/${canon_owner}/actions/permissions/selected-actions" 2> /dev/null); then
  echo "audit:actions-allowlist: could not read orgs/${canon_owner}/actions/permissions/selected-actions" >&2
  echo "  no comparison was made — this red is 'unreadable', not 'drifted'." >&2
  echo "  The endpoint needs an org-admin-capable token (AUDIT_TOKEN)." >&2
  exit 1
fi
jq -e '.patterns_allowed | type == "array"' <<< "${live}" > /dev/null || {
  echo "audit:actions-allowlist: the endpoint answered without patterns_allowed — refusing to compare against null" >&2
  exit 1
}
live_patterns=$(jq -r '.patterns_allowed | sort | join(" ")' <<< "${live}")
# The task text holds the owner as ${canon_owner}, unexpanded — expand
# it from the same declaration before comparing (#579).
belt_patterns=$(mise tasks info "lint:actions-allowed" --json \
  | jq -r '.run[0]' | sed -n 's|^allowed="\(.*\)"$|\1|p' \
  | sed "s|\${canon_owner}|${canon_owner}|g" \
  | tr " " "\n" | grep -v "^actions/\*$" | grep -v "^github/\*$" \
  | sort | tr "\n" " " | sed "s| $||")
fail=""
[[ ${live_patterns} == "${belt_patterns}" ]] \
  || fail="patterns differ — live: [${live_patterns}] belt: [${belt_patterns}]"
jq -e '.github_owned_allowed == true' <<< "${live}" > /dev/null \
  || fail="${fail}; github_owned_allowed is false but the belt allows actions/* and github/*"
jq -e '.verified_allowed == false' <<< "${live}" > /dev/null \
  || fail="${fail}; verified_allowed is true — the Marketplace badge is not a supply-chain control"
if [[ -n ${fail} ]]; then
  echo "audit:actions-allowlist: ${fail}" >&2
  echo "  reconcile mise/config.toml lint:actions-allowed and security/README.md" >&2
  echo "  with the live setting, or put the live setting back" >&2
  exit 1
fi
echo "audit:actions-allowlist: live org allowlist matches the belt"
'''

[tasks."lint:from-digests"]
description = "Every FROM in a tracked Dockerfile is digest-pinned (a tag is a moving pointer into the build)"
dir = "{{cwd}}"
# Digest pinning is practiced (docker/pgrx-base-images.toml) but was not
# enforced — the lab's builder stage shipped as `rust:1.97-slim`, tag
# only, found in the #117 research. A tag names a stream; the digest
# names the bytes, and only named bytes can be verified before use
# (base-attest.yml). Renovate keeps tag AND digest current together, so
# a pin here never goes stale. Exempt: `FROM scratch` and references to
# named build stages. Tracked files only, like every belt linter.
#
# The FROM parse is dockerfile-bases.sh's, not this task's (#715):
# build-oci-image.yml's base-approval step asks the same question of
# the same text on the build path — which bases does this Dockerfile
# instantiate? — and two parsers of one format are the drift pair a
# DELIVERED config exists to prevent (#445). The helper refuses loudly
# on an unreadable file or a FROM naming no image, and errexit carries
# that refusal out of the command substitution below: a parse that
# failed must never read here as a Dockerfile with no bases.
run = '''
files=$(git ls-files ':!vendor/**' "Dockerfile" "*/Dockerfile" "*.Dockerfile" "Dockerfile.*")
[[ -n ${files} ]] || {
  echo "lint:from-digests: no Dockerfiles tracked, skipped"
  exit 0
}
bad=""
while IFS= read -r f; do
  refs=$("${ORG_BELT_DIR}/dockerfile-bases.sh" "${f}")
  [[ -n ${refs} ]] || continue
  while IFS= read -r ref; do
    [[ -n ${ref} ]] || continue
    [[ ${ref} == *"@sha256:"* ]] || bad="${bad} ${f}(${ref})"
  done <<< "${refs}"
done <<< "${files}"
if [[ -n ${bad} ]]; then
  echo "lint:from-digests: FROM without a digest pin:${bad}" >&2
  echo "  pin as image:tag@sha256:… — Renovate rolls tag and digest together" >&2
  exit 1
fi
echo "lint:from-digests: ok"
'''

[tasks."lint:installer-pinned"]
description = "Every mise-action step pins mise's own version — the installer is a build input (#117)"
dir = "{{cwd}}"
# Found the expensive way (v0.18.2 darwin leg): every tool was pinned,
# every uses: SHA-pinned — and the tool that installs them floated,
# pulling a same-day mise release that broke rustup mid-install. A gap a
# human "should have seen" is a gap the belt owns from then on: this
# asserts each jdx/mise-action step carries an explicit `version:`.
# Grep-shaped like every belt lint: count steps, count pins, any
# shortfall is red with the file named.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:installer-pinned: no workflows, skipped"
  exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  steps=$(grep -cE "^[^#]*uses:[[:space:]]*jdx/mise-action@" "${f}") || true
  ((steps > 0)) || continue
  pins=$(grep -cE "^[^#]*version:[[:space:]]*[0-9]{4}\.[0-9]+\.[0-9]+" "${f}") || true
  if ((steps > pins)); then
    bad="${bad} ${f}(${steps} steps, ${pins} version pins)"
  fi
done
if [[ -n ${bad} ]]; then
  echo "lint:installer-pinned: mise-action without a mise version pin:${bad}" >&2
  echo "  the installer is a build input — an unpinned mise delivers" >&2
  echo "  same-day releases straight into attested builds (v0.18.2 darwin leg)" >&2
  exit 1
fi
echo "lint:installer-pinned: ok"
'''

[tasks."lint:cold-attested"]
description = "No cache on any attested path — caches are unattested, writable-from-any-branch build inputs (#117)"
dir = "{{cwd}}"
# The cold-build rule, made mechanical. actions/cache (and every tool
# cache riding an action's `cache:` default) is state injected into the
# build that no provenance captures — cache poisoning is the classic
# attack the attestation cannot see. The rule: caches only where a human
# is waiting and nothing is signed. Structurally that means a cache must
# say why its path is unattested, with an `unattested-path:` marker —
# the capability-boundary pattern: an exception you have to write down
# is an exception somebody reviews.
#
# WHAT MAKES A MARKER A MARKER (#676). The exemption is per CACHE
# DECLARATION, never per file, and prose cannot forge it:
#
#   1. a marker is a comment line whose FIRST token is
#      `unattested-path:` (`^[[:space:]]*#[[:space:]]*unattested-path:`);
#   2. it is the FIRST line of its comment block;
#   3. the block runs unbroken — no blank line — to a step at the
#      marker's own indentation, and authorises THAT STEP ALONE;
#   4. a marker introducing no step, or introducing a step that
#      declares no cache, is itself the failure. An exemption that
#      exempts nothing is prose in marker clothing.
#
# The defect this replaced (#676): the guard was a bare
# `grep -q "unattested-path:"` over the whole file, so publish.yml —
# the workflow that signs and publishes every artifact class — was
# skipped entirely, because its PHASES comment mentions the marker
# while explaining the idiom. Warming its toolchain went unnoticed;
# release.yml and verify-release.yml were caught only because they
# happen not to discuss the convention. Anchoring also surfaced five
# caches no per-file rule could ever see: ci.yml's four Go and cargo
# cache steps and rekor-monitor.yml's cache/save, each riding a marker
# written for a different step.
#
# Three shapes are caught: an explicit `uses: actions/cache*`, and two
# silent ones — a mise-action step and an `actions/setup-*` step. Both
# silent shapes are judged on one property: the step must SAY
# `cache: false`. What is NOT asserted is the upstream default, and
# that is the point (#732). Measured across the family on 2026-08-24:
#
#   setup-go true, setup-node true, setup-python false,
#   setup-java false, setup-dotnet false
#
# — so "the setup family caches by default" is 2/5 true, and reading
# defaults would need a per-action table that is wrong for three of
# them today, flips per major (setup-go's flipped between v3 and v7),
# and drifts as Renovate rolls the pins. That is a restatement with a
# clock on it. On the SHA this repo pins (setup-go v7.0.0) the default
# IS true, with `post: dist/cache-save/index.js` and
# `post-if: success()` — a green job writes an entry.
#
# The family is matched by PREFIX, `actions/setup-`, not by a
# hand-named list: a list is a restatement of an upstream fact, the
# drift shape #658 deleted lint:belt-available for. Accepted cost of
# the prefix: a setup action that caches nothing (or defaults it off)
# still needs the explicit `cache: false`, or its marker, to pass. It
# is one loud line that stays correct the day upstream flips, never a
# false pass. Audit, not ban: banning `setup-*` outright would not
# generalise, since a third-party caching action walks straight past
# it, while recognising the cache SHAPE does.
#
# Indentation-keyed parsing is defensible for the reason
# lint:input-forwarding's is: actionlint runs ahead of this in the same
# gate and guarantees well-formed YAML, and the canon's two-space style
# is uniform. Deterministic, no network — belongs in `ci`.
#
# lint:capability-boundary takes rule 1 and not rules 2-4, deliberately:
# whether a workflow runs caller-supplied code is a property of the
# FILE, so one marker there legitimately covers every grant in it. A
# cache is a per-declaration input, and a file grows more of them.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:cold-attested: no workflows, skipped"
  exit 0
}
awk '
function endstep() {
  declares = has_cache || (has_dflt && !has_false)
  if (instep && auth && !declares) {
    printf "lint:cold-attested: %s:%d unattested-path marker on a step that declares no cache\n", stepfile, stepline > "/dev/stderr"
    fail = 1
  }
  if (instep && has_dflt && !has_false && !auth) {
    printf "lint:cold-attested: %s:%d %s step does not say `cache: false` and carries no unattested-path marker\n", stepfile, stepline, dfltkind > "/dev/stderr"
    fail = 1
  }
  instep = 0
  has_dflt = 0
  dfltkind = ""
  has_false = 0
  has_cache = 0
  auth = 0
}
BEGIN { fail = 0 }
{
  ind = match($0, /[^ ]/) - 1
  isblank = ($0 ~ /^[[:space:]]*$/)
  iscmt = (!isblank && $0 ~ /^[[:space:]]*#/)
}
FNR == 1 {
  endstep()
  blkstart = 0
  blkmark = 0
  blkind = -1
  stepind = -1
  has_cache = 0
}
isblank {
  if (blkmark) {
    printf "lint:cold-attested: %s:%d unattested-path marker introduces no step\n", FILENAME, blkstart > "/dev/stderr"
    fail = 1
  }
  blkstart = 0
  blkmark = 0
  next
}
iscmt {
  if (!blkstart) {
    blkstart = FNR
    blkind = ind
    blkmark = ($0 ~ /^[[:space:]]*#[[:space:]]*unattested-path:/)
  }
  next
}
{
  isstep = ($0 ~ /^[[:space:]]*-[[:space:]]+[A-Za-z_][A-Za-z0-9_-]*:/) && (!instep || ind <= stepind)
  newauth = 0
  if (blkstart) {
    if (blkmark) {
      if (isstep && ind == blkind)
        newauth = 1
      else {
        printf "lint:cold-attested: %s:%d unattested-path marker introduces no step\n", FILENAME, blkstart > "/dev/stderr"
        fail = 1
      }
    }
    blkstart = 0
    blkmark = 0
  }
  if (isstep) {
    endstep()
    instep = 1
    stepind = ind
    stepline = FNR
    stepfile = FILENAME
    auth = newauth
  } else if (instep && ind <= stepind)
    endstep()
  if ($0 ~ /^[^#]*uses:[[:space:]]*actions\/cache/) {
    has_cache = 1
    if (!auth) {
      printf "lint:cold-attested: %s:%d actions/cache step carries no unattested-path marker\n", FILENAME, FNR > "/dev/stderr"
      fail = 1
    }
  }
  if ($0 ~ /^[^#]*uses:[[:space:]]*jdx\/mise-action@/) {
    has_dflt = 1
    dfltkind = "mise-action"
  }
  if ($0 ~ /^[^#]*uses:[[:space:]]*actions\/setup-/) {
    has_dflt = 1
    dfltkind = "actions/setup-*"
  }
  if ($0 ~ /^[^#]*cache:[[:space:]]*false/) has_false = 1
}
END {
  endstep()
  if (fail) exit 1
  print "lint:cold-attested: every cache declaration carries its own unattested-path marker"
}
' .github/workflows/*.y*ml
'''

[tasks."coverage:check"]
description = "Enforce the derived coverage floor (.coverage-floor); repos without one skip clean"
dir = "{{cwd}}"
# The ratchet: the floor is DERIVED STATE that only rises (#652). The
# release machinery writes it as `measured - band` and commits it with
# the release; this task enforces it, and refuses a floor that disagrees
# with its own record as DRIFT rather than repairing it — a floor found
# wrong is evidence the machinery was bypassed. It was a hand-typed
# number until the org measured what that costs: stele's ceiling fell
# 6.5 points in two days with four features landed, nothing red and
# nothing noticed, because the floor sat far enough below the ceiling
# that the headroom became a landing zone.
#
# A repo without a floor has adopted no ratchet and skips clean; a repo
# with one cannot merge below it. Deterministic — the number is local,
# the run is local; the Codecov upload (the badge) lives in ci.yml as a
# separate non-blocking job.
#
# The measurement is mise/coverage-measure.sh, shared with
# release/derive-coverage-floor.sh and coverage:report, so the number
# enforced here, the number the floor is derived from and the profile
# the badge uploads cannot come from different flags (#707) —
# the #316 shape, where a second hardcoded --workspace drifted from the
# first the instant a repo excluded a member. Each leg measures what its
# language measures (statements for Go, lines for Rust); the floor is a
# minimum in both, and every leg must hold it.
run = '''
floor=$(python3 "${ORG_BELT_DIR}/coverage-floor.py" read) || exit 1
if [[ -z ${floor} ]] || [[ ! -f Cargo.toml && ! -f go.mod ]]; then
  echo "coverage:check: no .coverage-floor, skipped"
  exit 0
fi
legs=$("${ORG_BELT_DIR}/coverage-measure.sh" coverage:check) || exit 1
if [[ -z ${legs} ]]; then
  echo "coverage:check: no leg was measured — a check that reads nothing must not pass" >&2
  exit 1
fi
while read -r leg pct; do
  if awk -v p="${pct}" -v f="${floor}" 'BEGIN { exit !(p < f) }'; then
    echo "coverage:check: ${leg}: ${pct}% is below the derived floor ${floor}%" >&2
    exit 1
  fi
  echo "coverage:check: ${leg} leg holds the floor ${floor} (${pct}%)"
done <<< "${legs}"
'''

[tasks."coverage:adopt"]
description = "Write .coverage-floor from a real measurement (adoption, and the migration off a hand-typed floor)"
dir = "{{cwd}}"
# The write-mode half of the ratchet (#652), and the remedy every
# refusal in coverage-floor.py names. Adoption is a MEASUREMENT, not a
# guess: a repo joins the ratchet by measuring itself and committing
# what it found, and a repo whose floor predates the derivation migrates
# the same way, in one commit with the canon pin bump that brings the
# new recipe.
#
# It cannot lower a floor whose record parses — that is the ratchet, and
# stepping down is a conscious `reset: <why>` a human writes and a
# reviewer sees. A `coverage:*` sibling rather than a `fix:*` one, like
# coverage:report beside it: the `fix` aggregate collects `fix:*`
# wildcard, and a fixer that runs the whole test suite does not belong
# in a sweep nobody asked for.
run = '''
if [[ ! -f Cargo.toml && ! -f go.mod ]]; then
  echo "coverage:adopt: no Cargo.toml or go.mod, nothing to measure"
  exit 0
fi
legs=$("${ORG_BELT_DIR}/coverage-measure.sh" coverage:adopt) || exit 1
python3 "${ORG_BELT_DIR}/coverage-floor.py" write \
  --provenance "coverage:adopt" --adopt <<< "${legs}"
'''

[tasks."coverage:report"]
description = "Render the lcov report the Codecov badge feed uploads (never the gate)"
dir = "{{cwd}}"
# The upload half of the ratchet, as a TASK rather than an inline
# command in ci.yml — because "which members are coverable" is a
# property of the repo (COVERAGE_EXCLUDE in its mise.toml), and a
# second hardcoded --workspace invocation drifted from coverage:check
# the instant a repo excluded anything: the lab excludes lab-pg (pgrx,
# needs a live postgres), the badge job did not, and it reddened main
# on the first push after coverage landed (#316). One task, one
# exclusion set, same llvm-tools assertion — never a task-time rustup,
# which races every other task driving the toolchain.
#
# The Go leg no longer has its own invocation at all: it calls the
# shared measurement (#707), so the drift class is closed for Go by
# construction rather than by two copies staying in step. The Rust leg
# still renders here because lcov is an output format the measurement
# script does not produce; its exclusion set is the one place a second
# copy survives, and it is asserted by the identical COVERAGE_EXCLUDE
# loop rather than a hardcoded --workspace.
run = '''
[[ -f .coverage-floor ]] && [[ -f Cargo.toml || -f go.mod ]] || {
  echo "coverage:report: no .coverage-floor, skipped"
  exit 0
}
# Go leg (#392): the profile go test writes IS the upload format —
# Codecov parses Go coverprofiles natively, so the report is the
# measurement, with no converter to drift. ci.yml selects the filename
# by repo shape (coverage.txt for Go, lcov.info for Rust).
# Every tracked language renders its own report, for the same reason
# coverage:check runs every leg: a mixed repo used to render lcov.info
# alone while ci.yml, guessing the filename from `hashFiles('go.mod')`,
# asked Codecov for a coverage.txt nothing had written. The uploader
# now takes the list of reports that actually exist.
if [[ -f go.mod ]]; then
  # ONE `go test -coverprofile` in the belt (#707). The profile Codecov
  # receives is the profile coverage:check enforces from, because it is
  # the same invocation — not two that happen to agree. This leg used to
  # write its own without `-coverpkg=./...` and handed the badge 94.9%
  # while the gate held the same tree to a floor derived from 95.4%
  # (measured on stele, 1818498). The `go` selector keeps the Rust half
  # below, which renders lcov this script does not produce.
  "${ORG_BELT_DIR}/coverage-measure.sh" coverage:report go > /dev/null
  echo "coverage:report: coverage.txt written"
fi
[[ -f Cargo.toml ]] || exit 0
if ! rustup component list --installed 2> /dev/null | grep -q "^llvm-tools"; then
  echo "coverage:report: llvm-tools component missing — declare it with the" >&2
  echo '  rust pin in mise.toml: rust = { version = "1.xx.x", components = "llvm-tools" }' >&2
  exit 1
fi
excludes=""
for m in ${COVERAGE_EXCLUDE:-}; do excludes="${excludes} --exclude ${m}"; done
# shellcheck disable=SC2086  # ${excludes} is a built '--exclude <member>' list,
# which cargo must receive as separate arguments
cargo llvm-cov --workspace --locked ${excludes} --lcov --output-path lcov.info
echo "coverage:report: lcov.info written${excludes:+ (excluding${excludes//--exclude/})}"
'''

[tasks."lint:fuzz-build"]
description = "Fuzz targets still compile (cargo-fuzz, sanitizer none, stable toolchain); repos without fuzz/ skip clean"
dir = "{{cwd}}"
# The deterministic half of the fuzz machinery (#316): a fuzz target
# that no longer compiles is dead code wearing a Scorecard point, and
# nothing else would notice until the Monday run. Building with
# `--sanitizer none` is the load-bearing choice: it works on the repo's
# own PINNED STABLE toolchain, so the gate needs no nightly — no
# mid-run rustup, no network resolution, no second toolchain pin.
# libFuzzer without a sanitizer still surfaces panics, which in a
# memory-safe crate is the failure class that exists; ASan-on-nightly
# is the reopen for FFI-heavy code (tooling-verdicts.md). Running the
# targets is time-bound and non-deterministic, so it lives in
# audit:fuzz, never here — the gate stays deterministic.
# cargo-fuzz is asserted with a remedy, never installed mid-run — the
# coverage:check/llvm-tools pattern.
run = '''
[[ -d fuzz && -f fuzz/Cargo.toml ]] || {
  echo "lint:fuzz-build: no fuzz/, skipped"
  exit 0
}
if ! command -v cargo-fuzz > /dev/null; then
  echo "lint:fuzz-build: fuzz/ exists but cargo-fuzz is missing — pin it as a build input:" >&2
  echo '  mise.toml: "cargo:cargo-fuzz" = "<version>" (installed before tasks, never mid-run)' >&2
  exit 1
fi
if [[ ! -f fuzz/Cargo.lock ]]; then
  echo "lint:fuzz-build: fuzz/Cargo.lock is not committed — an unlocked fuzz build is not deterministic" >&2
  exit 1
fi
# A LINT MUST NOT WRITE (#374). `fuzz/` is its own cargo workspace with its
# own lockfile that path-depends on the parent crate, so `cargo fuzz build`
# re-resolves and REWRITES fuzz/Cargo.lock whenever the parent version has
# moved — silently repairing the very thing it is inspecting, which means a
# stale fuzz lockfile was structurally unreportable. cargo-fuzz exposes no
# --locked of its own, so the staleness is proven first with a command that
# cannot write: `cargo metadata --locked` fails if the lockfile would have
# to change. Only once it is proven current does the build run, and a build
# over a current lockfile has nothing to rewrite. Measured on release-lab,
# where the committed lock named lab-core 0.24.1 against a 0.24.4
# workspace — four releases of drift that this check turns red.
if ! cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null 2>&1; then
  echo "lint:fuzz-build: fuzz/Cargo.lock is stale — it would be rewritten by the build" >&2
  echo "  fuzz/ is its own workspace: its lock names the parent crate's version and" >&2
  echo "  the release script refreshes it (release/prepare-release.sh)" >&2
  echo "  fix locally with: cargo update --workspace --manifest-path fuzz/Cargo.toml" >&2
  exit 1
fi
cargo fuzz build -s none
count=$(cargo fuzz list | wc -l | tr -d ' ')
echo "lint:fuzz-build: ${count} target(s) build, lockfile current"
'''

[tasks."audit:action-pins"]
description = "Version comments tell the truth, and no action pin is younger than the release-age floor (network)"
dir = "{{cwd}}"
# The two halves lint:action-pins cannot do offline, both needing the
# GitHub API and both time-varying, so both belong here rather than in
# the gate.
#
# --verify-comment resolves each pinned SHA and checks it really is the
# version the comment claims. Nothing else in the org can catch a comment
# that lies, and a lying comment is worse than a missing one: it tells
# every reviewer and Renovate that a pin is something it is not.
#
# --min-age carries the org's seven-day floor to the layer that lacked
# it. minimum_release_age governs mise tools and UV_EXCLUDE_NEWER governs
# Python dependencies; an action pin could name a release minutes old.
# Passed on the command line, not in .pinact.yaml, so it holds in
# consumer repos that carry no config and so the number has one home.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n ${files} ]] || {
  echo "audit:action-pins: no workflows or actions, skipped"
  exit 0
}
xargs pinact run --config "${ORG_BELT_DIR}/pinact.yaml" -fix=false --verify-comment --verify-min-age <<< "${files}"
echo "audit:action-pins: ok"
'''

[tasks."audit:caller-permissions"]
description = "Org consumers' uses: grants cover canon HEAD's computed requirements (network, canon only)"
dir = "{{cwd}}"
# The org-wide half of seam 2 (#358); the local half is
# lint:caller-permissions. A consumer's stub shipped atomically with
# its pin, so at its own pinned SHA it is never broken — the only
# question worth asking weekly is "will the next Renovate bump
# startup-fail this repo", and that is the comparison against canon
# HEAD. A finding here is therefore a FORECAST, not an outage: fix the
# stub before (or with) the pin bump. Renovate cannot do it — it bumps
# the uses: SHA and nothing else; the stub body is not a dependency.
# Prerequisite of the #83 transfers: one consumer is what made the
# v1.23.1 break survivable, and transfers add consumers.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:caller-permissions: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
[[ -f slsa/assert-policy.json ]] || {
  echo "audit:caller-permissions: on the canon, and the input this leg reads is missing: slsa/assert-policy.json" >&2
  echo "  a canon-only audit reds on a missing input, never skips (#738)." >&2
  exit 1
}
command -v stele > /dev/null || {
  echo "audit:caller-permissions: stele missing from the belt" >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:caller-permissions walks an org the environment names (#579) — Actions sets it; a local run exports it}"
if ! stele assert permissions \
  --policy slsa/assert-policy.json \
  --tree . \
  --org "${GITHUB_REPOSITORY_OWNER}"; then
  echo "audit:caller-permissions: a consumer's grant is below what canon" >&2
  echo "  HEAD's callee asks for — its next pin bump dies as" >&2
  echo "  startup_failure. Fix the stub before or with the bump (#358)." >&2
  exit 1
fi
'''

[tasks."audit:spec-drift"]
description = "The live SLSA source-requirements matrix still equals the pinned snapshot (network, canon only)"
dir = "{{cwd}}"
# S2 of #349: the upstream half of claims-as-data. slsa/requirements
# .toml maps what the spec asks; this leg notices when the spec moves —
# a new requirement id, a removed one, or a level change (the tick
# count) reddens Monday with the instruction to re-map, instead of the
# org discovering the change in a capstone audit's hand parse (#203,
# #349 finding 4). The extraction is the audit's own method from that
# pass: the tick columns of the requirement tables, read from the HTML,
# because two prose summarisations of the same page disagreed. A fetch
# or parse failure is "unreadable", never "unchanged" — zero rows means
# the page shape moved, and that too is a drift signal, named as such.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:spec-drift: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
# Both halves have a tree input: the pin the live page is compared
# against, and the mapping the coverage half asserts over. A canon that
# has lost either has lost the claim, not the applicability (#738).
missing=""
for f in slsa/spec-source-matrix.txt slsa/requirements.toml; do
  [[ -e ${f} ]] || missing="${missing} ${f}"
done
[[ -z ${missing} ]] || {
  echo "audit:spec-drift: on the canon, and input(s) this leg reads are missing:${missing}" >&2
  echo "  a canon-only audit reds on a missing input, never skips (#738)." >&2
  exit 1
}
if ! page=$(curl -sfL "https://slsa.dev/spec/v1.2/source-requirements"); then
  echo "audit:spec-drift: could not fetch the spec page — nothing was compared" >&2
  exit 1
fi
live=$(tr -d "\n" <<< "${page}" \
  | awk 'BEGIN{RS="<tr "} /^id="/ { id=$0; sub(/^id="/,"",id); sub(/".*/,"",id); n=gsub(/<td>✓/,""); print id, n }')
if [[ -z ${live} ]]; then
  echo "audit:spec-drift: extracted zero requirement rows — the page shape changed;" >&2
  echo "  that is itself drift: re-derive the extraction and re-map (#349 S2)" >&2
  exit 1
fi
pinned=$(grep -v "^#" slsa/spec-source-matrix.txt)
pinned_sorted=$(sort <<< "${pinned}")
live_sorted=$(sort <<< "${live}")
if [[ ${pinned_sorted} != "${live_sorted}" ]]; then
  echo "audit:spec-drift: the spec's requirement matrix moved:" >&2
  diff <(echo "${pinned_sorted}") <(echo "${live_sorted}") | sed "s/^/  /" >&2 || true
  echo "  re-map slsa/requirements.toml against the spec, then re-pin" >&2
  echo "  slsa/spec-source-matrix.txt (#349 S2, the #203 lesson)" >&2
  exit 1
fi
# COVERAGE, the half the comparison above cannot see (#123 finding 3).
# Comparing live against pinned notices when the SPEC moves; it can
# never notice a requirement the spec still has and slsa/requirements
# .toml never mapped — which is precisely what #349 finding 4 was, and
# this task's own comment used to claim it would have caught. It would
# not have. So assert the union of every source row's `spec_ids` plus
# the [[declined]] ids covers every id in the pin, and that no mapping
# names an id the pin does not have (a renamed anchor left behind).
command -v taplo > /dev/null || {
  echo "audit:spec-drift: taplo missing from the belt" >&2
  exit 1
}
reqs=$(taplo get -f slsa/requirements.toml -o json)
mapped=$(jq -r '[(.source[]? | .spec_ids[]?), (.declined[]? | .spec_id)] | unique[]' <<< "${reqs}")
pinned_ids=$(awk '{print $1}' <<< "${pinned}")
uncovered=""
while IFS= read -r id; do
  [[ -n ${id} ]] || continue
  grep -qxF "${id}" <<< "${mapped}" || uncovered="${uncovered} ${id}"
done <<< "${pinned_ids}"
stale=""
while IFS= read -r id; do
  [[ -n ${id} ]] || continue
  grep -qxF "${id}" <<< "${pinned_ids}" || stale="${stale} ${id}"
done <<< "${mapped}"
if [[ -n ${uncovered} || -n ${stale} ]]; then
  [[ -n ${uncovered} ]] && {
    echo "audit:spec-drift: spec requirement(s) neither mapped nor declined:${uncovered}" >&2
    echo "  add spec_ids to the discharging [[source]] row, or a [[declined]]" >&2
    echo "  entry naming the decision — silence is the defect (#123 finding 3)" >&2
  }
  [[ -n ${stale} ]] && {
    echo "audit:spec-drift: mapping names id(s) the spec does not have:${stale}" >&2
    echo "  an anchor was renamed or removed; re-map against the live page" >&2
  }
  exit 1
fi
count=$(wc -l <<< "${pinned}" | tr -d ' ')
echo "audit:spec-drift: ${count} requirement(s), matrix unchanged, all covered"
'''

[tasks."fix:tracks"]
description = "Render the four track tables from slsa/*.toml into their documents"
dir = "{{cwd}}"
# S2 of #349: claims as data, prose rendered. The four tables other
# repos conform to — direction.md's track table and the three per-track
# mappings — render from slsa/levels.toml and slsa/requirements.toml
# between tracks:* markers, the fix:badges pattern. Edit the TOML, run
# this; lint:tracks reddens a hand-edited render. taplo emits the TOML
# as JSON and jq builds the rows: no hand parsing on either side.
#
# Guarded on the DATA IT RENDERS, in the TASK BODY, and on neither of
# the two other things that look right (#860).
#
# Not on the identity anchor lint:tracks took in #858, because no fixer
# guards on identity — all fifteen guard on their own subject, the way
# fix:rust asks for a Cargo.toml and fix:citation for a REUSE.toml. That
# rule and #738's are not in tension: #738 is about a CHECK going quietly
# green, and lint:tracks still reds BY NAME on any input missing on the
# canon. A fixer that declines to write asserts nothing.
#
# And not in tracks.sh, which is the tempting place now that both halves
# invoke it. lint:tracks renders into a `mktemp -d` copy carrying docs/
# and slsa/ and nothing else — no security/identity.toml, and not a git
# repository at all — so an identity-shaped guard down there would skip
# in the one place the check depends on the render running, and the diff
# would compare the untouched copy against itself. Measured 2026-08-24
# with a forged row planted in docs/direction.md: guard in tracks.sh,
# `lint:tracks: ok`, exit 0, the org's one table checked by nothing;
# guard here, exit 1 naming the drift. The helper renders; deciding
# whether to render at all belongs to the caller that knows the tree.
run = '''
[[ -f slsa/levels.toml && -f slsa/requirements.toml ]] || {
  echo "fix:tracks: no track data, skipped"
  exit 0
}
# From the belt (#445), and invoked directly by both halves rather than
# one of them running the other: a nested `mise run` inside a task races
# the parallel lint fan-out and fails to resolve its own lockfile
# (#82, #764).
bash "${ORG_BELT_DIR}/tracks.sh"
'''

[tasks."lint:tracks"]
description = "The rendered track tables equal what slsa/*.toml renders (drift is red)"
dir = "{{cwd}}"
# The lint half of fix:tracks, lint:badges-shaped: re-render into a
# copy and diff. A hand edit to a rendered table reddens here with the
# instruction to edit the data instead — which is what makes the TOML
# the single source the audits can trust. Deterministic; gate-eligible.
#
# Canon-only, on the family's identity guard (#738, extended to the
# gate by #858). What this replaced guarded on its own data —
# `slsa/levels.toml && -d docs` — and neither path is held by
# lint:canon-policy, so a canon that lost either stopped checking that
# docs/direction.md, the org's one table, still equals what the TOML
# renders. Green, silently, in the gate. The data is a REQUIREMENT
# now: every input this re-render reads is named, and its absence on
# the canon reds instead of excusing the check.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "lint:tracks: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
missing=""
for f in slsa/levels.toml slsa/requirements.toml docs/direction.md \
  docs/source-track.md docs/build-track.md docs/dependency-track.md; do
  [[ -e ${f} ]] || missing="${missing} ${f}"
done
[[ -z ${missing} ]] || {
  echo "lint:tracks: on the canon, and input(s) this render reads are missing:${missing}" >&2
  echo "  a canon-only check reds on a missing input, never skips (#738)." >&2
  exit 1
}
tmp=$(mktemp -d)
cp -R docs "${tmp}/docs"
cp -R slsa "${tmp}/slsa"
(cd "${tmp}" && bash "${ORG_BELT_DIR}/tracks.sh" > /dev/null 2>&1) || {
  echo "lint:tracks: the render itself failed — run fix:tracks for the error" >&2
  exit 1
}
drift=0
for doc in direction source-track build-track dependency-track; do
  diff -u "docs/${doc}.md" "${tmp}/docs/${doc}.md" || drift=1
done
if [[ ${drift} -ne 0 ]]; then
  echo "lint:tracks: a rendered table drifted from slsa/*.toml — edit the" >&2
  echo "  data and run fix:tracks; the table cells are render output (#349 S2)" >&2
  exit 1
fi
echo "lint:tracks: ok"
'''

[tasks."audit:release-tags"]
description = "Every release tag org-wide: mint tagger, signature from the epoch on, source link on the target (network, canon only)"
dir = "{{cwd}}"
# S4 of #349, mechanism now stele's tag audit (its
# docs/assert-policy-schema.md, tags section): for every release tag
# in every org repo, the tagger is the policy-declared minting role,
# the tag from the repo's signing epoch onward carries a gitsign
# signature verified NATIVELY against the trusted root (CMS over the
# tag payload — no gitsign binary here; the mint still uses its own),
# and the tag's target carries a source chain link. The epochs are
# policy data (slsa/assert-policy.json tags.epochs, absorbing the
# retired security/tag-signing-epoch.txt); the legacy bound is derived
# from the chain itself. GitHub's own verification field is still
# never consulted: it cannot judge x509-in-the-PGP-slot and would
# report every signed tag unsigned.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:release-tags: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
[[ -f slsa/assert-policy.json ]] || {
  echo "audit:release-tags: on the canon, and the input this leg reads is missing: slsa/assert-policy.json" >&2
  echo "  the epochs are policy data, so without it no tag can be judged;" >&2
  echo "  a canon-only audit reds on a missing input, never skips (#738)." >&2
  exit 1
}
command -v gh > /dev/null || {
  echo "audit:release-tags: gh missing" >&2
  exit 1
}
command -v stele > /dev/null || {
  echo "audit:release-tags: stele missing from the belt" >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:release-tags walks an org the environment names (#579) — Actions sets it; a local run exports it}"
stele assert tags \
  --org "${GITHUB_REPOSITORY_OWNER}" \
  --policy slsa/assert-policy.json
'''

[tasks."audit:drafts"]
description = "Every draft release org-wide explains itself — a burn, a rehearsal, or unexplained residue (network, canon only)"
dir = "{{cwd}}"
# #597. `release/tag-release.sh` cuts a draft at tag time and phase 2
# publishes it; anything that stops in between leaves the draft behind.
# The tag is immutable and the version spent — correctly burned — but
# the draft is outside that taxonomy and nothing counted it. Nothing
# NOTICED it either, and the reason is load-bearing: the evidence walk,
# the tag walk and `derive vex-subjects` all enumerate NON-DRAFT
# releases, and `gh release view` with no tag returns the latest
# PUBLISHED release, so a draft is invisible to every judgment the org
# makes — by coincidence of how those enumerations are written. Written
# down now (docs/release.md); this is the check that keeps the count
# from growing back while nobody is reading.
#
# Where the count came from is the argument for the audit: the issue
# that decided this build said four, counted by eye off the releases
# pages. There were thirty-two, across three repositories — the #305
# shape, an exception list an order of magnitude under its own
# population. Eyes do not enumerate; walks do.
#
# The finding is "unexplained", never "present": a draft is a legitimate
# state for as long as a release is in flight, and a rehearsal
# (`dry-run: true`) leaves one deliberately and forever. Both write a
# `<!-- draft-record: -->` marker at the moment their reason is known —
# the burn from publish.yml's burn-record job, the rehearsal from
# attach-release.yml — so what is left over is exactly the residue
# nobody can classify by looking.
#
# The 24h grace is the org's staleness grace (#310 finding 1), reused
# rather than reinvented: the record is written seconds after the
# failure, and the longest full-width publish is well under an hour, so
# a day is generous past every legitimate in-flight draft and still
# catches residue on the next Monday cron.
#
# The record's `Fixed forward in:` line is deliberately NOT required.
# The fix has not been cut when the burn is recorded, so requiring it
# would make this audit red until a human types something — red by
# default, which is the state that trains people to ignore a check.
run = '''
# The identity guard is the whole guard here (#738): the probe, the org
# listing and each repo's releases are the inputs — nothing in the tree
# — so this leg has no required input to red on.
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:drafts: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
command -v gh > /dev/null || {
  echo "audit:drafts: gh missing" >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:drafts walks an org the environment names (#579) — Actions sets it; a local run exports it}"
# THE VISIBILITY PROBE, and it is the whole reason this task can be
# trusted (#604). GitHub serves draft releases only to identities it
# considers entitled to them: a token without that entitlement gets a
# 200 and a list with every draft silently removed — indistinguishable
# from a clean org, the exact "reads nothing, reports clean" shape
# #240/#310 exist to refuse.
#
# The first version of this guard asserted `.permissions.push` per repo
# before believing any listing. Right instinct, wrong measurement: on
# the first dispatch (run 32393697805) the assert passed on all four
# repos and GitHub still served none of the thirty-two drafts that
# existed, because draft visibility is not what that permission bit
# expresses for a fine-grained token. The general statement, and the
# reason no permission object is read here any more: **no permission
# bit is a proof of visibility. The only honest measurement of "can
# this token see drafts" is seeing a draft.**
#
# So the audit makes one. It creates an ephemeral draft in the
# repository it runs from, asserts that draft comes back in the same
# release LISTING the walk below believes (never a direct read by id —
# a direct read succeeds for tokens the listing filters, which would
# prove the wrong thing), and deletes it. Visibility is proven by
# construction for the token in hand: no org literal, no sentinel draft
# that decays the day someone deletes it, and it works unchanged for
# any adopter. The probe spends the same token the listing spends —
# probing with a stronger one would prove a capability nobody uses.
#
# What the probe proves is the grant of ONE token, which is the whole
# contract: audit.yml wires the org-wide fine-grained AUDIT_TOKEN,
# whose permissions are uniform across its repository selection. A
# token whose capability varies per repository — `github.token`, push-
# capable in its own repo and nowhere else — is out of contract, and
# audit.yml says so at the wiring.
probe_repo="${GITHUB_REPOSITORY:-}"
if [[ -z ${probe_repo} ]]; then
  probe_repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner 2> /dev/null) || probe_repo=""
fi
[[ -n ${probe_repo} ]] || {
  echo "audit:drafts: cannot name the repository this audit runs from, so there is" >&2
  echo "  nowhere to prove draft visibility. Refusing to judge unproven." >&2
  exit 1
}
# Not v-prefixed, deliberately: nothing here creates a tag (a draft's tag
# is only cut at publish), but a name no `v*` trigger or ruleset could
# ever match keeps that true by inspection rather than by argument.
probe_tag="audit-visibility-probe-$(date -u +%Y%m%d%H%M%S)-$$"
# Annotated at CREATION, not afterwards: if the delete below fails, the
# residue has to explain itself the moment it exists, or this audit's own
# leftovers become the unexplained drafts it reports.
# shellcheck disable=SC2016  # the backticks quote task and file names in the
# draft's own markdown; nothing here is a substitution
probe_body='<!-- draft-record: audit-probe -->
**`audit:drafts` visibility probe — safe to delete.**

This draft was created by `audit:drafts` to prove that the token running
the audit can actually see draft releases, and should have been deleted
seconds later. It is here because the delete failed; the run that created
it went red saying so. Nothing was tagged and nothing was published.
'
probe_err="${TMPDIR:-/tmp}/audit-drafts-probe-$$.err"
if ! probe_id=$(gh api "repos/${probe_repo}/releases" -X POST \
  -f tag_name="${probe_tag}" \
  -f name="audit:drafts visibility probe" \
  -f body="${probe_body}" \
  -F draft=true --jq .id 2> "${probe_err}"); then
  echo "audit:drafts: could not create the visibility probe in ${probe_repo} —" >&2
  echo "  draft visibility is unproven, so no listing is believed and no count" >&2
  echo "  is reported. A number from a blind token is worse than no number." >&2
  sed 's/^/    /' "${probe_err}" >&2
  rm -f "${probe_err}"
  echo "  The token needs Contents: read and write on the audited repositories" >&2
  echo "  — read to see drafts at all, write to make the one that proves it." >&2
  echo "  audit.yml carries the environment-scoped AUDIT_TOKEN for this." >&2
  exit 1
fi
rm -f "${probe_err}"
probe_seen=""
# Three attempts, and this is read-after-write hygiene rather than a
# retry that papers over a refusal: a token that cannot see drafts never
# sees this one, however many times it asks. Read whole, then match —
# `grep -q` closes the pipe early and `gh --paginate` dies of SIGPIPE,
# which under this shell's pipefail is a false refusal (the
# audit:source-vsa lesson, and this is the listing it applies to most).
for attempt in 1 2 3; do
  if probe_listing=$(gh api "repos/${probe_repo}/releases" --paginate \
    --jq '.[] | select(.draft) | .tag_name' 2> /dev/null); then
    if grep -qxF "${probe_tag}" <<< "${probe_listing}"; then
      probe_seen="yes"
      break
    fi
  fi
  [[ ${attempt} == "3" ]] || sleep 2
done
# Cleanup runs on BOTH paths and neither swallows the other: a blind
# token still leaves a probe to delete, and the blindness is the more
# important of the two findings, so it is the one reported first.
probe_deleted="yes"
gh api -X DELETE "repos/${probe_repo}/releases/${probe_id}" > /dev/null 2>&1 || probe_deleted=""
if [[ -z ${probe_seen} ]]; then
  echo "audit:drafts: this token cannot see draft releases." >&2
  echo "  The probe draft ${probe_repo}@${probe_tag} was created and GitHub's own" >&2
  echo "  release listing did not return it — the listing is being filtered, and" >&2
  echo "  an empty listing from a filtered token is indistinguishable from a" >&2
  echo "  clean org (#604). Refusing to report a count nobody could trust." >&2
  echo "  Fix the token grant (Contents: read on every audited repository), not" >&2
  echo "  this check: no permission bit is a proof of visibility, so there is" >&2
  echo "  nothing here to loosen." >&2
  [[ -n ${probe_deleted} ]] || {
    echo "  The probe draft could not be deleted either — remove it by hand:" >&2
    echo "    gh api -X DELETE repos/${probe_repo}/releases/${probe_id}" >&2
  }
  exit 1
fi
if [[ -z ${probe_deleted} ]]; then
  echo "audit:drafts: could not delete the visibility probe" >&2
  echo "  ${probe_repo}@${probe_tag} (release id ${probe_id})." >&2
  echo "  It carries a draft-record marker, so it will not be reported as" >&2
  echo "  unexplained residue — but residue is what it is. Delete it:" >&2
  echo "    gh api -X DELETE repos/${probe_repo}/releases/${probe_id}" >&2
  exit 1
fi
if ! population=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/repos" --paginate \
  --jq '.[] | select(.archived or .fork | not) | .name' 2> /dev/null); then
  echo "audit:drafts: could not enumerate the org's repositories — no population, no audit" >&2
  exit 1
fi
[[ -n ${population} ]] || {
  echo "audit:drafts: the org listing named zero repositories — the walk is broken, not the org" >&2
  exit 1
}
now=$(date -u +%s)
cutoff=$((now - 86400))
unexplained=""
drafts=0
recorded=0
young=0
walked=0
for repo in ${population}; do
  # Read whole, never piped into a reader that closes early: gh
  # --paginate dies on SIGPIPE (the audit:source-vsa lesson). An errored
  # listing refuses; it is never read as "this repo has no drafts".
  if ! listing=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/releases" --paginate --jq '
      .[] | select(.draft)
      | [.tag_name, (.created_at | fromdateiso8601 | tostring),
         (((.body // "") | contains("<!-- draft-record:")) | tostring)]
      | @tsv' 2> /dev/null); then
    echo "audit:drafts: could not list ${repo}'s releases — unreadable is never clean" >&2
    exit 1
  fi
  walked=$((walked + 1))
  while IFS=$'\t' read -r tag created marked; do
    [[ -n ${tag} ]] || continue
    drafts=$((drafts + 1))
    if [[ ${marked} == "true" ]]; then
      recorded=$((recorded + 1))
      continue
    fi
    if [[ ${created} -ge ${cutoff} ]]; then
      # In flight, or too fresh to judge. Not a finding.
      young=$((young + 1))
      continue
    fi
    age=$(((now - created) / 86400))
    unexplained="${unexplained}
  ${repo}@${tag} — draft for ${age}d, no draft-record"
  done <<< "${listing}"
done
if [[ -n ${unexplained} ]]; then
  echo "audit:drafts: ${walked} repo(s) walked, drafts that explain nothing:${unexplained}" >&2
  echo "  a draft nobody can classify by looking is why this check exists (#597)." >&2
  echo "  Record it — do not delete it: the draft is the only artifact of a" >&2
  echo "  failed attempt other than run logs, which expire at 90 days." >&2
  echo "    REPO=${GITHUB_REPOSITORY_OWNER}/<repo> TAG=<vX.Y.Z> KIND=burn \\" >&2
  echo "      RUN_URL=<the run that burned it> release/record-draft.sh" >&2
  exit 1
fi
echo "audit:drafts: visibility proven in ${probe_repo}, ${walked} repo(s) walked, ${drafts} draft(s): ${recorded} recorded, ${young} in flight"
'''

[tasks."audit:citations"]
description = "Every citation of an org release and every workflow-run URL in docs/ resolves against a real tag or run (network, canon only)"
dir = "{{cwd}}"
# S2's cheap leg (#349): the docs cited "lab v0.19.1, which it blocked"
# for a tag that never existed, and the error survived two audits
# because checking a citation meant a human resolving it by hand
# (finding 2). This resolves every citation of an org release in docs/
# against the live org — a fabricated or mistyped one is a red Monday,
# not a reading exercise.
#
# THE CITATION FORM, stated here because this is where it is enforced:
# **an org-record citation names its repository beside its version.**
#
#   `.github@v1.24.1`                    repo@version, the pin form
#   `monumental-archive/stele@v0.2.2`    the same, owner-qualified
#   stele v0.16.0                        repo, then version
#   https://github.com/monumental-archive/stele/releases/tag/v0.2.2
#
# Bare `vX.Y.Z` with nothing beside it is prose about the world and is
# NOT walked. The first matcher took every semver in `docs/` as a claim
# about the org's record, and was wrong in both directions on its first
# dispatch (run 32393697805): it demanded an org tag for golangci-lint's
# v2.12.2 — honest prose in tooling-verdicts.md naming the binary whose
# linter catalogue was read — while passing `edtf`'s v1.0.0, an equally
# external version that resolved only because the canon happens to hold
# a v1.0.0 tag of its own. A walk whose population does not match the
# question it asks fails silently as readily as it fails loudly, the
# shape stele#181 records.
#
# Rejected, so it is not re-proposed: an allowlist of external versions.
# It is paperwork that decays with every tool bump, and an exclusion
# vocabulary for things that were never in the population. Three such
# exclusions the old matcher carried — a version in double quotes is a
# MENTION, a suffixed version is an example, "schema vX.Y.Z" names a
# third-party schema — are DELETED by this change rather than kept:
# none was ever a claim about this org's record, so none needs an
# exception now that the population asks the right question.
#
# Because a citation now names its repository, each resolves against
# THAT repository's tags rather than the union of every org repo's. The
# union was a workaround for citations that did not say which repo they
# meant; the form removes its reason, and with it the class of false
# pass that `edtf`'s v1.0.0 belongs to.
#
# The narrowing is deliberate and its cost is stated: a bare version
# that IS an org claim now escapes the walk. That is why the form is
# written here, in `CONTRIBUTING.md` where docs authors meet it, and why
# `docs/` was swept into it in one pass — measured, the same org
# citations resolving before and after.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:citations: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
# docs/ is what this leg walks, and the walk is collected once here: a
# canon that has lost it reds by name (#738), and a docs/ holding no
# tracked markdown reds too — resolving zero citations out of zero
# documents is the "read nothing, report clean" shape, not a clean org.
[[ -d docs ]] || {
  echo "audit:citations: on the canon, and the input this leg walks is missing: docs/" >&2
  echo "  a canon-only audit reds on a missing input, never skips (#738)." >&2
  exit 1
}
docs=$(git ls-files ':!vendor/**' "docs/*.md")
[[ -n ${docs} ]] || {
  echo "audit:citations: on the canon, and docs/ holds no tracked markdown —" >&2
  echo "  there is nothing to resolve, so there is nothing to report clean (#738)." >&2
  exit 1
}
command -v gh > /dev/null || {
  echo "audit:citations: gh missing" >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:citations walks an org the environment names (#579) — Actions sets it; a local run exports it}"
if ! repos=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/repos" --paginate --jq '.[].name' 2> /dev/null); then
  echo "audit:citations: could not enumerate org repos — nothing was resolved" >&2
  exit 1
fi
[[ -n ${repos} ]] || {
  echo "audit:citations: the org listing named zero repositories — the walk is" >&2
  echo "  broken, not the docs, and nothing was resolved" >&2
  exit 1
}
# One alternation of live repository names — no literal list of repos in
# the belt, so an imported repo is walked the Monday it exists. Longest
# first, so a name that prefixes another cannot win the shorter match.
# Only `.` needs escaping: GitHub repository names are limited to
# `A-Za-z0-9._-`, and of those only the dot is an ERE metacharacter —
# unescaped, `.github` would match any character followed by "github".
by_length=$(awk '{ print length, $0 }' <<< "${repos}" | sort -rn | cut -d' ' -f2-)
names=""
while IFS= read -r r; do
  [[ -n ${r} ]] || continue
  names="${names}|${r//./\\.}"
done <<< "${by_length}"
names="${names#|}"
tags=""
for repo in ${repos}; do
  t=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY_OWNER}/${repo}" "v[0-9]*" 2> /dev/null \
    | sed -n "s|.*refs/tags/\(v[0-9][0-9.]*\)$|${repo} \1|p") || true
  tags="${tags}
${t}"
done
fail=""
# `|| true` on both collectors, and it is not a shrug: grep exits 1 for
# "matched nothing", which is a legitimate answer here — docs citing no
# org releases, or no Actions runs, is a state this audit must survive
# rather than crash on. Under the belt's `-o pipefail` shell that 1 would
# kill the task. Load-bearing for the run-URL collector especially: it
# matches nothing on this tree today, which is exactly how the strict
# shell surfaced it (#82 finding 2).
cited=$(xargs grep -hoE \
  "(${GITHUB_REPOSITORY_OWNER}/)?(${names})[@ ]v[0-9]+\.[0-9]+\.[0-9]+" <<< "${docs}" | sort -u) || true
linked=$(xargs grep -hoE \
  "github\.com/${GITHUB_REPOSITORY_OWNER}/(${names})/releases/tag/v[0-9]+\.[0-9]+\.[0-9]+" <<< "${docs}" | sort -u) || true
# Both forms normalise to "repo version" before anything is resolved, so
# the resolver has one shape to answer about. `sed '/^$/d'` and not
# `grep -v`: an empty collection is legitimate, and grep's exit 1 for
# "matched nothing" would kill the pipeline under pipefail.
pairs=$({
  sed -E "s|^(${GITHUB_REPOSITORY_OWNER}/)?(.+)[@ ](v[0-9]+\.[0-9]+\.[0-9]+)$|\\2 \\3|" <<< "${cited}"
  sed -E "s|^github\.com/${GITHUB_REPOSITORY_OWNER}/(.+)/releases/tag/(v[0-9]+\.[0-9]+\.[0-9]+)$|\\1 \\2|" <<< "${linked}"
} | sed '/^$/d' | sort -u)
vn=0
while IFS=' ' read -r repo ver; do
  [[ -n ${repo} && -n ${ver} ]] || continue
  vn=$((vn + 1))
  grep -qxF "${repo} ${ver}" <<< "${tags}" || fail="${fail}
  cited in docs/ as an org release, but no such tag in ${repo}: ${ver}"
done <<< "${pairs}"
runs=$(xargs grep -hoE "github\.com/${GITHUB_REPOSITORY_OWNER}/[A-Za-z0-9._-]+/actions/runs/[0-9]+" \
  <<< "${docs}" | sort -u) || true
rn=0
while IFS= read -r r; do
  [[ -n ${r} ]] || continue
  rn=$((rn + 1))
  repo=$(cut -d/ -f3 <<< "${r}")
  id=$(cut -d/ -f6 <<< "${r}")
  gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/actions/runs/${id}" --jq .id > /dev/null 2>&1 \
    || fail="${fail}
  run URL cited in docs/ does not resolve: https://${r}"
done <<< "${runs}"
if [[ -n ${fail} ]]; then
  echo "audit:citations: citations that resolve to nothing:${fail}" >&2
  echo "  a citation is a claim about the record — correct the document" >&2
  echo "  or the record, never leave them disagreeing (#349 finding 2)" >&2
  exit 1
fi
dn=$(wc -l <<< "${docs}" | tr -d ' ')
echo "audit:citations: ${dn} doc(s) walked, ${vn} org release citation(s) and ${rn} run URL(s) all resolve"
'''

[tasks."audit:adoption"]
description = "Every org repo carries every required governance artifact, or opts out in writing (network, canon only)"
dir = "{{cwd}}"
# S7 of #349: #266's population rule applied to every per-repo
# obligation instead of one. audit:source-vsa enumerates chains;
# nothing enumerated the rest — which is how the signer carried no
# audit stub and nobody noticed until a capstone audit read the org by
# hand (finding 8). Absence plus silence is the only red state —
# "deliberate" survives as a written exception, never as a gap.
#
# The POPULATION is slsa/assert-policy.json's roster, not the forge
# listing (#693). It used to be the listing, and a roster-declared
# EXCLUSION was therefore invisible: the only way to stop the walk
# demanding evidence of a repository that owes none was a written
# opt-out row per artifact. Measured 2026-08-21, monumental-archive
# needed four of them — audit, scorecard, source-attest,
# dependency-review — which is an exclusion decaying into a standing
# exception, the one thing the vocabulary forbids. An exclusion
# produces NOTHING; an exception is dated and loud.
#
# The listing is still read, for exactly one thing: reconciliation by
# NAME in both directions, so a repository in the org and absent from
# the roster SCREAMS rather than being quietly walked, and one declared
# but not listed screams too. A count cannot say which went missing.
#
# The obligation set is derived per repository from what its declared
# membership makes applicable — mise/adoption-population.py holds that
# derivation and the table tests for it. "Does not apply" and "has not
# got" are different sentences, and only the second is debt.
# The canon's self-* variants and gate.yml satisfy the same
# obligations under their canonical alternate names.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:adoption: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
roster="slsa/assert-policy.json"
[[ -f ${roster} ]] || {
  echo "audit:adoption: ${roster} missing — the roster IS the population," >&2
  echo "  so without it there is nothing to walk (#693); a canon-only audit" >&2
  echo "  reds on a missing input, never skips (#738)" >&2
  exit 1
}
command -v gh > /dev/null || {
  echo "audit:adoption: gh missing" >&2
  exit 1
}
[[ -n ${GH_TOKEN:-} ]] || {
  echo "audit:adoption: GH_TOKEN is unset — CANNOT_JUDGE. The population" >&2
  echo "  contains a private member, and a credential that cannot see it" >&2
  echo "  enumerates a short org and reports the difference as adoption" >&2
  echo "  gaps (#692)." >&2
  exit 1
}
: "${GITHUB_REPOSITORY_OWNER:?audit:adoption walks an org the environment names (#579) — Actions sets it; a local run exports it}"
# One object per line, re-slurped into an array: `gh --paginate` emits
# one JSON array PER PAGE, and concatenated arrays are not JSON. A
# single-page org hides that; the org that outgrows a page would not.
if ! listing=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/repos?per_page=100" --paginate \
  --jq '.[] | {name, private, archived, fork}' 2> /dev/null | jq -s '.'); then
  echo "audit:adoption: could not enumerate the org's repositories — CANNOT_JUDGE" >&2
  echo "  (no listing, no reconciliation: the roster would go unchecked)" >&2
  exit 1
fi
derive="${ORG_BELT_DIR}/adoption-population.py"
if ! population=$(python3 "${derive}" population --roster "${roster}" <<< "${listing}"); then
  echo "audit:adoption: the roster was refused, so no population was derived" >&2
  exit 1
fi
unlisted=$(sed -n 's/^UNLISTED\t//p' <<< "${population}")
absent=$(sed -n 's/^ABSENT\t//p' <<< "${population}")
repos=$(sed -n 's/^POP\t//p' <<< "${population}")
optout="security/adoption-optout.txt"
fail=""
blind=""
checked=0
tagged=""
seen=$(mktemp -d)
for repo in ${repos}; do
  # Unreadable is CANNOT_JUDGE, never a gap. The old branch here read
  # "unreadable is not adopted", which is a finding against a repository
  # the walk never saw — and for a private member with a token scoped to
  # this repo alone, that is every artifact it owes (#692).
  if ! gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/contents/.github/workflows" \
    --jq '.[].name' > "${seen}/${repo}" 2> /dev/null; then
    blind="${blind} ${repo}"
    rm -f "${seen}/${repo}"
    continue
  fi
  # The versioned archetype is proven by CONSEQUENCE, not by config: a
  # repository carrying v* tags has released, so it owes the release
  # machinery. cliff.toml was the old marker and retired with git-cliff
  # (#505) — which silently switched this obligation OFF for the canon
  # the moment that file went, the exact "a check nobody runs" shape
  # #354 exists to prevent. Tags cannot be deleted to escape the check
  # (org-default-tag protects them), and a versioned repo that loses
  # release.yml entirely is now caught, which the file marker never did.
  # A tag is an ACT, not a claim, so this stays a consequence and is not
  # narrowed by a repository's declared tracks: it can only make the
  # audit louder (#693).
  # Read whole, never piped into grep -q: gh --paginate dies on SIGPIPE
  # when the reader closes early (the audit:source-vsa lesson).
  tags=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/tags" --paginate --jq '.[].name' 2> /dev/null || true)
  if grep -qE '^v[0-9]' <<< "${tags}"; then
    tagged="${tagged} ${repo}"
  fi
done
# The obligations are DERIVED from declared membership, never listed
# here: "does not apply" leaves no row behind, which is what keeps an
# exclusion from decaying into a standing exception (#693).
if ! owed=$(python3 "${derive}" obligations --roster "${roster}" \
  --tagged "${tagged}" <<< "${listing}"); then
  echo "audit:adoption: the roster was refused, so no obligations were derived" >&2
  exit 1
fi
while IFS=$'\t' read -r _ repo artifact names; do
  [[ -n ${repo} ]] || continue
  # A repo the walk could not read is already CANNOT_JUDGE; judging its
  # obligations against an empty file list would manufacture findings.
  [[ -f ${seen}/${repo} ]] || continue
  found=false
  IFS='|' read -ra alts <<< "${names}"
  for f in "${alts[@]}"; do
    grep -qxF "${f}" "${seen}/${repo}" && found=true
  done
  checked=$((checked + 1))
  [[ ${found} == true ]] && continue
  if [[ -f ${optout} ]] && grep -qE "^${repo}[[:space:]]+${artifact}[[:space:]]+[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+\S" "${optout}"; then
    continue
  fi
  fail="${fail}
  ${repo}: missing ${artifact} (no workflow named ${names}) and no opt-out row"
done <<< "${owed}"
if [[ -n ${blind} ]]; then
  echo "audit:adoption: CANNOT_JUDGE — could not read .github/workflows in:${blind}" >&2
  echo "  The walk never saw these repositories, so it knows nothing about" >&2
  echo "  what they have adopted. Red because unknown is not clean (#266)," >&2
  echo "  but this is the credential's failure, not theirs: grant the token" >&2
  echo "  Contents: read on every member of the population (#692)." >&2
  exit 1
fi
reconciled=0
if [[ -n ${unlisted} ]]; then
  echo "audit:adoption: in the org and NOT in the roster:" >&2
  while IFS= read -r name; do echo "  ${name}" >&2; done <<< "${unlisted}"
  echo "  The roster is the org's statement of its own shape, so a" >&2
  echo "  repository missing from it is walked by nothing and covered by" >&2
  echo "  no claim. Declare it in ${roster} — with its tracks, or with an" >&2
  echo "  empty track list and a reason if it is an exclusion — or" >&2
  echo "  transfer it out (#266, #693)." >&2
  reconciled=1
fi
if [[ -n ${absent} ]]; then
  echo "audit:adoption: declared in the roster and NOT in the org listing:" >&2
  while IFS= read -r name; do echo "  ${name}" >&2; done <<< "${absent}"
  echo "  Either the repository is gone and the roster is stale, or the" >&2
  echo "  token cannot see it — both are red, and neither is clean." >&2
  reconciled=1
fi
if [[ -n ${fail} ]]; then
  echo "audit:adoption: population gaps:${fail}" >&2
  echo "  wire the stub per docs/runbook.md, or record the exception in" >&2
  echo "  ${optout} as 'repo artifact YYYY-MM-DD reason' (#349 S7, #266)." >&2
  echo "  An artifact a repository's declared membership does not make" >&2
  echo "  applicable never reaches this list and needs no row (#693)." >&2
  reconciled=1
fi
# One red never hides another: an undeclared repository and a missing
# stub are different defects with different owners, and reporting only
# the first would send the reader back for a second round.
[[ ${reconciled} -eq 0 ]] || exit 1
count=$(wc -w <<< "${repos}" | tr -d ' ')
echo "audit:adoption: ${count} roster repo(s), ${checked} derived obligations, no silent gaps"
'''

[tasks."audit:signer-surface"]
description = "The signer's live allowlist equals the declared surface, and every declared type has a live caller (network, canon only)"
dir = "{{cwd}}"
# S5 of #349: the signing surface as data. The signer's case statement
# is the enforcement; security/signing-surface.toml is the declaration
# with a named caller per type; this leg reconciles the two against the
# LIVE signer file and the canon's tracked callers. Three reds, each a
# different defect: an allowlist arm with no declared row (undeclared
# capability), a declared row missing from the allowlist (the caller is
# about to break), and a declared row whose caller no longer requests
# the type (dead capability — finding 6's shape, now a Monday red
# instead of an audit's sharp eye). Reads fail closed and say so: a leg
# that cannot read the signer must not report agreement or drift.
run = '''
git ls-files --error-unmatch security/identity.toml > /dev/null 2>&1 || {
  echo "audit:signer-surface: no tracked security/identity.toml, not the canon, skipped"
  exit 0
}
[[ -f security/signing-surface.toml ]] || {
  echo "audit:signer-surface: on the canon, and the input this leg reads is missing: security/signing-surface.toml" >&2
  echo "  the declaration is one half of the reconciliation, so without it" >&2
  echo "  there is nothing to compare the signer against; a canon-only audit" >&2
  echo "  reds on a missing input, never skips (#738)." >&2
  exit 1
}
command -v gh > /dev/null || {
  echo "audit:signer-surface: gh missing" >&2
  exit 1
}
. "${ORG_BELT_DIR}/identity.sh"
signer_wf=$(org_identity signer-workflow)
signer_repo="${signer_wf%%/.github/*}"
signer_path="${signer_wf#"${signer_repo}"/}"
if ! signer=$(gh api "repos/${signer_repo}/contents/${signer_path}" \
  -H "Accept: application/vnd.github.raw" 2> /dev/null); then
  echo "audit:signer-surface: could not read the signer's sign.yml — no comparison was made" >&2
  exit 1
fi
# The allowlist arms: URL-shaped case patterns inside the validate step.
live=$(grep -oE '^[[:space:]]+https://[^)]+\)' <<< "${signer}" \
  | sed 's|[[:space:]]*||; s|)$||' | sort -u)
declared=$(sed -n 's|^type = "\(.*\)"$|\1|p' security/signing-surface.toml | sort -u)
fail=""
while IFS= read -r t; do
  [[ -n ${t} ]] || continue
  grep -qxF "${t}" <<< "${declared}" \
    || fail="${fail}
  allowlist arm has no declared row: ${t}"
done <<< "${live}"
while IFS= read -r t; do
  [[ -n ${t} ]] || continue
  grep -qxF "${t}" <<< "${live}" \
    || fail="${fail}
  declared type is not on the signer's allowlist: ${t}"
done <<< "${declared}"
# Every declared row's caller exists and actually requests the type.
rows=$(awk '
  /^type = / { gsub(/^type = "|"$/, ""); t = $0 }
  /^caller = / { gsub(/^caller = "|"$/, ""); printf "%s\t%s\n", t, $0 }
' security/signing-surface.toml)
n=0
while IFS=$'\t' read -r t c; do
  [[ -n ${t} ]] || continue
  n=$((n + 1))
  if [[ ! -f ${c} ]]; then
    fail="${fail}
  declared caller does not exist: ${c} (for ${t})"
  elif ! grep -qF "predicate-type: ${t}" "${c}"; then
    fail="${fail}
  declared caller ${c} does not request ${t} — dead capability"
  fi
done <<< "${rows}"
[[ ${n} -gt 0 ]] || fail="${fail}
  signing-surface.toml declares no rows — an empty declaration declares nothing"
if [[ -n ${fail} ]]; then
  echo "audit:signer-surface: the surface and its callers disagree:${fail}" >&2
  echo "  reconcile security/signing-surface.toml with the signer's case" >&2
  echo "  statement and the callers' predicate-type lines (#349 S5)" >&2
  exit 1
fi
echo "audit:signer-surface: ${n} declared type(s), allowlist and callers agree"
'''

[tasks."audit:fuzz"]
description = "Run every fuzz target for a bounded interval (network/time-bound, never the gate)"
dir = "{{cwd}}"
# The runtime half (#316), at cargo-fuzz's own defaults since #445:
# AddressSanitizer, which is what `-s address` means and what the tool
# does when you say nothing. The org ran `-s none` until 2026-08-16 —
# below the tool's DEFAULT, not merely below its maximum — because ASan
# needs `-Zsanitizer=address` and so a nightly toolchain, and the gate
# must not need one. Splitting the two halves settles it: the gate's
# lint:fuzz-build still proves targets COMPILE on the pinned stable with
# no sanitizer, while the sanitized run lives here, on the cron, outside
# the gate, in the repos that actually fuzz. `--careful` comes with it:
# std rebuilt with debug assertions and extra const-UB and init checks.
#
# WHAT THIS IS AND IS NOT. A bounded weekly run from a committed corpus
# is a smoke test, not a proof — fuzzing is sampling, and no arrangement
# of it is correct by construction. A campaign that accumulates would be
# standing infrastructure, which the org does not run by choice, so the
# corpus (fuzz/corpus/<target>/, committed) is curated by humans and the
# cron never pushes. docs/best-practices.md answers `dynamic_analysis`
# accordingly and refuses to claim it for a CI gate.
#
# The nightly is DECLARED by the repo, never discovered: a task that used
# ASan where a nightly happened to exist and fell back silently otherwise
# would vary its enforcement by machine, which is the failure this belt
# closes everywhere else.
run = '''
[[ -d fuzz && -f fuzz/Cargo.toml ]] || {
  echo "audit:fuzz: no fuzz/, skipped"
  exit 0
}
command -v cargo-fuzz > /dev/null || {
  echo "audit:fuzz: cargo-fuzz missing (pin cargo:cargo-fuzz in mise.toml)" >&2
  exit 1
}
if [[ -z ${FUZZ_TOOLCHAIN:-} ]]; then
  echo "audit:fuzz: FUZZ_TOOLCHAIN is not declared — sanitized fuzzing needs a nightly toolchain" >&2
  echo "  AddressSanitizer is cargo-fuzz's default and needs -Zsanitizer, so stable cannot run it" >&2
  echo "  declare BOTH toolchains in this repo's mise.toml (mise holds and locks both):" >&2
  echo "    [tools]" >&2
  echo '    rust = ["1.xx.x", "nightly-YYYY-MM-DD"]' >&2
  echo "    [env]" >&2
  echo '    FUZZ_TOOLCHAIN = "nightly-YYYY-MM-DD"' >&2
  echo "  a dated nightly, never bare 'nightly' — a moving channel is not a pinned input" >&2
  exit 1
fi
if ! rustup toolchain list 2> /dev/null | grep -q "^${FUZZ_TOOLCHAIN}"; then
  echo "audit:fuzz: FUZZ_TOOLCHAIN='${FUZZ_TOOLCHAIN}' is declared but not installed" >&2
  echo "  it rides the rust pin in mise.toml so it installs before tasks run, never mid-run" >&2
  exit 1
fi
# --careful implies -Zbuild-std, which rebuilds the standard library from
# source and fails without rust-src. Asserted with a remedy rather than
# discovered halfway through a build, the llvm-tools/clippy pattern.
if ! rustup component list --installed --toolchain "${FUZZ_TOOLCHAIN}" 2> /dev/null | grep -q "^rust-src"; then
  echo "audit:fuzz: the nightly lacks rust-src, which --careful needs (it implies -Zbuild-std)" >&2
  echo "  components ride the pin, so declare them there rather than adding them by hand:" >&2
  echo "    rust = [\"1.xx.x\", { version = \"${FUZZ_TOOLCHAIN}\", components = \"rust-src\" }]" >&2
  exit 1
fi
secs="${FUZZ_SECONDS:-60}"
targets=$(cargo fuzz list)
failed=""
while IFS= read -r target; do
  [[ -n ${target} ]] || continue
  echo "audit:fuzz: ${target} for ${secs}s under AddressSanitizer (${FUZZ_TOOLCHAIN})"
  RUSTUP_TOOLCHAIN="${FUZZ_TOOLCHAIN}" cargo fuzz run -s address --careful "${target}" \
    -- -max_total_time="${secs}" || failed="${failed} ${target}"
done <<< "${targets}"
if [[ -n ${failed} ]]; then
  echo "audit:fuzz: crashing target(s):${failed}" >&2
  echo "  the reproducer is fuzz/artifacts/<target>/crash-<hash>, uploaded by repo-audit.yml" >&2
  echo "  replay it with: cargo fuzz run <target> fuzz/artifacts/<target>/crash-<hash>" >&2
  exit 1
fi
echo "audit:fuzz: all targets ran ${secs}s clean under ASan"
'''

[tasks."audit:go-fuzz"]
description = "Run every Go fuzz target for a bounded interval (time-bound, never the gate)"
dir = "{{cwd}}"
# The runtime half (#445), the Go mirror of audit:fuzz — and cheaper to
# stand up, because the fuzzing engine is in the toolchain: no extra
# binary, no sanitizer flag, and no nightly. Coverage instrumentation is
# built in on amd64 and arm64, which is every runner the org uses.
#
# `-fuzztime` is not optional: the documented default is to run FOREVER,
# so a task that forgot it would hang the cron rather than fail it. Two
# further defaults are deliberately left alone because they ARE the
# tool's maximum: minimization stays on (60s, and `-fuzzminimizetime 0`
# would disable it), and the package's ordinary tests still run before
# fuzzing begins, which is what stops the engine reporting what a unit
# test already covers.
#
# -fuzz matches exactly ONE target in ONE package per invocation, by
# design, so the loop is structural rather than a convenience.
#
# TWO passes per target, plain then race, rather than a choice between
# them. The race detector is Go's nearest equivalent to the
# AddressSanitizer the Rust half runs, but it costs 31x throughput
# (measured: 425,319 execs/sec against 13,605), and the two instruments
# find different things — the plain pass explores for panics and logic
# failures, the race pass observes concurrency in targets whose code is
# concurrent at all. Choosing one would drop a class of finding; the
# org's answer to instrumentation cost on a free weekly cron is more
# seconds, not fewer checks (#445, the --careful ruling). Wall time is
# 2 x FUZZ_SECONDS per target, which is a number, not a constraint.
#
# WHAT THIS IS AND IS NOT, as with the Rust half: a bounded weekly run is
# a smoke test, not a proof. What makes it worth running is where a
# finding LANDS — the engine writes the failing input into
# testdata/fuzz/<Target>/, and the gate's lint:go-fuzz-seeds replays it
# from then on. The cron finds it once; the committed corpus keeps it
# found. The cron never pushes: a machine-generated input is proposed to
# a human, never merged by one.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n ${mods} ]] || {
  echo "audit:go-fuzz: no go.mod tracked, skipped"
  exit 0
}
command -v go > /dev/null || {
  echo "audit:go-fuzz: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
secs="${FUZZ_SECONDS:-60}"
failed=""
ran=0
while IFS= read -r m; do
  [[ -n ${m} ]] || continue
  d=$(dirname "${m}")
  while IFS= read -r pkg; do
    [[ -n ${pkg} ]] || continue
    while IFS= read -r target; do
      [[ -n ${target} ]] || continue
      ran=$((ran + 1))
      echo "audit:go-fuzz: ${target} in ${pkg} for ${secs}s, plain"
      (cd "${d}" && go test -fuzz "^${target}\$" -fuzztime "${secs}s" "${pkg}") \
        || failed="${failed} ${pkg}.${target}(plain)"
      echo "audit:go-fuzz: ${target} in ${pkg} for ${secs}s, race detector on"
      (cd "${d}" && CGO_ENABLED=1 go test -race -fuzz "^${target}\$" -fuzztime "${secs}s" "${pkg}") \
        || failed="${failed} ${pkg}.${target}(race)"
    done < <((cd "${d}" && go test -list '^Fuzz' "${pkg}" 2> /dev/null) | grep '^Fuzz' || true)
  done < <((cd "${d}" && go list ./... 2> /dev/null) || true)
done <<< "${mods}"
[[ ${ran} -gt 0 ]] || {
  echo "audit:go-fuzz: no Go fuzz targets, skipped"
  exit 0
}
if [[ -n ${failed} ]]; then
  echo "audit:go-fuzz: crashing target(s):${failed}" >&2
  echo "  the failing input is named in the output above, under testdata/fuzz/<Target>/" >&2
  echo "  repo-audit.yml keeps it as an artifact; commit it and it becomes the regression" >&2
  exit 1
fi
echo "audit:go-fuzz: ${ran} target(s) ran ${secs}s clean"
'''

[tasks."lint:licence"]
description = "The repo carries its licence: tracked LICENSE or LICENSES/, and REUSE.toml's expression filled"
dir = "{{cwd}}"
# "Every repo carries its own" was a statement of intent that nothing
# implemented, and the predictable result was that no repo carried one
# (#214) — the same shape as the BuildEnv defect: a claim with no
# mechanism, believed because it was written down. This is the
# mechanism. The licence itself stays a per-repo choice (the canon is
# 0BSD; a crate repo will dual-license MIT OR Apache-2.0); what the
# belt enforces is only that the choice was MADE: a tracked licence
# text exists, and a tracked REUSE.toml does not still carry the
# scaffold's angle-bracket placeholder. Deterministic, offline,
# tracked files only. Skips only an empty tree — a repo with content
# and no licence is exactly the defect, never an exemption.
run = '''
tracked=$(git ls-files | sed -n 1p)
[[ -n ${tracked} ]] || {
  echo "lint:licence: no tracked files, skipped"
  exit 0
}
lic=$(git ls-files ':!vendor/**' "LICENSE" "LICENSE.*" "LICENSES/*")
if [[ -z ${lic} ]]; then
  echo "lint:licence: no tracked LICENSE or LICENSES/ — every repo carries its own licence (#214)" >&2
  echo "  with no licence the default is all rights reserved, the opposite of the intent" >&2
  exit 1
fi
if git ls-files --error-unmatch "REUSE.toml" > /dev/null 2>&1 \
  && grep -q "<SPDX expression>" "REUSE.toml"; then
  echo "lint:licence: REUSE.toml still carries the scaffold's <SPDX expression> placeholder — pick the licence (#214)" >&2
  exit 1
fi
echo "lint:licence: ok"
'''

[tasks."lint:reuse"]
description = "REUSE-spec compliance over tracked files (the lint api.reuse.software will run), pre-registration"
dir = "{{cwd}}"
# lint:licence proves a licence was CHOSEN; this proves the tree
# actually complies with the choice — the gap between the two shipped
# three defects past every existing check (#316): a per-file MIT header
# silently overriding a 0BSD tree, a CC0 header with no licence text,
# and the scaffold stub parsing as a real nested REUSE.toml. "Compliant
# at registration time" was an unenforced adjective; this is the
# audit-claims cure, same as lint:citation's. Scratch-tree
# materialisation (the lint:trivy pattern): reuse walks directories,
# and the working tree holds .org-toolbelt and build output it must
# never see. Deterministic, offline, gate-worthy. Guarded on a tracked
# root REUSE.toml — a repo that has not declared yet skips clean
# (lint:licence is what chases the declaration).
run = '''
git ls-files --error-unmatch "REUSE.toml" > /dev/null 2>&1 || {
  echo "lint:reuse: no tracked REUSE.toml, skipped"
  exit 0
}
scratch=$(mktemp -d)
trap 'rm -rf "${scratch}"' EXIT
git ls-files -z | rsync -a0 --files-from=- . "${scratch}"
reuse --root "${scratch}" lint
'''

[tasks."fix:citation"]
description = "Render CITATION.cff from REUSE.toml (licence, authors, repository) plus the preserved human fields"
dir = "{{cwd}}"
# CFF has no extends:, so shared has to mean DERIVED (#316 findings 1+6,
# one fix): REUSE.toml is the single root for licence and authorship,
# and every field of CITATION.cff except two is a fact read from it or a
# constant. The two human fields — title, and the concept-DOI identifier
# recorded after the first mint — are preserved on regeneration, as are
# version and date-released, which release/prepare-release.sh stamps.
# mint-doi.yml reads the rendered file for licence and creators, so the
# permanent record can no longer contradict the tree that produced it
# (the v0.22.1 sandbox record said MIT for a 0BSD repo, credited to a
# machine account — both fields were fallbacks nothing checked).
# CITATION_OUT overrides the output path; lint:citation renders through
# it to prove the committed file agrees without writing the tree.
#
# authors is the one field that is a claim about people rather than a
# fact about a tree: derived from SPDX-PackageSupplier, honest at one
# maintainer, and wants a real answer at two — the bus_factor wall.
run = '''
# From the belt, like every other canon-owned derivation (#445), and
# invoked directly by both halves rather than one of them running the
# other: a nested `mise run` inside a task races the parallel lint
# fan-out and fails to resolve its own lockfile (#82, #764).
bash "${ORG_BELT_DIR}/citation.sh"
'''

[tasks."lint:citation"]
description = "CITATION.cff agrees with its sources, and a DOI-minting repo carries one"
dir = "{{cwd}}"
# The enforcement half of the derivation (#316 finding 6): "citable" was
# an unenforced adjective — release-lab passed mint-doi: true with no
# CITATION.cff and every layer degraded quietly (the stub lint never
# looked, prepare-release.sh skipped its stamping, mint-doi fell back to
# crediting the machine account). Three silent skips and a published
# record wrong twice over. This lint is the audit-claims contract
# applied here: a repo whose release stub requests DOI minting MUST
# carry the file, and a carried file MUST byte-equal what fix:citation
# renders from its sources. Deterministic, tracked files only, skips
# clean where neither condition applies — a linter that cannot skip
# cannot be universal.
run = '''
minting=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" | xargs grep -lE "^[^#]*mint-doi:[[:space:]]*true" 2> /dev/null || true)
if [[ ! -f CITATION.cff ]]; then
  if [[ -n ${minting} ]]; then
    echo "lint:citation: mint-doi: true with no CITATION.cff — a citable repo carries its citation (#316 finding 6):" >&2
    echo "${minting}" >&2
    echo "  run fix:citation (REUSE.toml is the source), commit the render" >&2
    exit 1
  fi
  echo "lint:citation: no CITATION.cff and no mint-doi request, skipped"
  exit 0
fi
if [[ ! -f REUSE.toml ]]; then
  echo "lint:citation: CITATION.cff exists but REUSE.toml (its source of truth) does not" >&2
  exit 1
fi
tmp=$(mktemp)
trap 'rm -f "${tmp}"' EXIT
CITATION_OUT="${tmp}" bash "${ORG_BELT_DIR}/citation.sh" > /dev/null
if ! diff -u CITATION.cff "${tmp}"; then
  echo "lint:citation: CITATION.cff drifted from its sources — edit REUSE.toml (or the human fields) and run fix:citation" >&2
  exit 1
fi
echo "lint:citation: CITATION.cff agrees with REUSE.toml"
'''

[tasks."fix:badges"]
description = "Render the README badge block from the repository's own tree facts (derive, never assert)"
dir = "{{cwd}}"
# The canon is consumer #1 (#316 finding 5 and its working session):
# it publishes badge machinery it must itself consume, and the badge
# block is where that law was broken — a hand-authored block drifted
# five shields wide from the template it shipped, with nothing able to
# notice. So the block is now COMPUTED: every shield is a fact about
# the tree (the gate → workflow status; scorecard.yml → Scorecard; the
# publish stub's classes → registry shields; CITATION.cff's concept
# DOI → the DOI shield; direction.md's tracks → the three SLSA
# shields), and the only hand-maintained state is .badge-states — the
# written-down-debt pattern — naming what waits on a human step
# (`bestpractices pending` → `bestpractices <BP_ID>`, `reuse pending`
# → `reuse registered`). The coverage shield is not stateful: it
# renders iff `.coverage-floor` exists, so a repo that cannot measure
# coverage simply has no coverage shield rather than a declared one
# over no data (#347). If a
# repo's render needs an `if repo == .github` branch, the design is
# wrong — there is none. fair-software is computed from the other
# shields' truth, dot by dot, never the static 5/5 image (#316).
# Renders between `badges:begin`/`badges:end` markers in README.md;
# BADGES_OUT renders the block alone to a path, for lint:badges.
run = '''
set -euo pipefail
# From the belt, like every other canon-owned input (#445). This used
# to try mise/ then .org-canon/ and SKIP CLEAN when it found neither,
# so a consumer clone rendered nothing and said so in a line nobody
# reads, while lint:badges below asserted nothing and reported a pass
# (#568). ORG_BELT_DIR resolves in both worlds, which makes the
# degraded state unrepresentable rather than detected: there is no
# "no canon tree" branch left to get wrong.
"${ORG_BELT_DIR}/derive-badges.sh"
'''

[tasks."lint:bestpractices"]
description = "`.bestpractices.json` uses key names the badge app accepts; repos without one skip clean"
dir = "{{cwd}}"
# The regression guard for a failure that was invisible for a day. The
# badge app builds its input whitelist from the criteria YAML keys —
# ALL_CRITERIA_STATUS = Criteria.all.map(&:status), so
# :osps_ac_01_01_status — while `projects/<id>.json` renders the display
# ID, OSPS-AC-01.01_status. A file built by editing that download keys
# every Baseline criterion the wrong way;
# CriterionFieldValidator.validate_field_name returns nil on a miss and
# RepoJsonDetective does `next unless field_sym`, so all 64 are skipped
# with no error and the metal series fills normally. Both of this org's
# files shipped that way.
#
# Deterministic and offline, so gate-legal: it greps for the display-ID
# key form and checks the size cap. It deliberately does NOT validate
# JSON syntax, status enums or the 8192-char justification limit — that
# needs a JSON parser, and jq is not a pinned belt tool (it appears only
# in network-bound tasks that run on a runner). Those limits are
# documented in docs/best-practices.md; this guards the one failure that
# is silent.
run = '''
files=$(git ls-files ':!vendor/**' ".bestpractices.json" "*/.bestpractices.json" ".project.d/bestpractices.json")
[[ -n ${files} ]] || {
  echo "lint:bestpractices: no .bestpractices.json, skipped"
  exit 0
}

rc=0
while IFS= read -r f; do
  bad=$(grep -o '"OSPS-[A-Z][A-Z]-[0-9][0-9]\.[0-9][0-9]_[a-z]*"' "${f}" | sort -u || true)
  if [[ -n ${bad} ]]; then
    echo "lint:bestpractices: ${f}: display-ID keys the badge app silently drops:" >&2
    # shellcheck disable=SC2001  # an anchored per-line indent; ${x//from/to} has no line anchor
    sed 's/^/  /' <<< "${bad}" >&2
    echo "  use the criteria YAML key form instead: osps_ac_01_01_status" >&2
    rc=1
  fi
  size=$(wc -c < "${f}")
  if ((size > 100000)); then
    echo "lint:bestpractices: ${f}: ${size} bytes exceeds MAX_FILE_SIZE (100000);" >&2
    echo "  the app checks the size before downloading and skips the file entirely" >&2
    rc=1
  fi
done <<< "${files}"

count=$(wc -l <<< "${files}")
((rc == 0)) && echo "lint:bestpractices: ${count} file(s) clean"
exit "${rc}"
'''

[tasks."lint:badges"]
description = "The README badge block equals what fix:badges derives — asserted shields cannot drift from tree facts"
dir = "{{cwd}}"
# The enforcement half: a badge block that can only exist as
# fix:badges' output cannot silently disagree with the repository it
# describes, which retires both halves of #316 finding 5 — the canon's
# five-shield drift (hand-authored block beside a published template)
# and audit:badges' presence-blindness (a missing shield now means the
# derivation said it does not apply, because nothing else can produce
# the block). Repos without the markers skip clean — adoption is a
# per-repo step the Monday audit reports on org-wide.
run = '''
[[ -f README.md && -f REUSE.toml ]] || {
  echo "lint:badges: no README or REUSE.toml, skipped"
  exit 0
}
if ! grep -q "<!-- badges:begin -->" README.md; then
  echo "lint:badges: no badges:begin marker, machinery not adopted here yet, skipped"
  exit 0
fi
tmp=$(mktemp)
trap 'rm -f "${tmp}" "${tmp}.cur"' EXIT
# The derivation is invoked directly, never via `mise run fix:badges`: a
# nested mise inside a task races the parallel lint fan-out and fails to
# resolve its own lockfile, which made `mise run ci` unrunnable locally
# and forced --no-verify on every push (#82).
# From the belt (#445), never a two-branch probe: the old resolution
# skipped clean in any consumer clone, so a local `mise run ci` omitted
# the badge assertion entirely and passed (#568).
BADGES_OUT="${tmp}" "${ORG_BELT_DIR}/derive-badges.sh" > /dev/null
awk '/<!-- badges:begin -->/{f=1; next} /<!-- badges:end -->/{f=0} f' README.md > "${tmp}.cur"
if ! diff -u "${tmp}.cur" "${tmp}"; then
  echo "lint:badges: the badge block drifted from the tree's facts — run fix:badges and commit the render" >&2
  exit 1
fi
echo "lint:badges: badge block agrees with the derivation"
'''

[tasks."lint:release-stub"]
description = "A versioned repo carries the canonical release stubs and a root CHANGELOG.md"
dir = "{{cwd}}"
# The versioned archetype is two files: release.yml, publish.yml — and
# the registries pin the publish.yml FILENAME, so a missing or renamed
# stub breaks trusted publishing with nothing local going red.
# release.yml is the archetype marker: continuous repositories do not
# have one and skip clean. (cliff.toml was the old marker; it retired
# with git-cliff — stele derive carries the conventions in the shared
# scripts, .github#505.)
# The changelog is the third file the archetype needs and the one no
# check named: `stele derive release-plan --prepare` splices the notes
# into a root CHANGELOG.md and refuses when it is absent — after the
# merge, on main, which is the most expensive place the org has to find
# a missing file (#742, edtf's run in #669). Measured on the real
# deriver: absent gives `reading CHANGELOG.md: ... no such file or
# directory`, and a hand-invented preamble whose h2 carries a version
# gives `already carries a section for <version>` when it carries none
# — which is why the remedy is the scaffold's file rather than "write
# one".
run = '''
[[ -f .github/workflows/release.yml ]] || {
  echo "lint:release-stub: no release.yml, not a versioned repo, skipped"
  exit 0
}
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
canon_re="${canon//./\\.}"
bad=""
for f in .github/workflows/release.yml .github/workflows/publish.yml; do
  if [[ ! -f ${f} ]]; then
    bad="${bad} ${f}(missing)"
  # In the canon itself these two files ARE the reusable implementations
  # (they declare workflow_call), not caller stubs; the canon's wiring is
  # self-release.yml's local `uses:`, exercised on every push to main.
  elif grep -qE "^[[:space:]]+workflow_call:" "${f}"; then
    continue
  elif ! grep -qE "uses: ${canon_re}/.github/workflows/(release|publish)\.yml@[0-9a-f]{40}|uses: \./\.github/workflows/(release|publish)\.yml" "${f}"; then
    bad="${bad} ${f}(no pinned org uses)"
  fi
done
# Tracked, not merely present: the release runs from a checkout of the
# ref, so an untracked file on somebody's disk is not the file the
# deriver will read.
changelog=ok
git ls-files --error-unmatch CHANGELOG.md > /dev/null 2>&1 || changelog=missing
if [[ -n ${bad} ]]; then
  echo "lint:release-stub: versioned repo with broken release stubs:${bad}" >&2
  echo "  copy scaffold/ from ${canon}; the publish.yml filename is load-bearing" >&2
fi
if [[ ${changelog} == missing ]]; then
  echo "lint:release-stub: versioned repo with no tracked root CHANGELOG.md" >&2
  echo "  copy scaffold/CHANGELOG.md from ${canon}; the release path derives its notes into it" >&2
fi
if [[ -n ${bad} || ${changelog} == missing ]]; then
  exit 1
fi
echo "lint:release-stub: ok"
'''

[tasks."lint:toolbelt-lock"]
description = "Every pinned tool has a locked entry (mise config vs mise.lock)"
dir = "{{cwd}}"
# Renovate can bump a version line but cannot always refresh the lock:
# `mise lock` is an unsafe execution, and `allowedUnsafeExecutions` is a
# self-hosted-only setting we do not control on the hosted App. A pin that
# moves while its checksums stay behind is what this catches, and it fails
# the pull request rather than installing something unverified.
run = '''
cfg=""
for c in mise/config.toml mise.toml .mise.toml; do
  [[ -f ${c} ]] && {
    cfg="${c}"
    break
  }
done
[[ -n ${cfg} ]] || {
  echo "lint:toolbelt-lock: no mise config, skipped"
  exit 0
}
lock="mise.lock"
[[ ${cfg} == */* ]] && lock="${cfg%/*}/mise.lock"
[[ -f ${lock} ]] || {
  echo "lint:toolbelt-lock: no ${lock}, skipped"
  exit 0
}
# Anchored at column 0, because a tool may be pinned as an ARRAY of
# versions — `rust = [{ version = "1.97.1", ... }, "nightly-..."]`, which
# is how a repo declares a second toolchain for audit:fuzz (#445). taplo
# indents those entries, so an unanchored `cut -d= -f1` read each one as
# a tool named `{version` and reported them missing from the lock. Found
# by release-lab being the first repo to use the form.
keys=$(sed -n '/^\[tools\]/,/^\[/p' "${cfg}" | grep -E '^"?[A-Za-z0-9_:./@-]+"?[[:space:]]*=' | cut -d= -f1 | tr -d ' "')
# A verification loop that processes zero items and reports success is the
# check announcing that it checked nothing. Fail instead.
[[ -n ${keys} ]] || {
  echo "lint:toolbelt-lock: no tools parsed from ${cfg}" >&2
  exit 1
}
missing=""
while IFS= read -r k; do
  [[ -n ${k} ]] || continue
  grep -qxF "[[tools.\"${k}\"]]" "${lock}" && continue
  grep -qxF "[[tools.${k}]]" "${lock}" && continue
  missing="${missing} ${k}"
done <<< "${keys}"
if [[ -n ${missing} ]]; then
  echo "lint:toolbelt-lock: ${cfg} pins tools absent from ${lock}:${missing}" >&2
  exit 1
fi
count=$(wc -w <<< "${keys}" | tr -d " ")
echo "lint:toolbelt-lock: ${count} tools locked in ${lock}"
'''

[tasks."audit:lock-arch"]
description = "Locked assets carry the architecture their platform key declares (release listings — network, not in ci)"
dir = "{{cwd}}"
# lint:toolbelt-lock above proves every pinned tool HAS a locked entry.
# This proves the entry is for the platform it claims. Nothing did, and
# the gap is not theoretical: three entries across the org resolved an
# x86_64 asset under a key spelled `macos-arm64` (#811, #854), each with
# that binary's checksum pinned beside it. The install succeeds, the
# binary runs emulated, and the lock looks complete — a pin describing a
# platform other than the one it names, which is a weaker claim than it
# reads as.
#
# audit:*, not lint:*: the offline half of the question (does the asset
# name disagree with the key?) is answerable from the diff, but the half
# that matters is not. A disagreement is only a defect if upstream
# actually publishes a native asset for that platform; where it ships
# none, aqua's `rosetta2` fallback is CORRECT and a red on it would be
# a check demanding something that does not exist. That answer lives in
# a release listing, so this reads one — network-bound by nature, and
# structurally outside the gate.
run = '''
locks=$(git ls-files ':!vendor/**' "mise.lock" "*/mise.lock")
[[ -n ${locks} ]] || {
  echo "audit:lock-arch: no mise.lock tracked, skipped"
  exit 0
}
command -v gh > /dev/null || {
  echo "audit:lock-arch: gh is missing — CANNOT_JUDGE. This check asks a" >&2
  echo "  release which assets it published; without gh it cannot ask." >&2
  exit 1
}
candidates=$(printf '%s\n' "${locks}" | python3 "${ORG_BELT_DIR}/lock-arch.py")
# Dated allowances. A KNOWN, FILED, DEFERRED mismatch is carried the way
# deny.toml carries a skip — with its date and the issue that retires
# it — and for the same reason: the alternative is a scheduled red that
# nobody can act on, which is how a check decays into noise. It is NOT
# an exemption. An allowed entry still prints, in full, on every run, so
# the log says the defect exists and where its fix lives; and an
# allowance that stops matching anything FAILS below, because a skip
# that silently matches nothing is the failure mode deny.toml taught us
# to refuse. The issue that fixes the defect deletes its line here.
# CURRENTLY EMPTY, and that is deliberate — do NOT tidy the mechanism
# away now that #854 has closed the only tenant it ever had. Keeping it
# at rest was ruled over deleting it because an allowance here is not a
# seam by either test that matters: it SILENCES nothing, since an
# allowed entry prints in full on every run naming the defect and where
# its fix lives; and it cannot OUTLIVE its cause, since an allowance
# matching nothing fails below. No-seams bans opt-outs that HIDE; this
# one advertises. The next tenant is not hypothetical either — the one
# sweep that stood this check up found two mismatches across 48 tools.
declared=""
used=""
failed=""
while IFS=$'\t' read -r lock tool platform declared_plat asset repo tag pattern; do
  [[ -n ${lock} ]] || continue
  assets=$(gh api "repos/${repo}/releases/tags/${tag}" --jq '.assets[].name' 2> /dev/null) || {
    echo "audit:lock-arch: CANNOT_JUDGE ${repo}@${tag} — the release listing did not read" >&2
    echo "  (rate limit, or a tag that no longer exists). Not judged, not passed." >&2
    exit 1
  }
  native=$(grep -Ei "${pattern}" <<< "${assets}" | sed -n 1p || true)
  if [[ -z ${native} ]]; then
    echo "audit:lock-arch: ${tool} [${platform}] resolves ${asset}; ${repo}@${tag}"
    echo "  publishes no ${declared_plat} asset at all, so emulation is the only"
    echo "  thing upstream offers — not a defect."
    continue
  fi
  allowance=""
  case "${tool}|${platform}" in
    # No allowances at present. One is a single arm —
    #   "<tool>|<platform>") allowance="<date>, #<issue> — <the fix>" ;;
    # — and adding it, together with its key in `declared` above,
    # obliges the issue it names to delete both again.
    *)
      # Anything not named above is unallowed, which is the point: a new
      # mismatch reds on arrival rather than joining a tolerated set.
      allowance=""
      ;;
  esac
  if [[ -n ${allowance} ]]; then
    used="${used} ${tool}|${platform}"
    echo "audit:lock-arch: KNOWN DEFECT ${tool} [${platform}] in ${lock} resolves"
    echo "  ${asset} while ${repo}@${tag} publishes ${native}."
    echo "  Allowed ${allowance}"
    continue
  fi
  failed="${failed} ${tool}[${platform}]"
  echo "audit:lock-arch: ${tool} [${platform}] in ${lock} resolves ${asset}," >&2
  echo "  but ${repo}@${tag} publishes ${native} — the lock names an" >&2
  echo "  architecture it does not carry." >&2
done <<< "${candidates}"
stale=""
for a in ${declared}; do
  [[ " ${used} " == *" ${a} "* ]] || stale="${stale} ${a}"
done
if [[ -n ${stale} ]]; then
  echo "audit:lock-arch: allowance(s) matching nothing:${stale}" >&2
  echo "  the defect they carry is gone; delete the line and its issue reference" >&2
  exit 1
fi
if [[ -n ${failed} ]]; then
  echo "audit:lock-arch: lock entries naming an architecture they do not carry:${failed}" >&2
  echo "  a native asset exists for each. Correct the resolution — the belt's" >&2
  echo "  mise/aqua-registry.yaml is the delivered channel for an aqua package —" >&2
  echo "  or file the defect and carry a dated allowance beside the others." >&2
  exit 1
fi
echo "audit:lock-arch: ok"
'''

[tasks."lint:nested-permissions"]
description = "Every nested `uses:` job states its permissions (startup_failure trap)"
dir = "{{cwd}}"
# The trap, measured rather than read: a `uses:` job with no `permissions:`
# block inherits the WORKFLOW-level default of the file it is written in —
# not the grant its caller made. So `permissions: {}` at the top of a shared
# workflow, which is correct practice and which this org applies everywhere,
# silently starves every nested call beneath it. The callee then requests
# more than its calling job holds, which is an elevation, and the run dies as
# `startup_failure` with no jobs, no annotations and no log.
#
# Nothing else catches it. actionlint, zizmor --persona=pedantic and
# lint:capability-boundary all pass on the broken file, because each is
# correct in isolation and the contract spans two workflows.
#
# Scoped to workflow_call files: in an ordinary workflow the caller IS the
# top level, so omitting permissions there is merely the usual default.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:nested-permissions: no workflows, skipped"
  exit 0
}
bad=""
checked=0
for f in .github/workflows/*.y*ml; do
  # Any file with a `uses:` job — reusable workflows AND caller stubs.
  # The trap is identical in both: a `uses:` job with no `permissions:`
  # block takes the WORKFLOW-level default, never the caller's grant.
  # Scoping this to workflow_call files missed every caller stub, which
  # is exactly where the grant has to be written — and a shared workflow
  # that gains a permission breaks all of its callers at once, silently.
  grep -qE "^    uses:" "${f}" || continue
  checked=$((checked + 1))
  offenders=$(awk '
    /^jobs:[[:space:]]*$/ { injobs = 1; next }
    injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ {
      if (job != "" && uses && !perms) print job
      job = $1; sub(/:$/, "", job); uses = 0; perms = 0; next
    }
    injobs && /^    uses:/ { uses = 1 }
    injobs && /^    permissions:/ { perms = 1 }
    END { if (job != "" && uses && !perms) print job }
  ' "${f}")
  for j in ${offenders}; do bad="${bad} ${f}:${j}"; done
done
if [[ -n ${bad} ]]; then
  echo "lint:nested-permissions: nested uses: job with no permissions block:" >&2
  for b in ${bad}; do echo "  ${b}" >&2; done
  echo "  it inherits the workflow-level default, not the caller grant —" >&2
  echo "  state exactly what the called workflow needs, or the run dies as" >&2
  echo "  startup_failure with no jobs and no log." >&2
  exit 1
fi
echo "lint:nested-permissions: ${checked} workflow(s) with uses: jobs clean"
'''

[tasks."lint:audit-scheduled"]
description = "Every audit:* task has a workflow that runs it (a check nobody runs is no check)"
dir = "{{cwd}}"
# Seam 1 of #358: which audit legs run was one fact derived at two sites
# — the task list here and the job list in audit.yml — with no join.
# Both `audit:release-tags` and `audit:spec-drift` shipped as tasks,
# were cited in prose as enforcing, and NO workflow ran either (#354,
# fixed #356). This is the join: red on any audit:* task with no
# `mise run audit:<name>` occurrence anywhere in .github/workflows/.
# Deliberately no opt-out row — an unscheduled audit task IS the
# defect; a task nobody should run should not exist. Linted, not
# generated: generating audit.yml from the task list would mean
# templating workflow YAML, and audit legs legitimately carry per-leg
# permissions and env the task list cannot express.
#
# TWO HALVES, and the split is what #704 corrected. This lint used to
# open with `[[ -f mise/config.toml ]] || exit 0` — so it enforced "a
# check nobody runs is no check" on exactly the one repository where
# that was already true, and exempted every repository where it was
# not. The asymmetry was invisible from inside the canon, which was the
# only place the lint ran.
#
# Half 1 is the BELT's audit tasks. It stays guarded on mise/config.toml
# and that guard now has a stated reason rather than being a silent
# exemption: those tasks are DEFINED in that file and no consumer
# carries it, so outside the canon the half has no subject, not a
# waived one.
#
# Half 2 is this repository's OWN audit tasks, and it runs everywhere.
# A repo-defined audit task is satisfied by a workflow that runs it
# directly, or by one that calls repo-audit.yml — whose collecting leg
# runs every audit:* the caller defines (#704). Naming repo-audit.yml
# as a satisfying answer is not a loophole: it is the mechanism that
# made the property true for consumers in the first place.
run = '''
status=0

if [[ -f mise/config.toml ]]; then
  bad=""
  count=0
  audits=$(grep -oE '^\[tasks\."audit:[a-z-]+"\]' mise/config.toml \
    | sed 's/^\[tasks\."audit:\(.*\)"\]$/\1/')
  while IFS= read -r t; do
    [[ -n ${t} ]] || continue
    count=$((count + 1))
    grep -rEq "mise run audit:${t}([^a-z-]|$)" .github/workflows/ \
      || bad="${bad} audit:${t}"
  done <<< "${audits}"
  if [[ ${count} -eq 0 ]]; then
    echo "lint:audit-scheduled: zero belt audit tasks enumerated — the grep is broken" >&2
    status=1
  elif [[ -n ${bad} ]]; then
    echo "lint:audit-scheduled: belt audit task(s) no workflow ever runs:${bad}" >&2
    echo "  schedule each in .github/workflows/ (audit.yml, publish.yml or" >&2
    echo "  repo-audit.yml) or delete the task — a check nobody runs is a" >&2
    echo "  claim, not a check (#358 seam 1)." >&2
    status=1
  else
    echo "lint:audit-scheduled: ${count} belt audit task(s), every one scheduled"
  fi
fi

. "${ORG_BELT_DIR}/own-audits.sh"
own=$(own_audit_tasks)
if [[ -z ${own} ]]; then
  echo "lint:audit-scheduled: this repository defines no audit:* of its own"
  exit "${status}"
fi
if ! compgen -G ".github/workflows/*.y*ml" > /dev/null; then
  echo "lint:audit-scheduled: repo-defined audit task(s) and NO workflows at all:" >&2
  while IFS= read -r t; do
    [[ -n ${t} ]] && echo "    ${t}" >&2
  done <<< "${own}"
  echo "  wire the audit stub (workflow-templates/audit.yml) — it calls" >&2
  echo "  repo-audit.yml, whose collecting leg runs every audit:* this" >&2
  echo "  repository defines (#704)." >&2
  exit 1
fi
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
canon_re="${canon//./\\.}"
collected=0
grep -rEq "uses:[[:space:]]*(${canon_re}/|\./)\.github/workflows/repo-audit\.ya?ml" \
  .github/workflows/ && collected=1
missing=""
own_count=0
while IFS= read -r t; do
  [[ -n ${t} ]] || continue
  own_count=$((own_count + 1))
  [[ ${collected} -eq 1 ]] && continue
  grep -rEq "mise run ${t}([^a-z-]|$)" .github/workflows/ || missing="${missing} ${t}"
done <<< "${own}"
if [[ -n ${missing} ]]; then
  echo "lint:audit-scheduled: repo-defined audit task(s) no workflow runs:${missing}" >&2
  echo "  wire the audit stub (workflow-templates/audit.yml), which calls" >&2
  echo "  repo-audit.yml and collects every audit:* this repository defines," >&2
  echo "  or run each from a workflow here — or delete the task. A check" >&2
  echo "  nobody runs is a claim, not a check (#358 seam 1, #704)." >&2
  status=1
elif [[ ${collected} -eq 1 ]]; then
  echo "lint:audit-scheduled: ${own_count} repo-defined audit task(s), collected by repo-audit.yml"
else
  echo "lint:audit-scheduled: ${own_count} repo-defined audit task(s), each run by a workflow here"
fi
exit "${status}"
'''

[tasks."lint:canon-policy"]
description = "A tree carrying the belt carries the org's policy documents (#579)"
dir = "{{cwd}}"
# The loudness the audit guards' name branch used to buy, relocated
# (#579). Only the canon tracks mise/config.toml, so a tree carrying
# the belt owes the documents the belt's canon-only tasks read, and
# this gate lint is the named refusal when one goes missing — said in
# the PR that deletes it, not by a Monday audit finding less to do.
#
# THE HELD LIST DOES NOT GROW WITH THE GUARDS, and since #738 it
# cannot. Every canon-only audit leg guards on exactly one path — the
# tracked security/identity.toml, held here — and treats the data it
# reads (docs/, slsa/spec-source-matrix.txt, security/vex, the policy
# documents) as a REQUIREMENT that reds by name once that guard says
# this IS the canon. So no guard path can be unheld, and holding every
# input a leg reads would only restate the task bodies here: the drift
# shape #658 retired. The three entries below are each held for their
# own reason — identity.toml because it is the family's guard, and
# losing it would silently skip every leg at once (the #568 shape on
# the conformance root itself); the two policy documents because the
# release and verify workflows read them too, and a PR is a cheaper
# place to learn they are gone than a release.
#
# The test is TRACKEDNESS, and it is the same test the audit guards
# make — a hold that asks a different question than the guard it backs
# leaves the gap it was built to close: a file present but untracked
# would satisfy `-f` here while every leg skipped on it (#738).
# Deterministic, tracked files only.
run = '''
git ls-files --error-unmatch mise/config.toml > /dev/null 2>&1 || {
  echo "lint:canon-policy: no belt tracked in this tree, not the canon, skipped"
  exit 0
}
missing=""
for f in slsa/assert-policy.json slsa/verify-policy.json security/identity.toml; do
  git ls-files --error-unmatch "${f}" > /dev/null 2>&1 || missing="${missing} ${f}"
done
if [[ -n ${missing} ]]; then
  echo "lint:canon-policy: this tree carries the belt but does not track:${missing}" >&2
  echo "  security/identity.toml is what every canon-only audit guards on, so" >&2
  echo "  a canon without it skips the whole family silently — the #568 shape" >&2
  echo "  on the conformance root (#579, #738). The policy documents are read" >&2
  echo "  by those legs and by the release path, which red by name; this is" >&2
  echo "  the earlier refusal, not the only one." >&2
  echo "  Restore the documents; deleting one is a defect, never a skip." >&2
  exit 1
fi
echo "lint:canon-policy: belt in tree and every policy document tracked"
'''

[tasks."lint:policy-load"]
description = "Every committed policy document loads against the pinned engine (#617)"
dir = "{{cwd}}"
# The guard the epoch move needed and did not have (#617). A committed
# policy declares a `schema`; the pinned stele implements one epoch;
# nothing held the two together. They drifted on 2026-08-20 and only an
# armed auto-merge stood between the belt and nine call sites refusing
# at once — the release path, the source-attest identity path and the
# Monday audit together (#599, migrated atomically in #626). The pair
# can drift again at every future epoch move, and the only protection
# until now was the same-PR rule: a rule someone must remember.
#
# The guard IS the engine. `stele verify policy` runs the same loader
# every verb uses — version gate first, then strict decode (stele#107)
# — offline, and exits 0 only if the document loads. It moves that
# refusal from pin-bump time to commit time.
#
# Nothing here reads, compares or restates the epoch. A canon-side copy
# of that integer would be its third, and the number's whole design is
# that it has exactly one home (`jsonx.Epoch`). Grepping the documents
# for `"schema"` was rejected for the reason it would not have worked
# anyway: the live incident's `proofFloor` string-vs-object refusal is a
# shape change at the RIGHT integer, so the integer is not the change.
#
# The two exits are two different instructions, decided at stele#210:
# 1 is the document's verdict (bring it to the shape this pin
# implements), anything else is this task's own input (fix the path).
#
# Universal, not canon-only: any repo committing its own policy inherits
# the guard at its next pin bump, and a tree carrying none skips clean
# by name. Tracked documents only, deterministic and offline — so it
# belongs in the gate.
run = '''
pending=""
for pair in "slsa/assert-policy.json --assert-policy" "slsa/verify-policy.json --verify-policy"; do
  path="${pair% *}"
  if git ls-files --error-unmatch "${path}" > /dev/null 2>&1; then
    pending="${pending}${pair}
"
  fi
done

[[ -n ${pending} ]] || {
  echo "lint:policy-load: no committed policy documents, skipped"
  exit 0
}
command -v stele > /dev/null || {
  echo "lint:policy-load: stele missing from the belt" >&2
  exit 1
}

checked=0
bad=0
while IFS= read -r pair; do
  [[ -n ${pair} ]] || continue
  path="${pair% *}"
  flag="${pair#* }"
  code=0
  stele verify policy "${flag}" "${path}" || code=$?
  case "${code}" in
    0)
      checked=$((checked + 1))
      ;;
    1)
      bad=$((bad + 1))
      echo "lint:policy-load: ${path} does not load against the pinned stele." >&2
      echo "  The refusal above is the engine's own. Bring the document to the" >&2
      echo "  shape this pin implements; never restate its epoch here (#617)." >&2
      ;;
    *)
      bad=$((bad + 1))
      echo "lint:policy-load: the load-check could not read ${path} (exit ${code})." >&2
      echo "  That is this task's own input, not the document's verdict." >&2
      ;;
  esac
done << EOF
${pending}
EOF

[[ ${bad} -eq 0 ]] || exit 1
echo "lint:policy-load: ${checked} policy document(s) load against the pinned stele"
'''

[tasks."lint:plan-producers"]
description = "Every planned SBOM obligation has a build leg that produces it (#833)"
dir = "{{cwd}}"
# The join nothing made (#833). `slsa/assert-policy.json` declares, per
# evidence class, the inventory documents a release owes — `assetPrefixes`
# entries carrying `planned: true` — and the build legs are what produce
# them. Two committed files, and until this task nothing compared them.
#
# `rust-crate` declared `sbom-cargo-` from machinery 1.42.0 and no leg
# ever emitted a plan for it. Forty canon releases rode past the
# inconsistency; the first repository to declare the class in anger
# refused pre-publish in `stele assert plans` and burned edtf v1.3.1. The
# defect was visible in a set difference over two tracked files the whole
# time, which is the lesson: before calling a defect unforeseeable, ask
# what static check would have caught it. Declaration ↔ producer
# agreement is always lintable.
#
# Deterministic and offline — two sets of tracked files, no runner and no
# release — so it belongs in the gate rather than among the `audit:*`
# tasks. Guarded on the policy: a repository committing none skips clean
# by name. A repository that commits one and tracks no build workflow
# does NOT skip: every obligation it declares is then unproduced, which
# is the defect this task exists to name.
#
# The mechanism and the reason a marker declares the class rather than a
# derivation reading it out of each leg live in the helper's own header.
run = '''
policy=slsa/assert-policy.json
git ls-files --error-unmatch "${policy}" > /dev/null 2>&1 || {
  echo "lint:plan-producers: no committed assert policy, skipped"
  exit 0
}
listing=$(git ls-files '.github/workflows/build-*.yml' '.github/workflows/publish.yml')
flows=()
while IFS= read -r f; do
  if [[ -n ${f} ]]; then flows+=("${f}"); fi
done << EOF
${listing}
EOF
python3 "${ORG_BELT_DIR}/plan-producers.py" --policy "${policy}" ${flows[@]+"${flows[@]}"}
'''

[tasks."lint:caller-permissions"]
description = "Every caller of a workflow_call workflow grants its computed permissions requirement"
dir = "{{cwd}}"
# Seam 2 of #358: GitHub makes `permissions:` caller-owned, so a shared
# workflow that gains a capability is a breaking change to every caller
# — enforced at runtime as startup_failure with no jobs and no log, the
# worst available enforcement point (canon v1.23.1 added `id-token:
# write` to release.yml's tag job and release-lab's existing stub died
# exactly that way). The requirement is statically computable — the
# union of the callee's job-level grants — and this lint compares it
# against every in-repo caller and every workflow-templates/ stub at
# the PR that adds the capability, which is where #353 failed.
# lint:nested-permissions requires the grant to be WRITTEN; this
# requires it to be SUFFICIENT.
#
# ONE RESOLUTION, NO BRANCH. The requirement is computed from the
# canon tree the belt itself came from, which ORG_CANON_DIR names in
# both worlds: in the canon that is this tree, in a consumer the tree
# ci.yml resolved at the same SHA that fetched the shared workflow
# (#165). The task and the engine therefore arrive together and cannot
# skew. This used to probe `.` then `.org-canon` and skip clean when
# it found neither, so a consumer clone running the gate locally
# checked no grant at all and reported a pass (#568) — the degraded
# state is now unrepresentable rather than detected. Strictly earlier
# than audit:caller-permissions, which asks the same question weekly
# against canon HEAD — a forecast; this reddens the PR where the
# answer is actionable.
#
# Which workflows are callers and where the reusable tree sits are
# DECLARED (the policy's permissions section), never conventions in
# code — the engine reads them, so an adopter whose reusable workflows
# sit beside their callers declares no shared tree and gets the join
# over its own calls (stele#148). The guard is that this tree runs
# workflows at all: a workflow-free tree seals CANNOT_JUDGE rather
# than passing vacuously, so the task skips before invoking, the way
# audit:action-pins does.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml")
[[ -n ${files} ]] || {
  echo "lint:caller-permissions: no workflows, skipped"
  exit 0
}
command -v stele > /dev/null || {
  echo "lint:caller-permissions: stele missing from the belt" >&2
  exit 1
}
if ! stele assert permissions \
  --policy "${ORG_CANON_DIR}/slsa/assert-policy.json" \
  --tree "${ORG_CANON_DIR}" \
  --callers .; then
  echo "lint:caller-permissions: see above — grant what the pinned canon's" >&2
  echo "  callee jobs ask for, at the caller's uses: job (#358 seam 2)." >&2
  exit 1
fi
'''

[tasks."lint:template-pins"]
description = "Workflow templates pin one SHA that is an ancestor of HEAD; scorecard stays pinless"
dir = "{{cwd}}"
# Found by the #28 pre-close audit: all five templates sat a day behind
# canon, predating three shipped fixes, with nothing anywhere going red — a
# repo standing up from the templates would have inherited known bugs. The
# deterministic properties are: every pin is a full SHA that is an ancestor
# of HEAD (never unmerged or foreign history), all pinned templates agree
# on ONE SHA (stub pins move together), and scorecard.yml carries no org
# pin at all (it is self-contained by design — Scorecard's publish
# validation rejects reusables). Deliberately NOT required: pin == HEAD —
# that would couple every canon commit to a template touch. Staleness
# within merged history is the scheduled audit's judgement call, not the
# gate's.
run = '''
compgen -G "workflow-templates/*.y*ml" > /dev/null || {
  echo "lint:template-pins: no workflow-templates/, skipped"
  exit 0
}
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
canon_re="${canon//./\\.}"
bad=""
shas=""
count=0
for f in workflow-templates/*.y*ml; do
  lines=$(grep -E "uses:[[:space:]]*${canon_re}/" "${f}" || true)
  if [[ ${f##*/} == scorecard.* ]]; then
    [[ -z ${lines} ]] || bad="${bad} ${f}(must stay pinless: self-contained by design)"
    continue
  fi
  [[ -n ${lines} ]] || continue
  while IFS= read -r line; do
    sha=$(grep -oE "@[0-9a-f]{40}" <<< "${line}" | tr -d "@")
    if [[ -z ${sha} ]]; then
      bad="${bad} ${f}(pin is not a full 40-hex SHA)"
      continue
    fi
    count=$((count + 1))
    git merge-base --is-ancestor "${sha}" HEAD 2> /dev/null \
      || bad="${bad} ${f}(${sha:0:8} not an ancestor of HEAD)"
    case " ${shas} " in *" ${sha} "*) ;; *) shas="${shas} ${sha}" ;; esac
  done <<< "${lines}"
done
n=$(wc -w <<< "${shas}" | tr -d " ")
[[ ${n} -le 1 ]] || bad="${bad} (templates disagree, ${n} distinct SHAs:${shas})"
# Ancestor-of-HEAD is the weaker property (#233). What a copier depends
# on is that the pin names a RELEASED commit — tagged, published through
# the signer, evidence attached, immutable. An untagged mid-history
# commit satisfies "ancestor" and shouldn't: nothing was ever cut from
# it, so there is nothing to verify and nothing that survives a rebuild.
# The gate's checkout fetches tags for exactly this (ci.yml, fetch-tags).
released=""
anytag=$(git tag --list "v[0-9]*" | sed -n 1p)
if [[ -n ${anytag} ]]; then
  for sha in ${shas}; do
    tag=$(git tag --points-at "${sha}" --list "v[0-9]*" | sed -n 1p)
    if [[ -z ${tag} ]]; then
      bad="${bad} (${sha:0:8} names no released tag — pins must name a release, not any ancestor)"
    else
      released="${released} ${tag}"
    fi
  done
else
  # A repo before its first release has nothing to point at. Honest skip,
  # named — never a silent pass.
  released=" (no tags in this clone, released-tag check skipped)"
fi
if [[ -n ${bad} ]]; then
  echo "lint:template-pins: template pin violations:${bad}" >&2
  echo "  templates pin one merged, RELEASED canon SHA and move together" >&2
  echo "  (#111, #233); scorecard.yml never pins a reusable." >&2
  exit 1
fi
echo "lint:template-pins: ${count} pins at one ancestor SHA, scorecard pinless, released as${released}"
'''

[tasks."lint:runner-pin"]
description = "No floating runner labels: every runs-on is a named version pin or a matrix indirection whose values are"
dir = "{{cwd}}"
# Found by the #290 audit: the signer's own sign.yml ran ubuntu-latest —
# the workflow holding `id-token: write`, whose identity every provenance
# certificate bears — while four documents claimed the runner image was a
# named pin everywhere. A floating label migrates on GitHub's schedule
# with no diff, no PR and no Renovate roll, which is exactly what the
# named pin exists to prevent; Renovate's github-runners manager rolls a
# named pin as a visible diff. Neither actionlint nor zizmor (pedantic)
# flags this, so the belt does. Two checks, tracked files only:
# a runs-on value is either a pinned literal (name-version, optionally
# suffixed: ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel) or a
# `${{ matrix.* }}` indirection — and no non-comment line anywhere in a
# workflow carries a `*-latest` runner label, which is what closes the
# matrix laundering hole: a floating value reaching runs-on through a
# matrix include or a bash case arm is the same float with indirection.
run = '''
files=$(git ls-files ':!vendor/**' ".github/workflows/*.yml" ".github/workflows/*.yaml" \
  "workflow-templates/*.yml" "workflow-templates/*.yaml")
[[ -n ${files} ]] || {
  echo "lint:runner-pin: no workflows, skipped"
  exit 0
}
bad=""
while IFS= read -r f; do
  while IFS= read -r line; do
    [[ -n ${line} ]] || continue
    v=$(sed -E "s/^[[:space:]]*runs-on:[[:space:]]*//; s/[[:space:]]*#.*$//" <<< "${line}" | tr -d "\"'")
    case "${v}" in
      \$\{\{*matrix.*\}\}) ;; # indirection; the value check below covers it
      *) [[ ${v} =~ ^[a-z]+-[0-9][a-z0-9.-]*$ ]] \
        || bad="${bad} ${f}(runs-on: ${v})" ;;
    esac
  done <<< "$(grep -hE "^[[:space:]]*runs-on:" "${f}" || true)"
  float=$(grep -nE "(ubuntu|macos|windows)-latest" "${f}" | grep -vE "^[0-9]+:[[:space:]]*#" || true)
  [[ -z ${float} ]] || bad="${bad} ${f}(floating label: $(head -1 <<< "${float}"))"
done <<< "${files}"
if [[ -n ${bad} ]]; then
  echo "lint:runner-pin: floating or unpinned runner labels:${bad}" >&2
  echo "  pin every runs-on to a named image version (ubuntu-24.04, not" >&2
  echo "  ubuntu-latest) — Renovate rolls named pins as visible diffs;" >&2
  echo "  a floating label migrates with no diff at all (#290)." >&2
  exit 1
fi
echo "lint:runner-pin: every runs-on pinned or matrix-indirected, no floating labels"
'''

[tasks."lint:canon-pins"]
description = "Every canon reference is a version: workflow pins carry '# vX.Y.Z', lefthook/preset refs are tags, and no workflow checks the canon out — content comes via $/.github/actions/canon"
dir = "{{cwd}}"
# Renovate is the bump mechanism (#133); this lint makes the unbumpable
# state unrepresentable. Three surfaces consume the canon and each must
# carry a machine-readable version: a workflow pin's trailing '# vX.Y.Z'
# comment is what Renovate's github-actions manager reads and rewrites
# with the SHA; a lefthook branch ref or an untagged preset reference can
# be bumped by nothing, so it silently rots — the v0.16.1 failure class.
# Shape is the gate's business; freshness is audit:canon-pins (network).
# Comment lines are excluded: workflow headers quote the pin shape as
# documentation.
run = '''
. "${ORG_BELT_DIR}/identity.sh"
canon_owner=$(org_identity owner)
canon_repo=$(org_identity repo)
canon="${canon_owner}/${canon_repo}"
canon_re="${canon//./\\.}"
bad=""
found=0
files=$(git ls-files ':!vendor/**' "*.yml" "*.yaml")
if [[ -n ${files} ]]; then
  while IFS= read -r f; do
    while IFS= read -r line; do
      [[ -n ${line} ]] || continue
      found=$((found + 1))
      grep -qE "@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+" <<< "${line}" \
        || bad="${bad} ${f}(canon pin without '@<full-sha> # vX.Y.Z')"
    done < <(grep -hE "^[^#]*uses:[[:space:]]*${canon_re}/" "${f}" || true)
  done <<< "${files}"
fi
hook_files=$(git ls-files ':!vendor/**' "lefthook.yml" "*/lefthook.yml")
renovate_files=$(git ls-files ':!vendor/**' "renovate.json" "*/renovate.json" ".github/renovate.json")
workflow_files=$(git ls-files ':!vendor/**' ".github/workflows/*.yml" ".github/workflows/*.yaml")
while IFS= read -r f; do
  [[ -n ${f} ]] || continue
  grep -qF "github.com/${canon}" "${f}" || continue
  found=$((found + 1))
  grep -qE "^[[:space:]]*ref:[[:space:]]*v[0-9]" "${f}" \
    || bad="${bad} ${f}(lefthook canon remote must ref a v* tag, not a branch)"
done <<< "${hook_files}"
while IFS= read -r f; do
  [[ -n ${f} ]] || continue
  grep -qF "github>${canon}" "${f}" || continue
  found=$((found + 1))
  grep -qE "github>${canon_re}#v[0-9]" "${f}" \
    || bad="${bad} ${f}(preset reference must carry #vX.Y.Z)"
done <<< "${renovate_files}"
# The fourth surface is a prohibition: no workflow step may clone the
# canon with actions/checkout, at any ref. Canon content reaches a job
# only through `uses: $/.github/actions/canon` — GitHub's
# self-repository resolution, the same one that fetched the workflow
# file, so no second derivation exists to disagree with it (#165). Both
# prior carriers were such second derivations and both failed: the
# github.job_workflow_sha conditional evaluated empty and floated to
# main (#158); the release-time stamp needed workflow writes the
# tag-mint App must never hold (#164).
while IFS= read -r f; do
  [[ -n ${f} ]] || continue
  checkouts=$(grep -cE "^[^#]*repository:[[:space:]]*${canon_re}[[:space:]]*$" "${f}") || continue
  found=$((found + checkouts))
  [[ ${checkouts} -eq 0 ]] \
    || bad="${bad} ${f}(${checkouts} canon checkout(s) — use \$/.github/actions/canon)"
done <<< "${workflow_files}"
[[ ${found} -gt 0 ]] || {
  echo "lint:canon-pins: no canon references, skipped"
  exit 0
}
if [[ -n ${bad} ]]; then
  echo "lint:canon-pins: unversioned canon references:${bad}" >&2
  echo "  every canon reference pins a tag Renovate can bump (#133);" >&2
  echo "  workflow pins: '@<sha> # vX.Y.Z', lefthook: 'ref: vX.Y.Z'," >&2
  echo "  preset: 'github>${canon}#vX.Y.Z'; canon" >&2
  echo '  content in a job comes only via $/.github/actions/canon (#165).' >&2
  exit 1
fi
echo "lint:canon-pins: ${found} canon references, all versioned"
'''

[tasks."lint:bash-portability"]
description = "No bash 4+ syntax: it runs on the runner and not on a Mac"
dir = "{{cwd}}"
# GitHub runners ship bash 5; macOS ships bash 3.2.57 and always will,
# because bash 4 changed licence. The toolbelt sets
# `shell = "bash -euo pipefail -c"`, so every task and every release
# script is expected to run in both places.
#
# A bash-4-ism therefore passes CI and fails on the machine the code is
# written on — which is worse than failing everywhere, because it silently
# removes the ability to test a script before spending an irreversible
# release on it. Found exactly that way: `${name,,}` in the signer, green
# in CI, "bad substitution" locally.
#
# Comment lines are skipped so that documenting a forbidden form (as the
# signer now does) is not itself a violation.
run = '''
files=$(
  git ls-files ':!vendor/**' | xargs shfmt --find 2> /dev/null
  git ls-files ':!vendor/**' ".github/workflows/*.y*ml"
)
[[ -n ${files} ]] || {
  echo "lint:bash-portability: nothing to check, skipped"
  exit 0
}
# ${v,,} ${v^^} ${v,} ${v^} — case modification, bash 4.0
# declare -A / typeset -A — associative arrays, bash 4.0
# mapfile / readarray     — bash 4.0
# &>>                     — append-both redirection, bash 4.0
bad4='\$\{[A-Za-z_][A-Za-z0-9_]*(\[[^]]*\])?(,,|\^\^|,|\^)\}|(declare|typeset)[[:space:]]+-[A-Za-z]*A|(^|[^A-Za-z_])(mapfile|readarray)[[:space:]]|&>>'
found=""
while IFS= read -r f; do
  [[ -f ${f} ]] || continue
  hit=$(grep -vE "^[[:space:]]*#" "${f}" | grep -nE "${bad4}" || true)
  [[ -n ${hit} ]] && found="${found}\n  ${f}: ${hit}"
done <<< "${files}"
if [[ -n ${found} ]]; then
  echo "lint:bash-portability: bash 4+ syntax found (macOS ships 3.2):" >&2
  printf "%b\n" "${found}" >&2
  echo "  these pass in CI and fail locally, which is how a script reaches" >&2
  echo "  a release untested. Use tr, case, or an explicit loop instead." >&2
  exit 1
fi
count=$(wc -l <<< "${files}" | tr -d " ")
echo "lint:bash-portability: ${count} files clean"
'''
