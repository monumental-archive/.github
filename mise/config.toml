# The org toolbelt: universal tools every repo gets, locally and in CI.
#
# Local: symlink into the global fragment directory —
#   ln -s ~/Projects/org-github/mise/config.toml ~/.config/mise/conf.d/toolbelt.toml
# CI: the shared workflow checks out this repo (SHA-pinned) and sets
#   MISE_GLOBAL_CONFIG_FILE to this file, so the layering is identical to local.
#
# Every tool enters this file only after its own docs-first standup, pinned
# exact. mise.lock alongside carries checksums; CI runs MISE_LOCKED=1.
# Regenerate the lock with `mise lock` from this directory.
# The mise/config.toml name is deliberate: both mise and Renovate's mise
# manager recognise it natively — do not rename.
#
# Layering caveat: a repo's mise.toml can override a task or tool version from
# this file — that is mise working as designed. Enforcement lives in the shared
# workflow, not here.

[settings]
# mise.lock records resolved versions, per-platform URLs and checksums.
lockfile = true
# `locked` is set by the shared workflow as MISE_LOCKED=1, not here. In the
# config it also applies to local task runs, where mise re-resolves per task
# directory and cannot find this file's lock through the conf.d symlink —
# every task then warns that every tool "is not in the lockfile". The
# enforcement belongs where the lock is guaranteed reachable: CI.
# Re-verify each tool's provenance attestation on install, even when the
# lockfile already has an entry. A checksum proves the bytes did not change;
# this proves who produced them.
locked_verify_provenance = true
# `mise use` writes exact versions, never ranges.
pin = true
# Pinned tools go to the FRONT of PATH, so a system install can never shadow
# the pinned one — the failure where CI and a laptop run different binaries
# while both look correct.
activate_aggressive = true
# Never install a release younger than seven days: the same number as
# Renovate's minimumReleaseAge, so the two layers agree instead of one
# quietly undercutting the other.
minimum_release_age = "168h"
# asdf plugins are unsigned single-maintainer bash; ubi is deprecated
# upstream in favour of the github backend. Neither belongs under a
# checksum-and-attestation policy.
disable_backends = ["asdf", "ubi"]
# lockfile_platforms is deliberately NOT set. The lock currently covers
# seven platforms including linux-*-musl and macos-x64, and repos in this
# org build musl statics and Intel macOS binaries. Narrowing the list is a
# decision that needs evidence about what actually runs where, and getting
# it wrong drops a platform silently — the lock simply stops carrying it.

# Environment the belt exports to every mise-run process, including the
# subprocesses mise itself spawns to INSTALL tools — verified by setting an
# absurd cutoff here and watching the pipx install fail (#82).
[env]
# WHERE THE BELT IS, resolved once here so no task ever resolves it again.
#
# Every config that only a belt tool reads is delivered FROM the canon at
# run time rather than copied into each repo — so there is no second copy
# to drift, and nothing to write a drift check about. That was impossible
# until this line: mise has no template for a global config's own
# directory ({{config_root}} is the home directory for one), so tasks
# had begun carrying their own resolution blocks. Six of them, at the
# point this replaced them.
#
# Both carriers, one expression: CI sets MISE_GLOBAL_CONFIG_FILE to the
# canon tree that `$/.github/actions/canon` linked; locally the belt is a
# ~/.config/mise/conf.d symlink into a checkout. The symlink's NAME is not
# assumed — the belt is identified by a file only the belt has, so a
# machine that named it something else still works. Empty when the belt
# did not arrive, which `lint:belt-available` already fails on.
#
# "Empty" must mean exit 0 with no output, not exit 1: mise runs this under
# `sh -o errexit`, and a template that exits nonzero aborts EVERY mise
# invocation of this config — including Renovate's `mise lock`, which runs
# in a container with neither carrier present (#569, measured on #567). The
# not-found branches are therefore `if`-guarded, never bare AND-lists whose
# failure errexit promotes to a crash.
ORG_BELT_DIR = "{{ exec(command='d=\"${MISE_GLOBAL_CONFIG_FILE:-}\"; if [ -z \"$d\" ]; then for f in \"${XDG_CONFIG_HOME:-$HOME/.config}\"/mise/conf.d/*.toml; do t=$(readlink \"$f\" 2>/dev/null || echo \"$f\"); if [ -f \"$(dirname \"$t\")/clippy.toml\" ]; then d=\"$t\"; break; fi; done; fi; if [ -n \"$d\" ]; then cd \"$(dirname \"$d\")\" && pwd; fi') }}"
# WHERE THE CANON TREE IS, derived from the belt and never resolved a
# second time. The belt is one directory inside the canon; the tasks
# that need the canon proper need what sits BESIDE it — slsa/ policies,
# release/, security/. Both carriers put the belt inside a full canon
# tree by construction: CI's `$/.github/actions/canon` refuses any tree
# with no mise/config.toml before linking it, and locally the conf.d
# symlink points into a checkout. So this is a dirname, not a second
# search, and it cannot disagree with ORG_BELT_DIR about which tree is
# in play. Empty when the belt did not arrive, for the same #569 reason
# stated above — `dirname` of empty is empty, not an error.
ORG_CANON_DIR = "{{ env.ORG_BELT_DIR | dirname }}"
# The org's seven-day release-age floor, extended to Python.
#
# `minimum_release_age = "168h"` above governs how mise resolves a tool's
# own version. It does NOT reach inside a `pipx:` install: mise shells out
# to `uv tool install <pkg>==<ver>`, and uv then resolves the package's
# whole transitive closure with no floor at all. Standing up reuse pulled
# six further packages that way — license-expression, markupsafe,
# python-debian, python-magic, tomlkit, charset-normalizer — each of which
# could have been published minutes earlier. The org's stated supply-chain
# policy simply stopped at the language boundary.
#
# uv accepts a relative duration here, not only a fixed date, so this
# tracks with the clock and never needs bumping — the objection that
# killed the fixed-date form. Proven to bite: at "1825 days" resolution
# drops to a reuse old enough that its build fails, at "7 days" it
# resolves 6.2.0 unchanged.
UV_EXCLUDE_NEWER = "7 days"
# Already uv's default, pinned explicitly on the ruby.compile precedent: a
# default flip would land unattended through an automerged mise or uv
# bump, and this particular default is the one standing between a
# `pipx:` install and dependency confusion. "first-index" stops at the
# first index that has the name; the alternatives keep looking and can be
# convinced to prefer an attacker's copy from elsewhere.
UV_INDEX_STRATEGY = "first-index"
# uv may not choose or fetch an interpreter of its own. Without these it
# does exactly that, silently: a `pipx:` install on a machine whose system
# Python is too old makes uv download CPython into ~/.local/share/uv/python
# and build the tool venv there — pinned nowhere, absent from mise.lock,
# recorded in no verdict. The measured consequence was two different
# interpreters for one tool: this maintainer's Mac built reuse on uv's
# downloaded 3.12.13 (macOS ships 3.9.6, too old for it) while CI built the
# same reuse on whatever the runner happened to ship. That is precisely the
# "CI and a laptop run different binaries while both look correct" failure
# activate_aggressive exists to prevent, one layer further down. With these
# set, uv builds on the interpreter pinned below — verified by inspecting
# the tool venv's pyvenv.cfg before and after.
UV_NO_MANAGED_PYTHON = "1"
UV_PYTHON_DOWNLOADS = "never"

[task_config]
# Tasks are written in bash (guards use [[ ]] and <<<); the default task
# shell is sh, which is dash on Ubuntu runners and chokes on both.
#
# -euo pipefail, not a bare `bash -c` (#82 finding 2). Without it a task
# whose failure signal is a tool's exit status passes if anything follows
# it: `lint:python` shipped that way, running `ruff check` then
# `ruff format --check`, where a lint error was masked by the formatter
# passing. That class of defect is invisible — the check goes green
# having not checked.
#
# This is the DEFAULT, and the few commands that are genuinely allowed to
# fail say so at the site with `|| true` and a reason. That direction
# matters: the alternative considered was leaving the shell permissive
# and adding `set -euo pipefail` to each of the 78 bodies by hand, which
# is the same reading with a worse result — an unsafe default, opt-in,
# and no way to prove every body was covered. A rule you have to remember
# to apply is not a rule.
shell = "bash -euo pipefail -c"

[tools]
actionlint = "1.7.12"
# actionlint shells out to shellcheck for `run:` script analysis; without it
# that entire check class silently vanishes.
shellcheck = "0.11.0"
typos = "1.49.0"
lefthook = "2.1.10"
trivy = "0.73.0"
zizmor = "1.29.0"
committed = "1.1.11"
taplo = "0.10.0"
shfmt = "3.13.1"
# rumdl over markdownlint-cli2: same rule family, aqua-backed instead of
# npm-backed — keeps Node out of the belt. Revisit if a JS suite lands.
rumdl = "0.2.55"
lychee = "0.24.2"
# JSON on the command line, used by eleven belt tasks — nine audit tasks
# parsing GitHub API responses, fix:tracks, and lint:bestpractices in the
# gate. It was a hard dependency of the gate and was never pinned, which
# is not bad luck: nothing checks. See docs/tooling-verdicts.md for the
# check that was attempted for that class and why it was abandoned (#82).
jq = "1.8.2"
# The other half of the pinning convention (#82). CLAUDE.md requires every
# `uses:` to carry a full SHA AND a trailing version comment; zizmor's
# unpinned-uses proves the SHA and cannot see the comment, and
# lint:canon-pins reads canon references only. pinact closes that, brings
# the seven-day floor to the one layer without it, and supplies the fixer
# nine other fix:* tasks had and action pins did not.
"aqua:suzuki-shunsuke/pinact" = "4.1.1"
# Python lint + format in one binary (#82), at `select = ["ALL"]`. Ruff
# is a standalone Rust binary: it needs no Python interpreter to run, so
# it lints Python whether or not one is pinned. (One now is, but for uv's
# sake, not ruff's.) Adopted for
# security/workflow-permissions.py, which computed the caller/callee
# permissions join until stele#148 replaced it; that file is gone and
# the reason with it. Re-adjudicated 2026-08-20 and KEPT: the belt's
# own helpers are Python (mise/deny-skips.py, mise/embedded-shell.py),
# so the language a belt tool must cover is still in the tree, and a
# universal layer that dropped Python the moment the canon's own count
# fell to two would have to re-adopt it for the first adopter who
# writes one.
ruff = "0.16.2"
# The org's JS/TS/JSON layer (#82), at every rule biome has: `preset:
# "all"` for the eight stable groups plus each nursery rule NAMED in
# mise/biome-org.json. 514 rules at 2.5.7, not the 525 this comment
# claimed until #445 measured them. `preset: "all"` does NOT include
# nursery and no bulk switch does — naming them is the only mechanism
# biome offers, so the list is an enable-list and fail-open in exactly
# one direction (a rule ADDED by a version bump is silently absent).
# Removals and renames are fail-closed: biome hard-errors on an unknown
# key. `audit:biome-rules` covers the open direction weekly, off the
# gate, because the check is a network fetch of the pinned schema.
# Written as the explicit aqua backend, never the
# `biome` short name: that name resolves to aqua AND npm, and an npm
# resolution records version only in the lock — no checksum, no
# attestation. Biome rules org-wide where it and eslint overlap; eslint
# and its plugin graph stay repo-side because a flat config imports its
# plugins from the repo's own node_modules, which no central pin can
# supply. Unlike every other belt tool this one cannot be proven here:
# the canon has 22 JSON files and no JavaScript, so its linter is
# exercised first in a consumer, not in this gate (docs/tooling-verdicts.md)
# — which is precisely how three defects rode along in it for three days.
"aqua:biomejs/biome" = "2.5.7"
# TypeScript type checking (#445), the one thing on the belt that reasons
# about what a value IS rather than how it is written — biome lints the
# same files and never resolves a type.
#
# TypeScript 7 is the Go port, and that is what makes this pinnable at
# all: `tsc` is now a native executable (`package/lib/tsc` in the
# platform tarball), so the type checker enters the belt WITHOUT
# bringing Node with it — the "keeps Node out of the belt" line on rumdl
# still holds. No aqua package exists, so this is the third `github:`
# backend after cargo-machete and cargo-semver-checks, and the weakest
# of the three on provenance: the release carries no attestation at all
# (`gh attestation verify` 404s on the asset) while mise still prints
# "verify SLSA provenance" and passes, so the lock's per-platform
# checksums are the only integrity control. Recorded in
# docs/tooling-verdicts.md rather than glossed.
#
# `version_prefix` because upstream tags releases `typescript/v7.0.2`,
# and `bin_path` because the executable sits inside the npm package
# layout the tarball preserves.
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }
# Coverage ratchet (docs/runbook.md): repos commit a floor in
# .coverage-floor and the canonical coverage:check enforces it in the
# gate — deterministic (local run against a committed number), Rust-only
# by guard, skip-clean everywhere else. Best Practices Silver requires
# >=80% statement coverage; the floor only ratchets up.
"aqua:taiki-e/cargo-llvm-cov" = "0.8.7"
# The dependency track (docs/dependency-track.md). cargo-deny is the gate
# half (bans+licenses+sources, deterministic over the lock) and the
# advisories half (audit:deny, network). cargo-audit is skipped-subsumed:
# same RustSec DB, strictly a subset.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# Blast-radius scanning over published SBOMs (audit:blast-radius). The
# aqua registry lags upstream by one release at standup (2.5.0 exists);
# the pin advances via Renovate like everything else.
"aqua:google/osv-scanner" = "2.5.0"
# OpenVEX assembly (vex:new). The statement is the triage record; the
# signer signs it, blast-radius filters on it.
"aqua:openvex/vexctl" = "0.4.4"
# Keyless x509 tag signing at the mint (#349 S4): the release tag object
# was the one pointer in the release chain resting on a platform control
# instead of a signature, and a hand-minted break-glass tag left no
# cryptographic trace at all. Same Sigstore root of trust as cosign —
# one identity model, no standing key. aqua-backed: checksums, no
# install script (docs/tooling-verdicts.md).
"aqua:sigstore/gitsign" = "0.17.1"
# REUSE compliance (#316): the tool the api.reuse.software badge runs,
# executed in the gate over tracked files so compliance is machine-checked
# BEFORE registration — "compliant at registration" was an unenforced
# adjective until three defects shipped past it (an MIT header in a 0BSD
# tree, a CC0 header with no licence text, and the scaffold stub parsing
# as a real nested REUSE.toml). PyPI-only, no aqua package: the pipx
# backend rides aqua-backed uv (checksummed) — a documented exception in
# the cargo: class (tooling-verdicts.md).
"aqua:astral-sh/uv" = "0.12.3"
# The interpreter every `pipx:` tool venv is built on, pinned here so mise
# locks it and Renovate bumps it like any other tool rather than uv
# choosing one per machine (#82). This is not a new cost: a Python was
# already being fetched, just invisibly and unpinned — the earlier "a whole
# runtime for one script" objection rested on the belief that the belt
# had no interpreter, which was false. Precompiled, so it installs in
# about four seconds rather than the minutes a source build would take.
# 3.14.6 rather than 3.14.7: the standalone release carrying .7 is six days
# old and the seven-day floor refuses it.
python = "3.14.7"
"pipx:reuse" = { version = "6.2.0", uvx_args = "--with charset-normalizer", pipx_args = "--preinstall charset-normalizer" }
# The chain-link emitter's signing half: `stele emit chain` execs
# cosign sign-blob under the workflow's ambient identity — the binary
# deliberately has none of its own, and the signing tool still arrives
# through the belt like every other tool.
"aqua:sigstore/cosign" = "3.1.3"
# The org's own verifier, pinned and locked like every other tool. It
# replaces the `go run <module>@<commit>` bootstrap the source and
# verdict paths carried while stele had no release class (stele#7):
# same delivery as cosign or trivy — exact version, per-platform
# checksums in mise.lock, Renovate bumps it. Every call site now runs
# `stele` and no call site needs a Go toolchain.
"github:monumental-archive/stele" = "v0.16.0"
# NO go toolchain here, deliberately — the rust precedent (#403). The
# belt carried one for exactly one reason: audit:source-vsa compiled
# stele. Nothing in the belt compiles Go now, and a toolchain in the
# universal layer would be a build input every repo pays for and one
# repo uses.
#
# Go tooling stays: golangci-lint and the Go belt tasks below are
# universal-by-guard like the Rust ones — they skip clean without a
# tracked go.mod, and a repo that tracks one pins its own `go` (stele
# pins 1.26.6). Each task asserts the toolchain with the remedy rather
# than installing it, because a toolchain a repo did not choose is a
# build input it cannot reproduce.
# The Go layer (#392): one aqua-backed binary — checksums and GitHub
# artifact attestations verified at install — carrying ~105 lint
# analyzers plus the formatters (gofumpt with extra rules, gci). Like
# biome, this tool cannot be proven in this repository: the canon
# tracks no Go, so its rule set is exercised first in a consumer
# (stele) — recorded in docs/tooling-verdicts.md. The org's enable
# policy is `default: all` with per-rule written disables, carried in
# scaffold/.golangci.yml; lint:go refuses a Go repo that lacks the
# config, because golangci-lint's DEFAULT selection is five linters of
# ~105 — the ruff-defaults trap in a new costume. govulncheck is
# deliberately NOT here: it needs a go toolchain to build (no upstream
# binary releases, no aqua package), so it is a repo-side build input
# via the go: backend, the cargo-fuzz pattern — audit:go-vulns asserts
# it with the remedy.
"aqua:golangci/golangci-lint" = "2.12.2"
# SQL lint + format check (#403): the THIRD pipx: exception after reuse
# and yamllint — PyPI-only, no aqua package, riding checksummed uv
# under the same UV_* floor env. All core rules on (sqlfluff's default
# IS its maximum rule set); the config a repo must track exists to
# declare the DIALECT, which sqlfluff refuses to guess — postgres
# org-wide, the only SQL the org ships (pgrx extensions,
# monumental-archive-db). Zero SQL in the canon: like biome, golangci
# and the Rust pair, exercised first in a consumer.
"pipx:sqlfluff" = "4.3.0"
# Semver honesty for published crates (#403): the public API is checked
# against the latest release on crates.io. audit:*, NEVER lint:* — the
# baseline is fetched from the registry at run time, and the gate is
# deterministic by rule; #403's close-condition wording said lint:<tool>,
# and this is the recorded deviation, forced by the older rule. No aqua
# package and no upstream checksum assets, so the github: backend locks
# a trust-on-first-use checksum — weaker than aqua's published sums,
# recorded as such in docs/tooling-verdicts.md. Needs cargo+rustdoc at
# run time (repo-side toolchain, the lint:deny shape). Like the other
# Rust tools, unprovable in the canon — no Rust tracked.
"github:obi1kenobi/cargo-semver-checks" = "v0.50.0"
# Unused Rust dependencies (#403): every dependency in Cargo.toml must
# be imported somewhere, or carry a written ignored entry under
# [package.metadata.cargo-machete] with a reason. Static analysis, no
# cargo/rustc needed, so the gate run is deterministic and touches
# nothing. --with-metadata is deliberately NOT used in the gate: it
# shells out to cargo metadata --all-features and can rewrite
# Cargo.lock — a gate must not mutate the tree it is judging. Not in
# the aqua registry (404 at standup); the github: backend delivers the
# upstream binary with its published sha256 into the lock — the
# closest-to-policy path without aqua. Like biome and golangci-lint,
# unprovable here: the canon tracks no Rust, so it is exercised first
# in a consumer (docs/tooling-verdicts.md).
"github:bnjbvr/cargo-machete" = "v0.9.2"
# Dockerfile lint (#403): every hadolint rule at maximum reach —
# --failure-threshold style fails on ALL severities including style,
# and RUN lines get shellcheck via hadolint itself. Overlap with trivy
# stated in docs/tooling-verdicts.md: trivy runs policy checks
# (misconfig), hadolint runs best-practice + shell analysis — the DL
# and AVD rule families barely intersect. aqua-backed.
"aqua:hadolint/hadolint" = "2.15.1"
# Secret scanning at commit depth (#403): `gitleaks git` reads history
# via git log -p, so it is tracked-only by construction and reaches
# every commit, not just the tip. The overlap with trivy is a split,
# not a duplicate: trivy's secret scanner guards ARTIFACTS (Dockerfile
# context and published image layers, docs/dependency-track.md);
# gitleaks guards SOURCE at commit depth — a secret committed and then
# deleted is invisible to every tip scanner and still live to anyone
# who clones. No config file: gitleaks' default ruleset IS its maximum
# (the opposite of the ruff/biome default trap), so a config exists
# only once a real finding demands a written allowlist.
"aqua:gitleaks/gitleaks" = "8.30.1"
# Whole-file hygiene against .editorconfig (#403): the org's ONE written
# indentation rule lives in .editorconfig and this enforces it — six
# properties (charset, end_of_line, insert_final_newline, indent_style,
# indent_size, trim_trailing_whitespace) plus per-type max_line_length.
# aqua-backed: checksums, binary releases, no install script.
"aqua:editorconfig-checker/editorconfig-checker" = "3.11.1"
# YAML lint (#403): full rule inventory at error, policy in .yamllint.yaml.
# PyPI-only — no aqua package (404 in the registry; pure Python, no binary
# releases) — so the SECOND pipx: exception after reuse, riding
# checksummed uv under the same UV_* floor env above. Pinned here BEFORE
# the first install: a one-off `mise install` writes a bare lock entry
# with zero platforms, which works locally and fails CI with "No lockfile
# URL found".
"pipx:yamllint" = "1.38.0"

# Canonical tasks: available in every repo via the global layer. Repos may
# override a name; the shared workflow is the enforcement backstop.
#
# The task contract, in full:
#   - `mise run ci` must pass in every repo. Repos do NOT define `ci`; the
#     global task below assembles it.
#   - `lint:*` is claimed by the belt and wildcard-collected into `ci`, so a
#     linter added here is enforced in every repo with no repo change. Repos
#     may add their own `lint:<thing>` tasks; same collection applies.
#   - `test` and `build` are reserved names: define them and `ci` runs them,
#     omit them and `ci` skips them (optional depends).
#   - Belt linters guard for applicability and exit 0 when a repo has
#     nothing for them to check. A linter that can't skip can't be universal.
#   - Every enumerating `git ls-files` walk excludes ':!vendor/**':
#     vendored dependency trees are upstream's code, linted by their
#     upstreams — the belt checks the repo's OWN code. Measured on
#     stele, the org's first repo with a committed vendor/ (the go mod
#     vendor law): bash-portability red on x/sys's codegen scripts,
#     exec-bits on eight upstream .sh modes, shell on shfmt-formatting
#     upstream trees — none of them the repo's defects. Existence
#     probes (--error-unmatch, the licence emptiness check) and the
#     repro full-tree copies deliberately keep the whole tree.
#   - Write-mode siblings live under `fix:*`, never run by `ci`.
[tasks.ci]
description = "The gate: everything the org enforces, plus this repo's tasks"
dir = "{{cwd}}"
depends = [
  "lint:*",
  { task = "test", optional = true },
  { task = "build", optional = true },
  # The coverage ratchet joins the gate the moment a repo commits a
  # floor; without one it skips clean like every guarded belt task.
  "coverage:check",
]
run = "echo 'ci: all gates green'"

[tasks.fix]
description = "Run every write-mode fixer (the fix:* siblings ci deliberately excludes)"
dir = "{{cwd}}"
# The counterpart to `ci`, and deliberately not reachable from it: `ci`
# proves the tree is already right, this makes it right. Without an
# aggregate the fixers were N separate commands to remember, so the ones
# nobody remembered never ran. Same collection semantics as `lint:*`, and
# the same caveat: mise's `*` matches within ONE colon group, so a repo's
# `fix:web:types` would be silently uncollected — name fixers with a
# single colon.
depends = ["fix:*"]
run = "echo 'fix: all fixers applied'"

[tasks."hooks:install"]
description = "Wire this clone's git hooks to lefthook (run once per clone)"
dir = "{{cwd}}"
run = "lefthook install"

[tasks."lint:typos"]
description = "Spell-check contents and filenames (typos)"
dir = "{{cwd}}"
# Locale stays `en` (accepts en-US and en-GB): the org register convention
# is en-US in code and en-GB in prose, which no per-file locale can split.
# Repo-specific jargon goes in that repo's own _typos.toml (extend-words).
run = 'typos -c "${ORG_BELT_DIR}/typos.toml"'

[tasks."lint:toml"]
description = "TOML format check + lint (taplo)"
dir = "{{cwd}}"
# No schema catalogs in the gate: catalog resolution is a network fetch.
# Tracked files only: taplo's own walker wanders into .git (lefthook's
# remote cache lives there) and has no exclude flag.
run = 'files=$(git ls-files ":!vendor/**" "*.toml"); if [[ -n "${files}" ]]; then xargs taplo fmt --check --diff <<<"${files}" && xargs taplo lint <<<"${files}"; else echo "lint:toml: no TOML tracked, skipped"; fi'

[tasks."fix:toml"]
description = "Rewrite TOML to canonical format (taplo)"
dir = "{{cwd}}"
run = 'git ls-files ":!vendor/**" "*.toml" | xargs taplo fmt'

[tasks."lint:markdown"]
description = "Markdown lint (rumdl, full rule set)"
dir = "{{cwd}}"
run = 'files=$(git ls-files ":!vendor/**" "*.md" "*.markdown"); if [[ -n "${files}" ]]; then xargs rumdl check --config "${ORG_BELT_DIR}/rumdl.toml" <<<"${files}"; else echo "lint:markdown: no markdown tracked, skipped"; fi'

[tasks."lint:sql"]
description = "SQL lint + format check (sqlfluff, all core rules)"
dir = "{{cwd}}"
# Subject-named like lint:python — sqlfluff covers one language. A
# tracked .sqlfluff is REQUIRED once SQL is tracked, but for the
# opposite reason to ruff/biome: sqlfluff's default rule set is its
# maximum, and the config exists because the tool refuses to guess a
# DIALECT — a repo without one gets a loud error, never a weak green.
# The belt asserts it anyway so the remedy is named. Copy
# scaffold/.sqlfluff. Tracked files only, on the standing rule.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.sql")
[[ -n "${files}" ]] || { echo "lint:sql: no SQL tracked, skipped"; exit 0; }
xargs sqlfluff lint --config "${ORG_BELT_DIR}/sqlfluff.cfg" <<<"${files}"
echo "lint:sql: $(wc -l <<<"${files}" | tr -d " ") file(s) linted"
'''

[tasks."fix:sql"]
description = "Apply sqlfluff's fixes and rewrite SQL to canonical form"
dir = "{{cwd}}"
# The write-mode sibling, never in the gate. --force is the
# non-interactive mode, not an unsafe-fix flag: sqlfluff fix applies
# only its own rule fixes, the same class as fix:python's safe fixes.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.sql")
[[ -n "${files}" ]] || { echo "fix:sql: no SQL tracked, skipped"; exit 0; }
xargs sqlfluff fix --config "${ORG_BELT_DIR}/sqlfluff.cfg" --force <<<"${files}"
'''

[tasks."audit:semver"]
description = "Public API vs the latest published release (cargo-semver-checks — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: the baseline is whatever crates.io currently
# publishes, which is remote state — a red can arrive with no local
# change, a property of the registry, not the diff. The release path is
# where this bites hardest (a major-worthy API break shipping as a
# minor), so a red here means: fix the API or bump the major in the
# next release — never both silently. Guarded on a publishable crate:
# publish = false workspaces have no registry baseline to diverge from.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n "${manifests}" ]] || { echo "audit:semver: no Cargo.toml tracked, skipped"; exit 0; }
command -v cargo > /dev/null || {
  echo "audit:semver: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
publishable=0
while IFS= read -r m; do
  [[ -n "${m}" ]] || continue
  grep -q '^\[package\]' "${m}" || continue
  grep -q '^publish[[:space:]]*=[[:space:]]*false' "${m}" && continue
  publishable=1
done <<< "${manifests}"
[[ ${publishable} -eq 1 ]] || { echo "audit:semver: no publishable crate, skipped"; exit 0; }
cargo-semver-checks check-release
'''

[tasks."lint:machete"]
description = "No unused Rust dependencies (cargo-machete, static)"
dir = "{{cwd}}"
# Static: parses Cargo.toml and greps source, needs no toolchain, so
# unlike lint:deny there is no cargo-missing failure mode — the binary
# is the belt's. A false positive (renamed crate, macro-only use) gets
# a written [package.metadata.cargo-machete] ignored entry beside the
# dependency it excuses, never a task-level skip. Exit 2 is a
# processing error and fails like everything else.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n "${manifests}" ]] || { echo "lint:machete: no Cargo.toml tracked, skipped"; exit 0; }
cargo-machete
echo "lint:machete: no unused dependencies"
'''

[tasks."lint:hadolint"]
description = "Dockerfile lint, every severity fails (hadolint --failure-threshold style)"
dir = "{{cwd}}"
# --failure-threshold style: the default (info) lets style findings sit
# in the tree unnoticed, which is what preset-max belts exist to
# prevent — the same reasoning as biome's --error-on-warnings. RUN
# lines get shellcheck through hadolint itself, mirroring the tool that
# already solved embedded-shell extraction rather than reinventing it.
# No .hadolint.yaml: like gitleaks, hadolint's default rule set is its
# maximum, so a config exists only to weaken (ignores) or to add label
# schema — neither is wanted, and an unexplained config is a review
# finding. Tracked files only; same glob family as lint:from-digests.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "Dockerfile" "*/Dockerfile" "*.Dockerfile" "Dockerfile.*" "*/Dockerfile.*")
[[ -n "${files}" ]] || { echo "lint:hadolint: no Dockerfile tracked, skipped"; exit 0; }
xargs hadolint --failure-threshold style --no-color <<<"${files}"
echo "lint:hadolint: $(wc -l <<<"${files}" | tr -d " ") Dockerfile(s) clean at style threshold"
'''

[tasks."lint:gitleaks"]
description = "Secret scan at commit depth, full history (gitleaks git)"
dir = "{{cwd}}"
# `git` mode, never `dir`: history scanning is tracked-only by
# construction (no walker to wander into .git/lefthook caches), reaches
# secrets that were committed and deleted — invisible to every
# tip-of-tree scanner, still live to anyone who clones — and is
# deterministic over the commit set. --redact because a CI log line
# printing the matched secret would itself be a disclosure in a public
# repo. No config file by design: gitleaks' DEFAULT ruleset is its
# maximum, so requiring a config would invert the ruff/biome trap — a
# .gitleaks.toml appears only when a real finding demands a written
# allowlist, and an unexplained one is a finding in review.
# A red here is a rotation, then an ignore: the secret is in history,
# so removing it from the tip fixes nothing — rotate the credential,
# record the dead finding's fingerprint in .gitleaksignore with a
# comment naming the rotation.
run = '''
set -euo pipefail
git rev-parse --git-dir > /dev/null 2>&1 || {
  echo "lint:gitleaks: not a git repository, skipped"; exit 0
}
gitleaks git --redact --no-banner .
'''

[tasks."lint:editorconfig"]
description = "Whole-file hygiene against .editorconfig (editorconfig-checker)"
dir = "{{cwd}}"
# The enforcement half of the org's one written indentation rule. A
# tracked .editorconfig is REQUIRED (the config-required trap, fifth
# costume: without the file every check silently vacuously passes).
# Tracked files only, passed as arguments — ec's own git-aware walker is
# not used, on the standing lefthook-cache rule.
#
# -disable-indent-size, with the reason about the CHECK: ec's indent
# test is "leading spaces are a multiple of N" and cannot know
# continuation alignment, so it fights every formatter that owns a
# language's layout — measured at standup: 73 of 76 findings were ec
# disagreeing with ruff-formatted Python, shfmt-formatted shell,
# rumdl-clean markdown list continuations, and yamllint-clean YAML.
# Indent SIZE is enforced per language by its owner (ruff, shfmt, taplo,
# biome, yamllint, rumdl); ec still enforces indent_style (a tab in a
# space file), charset, end_of_line, insert_final_newline,
# trim_trailing_whitespace and per-type max_line_length — the checks no
# other belt tool covers. The binary is named `ec` by aqua.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**')
[[ -n "${files}" ]] || { echo "lint:editorconfig: empty tree, skipped"; exit 0; }
if ! git ls-files --error-unmatch ".editorconfig" > /dev/null 2>&1; then
  echo "lint:editorconfig: no .editorconfig tracked — copy scaffold/.editorconfig (#403)" >&2
  echo "  without it every editorconfig-checker check vacuously passes" >&2
  exit 1
fi
xargs ec -disable-indent-size <<<"${files}"
echo "lint:editorconfig: $(wc -l <<<"${files}" | tr -d " ") file(s) checked"
'''

[tasks."lint:yaml"]
description = "YAML lint (yamllint, full rule inventory at error + --strict)"
dir = "{{cwd}}"
# A tracked yamllint config is REQUIRED once YAML is tracked — the
# ruff/biome/golangci trap in a fourth costume: without one yamllint
# falls back to its own `default` preset, a fraction of the org policy,
# and the gate goes green having enforced something weaker. The belt
# cannot supply the file centrally (yamllint discovers upward from the
# file, not through mise's conf.d layer), so the belt asserts it. Copy
# scaffold/.yamllint.yaml. No fix:* sibling exists to wire: yamllint
# ships no writer, so findings are hand edits by design.
# Tracked files only — yamllint's own discovery is never used, on the
# standing lefthook-cache rule.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.yml" "*.yaml")
[[ -n "${files}" ]] || { echo "lint:yaml: no YAML tracked, skipped"; exit 0; }
xargs yamllint -c "${ORG_BELT_DIR}/yamllint.yaml" --strict <<<"${files}"
echo "lint:yaml: $(wc -l <<<"${files}" | tr -d " ") file(s) linted"
'''

[tasks."fix:markdown"]
description = "Auto-fix markdown (rumdl)"
dir = "{{cwd}}"
run = 'git ls-files ":!vendor/**" "*.md" "*.markdown" | xargs rumdl check --config "${ORG_BELT_DIR}/rumdl.toml" --fix'

# The JS/TS/JSON layer (#82). Extension list is the set biome parses
# WITHOUT an experimental flag: html/vue/svelte/astro need
# `html.experimentalFullSupportEnabled` and are deliberately out until a
# repo has them — with `files.ignoreUnknown` left at its false default, an
# unexpected format is a loud diagnostic rather than a silent pass.
# `biome ci` is the no-write CI command; --error-on-warnings means an
# info/warn rule cannot sit in the tree unnoticed, which is what
# `preset: "all"` is for.
[tasks."lint:biome"]
description = "JS/TS/JSON lint + format check + assist (biome, every rule, every severity)"
dir = "{{cwd}}"
# The config is MATERIALISED at the repo root and never handed over with
# --config-path from the belt directory, and that is mechanism, not
# taste: biome computes the project root from the directory its config
# FILE SITS IN. Given the belt's copy, its scanner looks for the project
# beside that copy, finds none, and every rule needing project or type
# information stops working — silently, while the syntactic ones carry
# on. Measured on monumental-archive at #445, one byte-identical config
# in two locations: 69 findings never reported (noUnnecessaryConditions
# 65, noUnresolvedImports 2, useImportExtensions 1, useArraySortCompare
# 1) and 73 FALSE ones invented — noUndeclaredDependencies read 93 where
# the truth is 20, because it was looking for package.json in the canon.
# 17 of biome's rules are type-aware and every one of them was dead.
#
# So the file is GENERATED for the length of one run and removed by a
# trap, leaving the tree exactly as found — no residue, and nothing for
# ten repos to remember to .gitignore. That is also the whole of the
# enforcement, and the reason this is not the #455 pattern with an extra
# step: a repo-root `biome.json` that `extends` the belt's copy anchors
# correctly too, but a repo's own config is merged ON TOP and a repo can
# switch an org rule off in it (proven). A config that exists only during
# the run has no repo-side surface to lower. A tracked biome.json is
# refused outright, never overwritten.
#
# The severity floor is belt-side because --error-on-warnings is NOT one:
# 123 of the 514 rules default to `info`, and an info diagnostic prints
# and exits 0. Proven with the org's own config — a magic number reports
# noMagicNumbers and the gate goes green. The JSON reporter's summary is
# the honest gate: any diagnostic, any severity, fails. On failure the
# run repeats under the human reporter, because JSON has no code frames
# and the second run only ever happens on the red path.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.js" "*.jsx" "*.mjs" "*.cjs" "*.ts" "*.tsx" "*.mts" "*.cts" \
  "*.json" "*.jsonc" "*.css" "*.graphql" "*.gql")
[[ -n "${files}" ]] || { echo "lint:biome: nothing biome parses is tracked, skipped"; exit 0; }
tracked=$(git ls-files "biome.json" "biome.jsonc" "*/biome.json" "*/biome.jsonc")
if [[ -n "${tracked}" ]]; then
  echo "lint:biome: the belt generates biome.json; a repo must not track one" >&2
  sed 's/^/  tracked: /' <<<"${tracked}" >&2
  echo "  git rm --cached it: the belt writes this file for the length of one run" >&2
  exit 1
fi
trap 'rm -f biome.json' EXIT
cp "${ORG_BELT_DIR}/biome-org.json" biome.json
report=$(mktemp)
xargs biome ci --config-path biome.json --reporter=json --reporter-file="${report}" <<<"${files}" \
  > /dev/null || true
counts=$(jq -r '[.summary.errors, .summary.warnings, .summary.infos] | @tsv' "${report}")
read -r errors warnings infos <<<"${counts}"
for n in "${errors}" "${warnings}" "${infos}"; do
  [[ "${n}" =~ ^[0-9]+$ ]] && continue
  echo "lint:biome: biome's JSON summary is not the shape this task reads — the reporter is" >&2
  echo "  experimental and may move in a PATCH release, so a shape change fails rather than" >&2
  echo "  silently counting zero. Re-read the reporter output and update the task." >&2
  exit 1
done
if [[ $((errors + warnings + infos)) -ne 0 ]]; then
  xargs biome ci --config-path biome.json <<<"${files}" || true
  echo "lint:biome: ${errors} error(s), ${warnings} warning(s), ${infos} info(s) — every severity fails" >&2
  exit 1
fi
echo "lint:biome: clean across $(wc -l <<<"${files}" | tr -d ' ') files"
'''

[tasks."fix:biome"]
description = "Rewrite JS/TS/JSON to canonical format and apply safe fixes (biome)"
dir = "{{cwd}}"
# Safe fixes only: --unsafe is never wired into a belt task, because an
# unsafe fix may change behaviour and a fixer must be runnable without
# reading its diff first.
#
# Materialises the same generated config as lint:biome and for the same
# reason: a fixer reading a differently-anchored config would produce
# different edits from the check that judges them — the two halves have
# to see one project.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.js" "*.jsx" "*.mjs" "*.cjs" "*.ts" "*.tsx" "*.mts" "*.cts" \
  "*.json" "*.jsonc" "*.css" "*.graphql" "*.gql")
[[ -n "${files}" ]] || { echo "fix:biome: nothing biome parses is tracked, skipped"; exit 0; }
tracked=$(git ls-files "biome.json" "biome.jsonc" "*/biome.json" "*/biome.jsonc")
if [[ -n "${tracked}" ]]; then
  echo "fix:biome: the belt generates biome.json; a repo must not track one" >&2
  sed 's/^/  tracked: /' <<<"${tracked}" >&2
  exit 1
fi
trap 'rm -f biome.json' EXIT
cp "${ORG_BELT_DIR}/biome-org.json" biome.json
xargs biome check --config-path biome.json --write <<<"${files}"
'''

# Named for the subject, not the tool, matching lint:shell / lint:toml /
# lint:markdown — ruff covers exactly one language. (lint:biome is
# tool-named because biome covers five.)
[tasks."lint:python"]
description = "Python lint + format check (ruff, select ALL + preview)"
dir = "{{cwd}}"
# A tracked ruff config is REQUIRED once Python is tracked, for the same
# reason lint:biome demands biome.json and with a sharper edge: ruff's
# DEFAULT selection is E4/E7/E9/F, a few dozen rules out of ~900. Measured
# at standup on this repo's own script — 48 findings under `ALL`, ZERO
# under the defaults. A repo that forgets the config does not get a
# weaker gate, it gets a green one that checked almost nothing.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.py" "*.pyi")
[[ -n "${files}" ]] || { echo "lint:python: no Python tracked, skipped"; exit 0; }
xargs ruff check --config "${ORG_BELT_DIR}/ruff.toml" <<<"${files}"
xargs ruff format --config "${ORG_BELT_DIR}/ruff.toml" --check <<<"${files}"
'''

[tasks."lint:python-target"]
description = "ruff's target-version does not claim a newer Python than the pinned interpreter"
dir = "{{cwd}}"
# The hazard is one-directional, so the check is too. Ruff's pyupgrade
# rules rewrite code INTO the syntax of `target-version`; if that names a
# newer Python than the interpreter the belt pins, the fixer produces a
# script the runner cannot execute — and it does so on a green gate,
# because ruff has no idea which interpreter will run the result.
#
# Targeting LOWER than the pin is allowed and stays allowed: a repo
# publishing a library deliberately supports interpreters older than the
# one it develops on. Only "claims newer than it can run" is a defect.
run = '''
files=$(git ls-files ':!vendor/**' "*.py" "*.pyi")
[[ -n "${files}" ]] || { echo "lint:python-target: no Python tracked, skipped"; exit 0; }
# The belt's ruff config, not a repo's: since #445 lint:python passes it
# with --config, so a repo has none to find and looking for one here made
# this check skip clean — the vacuous skip it exists to prevent.
cfg="${ORG_BELT_DIR}/ruff.toml"
[[ -f "${cfg}" ]] || {
  echo "lint:python-target: the belt's ruff.toml is missing — the belt did not arrive" >&2
  exit 1
}
target=$(grep -oE '^target-version[[:space:]]*=[[:space:]]*"py[0-9]+"' "${cfg}" | grep -oE 'py[0-9]+')
[[ -n "${target}" ]] || { echo "lint:python-target: no target-version set, skipped"; exit 0; }
actual=$(python3 -c 'import sys; print("py%d%d" % sys.version_info[:2])')
# Numeric compare on the digits: py39 < py310 lexically is false, which is
# exactly the trap this check exists to avoid falling into itself.
t=${target#py}; a=${actual#py}
tmaj=${t%${t#?}}; tmin=${t#?}
amaj=${a%${a#?}}; amin=${a#?}
if (( tmaj > amaj || (tmaj == amaj && 10#${tmin} > 10#${amin}) )); then
  echo "lint:python-target: ${cfg} targets ${target} but the pinned interpreter is ${actual}" >&2
  echo "  ruff's pyupgrade rules would rewrite this code into syntax ${actual} cannot execute" >&2
  exit 1
fi
echo "lint:python-target: ${target} <= ${actual}, ok"
'''

[tasks."lint:action-pins"]
description = "Every `uses:` carries a version comment beside its SHA (pinact, offline)"
dir = "{{cwd}}"
# The comment half of the pinning convention. zizmor's unpinned-uses
# proves the SHA and is blind to what follows it; lint:canon-pins reads
# canon references only; so `uses: foo/bar@<sha>` with no comment at all
# passed every check the org had, while CLAUDE.md required one. The
# comment is what a human and Renovate read to judge whether a pin is
# current, so its absence is a real defect and not a style point.
#
# -no-api keeps this deterministic and offline, which is what makes it
# gate-eligible: it asserts a 40-character SHA and a comment, and asks
# GitHub nothing. Whether the comment is TRUE needs the API and lives in
# audit:action-pins.
#
# Tracked files only, and composite actions included: pinact's own
# discovery covers .github/workflows only, so action.yml files would go
# unchecked exactly as they did under zizmor's old scope.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n "${files}" ]] || { echo "lint:action-pins: no workflows or actions, skipped"; exit 0; }
xargs pinact run --config "${ORG_BELT_DIR}/pinact.yaml" -fix=false -no-api <<<"${files}"
echo "lint:action-pins: ok"
'''

[tasks."fix:actions"]
description = "Pin every `uses:` to a SHA and write its version comment (pinact)"
dir = "{{cwd}}"
# The fixer nine other fix:* tasks had and action pins did not — pinning
# by hand meant looking up a commit and pasting it. Network-bound, which
# is fine: fix:* never runs in the gate. --update is deliberately NOT
# wired in; bumping pins is Renovate's job, and a fixer that also
# upgraded would fight it.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n "${files}" ]] || { echo "fix:actions: no workflows or actions, skipped"; exit 0; }
xargs pinact run --config "${ORG_BELT_DIR}/pinact.yaml" <<<"${files}"
'''

[tasks."fix:python"]
description = "Apply ruff's safe fixes and rewrite Python to canonical format"
dir = "{{cwd}}"
# Safe fixes only: --unsafe-fixes is never wired into a belt task, on the
# same rule as fix:biome — a fixer must be runnable without reading its
# diff first.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' "*.py" "*.pyi")
[[ -n "${files}" ]] || { echo "fix:python: no Python tracked, skipped"; exit 0; }
xargs ruff check --config "${ORG_BELT_DIR}/ruff.toml" --fix <<<"${files}"
xargs ruff format --config "${ORG_BELT_DIR}/ruff.toml" <<<"${files}"
'''

[tasks."lint:shell"]
description = "Shell format check AND lint (shfmt + shellcheck at --enable=all)"
dir = "{{cwd}}"
# shfmt --find filters the tracked list to shell files itself, including
# extensionless scripts with shell shebangs that an extension glob misses.
#
# shellcheck was pinned in the belt and listed in lint:belt-available, and
# NO TASK RAN IT (#82). The canary proves a binary is present, which reads
# like coverage and is not — so 2732 lines of standalone shell, including
# the source-attest emitter that produces the Source L3 chain, were linted
# by nothing. Verified by putting `rm $f` and `which git` into lib.sh:
# shellcheck reported 22 findings and the gate stayed green.
#
# --enable=all matches what lint:actions already sets for actionlint's
# delegation; a standalone script held to a lower bar than the same code
# pasted into a workflow would be incoherent. The rest of the settings
# live in .shellcheckrc so they are declared once.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' | xargs shfmt --find)
[[ -n "${files}" ]] || { echo "lint:shell: no shell tracked, skipped"; exit 0; }
xargs shfmt -i 2 -bn -ci -sr -s -d <<<"${files}"
xargs shellcheck <<<"${files}"
echo "lint:shell: $(wc -l <<<"${files}" | tr -d " ") script(s) formatted and linted"
'''

[tasks."lint:shell-embedded"]
description = "Shell inside `run:` blocks is formatted and linted, workflows and composite actions alike"
dir = "{{cwd}}"
# The two halves neither shfmt nor actionlint could reach (#82):
#
#   shfmt cannot see into YAML at all — `git ls-files | xargs shfmt --find`
#   returns zero workflow files — so 2584 lines of embedded shell were
#   never formatted by anything, which is where 268-character lines came
#   from.
#
#   actionlint delegates run: blocks to shellcheck, but only for
#   WORKFLOWS. Pointed at a composite action it parses it as a workflow
#   and fails on the missing `jobs:` key, so 152 lines in
#   .github/actions/*/action.yml were checked by nothing. Verified by
#   planting `rm $UNQUOTED` in verify-signed's action.yml: lint:actions
#   exited 0.
#
# The technique is actionlint's own — extract each block, run the real
# tool on it — and the code deliberately does NOT move. Extraction to .sh
# would hide it from zizmor, whose github-env and template-injection
# audits read run: content and cannot follow a script call.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n "${files}" ]] || { echo "lint:shell-embedded: no workflows or actions, skipped"; exit 0; }
# From the belt, like every other canon-owned input. This used to try
# mise/ then .org-canon/ and SKIP CLEAN when it found neither — so a
# consumer running the gate locally checked no embedded shell at all and
# said nothing. ORG_BELT_DIR resolves in both worlds (#445).
helper="${ORG_BELT_DIR}/embedded-shell.py"
# shellcheck disable=SC2086  # the file list is newline-separated on purpose
python3 "${helper}" ${files}
'''

[tasks."fix:shell"]
description = "Rewrite shell to canonical format (shfmt)"
dir = "{{cwd}}"
run = 'git ls-files ":!vendor/**" | xargs shfmt --find | xargs shfmt -i 2 -bn -ci -sr -s -w'

[tasks."lint:commits"]
description = "Conventional-commit check for the branch (committed)"
dir = "{{cwd}}"
# Only meaningful on a branch with an origin/main to diverge from. The
# `[[ -f committed.toml ]]` half of this guard went with the file (#576):
# the rules are delivered now, so there is no longer a state in which a
# repo has commits to check and no config to check them against. It was
# a fail-open — a repo that never copied the file skipped the commit
# canon entirely and nothing said so.
# On pull_request events CI sits on GitHub's synthetic merge commit; the
# PR's real commits are its second parent.
run = 'if git rev-parse --verify -q origin/main > /dev/null; then tip=HEAD; if [[ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]]; then tip="HEAD^2"; fi; "${ORG_BELT_DIR}/committed.sh" "origin/main..${tip}"; else echo "lint:commits: no origin/main, skipped"; fi'

[tasks."commits:check"]
description = "Hold ONE commit message (ORG_COMMIT_MSG_FILE) to the commit canon"
dir = "{{cwd}}"
# Outside the lint: namespace on purpose — `ci` wildcard-collects lint:*,
# and this task is meaningless without a message to check. The
# coverage:check precedent: tasks the gate calls by name, never by
# wildcard.
#
# Two callers, both of which have a message and neither of which can
# reach the belt on its own: lefthook's commit-msg hook (the hook shell
# carries no ORG_BELT_DIR, so it must come through mise like every other
# hook job) and ci.yml's squash-subject step (which composes the subject
# the merge will mint). The path arrives in the environment rather than
# as an argument because mise APPENDS task arguments to the last command
# as text — $1 is never set inside a task body (measured on 2026.8.3).
run = 'if [[ -z "${ORG_COMMIT_MSG_FILE:-}" || ! -f "${ORG_COMMIT_MSG_FILE}" ]]; then echo "commits:check: set ORG_COMMIT_MSG_FILE to a commit-message file" >&2; exit 1; fi; "${ORG_BELT_DIR}/committed.sh" --commit-file "${ORG_COMMIT_MSG_FILE}"'

[tasks."lint:subject-budget"]
description = "Every declared dependency mints a commit subject that fits (#576)"
dir = "{{cwd}}"
# The inversion this task exists for: a permanent commit subject is
# minted from BOUNDED inputs, and the bound is checked when a human adds
# the input — not when a bot renders the output and no one is there to
# fix it. Renovate owns its pull request titles and regenerates them from
# a template, so a title that fails the gate is a merge nobody present
# can unblock (#574). By the time the bot runs, every title it could emit
# has already been proven to fit.
#
# Tracked files only, and it skips clean where it does not apply: a repo
# with no renovate.json has no machine minting subjects, and a repo that
# declares no dependencies has nothing to bound. That second branch is
# nearly unreachable and is not dead code: extending the org preset is
# itself a declared dependency through default.json's own customManager,
# so any repo that reaches this task at all counts at least one. The
# ceiling is read from the delivered committed.toml rather than restated
# — one definition of 72, which is what made the file's delivery the
# first step of #576.
run = 'git ls-files ":!vendor/**" | python3 "${ORG_BELT_DIR}/subject-budget.py"'

[tasks."lint:zizmor"]
description = "Security-audit GitHub Actions workflows (zizmor, pedantic)"
dir = "{{cwd}}"
# --offline: with a token present zizmor auto-enables online audits, whose
# results change with remote state — the gate checks the diff, not the
# internet. Pedantic, no severity floor: every actionable finding fails.
# The auditor persona (includes likely false positives) lives in
# audit:actions for human-run reviews, not the gate.
# Scope covers composite actions, not just workflows. zizmor audits
# `action.yml` files and flags unpinned `uses:` in them exactly as it does
# for workflows — it had simply never been pointed at them, so
# .github/actions/source-attest/action.yml carried a live third-party
# reference that no check in the org could see (#82).
run = '''
paths=""
compgen -G ".github/workflows/*.y*ml" > /dev/null && paths=".github/workflows/"
[[ -d .github/actions ]] && paths="${paths} .github/actions/"
[[ -n "${paths}" ]] || { echo "lint:zizmor: no workflows or actions, skipped"; exit 0; }
# shellcheck disable=SC2086
zizmor --offline --persona=pedantic ${paths}
'''

[tasks."lint:dco"]
description = "Every commit carries a Developer Certificate of Origin sign-off"
dir = "{{cwd}}"
# OSPS-LE-01.01: contributors must assert legal authorisation for their
# contributions. `git commit -s` adds the trailer; the sign-off email must
# match the commit author, so a sign-off asserts something about the person
# who wrote the change rather than whoever happened to run git.
#
# Bots sign off too — the release commit and Renovate both add the trailer —
# so there is no exemption list to drift out of date.
run = '''
git rev-parse --verify -q origin/main > /dev/null || {
  echo "lint:dco: no origin/main, skipped"; exit 0
}
tip=HEAD
[[ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]] && tip="HEAD^2"
range="origin/main..${tip}"
count=0
bad=""
while read -r sha; do
  [[ -n "${sha}" ]] || continue
  count=$((count + 1))
  email=$(git log -1 --format=%ae "${sha}")
  # Fixed-string match on the address: a real email contains regex
  # metacharacters (the + in a GitHub noreply address is the common one),
  # and interpolating it into a pattern silently matches the wrong thing.
  git log -1 --format=%B "${sha}" | grep -i "^Signed-off-by:" \
    | grep -qF "<${email}>" \
    || bad="${bad} ${sha:0:8}"
done < <(git rev-list "${range}")
if [[ -n "${bad}" ]]; then
  echo "lint:dco: commits missing a sign-off matching their author:${bad}" >&2
  echo "  fix with: git commit -s   (or: git rebase --signoff origin/main)" >&2
  exit 1
fi
echo "lint:dco: ${count} commits signed off"
'''

[tasks."lint:exec-bits"]
description = "Every tracked shell script is executable (exit-126 trap)"
dir = "{{cwd}}"
# Found by the v1.5.0 publish: fix:shell recreated collect-vex.sh
# without its mode, workflows exec release scripts by path, and the
# release died at run time with exit 126 — after the tag, which is
# immutable, so the version was burned. Nothing else checks a mode.
run = '''
files=$(git ls-files ':!vendor/**' "*.sh")
[[ -n "${files}" ]] || { echo "lint:exec-bits: no shell scripts tracked, skipped"; exit 0; }
bad=""
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  mode=$(git ls-files -s "${f}" | cut -d" " -f1)
  [[ "${mode}" == "100755" ]] || bad="${bad} ${f}(${mode})"
done <<< "${files}"
if [[ -n "${bad}" ]]; then
  echo "lint:exec-bits: tracked scripts missing the executable bit:${bad}" >&2
  echo "  workflows exec these by path; a lost mode is exit 126 after the tag" >&2
  echo "  fix with: chmod +x <file> && git add <file>" >&2
  exit 1
fi
echo "lint:exec-bits: $(wc -l <<< "${files}" | tr -d " ") scripts executable"
'''

[tasks."lint:deny"]
description = "Dependency policy: bans + licenses + sources (cargo-deny, deterministic over the lock)"
dir = "{{cwd}}"
# No wait_for: the rustup concurrency race this chain once served
# (measured twice on the lab's v0.18.0 release PR) was task-time
# toolchain driving on a cold runner. The toolchain — components
# included — is now fully installed before any task runs (#117:
# coverage:check asserts llvm-tools as a declared build input instead of
# installing it), and cargo's own locking handles concurrent fetches.
# The gate half of the dependency track (docs/dependency-track.md).
# Deterministic: the outcome is a function of Cargo.lock + the committed
# deny.toml. `cargo fetch --locked` first — fetching pinned inputs is the
# same category as fetching the toolchain. Advisories are deliberately
# NOT here: RustSec is a moving feed, so they live in audit:deny.
run = '''
locks=$(git ls-files ':!vendor/**' "Cargo.lock" "*/Cargo.lock")
[[ -n "${locks}" ]] || { echo "lint:deny: no Cargo.lock tracked, skipped"; exit 0; }
# A repo with a lock has rust pinned as a build input; cargo absent is a
# broken toolchain, and skipping would be the vacuous-success failure.
command -v cargo > /dev/null || {
  echo "lint:deny: Cargo.lock present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
[[ -f deny.toml ]] || {
  echo "lint:deny: Cargo.lock present but no deny.toml — copy scaffold/deny.toml from the canon" >&2
  exit 1
}
cargo fetch --locked
cargo deny check bans licenses sources
# An exception that outlives its cause is the failure `#[expect]` was
# chosen to prevent everywhere else, and cargo-deny does not have that
# property: a `skip`/`skip-tree` entry matching nothing is silent
# (measured). So necessity is tested rather than assumed — each declared
# skip is removed in turn and the check re-run. A variant that still
# passes proves its entry does nothing, and the gate names it. The
# helper resolves from the belt, which is where the org's policy lives;
# a repo running without the canon cannot quietly skip this.
helper="${ORG_BELT_DIR}/deny-skips.py"
stale=""
while IFS=$'\t' read -r name variant; do
  [[ -n "${name}" ]] || continue
  if cargo deny --config "${variant}" check bans > /dev/null 2>&1; then
    stale="${stale} ${name}"
  fi
done < <(python3 "${helper}" deny.toml)
if [[ -n "${stale}" ]]; then
  echo "lint:deny: duplicate-version skip no longer needed:${stale}" >&2
  echo "  the check passes without it, so the upstream lag it was written for is over" >&2
  echo "  delete the entry from deny.toml — an exception that outlives its cause is not a decision" >&2
  exit 1
fi
'''

[tasks."audit:deny"]
description = "Dependency advisories (cargo-deny + RustSec — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: a new advisory fails unrelated work, which is a
# property of the feed, not the diff. Every `ignore` in deny.toml carries
# a reason and cites the VEX statement recording the decision — the L2
# exit is a written decision, never an override.
run = '''
locks=$(git ls-files ':!vendor/**' "Cargo.lock" "*/Cargo.lock")
[[ -n "${locks}" ]] || { echo "audit:deny: no Cargo.lock tracked, skipped"; exit 0; }
command -v cargo > /dev/null || {
  echo "audit:deny: Cargo.lock present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
[[ -f deny.toml ]] || {
  echo "audit:deny: Cargo.lock present but no deny.toml — copy scaffold/deny.toml from the canon" >&2
  exit 1
}
cargo fetch --locked
cargo deny check advisories
'''

[tasks."lint:rust"]
description = "Rust lint + format check (clippy at every group, restriction minus named contradictions; rustfmt at its stable maximum)"
dir = "{{cwd}}"
# The Rust half of the language layer (#445). clippy compiles PACKAGES
# through cargo, not a file list, so `git ls-files` cannot feed it — the
# lint:go situation exactly, and safe for the same reason: an untracked
# .rs file inside a tracked crate is a build input rustc would also see.
#
# LEVELS ARE STATED AS GROUPS MINUS NAMED EXCLUSIONS, never as a list of
# lints to enable. The two forms measure identically today (97 findings
# on release-lab either way) and fail in opposite directions. An enable
# list is fail-OPEN: the restriction group grew by N lints in the last
# toolchain bump, none of them are in our list, and enforcement quietly
# fails to grow. The exclusion form is fail-CLOSED: a new lint arrives
# already enforced with no canon edit, and if one of the excluded names
# is ever renamed away the exclusion stops applying, the contradiction
# fires, and the gate goes red where someone will read it.
#
# THE NINE EXCLUSIONS ARE MECHANICAL CONTRADICTIONS, not taste. clippy's
# own book says the restriction group must not be enabled wholesale
# because its lints contradict each other; these are the pairs where
# obeying one lint is disobeying another, each ruled toward the
# idiomatic form (docs/tooling-verdicts.md carries the full reasoning):
#   implicit_return          — contradicts style's needless_return
#   question_mark_used       — contradicts style's question_mark
#   self_named_module_files  — pairs with mod_module_files; the org
#                              enforces self-named layout, the 2018 idiom
#   pub_with_shorthand       — the name is inverted: this lint BANS
#                              `pub(crate)`. The org keeps the shorthand,
#                              so pub_without_shorthand is the one on
#   semicolon_outside_block  — pairs with semicolon_inside_block
#   separated_literal_suffix — the org writes 1_u32, so the lint that
#                              bans it is off and unseparated_* is on
#   big_endian_bytes,        — all three on bans every byte conversion;
#   little_endian_bytes        the org bans only target-dependent
#                              _ne_bytes, because explicit endianness is
#                              what reproducibility requires
#   inline_asm_x86_intel_syntax — Rust's own asm! default is Intel
#
# blanket_clippy_restriction_lints fires because we enable the group on
# purpose; allowed with that as its reason. multiple_crate_versions is
# allowed because the duplicate policy is stated once, in the repo's
# deny.toml at `multiple-versions = "deny"` — this file is org-wide, so
# an exception here would exempt every repo (docs/dependency-track.md).
#
# `-D warnings` also denies rustc's own warn-by-default lints, which is
# the point: it is what makes the org answer `warnings_strict` truthfully
# (docs/best-practices.md). It rides `--` rather than RUSTFLAGS, which
# the clippy book's CI page suggests, because `--` args reach only
# workspace members through RUSTC_WORKSPACE_WRAPPER — RUSTFLAGS would
# apply to every dependency and invalidate the whole build cache.
#
# Deterministic: the outcome is a function of the tree, the lock and the
# pinned toolchain. `cargo fetch --locked` first, the lint:deny
# precedent — fetching pinned inputs is the same category as fetching the
# toolchain.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n "${manifests}" ]] || { echo "lint:rust: no Cargo.toml tracked, skipped"; exit 0; }
# A repo with a Cargo.toml has rust pinned as a build input; cargo absent
# is a broken toolchain, and skipping would be the vacuous-success
# failure.
command -v cargo > /dev/null || {
  echo "lint:rust: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
# clippy is a rustup COMPONENT of the repo's own pin, not a belt binary.
# mise installs rust through rustup and inherits whatever profile the
# machine already has, so on a minimal profile clippy is simply absent
# and this task would lint nothing. Asserted with a remedy, never
# installed: a task-time rustup races every other task driving the
# toolchain (measured twice on the lab's v0.18.0 release PR, #117).
if ! rustup component list --installed 2> /dev/null | grep -q "^clippy"; then
  echo "lint:rust: clippy component missing — declare it with the rust pin in mise.toml:" >&2
  echo "  rust = { version = \"1.xx.x\", components = \"clippy,rustfmt,llvm-tools\" }" >&2
  echo "  (installed with the toolchain, before tasks run — never mid-run)" >&2
  exit 1
fi
# The knobs are org policy, so a repo-local clippy.toml is a silent
# lowering of them — the unexplained .gitleaks.toml ruling.
local_conf=$(git ls-files "clippy.toml" ".clippy.toml" "*/clippy.toml" "*/.clippy.toml" \
  "rustfmt.toml" ".rustfmt.toml" "*/rustfmt.toml" "*/.rustfmt.toml")
if [[ -n "${local_conf}" ]]; then
  echo "lint:rust: repo-local Rust tool configuration is not the org's:${local_conf}" >&2
  echo "  the knobs live in the canon's mise/clippy.toml and mise/rustfmt.toml," >&2
  echo "  delivered through CLIPPY_CONF_DIR and rustfmt's --config-path" >&2
  echo "  a setting this repo genuinely needs is argued into the canon, not kept locally" >&2
  exit 1
fi
# Locate the canon's clippy.toml. CI sets MISE_GLOBAL_CONFIG_FILE to it;
# locally the belt arrives as a ~/.config/mise/conf.d symlink into a
# canon checkout. No mise template variable resolves the config file's
# own directory ({{config_root}} is the home directory for a global
# config), so both carriers are read here — and an unresolvable belt is
# fatal, because clippy would otherwise silently run at its own defaults.
export CLIPPY_CONF_DIR="${ORG_BELT_DIR}"
out=""
fmt_out=""
trap 'rm -f "${out}" "${fmt_out}"' EXIT
# The rustfmt leg, first because it is seconds against clippy's minutes.
# rustfmt is a rustup component of the repo's own pin exactly like clippy,
# asserted with a remedy and never installed.
if ! rustup component list --installed 2> /dev/null | grep -q "^rustfmt"; then
  echo "lint:rust: rustfmt component missing — declare it with the rust pin in mise.toml:" >&2
  echo "  rust = { version = \"1.xx.x\", components = \"clippy,rustfmt,llvm-tools\" }" >&2
  exit 1
fi
# Formatting suppression, held to the same standard as clippy's — except
# that rustfmt's attribute takes no reason and has no `#[expect]`
# analogue, so it can never retire itself. A whole-file `#![rustfmt::skip]`
# is refused outright, and a narrow one states why in the marker-comment
# idiom `lint:capability-boundary` already uses.
skips=""
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  if grep -qE "^[[:space:]]*#!\\[rustfmt::skip" "${f}"; then
    skips="${skips} ${f}(whole-file)"
    continue
  fi
  if grep -qE "^[[:space:]]*#\\[rustfmt::skip" "${f}" && ! grep -q "rustfmt-skip:" "${f}"; then
    skips="${skips} ${f}(no marker)"
  fi
done <<< "$(git ls-files ':!vendor/**' "*.rs")"
if [[ -n "${skips}" ]]; then
  echo "lint:rust: formatting suppressed without a written decision:${skips}" >&2
  echo "  #![rustfmt::skip] exempts an entire file — never allowed" >&2
  echo "  #[rustfmt::skip] must carry a '// rustfmt-skip: <why>' marker above it" >&2
  echo "  rustfmt has no #[expect] analogue, so the comment is the only thing a reviewer sees" >&2
  exit 1
fi
# `cargo fmt` rather than a tracked-file list — the lint:go deviation with
# the argument running the other way. rustfmt walks each target's module
# tree, so a .rs file no crate references is never visited; but a file no
# crate references is not a build input either, and rustc cannot see it
# any more than rustfmt can. Feeding `git ls-files` would also mean
# choosing an edition here, when Cargo.toml states it per crate and
# `cargo fmt` reads it from there.
fmt_out=$(mktemp)
fmt_status=0
cargo fmt --all --check -- --config-path "${ORG_BELT_DIR}/rustfmt.toml" > "${fmt_out}" 2>&1 || fmt_status=$?
# Both of rustfmt's config failure modes are WARNINGS that exit 0
# (measured): an unknown key, and a nightly-only option on a stable
# toolchain. Either formats to a weaker standard behind a green gate, so
# the warnings are the check and the exit code is only half of it.
if grep -q "^Warning" "${fmt_out}"; then
  cat "${fmt_out}" >&2
  echo "lint:rust: rustfmt warned — an ignored option means a weaker format, silently" >&2
  exit 1
fi
if [[ ${fmt_status} -ne 0 ]]; then
  cat "${fmt_out}" >&2
  echo "lint:rust: formatting differs from the org's — run 'mise run fix:rust'" >&2
  exit 1
fi
echo "lint:rust: formatting clean"
# The one suppression clippy itself cannot forbid: a crate-level allow of
# a whole group silences every flag above and exits 0 (measured — even
# `-F` only warns about it). A narrow, reasoned
# `#[expect(clippy::x, reason = "...")]` is the exception mechanism, and
# restriction's allow_attributes + allow_attributes_without_reason —
# both enabled by the group — make it the ONLY one that compiles.
groups="all|pedantic|nursery|cargo|restriction|style|complexity|perf|correctness|suspicious"
blanket=""
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  if grep -qE "^[[:space:]]*#!\\[(allow|expect)\\([^]]*clippy::(${groups})\\b" "${f}"; then
    blanket="${blanket} ${f}"
  fi
done <<< "$(git ls-files ':!vendor/**' "*.rs")"
if [[ -n "${blanket}" ]]; then
  echo "lint:rust: crate-level suppression of a whole clippy group:${blanket}" >&2
  echo "  a group allow silences every level this task sets and the gate still goes green" >&2
  echo "  suppress one lint at the narrowest scope instead, with a reason:" >&2
  echo "    #[expect(clippy::the_lint, reason = \"why this code is right as written\")]" >&2
  echo "  an expect fails once it stops being needed; an allow rots silently" >&2
  exit 1
fi
# Members that cannot build on a gate runner are declared, never implied:
# reading `default-members` instead would let a repo drop a crate from
# linting by editing an unrelated field. CLIPPY_EXCLUDE is the
# COVERAGE_EXCLUDE pattern ([env] in the repo's mise.toml), written down
# where a reviewer sees it.
excludes=""
for m in ${CLIPPY_EXCLUDE:-}; do excludes="${excludes} --exclude ${m}"; done
# CLIPPY_FEATURES lets a repo whose features are mutually exclusive say
# so; everything else gets --all-features, because an unlinted feature is
# unlinted code.
features="${CLIPPY_FEATURES:---all-features}"
cargo fetch --locked
out=$(mktemp)
status=0
# shellcheck disable=SC2086
cargo clippy --workspace --all-targets ${features} --locked ${excludes} -- \
  -D warnings \
  -D clippy::all -D clippy::pedantic -D clippy::nursery -D clippy::cargo \
  -D clippy::restriction \
  -A clippy::blanket_clippy_restriction_lints \
  -A clippy::multiple_crate_versions \
  -A clippy::implicit_return \
  -A clippy::question_mark_used \
  -A clippy::self_named_module_files \
  -A clippy::pub_with_shorthand \
  -A clippy::semicolon_outside_block \
  -A clippy::separated_literal_suffix \
  -A clippy::big_endian_bytes \
  -A clippy::little_endian_bytes \
  -A clippy::inline_asm_x86_intel_syntax 2>&1 | tee "${out}" || status=$?
# A lint name rustc does not recognise is warning E0602, and `-D
# warnings` cannot reach it: it is emitted by the command-line parser
# before lint levels apply, so `-D unknown_lints` and `-D
# renamed_and_removed_lints` both still exit 0 (measured). With levels
# stated as exclusions a stale name fails closed anyway — the lint it
# excluded starts firing — but the run must say WHY rather than leave a
# maintainer reading a contradiction that looks like a false positive.
if grep -qE "E0602|has been renamed to" "${out}"; then
  echo "lint:rust: a lint name above is unknown to this toolchain (see E0602/renamed above)" >&2
  echo "  clippy renamed or removed it — update the exclusion list in mise/config.toml" >&2
  exit 1
fi
[[ ${status} -eq 0 ]] || exit "${status}"
echo "lint:rust: clean at every group (restriction minus 9 named contradictions)"
'''

[tasks."fix:rust"]
description = "Apply clippy's machine-applicable suggestions (write mode, never in the gate)"
dir = "{{cwd}}"
# The write-mode sibling. `cargo clippy --fix` implies --no-deps and
# --all-targets, and refuses to run against uncommitted work unless told
# otherwise — which is the right default for a tool that rewrites source,
# so the refusal is left in place and a dirty tree is the caller's to
# resolve. Only a subset of lints is machine-applicable; the rest are the
# author's judgement, which is why this is a sibling and not a gate.
run = '''
set -euo pipefail
manifests=$(git ls-files ':!vendor/**' "Cargo.toml" "*/Cargo.toml")
[[ -n "${manifests}" ]] || { echo "fix:rust: no Cargo.toml tracked, skipped"; exit 0; }
command -v cargo > /dev/null || {
  echo "fix:rust: Cargo.toml present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
if ! rustup component list --installed 2> /dev/null | grep -q "^clippy"; then
  echo "fix:rust: clippy component missing — declare it with the rust pin in mise.toml" >&2
  exit 1
fi
export CLIPPY_CONF_DIR="${ORG_BELT_DIR}"
if ! rustup component list --installed 2> /dev/null | grep -q "^rustfmt"; then
  echo "fix:rust: rustfmt component missing — declare it with the rust pin in mise.toml" >&2
  exit 1
fi
# Format first: clippy --fix rewrites source, and handing it canonically
# formatted input keeps its edits from arriving pre-mangled.
cargo fmt --all -- --config-path "${ORG_BELT_DIR}/rustfmt.toml"
echo "fix:rust: formatted"
features="${CLIPPY_FEATURES:---all-features}"
cargo fetch --locked
# shellcheck disable=SC2086
cargo clippy --fix ${features} --locked -- \
  -D warnings \
  -D clippy::all -D clippy::pedantic -D clippy::nursery -D clippy::cargo \
  -D clippy::restriction \
  -A clippy::blanket_clippy_restriction_lints \
  -A clippy::multiple_crate_versions \
  -A clippy::implicit_return \
  -A clippy::question_mark_used \
  -A clippy::self_named_module_files \
  -A clippy::pub_with_shorthand \
  -A clippy::semicolon_outside_block \
  -A clippy::separated_literal_suffix \
  -A clippy::big_endian_bytes \
  -A clippy::little_endian_bytes \
  -A clippy::inline_asm_x86_intel_syntax
echo "fix:rust: applied what is machine-applicable — the rest is judgement"
'''

[tasks."lint:go"]
description = "Go lint + format check (golangci-lint, default: all + curated disables)"
dir = "{{cwd}}"
# The Go half of the language layer (#392). golangci-lint analyzes
# PACKAGES via the go toolchain, not a file list — `git ls-files` cannot
# feed it. That is safe against the lefthook-cache trap anyway: go
# package loading ignores dot-directories, so nothing under .git/ is
# reachable, and an untracked .go file inside a tracked package is a
# build input the compiler would also see — hiding it from the linter
# would be lying to ourselves, not hygiene.
#
# A tracked .golangci.yml is REQUIRED once Go is tracked, the
# ruff/biome rule with the same sharp edge: golangci-lint's default
# selection is five linters out of ~105, so a repo that forgets the
# config gets a green gate that checked almost nothing. Copy
# scaffold/.golangci.yml — the org policy is `default: all` with
# per-rule written disables, and v2 `run` also reports the enabled
# formatters (gofumpt extra-rules, gci) as findings, so format drift
# reds here too.
#
# Multi-module trees are linted per go.mod, because golangci-lint
# resolves one module context per invocation.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n "${mods}" ]] || { echo "lint:go: no go.mod tracked, skipped"; exit 0; }
# A repo with a go.mod has go pinned as a build input; go absent is a
# broken toolchain, and skipping would be the vacuous-success failure.
command -v go > /dev/null || {
  echo "lint:go: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
command -v golangci-lint > /dev/null || {
  echo "lint:go: golangci-lint missing from the belt" >&2
  exit 1
}
# The one language config that stays repo-side: it names the module path
# (gci's import prefix) and, in stele, wrapcheck globs for that module's
# own packages. Per-repo CONTENT, like deny.toml's skips — the belt can
# deliver a config, not invent a repo's identity (#445).
if ! git ls-files --error-unmatch ".golangci.yml" > /dev/null 2>&1; then
  echo "lint:go: Go is tracked but no .golangci.yml is — copy scaffold/.golangci.yml (#392)" >&2
  echo "  without it golangci-lint runs its five default linters, not the org's default: all" >&2
  exit 1
fi
count=0
while IFS= read -r m; do
  [[ -n "${m}" ]] || continue
  count=$((count + 1))
  (cd "$(dirname "${m}")" && golangci-lint run)
done <<< "${mods}"
echo "lint:go: ${count} module(s) linted and format-checked"
'''

[tasks."lint:tsc-flags"]
description = "Every type-checking option the pinned tsc has is passed or adjudicated"
dir = "{{cwd}}"
# The enable-list alarm, and unlike biome's it is offline and lives in
# the gate. TypeScript cannot express its checks as a group minus
# exclusions — `--strict` grows on its own, but every dial outside that
# family is named one at a time in mise/tsc-flags.txt. So a strictness
# option added by a toolchain bump would simply be absent, and
# enforcement would stop growing with nothing to say so: the exact
# failure the clippy standup rejected an explicit enable-list for.
#
# `tsc --all` is the pinned compiler's own account of what it has, so
# the comparison needs no network and no vendored list — the belt asks
# the binary it is running. Unconditional, because it checks the ORG's
# config rather than a repo's code: the canon tracks no TypeScript, and
# a check that only runs where TypeScript exists would never run here,
# which is how three biome defects survived three days (#445).
run = '''
set -euo pipefail
command -v tsc > /dev/null || { echo "lint:tsc-flags: tsc missing from the belt" >&2; exit 1; }
list="${ORG_BELT_DIR}/tsc-flags.txt"
[[ -f "${list}" ]] || { echo "lint:tsc-flags: ${list} missing from the belt" >&2; exit 1; }
known=$( { grep -oE '^--[a-zA-Z]+' "${list}"; \
  sed -n 's/^# adjudicated: \([a-zA-Z]*\) .*/--\1/p' "${list}"; } | sort -u)
have=$(tsc --all | sed -n '/^### Type Checking/,/^### Watch/p' \
  | awk '/^--/{name=$1} /^type: boolean/{print name}' | tr -d ',' | sort -u)
unruled=$(comm -23 <(echo "${have}") <(echo "${known}"))
if [[ -n "${unruled}" ]]; then
  echo "lint:tsc-flags: $(tsc --version | tr -d '\n') has type-checking options the org has not ruled on:" >&2
  sed 's/^/  /' <<<"${unruled}" >&2
  echo "  pass it in mise/tsc-flags.txt, or add an '# adjudicated:' line saying why not" >&2
  exit 1
fi
echo "lint:tsc-flags: every type-checking option of $(tsc --version | tr -d '\n') is passed or ruled"
'''

[tasks."lint:types"]
description = "TypeScript type checking (tsc, every dial forced from the command line)"
dir = "{{cwd}}"
# The TypeScript half of the language layer (#445). Named for the subject
# like lint:go and lint:python — tsc checks one thing, and biome already
# owns the tool-named task over the same files.
#
# Every dial is passed on the COMMAND LINE, and that is the whole design:
# a compiler flag beats the same key in tsconfig.json even under `-p`
# (proven), so a repo cannot lower the org's level from its own config.
# Stronger than clippy, where a source attribute could still defeat the
# belt. What tsconfig.json is left to say is what the project IS —
# which files, browser or server, which module system — so it stays
# repo-side and carries no strictness lines at all (scaffold/tsconfig.json).
#
# Per project with `-p`, never `tsc -b`: build mode refuses every
# compiler option it is handed (TS5094), so the org's flags and
# reference-following are mutually exclusive, and enforcement wins.
# Project references are therefore refused outright rather than half
# supported — under `-p` a referenced project's declarations do not
# exist (TS6305) and the alternative is a build that writes. TS 7 checks
# ~360 files a second, so the build-orchestration case references exist
# to solve is not one the org has.
#
# `--noEmit` is not optional: without it tsc writes .js beside the
# sources, and writes it even when checking FAILED (noEmitOnError
# defaults false). .tsbuildinfo is redirected to a temp dir for the same
# reason — the gate does not write to the tree (#374).
#
# File selection is the one thing the command line cannot force, so it
# is checked instead: every tracked .ts file must appear in some
# project's program. A repo cannot `exclude` its way to a green gate.
run = '''
set -euo pipefail
ts=$(git ls-files ':!vendor/**' "*.ts" "*.tsx" "*.mts" "*.cts")
[[ -n "${ts}" ]] || { echo "lint:types: no TypeScript tracked, skipped"; exit 0; }
cfgs=$(git ls-files ':!vendor/**' "tsconfig.json" "*/tsconfig.json" "*/*/tsconfig.json" \
  "*/*/*/tsconfig.json")
if [[ -z "${cfgs}" ]]; then
  echo "lint:types: TypeScript is tracked but no tsconfig.json is — copy scaffold/tsconfig.json" >&2
  echo "  tsc refuses a file list when a project exists, so a project is how the org checks" >&2
  exit 1
fi
command -v tsc > /dev/null || { echo "lint:types: tsc missing from the belt" >&2; exit 1; }
# The suppression ladder, and it is clippy's exactly. @ts-expect-error is
# the only survivor: it self-retires, because TypeScript errors (TS2578)
# when the error it covers goes away — the #[expect] property. @ts-ignore
# suppresses forever and silently, and biome's noTsIgnore already bans it
# org-wide. @ts-nocheck silences a WHOLE FILE, the crate-level
# #![allow] in a new costume, and nothing catches it: biome ran clean
# over a file containing one. No compiler flag defeats either, so the
# belt greps, exactly as it does for clippy's crate-level allows.
banned=$(xargs grep -Hn '@ts-nocheck' <<<"${ts}" || true)
if [[ -n "${banned}" ]]; then
  echo "lint:types: @ts-nocheck disables checking for an entire file" >&2
  sed 's/^/  /' <<<"${banned}" >&2
  echo "  use @ts-expect-error with a written reason on the single line that needs it" >&2
  exit 1
fi
bare=$(xargs grep -Hn '@ts-expect-error[[:space:]]*$' <<<"${ts}" || true)
if [[ -n "${bare}" ]]; then
  echo "lint:types: @ts-expect-error without a written reason" >&2
  sed 's/^/  /' <<<"${bare}" >&2
  echo "  the compiler retires the directive when the error goes; it cannot supply the why" >&2
  exit 1
fi
refs=$(grep -l '"references"' ${cfgs} || true)
if [[ -n "${refs}" ]]; then
  echo "lint:types: project references are not supported org-wide" >&2
  sed 's/^/  declares references: /' <<<"${refs}" >&2
  echo "  tsc -b refuses the org's compiler flags (TS5094), so following references would" >&2
  echo "  mean checking at whatever level the repo chose. Give each project its own config." >&2
  exit 1
fi
if [[ -n "$(git ls-files "package.json" "*/package.json")" && ! -d node_modules ]]; then
  echo "lint:types: dependencies are not installed, so their types cannot be read" >&2
  echo "  install from the tracked lockfile before checking (a check against absent types" >&2
  echo "  is not a weaker check, it is a green one that resolved nothing)" >&2
  exit 1
fi
flags=()
while IFS= read -r line; do
  line="${line%%#*}"
  [[ -n "${line//[[:space:]]/}" ]] || continue
  read -ra parts <<< "${line}"
  flags+=("${parts[@]}")
done < "${ORG_BELT_DIR}/tsc-flags.txt"
tmp=$(mktemp -d)
trap 'rm -rf "${tmp}"' EXIT
count=0
while IFS= read -r cfg; do
  [[ -n "${cfg}" ]] || continue
  count=$((count + 1))
  tsc -p "${cfg}" --tsBuildInfoFile "${tmp}/${count}.tsbuildinfo" "${flags[@]}"
  tsc -p "${cfg}" --noEmit --noCheck --listFiles \
    --tsBuildInfoFile "${tmp}/${count}.info" >> "${tmp}/seen"
done <<< "${cfgs}"
sed "s|^${PWD}/||" "${tmp}/seen" | sort -u > "${tmp}/checked"
sort -u <<<"${ts}" > "${tmp}/tracked"
escaped=$(comm -23 "${tmp}/tracked" "${tmp}/checked")
if [[ -n "${escaped}" ]]; then
  echo "lint:types: tracked TypeScript that no project checks" >&2
  sed 's/^/  /' <<<"${escaped}" >&2
  echo "  add it to a project's include, or give it a project — an excluded file is" >&2
  echo "  unchecked, and the gate cannot tell that apart from checked-and-clean" >&2
  exit 1
fi
echo "lint:types: ${count} project(s) checked, $(wc -l < "${tmp}/tracked" | tr -d ' ') files covered"
'''

[tasks."lint:go-tidy"]
description = "go.mod and go.sum match the source (go mod tidy -diff)"
dir = "{{cwd}}"
# The Go dependency-hygiene half (#445), and the one belt task whose tool
# would normally REWRITE the tree to answer the question. `-diff` is what
# makes it a gate check rather than a fixer: it prints the unified diff
# tidy would apply and exits non-zero when that diff is non-empty,
# writing nothing (#374, proven in both directions — an unused `require`
# and an import with no requirement).
#
# What it catches that nothing else does: a dependency imported but never
# required, a requirement nothing imports any more, and go.sum entries
# that drifted from either. golangci-lint reads packages and never reads
# the manifest, so this is invisible to it — the cargo-machete gap in Go
# form, except the toolchain answers it itself and needs no extra tool.
#
# One honest limit: for a MISSING requirement, tidy resolves the latest
# version over the network, so the suggested diff is time-dependent. The
# verdict is not — that tree is untidy today and tomorrow — and a repo in
# that state is already failing, so the gate stays stable where it counts.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n "${mods}" ]] || { echo "lint:go-tidy: no go.mod tracked, skipped"; exit 0; }
command -v go > /dev/null || {
  echo "lint:go-tidy: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
count=0
while IFS= read -r m; do
  [[ -n "${m}" ]] || continue
  count=$((count + 1))
  if ! (cd "$(dirname "${m}")" && go mod tidy -diff); then
    echo "lint:go-tidy: ${m} does not match the source — apply the diff above" >&2
    echo "  mise run fix:go-tidy" >&2
    exit 1
  fi
done <<< "${mods}"
echo "lint:go-tidy: ${count} module(s) match their source"
'''

[tasks."fix:go-tidy"]
description = "Rewrite go.mod and go.sum to match the source (go mod tidy)"
dir = "{{cwd}}"
# The write-mode sibling, and the same command without -diff. Safe by the
# fix:* rule — tidy adds what the source imports and removes what it does
# not, so it is derivable from the tree rather than a judgement call.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n "${mods}" ]] || { echo "fix:go-tidy: no go.mod tracked, skipped"; exit 0; }
while IFS= read -r m; do
  [[ -n "${m}" ]] || continue
  (cd "$(dirname "${m}")" && go mod tidy)
done <<< "${mods}"
'''

[tasks."lint:go-fuzz-seeds"]
description = "Every Go fuzz target compiles and its seed corpus passes, race detector on"
dir = "{{cwd}}"
# CGO_ENABLED=1 here and only here, the same measured exception stele
# documents for its own test task: -race requires cgo on linux (the gate
# runner) while darwin tolerates it without, so a local run would stay
# green over a red one in CI. Repos that ship CGO_ENABLED=0 binaries keep
# doing so — this is a test instrument, not a build setting.
env = { CGO_ENABLED = "1" }
# The gate half of Go fuzzing (#445), and the reason it is a belt task
# rather than something a repo's own `test` remembers to cover: a seed
# corpus IS the regression suite. When the cron finds a crasher, the
# engine writes it into testdata/fuzz/<Target>/, and from that moment
# plain `go test` fails on it — proven on a probe, where a 15s run found
# an invalid-UTF-8 reverse, wrote the input, and the next ordinary test
# run went red on it. So the seeds must run under the org's enforcement,
# not under whatever a repo chose to define as `test` (which `ci` runs
# only if it exists).
#
# Deterministic by construction: without -fuzz the engine never
# generates, never writes, and only replays the committed corpus. The
# generated corpus lives in $GOCACHE/fuzz and is not consulted here.
#
# -race costs 0.33s -> 1.35s on a seed corpus (measured), which is
# nothing, and the seeds are exactly the inputs already known to reach
# interesting code. Determinism survives it: the detector reports races
# it observes and invents none.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n "${mods}" ]] || { echo "lint:go-fuzz-seeds: no go.mod tracked, skipped"; exit 0; }
command -v go > /dev/null || {
  echo "lint:go-fuzz-seeds: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
total=0
while IFS= read -r m; do
  [[ -n "${m}" ]] || continue
  d=$(dirname "${m}")
  n=$( (cd "${d}" && go test -list '^Fuzz' ./... 2> /dev/null) | grep -c '^Fuzz' || true)
  [[ "${n}" -gt 0 ]] || continue
  total=$((total + n))
  (cd "${d}" && go test -race -run '^Fuzz' ./...)
done <<< "${mods}"
[[ "${total}" -gt 0 ]] || { echo "lint:go-fuzz-seeds: no Go fuzz targets, skipped"; exit 0; }
echo "lint:go-fuzz-seeds: ${total} target(s) built, seed corpora clean"
'''

[tasks."fix:go"]
description = "Apply golangci-lint's auto-fixes and rewrite Go to canonical format (gofumpt, gci)"
dir = "{{cwd}}"
# The write-mode sibling. `run --fix` applies only fixes the analyzers
# themselves mark safe, and `fmt` applies the formatters — the same
# no-unsafe rule as fix:biome and fix:python: a fixer must be runnable
# without reading its diff first.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n "${mods}" ]] || { echo "fix:go: no go.mod tracked, skipped"; exit 0; }
command -v go > /dev/null || {
  echo "fix:go: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
while IFS= read -r m; do
  [[ -n "${m}" ]] || continue
  (cd "$(dirname "${m}")" && golangci-lint run --fix && golangci-lint fmt)
done <<< "${mods}"
'''

[tasks."audit:go-vulns"]
description = "Go vulnerability scan, call-graph aware (govulncheck — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: govulncheck fetches https://vuln.go.dev at run
# time, and a new advisory fails unrelated work — a property of the
# feed, not the diff. Call-graph aware, so strictly more precise than
# dependency matching: it reds only when a vulnerable FUNCTION is
# reachable from this module's code, which is the honesty the VEX
# triage wants as input. govulncheck is a repo-side build input (the
# cargo-fuzz pattern — it has no binary releases and no aqua package,
# so the go: backend builds it from a pinned source version with the
# repo's own pinned toolchain); asserted with the remedy, never
# installed mid-run.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n "${mods}" ]] || { echo "audit:go-vulns: no go.mod tracked, skipped"; exit 0; }
command -v go > /dev/null || {
  echo "audit:go-vulns: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
command -v govulncheck > /dev/null || {
  echo "audit:go-vulns: govulncheck missing — pin it as a build input:" >&2
  echo "  mise.toml: \"go:golang.org/x/vuln/cmd/govulncheck\" = \"<version>\"" >&2
  exit 1
}
while IFS= read -r m; do
  [[ -n "${m}" ]] || continue
  (cd "$(dirname "${m}")" && govulncheck ./...)
done <<< "${mods}"
echo "audit:go-vulns: no reachable vulnerabilities"
'''

[tasks."audit:blast-radius"]
description = "Advisory blast radius over every published SBOM (stele assert — network, canon only)"
dir = "{{cwd}}"
# The L2 triage mechanism at scale: which published releases ship an
# affected package? The walk, the verify-before-trust of every SBOM
# asset, the osv scan, the exact (advisory, package, version) VEX join,
# the canary that proves the scanner can see, and the loud zero-package
# failure mode all live in stele (docs/assert-policy-schema.md there);
# the org's conventions — ecosystem classes, the canary pin, where
# decisions live — are data in slsa/assert-policy.json. Red means NEW
# AND UNDECIDED; a decision matching no finding surfaces as stale, a
# retirement candidate. Guarded on security/vex/ so it runs only in
# the canon checkout.
run = '''
[[ -d security/vex ]] || { echo "audit:blast-radius: no security/vex/, not the canon, skipped"; exit 0; }
command -v osv-scanner > /dev/null || { echo "audit:blast-radius: osv-scanner missing from the belt" >&2; exit 1; }
command -v stele > /dev/null || { echo "audit:blast-radius: stele missing from the belt" >&2; exit 1; }
stele assert blast-radius \
  --org "${BLAST_RADIUS_ORG:-monumental-archive}" \
  --policy slsa/assert-policy.json \
  --vex security/vex
'''

[tasks."audit:attestations"]
description = "Nothing ships unattested: every published artifact carries its full evidence set (network, canon only)"
dir = "{{cwd}}"
# The difference between "we attest" and "nothing ships unattested"
# (#117). The walk — release evidence contracts (manifest-first, the
# publish.yml-at-the-tag adapter for history), store-resident VSAs
# (#209), the continuous-digest and base-approval halves, the
# legacy/debt/burned taxonomy — is stele's evidence walk, specified in
# its docs/assert-policy-schema.md; the org's conventions are data in
# slsa/assert-policy.json and security/attestation-debt.txt. A zero
# population or a missed canary is CANNOT_JUDGE, never PASS: the
# 200-with-empty-body degraded read the 2026-08-17 outage served is
# answered by refusing to judge (stele#69). The store halves verify
# cryptographically, so the trusted root is fetched here — the trust
# boundary is the caller\'s to state (stele#19 tracks in-tool fetch).
run = '''
[[ "${GITHUB_REPOSITORY:-}" == "monumental-archive/.github" || -f slsa/assert-policy.json ]] || {
  echo "audit:attestations: not the canon, skipped"; exit 0
}
command -v gh > /dev/null || { echo "audit:attestations: gh missing" >&2; exit 1; }
command -v stele > /dev/null || { echo "audit:attestations: stele missing from the belt" >&2; exit 1; }
[[ -f slsa/assert-policy.json ]] || { echo "audit:attestations: slsa/assert-policy.json missing" >&2; exit 1; }
stele assert evidence \
  --org monumental-archive \
  --policy slsa/assert-policy.json \
  --depth full \
  --verify-policy slsa/verify-policy.json
'''

[tasks."audit:source-vsa"]
description = "Every protected-ref revision since genesis has a verified chain link (network, canon only)"
dir = "{{cwd}}"
# The source track's coverage audit (#207): the emitter is per-push, so
# a lapse leaves a hole in the chain rather than going red anywhere —
# this is the cadence that finds the holes, the attestation-debt pattern
# for evidence gaps. The whole walk is `stele assert chains` (stele#94):
# the population is the org listing, never the enrolled set (#266); a
# repository with no founded chain is a finding unless a declared
# exception in slsa/assert-policy.json (chains.exceptions) names it
# with a written reason — and an exception excuses absence alone,
# structurally never a founded chain's defect. Each founded chain is
# walked cloneless over the forge's API and verified end to end per
# protected branch through the verify engine, the same binary a
# stranger runs. A zero population is CANNOT_JUDGE, never PASS
# (stele#69). The trusted root resolves through TUF from the anchor
# pinned in the binary; the spec is stele's docs.
run = '''
[[ "${GITHUB_REPOSITORY:-}" == "monumental-archive/.github" || -f slsa/verify-policy.json ]] || {
  echo "audit:source-vsa: not the canon, skipped"; exit 0
}
command -v stele > /dev/null || { echo "audit:source-vsa: stele missing from the belt" >&2; exit 1; }
stele assert chains \
  --org monumental-archive \
  --policy slsa/assert-policy.json \
  --verify-policy slsa/verify-policy.json
'''

[tasks."audit:badges"]
description = "Every README shield re-checked against its source of truth (network, canon only)"
dir = "{{cwd}}"
# A badge is a fact computed by somebody else's service, earned once and
# then trusted forever — exactly the claim shape this org refuses
# everywhere else (#215; audit:attestations is the pattern). This walks
# every org repo's README and, for every shield found, asks the issuer
# whether it still agrees. Loud by construction: an unrecognised shield
# fails (a badge nobody can check is a badge nobody is checking), an
# issuer returning nothing fails (a check that reads nothing must never
# report clean), and a Scorecard shield with no floor line fails. The
# Scorecard leg is a per-repo ratcheted floor (security/
# scorecard-floors.txt) — regression is the signal, never the absolute.
#
# Presence is asserted through the derivation, not re-derived here
# (#316 finding 5): each repo's badge block must be fix:badges' render
# (the markers prove it; lint:badges in that repo's own gate proves the
# render matches its tree), so a shield this walk does not see is one
# the derivation said does not apply — never one nobody looked for.
# .badge-states' declared lines (pending a human step / exemplary, no
# data by construction) are reported by name, so a Monday summary reads
# as state, not as expected-red noise (dependency-track.md:46).
run = '''
[[ "${GITHUB_REPOSITORY:-}" == "monumental-archive/.github" || -f slsa/verify-policy.json ]] || {
  echo "audit:badges: not the canon, skipped"; exit 0
}
command -v gh > /dev/null || { echo "audit:badges: gh missing" >&2; exit 1; }
floors="security/scorecard-floors.txt"
repos=$(gh api "orgs/monumental-archive/repos" --paginate --jq '.[].name')
failed=""
checked=0
note() { echo "audit:badges: ${1}"; [[ -n ${GITHUB_STEP_SUMMARY:-} ]] && echo "- ${1}" >> "${GITHUB_STEP_SUMMARY}" || true; }
while read -r repo; do
  [[ -n "${repo}" ]] || continue
  readme=$(gh api "repos/monumental-archive/${repo}/readme" --jq '.content' 2> /dev/null || true)
  if [[ -z "${readme}" ]]; then
    note "${repo}: no README, nothing asserted"
    continue
  fi
  body=$(base64 -d <<< "${readme}")
  # Adoption is asserted, not assumed (#316 finding 5): the block must
  # be fix:badges' render — the repo's own gate (lint:badges) proves
  # the render matches its tree, so this audit never re-derives; it
  # only needs the markers to exist to know a missing shield means
  # "the derivation said not applicable" rather than "nobody looked".
  if ! grep -q "<!-- badges:begin -->" <<< "${body}"; then
    failed="${failed} ${repo}(badge block not machine-rendered — no badges:begin marker; presence-blindness is only closed where fix:badges owns the block)"
    continue
  fi
  # Declared states: the debt lines the render could not derive.
  states=$(gh api "repos/monumental-archive/${repo}/contents/.badge-states" --jq '.content' 2> /dev/null | base64 -d 2> /dev/null | grep -v "^#" || true)
  while read -r sk sv; do
    [[ -n "${sk}" ]] || continue
    case "${sv}" in
      pending) note "${repo}: ${sk} pending a human step (declared)" ;;
      exemplary) note "${repo}: ${sk} exemplary, no data by construction (declared)" ;;
    esac
  done <<< "${states}"
  # Shields are markdown images; comments are stripped first so a
  # deferred (commented-out) badge line is not audited as live. The
  # strip must handle a comment that opens and closes on ONE line —
  # every marker and every pending line is exactly that shape, and a
  # sed range address cannot end on the line it started on, so the
  # first `<!-- badges:begin -->` used to swallow every shield down to
  # the next `-->`: the walk read 25 live shields org-wide as zero and
  # reported clean. Inline comments are cut in place; only a genuinely
  # unterminated one opens the multi-line state.
  urls=$(awk '{
    while (match($0, /<!--.*-->/)) { $0 = substr($0, 1, RSTART - 1) substr($0, RSTART + RLENGTH) }
    if (inc) { if (sub(/.*-->/, "")) inc = 0; else next }
    if (sub(/<!--.*/, "")) inc = 1
    print
  }' <<< "${body}" | grep -oE '!\[[^]]*\]\([^)]+\)' | sed -E 's/^!\[[^]]*\]\(([^) ]+).*\)$/\1/' || true)
  if [[ -z "${urls}" ]]; then
    # fix:badges renders the three SLSA shields unconditionally, so a
    # rendered block can never be shield-free: empty means the block
    # was truncated or the strip ate it, never "nothing applies".
    failed="${failed} ${repo}(badge block rendered no shields — the derivation always emits the SLSA row, so this block is truncated or unparsable)"
    continue
  fi
  while read -r url; do
    [[ -n "${url}" ]] || continue
    checked=$((checked + 1))
    case "${url}" in
      https://api.scorecard.dev/projects/github.com/monumental-archive/*/badge)
        proj="${url#https://api.scorecard.dev/projects/}"
        proj="${proj%/badge}"
        score=$(curl -sf "https://api.scorecard.dev/projects/${proj}" | jq -r '.score // empty')
        if [[ -z "${score}" ]]; then
          failed="${failed} ${repo}(scorecard: issuer returned no score — a shield over nothing)"
          continue
        fi
        floor=$(awk -v r="${repo}" '$1 == r {print $2}' "${floors}")
        if [[ -z "${floor}" ]]; then
          failed="${failed} ${repo}(scorecard: no floor in ${floors} — an unfloored badge is unwatched)"
        elif awk -v s="${score}" -v f="${floor}" 'BEGIN {exit !(s < f)}'; then
          failed="${failed} ${repo}(scorecard: ${score} below floor ${floor} — regression)"
        elif awk -v s="${score}" -v f="${floor}" 'BEGIN {exit !(s >= f + 0.3)}'; then
          note "${repo}: scorecard ${score} well above floor ${floor} — ratchet: raise the floor"
        else
          note "${repo}: scorecard ${score} (floor ${floor})"
        fi
        ;;
      https://www.bestpractices.dev/projects/*/badge | https://bestpractices.dev/projects/*/badge)
        id="${url##*/projects/}"
        id="${id%/badge}"
        bp=$(curl -sf "https://www.bestpractices.dev/projects/${id}.json" || true)
        if [[ -z "${bp}" ]]; then
          failed="${failed} ${repo}(bestpractices: issuer returned nothing for project ${id})"
        elif ! jq -e '(.badge_percentage_0 // 0) >= 100' <<< "${bp}" > /dev/null; then
          failed="${failed} ${repo}(bestpractices: passing percentage below 100)"
        elif jq -e '[.lost_baseline_1_at, .lost_baseline_2_at, .lost_baseline_3_at] | any(. != null)' <<< "${bp}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(bestpractices: issuer records a LOST baseline)"
        else
          note "${repo}: bestpractices ${id} passing"
        fi
        ;;
      https://www.bestpractices.dev/projects/*/baseline | https://bestpractices.dev/projects/*/baseline)
        # The OSPS Baseline shield on the same entry. Its own truth is
        # the achieved/lost pair, not the metal percentage: a shield
        # claiming a level the issuer never recorded, or one it has
        # since withdrawn, is the drift #168 watches for.
        id="${url##*/projects/}"
        id="${id%/baseline}"
        bp=$(curl -sf "https://www.bestpractices.dev/projects/${id}.json" || true)
        if [[ -z "${bp}" ]]; then
          failed="${failed} ${repo}(baseline: issuer returned nothing for project ${id})"
        elif ! jq -e '[.achieved_baseline_1_at, .achieved_baseline_2_at, .achieved_baseline_3_at] | any(. != null)' <<< "${bp}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(baseline: shield worn but the issuer records no achieved level)"
        elif jq -e '[.lost_baseline_1_at, .lost_baseline_2_at, .lost_baseline_3_at] | any(. != null)' <<< "${bp}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(baseline: issuer records a LOST level)"
        else
          lvl=$(jq -r '[.achieved_baseline_3_at, .achieved_baseline_2_at, .achieved_baseline_1_at] | map(. != null) | index(true) | if . == 0 then 3 elif . == 1 then 2 else 1 end' <<< "${bp}")
          note "${repo}: OSPS Baseline level ${lvl} achieved"
        fi
        ;;
      https://api.reuse.software/badge/*)
        proj="${url#https://api.reuse.software/badge/}"
        st=$(curl -sf "https://api.reuse.software/status/${proj}" | jq -r '.status // empty')
        if [[ "${st}" != "compliant" ]]; then
          failed="${failed} ${repo}(reuse: status '${st:-none}' is not compliant)"
        else
          note "${repo}: reuse compliant"
        fi
        ;;
      https://img.shields.io/endpoint?url=*)
        # A measured claim (#540, stele#5's endpoint addendum): the
        # badge is a render of the judgment `stele level` published,
        # so there is no value here to cross-check — the only thing
        # this leg can honestly ask is whether the published document
        # is live and shield-shaped. Level truth is the cron's
        # (level-publish.yml); a stale or missing document is the
        # finding, never a number disagreeing with a table.
        doc="${url#https://img.shields.io/endpoint?url=}"
        doc="${doc//%3A/:}"
        doc="${doc//%2F//}"
        sj=$(curl -sf "${doc}" || true)
        if [[ -z "${sj}" ]]; then
          failed="${failed} ${repo}(level-shield: published judgment ${doc} unreadable — the badge renders nothing)"
        elif ! jq -e '.schemaVersion == 1 and .label and .message' > /dev/null 2>&1 <<< "${sj}"; then
          failed="${failed} ${repo}(level-shield: ${doc} is not a shields endpoint document)"
        else
          note "${repo}: level shield $(jq -r '.label + " " + .message' <<< "${sj}") published and live"
        fi
        ;;
      https://github.com/monumental-archive/*/actions/workflows/*/badge.svg)
        wfp="${url#https://github.com/monumental-archive/}"
        wfr="${wfp%%/*}"
        wfn="${wfp##*/workflows/}"
        wfn="${wfn%/badge.svg}"
        # A badge.svg with no ?branch= renders the DEFAULT branch's
        # status, so the leg must ask the same question: an unfiltered
        # run query answers "newest run on any branch", which makes a
        # red PR-branch run read as a lying shield while the shield is
        # honestly green (observed on signer during #354, latent since
        # #322). Default branch read from the API, never assumed main.
        wfb=$(gh api "repos/monumental-archive/${wfr}" --jq '.default_branch // empty' 2> /dev/null || true)
        if [[ -z "${wfb}" ]]; then
          failed="${failed} ${repo}(workflow-shield: could not read ${wfr}'s default branch)"
          continue
        fi
        conc=$(gh api "repos/monumental-archive/${wfr}/actions/workflows/${wfn}/runs?per_page=1&status=completed&branch=${wfb}" \
          --jq '.workflow_runs[0].conclusion // empty' 2> /dev/null || true)
        if [[ -z "${conc}" ]]; then
          failed="${failed} ${repo}(workflow-shield: ${wfn} has no completed runs on ${wfb} — a status badge over nothing)"
        elif [[ "${conc}" != "success" ]]; then
          failed="${failed} ${repo}(workflow-shield: ${wfn} latest completed run on ${wfb} is ${conc})"
        else
          note "${repo}: workflow ${wfn} green on ${wfb}"
        fi
        ;;
      https://img.shields.io/badge/fair--software.eu-*)
        # Computed by fix:badges dot-by-dot; this leg re-checks the
        # three contingent dots against what the same README shows —
        # registry (dot 3: any registry shield), citation (dot 4:
        # CITATION.cff), checklist (dot 5: a live bestpractices
        # shield). A static 5/5 image fails here (#316 addendum E).
        dots="${url#*fair--software.eu-}"
        dots="${dots%-*}"
        e3="%E2%97%8B"; grep -qE 'img.shields.io/(crates|npm)/|img.shields.io/badge/ghcr' <<< "${urls}" && e3="%E2%97%8F"
        e4="%E2%97%8B"; gh api "repos/monumental-archive/${repo}/contents/CITATION.cff" > /dev/null 2>&1 && e4="%E2%97%8F"
        e5="%E2%97%8B"; grep -q 'bestpractices.dev/projects/' <<< "${urls}" && e5="%E2%97%8F"
        expect="%E2%97%8F%20%E2%97%8F%20${e3}%20${e4}%20${e5}"
        if [[ "${dots}" != "${expect}" ]]; then
          failed="${failed} ${repo}(fair-software: dots ${dots} disagree with the repo's own evidence ${expect})"
        else
          note "${repo}: fair-software dots agree with the evidence"
        fi
        ;;
      https://zenodo.org/badge/DOI/*)
        doi="${url#https://zenodo.org/badge/DOI/}"
        doi="${doi%.svg}"
        if ! curl -sfI "https://doi.org/${doi}" > /dev/null; then
          failed="${failed} ${repo}(doi: ${doi} does not resolve)"
        else
          note "${repo}: DOI resolves"
        fi
        ;;
      https://img.shields.io/crates/v/* | https://img.shields.io/docsrs/*)
        crate="${url##*/}"
        crate="${crate%.svg}"
        if ! curl -sf "https://crates.io/api/v1/crates/${crate}" > /dev/null; then
          failed="${failed} ${repo}(crates: ${crate} not on crates.io)"
        else
          note "${repo}: crate ${crate} exists"
        fi
        ;;
      https://img.shields.io/npm/v/*)
        pkg="${url#https://img.shields.io/npm/v/}"
        pkg="${pkg%.svg}"
        if ! curl -sf "https://registry.npmjs.org/${pkg//%2F//}" > /dev/null; then
          failed="${failed} ${repo}(npm: package not on the registry)"
        else
          note "${repo}: npm package exists"
        fi
        ;;
      https://img.shields.io/badge/ghcr.io-monumental--archive%2F*)
        # The shield names an image; ask GitHub whether that package
        # exists. The old leg HEAD-requested the org packages page,
        # which returns 200 for ANY org that exists — a check that
        # reads nothing (#316 addendum C). The anonymous REST endpoint
        # 401s even for public containers, so this goes through gh;
        # the cron token carries packages: read for it.
        img="${url#https://img.shields.io/badge/ghcr.io-monumental--archive%2F}"
        img="${img%%-blue*}"
        img="${img//--/-}"
        if ! gh api "orgs/monumental-archive/packages/container/${img}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(ghcr: package '${img}' does not exist in the org registry)"
        else
          note "${repo}: ghcr package ${img} exists"
        fi
        ;;
      https://codecov.io/gh/monumental-archive/*/graph/badge.svg | https://codecov.io/gh/monumental-archive/*/branch/*/graph/badge.svg)
        cc="${url#https://codecov.io/gh/monumental-archive/}"
        cc="${cc%%/*}"
        if curl -sf "https://api.codecov.io/api/v2/github/monumental-archive/repos/${cc}" | jq -e '.name' > /dev/null 2>&1; then
          note "${repo}: codecov live"
        else
          failed="${failed} ${repo}(codecov: issuer has no data for ${cc} and no declared state covers it)"
        fi
        ;;
      *)
        # Not silently skipped, by design: silently skipping reproduces
        # the exact gap this audit closes.
        failed="${failed} ${repo}(unrecognised shield — nobody is checking it: ${url})"
        ;;
    esac
  done <<< "${urls}"
done <<< "${repos}"
if [[ -n "${failed}" ]]; then
  echo "audit:badges: shield defects:${failed}" >&2
  echo "  every shield must agree with its source of truth; fix the fact, the floor, or the badge" >&2
  exit 1
fi
# The same law the legs enforce, applied to the walk itself: a check
# that read nothing must never report clean. The canon alone renders
# three SLSA shields, so zero here is always a broken walk, never a
# quiet org.
if (( checked == 0 )); then
  echo "audit:badges: walked the org and checked zero shields — the walk is broken, not the org" >&2
  exit 1
fi
echo "audit:badges: ${checked} shield(s) checked, all agree with their issuers"
'''

[tasks."audit:links"]
description = "Check links in tracked markdown (lychee — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: link liveness is a property of the internet, not the
# diff. Runs on demand locally and on a schedule in CI (step-3 workflow).
# Scaffold files carry deliberate placeholders a new repo fills in
# (<repo>, BP_ID, CONCEPT_DOI — README-badges.md above all); lychee
# resolves them to real requests and 404s. Excluded by exact token, not
# by skipping scaffold files wholesale: the scaffold's REAL links still
# deserve the check.
# --include-fragments: without it lychee verifies that a page exists and
# never that the `#anchor` on the end of the link points at anything, so
# every deep link into a heading was half-checked (#82 max audit). A
# renamed heading is the common way a link rots while still returning
# 200. Enabled at zero cost — measured on this tree at adoption, it adds
# no findings.
run = 'files=$(git ls-files ":!vendor/**" "*.md" "*.markdown"); if [[ -n "${files}" ]]; then xargs lychee --no-progress --include-fragments --exclude "%3Crepo%3E|BP_ID|CONCEPT_DOI" <<<"${files}"; else echo "audit:links: no markdown tracked, skipped"; fi'

[tasks."audit:actions"]
description = "zizmor online + auditor persona — the audits the gate cannot run"
dir = "{{cwd}}"
# The gate runs zizmor --offline, which necessarily skips every audit that
# needs the GitHub API: impostor-commit, known-vulnerable-actions,
# ref-confusion, typosquat-uses, stale-action-refs. Those are exactly the
# checks that catch a compromised or impersonated action, so they run here
# on a schedule instead of nowhere. Auditor persona adds secrets-outside-env
# and misfeature. Needs GH_TOKEN.
#
# FAIL CLOSED ON BLINDNESS (#310 finding 3, the claims.sh/#240 pattern):
# without a token zizmor silently degrades to offline — skipping every
# audit this task exists to run — and still prints "No findings to
# report" with exit 0, distinguishable only by a non-fatal WARN
# (measured on zizmor 1.29.0). So the token is asserted up front, and
# the offline-degradation WARN is fatal — a token that is present but
# rejected degrades the same way, and only zizmor knows.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "audit:actions: no workflows, skipped"; exit 0
}
[[ -n "${GH_TOKEN:-}" ]] || {
  echo "audit:actions: GH_TOKEN is unset — the offline run skips every" >&2
  echo "  API-backed audit this task exists for; refusing to pass blind" >&2
  exit 1
}
err=$(mktemp)
status=0
zizmor --persona=auditor .github/workflows/ 2> "${err}" || status=$?
cat "${err}" >&2
if grep -q "running in offline mode" "${err}"; then
  echo "audit:actions: zizmor degraded to offline despite GH_TOKEN —" >&2
  echo "  the online audits did not run; a green result would be blind" >&2
  exit 1
fi
exit "${status}"
'''

[tasks."audit:template-pins"]
description = "Warn when the template pin misses shipped canon changes (scheduled, not the gate)"
dir = "{{cwd}}"
# The judgement call lint:template-pins deliberately leaves out, measured
# by the right yardstick. Days-behind is a proxy — the #110 incident was a
# ONE-day lag that already predated three shipped fixes, so no day
# threshold catches it. What makes a stale pin dangerous is commits between
# the pin and HEAD touching what the pin actually delivers: the shared
# workflows and the toolbelt (one SHA pins both). Diff those paths; HEAD
# moving on docs, rulesets or the profile README is not staleness worth a
# bump. audit:*, not lint:*: pin-vs-HEAD drift is a property of time
# passing on main, not of the diff under review.
run = '''
compgen -G "workflow-templates/*.y*ml" > /dev/null || {
  echo "audit:template-pins: no workflow-templates/, skipped"; exit 0
}
sha=$(grep -hoE "uses:[[:space:]]*monumental-archive/\.github/[^@]+@[0-9a-f]{40}" \
  workflow-templates/*.y*ml | grep -oE "[0-9a-f]{40}" | sort -u)
[[ -n "${sha}" ]] || { echo "audit:template-pins: no org pins in templates, skipped"; exit 0; }
if [[ "$(wc -l <<< "${sha}" | tr -d " ")" -gt 1 ]]; then
  echo "audit:template-pins: templates pin more than one SHA (lint:template-pins should have failed)" >&2
  exit 1
fi
if ! git cat-file -e "${sha}^{commit}" 2> /dev/null; then
  echo "audit:template-pins: pinned SHA ${sha:0:8} not in local history (shallow clone?)" >&2
  exit 1
fi
drift=$(git diff --name-only "${sha}..HEAD" -- .github/workflows/ mise/)
if [[ -n "${drift}" ]]; then
  # The post-release window (#290 finding 4, same shape as
  # audit:canon-pins): a release commit cannot pin itself (#227), so
  # right after a release the templates lawfully sit behind until
  # Renovate's chore(canon) bump lands. The grace is measured as
  # STALENESS DURATION, not releases-behind (#310 finding 1): the alarm
  # is "this pin has been catchable for over a day and nothing caught
  # it", so the clock starts at the EARLIEST tag newer than the pin — a
  # burst of releases inside one bot cycle is one short staleness, not
  # a multi-release alarm, while a week-old lag stays red no matter how
  # recent the newest tag is. All local: tags and dates are in the clone.
  pin_tag=$(git tag --points-at "${sha}" --list "v[0-9]*" | head -1)
  succ_tag=$(git tag --list "v[0-9]*" | sort -V \
    | awk -v p="${pin_tag}" '$0 == p { getline; print; exit }')
  if [[ -n "${pin_tag}" && -n "${succ_tag}" ]]; then
    age=$(($(date -u +%s) - $(git log -1 --format=%ct "${succ_tag}")))
    if [[ "${age}" -lt 86400 ]]; then
      echo "audit:template-pins: post-release window — pin at ${pin_tag}, stale for $((age / 3600))h (since ${succ_tag})"
      echo "  the lag is structural (#227); Renovate's chore(canon) bump"
      echo "  closes it. Red only past the 24h grace (#290, #310)."
      exit 0
    fi
  fi
  echo "audit:template-pins: pin ${sha:0:8} misses shipped canon changes:" >&2
  git log --no-decorate --oneline "${sha}..HEAD" -- .github/workflows/ mise/ | sed "s/^/  /" >&2
  echo "  a repo standing up from the templates would not get these —" >&2
  echo "  bump the template pins to current canon (see #110, #111)." >&2
  exit 1
fi
echo "audit:template-pins: pin ${sha:0:8} carries all shipped workflow and belt changes"
'''

[tasks."audit:canon-pins"]
description = "Warn when any canon reference lags the canon's latest tag (scheduled, not the gate)"
dir = "{{cwd}}"
# The alarm on the mechanism: Renovate bumps canon references (#133), and
# when Renovate is paused, misconfigured or dead, nothing else goes red —
# the v0.16.1 release shipped without its VSA off a three-merge-stale pin
# with every board green. lint:canon-pins proves the references are
# bumpable (shape, offline); this compares each claimed version against
# the canon's latest tag. Network-bound and time-dependent, so audit:*,
# never the gate.
#
# THE POST-RELEASE WINDOW IS EXPECTED, NOT MALFUNCTION (#290 finding 4).
# A commit cannot contain its own release SHA (#227), so every canon
# release vN structurally ships self-references at vN-1, and consumers
# sit at vN-1 until Renovate's chore(canon) bump lands — which the notes
# deliberately skips, so the bump never triggers a release of its own.
#
# THE GRACE IS STALENESS DURATION, NOT RELEASES-BEHIND (#310 finding 1).
# Releases-behind is a proxy, the same mistake audit:template-pins names
# for days-behind: three canon releases cut in 73 minutes made a healthy
# consumer "three behind" for under an hour — hosted Renovate polls
# roughly hourly, and no reference can move faster than the next poll —
# while a pin one release behind for a week is the real v0.16.1 failure.
# So the alarm is on TIME SPENT CATCHABLE: the clock starts at the
# EARLIEST tag newer than the stale reference, and only past 24 hours is
# the state red. The 24-hour ceiling is generous by design — with
# prPriority and the first-party group (default.json) the bump lands in
# one bot cycle plus CI, measured 10-30 minutes — and exists so a Monday
# cron landing just after a Sunday release does not cry wolf. Red means
# Renovate paused, misconfigured or dead.
run = '''
tags=$(git ls-remote --tags https://github.com/monumental-archive/.github "v[0-9]*" \
  | sed -n "s|.*refs/tags/\(v[0-9][0-9.]*\)$|\1|p" | sort -V)
latest=$(tail -1 <<< "${tags}")
[[ -n "${latest}" ]] || { echo "audit:canon-pins: canon has no tags, skipped"; exit 0; }
stale=""
found=0
claims=$(git ls-files ':!vendor/**' "*.yml" "*.yaml" | while IFS= read -r f; do
  grep -hE "^[^#]*uses:[[:space:]]*monumental-archive/\.github/" "${f}" \
    | grep -oE "# v[0-9][0-9.]*" | sed "s|# |${f}:|"
  if grep -qF "github.com/monumental-archive/.github" "${f}"; then
    grep -E "^[[:space:]]*ref:[[:space:]]*v[0-9]" "${f}" \
      | grep -oE "v[0-9][0-9.]*" | sed "s|^|${f}:|"
  fi
done; git ls-files ':!vendor/**' "renovate.json" "*/renovate.json" ".github/renovate.json" \
  | while IFS= read -r f; do
  grep -oE "github>monumental-archive/\.github#v[0-9][0-9.]*" "${f}" \
    | sed "s|.*#|${f}:|"
done)
while IFS= read -r claim; do
  [[ -n "${claim}" ]] || continue
  found=$((found + 1))
  v="${claim##*:}"
  [[ "${v}" != "${latest}" ]] && stale="${stale} ${claim}"
done <<< "${claims}"
[[ ${found} -gt 0 ]] || { echo "audit:canon-pins: no canon references, skipped"; exit 0; }
if [[ -n "${stale}" ]]; then
  # Staleness duration per distinct stale version: the age of the
  # EARLIEST tag newer than it, via the API (public repo; unauthenticated
  # works) — the date arithmetic lives in jq because ISO parsing in bash
  # is not portable between GNU and BSD date. An unlookupable age fails
  # closed: unknown staleness is not fresh.
  # Unknown and stale are BOTH red, but they are different reds, and the
  # message must never assert a measurement that did not happen: this
  # leg once printed "over 24h" for a release 23 minutes old because the
  # age lookup had failed, not because any clock had run (#349 finding
  # 11). A finding's evidence is the read that produced it.
  red=0
  unmeasured=""
  oldest=0
  for v in $(tr " " "\n" <<< "${stale}" | sed "s|.*:||" | sort -uV); do
    [[ -n "${v}" ]] || continue
    succ=$(awk -v p="${v}" '$0 == p { getline; print; exit }' <<< "${tags}")
    [[ -n "${succ}" ]] || { unmeasured="${unmeasured} ${v}(no successor tag resolved)"; continue; }
    age=$(gh api "repos/monumental-archive/.github/commits/${succ}" \
      --jq '((now - (.commit.committer.date | fromdateiso8601)) | floor)' \
      2> /dev/null || true)
    [[ "${age}" =~ ^[0-9]+$ ]] || { unmeasured="${unmeasured} ${v}(age lookup failed: repos/monumental-archive/.github/commits/${succ})"; continue; }
    [[ "${age}" -ge 86400 ]] && red=1
    [[ "${age}" -gt "${oldest}" ]] && oldest="${age}"
  done
  if [[ ${red} -eq 0 && -z "${unmeasured}" ]]; then
    echo "audit:canon-pins: post-release window — canon at ${latest}, references stale for $((oldest / 3600))h:${stale}"
    echo "  the lag is structural (#227): a commit cannot contain its own"
    echo "  release SHA, and Renovate's chore(canon) bump closes it in one"
    echo "  bot cycle. Red only past the 24h grace (#290, #310)."
    exit 0
  fi
  if [[ ${red} -eq 1 ]]; then
    echo "audit:canon-pins: references behind canon ${latest}, MEASURED over the 24h grace (oldest $((oldest / 3600))h):${stale}" >&2
    echo "  Outside the post-release grace — Renovate should have bumped" >&2
    echo "  these within one bot cycle. Check the Renovate dashboard and" >&2
    echo "  default.json's first-party rules before bumping by hand" >&2
    echo "  (#133, #290, #310)." >&2
  fi
  if [[ -n "${unmeasured}" ]]; then
    echo "audit:canon-pins: staleness age UNKNOWN — the lookup failed, no duration was measured:${unmeasured}" >&2
    echo "  Unknown staleness is not fresh (fail closed), but it is not" >&2
    echo "  'over 24h' either — fix the read (GH_TOKEN present? API up?)" >&2
    echo "  and re-run before concluding anything about Renovate (#349 f11)." >&2
  fi
  exit 1
fi
echo "audit:canon-pins: ${found} canon references, all at ${latest}"
'''

[tasks."audit:org-pins"]
description = "Every org repo's canon references, checked from the canon (network, canon only)"
dir = "{{cwd}}"
# The vantage half of #310 finding 1: audit:canon-pins checks the repo
# it runs in, so a lagging consumer only reddens an audit inside that
# consumer — the signer sat three releases behind with the canon's own
# Monday audit green, because the canon checked only itself. This is
# the org-wide alarm, run where someone looks: enumerate the POPULATION
# (the #266 / repo-baseline pattern — a token that sees fewer repos
# than the org holds is a red run, not a quieter one), shallow-clone
# each repo, extract its canon references with exactly audit:canon-pins'
# patterns, and apply the same staleness-duration grace. A repo with no
# canon references at all is a finding too: every org repo pins the
# canon by construction (scaffold/), so zero references means the
# extraction — or the repo — is broken.
run = '''
[[ "${GITHUB_REPOSITORY:-}" == "monumental-archive/.github" || -f slsa/verify-policy.json ]] || {
  echo "audit:org-pins: not the canon, skipped"; exit 0
}
command -v gh > /dev/null || { echo "audit:org-pins: gh missing" >&2; exit 1; }
tags=$(git ls-remote --tags https://github.com/monumental-archive/.github "v[0-9]*" \
  | sed -n "s|.*refs/tags/\(v[0-9][0-9.]*\)$|\1|p" | sort -V)
latest=$(tail -1 <<< "${tags}")
[[ -n "${latest}" ]] || { echo "audit:org-pins: canon has no tags, skipped"; exit 0; }
repos=$(gh api "orgs/monumental-archive/repos" --paginate --jq '.[].name')
expected_repos=4
seen_repos=$(wc -w <<< "${repos}" | tr -d " ")
if [[ "${seen_repos}" -ne "${expected_repos}" ]]; then
  echo "audit:org-pins: token sees ${seen_repos} repos, population is ${expected_repos} —" >&2
  echo "  an unseen repo is unchecked, not clean (#290 finding 7)." >&2
  exit 1
fi
total=0
stale=""
failed=""
for repo in ${repos}; do
  dir=$(mktemp -d)
  git clone -q --depth 1 "https://github.com/monumental-archive/${repo}.git" "${dir}" || {
    failed="${failed} ${repo}(clone)"; continue
  }
  claims=$(cd "${dir}" && git ls-files ':!vendor/**' "*.yml" "*.yaml" | while IFS= read -r f; do
    grep -hE "^[^#]*uses:[[:space:]]*monumental-archive/\.github/" "${f}" \
      | grep -oE "# v[0-9][0-9.]*" | sed "s|# |${repo}/${f}:|"
    if grep -qF "github.com/monumental-archive/.github" "${f}"; then
      grep -E "^[[:space:]]*ref:[[:space:]]*v[0-9]" "${f}" \
        | grep -oE "v[0-9][0-9.]*" | sed "s|^|${repo}/${f}:|"
    fi
  done; cd "${dir}" && git ls-files ':!vendor/**' "renovate.json" "*/renovate.json" ".github/renovate.json" \
    | while IFS= read -r f; do
    grep -oE "github>monumental-archive/\.github#v[0-9][0-9.]*" "${f}" \
      | sed "s|.*#|${repo}/${f}:|"
  done)
  count=$(grep -c . <<< "${claims}" || true)
  if [[ "${count}" -eq 0 ]]; then
    failed="${failed} ${repo}(no canon references)"
    continue
  fi
  total=$((total + count))
  while IFS= read -r claim; do
    [[ -n "${claim}" ]] || continue
    v="${claim##*:}"
    [[ "${v}" != "${latest}" ]] && stale="${stale} ${claim}"
  done <<< "${claims}"
done
if [[ -n "${failed}" ]]; then
  echo "audit:org-pins: repos that could not be checked:${failed}" >&2
  exit 1
fi
if [[ -n "${stale}" ]]; then
  # Same staleness-duration grace as audit:canon-pins (#310 finding 1):
  # the clock starts at the earliest tag newer than the stale reference;
  # red only past 24h. Unknown age fails closed.
  red=0
  oldest=0
  for v in $(tr " " "\n" <<< "${stale}" | sed "s|.*:||" | sort -uV); do
    [[ -n "${v}" ]] || continue
    succ=$(awk -v p="${v}" '$0 == p { getline; print; exit }' <<< "${tags}")
    [[ -n "${succ}" ]] || { red=1; continue; }
    age=$(gh api "repos/monumental-archive/.github/commits/${succ}" \
      --jq '((now - (.commit.committer.date | fromdateiso8601)) | floor)' \
      2> /dev/null || true)
    [[ "${age}" =~ ^[0-9]+$ ]] || { red=1; continue; }
    [[ "${age}" -ge 86400 ]] && red=1
    [[ "${age}" -gt "${oldest}" ]] && oldest="${age}"
  done
  if [[ ${red} -eq 0 ]]; then
    echo "audit:org-pins: post-release window — canon at ${latest}, ${total} references across ${seen_repos} repos, stale for $((oldest / 3600))h:${stale}"
    echo "  hosted Renovate polls roughly hourly; the bump lands in one bot"
    echo "  cycle (#227, #310). Red only past the 24h grace."
    exit 0
  fi
  echo "audit:org-pins: references behind canon ${latest} for over 24h:${stale}" >&2
  echo "  Renovate should have bumped these within one bot cycle — check" >&2
  echo "  that repo's Renovate dashboard and default.json's first-party" >&2
  echo "  rules before bumping by hand (#133, #290, #310)." >&2
  exit 1
fi
echo "audit:org-pins: ${total} canon references across ${seen_repos} repos, all at ${latest}"
'''

[tasks."audit:biome-rules"]
description = "Warn when biome ships nursery rules the org config does not name (scheduled, not the gate)"
dir = "{{cwd}}"
# The one direction the enable-list in mise/biome-org.json is fail-open.
# `preset: "all"` covers biome's eight stable groups and NOT nursery, and
# no bulk switch exists — naming each rule is the only mechanism biome
# offers (#445). Removals and renames are already fail-closed: biome
# hard-errors on an unknown key, so a graduated rule reddens the gate.
# An ADDED rule is the silent case, and this is its alarm.
#
# The rule list is not derivable offline: the binary ships no schema and
# `biome explain` answers one name at a time. So the pinned version's
# published schema is fetched — network, therefore audit:*, never the
# gate. Guarded on the config, so it skips clean in every repo but canon.
run = '''
cfg="${ORG_BELT_DIR}/biome-org.json"
[[ -f "${cfg}" ]] || { echo "audit:biome-rules: no belt biome config, skipped"; exit 0; }
version=$(biome --version | awk '{print $2}')
[[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
  echo "audit:biome-rules: cannot read a version from \`biome --version\`, skipped"; exit 0; }
schema=$(mktemp)
curl -sfL "https://biomejs.dev/schemas/${version}/schema.json" -o "${schema}" || {
  echo "audit:biome-rules: schema for ${version} unreachable, skipped"; exit 0; }
upstream=$(jq -r '(.["$defs"] // .definitions).Nursery.properties | keys[]
  | select(. != "recommended" and . != "preset")' "${schema}" | sort)
named=$(jq -r '.linter.rules.nursery // {} | keys[]' "${cfg}" | sort)
missing=$(comm -23 <(echo "${upstream}") <(echo "${named}"))
if [[ -n "${missing}" ]]; then
  echo "audit:biome-rules: biome ${version} has nursery rules the org config does not name:" >&2
  sed 's/^/  /' <<<"${missing}" >&2
  echo "  add them to mise/biome-org.json — an unnamed nursery rule is simply not enforced" >&2
  exit 1
fi
echo "audit:biome-rules: all $(wc -l <<<"${upstream}" | tr -d ' ') nursery rules of ${version} are named"
'''

[tasks."lint:trivy"]
description = "Misconfiguration + committed-secret scan (trivy)"
dir = "{{cwd}}"
# Deterministic scanners only: misconfig and secrets are properties of the
# diff. Vulnerability scanning is deliberately absent from the gate — it is
# non-deterministic CI (a new CVE fails unrelated PRs) and already enforced
# org-wide via Dependabot alerts/security updates + Renovate.
# The license scanner is off for a different reason, recorded because its
# absence otherwise reads as an oversight (#82 max audit): licences are
# already answered twice on the belt — lint:reuse runs the tool the
# api.reuse.software badge runs, over tracked files, and cargo-deny's
# licenses half decides the Rust closure from the lock. Trivy would be a
# third opinion on a question two checks already answer, and a heuristic
# one: it infers from package metadata and file text, where REUSE is
# declarative. One winner per rule family, so the family already has two
# and does not need a third.
# --exit-code 1: trivy exits 0 on findings by default.
# Tracked files only, like every belt linter — but trivy has no file-list
# mode, so the tracked set is materialised into a scratch tree and the
# walker runs there. Walking the working tree directly broke twice: the
# checked-out canon toolbelt (.org-toolbelt, the lefthook-remotes trap in
# a new costume) and — because ci runs lint:* and test concurrently — a
# race against cargo rewriting target/, which failed release-lab's gate
# on files that vanished mid-walk (#316 finding 4). The scratch tree
# holds only committed paths, so neither class of untracked content can
# ever be seen. --skip-dirs is gone because there is nothing to skip.
run = '''
scratch=$(mktemp -d)
trap 'rm -rf "${scratch}"' EXIT
# rsync, not cpio: BSD cpio refuses to extract through tracked
# symlinks (the canon's self-* workflow links), GNU cpio does not —
# rsync -l recreates them identically on both.
git ls-files -z | rsync -a0 --files-from=- . "${scratch}"
trivy fs --scanners misconfig,secret --exit-code 1 "${scratch}"
'''

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows (actionlint)"
# {{cwd}}: global-layer tasks otherwise run from the config root (~ locally)
dir = "{{cwd}}"
# actionlint calls shellcheck with --norc, so rc files are ignored; the env
# var is the only way to raise shellcheck to max (all optional checks on).
env = { SHELLCHECK_OPTS = "--enable=all" }
# Guard: actionlint exits 3 when a repo has no workflow YAML (including an
# existing-but-empty workflows directory).
# The -ignore is a documented exception in the capability-boundary
# spirit: GitHub's `$/` self-repository syntax (shipped 2026-07-30, the
# canon's only sanctioned way to reach its own tree — #165) postdates
# actionlint 1.7.12, the newest release. Remove the flag when
# rhysd/actionlint#711 lands. The regex is anchored to the `$/` prefix
# so every other malformed `uses:` still goes red.
run = 'if compgen -G ".github/workflows/*.y*ml" > /dev/null; then actionlint -color -ignore "specifying action \"\\$/" ; else echo "lint:actions: no workflows, skipped"; fi'

[tasks."release:preview"]
description = "What the next release would be (stele derive — read-only, not in ci)"
dir = "{{cwd}}"
# The same pinned binary the shared release workflow runs, answering
# locally: the version decision with its reasoning lines. Guarded: repos
# without a release stub (the continuous archetype, this repo) skip
# clean.
run = 'if [[ -f .github/workflows/release.yml ]]; then stele derive version --git-dir .; else echo "release:preview: no release.yml, skipped"; fi'

[tasks."lint:version-mirrors"]
description = "Every version mirror carries the released version (stele derive bump --check)"
dir = "{{cwd}}"
# The drift gate between releases (stele#102, #514): version mirrors —
# the workspace version, internal path-dependency constraints,
# CITATION.cff — are derived state, and one found not carrying the
# last released version is refused BY NAME at the PR that drifted it,
# never repaired in passing and never discovered at the next release.
# Every state is the tool's own stated outcome, none of them this
# task's opinion: check=ok, check=agreement-only (pre-first-release),
# check=no-mirrors (tag-only repos), and check=pending — mirrors
# carrying exactly the version the range derives, which is the
# release being cut on the Release PR branch or on the merged
# release commit before phase 2 mints its tag (stele#115). This body
# briefly carried two context guards for that last state, keyed on
# branch name and on commit subject; both are retired, because a
# gate that pattern-matches prose to decide whether to run is a
# second source of truth about a fact the derivation already holds.
run = '''
[[ -f .github/workflows/release.yml ]] || { echo "lint:version-mirrors: no release.yml, not a versioned repo, skipped"; exit 0; }
command -v stele > /dev/null || { echo "lint:version-mirrors: stele missing from the belt" >&2; exit 1; }
stele derive bump --git-dir . --check
'''

[tasks."lint:gate-stub"]
description = "A gate stub's trigger set must be closed over the gate's inputs (#427)"
dir = "{{cwd}}"
# The squash-subject check reads the PR title, and the merge targets the
# base — both change only on `edited`, which the default pull_request
# types omit, so a caller on defaults holds stale verdicts (#427). The
# trigger lives in each caller's stub where the shared workflow cannot
# reach it, and Renovate manages the stub's pin, never its YAML — so
# this lint is the fan-out: it rides the pin bump Renovate does deliver
# and turns a stale stub red in that repo's own gate, fix in the
# message. Deterministic — parses tracked files only — so gate-eligible.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:gate-stub: no workflows, skipped"; exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  grep -qE "uses:[[:space:]]*(monumental-archive/\.github/|\./)\.github/workflows/ci\.ya?ml" "${f}" || continue
  grep -qE "^[[:space:]]*pull_request" "${f}" || continue
  grep -qE "^[[:space:]]*-[[:space:]]*edited|types:[^#]*\bedited\b" "${f}" || bad="${bad} ${f}"
done
if [[ -n "${bad}" ]]; then
  echo "lint:gate-stub: gate caller's pull_request trigger lacks the edited type," >&2
  echo "  so title/base edits keep a stale verdict (#427). Set" >&2
  echo "  types: [opened, synchronize, reopened, edited] in:${bad}" >&2
  exit 1
fi
echo "lint:gate-stub: ok"
'''

[tasks."lint:capability-boundary"]
description = "No caller-code workflow may hold a signing identity (SLSA L3 boundary)"
dir = "{{cwd}}"
# The org's L3 boundary, made mechanical. A job holding `id-token: write`
# must not also execute caller-supplied code, or a certificate bearing this
# repo's identity gets minted while running someone else's steps — and
# nothing goes red. `workflow_call` is the machine-checkable proxy for
# "runs caller code".
#
# The escape hatch is deliberate and visible: a signer legitimately IS a
# workflow_call workflow holding id-token, and must say so with a
# `capability-boundary:` comment explaining why it runs none. An exception
# you have to write down is an exception somebody reviews.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:capability-boundary: no workflows, skipped"; exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  grep -qE "^[[:space:]]*workflow_call:" "${f}" || continue
  # Only a real grant counts. A workflow that says "no id-token, ever" in
  # a comment is documenting the boundary, not breaching it — matching
  # comment text flagged exactly the files that get this right.
  grep -qE "^[^#]*id-token:[[:space:]]*write" "${f}" || continue
  grep -q "capability-boundary:" "${f}" && continue
  bad="${bad} ${f}"
done
if [[ -n "${bad}" ]]; then
  echo "lint:capability-boundary: workflow_call workflow holds id-token" >&2
  echo "  without a capability-boundary marker:${bad}" >&2
  exit 1
fi
echo "lint:capability-boundary: ok"
'''

[tasks."lint:release-phases"]
description = "The release graph's commitment barrier cannot be bypassed or silently unwired (#349)"
dir = "{{cwd}}"
# The shape that closed #349 finding 1, kept closed. On lab v0.20.0 the
# SBOM/triage gate failed and npm publish started eleven seconds later:
# the ordering the docs claimed was a race the org kept winning, because
# nothing publish-side carried the `needs` edge. The fix is a single
# commit-point job between proof and consequence; this lint makes the
# fix structural. Deterministic — parses one tracked file — so it is
# gate-eligible. Canon-only: consuming repos hold a one-line caller
# stub, not the orchestrator.
#
# Enforced, from the `# phase:` markers in publish.yml:
#   1. every job carries exactly one marker, from the closed vocabulary
#   2. exactly one commit-point job, named commit-point
#   3. commit-point's needs EQUAL `guard` plus every prove-phase job —
#      equality, so a new proof added without wiring goes red instead
#      of silently not gating
#   4. every publish job needs commit-point directly and its block
#      tests `needs.commit-point.result == 'success'`
#   5. every attest job reaches commit-point through transitive needs
#   6. no admit, build or prove job holds `id-token: write` or
#      `contents: write` — the capability boundary derived from the
#      phase rather than restated beside it
#   7. a `record` job is terminal and unprivileged: nothing may `needs`
#      it and it holds no `id-token: write`. `record` is the one phase
#      that is not on the way to shipping (#597 — the burn annotation
#      runs precisely when the barrier did NOT open), so it is the one
#      phase that could become a route around the commit point. It
#      cannot: nothing downstream can depend on it, and it signs nothing
run = '''
f=".github/workflows/publish.yml"
[[ -f "${f}" && -d security ]] || { echo "lint:release-phases: not the canon orchestrator, skipped"; exit 0; }
awk '
  /^jobs:$/ { injobs = 1; next }
  !injobs { next }
  /^  # phase: / { pending = $NF; next }
  /^  [a-z][a-z0-9-]*:$/ {
    job = substr($1, 1, length($1) - 1)
    order[++n] = job
    if (pending == "") miss = miss " " job
    phase[job] = pending; pending = ""
    next
  }
  # a marker not immediately followed by a job id is itself a defect
  pending != "" { stray = stray " " pending; pending = "" }
  job == "" { next }
  /^    needs: \[/ {
    s = $0; sub(/^    needs: \[/, "", s); sub(/\].*$/, "", s)
    gsub(/ /, "", s); needs[job] = s; next
  }
  /^    needs: [a-z]/ { needs[job] = $2; next }
  # Block-style needs lists: the only form the tree carries since the
  # yamllint standup (#403) — its brackets rule forbids non-empty flow
  # sequences, so the flow branches above are kept only as parser
  # completeness.
  /^    needs:$/ { nblock = 1; needs[job] = ""; next }
  nblock && /^      - / { needs[job] = needs[job] (needs[job] == "" ? "" : ",") $2; next }
  nblock { nblock = 0 }
  /^      id-token: write/ { idtok[job] = 1 }
  /^      contents: write/ { cwrite[job] = 1 }
  /needs\.commit-point\.result == .success./ { testscp[job] = 1 }
  END {
    bad = ""
    valid = ",admit,build,prove,commit-point,publish,attest,record,"
    cp = ""; proves = ""
    for (i = 1; i <= n; i++) {
      j = order[i]; p = phase[j]
      if (index(valid, "," p ",") == 0) bad = bad "\n  " j ": unknown phase \"" p "\""
      if (p == "commit-point") { if (cp != "") bad = bad "\n  " j ": second commit-point (" cp " already is)"; cp = j }
      if (p == "prove") proves = proves "," j
    }
    if (miss != "") bad = bad "\n  jobs with no # phase: marker:" miss
    if (stray != "") bad = bad "\n  markers not directly above a job id:" stray
    if (cp == "") bad = bad "\n  no commit-point job"
    else if (cp != "commit-point") bad = bad "\n  the commit-point job must be named commit-point, got " cp
    if (cp != "") {
      want = "guard" proves
      m = split(want, w, ","); have = "," needs[cp] ","
      for (k = 1; k <= m; k++) if (index(have, "," w[k] ",") == 0)
        bad = bad "\n  commit-point needs is missing " w[k]
      m = split(needs[cp], g, ",")
      for (k = 1; k <= m; k++) if (index("," want ",", "," g[k] ",") == 0)
        bad = bad "\n  commit-point needs " g[k] ", which is neither guard nor a prove job"
    }
    for (i = 1; i <= n; i++) {
      j = order[i]; p = phase[j]
      if (p == "publish") {
        if (index("," needs[j] ",", ",commit-point,") == 0)
          bad = bad "\n  publish job " j " does not need commit-point directly"
        if (!(j in testscp))
          bad = bad "\n  publish job " j " never tests needs.commit-point.result"
      }
      if (p == "publish" || p == "attest") {
        # BFS over needs for reachability of commit-point
        delete seen; nq = 0; q[++nq] = j; head = 0; found = 0
        while (head < nq && !found) {
          cur = q[++head]
          m = split(needs[cur], e, ",")
          for (k = 1; k <= m; k++) {
            if (e[k] == "commit-point") { found = 1; break }
            if (!(e[k] in seen)) { seen[e[k]] = 1; q[++nq] = e[k] }
          }
        }
        if (!found) bad = bad "\n  " p " job " j " cannot reach commit-point through needs"
      }
      if ((p == "admit" || p == "build" || p == "prove") && (j in idtok || j in cwrite))
        bad = bad "\n  " p " job " j " holds id-token or contents write — pre-barrier jobs sign and publish nothing"
      if (p == "record") {
        if (j in idtok)
          bad = bad "\n  record job " j " holds id-token — a record writes down what happened, it signs nothing"
        for (r = 1; r <= n; r++)
          if (index("," needs[order[r]] ",", "," j ",") > 0)
            bad = bad "\n  " order[r] " needs record job " j " — a record is terminal and cannot gate anything"
      }
    }
    if (bad != "") {
      printf "lint:release-phases: the commitment barrier is unwired:%s\n", bad > "/dev/stderr"
      exit 1
    }
    printf "lint:release-phases: %d jobs, barrier intact\n", n
  }
' "${f}" || {
  echo "  every publish/attest job must reach commit-point (#349 finding 1);" >&2
  echo "  see the PHASES header in publish.yml" >&2
  exit 1
}
'''

[tasks."lint:signer-pin"]
description = "Every sign.yml uses: agrees on one signer digest, and no second copy or hand-written --signer-digest literal exists"
dir = "{{cwd}}"
# A tree states the trusted signer exactly once: the sign.yml@<sha>
# `uses:` lines, the only representation Renovate manages natively.
# Everything that needs the expected signer identity — the verify-signed
# action for consumers, verify-release.yml's verdict mode for the canon —
# derives it from those lines at run time. This lint keeps the
# derivation single-valued: all `uses:` lines must carry the same
# digest, so a partial Renovate bump (some lines moved, some not)
# reddens the gate instead of leaving the tree disagreeing with itself.
# Deterministic — reads only tracked files — so it belongs in the gate.
#
# There used to be a second copy, security/signer.pin, the file the
# verdict checked against. Its Renovate manager needed a URL package
# name (git-refs datasource), which the first-party group's
# `monumental-archive/**` glob could not match, so #296's groupName
# split the one value into two branches — uses:-only and pin-only —
# neither of which could pass this lint alone (#316 finding 2; every
# signer bump since 2026-08-12 reddened). The fix is not re-grouping
# the copies but deleting the second one: the pin file is gone, the
# verdict derives from the same uses: lines, and the split state is
# unrepresentable. Reintroducing the file is refused loudly below.
#
# Hand-written `--signer-digest <40-hex>` literals are banned outright
# (#314 finding 1): the flag is the value a consumer's verification
# turns on (OID .10), Renovate has no manager for a SHA inside a shell
# command, and the lab's literal sat frozen at the signer's FIRST commit
# while its uses: line was bumped twice — every dispatch a guaranteed
# identity mismatch, silently.
run = '''
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml")
[[ -n "${files}" ]] || { echo "lint:signer-pin: no workflows, skipped"; exit 0; }
literals=$(xargs grep -nE -- "--signer-digest[[:space:]]+[0-9a-f]{40}" <<< "${files}" || true)
if [[ -n "${literals}" ]]; then
  echo "lint:signer-pin: hand-written --signer-digest literal — nothing bumps it, so it drifts from the uses: pin the certificate will carry (#314):" >&2
  echo "${literals}" >&2
  echo "  derive it instead: uses: monumental-archive/.github/.github/actions/verify-signed" >&2
  echo "  (\$/.github/actions/verify-signed from a canon-owned workflow)" >&2
  exit 1
fi
if [[ -f security/signer.pin ]]; then
  echo "lint:signer-pin: security/signer.pin exists — the second copy of the signer identity was deleted (#316 finding 2)" >&2
  echo "  the uses: lines are the single statement of the trusted signer; verifiers derive from them" >&2
  echo "  (a standalone pin file has no Renovate manager the first-party group can match, so it" >&2
  echo "  bumps on a separate branch that can never pass this lint — the two-branch split)" >&2
  exit 1
fi
readers=$(xargs grep -lE "^[^#]*security/signer\.pin" <<< "${files}" || true)
if [[ -n "${readers}" ]]; then
  echo "lint:signer-pin: workflows read security/signer.pin (on a non-comment line) but the file is deleted (#316 finding 2) — derive from the sign.yml uses: pin instead:${readers}" >&2
  exit 1
fi
refs=$(xargs grep -hoE "monumental-archive/signer/.github/workflows/sign\.yml@[0-9a-f]{40}" <<< "${files}" | sort -u || true)
[[ -n "${refs}" ]] || { echo "lint:signer-pin: no signer references, skipped"; exit 0; }
if [[ "$(wc -l <<< "${refs}" | tr -d " ")" != "1" ]]; then
  echo "lint:signer-pin: sign.yml pinned at more than one digest — a tree states the trusted signer once:" >&2
  echo "${refs}" >&2
  echo "  a partial bump left the tree disagreeing with itself; move every uses: line together" >&2
  exit 1
fi
echo "lint:signer-pin: all signer references agree on ${refs##*@}"
'''

[tasks."lint:input-forwarding"]
description = "Every local caller forwards every universal input its callee declares (#305)"
dir = "{{cwd}}"
# The #299 failure class: two callers of one reusable workflow disagree
# about which inputs they forward, and omitting an optional input is
# legal YAML — actionlint validates it, zizmor has no opinion, and only
# the caller the PR happened to exercise goes red. The contract is
# therefore declared where each input is BORN, not at the call sites
# that consume it: every input and secret of a locally-called
# `workflow_call` workflow carries a `# forwarding: universal` (every
# local caller must set the key — any value, literals included) or
# `# forwarding: discretionary — <reason>` marker, and an unmarked
# input fails closed, so the classification #299 silently skipped is
# structurally unskippable. Consumer-surface workflows whose defaults
# ARE the API may declare `# forwarding-default: discretionary` once,
# file-level; a file-level default is never allowed to be universal.
# The marker lives in a comment because GitHub's workflow_call schema
# rejects extension fields — the platform ceiling, not a preference.
#
# Interlock: this lint forces the forwarding line; actionlint, ahead of
# it in the same gate, forces the caller-surface declaration any
# `${{ inputs.* }}` it forwards refers to. The chain closes only with
# both — do not "simplify" either away.
#
# Scope is local `uses: ./` call sites only: cross-repo callers pin by
# SHA and never reach the class builds directly. Indentation-keyed
# parsing is defensible because actionlint guarantees well-formed YAML
# and the canon's two-space style ahead of this in the same gate.
# Deterministic, tracked files only — belongs in `ci`. The error line
# format is fix:input-forwarding's parsing API; change them together.
run = '''
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml")
[[ -n "${files}" ]] || { echo "lint:input-forwarding: no workflows, skipped"; exit 0; }
grep -l "uses: ./.github/workflows/" ${files} > /dev/null 2>&1 || {
  echo "lint:input-forwarding: no local reusable-workflow callers, skipped"; exit 0
}
awk '
FNR == 1 { split(FILENAME, P, "/"); base = P[length(P)]; in_wc = 0; sect = ""; curkey = ""; in_jobs = 0; job = ""; mode = "" }
/^[^ ]/ { in_wc = 0; sect = ""; in_jobs = ($0 ~ /^jobs:/); job = ""; mode = "" }
/^  workflow_call:/ { if (!in_jobs) { in_wc = 1; sect = ""; next } }
in_wc && /^  [^ ]/ { in_wc = 0; sect = "" }
/# forwarding-default: discretionary/ { fdef[base] = 1 }
in_wc && /^    inputs:/ { sect = "input"; curkey = ""; next }
in_wc && /^    secrets:/ { sect = "secret"; curkey = ""; next }
in_wc && /^    [^ ]/ { sect = ""; curkey = "" }
in_wc && sect != "" && /^      [A-Za-z0-9_-]+:/ {
  curkey = $1; sub(/:.*/, "", curkey)
  ndecl++; dbase[ndecl] = base; dkind[ndecl] = sect; dname[ndecl] = curkey; dclass[ndecl] = ""
  last[base SUBSEP sect SUBSEP curkey] = ndecl
}
in_wc && sect != "" && curkey != "" && /# forwarding: universal/ { dclass[last[base SUBSEP sect SUBSEP curkey]] = "universal" }
in_wc && sect != "" && curkey != "" && /# forwarding: discretionary/ { dclass[last[base SUBSEP sect SUBSEP curkey]] = "discretionary" }
in_jobs && /^  [A-Za-z0-9_-]+:/ { job = $1; sub(/:.*/, "", job); mode = "" }
in_jobs && job != "" && /^    uses: \.\/\.github\/workflows\// {
  callee = $2; sub(/^\.\/\.github\/workflows\//, "", callee)
  ncall++; cfile[ncall] = FILENAME; cjob[ncall] = job; cbase[ncall] = callee; called[callee] = 1
}
in_jobs && job != "" && /^    with:/ { mode = "input"; next }
in_jobs && job != "" && /^    secrets: inherit/ { inherited[FILENAME SUBSEP job] = 1; mode = ""; next }
in_jobs && job != "" && /^    secrets:/ { mode = "secret"; next }
in_jobs && job != "" && /^    [^ ]/ { mode = "" }
in_jobs && job != "" && mode != "" && /^      [A-Za-z0-9_-]+:/ {
  k = $1; sub(/:.*/, "", k); fwd[FILENAME SUBSEP job SUBSEP mode SUBSEP k] = 1
}
END {
  fail = 0
  for (i = 1; i <= ndecl; i++)
    if (dclass[i] == "" && called[dbase[i]] && !fdef[dbase[i]]) {
      printf "lint:input-forwarding: %s %s in %s carries no forwarding marker\n", dkind[i], dname[i], dbase[i] > "/dev/stderr"
      fail = 1
    }
  for (j = 1; j <= ncall; j++)
    for (i = 1; i <= ndecl; i++) {
      if (dbase[i] != cbase[j] || dclass[i] != "universal") continue
      if (dkind[i] == "secret" && inherited[cfile[j] SUBSEP cjob[j]]) continue
      if (!fwd[cfile[j] SUBSEP cjob[j] SUBSEP dkind[i] SUBSEP dname[i]]) {
        printf "lint:input-forwarding: %s:%s does not forward universal %s %s of %s\n", cfile[j], cjob[j], dkind[i], dname[i], dbase[i] > "/dev/stderr"
        fail = 1
      }
    }
  if (fail) exit 1
  print "lint:input-forwarding: every universal input is forwarded at every local call site"
}
' ${files}
'''

[tasks."fix:input-forwarding"]
description = "Insert the missing universal forwarding lines lint:input-forwarding demands"
dir = "{{cwd}}"
# The write-mode sibling (#305): universal forwarding lines are
# machine-written, never hand-authored — drift can only exist as an
# uncommittable dirty tree. Consumes the lint's error lines as its API
# (change the formats together) and inserts `key: ${{ inputs.key }}` /
# `key: ${{ secrets.key }}` at the top of the offending job's block.
# The inserted expression is the mechanical guess: review it (the right
# value may be a `needs.*` output or a literal), and declare the input
# on the caller's own surface if actionlint then reddens — that
# interlock is the other half of the chain.
run = '''
{% raw %}
missing=$(mise run lint:input-forwarding 2>&1 | awk '
/does not forward universal/ {
  for (i = 4; i < NF; i++)
    if ($i == "forward" && $(i + 1) == "universal") print $(i - 3), $(i + 2), $(i + 3)
}' || true)
if [[ -z "${missing}" ]]; then
  echo "fix:input-forwarding: nothing to fix"; exit 0
fi
while read -r loc kind key; do
  [[ -n "${loc}" ]] || continue
  file="${loc%%:*}"; jobname="${loc##*:}"
  if [[ "${kind}" == "secret" ]]; then
    blk="secrets:"; val='${{ secrets.'"${key}"' }}'
  else
    blk="with:"; val='${{ inputs.'"${key}"' }}'
  fi
  awk -v job="${jobname}" -v key="${key}" -v blk="${blk}" -v val="${val}" '
  { print }
  /^  [A-Za-z0-9_-]+:/ { cur = $1; sub(/:.*/, "", cur) }
  cur == job && $0 ~ "^    " blk "$" && !done { printf "      %s: %s\n", key, val; done = 1 }
  ' "${file}" > "${file}.fix-tmp" && mv "${file}.fix-tmp" "${file}"
  echo "fix:input-forwarding: ${file}:${jobname} += ${key}"
done <<< "${missing}"
echo "fix:input-forwarding: review the inserted expressions; rerun mise run lint:input-forwarding and lint:actions"
{% endraw %}
'''

[tasks."lint:source-attest"]
description = "Dry-run the claims derivation against recorded enforcement (#236, stele#40)"
dir = "{{cwd}}"
# The claims stage is `stele derive claims` over the control table the
# policy declares; this exercises exactly that — the real engine, the
# real committed policy, recorded rule snapshots, no network — so it
# belongs in the gate. Three scenarios, the #240 outcomes by name:
# the full fixture derives the complete claim set; a BLIND tag read
# (rulesets visible to nobody) refuses loudly; a LAPSED ruleset
# (readable, content no longer matching) drops exactly its own
# property and nothing else. The degraded fixture sets are DERIVED
# from the one canonical snapshot — jq transforms, never second
# copies that drift. Only the canon carries the emitter; everywhere
# else this skips clean.
run = '''
fixtures=".github/actions/source-attest/testdata"
[ -d "${fixtures}/monumental-archive/.github/rules" ] || {
  echo "lint:source-attest: no source-attest fixtures, skipped"; exit 0
}
command -v stele > /dev/null || { echo "lint:source-attest: stele missing from the belt" >&2; exit 1; }
tmp=$(mktemp -d)
trap 'rm -rf "${tmp}"' EXIT
derive() { # snapshot-dir out-file
  stele derive claims --policy slsa/verify-policy.json \
    --repo monumental-archive/.github --branch main \
    --canon-root . --canon-digest "$(git rev-parse HEAD)" \
    --snapshot "${1}" --out "${2}"
}
# Full snapshot: every declared property derives.
derive "${fixtures}" "${tmp}/claims.json"
jq -e '[.controls[].property] | sort == [
  "ORG_SOURCE_CAPABILITY_BOUNDARY", "ORG_SOURCE_DCO", "ORG_SOURCE_GATED",
  "ORG_SOURCE_HISTORY_PROTECTED", "ORG_SOURCE_RELEASE_TAG_MINTED",
  "ORG_SOURCE_REVIEWED_THREADS", "ORG_SOURCE_SIGNED", "ORG_SOURCE_TAG_IMMUTABLE"]' \
  "${tmp}/claims.json" > /dev/null || {
  echo "lint:source-attest: the full snapshot did not derive the complete claim set" >&2; exit 1
}
# Blind: no tag ruleset visible — a property is declared against that
# scope, so an empty read is a credential proving its own incapability.
rules="${fixtures}/monumental-archive/.github/rules"
blind="${tmp}/blind/monumental-archive/.github/rules"
mkdir -p "${blind}/branches" "${blind}/rulesets"
cp "${rules}/branches/main.json" "${blind}/branches/"
cp "${rules}"/rulesets/*.json "${blind}/rulesets/"
jq '[.[] | select(.target != "tag")]' "${rules}/rulesets.json" > "${blind}/rulesets.json"
if out=$(derive "${tmp}/blind" "${tmp}/blind.json" 2>&1); then
  echo "lint:source-attest: a blind tag read was accepted — the blindness guard is gone (#240)" >&2; exit 1
fi
grep -q "blind read" <<< "${out}" || {
  echo "lint:source-attest: the blind read refused without its named error (#240)" >&2; exit 1
}
# Lapsed: a bypass granted on the all-tags ruleset — readable, content
# no longer matching, so exactly ORG_SOURCE_TAG_IMMUTABLE drops.
lapsed="${tmp}/lapsed/monumental-archive/.github/rules"
mkdir -p "${lapsed}/branches" "${lapsed}/rulesets"
cp "${rules}/branches/main.json" "${lapsed}/branches/"
cp "${rules}/rulesets.json" "${lapsed}/rulesets.json"
for f in "${rules}"/rulesets/*.json; do
  jq 'if .conditions.ref_name.include == ["~ALL"]
      then .bypass_actors += [{actor_id: 1, actor_type: "OrganizationAdmin", bypass_mode: "always"}]
      else . end' "${f}" > "${lapsed}/rulesets/$(basename "${f}")"
done
derive "${tmp}/lapsed" "${tmp}/lapsed.json" || {
  echo "lint:source-attest: a readable-but-lapsed ruleset failed the run — a lapse must under-claim (#240)" >&2
  exit 1
}
jq -e '[.controls[].property] | (index("ORG_SOURCE_TAG_IMMUTABLE") == null)
  and (index("ORG_SOURCE_RELEASE_TAG_MINTED") != null)' "${tmp}/lapsed.json" > /dev/null || {
  echo "lint:source-attest: a lapsed tag ruleset did not drop exactly its own property (#240)" >&2; exit 1
}
echo "lint:source-attest: ok — full set derives, blindness refuses, a lapse under-claims"
'''

[tasks."lint:actions-allowed"]
description = "Every uses: names an action the org allowlist permits (workflows AND composite actions)"
dir = "{{cwd}}"
# The org restricts Actions to GitHub-owned plus four patterns. GitHub
# enforces it at `Set up job` — the run dies before a single step
# executes, with nothing red until then. Found by driving the first
# source-track activation (#207): sigstore/cosign-installer passed every
# local lint, every gate and code review, and died in the lab.
#
# The list below is the enforcement copy, delivered to every repo by the
# belt; security/README.md is the record and audit:actions-allowlist
# compares both against the live org setting on Mondays. Same shape as
# the rulesets decision (docs/rulesets.md): the org setting is the
# enforcement, this is the early warning.
#
# Composite actions are linted too, deliberately: every other workflow
# lint globs .github/workflows/ only, which is exactly the blind spot
# that let the bad `uses:` through.
run = '''
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n "${files}" ]] || { echo "lint:actions-allowed: no workflows or actions, skipped"; exit 0; }
# github_owned_allowed=true covers the actions/ and github/ orgs.
# verified_allowed=false — a Marketplace verification badge is a
# publisher check, not a supply-chain one, and it is not ours to revoke.
allowed="actions/* github/* monumental-archive/* jdx/mise-action@* codecov/codecov-action@* ossf/scorecard-action@*"
bad=""
checked=0
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  while IFS= read -r ref; do
    [[ -n "${ref}" ]] || continue
    # Local refs (./path, $/path) are the repo's own tree, never a
    # third party — the allowlist does not govern them.
    case "${ref}" in ./*|\$/*) continue ;; esac
    checked=$((checked + 1))
    owner_repo="${ref%%@*}"
    ok=""
    for pat in ${allowed}; do
      case "${pat}" in
        *@\*) [[ "${owner_repo}" == "${pat%@\*}" ]] && ok=1 ;;
        */\*) [[ "${owner_repo}" == "${pat%/\*}/"* ]] && ok=1 ;;
      esac
    done
    [[ -n "${ok}" ]] || bad="${bad} ${f}(${ref})"
  done <<< "$(grep -hoE "^[^#]*uses:[[:space:]]*[A-Za-z0-9._$/-]+/[A-Za-z0-9._-]+[^[:space:]]*" "${f}" \
    | sed -E "s|^.*uses:[[:space:]]*||")"
done <<< "${files}"
if [[ -n "${bad}" ]]; then
  echo "lint:actions-allowed: uses: an action the org allowlist forbids:${bad}" >&2
  echo "  allowed: GitHub-owned plus ${allowed}" >&2
  echo "  GitHub refuses these at 'Set up job', so nothing goes red until a run dies" >&2
  echo "  widen the org setting deliberately, or use an allowed action" >&2
  exit 1
fi
echo "lint:actions-allowed: ${checked} action reference(s), all permitted"
'''

[tasks."audit:actions-allowlist"]
description = "The live org Actions allowlist still matches the belt's enforcement copy (network, canon only)"
dir = "{{cwd}}"
# The drift half of lint:actions-allowed. That lint is only as true as
# its embedded list: widen the org setting and the lint silently over-
# blocks; narrow it and the lint silently under-blocks while runs start
# dying. This is the reconciliation, on the same cadence as every other
# settings-drift check.
run = '''
[[ -d security ]] || { echo "audit:actions-allowlist: not the canon, skipped"; exit 0; }
command -v gh > /dev/null || { echo "audit:actions-allowlist: gh missing" >&2; exit 1; }
# The read comes first, and a read that fails is its own red — never an
# input to the comparison. This leg once compared the belt against the
# `null` an unauthorised read returned, reporting drift that was the
# exact opposite of the live setting (#349 finding 10): a blind leg has
# one honest output, and it is "I could not read", with the endpoint
# named. The org-scoped endpoint needs an org-admin-capable token
# (AUDIT_TOKEN via the audit environment in CI); the default job token
# cannot perform it.
if ! live=$(gh api "orgs/monumental-archive/actions/permissions/selected-actions" 2> /dev/null); then
  echo "audit:actions-allowlist: could not read orgs/monumental-archive/actions/permissions/selected-actions" >&2
  echo "  no comparison was made — this red is 'unreadable', not 'drifted'." >&2
  echo "  The endpoint needs an org-admin-capable token (AUDIT_TOKEN)." >&2
  exit 1
fi
jq -e '.patterns_allowed | type == "array"' <<< "${live}" > /dev/null || {
  echo "audit:actions-allowlist: the endpoint answered without patterns_allowed — refusing to compare against null" >&2
  exit 1
}
live_patterns=$(jq -r '.patterns_allowed | sort | join(" ")' <<< "${live}")
belt_patterns=$(mise tasks info "lint:actions-allowed" --json \
  | jq -r '.run[0]' | sed -n 's|^allowed="\(.*\)"$|\1|p' \
  | tr " " "\n" | grep -v "^actions/\*$" | grep -v "^github/\*$" \
  | sort | tr "\n" " " | sed "s| $||")
fail=""
[[ "${live_patterns}" == "${belt_patterns}" ]] \
  || fail="patterns differ — live: [${live_patterns}] belt: [${belt_patterns}]"
jq -e '.github_owned_allowed == true' <<< "${live}" > /dev/null \
  || fail="${fail}; github_owned_allowed is false but the belt allows actions/* and github/*"
jq -e '.verified_allowed == false' <<< "${live}" > /dev/null \
  || fail="${fail}; verified_allowed is true — the Marketplace badge is not a supply-chain control"
if [[ -n "${fail}" ]]; then
  echo "audit:actions-allowlist: ${fail}" >&2
  echo "  reconcile mise/config.toml lint:actions-allowed and security/README.md" >&2
  echo "  with the live setting, or put the live setting back" >&2
  exit 1
fi
echo "audit:actions-allowlist: live org allowlist matches the belt"
'''

[tasks."lint:from-digests"]
description = "Every FROM in a tracked Dockerfile is digest-pinned (a tag is a moving pointer into the build)"
dir = "{{cwd}}"
# Digest pinning is practiced (docker/pgrx-base-images.toml) but was not
# enforced — the lab's builder stage shipped as `rust:1.97-slim`, tag
# only, found in the #117 research. A tag names a stream; the digest
# names the bytes, and only named bytes can be verified before use
# (base-attest.yml). Renovate keeps tag AND digest current together, so
# a pin here never goes stale. Exempt: `FROM scratch` and references to
# named build stages. Tracked files only, like every belt linter.
run = '''
files=$(git ls-files ':!vendor/**' "Dockerfile" "*/Dockerfile" "*.Dockerfile" "Dockerfile.*")
[[ -n "${files}" ]] || { echo "lint:from-digests: no Dockerfiles tracked, skipped"; exit 0; }
bad=""
while IFS= read -r f; do
  stages=$(grep -iE "^[[:space:]]*FROM[[:space:]]" "${f}" \
    | sed -nE 's/.*[[:space:]][Aa][Ss][[:space:]]+([A-Za-z0-9_.-]+).*/\1/p')
  while IFS= read -r line; do
    set -- ${line}
    ref="$2"
    case "${ref}" in --platform=*) ref="$3" ;; esac
    case "$(printf "%s" "${ref}" | tr "[:upper:]" "[:lower:]")" in scratch) continue ;; esac
    grep -qxF "${ref}" <<< "${stages}" && continue
    [[ "${ref}" == *"@sha256:"* ]] || bad="${bad} ${f}(${ref})"
  done < <(grep -iE "^[[:space:]]*FROM[[:space:]]" "${f}")
done <<< "${files}"
if [[ -n "${bad}" ]]; then
  echo "lint:from-digests: FROM without a digest pin:${bad}" >&2
  echo "  pin as image:tag@sha256:… — Renovate rolls tag and digest together" >&2
  exit 1
fi
echo "lint:from-digests: ok"
'''

[tasks."lint:installer-pinned"]
description = "Every mise-action step pins mise's own version — the installer is a build input (#117)"
dir = "{{cwd}}"
# Found the expensive way (v0.18.2 darwin leg): every tool was pinned,
# every uses: SHA-pinned — and the tool that installs them floated,
# pulling a same-day mise release that broke rustup mid-install. A gap a
# human "should have seen" is a gap the belt owns from then on: this
# asserts each jdx/mise-action step carries an explicit `version:`.
# Grep-shaped like every belt lint: count steps, count pins, any
# shortfall is red with the file named.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:installer-pinned: no workflows, skipped"; exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  steps=$(grep -cE "^[^#]*uses:[[:space:]]*jdx/mise-action@" "${f}") || true
  ((steps > 0)) || continue
  pins=$(grep -cE "^[^#]*version:[[:space:]]*[0-9]{4}\.[0-9]+\.[0-9]+" "${f}") || true
  if ((steps > pins)); then
    bad="${bad} ${f}(${steps} steps, ${pins} version pins)"
  fi
done
if [[ -n "${bad}" ]]; then
  echo "lint:installer-pinned: mise-action without a mise version pin:${bad}" >&2
  echo "  the installer is a build input — an unpinned mise delivers" >&2
  echo "  same-day releases straight into attested builds (v0.18.2 darwin leg)" >&2
  exit 1
fi
echo "lint:installer-pinned: ok"
'''

[tasks."lint:cold-attested"]
description = "No cache on any attested path — caches are unattested, writable-from-any-branch build inputs (#117)"
dir = "{{cwd}}"
# The cold-build rule, made mechanical. actions/cache (and every tool
# cache riding an action's `cache:` default) is state injected into the
# build that no provenance captures — cache poisoning is the classic
# attack the attestation cannot see. The rule: caches only where a human
# is waiting and nothing is signed. Structurally that means a workflow
# using a cache must say why its path is unattested, with an
# `unattested-path:` marker — the capability-boundary pattern: an
# exception you have to write down is an exception somebody reviews.
#
# Two shapes are caught: an explicit `uses: actions/cache*`, and a
# mise-action step without `cache: false` (its default is true — the
# silent shape). Both are per-file heuristics, deliberately: the gate is
# deterministic and this stays grep-shaped, like every belt lint.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:cold-attested: no workflows, skipped"; exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  grep -q "unattested-path:" "${f}" && continue
  if grep -qE "^[^#]*uses:[[:space:]]*actions/cache" "${f}"; then
    bad="${bad} ${f}(actions/cache)"
    continue
  fi
  actions=$(grep -cE "^[^#]*uses:[[:space:]]*jdx/mise-action@" "${f}") || true
  cold=$(grep -cE "^[^#]*cache:[[:space:]]*false" "${f}") || true
  if ((actions > cold)); then
    bad="${bad} ${f}(mise-action without cache: false)"
  fi
done
if [[ -n "${bad}" ]]; then
  echo "lint:cold-attested: cache on a path with no unattested-path marker:${bad}" >&2
  echo "  attested paths build cold — a cache is an unattested input" >&2
  echo "  (docs/release.md); if this workflow truly signs nothing, say why" >&2
  echo "  with an 'unattested-path:' comment" >&2
  exit 1
fi
echo "lint:cold-attested: ok"
'''

[tasks."coverage:check"]
description = "Enforce the committed coverage floor (.coverage-floor); repos without one skip clean"
dir = "{{cwd}}"
# No task-time rustup, by rule: a component installed mid-run races
# every other task driving the toolchain (measured twice on the lab's
# v0.18.0 release PR; the wait_for chains that served as the workaround
# are deleted, #117). llvm-tools is a declared build input like
# cargo-auditable — pinned in the repo's mise.toml, installed before any
# task runs — and this task asserts it with a remedy, never installs.
# The ratchet: the floor is a committed number that only rises. A repo
# without a floor has not adopted coverage yet and skips clean; a repo
# with one cannot merge below it. Deterministic — the number is local,
# the run is local; the Codecov upload (the badge) lives in ci.yml as a
# separate non-blocking job.
run = """
[[ -f .coverage-floor ]] && [[ -f Cargo.toml || -f go.mod ]] || {
  echo "coverage:check: no .coverage-floor, skipped"; exit 0
}
floor=$(tr -d '[:space:]' < .coverage-floor)
if [[ ! "${floor}" =~ ^[0-9]+(\\.[0-9]+)?$ ]]; then
  echo "coverage:check: .coverage-floor is not a number: ${floor}" >&2
  exit 1
fi
# The Go leg (#392): `go test -coverprofile` plus `go tool cover -func`
# — both in the pinned toolchain, no extra component to assert. The
# ratchet semantics are identical to the Rust leg's: committed floor,
# local measurement, merge refused below it. No COVERAGE_EXCLUDE analog
# yet — the first Go repo that needs one adds it deliberately.
#
# EVERY tracked language runs its own leg, and each must hold the floor.
# This read `go.mod && ! -f Cargo.toml` until the lab gained a Go
# fixture beside its crates: a mixed repo then took the Rust leg alone
# and reported "floor held" over a language nothing had measured — the
# vacuous green this ratchet exists to prevent, in the ratchet itself.
# The floor is a minimum, so applying it per language is the only
# reading that means anything; a repo that wants two numbers wants two
# floors, and can say so when one exists.
if [[ -f go.mod ]]; then
  command -v go > /dev/null || {
    echo "coverage:check: go.mod present but go missing — pin go in mise.toml" >&2
    exit 1
  }
  go test ./... -coverprofile=coverage.txt -covermode=atomic
  pct=$(go tool cover -func=coverage.txt | awk '/^total:/ { sub(/%/, "", $3); print $3 }')
  [[ -n "${pct}" ]] || {
    echo "coverage:check: could not read a total from the profile — a check that reads nothing must not pass" >&2
    exit 1
  }
  if awk -v p="${pct}" -v f="${floor}" 'BEGIN { exit !(p < f) }'; then
    echo "coverage:check: go: ${pct}% is below the committed floor ${floor}%" >&2
    exit 1
  fi
  echo "coverage:check: go leg holds the floor ${floor} (${pct}%)"
fi
[[ -f Cargo.toml ]] || exit 0
if ! rustup component list --installed 2> /dev/null | grep -q "^llvm-tools"; then
  echo "coverage:check: llvm-tools component missing — declare it with the" >&2
  echo "  rust pin in mise.toml: rust = { version = \\"1.xx.x\\", components = \\"llvm-tools\\" }" >&2
  echo "  (installed with the toolchain, before tasks run — never mid-run)" >&2
  exit 1
fi
# COVERAGE_EXCLUDE ([env] in the repo's mise.toml): workspace members
# whose tests cannot run on the gate runner — the lab's lab-pg needs a
# live postgres and is excluded from `test` for the same reason (#316);
# a floor task that hard-codes --workspace fails on exactly the repos
# the machinery was built for.
excludes=""
for m in ${COVERAGE_EXCLUDE:-}; do excludes="${excludes} --exclude ${m}"; done
# shellcheck disable=SC2086
cargo llvm-cov --workspace --locked ${excludes} --fail-under-lines "${floor}"
echo "coverage:check: floor ${floor} held${excludes:+ (excluding${excludes//--exclude/})}"
"""

[tasks."coverage:report"]
description = "Render the lcov report the Codecov badge feed uploads (never the gate)"
dir = "{{cwd}}"
# The upload half of the ratchet, as a TASK rather than an inline
# command in ci.yml — because "which members are coverable" is a
# property of the repo (COVERAGE_EXCLUDE in its mise.toml), and a
# second hardcoded --workspace invocation drifted from coverage:check
# the instant a repo excluded anything: the lab excludes lab-pg (pgrx,
# needs a live postgres), the badge job did not, and it reddened main
# on the first push after coverage landed (#316). One task, one
# exclusion set, same llvm-tools assertion — never a task-time rustup,
# which races every other task driving the toolchain.
run = """
[[ -f .coverage-floor ]] && [[ -f Cargo.toml || -f go.mod ]] || {
  echo "coverage:report: no .coverage-floor, skipped"; exit 0
}
# Go leg (#392): the profile go test writes IS the upload format —
# Codecov parses Go coverprofiles natively, so the report is the
# measurement, with no converter to drift. ci.yml selects the filename
# by repo shape (coverage.txt for Go, lcov.info for Rust).
# Every tracked language renders its own report, for the same reason
# coverage:check runs every leg: a mixed repo used to render lcov.info
# alone while ci.yml, guessing the filename from `hashFiles('go.mod')`,
# asked Codecov for a coverage.txt nothing had written. The uploader
# now takes the list of reports that actually exist.
if [[ -f go.mod ]]; then
  command -v go > /dev/null || {
    echo "coverage:report: go.mod present but go missing — pin go in mise.toml" >&2
    exit 1
  }
  go test ./... -coverprofile=coverage.txt -covermode=atomic > /dev/null
  echo "coverage:report: coverage.txt written"
fi
[[ -f Cargo.toml ]] || exit 0
if ! rustup component list --installed 2> /dev/null | grep -q "^llvm-tools"; then
  echo "coverage:report: llvm-tools component missing — declare it with the" >&2
  echo "  rust pin in mise.toml: rust = { version = \\"1.xx.x\\", components = \\"llvm-tools\\" }" >&2
  exit 1
fi
excludes=""
for m in ${COVERAGE_EXCLUDE:-}; do excludes="${excludes} --exclude ${m}"; done
# shellcheck disable=SC2086
cargo llvm-cov --workspace --locked ${excludes} --lcov --output-path lcov.info
echo "coverage:report: lcov.info written${excludes:+ (excluding${excludes//--exclude/})}"
"""

[tasks."lint:fuzz-build"]
description = "Fuzz targets still compile (cargo-fuzz, sanitizer none, stable toolchain); repos without fuzz/ skip clean"
dir = "{{cwd}}"
# The deterministic half of the fuzz machinery (#316): a fuzz target
# that no longer compiles is dead code wearing a Scorecard point, and
# nothing else would notice until the Monday run. Building with
# `--sanitizer none` is the load-bearing choice: it works on the repo's
# own PINNED STABLE toolchain, so the gate needs no nightly — no
# mid-run rustup, no network resolution, no second toolchain pin.
# libFuzzer without a sanitizer still surfaces panics, which in a
# memory-safe crate is the failure class that exists; ASan-on-nightly
# is the reopen for FFI-heavy code (tooling-verdicts.md). Running the
# targets is time-bound and non-deterministic, so it lives in
# audit:fuzz, never here — the gate stays deterministic.
# cargo-fuzz is asserted with a remedy, never installed mid-run — the
# coverage:check/llvm-tools pattern.
run = '''
[[ -d fuzz && -f fuzz/Cargo.toml ]] || { echo "lint:fuzz-build: no fuzz/, skipped"; exit 0; }
if ! command -v cargo-fuzz > /dev/null; then
  echo "lint:fuzz-build: fuzz/ exists but cargo-fuzz is missing — pin it as a build input:" >&2
  echo "  mise.toml: \"cargo:cargo-fuzz\" = \"<version>\" (installed before tasks, never mid-run)" >&2
  exit 1
fi
if [[ ! -f fuzz/Cargo.lock ]]; then
  echo "lint:fuzz-build: fuzz/Cargo.lock is not committed — an unlocked fuzz build is not deterministic" >&2
  exit 1
fi
# A LINT MUST NOT WRITE (#374). `fuzz/` is its own cargo workspace with its
# own lockfile that path-depends on the parent crate, so `cargo fuzz build`
# re-resolves and REWRITES fuzz/Cargo.lock whenever the parent version has
# moved — silently repairing the very thing it is inspecting, which means a
# stale fuzz lockfile was structurally unreportable. cargo-fuzz exposes no
# --locked of its own, so the staleness is proven first with a command that
# cannot write: `cargo metadata --locked` fails if the lockfile would have
# to change. Only once it is proven current does the build run, and a build
# over a current lockfile has nothing to rewrite. Measured on release-lab,
# where the committed lock named lab-core 0.24.1 against a 0.24.4
# workspace — four releases of drift that this check turns red.
if ! cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null 2>&1; then
  echo "lint:fuzz-build: fuzz/Cargo.lock is stale — it would be rewritten by the build" >&2
  echo "  fuzz/ is its own workspace: its lock names the parent crate's version and" >&2
  echo "  the release script refreshes it (release/prepare-release.sh)" >&2
  echo "  fix locally with: cargo update --workspace --manifest-path fuzz/Cargo.toml" >&2
  exit 1
fi
cargo fuzz build -s none
echo "lint:fuzz-build: $(cargo fuzz list | wc -l | tr -d ' ') target(s) build, lockfile current"
'''

[tasks."audit:action-pins"]
description = "Version comments tell the truth, and no action pin is younger than the release-age floor (network)"
dir = "{{cwd}}"
# The two halves lint:action-pins cannot do offline, both needing the
# GitHub API and both time-varying, so both belong here rather than in
# the gate.
#
# --verify-comment resolves each pinned SHA and checks it really is the
# version the comment claims. Nothing else in the org can catch a comment
# that lies, and a lying comment is worse than a missing one: it tells
# every reviewer and Renovate that a pin is something it is not.
#
# --min-age carries the org's seven-day floor to the layer that lacked
# it. minimum_release_age governs mise tools and UV_EXCLUDE_NEWER governs
# Python dependencies; an action pin could name a release minutes old.
# Passed on the command line, not in .pinact.yaml, so it holds in
# consumer repos that carry no config and so the number has one home.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n "${files}" ]] || { echo "audit:action-pins: no workflows or actions, skipped"; exit 0; }
xargs pinact run --config "${ORG_BELT_DIR}/pinact.yaml" -fix=false --verify-comment --verify-min-age <<<"${files}"
echo "audit:action-pins: ok"
'''

[tasks."audit:caller-permissions"]
description = "Org consumers' uses: grants cover canon HEAD's computed requirements (network, canon only)"
dir = "{{cwd}}"
# The org-wide half of seam 2 (#358); the local half is
# lint:caller-permissions. A consumer's stub shipped atomically with
# its pin, so at its own pinned SHA it is never broken — the only
# question worth asking weekly is "will the next Renovate bump
# startup-fail this repo", and that is the comparison against canon
# HEAD. A finding here is therefore a FORECAST, not an outage: fix the
# stub before (or with) the pin bump. Renovate cannot do it — it bumps
# the uses: SHA and nothing else; the stub body is not a dependency.
# Prerequisite of the #83 transfers: one consumer is what made the
# v1.23.1 break survivable, and transfers add consumers.
run = '''
[[ "${GITHUB_REPOSITORY:-}" == "monumental-archive/.github" || -f slsa/assert-policy.json ]] || {
  echo "audit:caller-permissions: not the canon, skipped"; exit 0
}
command -v stele > /dev/null || { echo "audit:caller-permissions: stele missing from the belt" >&2; exit 1; }
if ! stele assert permissions \
  --policy slsa/assert-policy.json \
  --tree . \
  --org monumental-archive; then
  echo "audit:caller-permissions: a consumer's grant is below what canon" >&2
  echo "  HEAD's callee asks for — its next pin bump dies as" >&2
  echo "  startup_failure. Fix the stub before or with the bump (#358)." >&2
  exit 1
fi
'''

[tasks."audit:spec-drift"]
description = "The live SLSA source-requirements matrix still equals the pinned snapshot (network, canon only)"
dir = "{{cwd}}"
# S2 of #349: the upstream half of claims-as-data. slsa/requirements
# .toml maps what the spec asks; this leg notices when the spec moves —
# a new requirement id, a removed one, or a level change (the tick
# count) reddens Monday with the instruction to re-map, instead of the
# org discovering the change in a capstone audit's hand parse (#203,
# #349 finding 4). The extraction is the audit's own method from that
# pass: the tick columns of the requirement tables, read from the HTML,
# because two prose summarisations of the same page disagreed. A fetch
# or parse failure is "unreadable", never "unchanged" — zero rows means
# the page shape moved, and that too is a drift signal, named as such.
run = '''
[[ -f slsa/spec-source-matrix.txt ]] || { echo "audit:spec-drift: no pinned matrix, skipped"; exit 0; }
if ! page=$(curl -sfL "https://slsa.dev/spec/v1.2/source-requirements"); then
  echo "audit:spec-drift: could not fetch the spec page — nothing was compared" >&2
  exit 1
fi
live=$(tr -d "\n" <<< "${page}" \
  | awk 'BEGIN{RS="<tr "} /^id="/ { id=$0; sub(/^id="/,"",id); sub(/".*/,"",id); n=gsub(/<td>✓/,""); print id, n }')
if [[ -z "${live}" ]]; then
  echo "audit:spec-drift: extracted zero requirement rows — the page shape changed;" >&2
  echo "  that is itself drift: re-derive the extraction and re-map (#349 S2)" >&2
  exit 1
fi
pinned=$(grep -v "^#" slsa/spec-source-matrix.txt)
if ! diff <(sort <<< "${pinned}") <(sort <<< "${live}") > /dev/null; then
  echo "audit:spec-drift: the spec's requirement matrix moved:" >&2
  diff <(sort <<< "${pinned}") <(sort <<< "${live}") | sed "s/^/  /" >&2 || true
  echo "  re-map slsa/requirements.toml against the spec, then re-pin" >&2
  echo "  slsa/spec-source-matrix.txt (#349 S2, the #203 lesson)" >&2
  exit 1
fi
# COVERAGE, the half the comparison above cannot see (#123 finding 3).
# Comparing live against pinned notices when the SPEC moves; it can
# never notice a requirement the spec still has and slsa/requirements
# .toml never mapped — which is precisely what #349 finding 4 was, and
# this task's own comment used to claim it would have caught. It would
# not have. So assert the union of every source row's `spec_ids` plus
# the [[declined]] ids covers every id in the pin, and that no mapping
# names an id the pin does not have (a renamed anchor left behind).
command -v taplo > /dev/null || { echo "audit:spec-drift: taplo missing from the belt" >&2; exit 1; }
reqs=$(taplo get -f slsa/requirements.toml -o json)
mapped=$(jq -r '[(.source[]? | .spec_ids[]?), (.declined[]? | .spec_id)] | unique[]' <<< "${reqs}")
uncovered=""
while IFS= read -r id; do
  [[ -n "${id}" ]] || continue
  grep -qxF "${id}" <<< "${mapped}" || uncovered="${uncovered} ${id}"
done < <(awk '{print $1}' <<< "${pinned}")
stale=""
while IFS= read -r id; do
  [[ -n "${id}" ]] || continue
  grep -qxF "${id}" <<< "$(awk '{print $1}' <<< "${pinned}")" || stale="${stale} ${id}"
done <<< "${mapped}"
if [[ -n "${uncovered}" || -n "${stale}" ]]; then
  [[ -n "${uncovered}" ]] && {
    echo "audit:spec-drift: spec requirement(s) neither mapped nor declined:${uncovered}" >&2
    echo "  add spec_ids to the discharging [[source]] row, or a [[declined]]" >&2
    echo "  entry naming the decision — silence is the defect (#123 finding 3)" >&2
  }
  [[ -n "${stale}" ]] && {
    echo "audit:spec-drift: mapping names id(s) the spec does not have:${stale}" >&2
    echo "  an anchor was renamed or removed; re-map against the live page" >&2
  }
  exit 1
fi
echo "audit:spec-drift: $(wc -l <<< "${pinned}" | tr -d ' ') requirement(s), matrix unchanged, all covered"
'''

[tasks."fix:tracks"]
description = "Render the four track tables from slsa/*.toml into their documents"
dir = "{{cwd}}"
# S2 of #349: claims as data, prose rendered. The four tables other
# repos conform to — direction.md's track table and the three per-track
# mappings — render from slsa/levels.toml and slsa/requirements.toml
# between tracks:* markers, the fix:badges pattern. Edit the TOML, run
# this; lint:tracks reddens a hand-edited render. taplo emits the TOML
# as JSON and jq builds the rows: no hand parsing on either side.
run = '''
command -v taplo > /dev/null || { echo "fix:tracks: taplo missing from the belt" >&2; exit 1; }
render() { # doc, marker, header-row, jq-rows-program, json
  local doc="${1}" marker="${2}" header="${3}" prog="${4}" json="${5}" body
  body=$(jq -r "${prog}" <<< "${json}")
  # ENVIRON, not -v: BSD awk warns on newlines in -v strings.
  M="${marker}" HDR="${header}" BODY="${body}" awk '
    $0 == "<!-- tracks:" ENVIRON["M"] ":begin -->" {
      print; print ""; print ENVIRON["HDR"]; print ENVIRON["BODY"]; skip = 1; next
    }
    $0 == "<!-- tracks:" ENVIRON["M"] ":end -->" { print ""; skip = 0 }
    !skip { print }
  ' "${doc}" > "${doc}.tmp" && mv "${doc}.tmp" "${doc}"
}
levels=$(taplo get -f slsa/levels.toml -o json)
reqs=$(taplo get -f slsa/requirements.toml -o json)
render docs/direction.md direction \
  "$(printf '| Track | Ceiling | Status | Enforced by |\n| --- | --- | --- | --- |')" \
  '.track[] | "| \(.name) | \(.ceiling) | \(.status) | \(.enforced) |"' "${levels}"
render docs/source-track.md source \
  "$(printf '| Requirement | Level | Enforcement |\n| --- | --- | --- |')" \
  '.source[] | "| \(.requirement) | \(.level) | \(.enforcement) |"' "${reqs}"
render docs/build-track.md build \
  "$(printf '| Requirement | Discharged by |\n| --- | --- |')" \
  '.build[] | "| \(.requirement) | \(.discharged_by) |"' "${reqs}"
render docs/dependency-track.md dependency \
  "$(printf '| Level | Demands | Standing |\n| --- | --- | --- |')" \
  '.dependency[] | "| \(.level) | \(.demands) | \(.standing) |"' "${reqs}"
echo "fix:tracks: four tables rendered"
'''

[tasks."lint:tracks"]
description = "The rendered track tables equal what slsa/*.toml renders (drift is red)"
dir = "{{cwd}}"
# The lint half of fix:tracks, lint:badges-shaped: re-render into a
# copy and diff. A hand edit to a rendered table reddens here with the
# instruction to edit the data instead — which is what makes the TOML
# the single source the audits can trust. Deterministic; gate-eligible.
run = '''
[[ -f slsa/levels.toml && -d docs ]] || { echo "lint:tracks: no track data, skipped"; exit 0; }
tmp=$(mktemp -d)
cp -R docs "${tmp}/docs"
cp -R slsa "${tmp}/slsa"
(cd "${tmp}" && mise run fix:tracks > /dev/null 2>&1) || {
  echo "lint:tracks: the render itself failed — run fix:tracks for the error" >&2
  exit 1
}
drift=0
for doc in direction source-track build-track dependency-track; do
  diff -u "docs/${doc}.md" "${tmp}/docs/${doc}.md" || drift=1
done
if [[ ${drift} -ne 0 ]]; then
  echo "lint:tracks: a rendered table drifted from slsa/*.toml — edit the" >&2
  echo "  data and run fix:tracks; the table cells are render output (#349 S2)" >&2
  exit 1
fi
echo "lint:tracks: ok"
'''

[tasks."audit:release-tags"]
description = "Every release tag org-wide: mint tagger, signature from the epoch on, source link on the target (network, canon only)"
dir = "{{cwd}}"
# S4 of #349, mechanism now stele's tag audit (its
# docs/assert-policy-schema.md, tags section): for every release tag
# in every org repo, the tagger is the policy-declared minting role,
# the tag from the repo's signing epoch onward carries a gitsign
# signature verified NATIVELY against the trusted root (CMS over the
# tag payload — no gitsign binary here; the mint still uses its own),
# and the tag's target carries a source chain link. The epochs are
# policy data (slsa/assert-policy.json tags.epochs, absorbing the
# retired security/tag-signing-epoch.txt); the legacy bound is derived
# from the chain itself. GitHub's own verification field is still
# never consulted: it cannot judge x509-in-the-PGP-slot and would
# report every signed tag unsigned.
run = '''
[[ -d security ]] || { echo "audit:release-tags: not the canon, skipped"; exit 0; }
command -v gh > /dev/null || { echo "audit:release-tags: gh missing" >&2; exit 1; }
command -v stele > /dev/null || { echo "audit:release-tags: stele missing from the belt" >&2; exit 1; }
stele assert tags \
  --org monumental-archive \
  --policy slsa/assert-policy.json \
'''

[tasks."audit:drafts"]
description = "Every draft release org-wide explains itself — a burn, a rehearsal, or unexplained residue (network, canon only)"
dir = "{{cwd}}"
# #597. `release/tag-release.sh` cuts a draft at tag time and phase 2
# publishes it; anything that stops in between leaves the draft behind.
# The tag is immutable and the version spent — correctly burned — but
# the draft is outside that taxonomy and nothing counted it. Nothing
# NOTICED it either, and the reason is load-bearing: the evidence walk,
# the tag walk and `derive vex-subjects` all enumerate NON-DRAFT
# releases, and `gh release view` with no tag returns the latest
# PUBLISHED release, so a draft is invisible to every judgment the org
# makes — by coincidence of how those enumerations are written. Written
# down now (docs/release.md); this is the check that keeps the count
# from growing back while nobody is reading.
#
# Where the count came from is the argument for the audit: the issue
# that decided this build said four, counted by eye off the releases
# pages. There were thirty-two, across three repositories — the #305
# shape, an exception list an order of magnitude under its own
# population. Eyes do not enumerate; walks do.
#
# The finding is "unexplained", never "present": a draft is a legitimate
# state for as long as a release is in flight, and a rehearsal
# (`dry-run: true`) leaves one deliberately and forever. Both write a
# `<!-- draft-record: -->` marker at the moment their reason is known —
# the burn from publish.yml's burn-record job, the rehearsal from
# attach-release.yml — so what is left over is exactly the residue
# nobody can classify by looking.
#
# The 24h grace is the org's staleness grace (#310 finding 1), reused
# rather than reinvented: the record is written seconds after the
# failure, and the longest full-width publish is well under an hour, so
# a day is generous past every legitimate in-flight draft and still
# catches residue on the next Monday cron.
#
# The record's `Fixed forward in:` line is deliberately NOT required.
# The fix has not been cut when the burn is recorded, so requiring it
# would make this audit red until a human types something — red by
# default, which is the state that trains people to ignore a check.
run = '''
[[ -d security ]] || { echo "audit:drafts: not the canon, skipped"; exit 0; }
command -v gh > /dev/null || { echo "audit:drafts: gh missing" >&2; exit 1; }
if ! population=$(gh api "orgs/monumental-archive/repos" --paginate \
  --jq '.[] | select(.archived or .fork | not)
        | [.name, ((.permissions.push // false) | tostring)] | @tsv' 2> /dev/null); then
  echo "audit:drafts: could not enumerate the org's repositories — no population, no audit" >&2
  exit 1
fi
[[ -n "${population}" ]] || {
  echo "audit:drafts: the org listing named zero repositories — the walk is broken, not the org" >&2
  exit 1
}
# THE BLINDNESS GUARD, and it is the whole reason this task can be
# trusted. GitHub serves draft releases only to push-capable identities:
# a read-only token gets 200 and a list with every draft silently
# removed — indistinguishable from a clean org, which is the exact
# "reads nothing, reports clean" shape #240/#310 exist to refuse. So
# push capability is asserted per repo BEFORE any listing is believed,
# from the same call that names the population, and a repo the token
# cannot see into is a refusal rather than a pass.
blind=""
repos=""
while IFS=$'\t' read -r name push; do
  [[ -n "${name}" ]] || continue
  if [[ "${push}" != "true" ]]; then
    blind="${blind} ${name}"
    continue
  fi
  repos="${repos} ${name}"
done <<< "${population}"
if [[ -n "${blind}" ]]; then
  echo "audit:drafts: the token is not push-capable on:${blind}" >&2
  echo "  GitHub lists draft releases only to push-capable identities, so an" >&2
  echo "  empty listing there would prove nothing. Refusing to judge blind." >&2
  echo "  Wire a token with push access to every org repo (audit.yml uses the" >&2
  echo "  environment-scoped AUDIT_TOKEN for exactly this class of read)." >&2
  exit 1
fi
now=$(date -u +%s)
cutoff=$((now - 86400))
unexplained=""
drafts=0
recorded=0
young=0
walked=0
for repo in ${repos}; do
  # Read whole, never piped into a reader that closes early: gh
  # --paginate dies on SIGPIPE (the audit:source-vsa lesson). An errored
  # listing refuses; it is never read as "this repo has no drafts".
  if ! listing=$(gh api "repos/monumental-archive/${repo}/releases" --paginate --jq '
      .[] | select(.draft)
      | [.tag_name, (.created_at | fromdateiso8601 | tostring),
         (((.body // "") | contains("<!-- draft-record:")) | tostring)]
      | @tsv' 2> /dev/null); then
    echo "audit:drafts: could not list ${repo}'s releases — unreadable is never clean" >&2
    exit 1
  fi
  walked=$((walked + 1))
  while IFS=$'\t' read -r tag created marked; do
    [[ -n "${tag}" ]] || continue
    drafts=$((drafts + 1))
    if [[ "${marked}" == "true" ]]; then
      recorded=$((recorded + 1))
      continue
    fi
    if [[ "${created}" -ge "${cutoff}" ]]; then
      # In flight, or too fresh to judge. Not a finding.
      young=$((young + 1))
      continue
    fi
    age=$(((now - created) / 86400))
    unexplained="${unexplained}
  ${repo}@${tag} — draft for ${age}d, no draft-record"
  done <<< "${listing}"
done
if [[ -n "${unexplained}" ]]; then
  echo "audit:drafts: ${walked} repo(s) walked, drafts that explain nothing:${unexplained}" >&2
  echo "  a draft nobody can classify by looking is why this check exists (#597)." >&2
  echo "  Record it — do not delete it: the draft is the only artifact of a" >&2
  echo "  failed attempt other than run logs, which expire at 90 days." >&2
  echo "    REPO=monumental-archive/<repo> TAG=<vX.Y.Z> KIND=burn \\" >&2
  echo "      RUN_URL=<the run that burned it> release/record-draft.sh" >&2
  exit 1
fi
echo "audit:drafts: ${walked} repo(s) walked, ${drafts} draft(s): ${recorded} recorded, ${young} in flight"
'''

[tasks."audit:citations"]
description = "Every version and workflow-run citation in docs/ resolves against a real tag or run (network, canon only)"
dir = "{{cwd}}"
# S2's cheap leg (#349): the docs cited "lab v0.19.1, which it blocked"
# for a tag that never existed, and the error survived two audits
# because checking a citation meant a human resolving it by hand
# (finding 2). This resolves every vX.Y.Z and every Actions run URL in
# docs/ against the live org — a fabricated or mistyped citation is a
# red Monday, not a reading exercise. Versions are matched against the
# union of all org repos' tags: a docs citation rarely names its repo
# inline, and the failure mode being guarded is a version that exists
# NOWHERE. Path-shaped matches (URLs like openvex.dev/ns/v0.2.0) are
# not citations and are excluded by the leading boundary. Three more
# non-citation shapes, each measured on this tree: a version inside
# double quotes is a MENTION (the corrected "v0.19.1" prose names the
# wrong tag deliberately), a version with a suffix is an example
# (v9.9.9-negative-test), and "schema vX.Y.Z" names a third-party
# schema, not an org release.
run = '''
[[ -d docs && -d security ]] || { echo "audit:citations: not the canon, skipped"; exit 0; }
command -v gh > /dev/null || { echo "audit:citations: gh missing" >&2; exit 1; }
if ! repos=$(gh api "orgs/monumental-archive/repos" --paginate --jq '.[].name' 2> /dev/null); then
  echo "audit:citations: could not enumerate org repos — nothing was resolved" >&2
  exit 1
fi
tags=""
for repo in ${repos}; do
  t=$(git ls-remote --tags "https://github.com/monumental-archive/${repo}" "v[0-9]*" 2> /dev/null \
    | sed -n "s|.*refs/tags/\(v[0-9][0-9.]*\)$|\1|p") || true
  tags="${tags}
${t}"
done
fail=""
# `|| true` on both collectors, and it is not a shrug: grep exits 1 for
# "matched nothing", which is a legitimate answer here — docs citing no
# versions, or no Actions runs, is a state this audit must survive rather
# than crash on. Under the belt's `-o pipefail` shell that 1 would kill
# the task. Load-bearing for the run-URL collector especially: it matches
# nothing on this tree today, which is exactly how the strict shell
# surfaced it (#82 finding 2).
cited=$(git ls-files ':!vendor/**' "docs/*.md" | xargs grep -h -E "v[0-9]+\.[0-9]+\.[0-9]+" \
  | grep -v "schema v[0-9]" \
  | grep -hoE "(^|[^/\"A-Za-z0-9.])v[0-9]+\.[0-9]+\.[0-9]+($|[^-A-Za-z0-9])" \
  | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | sort -uV) || true
vn=0
while IFS= read -r v; do
  [[ -n "${v}" ]] || continue
  vn=$((vn + 1))
  grep -qxF "${v}" <<< "${tags}" || fail="${fail}
  version cited in docs/ exists as a tag in no org repo: ${v}"
done <<< "${cited}"
runs=$(git ls-files ':!vendor/**' "docs/*.md" \
  | xargs grep -hoE "github\.com/monumental-archive/[A-Za-z0-9._-]+/actions/runs/[0-9]+" | sort -u) || true
rn=0
while IFS= read -r r; do
  [[ -n "${r}" ]] || continue
  rn=$((rn + 1))
  repo=$(cut -d/ -f3 <<< "${r}")
  id=$(cut -d/ -f6 <<< "${r}")
  gh api "repos/monumental-archive/${repo}/actions/runs/${id}" --jq .id > /dev/null 2>&1 \
    || fail="${fail}
  run URL cited in docs/ does not resolve: https://${r}"
done <<< "${runs}"
if [[ -n "${fail}" ]]; then
  echo "audit:citations: citations that resolve to nothing:${fail}" >&2
  echo "  a citation is a claim about the record — correct the document" >&2
  echo "  or the record, never leave them disagreeing (#349 finding 2)" >&2
  exit 1
fi
echo "audit:citations: ${vn} version(s) and ${rn} run URL(s) all resolve"
'''

[tasks."audit:adoption"]
description = "Every org repo carries every required governance artifact, or opts out in writing (network, canon only)"
dir = "{{cwd}}"
# S7 of #349: #266's population rule applied to every per-repo
# obligation instead of one. audit:source-vsa enumerates chains;
# nothing enumerated the rest — which is how the signer carried no
# audit stub and nobody noticed until a capstone audit read the org by
# hand (finding 8). The population is the org's non-archived, non-fork
# repos; the obligations are the stub set the runbook wires; a repo
# excused from one names itself in security/adoption-optout.txt as
# "repo artifact reason". Absence plus silence is the only red state —
# "deliberate" survives as a written exception, never as a gap.
# The canon's self-* variants and gate.yml satisfy the same
# obligations under their canonical alternate names.
run = '''
[[ -d security ]] || { echo "audit:adoption: not the canon, skipped"; exit 0; }
command -v gh > /dev/null || { echo "audit:adoption: gh missing" >&2; exit 1; }
if ! repos=$(gh api "orgs/monumental-archive/repos" --paginate \
  --jq '.[] | select(.archived or .fork | not) | .name' 2> /dev/null); then
  echo "audit:adoption: could not enumerate the org's repositories — no population, no audit" >&2
  exit 1
fi
optout="security/adoption-optout.txt"
fail=""
checked=0
for repo in ${repos}; do
  if ! files=$(gh api "repos/monumental-archive/${repo}/contents/.github/workflows" \
    --jq '.[].name' 2> /dev/null); then
    fail="${fail}
  ${repo}: could not read .github/workflows — unreadable is not adopted"
    continue
  fi
  # The versioned archetype is proven by CONSEQUENCE, not by config: a
  # repository carrying v* tags has released, so it owes the release
  # machinery. cliff.toml was the old marker and retired with git-cliff
  # (#505) — which silently switched this obligation OFF for the canon
  # the moment that file went, the exact "a check nobody runs" shape
  # #354 exists to prevent. Tags cannot be deleted to escape the check
  # (org-default-tag protects them), and a versioned repo that loses
  # release.yml entirely is now caught, which the file marker never did.
  # Read whole, never piped into grep -q: gh --paginate dies on SIGPIPE
  # when the reader closes early (the audit:source-vsa lesson).
  tags=$(gh api "repos/monumental-archive/${repo}/tags" --paginate --jq '.[].name' 2> /dev/null || true)
  releases=false
  if grep -qE '^v[0-9]' <<< "${tags}"; then
    releases=true
  fi
  # artifact spec: name = acceptable workflow filenames (| separated)
  set -- "ci=ci.yml|gate.yml" "audit=audit.yml" "scorecard=scorecard.yml" \
    "source-attest=source-attest.yml" \
    "dependency-review=dependency-review.yml|self-dependency-review.yml"
  if [[ "${releases}" == true ]]; then
    set -- "$@" "release=release.yml|self-release.yml" "publish=publish.yml|self-publish.yml"
  fi
  for spec in "$@"; do
    artifact="${spec%%=*}"
    found=false
    IFS='|' read -ra names <<< "${spec#*=}"
    for f in "${names[@]}"; do
      grep -qxF "${f}" <<< "${files}" && found=true
    done
    checked=$((checked + 1))
    [[ "${found}" == true ]] && continue
    if [[ -f "${optout}" ]] && grep -qE "^${repo}[[:space:]]+${artifact}[[:space:]]+\S" "${optout}"; then
      continue
    fi
    fail="${fail}
  ${repo}: missing ${artifact} (no workflow named ${spec#*=}) and no opt-out row"
  done
done
if [[ -n "${fail}" ]]; then
  echo "audit:adoption: population gaps:${fail}" >&2
  echo "  wire the stub per docs/runbook.md, or record the exception in" >&2
  echo "  ${optout} as 'repo artifact reason' (#349 S7, the #266 rule)" >&2
  exit 1
fi
echo "audit:adoption: $(wc -w <<< "${repos}" | tr -d ' ') repo(s), ${checked} obligations, no silent gaps"
'''

[tasks."audit:signer-surface"]
description = "The signer's live allowlist equals the declared surface, and every declared type has a live caller (network, canon only)"
dir = "{{cwd}}"
# S5 of #349: the signing surface as data. The signer's case statement
# is the enforcement; security/signing-surface.toml is the declaration
# with a named caller per type; this leg reconciles the two against the
# LIVE signer file and the canon's tracked callers. Three reds, each a
# different defect: an allowlist arm with no declared row (undeclared
# capability), a declared row missing from the allowlist (the caller is
# about to break), and a declared row whose caller no longer requests
# the type (dead capability — finding 6's shape, now a Monday red
# instead of an audit's sharp eye). Reads fail closed and say so: a leg
# that cannot read the signer must not report agreement or drift.
run = '''
[[ -d security ]] || { echo "audit:signer-surface: not the canon, skipped"; exit 0; }
command -v gh > /dev/null || { echo "audit:signer-surface: gh missing" >&2; exit 1; }
if ! signer=$(gh api repos/monumental-archive/signer/contents/.github/workflows/sign.yml \
  -H "Accept: application/vnd.github.raw" 2> /dev/null); then
  echo "audit:signer-surface: could not read the signer's sign.yml — no comparison was made" >&2
  exit 1
fi
# The allowlist arms: URL-shaped case patterns inside the validate step.
live=$(grep -oE '^[[:space:]]+https://[^)]+\)' <<< "${signer}" \
  | sed 's|[[:space:]]*||; s|)$||' | sort -u)
declared=$(sed -n 's|^type = "\(.*\)"$|\1|p' security/signing-surface.toml | sort -u)
fail=""
while IFS= read -r t; do
  [[ -n "${t}" ]] || continue
  grep -qxF "${t}" <<< "${declared}" \
    || fail="${fail}
  allowlist arm has no declared row: ${t}"
done <<< "${live}"
while IFS= read -r t; do
  [[ -n "${t}" ]] || continue
  grep -qxF "${t}" <<< "${live}" \
    || fail="${fail}
  declared type is not on the signer's allowlist: ${t}"
done <<< "${declared}"
# Every declared row's caller exists and actually requests the type.
n=0
while IFS=$'\t' read -r t c; do
  [[ -n "${t}" ]] || continue
  n=$((n + 1))
  if [[ ! -f "${c}" ]]; then
    fail="${fail}
  declared caller does not exist: ${c} (for ${t})"
  elif ! grep -qF "predicate-type: ${t}" "${c}"; then
    fail="${fail}
  declared caller ${c} does not request ${t} — dead capability"
  fi
done < <(awk '
  /^type = / { gsub(/^type = "|"$/, ""); t = $0 }
  /^caller = / { gsub(/^caller = "|"$/, ""); printf "%s\t%s\n", t, $0 }
' security/signing-surface.toml)
[[ ${n} -gt 0 ]] || fail="${fail}
  signing-surface.toml declares no rows — an empty declaration declares nothing"
if [[ -n "${fail}" ]]; then
  echo "audit:signer-surface: the surface and its callers disagree:${fail}" >&2
  echo "  reconcile security/signing-surface.toml with the signer's case" >&2
  echo "  statement and the callers' predicate-type lines (#349 S5)" >&2
  exit 1
fi
echo "audit:signer-surface: ${n} declared type(s), allowlist and callers agree"
'''

[tasks."audit:fuzz"]
description = "Run every fuzz target for a bounded interval (network/time-bound, never the gate)"
dir = "{{cwd}}"
# The runtime half (#316), at cargo-fuzz's own defaults since #445:
# AddressSanitizer, which is what `-s address` means and what the tool
# does when you say nothing. The org ran `-s none` until 2026-08-16 —
# below the tool's DEFAULT, not merely below its maximum — because ASan
# needs `-Zsanitizer=address` and so a nightly toolchain, and the gate
# must not need one. Splitting the two halves settles it: the gate's
# lint:fuzz-build still proves targets COMPILE on the pinned stable with
# no sanitizer, while the sanitized run lives here, on the cron, outside
# the gate, in the repos that actually fuzz. `--careful` comes with it:
# std rebuilt with debug assertions and extra const-UB and init checks.
#
# WHAT THIS IS AND IS NOT. A bounded weekly run from a committed corpus
# is a smoke test, not a proof — fuzzing is sampling, and no arrangement
# of it is correct by construction. A campaign that accumulates would be
# standing infrastructure, which the org does not run by choice, so the
# corpus (fuzz/corpus/<target>/, committed) is curated by humans and the
# cron never pushes. docs/best-practices.md answers `dynamic_analysis`
# accordingly and refuses to claim it for a CI gate.
#
# The nightly is DECLARED by the repo, never discovered: a task that used
# ASan where a nightly happened to exist and fell back silently otherwise
# would vary its enforcement by machine, which is the failure this belt
# closes everywhere else.
run = '''
[[ -d fuzz && -f fuzz/Cargo.toml ]] || { echo "audit:fuzz: no fuzz/, skipped"; exit 0; }
command -v cargo-fuzz > /dev/null || { echo "audit:fuzz: cargo-fuzz missing (pin cargo:cargo-fuzz in mise.toml)" >&2; exit 1; }
if [[ -z "${FUZZ_TOOLCHAIN:-}" ]]; then
  echo "audit:fuzz: FUZZ_TOOLCHAIN is not declared — sanitized fuzzing needs a nightly toolchain" >&2
  echo "  AddressSanitizer is cargo-fuzz's default and needs -Zsanitizer, so stable cannot run it" >&2
  echo "  declare BOTH toolchains in this repo's mise.toml (mise holds and locks both):" >&2
  echo "    [tools]" >&2
  echo "    rust = [\"1.xx.x\", \"nightly-YYYY-MM-DD\"]" >&2
  echo "    [env]" >&2
  echo "    FUZZ_TOOLCHAIN = \"nightly-YYYY-MM-DD\"" >&2
  echo "  a dated nightly, never bare 'nightly' — a moving channel is not a pinned input" >&2
  exit 1
fi
if ! rustup toolchain list 2> /dev/null | grep -q "^${FUZZ_TOOLCHAIN}"; then
  echo "audit:fuzz: FUZZ_TOOLCHAIN='${FUZZ_TOOLCHAIN}' is declared but not installed" >&2
  echo "  it rides the rust pin in mise.toml so it installs before tasks run, never mid-run" >&2
  exit 1
fi
# --careful implies -Zbuild-std, which rebuilds the standard library from
# source and fails without rust-src. Asserted with a remedy rather than
# discovered halfway through a build, the llvm-tools/clippy pattern.
if ! rustup component list --installed --toolchain "${FUZZ_TOOLCHAIN}" 2> /dev/null | grep -q "^rust-src"; then
  echo "audit:fuzz: the nightly lacks rust-src, which --careful needs (it implies -Zbuild-std)" >&2
  echo "  components ride the pin, so declare them there rather than adding them by hand:" >&2
  echo "    rust = [\"1.xx.x\", { version = \"${FUZZ_TOOLCHAIN}\", components = \"rust-src\" }]" >&2
  exit 1
fi
secs="${FUZZ_SECONDS:-60}"
failed=""
while IFS= read -r target; do
  [[ -n "${target}" ]] || continue
  echo "audit:fuzz: ${target} for ${secs}s under AddressSanitizer (${FUZZ_TOOLCHAIN})"
  RUSTUP_TOOLCHAIN="${FUZZ_TOOLCHAIN}" cargo fuzz run -s address --careful "${target}" \
    -- -max_total_time="${secs}" || failed="${failed} ${target}"
done < <(cargo fuzz list)
if [[ -n "${failed}" ]]; then
  echo "audit:fuzz: crashing target(s):${failed}" >&2
  echo "  the reproducer is fuzz/artifacts/<target>/crash-<hash>, uploaded by repo-audit.yml" >&2
  echo "  replay it with: cargo fuzz run <target> fuzz/artifacts/<target>/crash-<hash>" >&2
  exit 1
fi
echo "audit:fuzz: all targets ran ${secs}s clean under ASan"
'''

[tasks."audit:go-fuzz"]
description = "Run every Go fuzz target for a bounded interval (time-bound, never the gate)"
dir = "{{cwd}}"
# The runtime half (#445), the Go mirror of audit:fuzz — and cheaper to
# stand up, because the fuzzing engine is in the toolchain: no extra
# binary, no sanitizer flag, and no nightly. Coverage instrumentation is
# built in on amd64 and arm64, which is every runner the org uses.
#
# `-fuzztime` is not optional: the documented default is to run FOREVER,
# so a task that forgot it would hang the cron rather than fail it. Two
# further defaults are deliberately left alone because they ARE the
# tool's maximum: minimization stays on (60s, and `-fuzzminimizetime 0`
# would disable it), and the package's ordinary tests still run before
# fuzzing begins, which is what stops the engine reporting what a unit
# test already covers.
#
# -fuzz matches exactly ONE target in ONE package per invocation, by
# design, so the loop is structural rather than a convenience.
#
# TWO passes per target, plain then race, rather than a choice between
# them. The race detector is Go's nearest equivalent to the
# AddressSanitizer the Rust half runs, but it costs 31x throughput
# (measured: 425,319 execs/sec against 13,605), and the two instruments
# find different things — the plain pass explores for panics and logic
# failures, the race pass observes concurrency in targets whose code is
# concurrent at all. Choosing one would drop a class of finding; the
# org's answer to instrumentation cost on a free weekly cron is more
# seconds, not fewer checks (#445, the --careful ruling). Wall time is
# 2 x FUZZ_SECONDS per target, which is a number, not a constraint.
#
# WHAT THIS IS AND IS NOT, as with the Rust half: a bounded weekly run is
# a smoke test, not a proof. What makes it worth running is where a
# finding LANDS — the engine writes the failing input into
# testdata/fuzz/<Target>/, and the gate's lint:go-fuzz-seeds replays it
# from then on. The cron finds it once; the committed corpus keeps it
# found. The cron never pushes: a machine-generated input is proposed to
# a human, never merged by one.
run = '''
set -euo pipefail
mods=$(git ls-files ':!vendor/**' "go.mod" "*/go.mod" "*/*/go.mod")
[[ -n "${mods}" ]] || { echo "audit:go-fuzz: no go.mod tracked, skipped"; exit 0; }
command -v go > /dev/null || {
  echo "audit:go-fuzz: go.mod present but go missing — pin go in mise.toml" >&2
  exit 1
}
secs="${FUZZ_SECONDS:-60}"
failed=""
ran=0
while IFS= read -r m; do
  [[ -n "${m}" ]] || continue
  d=$(dirname "${m}")
  while IFS= read -r pkg; do
    [[ -n "${pkg}" ]] || continue
    while IFS= read -r target; do
      [[ -n "${target}" ]] || continue
      ran=$((ran + 1))
      echo "audit:go-fuzz: ${target} in ${pkg} for ${secs}s, plain"
      (cd "${d}" && go test -fuzz "^${target}\$" -fuzztime "${secs}s" "${pkg}") \
        || failed="${failed} ${pkg}.${target}(plain)"
      echo "audit:go-fuzz: ${target} in ${pkg} for ${secs}s, race detector on"
      (cd "${d}" && CGO_ENABLED=1 go test -race -fuzz "^${target}\$" -fuzztime "${secs}s" "${pkg}") \
        || failed="${failed} ${pkg}.${target}(race)"
    done < <( (cd "${d}" && go test -list '^Fuzz' "${pkg}" 2> /dev/null) | grep '^Fuzz' || true)
  done < <( (cd "${d}" && go list ./... 2> /dev/null) || true)
done <<< "${mods}"
[[ "${ran}" -gt 0 ]] || { echo "audit:go-fuzz: no Go fuzz targets, skipped"; exit 0; }
if [[ -n "${failed}" ]]; then
  echo "audit:go-fuzz: crashing target(s):${failed}" >&2
  echo "  the failing input is named in the output above, under testdata/fuzz/<Target>/" >&2
  echo "  repo-audit.yml keeps it as an artifact; commit it and it becomes the regression" >&2
  exit 1
fi
echo "audit:go-fuzz: ${ran} target(s) ran ${secs}s clean"
'''

[tasks."lint:belt-available"]
description = "Every belt tool actually resolves — a missing belt must fail loudly, not lint nothing"
dir = "{{cwd}}"
# The belt arrives via MISE_GLOBAL_CONFIG_FILE in CI and a conf.d symlink
# locally. If either is absent, every guarded lint task "skips clean" and
# the gate goes green having checked nothing — the vacuous-success failure.
# This canary asserts the layer itself is present.
run = '''
# The belt's own location, exported once by [env] and used by every task
# that delivers a canon-owned config. Empty means the belt did not
# arrive, which is this canary's whole job to say (#445).
if [[ -z "${ORG_BELT_DIR:-}" || ! -f "${ORG_BELT_DIR}/config.toml" ]]; then
  echo "lint:belt-available: ORG_BELT_DIR is unset or not a canon tree" >&2
  echo "  CI: MISE_GLOBAL_CONFIG_FILE not set, or the canon checkout is missing" >&2
  echo "  locally: no ~/.config/mise/conf.d symlink into a canon checkout" >&2
  exit 1
fi
missing=""
for tool in actionlint shellcheck typos lefthook trivy zizmor committed taplo shfmt rumdl biome ruff jq pinact cargo-deny osv-scanner vexctl reuse golangci-lint; do
  command -v "${tool}" > /dev/null || missing="${missing} ${tool}"
done
if [[ -n "${missing}" ]]; then
  echo "lint:belt-available: belt tools missing:${missing}" >&2
  echo "  CI: MISE_GLOBAL_CONFIG_FILE not set or checkout missing" >&2
  echo "  locally: ~/.config/mise/conf.d symlink to the org belt is absent" >&2
  exit 1
fi
echo "lint:belt-available: ok"
'''

[tasks."lint:licence"]
description = "The repo carries its licence: tracked LICENSE or LICENSES/, and REUSE.toml's expression filled"
dir = "{{cwd}}"
# "Every repo carries its own" was a statement of intent that nothing
# implemented, and the predictable result was that no repo carried one
# (#214) — the same shape as the BuildEnv defect: a claim with no
# mechanism, believed because it was written down. This is the
# mechanism. The licence itself stays a per-repo choice (the canon is
# 0BSD; a crate repo will dual-license MIT OR Apache-2.0); what the
# belt enforces is only that the choice was MADE: a tracked licence
# text exists, and a tracked REUSE.toml does not still carry the
# scaffold's angle-bracket placeholder. Deterministic, offline,
# tracked files only. Skips only an empty tree — a repo with content
# and no licence is exactly the defect, never an exemption.
run = '''
[[ -n "$(git ls-files | head -1)" ]] || { echo "lint:licence: no tracked files, skipped"; exit 0; }
lic=$(git ls-files ':!vendor/**' "LICENSE" "LICENSE.*" "LICENSES/*")
if [[ -z "${lic}" ]]; then
  echo "lint:licence: no tracked LICENSE or LICENSES/ — every repo carries its own licence (#214)" >&2
  echo "  with no licence the default is all rights reserved, the opposite of the intent" >&2
  exit 1
fi
if git ls-files --error-unmatch "REUSE.toml" > /dev/null 2>&1 \
  && grep -q "<SPDX expression>" "REUSE.toml"; then
  echo "lint:licence: REUSE.toml still carries the scaffold's <SPDX expression> placeholder — pick the licence (#214)" >&2
  exit 1
fi
echo "lint:licence: ok"
'''

[tasks."lint:reuse"]
description = "REUSE-spec compliance over tracked files (the lint api.reuse.software will run), pre-registration"
dir = "{{cwd}}"
# lint:licence proves a licence was CHOSEN; this proves the tree
# actually complies with the choice — the gap between the two shipped
# three defects past every existing check (#316): a per-file MIT header
# silently overriding a 0BSD tree, a CC0 header with no licence text,
# and the scaffold stub parsing as a real nested REUSE.toml. "Compliant
# at registration time" was an unenforced adjective; this is the
# audit-claims cure, same as lint:citation's. Scratch-tree
# materialisation (the lint:trivy pattern): reuse walks directories,
# and the working tree holds .org-toolbelt and build output it must
# never see. Deterministic, offline, gate-worthy. Guarded on a tracked
# root REUSE.toml — a repo that has not declared yet skips clean
# (lint:licence is what chases the declaration).
run = '''
git ls-files --error-unmatch "REUSE.toml" > /dev/null 2>&1 || {
  echo "lint:reuse: no tracked REUSE.toml, skipped"; exit 0
}
scratch=$(mktemp -d)
trap 'rm -rf "${scratch}"' EXIT
git ls-files -z | rsync -a0 --files-from=- . "${scratch}"
reuse --root "${scratch}" lint
'''

[tasks."fix:citation"]
description = "Render CITATION.cff from REUSE.toml (licence, authors, repository) plus the preserved human fields"
dir = "{{cwd}}"
# CFF has no extends:, so shared has to mean DERIVED (#316 findings 1+6,
# one fix): REUSE.toml is the single root for licence and authorship,
# and every field of CITATION.cff except two is a fact read from it or a
# constant. The two human fields — title, and the concept-DOI identifier
# recorded after the first mint — are preserved on regeneration, as are
# version and date-released, which release/prepare-release.sh stamps.
# mint-doi.yml reads the rendered file for licence and creators, so the
# permanent record can no longer contradict the tree that produced it
# (the v0.22.1 sandbox record said MIT for a 0BSD repo, credited to a
# machine account — both fields were fallbacks nothing checked).
# CITATION_OUT overrides the output path; lint:citation renders through
# it to prove the committed file agrees without writing the tree.
#
# authors is the one field that is a claim about people rather than a
# fact about a tree: derived from SPDX-PackageSupplier, honest at one
# maintainer, and wants a real answer at two — the bus_factor wall.
run = '''
out="${CITATION_OUT:-CITATION.cff}"
[[ -f REUSE.toml ]] || { echo "fix:citation: no REUSE.toml, nothing to derive from"; exit 0; }
lic=$(grep -h "SPDX-License-Identifier" REUSE.toml | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' | sort -u)
if [[ -z "${lic}" || "${lic}" == "<SPDX expression>" ]]; then
  echo "fix:citation: REUSE.toml declares no licence expression — fill it first (lint:licence)" >&2
  exit 1
fi
if [[ "$(wc -l <<< "${lic}" | tr -d " ")" != "1" ]]; then
  echo "fix:citation: REUSE.toml carries more than one licence expression — one citation cannot state two:" >&2
  echo "${lic}" >&2
  exit 1
fi
supplier=$(grep "^SPDX-PackageSupplier" REUSE.toml | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
person="${supplier%% <*}"
if [[ -z "${person}" ]]; then
  echo "fix:citation: REUSE.toml carries no SPDX-PackageSupplier — the citation needs an author" >&2
  exit 1
fi
family="${person##* }"
given="${person% "${family}"}"
repo_url=$(grep "^SPDX-PackageDownloadLocation" REUSE.toml | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
[[ -n "${repo_url}" ]] || { echo "fix:citation: REUSE.toml carries no SPDX-PackageDownloadLocation" >&2; exit 1; }
title="${repo_url##*/}"; version="0.0.0"; released=$(git log -1 --format=%cs 2> /dev/null || date -u +%F)
concept=""
if [[ -f CITATION.cff ]]; then
  t=$(sed -n "s/^title: //p" CITATION.cff | head -1); [[ -n "${t}" ]] && title="${t}"
  v=$(sed -n "s/^version: //p" CITATION.cff | head -1); [[ -n "${v}" ]] && version="${v}"
  d=$(sed -n 's/^date-released: "\{0,1\}\([0-9-]*\)"\{0,1\}$/\1/p' CITATION.cff | head -1); [[ -n "${d}" ]] && released="${d}"
  concept=$(awk '/^identifiers:/{f=1} f && /value:/{print $NF; exit}' CITATION.cff)
fi
{
  echo "# Derived file (#316): fix:citation renders licence, authors and"
  echo "# repository-code from REUSE.toml; the release pipeline stamps"
  echo "# version and date-released; title and the concept-DOI identifier"
  echo "# are the two human fields, preserved on regeneration."
  echo "# lint:citation reddens hand drift. Edit REUSE.toml, not this."
  echo "cff-version: 1.2.0"
  echo "message: If you use this software, please cite it using these metadata."
  echo "title: ${title}"
  echo "type: software"
  echo "authors:"
  echo "  - family-names: ${family}"
  echo "    given-names: ${given}"
  echo "repository-code: ${repo_url}"
  echo "license: ${lic}"
  echo "version: ${version}"
  # Unquoted deliberately: release/prepare-release.sh's sed rewrites the
  # whole line unquoted at every release, and the render must byte-match
  # what the stamper writes or lint:citation reddens every release PR
  # (measured on canon v1.20.0's).
  echo "date-released: ${released}"
  if [[ -n "${concept}" ]]; then
    echo "identifiers:"
    echo "  - type: doi"
    echo "    value: ${concept}"
    echo "    description: The concept DOI of the software."
  fi
} > "${out}"
echo "fix:citation: rendered ${out} (licence ${lic}, author ${person})"
'''

[tasks."lint:citation"]
description = "CITATION.cff agrees with its sources, and a DOI-minting repo carries one"
dir = "{{cwd}}"
# The enforcement half of the derivation (#316 finding 6): "citable" was
# an unenforced adjective — release-lab passed mint-doi: true with no
# CITATION.cff and every layer degraded quietly (the stub lint never
# looked, prepare-release.sh skipped its stamping, mint-doi fell back to
# crediting the machine account). Three silent skips and a published
# record wrong twice over. This lint is the audit-claims contract
# applied here: a repo whose release stub requests DOI minting MUST
# carry the file, and a carried file MUST byte-equal what fix:citation
# renders from its sources. Deterministic, tracked files only, skips
# clean where neither condition applies — a linter that cannot skip
# cannot be universal.
run = '''
minting=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml" | xargs grep -lE "^[^#]*mint-doi:[[:space:]]*true" 2> /dev/null || true)
if [[ ! -f CITATION.cff ]]; then
  if [[ -n "${minting}" ]]; then
    echo "lint:citation: mint-doi: true with no CITATION.cff — a citable repo carries its citation (#316 finding 6):" >&2
    echo "${minting}" >&2
    echo "  run fix:citation (REUSE.toml is the source), commit the render" >&2
    exit 1
  fi
  echo "lint:citation: no CITATION.cff and no mint-doi request, skipped"; exit 0
fi
if [[ ! -f REUSE.toml ]]; then
  echo "lint:citation: CITATION.cff exists but REUSE.toml (its source of truth) does not" >&2
  exit 1
fi
tmp=$(mktemp)
trap 'rm -f "${tmp}"' EXIT
CITATION_OUT="${tmp}" mise run fix:citation > /dev/null
if ! diff -u CITATION.cff "${tmp}"; then
  echo "lint:citation: CITATION.cff drifted from its sources — edit REUSE.toml (or the human fields) and run fix:citation" >&2
  exit 1
fi
echo "lint:citation: CITATION.cff agrees with REUSE.toml"
'''

[tasks."fix:badges"]
description = "Render the README badge block from the repository's own tree facts (derive, never assert)"
dir = "{{cwd}}"
# The canon is consumer #1 (#316 finding 5 and its working session):
# it publishes badge machinery it must itself consume, and the badge
# block is where that law was broken — a hand-authored block drifted
# five shields wide from the template it shipped, with nothing able to
# notice. So the block is now COMPUTED: every shield is a fact about
# the tree (the gate → workflow status; scorecard.yml → Scorecard; the
# publish stub's classes → registry shields; CITATION.cff's concept
# DOI → the DOI shield; direction.md's tracks → the three SLSA
# shields), and the only hand-maintained state is .badge-states — the
# written-down-debt pattern — naming what waits on a human step
# (`bestpractices pending` → `bestpractices <BP_ID>`, `reuse pending`
# → `reuse registered`). The coverage shield is not stateful: it
# renders iff `.coverage-floor` exists, so a repo that cannot measure
# coverage simply has no coverage shield rather than a declared one
# over no data (#347). If a
# repo's render needs an `if repo == .github` branch, the design is
# wrong — there is none. fair-software is computed from the other
# shields' truth, dot by dot, never the static 5/5 image (#316).
# Renders between `badges:begin`/`badges:end` markers in README.md;
# BADGES_OUT renders the block alone to a path, for lint:badges.
run = '''
set -euo pipefail
# From the belt, like every other canon-owned input (#445). This used
# to try mise/ then .org-canon/ and SKIP CLEAN when it found neither,
# so a consumer clone rendered nothing and said so in a line nobody
# reads, while lint:badges below asserted nothing and reported a pass
# (#568). ORG_BELT_DIR resolves in both worlds, which makes the
# degraded state unrepresentable rather than detected: there is no
# "no canon tree" branch left to get wrong.
"${ORG_BELT_DIR}/derive-badges.sh"
'''

[tasks."lint:bestpractices"]
description = "`.bestpractices.json` uses key names the badge app accepts; repos without one skip clean"
dir = "{{cwd}}"
# The regression guard for a failure that was invisible for a day. The
# badge app builds its input whitelist from the criteria YAML keys —
# ALL_CRITERIA_STATUS = Criteria.all.map(&:status), so
# :osps_ac_01_01_status — while `projects/<id>.json` renders the display
# ID, OSPS-AC-01.01_status. A file built by editing that download keys
# every Baseline criterion the wrong way;
# CriterionFieldValidator.validate_field_name returns nil on a miss and
# RepoJsonDetective does `next unless field_sym`, so all 64 are skipped
# with no error and the metal series fills normally. Both of this org's
# files shipped that way.
#
# Deterministic and offline, so gate-legal: it greps for the display-ID
# key form and checks the size cap. It deliberately does NOT validate
# JSON syntax, status enums or the 8192-char justification limit — that
# needs a JSON parser, and jq is not a pinned belt tool (it appears only
# in network-bound tasks that run on a runner). Those limits are
# documented in docs/best-practices.md; this guards the one failure that
# is silent.
run = '''
files=$(git ls-files ':!vendor/**' ".bestpractices.json" "*/.bestpractices.json" ".project.d/bestpractices.json")
[[ -n "${files}" ]] || { echo "lint:bestpractices: no .bestpractices.json, skipped"; exit 0; }

rc=0
while IFS= read -r f; do
  bad=$(grep -o '"OSPS-[A-Z][A-Z]-[0-9][0-9]\.[0-9][0-9]_[a-z]*"' "${f}" | sort -u || true)
  if [[ -n "${bad}" ]]; then
    echo "lint:bestpractices: ${f}: display-ID keys the badge app silently drops:" >&2
    sed 's/^/  /' <<< "${bad}" >&2
    echo "  use the criteria YAML key form instead: osps_ac_01_01_status" >&2
    rc=1
  fi
  size=$(wc -c < "${f}")
  if (( size > 100000 )); then
    echo "lint:bestpractices: ${f}: ${size} bytes exceeds MAX_FILE_SIZE (100000);" >&2
    echo "  the app checks the size before downloading and skips the file entirely" >&2
    rc=1
  fi
done <<< "${files}"

(( rc == 0 )) && echo "lint:bestpractices: $(wc -l <<< "${files}") file(s) clean"
exit "${rc}"
'''

[tasks."lint:badges"]
description = "The README badge block equals what fix:badges derives — asserted shields cannot drift from tree facts"
dir = "{{cwd}}"
# The enforcement half: a badge block that can only exist as
# fix:badges' output cannot silently disagree with the repository it
# describes, which retires both halves of #316 finding 5 — the canon's
# five-shield drift (hand-authored block beside a published template)
# and audit:badges' presence-blindness (a missing shield now means the
# derivation said it does not apply, because nothing else can produce
# the block). Repos without the markers skip clean — adoption is a
# per-repo step the Monday audit reports on org-wide.
run = '''
[[ -f README.md && -f REUSE.toml ]] || { echo "lint:badges: no README or REUSE.toml, skipped"; exit 0; }
if ! grep -q "<!-- badges:begin -->" README.md; then
  echo "lint:badges: no badges:begin marker, machinery not adopted here yet, skipped"; exit 0
fi
tmp=$(mktemp)
trap 'rm -f "${tmp}" "${tmp}.cur"' EXIT
# The derivation is invoked directly, never via `mise run fix:badges`: a
# nested mise inside a task races the parallel lint fan-out and fails to
# resolve its own lockfile, which made `mise run ci` unrunnable locally
# and forced --no-verify on every push (#82).
# From the belt (#445), never a two-branch probe: the old resolution
# skipped clean in any consumer clone, so a local `mise run ci` omitted
# the badge assertion entirely and passed (#568).
BADGES_OUT="${tmp}" "${ORG_BELT_DIR}/derive-badges.sh" > /dev/null
awk '/<!-- badges:begin -->/{f=1; next} /<!-- badges:end -->/{f=0} f' README.md > "${tmp}.cur"
if ! diff -u "${tmp}.cur" "${tmp}"; then
  echo "lint:badges: the badge block drifted from the tree's facts — run fix:badges and commit the render" >&2
  exit 1
fi
echo "lint:badges: badge block agrees with the derivation"
'''

[tasks."lint:release-stub"]
description = "A versioned repo carries the canonical release stubs (release.yml implies publish.yml)"
dir = "{{cwd}}"
# The versioned archetype is two files: release.yml, publish.yml — and
# the registries pin the publish.yml FILENAME, so a missing or renamed
# stub breaks trusted publishing with nothing local going red.
# release.yml is the archetype marker: continuous repositories do not
# have one and skip clean. (cliff.toml was the old marker; it retired
# with git-cliff — stele derive carries the conventions in the shared
# scripts, .github#505.)
run = '''
[[ -f .github/workflows/release.yml ]] || { echo "lint:release-stub: no release.yml, not a versioned repo, skipped"; exit 0; }
bad=""
for f in .github/workflows/release.yml .github/workflows/publish.yml; do
  if [[ ! -f "${f}" ]]; then
    bad="${bad} ${f}(missing)"
  # In the canon itself these two files ARE the reusable implementations
  # (they declare workflow_call), not caller stubs; the canon's wiring is
  # self-release.yml's local `uses:`, exercised on every push to main.
  elif grep -qE "^[[:space:]]+workflow_call:" "${f}"; then
    continue
  elif ! grep -qE "uses: monumental-archive/.github/.github/workflows/(release|publish)\.yml@[0-9a-f]{40}|uses: \./\.github/workflows/(release|publish)\.yml" "${f}"; then
    bad="${bad} ${f}(no pinned org uses)"
  fi
done
if [[ -n "${bad}" ]]; then
  echo "lint:release-stub: versioned repo with broken release stubs:${bad}" >&2
  echo "  copy scaffold/ from monumental-archive/.github; the publish.yml filename is load-bearing" >&2
  exit 1
fi
echo "lint:release-stub: ok"
'''

[tasks."lint:toolbelt-lock"]
description = "Every pinned tool has a locked entry (mise config vs mise.lock)"
dir = "{{cwd}}"
# Renovate can bump a version line but cannot always refresh the lock:
# `mise lock` is an unsafe execution, and `allowedUnsafeExecutions` is a
# self-hosted-only setting we do not control on the hosted App. A pin that
# moves while its checksums stay behind is what this catches, and it fails
# the pull request rather than installing something unverified.
run = '''
cfg=""
for c in mise/config.toml mise.toml .mise.toml; do
  [[ -f "${c}" ]] && { cfg="${c}"; break; }
done
[[ -n "${cfg}" ]] || { echo "lint:toolbelt-lock: no mise config, skipped"; exit 0; }
lock="mise.lock"
[[ "${cfg}" == */* ]] && lock="${cfg%/*}/mise.lock"
[[ -f "${lock}" ]] || { echo "lint:toolbelt-lock: no ${lock}, skipped"; exit 0; }
# Anchored at column 0, because a tool may be pinned as an ARRAY of
# versions — `rust = [{ version = "1.97.1", ... }, "nightly-..."]`, which
# is how a repo declares a second toolchain for audit:fuzz (#445). taplo
# indents those entries, so an unanchored `cut -d= -f1` read each one as
# a tool named `{version` and reported them missing from the lock. Found
# by release-lab being the first repo to use the form.
keys=$(sed -n "/^\\[tools\\]/,/^\\[/p" "${cfg}" | grep -E "^\"?[A-Za-z0-9_:./@-]+\"?[[:space:]]*=" | cut -d= -f1 | tr -d " \"")
# A verification loop that processes zero items and reports success is the
# check announcing that it checked nothing. Fail instead.
[[ -n "${keys}" ]] || { echo "lint:toolbelt-lock: no tools parsed from ${cfg}" >&2; exit 1; }
missing=""
while IFS= read -r k; do
  [[ -n "${k}" ]] || continue
  grep -qxF "[[tools.\"${k}\"]]" "${lock}" && continue
  grep -qxF "[[tools.${k}]]" "${lock}" && continue
  missing="${missing} ${k}"
done <<< "${keys}"
if [[ -n "${missing}" ]]; then
  echo "lint:toolbelt-lock: ${cfg} pins tools absent from ${lock}:${missing}" >&2
  exit 1
fi
echo "lint:toolbelt-lock: $(wc -w <<< "${keys}" | tr -d " ") tools locked in ${lock}"
'''

[tasks."lint:nested-permissions"]
description = "Every nested `uses:` job states its permissions (startup_failure trap)"
dir = "{{cwd}}"
# The trap, measured rather than read: a `uses:` job with no `permissions:`
# block inherits the WORKFLOW-level default of the file it is written in —
# not the grant its caller made. So `permissions: {}` at the top of a shared
# workflow, which is correct practice and which this org applies everywhere,
# silently starves every nested call beneath it. The callee then requests
# more than its calling job holds, which is an elevation, and the run dies as
# `startup_failure` with no jobs, no annotations and no log.
#
# Nothing else catches it. actionlint, zizmor --persona=pedantic and
# lint:capability-boundary all pass on the broken file, because each is
# correct in isolation and the contract spans two workflows.
#
# Scoped to workflow_call files: in an ordinary workflow the caller IS the
# top level, so omitting permissions there is merely the usual default.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:nested-permissions: no workflows, skipped"; exit 0
}
bad=""
checked=0
for f in .github/workflows/*.y*ml; do
  # Any file with a `uses:` job — reusable workflows AND caller stubs.
  # The trap is identical in both: a `uses:` job with no `permissions:`
  # block takes the WORKFLOW-level default, never the caller's grant.
  # Scoping this to workflow_call files missed every caller stub, which
  # is exactly where the grant has to be written — and a shared workflow
  # that gains a permission breaks all of its callers at once, silently.
  grep -qE "^    uses:" "${f}" || continue
  checked=$((checked + 1))
  offenders=$(awk '
    /^jobs:[[:space:]]*$/ { injobs = 1; next }
    injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ {
      if (job != "" && uses && !perms) print job
      job = $1; sub(/:$/, "", job); uses = 0; perms = 0; next
    }
    injobs && /^    uses:/ { uses = 1 }
    injobs && /^    permissions:/ { perms = 1 }
    END { if (job != "" && uses && !perms) print job }
  ' "${f}")
  for j in ${offenders}; do bad="${bad} ${f}:${j}"; done
done
if [[ -n "${bad}" ]]; then
  echo "lint:nested-permissions: nested uses: job with no permissions block:" >&2
  for b in ${bad}; do echo "  ${b}" >&2; done
  echo "  it inherits the workflow-level default, not the caller grant —" >&2
  echo "  state exactly what the called workflow needs, or the run dies as" >&2
  echo "  startup_failure with no jobs and no log." >&2
  exit 1
fi
echo "lint:nested-permissions: ${checked} workflow(s) with uses: jobs clean"
'''

[tasks."lint:audit-scheduled"]
description = "Every audit:* task has a workflow that runs it (a check nobody runs is no check)"
dir = "{{cwd}}"
# Seam 1 of #358: which audit legs run was one fact derived at two sites
# — the task list here and the job list in audit.yml — with no join.
# Both `audit:release-tags` and `audit:spec-drift` shipped as tasks,
# were cited in prose as enforcing, and NO workflow ran either (#354,
# fixed #356). This is the join: red on any audit:* task with no
# `mise run audit:<name>` occurrence anywhere in .github/workflows/.
# Deliberately no opt-out row — an unscheduled audit task IS the
# defect; a task nobody should run should not exist. Linted, not
# generated: generating audit.yml from the task list would mean
# templating workflow YAML, and audit legs legitimately carry per-leg
# permissions and env the task list cannot express.
run = '''
[[ -f mise/config.toml ]] || { echo "lint:audit-scheduled: not the canon, skipped"; exit 0; }
bad=""
count=0
for t in $(grep -oE '^\[tasks\."audit:[a-z-]+"\]' mise/config.toml | sed 's/^\[tasks\."audit:\(.*\)"\]$/\1/'); do
  count=$((count + 1))
  grep -rEq "mise run audit:${t}([^a-z-]|$)" .github/workflows/ \
    || bad="${bad} audit:${t}"
done
[[ ${count} -gt 0 ]] || { echo "lint:audit-scheduled: zero audit tasks enumerated — the grep is broken" >&2; exit 1; }
if [[ -n "${bad}" ]]; then
  echo "lint:audit-scheduled: audit task(s) no workflow ever runs:${bad}" >&2
  echo "  schedule each in .github/workflows/ (audit.yml, publish.yml or" >&2
  echo "  repo-audit.yml) or delete the task — a check nobody runs is a" >&2
  echo "  claim, not a check (#358 seam 1)." >&2
  exit 1
fi
echo "lint:audit-scheduled: ${count} audit task(s), every one scheduled"
'''

[tasks."lint:caller-permissions"]
description = "Every caller of a workflow_call workflow grants its computed permissions requirement"
dir = "{{cwd}}"
# Seam 2 of #358: GitHub makes `permissions:` caller-owned, so a shared
# workflow that gains a capability is a breaking change to every caller
# — enforced at runtime as startup_failure with no jobs and no log, the
# worst available enforcement point (canon v1.23.1 added `id-token:
# write` to release.yml's tag job and release-lab's existing stub died
# exactly that way). The requirement is statically computable — the
# union of the callee's job-level grants — and this lint compares it
# against every in-repo caller and every workflow-templates/ stub at
# the PR that adds the capability, which is where #353 failed.
# lint:nested-permissions requires the grant to be WRITTEN; this
# requires it to be SUFFICIENT.
#
# ONE RESOLUTION, NO BRANCH. The requirement is computed from the
# canon tree the belt itself came from, which ORG_CANON_DIR names in
# both worlds: in the canon that is this tree, in a consumer the tree
# ci.yml resolved at the same SHA that fetched the shared workflow
# (#165). The task and the engine therefore arrive together and cannot
# skew. This used to probe `.` then `.org-canon` and skip clean when
# it found neither, so a consumer clone running the gate locally
# checked no grant at all and reported a pass (#568) — the degraded
# state is now unrepresentable rather than detected. Strictly earlier
# than audit:caller-permissions, which asks the same question weekly
# against canon HEAD — a forecast; this reddens the PR where the
# answer is actionable.
#
# Which workflows are callers and where the reusable tree sits are
# DECLARED (the policy's permissions section), never conventions in
# code — the engine reads them, so an adopter whose reusable workflows
# sit beside their callers declares no shared tree and gets the join
# over its own calls (stele#148). The guard is that this tree runs
# workflows at all: a workflow-free tree seals CANNOT_JUDGE rather
# than passing vacuously, so the task skips before invoking, the way
# audit:action-pins does.
run = '''
set -euo pipefail
files=$(git ls-files ':!vendor/**' ".github/workflows/*.y*ml")
[[ -n "${files}" ]] || { echo "lint:caller-permissions: no workflows, skipped"; exit 0; }
command -v stele > /dev/null || { echo "lint:caller-permissions: stele missing from the belt" >&2; exit 1; }
if ! stele assert permissions \
  --policy "${ORG_CANON_DIR}/slsa/assert-policy.json" \
  --tree "${ORG_CANON_DIR}" \
  --callers .; then
  echo "lint:caller-permissions: see above — grant what the pinned canon's" >&2
  echo "  callee jobs ask for, at the caller's uses: job (#358 seam 2)." >&2
  exit 1
fi
'''

[tasks."lint:template-pins"]
description = "Workflow templates pin one SHA that is an ancestor of HEAD; scorecard stays pinless"
dir = "{{cwd}}"
# Found by the #28 pre-close audit: all five templates sat a day behind
# canon, predating three shipped fixes, with nothing anywhere going red — a
# repo standing up from the templates would have inherited known bugs. The
# deterministic properties are: every pin is a full SHA that is an ancestor
# of HEAD (never unmerged or foreign history), all pinned templates agree
# on ONE SHA (stub pins move together), and scorecard.yml carries no org
# pin at all (it is self-contained by design — Scorecard's publish
# validation rejects reusables). Deliberately NOT required: pin == HEAD —
# that would couple every canon commit to a template touch. Staleness
# within merged history is the scheduled audit's judgement call, not the
# gate's.
run = '''
compgen -G "workflow-templates/*.y*ml" > /dev/null || {
  echo "lint:template-pins: no workflow-templates/, skipped"; exit 0
}
bad=""
shas=""
count=0
for f in workflow-templates/*.y*ml; do
  lines=$(grep -E "uses:[[:space:]]*monumental-archive/\.github/" "${f}" || true)
  if [[ "${f##*/}" == scorecard.* ]]; then
    [[ -z "${lines}" ]] || bad="${bad} ${f}(must stay pinless: self-contained by design)"
    continue
  fi
  [[ -n "${lines}" ]] || continue
  while IFS= read -r line; do
    sha=$(grep -oE "@[0-9a-f]{40}" <<< "${line}" | tr -d "@")
    if [[ -z "${sha}" ]]; then
      bad="${bad} ${f}(pin is not a full 40-hex SHA)"
      continue
    fi
    count=$((count + 1))
    git merge-base --is-ancestor "${sha}" HEAD 2> /dev/null \
      || bad="${bad} ${f}(${sha:0:8} not an ancestor of HEAD)"
    case " ${shas} " in *" ${sha} "*) ;; *) shas="${shas} ${sha}" ;; esac
  done <<< "${lines}"
done
n=$(wc -w <<< "${shas}" | tr -d " ")
[[ "${n}" -le 1 ]] || bad="${bad} (templates disagree, ${n} distinct SHAs:${shas})"
# Ancestor-of-HEAD is the weaker property (#233). What a copier depends
# on is that the pin names a RELEASED commit — tagged, published through
# the signer, evidence attached, immutable. An untagged mid-history
# commit satisfies "ancestor" and shouldn't: nothing was ever cut from
# it, so there is nothing to verify and nothing that survives a rebuild.
# The gate's checkout fetches tags for exactly this (ci.yml, fetch-tags).
released=""
if [[ -n "$(git tag --list "v[0-9]*" | head -1)" ]]; then
  for sha in ${shas}; do
    tag=$(git tag --points-at "${sha}" --list "v[0-9]*" | head -1)
    if [[ -z "${tag}" ]]; then
      bad="${bad} (${sha:0:8} names no released tag — pins must name a release, not any ancestor)"
    else
      released="${released} ${tag}"
    fi
  done
else
  # A repo before its first release has nothing to point at. Honest skip,
  # named — never a silent pass.
  released=" (no tags in this clone, released-tag check skipped)"
fi
if [[ -n "${bad}" ]]; then
  echo "lint:template-pins: template pin violations:${bad}" >&2
  echo "  templates pin one merged, RELEASED canon SHA and move together" >&2
  echo "  (#111, #233); scorecard.yml never pins a reusable." >&2
  exit 1
fi
echo "lint:template-pins: ${count} pins at one ancestor SHA, scorecard pinless, released as${released}"
'''

[tasks."lint:runner-pin"]
description = "No floating runner labels: every runs-on is a named version pin or a matrix indirection whose values are"
dir = "{{cwd}}"
# Found by the #290 audit: the signer's own sign.yml ran ubuntu-latest —
# the workflow holding `id-token: write`, whose identity every provenance
# certificate bears — while four documents claimed the runner image was a
# named pin everywhere. A floating label migrates on GitHub's schedule
# with no diff, no PR and no Renovate roll, which is exactly what the
# named pin exists to prevent; Renovate's github-runners manager rolls a
# named pin as a visible diff. Neither actionlint nor zizmor (pedantic)
# flags this, so the belt does. Two checks, tracked files only:
# a runs-on value is either a pinned literal (name-version, optionally
# suffixed: ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel) or a
# `${{ matrix.* }}` indirection — and no non-comment line anywhere in a
# workflow carries a `*-latest` runner label, which is what closes the
# matrix laundering hole: a floating value reaching runs-on through a
# matrix include or a bash case arm is the same float with indirection.
run = '''
files=$(git ls-files ':!vendor/**' ".github/workflows/*.yml" ".github/workflows/*.yaml" \
  "workflow-templates/*.yml" "workflow-templates/*.yaml")
[[ -n "${files}" ]] || { echo "lint:runner-pin: no workflows, skipped"; exit 0; }
bad=""
while IFS= read -r f; do
  while IFS= read -r line; do
    [[ -n "${line}" ]] || continue
    v=$(sed -E "s/^[[:space:]]*runs-on:[[:space:]]*//; s/[[:space:]]*#.*$//" <<< "${line}" | tr -d "\"'")
    case "${v}" in
      \$\{\{*matrix.*\}\}) ;; # indirection; the value check below covers it
      *) [[ "${v}" =~ ^[a-z]+-[0-9][a-z0-9.-]*$ ]] \
        || bad="${bad} ${f}(runs-on: ${v})" ;;
    esac
  done <<< "$(grep -hE "^[[:space:]]*runs-on:" "${f}" || true)"
  float=$(grep -nE "(ubuntu|macos|windows)-latest" "${f}" | grep -vE "^[0-9]+:[[:space:]]*#" || true)
  [[ -z "${float}" ]] || bad="${bad} ${f}(floating label: $(head -1 <<< "${float}"))"
done <<< "${files}"
if [[ -n "${bad}" ]]; then
  echo "lint:runner-pin: floating or unpinned runner labels:${bad}" >&2
  echo "  pin every runs-on to a named image version (ubuntu-24.04, not" >&2
  echo "  ubuntu-latest) — Renovate rolls named pins as visible diffs;" >&2
  echo "  a floating label migrates with no diff at all (#290)." >&2
  exit 1
fi
echo "lint:runner-pin: every runs-on pinned or matrix-indirected, no floating labels"
'''

[tasks."lint:canon-pins"]
description = "Every canon reference is a version: workflow pins carry '# vX.Y.Z', lefthook/preset refs are tags, and no workflow checks the canon out — content comes via $/.github/actions/canon"
dir = "{{cwd}}"
# Renovate is the bump mechanism (#133); this lint makes the unbumpable
# state unrepresentable. Three surfaces consume the canon and each must
# carry a machine-readable version: a workflow pin's trailing '# vX.Y.Z'
# comment is what Renovate's github-actions manager reads and rewrites
# with the SHA; a lefthook branch ref or an untagged preset reference can
# be bumped by nothing, so it silently rots — the v0.16.1 failure class.
# Shape is the gate's business; freshness is audit:canon-pins (network).
# Comment lines are excluded: workflow headers quote the pin shape as
# documentation.
run = '''
bad=""
found=0
files=$(git ls-files ':!vendor/**' "*.yml" "*.yaml")
if [[ -n "${files}" ]]; then
  while IFS= read -r f; do
    while IFS= read -r line; do
      [[ -n "${line}" ]] || continue
      found=$((found + 1))
      grep -qE "@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+" <<< "${line}" \
        || bad="${bad} ${f}(canon pin without '@<full-sha> # vX.Y.Z')"
    done < <(grep -hE "^[^#]*uses:[[:space:]]*monumental-archive/\.github/" "${f}" || true)
  done <<< "${files}"
fi
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  grep -qF "github.com/monumental-archive/.github" "${f}" || continue
  found=$((found + 1))
  grep -qE "^[[:space:]]*ref:[[:space:]]*v[0-9]" "${f}" \
    || bad="${bad} ${f}(lefthook canon remote must ref a v* tag, not a branch)"
done < <(git ls-files ':!vendor/**' "lefthook.yml" "*/lefthook.yml")
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  grep -qF "github>monumental-archive/.github" "${f}" || continue
  found=$((found + 1))
  grep -qE "github>monumental-archive/\.github#v[0-9]" "${f}" \
    || bad="${bad} ${f}(preset reference must carry #vX.Y.Z)"
done < <(git ls-files ':!vendor/**' "renovate.json" "*/renovate.json" ".github/renovate.json")
# The fourth surface is a prohibition: no workflow step may clone the
# canon with actions/checkout, at any ref. Canon content reaches a job
# only through `uses: $/.github/actions/canon` — GitHub's
# self-repository resolution, the same one that fetched the workflow
# file, so no second derivation exists to disagree with it (#165). Both
# prior carriers were such second derivations and both failed: the
# github.job_workflow_sha conditional evaluated empty and floated to
# main (#158); the release-time stamp needed workflow writes the
# tag-mint App must never hold (#164).
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  checkouts=$(grep -cE "^[^#]*repository:[[:space:]]*monumental-archive/\.github[[:space:]]*$" "${f}") || continue
  found=$((found + checkouts))
  [[ "${checkouts}" -eq 0 ]] \
    || bad="${bad} ${f}(${checkouts} canon checkout(s) — use \$/.github/actions/canon)"
done < <(git ls-files ':!vendor/**' ".github/workflows/*.yml" ".github/workflows/*.yaml")
[[ ${found} -gt 0 ]] || { echo "lint:canon-pins: no canon references, skipped"; exit 0; }
if [[ -n "${bad}" ]]; then
  echo "lint:canon-pins: unversioned canon references:${bad}" >&2
  echo "  every canon reference pins a tag Renovate can bump (#133);" >&2
  echo "  workflow pins: '@<sha> # vX.Y.Z', lefthook: 'ref: vX.Y.Z'," >&2
  echo "  preset: 'github>monumental-archive/.github#vX.Y.Z'; canon" >&2
  echo "  content in a job comes only via \$/.github/actions/canon (#165)." >&2
  exit 1
fi
echo "lint:canon-pins: ${found} canon references, all versioned"
'''

[tasks."lint:bash-portability"]
description = "No bash 4+ syntax: it runs on the runner and not on a Mac"
dir = "{{cwd}}"
# GitHub runners ship bash 5; macOS ships bash 3.2.57 and always will,
# because bash 4 changed licence. The toolbelt sets
# `shell = "bash -euo pipefail -c"`, so every task and every release
# script is expected to run in both places.
#
# A bash-4-ism therefore passes CI and fails on the machine the code is
# written on — which is worse than failing everywhere, because it silently
# removes the ability to test a script before spending an irreversible
# release on it. Found exactly that way: `${name,,}` in the signer, green
# in CI, "bad substitution" locally.
#
# Comment lines are skipped so that documenting a forbidden form (as the
# signer now does) is not itself a violation.
run = '''
files=$(git ls-files ':!vendor/**' | xargs shfmt --find 2>/dev/null; git ls-files ':!vendor/**' ".github/workflows/*.y*ml")
[[ -n "${files}" ]] || { echo "lint:bash-portability: nothing to check, skipped"; exit 0; }
# ${v,,} ${v^^} ${v,} ${v^} — case modification, bash 4.0
# declare -A / typeset -A — associative arrays, bash 4.0
# mapfile / readarray     — bash 4.0
# &>>                     — append-both redirection, bash 4.0
bad4='\$\{[A-Za-z_][A-Za-z0-9_]*(\[[^]]*\])?(,,|\^\^|,|\^)\}|(declare|typeset)[[:space:]]+-[A-Za-z]*A|(^|[^A-Za-z_])(mapfile|readarray)[[:space:]]|&>>'
found=""
while IFS= read -r f; do
  [[ -f "${f}" ]] || continue
  hit=$(grep -vE "^[[:space:]]*#" "${f}" | grep -nE "${bad4}" || true)
  [[ -n "${hit}" ]] && found="${found}\n  ${f}: ${hit}"
done <<< "${files}"
if [[ -n "${found}" ]]; then
  echo "lint:bash-portability: bash 4+ syntax found (macOS ships 3.2):" >&2
  printf "%b\n" "${found}" >&2
  echo "  these pass in CI and fail locally, which is how a script reaches" >&2
  echo "  a release untested. Use tr, case, or an explicit loop instead." >&2
  exit 1
fi
echo "lint:bash-portability: $(wc -l <<< "${files}" | tr -d " ") files clean"
'''
