# The org toolbelt: universal tools every repo gets, locally and in CI.
#
# Local: symlink into the global fragment directory —
#   ln -s ~/Projects/org-github/mise/config.toml ~/.config/mise/conf.d/toolbelt.toml
# CI: the shared workflow checks out this repo (SHA-pinned) and sets
#   MISE_GLOBAL_CONFIG_FILE to this file, so the layering is identical to local.
#
# Every tool enters this file only after its own docs-first standup, pinned
# exact. mise.lock alongside carries checksums; CI runs MISE_LOCKED=1.
# Regenerate the lock with `mise lock` from this directory.
# The mise/config.toml name is deliberate: both mise and Renovate's mise
# manager recognise it natively — do not rename.
#
# Layering caveat: a repo's mise.toml can override a task or tool version from
# this file — that is mise working as designed. Enforcement lives in the shared
# workflow, not here.

[settings]
# mise.lock records resolved versions, per-platform URLs and checksums.
lockfile = true
# `locked` is set by the shared workflow as MISE_LOCKED=1, not here. In the
# config it also applies to local task runs, where mise re-resolves per task
# directory and cannot find this file's lock through the conf.d symlink —
# every task then warns that every tool "is not in the lockfile". The
# enforcement belongs where the lock is guaranteed reachable: CI.
# Re-verify each tool's provenance attestation on install, even when the
# lockfile already has an entry. A checksum proves the bytes did not change;
# this proves who produced them.
locked_verify_provenance = true
# `mise use` writes exact versions, never ranges.
pin = true
# Pinned tools go to the FRONT of PATH, so a system install can never shadow
# the pinned one — the failure where CI and a laptop run different binaries
# while both look correct.
activate_aggressive = true
# Never install a release younger than seven days: the same number as
# Renovate's minimumReleaseAge, so the two layers agree instead of one
# quietly undercutting the other.
minimum_release_age = "168h"
# asdf plugins are unsigned single-maintainer bash; ubi is deprecated
# upstream in favour of the github backend. Neither belongs under a
# checksum-and-attestation policy.
disable_backends = ["asdf", "ubi"]
# lockfile_platforms is deliberately NOT set. The lock currently covers
# seven platforms including linux-*-musl and macos-x64, and repos in this
# org build musl statics and Intel macOS binaries. Narrowing the list is a
# decision that needs evidence about what actually runs where, and getting
# it wrong drops a platform silently — the lock simply stops carrying it.

[task_config]
# Tasks are written in bash (guards use [[ ]] and <<<); the default task
# shell is sh, which is dash on Ubuntu runners and chokes on both.
shell = "bash -c"

[tools]
actionlint = "1.7.12"
# actionlint shells out to shellcheck for `run:` script analysis; without it
# that entire check class silently vanishes.
shellcheck = "0.11.0"
typos = "1.49.0"
lefthook = "2.1.10"
trivy = "0.73.0"
zizmor = "1.29.0"
committed = "1.1.11"
taplo = "0.10.0"
shfmt = "3.13.1"
# rumdl over markdownlint-cli2: same rule family, aqua-backed instead of
# npm-backed — keeps Node out of the belt. Revisit if a JS suite lands.
rumdl = "0.2.52"
lychee = "0.24.2"
# Coverage ratchet (docs/runbook.md): repos commit a floor in
# .coverage-floor and the canonical coverage:check enforces it in the
# gate — deterministic (local run against a committed number), Rust-only
# by guard, skip-clean everywhere else. Best Practices Silver requires
# >=80% statement coverage; the floor only ratchets up.
"aqua:taiki-e/cargo-llvm-cov" = "0.8.7"
# The release phase-1 version decision and changelog (docs/release.md).
# In the belt rather than a per-repo install: the shared release workflow
# runs it in every versioned repo, and `release:preview` should answer
# locally with the same pinned binary CI uses.
"aqua:orhun/git-cliff" = "2.13.1"
# The dependency track (docs/dependency-track.md). cargo-deny is the gate
# half (bans+licenses+sources, deterministic over the lock) and the
# advisories half (audit:deny, network). cargo-audit is skipped-subsumed:
# same RustSec DB, strictly a subset.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# Blast-radius scanning over published SBOMs (audit:blast-radius). The
# aqua registry lags upstream by one release at standup (2.5.0 exists);
# the pin advances via Renovate like everything else.
"aqua:google/osv-scanner" = "2.4.0"
# OpenVEX assembly (vex:new). The statement is the triage record; the
# signer signs it, blast-radius filters on it.
"aqua:openvex/vexctl" = "0.4.4"
# Source-track chain verification (audit:source-vsa) and stranger
# verification of chain links generally — the same binary the emitter's
# action installs in per-repo runs (docs/source-track.md, #207).
"aqua:sigstore/cosign" = "3.1.3"

# Canonical tasks: available in every repo via the global layer. Repos may
# override a name; the shared workflow is the enforcement backstop.
#
# The task contract, in full:
#   - `mise run ci` must pass in every repo. Repos do NOT define `ci`; the
#     global task below assembles it.
#   - `lint:*` is claimed by the belt and wildcard-collected into `ci`, so a
#     linter added here is enforced in every repo with no repo change. Repos
#     may add their own `lint:<thing>` tasks; same collection applies.
#   - `test` and `build` are reserved names: define them and `ci` runs them,
#     omit them and `ci` skips them (optional depends).
#   - Belt linters guard for applicability and exit 0 when a repo has
#     nothing for them to check. A linter that can't skip can't be universal.
#   - Write-mode siblings live under `fix:*`, never run by `ci`.
[tasks.ci]
description = "The gate: everything the org enforces, plus this repo's tasks"
dir = "{{cwd}}"
depends = [
  "lint:*",
  { task = "test", optional = true },
  { task = "build", optional = true },
  # The coverage ratchet joins the gate the moment a repo commits a
  # floor; without one it skips clean like every guarded belt task.
  "coverage:check",
]
run = "echo 'ci: all gates green'"

[tasks."hooks:install"]
description = "Wire this clone's git hooks to lefthook (run once per clone)"
dir = "{{cwd}}"
run = "lefthook install"

[tasks."lint:typos"]
description = "Spell-check contents and filenames (typos)"
dir = "{{cwd}}"
# Locale stays `en` (accepts en-US and en-GB): the org register convention
# is en-US in code and en-GB in prose, which no per-file locale can split.
# Repo-specific jargon goes in that repo's own _typos.toml (extend-words).
run = "typos"

[tasks."lint:toml"]
description = "TOML format check + lint (taplo)"
dir = "{{cwd}}"
# No schema catalogs in the gate: catalog resolution is a network fetch.
# Tracked files only: taplo's own walker wanders into .git (lefthook's
# remote cache lives there) and has no exclude flag.
run = 'files=$(git ls-files "*.toml"); if [[ -n "${files}" ]]; then xargs taplo fmt --check --diff <<<"${files}" && xargs taplo lint <<<"${files}"; else echo "lint:toml: no TOML tracked, skipped"; fi'

[tasks."fix:toml"]
description = "Rewrite TOML to canonical format (taplo)"
dir = "{{cwd}}"
run = 'git ls-files "*.toml" | xargs taplo fmt'

[tasks."lint:markdown"]
description = "Markdown lint (rumdl, full rule set)"
dir = "{{cwd}}"
run = 'files=$(git ls-files "*.md" "*.markdown"); if [[ -n "${files}" ]]; then xargs rumdl check <<<"${files}"; else echo "lint:markdown: no markdown tracked, skipped"; fi'

[tasks."fix:markdown"]
description = "Auto-fix markdown (rumdl)"
dir = "{{cwd}}"
run = 'git ls-files "*.md" "*.markdown" | xargs rumdl check --fix'

[tasks."lint:shell"]
description = "Shell format check (shfmt: 2-space, simplify, strict layout)"
dir = "{{cwd}}"
# shfmt --find filters the tracked list to shell files itself, including
# extensionless scripts with shell shebangs that an extension glob misses.
run = 'files=$(git ls-files | xargs shfmt --find); if [[ -n "${files}" ]]; then xargs shfmt -i 2 -bn -ci -sr -s -d <<<"${files}"; else echo "lint:shell: no shell tracked, skipped"; fi'

[tasks."fix:shell"]
description = "Rewrite shell to canonical format (shfmt)"
dir = "{{cwd}}"
run = 'git ls-files | xargs shfmt --find | xargs shfmt -i 2 -bn -ci -sr -s -w'

[tasks."lint:commits"]
description = "Conventional-commit check for the branch (committed)"
dir = "{{cwd}}"
# Only meaningful on a branch with an origin/main to diverge from; the
# range check needs committed.toml in the repo (canon: this repo's copy).
# On pull_request events CI sits on GitHub's synthetic merge commit; the
# PR's real commits are its second parent.
run = 'if git rev-parse --verify -q origin/main > /dev/null && [[ -f committed.toml ]]; then tip=HEAD; if [[ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]]; then tip="HEAD^2"; fi; committed "origin/main..${tip}"; else echo "lint:commits: no origin/main or no committed.toml, skipped"; fi'

[tasks."lint:zizmor"]
description = "Security-audit GitHub Actions workflows (zizmor, pedantic)"
dir = "{{cwd}}"
# --offline: with a token present zizmor auto-enables online audits, whose
# results change with remote state — the gate checks the diff, not the
# internet. Pedantic, no severity floor: every actionable finding fails.
# The auditor persona (includes likely false positives) lives in
# audit:actions for human-run reviews, not the gate.
run = 'if compgen -G ".github/workflows/*.y*ml" > /dev/null; then zizmor --offline --persona=pedantic .github/workflows/; else echo "lint:zizmor: no workflows, skipped"; fi'

[tasks."lint:dco"]
description = "Every commit carries a Developer Certificate of Origin sign-off"
dir = "{{cwd}}"
# OSPS-LE-01.01: contributors must assert legal authorisation for their
# contributions. `git commit -s` adds the trailer; the sign-off email must
# match the commit author, so a sign-off asserts something about the person
# who wrote the change rather than whoever happened to run git.
#
# Bots sign off too — the release commit and Renovate both add the trailer —
# so there is no exemption list to drift out of date.
run = '''
git rev-parse --verify -q origin/main > /dev/null || {
  echo "lint:dco: no origin/main, skipped"; exit 0
}
tip=HEAD
[[ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]] && tip="HEAD^2"
range="origin/main..${tip}"
count=0
bad=""
while read -r sha; do
  [[ -n "${sha}" ]] || continue
  count=$((count + 1))
  email=$(git log -1 --format=%ae "${sha}")
  # Fixed-string match on the address: a real email contains regex
  # metacharacters (the + in a GitHub noreply address is the common one),
  # and interpolating it into a pattern silently matches the wrong thing.
  git log -1 --format=%B "${sha}" | grep -i "^Signed-off-by:" \
    | grep -qF "<${email}>" \
    || bad="${bad} ${sha:0:8}"
done < <(git rev-list "${range}")
if [[ -n "${bad}" ]]; then
  echo "lint:dco: commits missing a sign-off matching their author:${bad}" >&2
  echo "  fix with: git commit -s   (or: git rebase --signoff origin/main)" >&2
  exit 1
fi
echo "lint:dco: ${count} commits signed off"
'''

[tasks."lint:exec-bits"]
description = "Every tracked shell script is executable (exit-126 trap)"
dir = "{{cwd}}"
# Found by the v1.5.0 publish: fix:shell recreated collect-vex.sh
# without its mode, workflows exec release scripts by path, and the
# release died at run time with exit 126 — after the tag, which is
# immutable, so the version was burned. Nothing else checks a mode.
run = '''
files=$(git ls-files "*.sh")
[[ -n "${files}" ]] || { echo "lint:exec-bits: no shell scripts tracked, skipped"; exit 0; }
bad=""
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  mode=$(git ls-files -s "${f}" | cut -d" " -f1)
  [[ "${mode}" == "100755" ]] || bad="${bad} ${f}(${mode})"
done <<< "${files}"
if [[ -n "${bad}" ]]; then
  echo "lint:exec-bits: tracked scripts missing the executable bit:${bad}" >&2
  echo "  workflows exec these by path; a lost mode is exit 126 after the tag" >&2
  echo "  fix with: chmod +x <file> && git add <file>" >&2
  exit 1
fi
echo "lint:exec-bits: $(wc -l <<< "${files}" | tr -d " ") scripts executable"
'''

[tasks."lint:deny"]
description = "Dependency policy: bans + licenses + sources (cargo-deny, deterministic over the lock)"
dir = "{{cwd}}"
# No wait_for: the rustup concurrency race this chain once served
# (measured twice on the lab's v0.18.0 release PR) was task-time
# toolchain driving on a cold runner. The toolchain — components
# included — is now fully installed before any task runs (#117:
# coverage:check asserts llvm-tools as a declared build input instead of
# installing it), and cargo's own locking handles concurrent fetches.
# The gate half of the dependency track (docs/dependency-track.md).
# Deterministic: the outcome is a function of Cargo.lock + the committed
# deny.toml. `cargo fetch --locked` first — fetching pinned inputs is the
# same category as fetching the toolchain. Advisories are deliberately
# NOT here: RustSec is a moving feed, so they live in audit:deny.
run = '''
locks=$(git ls-files "Cargo.lock" "*/Cargo.lock")
[[ -n "${locks}" ]] || { echo "lint:deny: no Cargo.lock tracked, skipped"; exit 0; }
# A repo with a lock has rust pinned as a build input; cargo absent is a
# broken toolchain, and skipping would be the vacuous-success failure.
command -v cargo > /dev/null || {
  echo "lint:deny: Cargo.lock present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
[[ -f deny.toml ]] || {
  echo "lint:deny: Cargo.lock present but no deny.toml — copy scaffold/deny.toml from the canon" >&2
  exit 1
}
cargo fetch --locked
cargo deny check bans licenses sources
'''

[tasks."audit:deny"]
description = "Dependency advisories (cargo-deny + RustSec — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: a new advisory fails unrelated work, which is a
# property of the feed, not the diff. Every `ignore` in deny.toml carries
# a reason and cites the VEX statement recording the decision — the L2
# exit is a written decision, never an override.
run = '''
locks=$(git ls-files "Cargo.lock" "*/Cargo.lock")
[[ -n "${locks}" ]] || { echo "audit:deny: no Cargo.lock tracked, skipped"; exit 0; }
command -v cargo > /dev/null || {
  echo "audit:deny: Cargo.lock present but cargo missing — pin rust in mise.toml" >&2
  exit 1
}
[[ -f deny.toml ]] || {
  echo "audit:deny: Cargo.lock present but no deny.toml — copy scaffold/deny.toml from the canon" >&2
  exit 1
}
cargo fetch --locked
cargo deny check advisories
'''

[tasks."audit:blast-radius"]
description = "Advisory blast radius over every published SBOM (osv-scanner — network, canon only)"
dir = "{{cwd}}"
# The L2 triage mechanism at scale and the honesty input VEX statements
# wait on: which published releases ship an affected package? Walks every
# non-draft release of every org repo, verifies each SBOM asset against
# GitHub's release attestation before trusting it, scans with
# osv-scanner, and aggregates one report. Red means NEW AND UNDECIDED:
# a finding is decided iff a statement in security/vex/ exists for its
# exact (advisory, package@version) — decisions are keyed by the
# dependency, never by release tag, so coverage is derived here rather
# than stored there. The per-version join is also the drift guard, by
# construction: a release that bumps a decided package's version matches
# no decision and goes red for a fresh judgment; an ID-only filter would
# silently extend the old judgment to a version nobody looked at.
# Loud failure modes, constructed:
#   - an SBOM that verifies but parses to zero packages (osv exit 128)
#   - the canary: the pinned lab release must yield its known advisory,
#     or this job cannot see and says so
#   - a release with no SBOM asset at all (pre-standup releases are
#     recorded, not failed — they predate the obligation)
# Guarded on security/vex/ so it runs only in the canon checkout.
run = '''
[[ -d security/vex ]] || { echo "audit:blast-radius: no security/vex/, not the canon, skipped"; exit 0; }
command -v osv-scanner > /dev/null || { echo "audit:blast-radius: osv-scanner missing from the belt" >&2; exit 1; }
command -v gh > /dev/null || { echo "audit:blast-radius: gh missing" >&2; exit 1; }
org="${BLAST_RADIUS_ORG:-monumental-archive}"
canary_repo="release-lab"; canary_tag="v0.17.0"; canary_id="RUSTSEC-2021-0127"
work=$(mktemp -d)
findings="${work}/findings.tsv"; : > "${findings}"
missing="${work}/missing.txt"; : > "${missing}"
decided_f="${work}/decided.tsv"
# Decided rows are (advisory, name, version) triples parsed from each
# statement's product purls (pkg:<type>/…/<name>@<version>, version in
# the dialect osv-scanner reports — no epoch, no encoding). An empty
# pattern file matches EVERYTHING under grep -f — an empty VEX directory
# must mean "nothing decided", never "everything decided".
cat security/vex/*.openvex.json 2> /dev/null \
  | jq -r '.statements[]? as $s | $s.products[]?["@id"] // empty
      | capture("^pkg:.*/(?<name>[^/@]+)@(?<version>.+)$")
      | [$s.vulnerability.name, .name, .version] | @tsv' \
  | sort -u | grep -v "^$" > "${decided_f}" || true
failed=0; canary_hit=0; scanned=0
while read -r repo; do
  [[ -n "${repo}" ]] || continue
  while read -r tag; do
    [[ -n "${tag}" ]] || continue
    dir="${work}/${repo}-${tag}"
    mkdir -p "${dir}"
    if ! gh release download "${tag}" --repo "${org}/${repo}" \
      --pattern "*.spdx.json" --dir "${dir}" 2> /dev/null \
      || ! compgen -G "${dir}/*.spdx.json" > /dev/null; then
      echo "${repo}@${tag}" >> "${missing}"
      continue
    fi
    for sbom in "${dir}"/*.spdx.json; do
      # Trust nothing downloaded: the asset must be the one GitHub's
      # release attestation bound at publish.
      if ! gh release verify-asset "${tag}" "${sbom}" \
        --repo "${org}/${repo}" > /dev/null 2>&1; then
        echo "audit:blast-radius: ${repo}@${tag} SBOM failed asset verification" >&2
        failed=1
        continue
      fi
      out="${dir}/osv.json"
      set +e
      osv-scanner scan source -L "${sbom}" --format json > "${out}" 2> /dev/null
      ec=$?
      set -e
      if [[ ${ec} -eq 128 ]]; then
        echo "audit:blast-radius: ${repo}@${tag} SBOM parsed to zero packages — a scan that reads nothing must not report clean" >&2
        failed=1
        continue
      fi
      if [[ ${ec} -ne 0 && ${ec} -ne 1 ]]; then
        echo "audit:blast-radius: osv-scanner errored (${ec}) on ${repo}@${tag}" >&2
        failed=1
        continue
      fi
      scanned=$((scanned + 1))
      # The fifth column is the triage class. OS packages (deb/rpm/apk)
      # with no shipped fix anywhere are the perpetual base-layer
      # background of every stable distro — their remediation path is
      # the rebuild cadence (docs/release.md), and a per-CVE decision
      # would decide nothing; they are REPORTED, never red. An OS
      # finding WITH a shipped fix means our image lags a fix — that is
      # actionable and gates like everything else. Ecosystem packages
      # (the org's own code surface) always gate. The sixth column keeps
      # the os/eco split for the report: os findings' remediation is the
      # base digest bump, so the report points at the pending Renovate
      # PR when one exists (#187's sibling improvement).
      jq -r --arg where "${repo}@${tag}" '
        .results[]?.packages[]? | select(.vulnerabilities != null) as $p
        | ($p.package.ecosystem // "" | ascii_downcase) as $eco
        | (if ($eco | test("debian|alpine|ubuntu|rocky|redhat|rpm")) then "os" else "eco" end) as $kind
        | $p.vulnerabilities[]
        | ([.affected[]?.ranges[]?.events[]? | select(.fixed)] | length > 0) as $fixable
        | (if $kind == "eco" then "gate"
           elif $fixable then "gate"
           else "base-unfixed" end) as $class
        | [.id, $p.package.name, $p.package.version, $where, $class, $kind] | @tsv
      ' "${out}" >> "${findings}"
      if [[ "${repo}" == "${canary_repo}" && "${tag}" == "${canary_tag}" ]] \
        && grep -q "^${canary_id}$(printf "\t")" "${findings}"; then
        canary_hit=1
      fi
    done
  done < <(gh api "repos/${org}/${repo}/releases" --paginate \
    --jq '.[] | select(.draft | not) | .tag_name')
done < <(gh api "orgs/${org}/repos" --paginate --jq '.[].name')
[[ ${scanned} -gt 0 ]] || { echo "audit:blast-radius: zero SBOMs scanned — the walk found nothing to check" >&2; exit 1; }
if [[ ${canary_hit} -eq 0 ]]; then
  echo "audit:blast-radius: CANARY MISSED — ${canary_id} not found in ${canary_repo}@${canary_tag}; the scanner cannot see" >&2
  failed=1
fi
report() {
  echo "## Blast radius — advisory → affected releases"
  echo
  if [[ -s "${findings}" ]]; then
    echo "| advisory | package | version | release | decided |"
    echo "| --- | --- | --- | --- | --- |"
    sort -u "${findings}" | while IFS=$(printf "\t") read -r id name ver where class kind; do
      d="NEW"
      if grep -qxF "$(printf "%s\t%s\t%s" "${id}" "${name}" "${ver}")" "${decided_f}"; then
        d="VEX"
      elif [[ "${class}" == "base-unfixed" ]]; then
        d="base (rebuild cadence)"
      fi
      echo "| ${id} | ${name} | ${ver} | ${where} | ${d} |"
    done
  else
    echo "No findings across ${scanned} SBOM(s)."
  fi
  if [[ -s "${missing}" ]]; then
    echo
    echo "Releases with no SBOM asset (predate the obligation):"
    sed "s/^/- /" "${missing}"
  fi
  # The base-image treadmill pointer (#187): os findings' remediation is
  # never per-CVE, it is the next release on a refreshed base digest —
  # so when a repo has os-package findings, name the pending Renovate
  # digest PR a human would otherwise go hunting for. Report-only.
  os_repos=$(awk -F "\t" '$6 == "os" { split($4, a, "@"); print a[1] }' "${findings}" | sort -u)
  if [[ -n "${os_repos}" ]]; then
    echo
    echo "Base-image findings above remediate via the next release on a refreshed digest:"
    while IFS= read -r r; do
      [[ -n "${r}" ]] || continue
      prs=$(gh pr list --repo "${org}/${r}" --author "app/renovate" --state open \
        --json title,url --jq '.[] | select(.title | test("digest"; "i")) | "  - \(.title) (\(.url))"' 2> /dev/null || true)
      if [[ -n "${prs}" ]]; then
        echo "- ${r}: pending Renovate digest bump —"
        echo "${prs}"
      else
        echo "- ${r}: no pending Renovate digest PR (base current, or the next bump has not landed yet)"
      fi
    done <<< "${os_repos}"
  fi
  # Decisions that matched no current finding. Coverage is derived, so a
  # withdrawn advisory or a dropped/bumped dependency needs no doc edit —
  # the decision simply stops matching everywhere. This names those inert
  # decisions so retiring them is a choice, never an archaeology project.
  # Report-only: an inert decision suppresses nothing and gates nothing.
  if [[ -s "${decided_f}" ]]; then
    live="${work}/live.tsv"
    awk -F "\t" '{ print $1 "\t" $2 "\t" $3 }' "${findings}" | sort -u > "${live}"
    # An empty live file under grep -v -f would suppress every decided
    # line and hide a fully-stale record — zero findings means every
    # decision is inert, not none.
    if [[ -s "${live}" ]]; then
      stale=$(grep -vxF -f "${live}" "${decided_f}" || true)
    else
      stale=$(cat "${decided_f}")
    fi
    if [[ -n "${stale}" ]]; then
      echo
      echo "Decisions matching no current finding (candidates for retirement, not errors):"
      awk -F "\t" '{ print "- " $1 " (" $2 "@" $3 ")" }' <<< "${stale}"
    fi
  fi
}
report
[[ -n "${GITHUB_STEP_SUMMARY:-}" ]] && report >> "${GITHUB_STEP_SUMMARY}"
# Only gate-class findings demand a decision: unfixed base-layer OS
# findings are the rebuild cadence's input, reported above. The join is
# the exact (advisory, name, version) triple — never the advisory alone.
undecided=$(awk -F "\t" '$5 == "gate" { print $1 "\t" $2 "\t" $3 }' "${findings}" | sort -u)
if [[ -s "${decided_f}" ]]; then
  undecided=$(grep -vxF -f "${decided_f}" <<< "${undecided}" || true)
fi
if [[ -n "${undecided}" ]]; then
  echo "audit:blast-radius: undecided advisories (no VEX decision for that package@version):" >&2
  sed "s/^/  /" <<< "${undecided}" >&2
  echo "  triage each and record the decision in security/vex/, keyed by package@version (docs/dependency-track.md)" >&2
  exit 1
fi
[[ ${failed} -eq 0 ]] || exit 1
echo "audit:blast-radius: ${scanned} SBOM(s) scanned, every finding decided, canary seen"
'''

[tasks."audit:attestations"]
description = "Nothing ships unattested: every published artifact carries its full evidence set (network, canon only)"
dir = "{{cwd}}"
# The difference between "we attest" and "nothing ships unattested"
# (#117). Walks every non-draft release of every org repo, reads the
# classes the caller requested FROM ITS publish.yml AT THE TAG (the only
# honest source — classes change over time), and fails if any requested
# class is missing its bundle, any release its SBOM asset or checksums,
# or — from canon 1.13.0 (#209) — any provenance-covered subject its
# store-resident VSA: verdicts live in the attestation store alone,
# because the release seals at publish, before any verdict exists — the canon's own releases shipped without their SBOM from
# v1.0.0 to v1.4.1 with every board green, which is exactly the silent
# gap this audit exists to catch. Continuous digests are the other
# straggler class: their bundle artifact expires with the run, so the
# durable record is the attestation store, and that is what is checked.
# VEX documents are deliberately not asserted: statements exist only
# when decisions do. Releases predating the canon machinery (no
# publish.yml at the tag) are reported, never failed — the obligation
# starts when the machinery does.
run = '''
set -euo pipefail
org="monumental-archive"
missing=""
legacy=""
checked=0
while IFS= read -r repo; do
  while IFS= read -r tag; do
    wf=$(gh api "repos/${org}/${repo}/contents/.github/workflows/publish.yml?ref=${tag}" \
      --jq ".content" 2> /dev/null | base64 -d 2> /dev/null) || true
    [[ -n "${wf}" ]] || { legacy="${legacy} ${repo}@${tag}"; continue; }
    # The canon's own publish.yml IS the orchestrator; its caller stub is
    # self-publish.yml — read the classes from there.
    if grep -qE "^[[:space:]]*workflow_call:" <<< "${wf}"; then
      wf=$(gh api "repos/${org}/${repo}/contents/.github/workflows/self-publish.yml?ref=${tag}" \
        --jq ".content" 2> /dev/null | base64 -d 2> /dev/null) || true
      [[ -n "${wf}" ]] || { legacy="${legacy} ${repo}@${tag}"; continue; }
    fi
    classes=$(grep -E "^[^#]*classes:" <<< "${wf}" | head -1 | sed "s/.*classes:[[:space:]]*//" | tr -d "\"'")
    [[ -n "${classes}" ]] || { legacy="${legacy} ${repo}@${tag}(no-classes)"; continue; }
    assets=$(gh api "repos/${org}/${repo}/releases/tags/${tag}" --jq ".assets[].name")
    checked=$((checked + 1))
    # The canon version pinned at the tag decides the verdict
    # obligation's SHAPE (#209): from 1.13.0 every class's VSA is
    # store-resident (the release seals at publish, before any verdict
    # exists), and before it the two registry classes carried VSA
    # bundles as release assets. The pin comment in the caller's stub
    # is the honest source; the canon's own stub uses a local
    # reference, so its version is the tag itself.
    canon_ver=$(grep -E "uses:.*(publish|release)\.yml@" <<< "${wf}" | grep -oE "# v[0-9]+\.[0-9]+\.[0-9]+" | head -1 | tr -dc "0-9.") || true
    [[ -n "${canon_ver}" ]] || canon_ver="${tag#v}"
    store_vsa=""
    [[ "$(printf "%s\n%s" "1.13.0" "${canon_ver}" | sort -V | head -1)" == "1.13.0" ]] && store_vsa=1
    need="checksums.txt"
    grep -q "\.spdx\.json$" <<< "${assets}" || missing="${missing} ${repo}@${tag}(sbom)"
    case ",${classes// /}," in *",rust-crate,"*)
      need="${need} attestations-crates.intoto.jsonl"
      [[ -n "${store_vsa}" ]] || need="${need} attestations-vsa-crates.intoto.jsonl"
      ;;
    esac
    case ",${classes// /}," in *",oci-image,"*) need="${need} attestations-image.intoto.jsonl" ;; esac
    case ",${classes// /}," in *",rust-binary,"*) need="${need} attestations-binaries.intoto.jsonl" ;; esac
    case ",${classes// /}," in *",source-archive,"*) need="${need} attestations-source.intoto.jsonl" ;; esac
    case ",${classes// /}," in *",wasm-npm,"*)
      need="${need} attestations-npm.intoto.jsonl"
      [[ -n "${store_vsa}" ]] || need="${need} attestations-vsa-npm.intoto.jsonl"
      ;;
    esac
    case ",${classes// /}," in *",pgrx-extension,"*)
      need="${need} attestations-extensions.intoto.jsonl"
      grep -q "^attestations-extimg-pg" <<< "${assets}" || missing="${missing} ${repo}@${tag}(extimg)"
      ;;
    esac
    # One bundle covering the whole release truthfully takes the
    # umbrella name (attach-release.yml, the single-bundle case).
    bundles=$(tr " " "\n" <<< "${need}" | grep -c "intoto") || true
    for asset in ${need}; do
      if [[ "${asset}" == attestations-* && "${bundles}" == "1" ]] \
        && grep -qxF "attestations.intoto.jsonl" <<< "${assets}"; then
        continue
      fi
      grep -qxF "${asset}" <<< "${assets}" || missing="${missing} ${repo}@${tag}(${asset})"
    done
    # The verdict half, store shape (#209): every subject the release's
    # own provenance bundles cover must carry a VSA in the attestation
    # store. Subject digests are read out of the attached bundles — the
    # audit asserts a verdict over exactly what the evidence covers,
    # with no second derivation of the subject set, and that includes
    # the image indexes (their bundles are release assets too). The
    # store is queried per digest and filtered client-side: the API
    # rejects the VSA predicate type as a query filter (HTTP 422,
    # measured on v0.16.3).
    if [[ -n "${store_vsa}" ]]; then
      checked_digests=""
      while IFS= read -r asset; do
        [[ -n "${asset}" ]] || continue
        payloads=$(curl -sSfL --retry 5 \
          "https://github.com/${org}/${repo}/releases/download/${tag}/${asset}" \
          | jq -r ".dsseEnvelope.payload") \
          || { missing="${missing} ${repo}@${tag}(${asset}:unreadable)"; continue; }
        while IFS= read -r sdigest; do
          [[ "${sdigest}" =~ ^[0-9a-f]{64}$ ]] || continue
          grep -qx "${sdigest}" <<< "${checked_digests}" && continue
          checked_digests=$(printf "%s\n%s" "${checked_digests}" "${sdigest}")
          have=""
          while IFS= read -r p; do
            [[ -n "${p}" ]] || continue
            t=$(printf "%s" "${p}" | base64 -d 2> /dev/null | jq -r ".predicateType" 2> /dev/null) || t=""
            [[ "${t}" == "https://slsa.dev/verification_summary/v1" ]] && have=1
          done < <(gh api "repos/${org}/${repo}/attestations/sha256:${sdigest}" \
            --jq ".attestations[].bundle.dsseEnvelope.payload" 2> /dev/null || true)
          [[ -n "${have}" ]] || missing="${missing} ${repo}@${tag}(vsa:${sdigest:0:12})"
        done < <(while IFS= read -r p; do
          printf "%s" "${p}" | base64 -d 2> /dev/null | jq -r ".subject[].digest.sha256"
        done <<< "${payloads}")
      done < <(grep -E "^attestations.*\.intoto\.jsonl$" <<< "${assets}" | grep -v "^attestations-vsa-" || true)
    fi
  done < <(gh api "repos/${org}/${repo}/releases" --paginate \
    --jq '.[] | select(.draft | not) | .tag_name')
  # The continuous half: a repo with the archetype STUB (a caller of the
  # canon's continuous.yml — the canon itself only defines it) publishes
  # digests, and the digest's evidence lives only in the attestation
  # store. The certificate names the signer's reusable workflow, so the
  # verify pins that identity, same as rekor-monitor watches for.
  stub=$(gh api "repos/${org}/${repo}/contents/.github/workflows/continuous.yml" \
    --jq ".content" 2> /dev/null | base64 -d 2> /dev/null) || true
  if grep -qE "uses:[[:space:]]*${org}/\.github/" <<< "${stub:-}"; then
    digest=$(gh api "orgs/${org}/packages/container/${repo}/versions" --paginate \
      --jq '.[] | select(.metadata.container.tags | index("latest")) | .name' 2> /dev/null \
      | grep -E "^sha256:[a-f0-9]{64}$" | head -1) || true
    if [[ -n "${digest:-}" ]]; then
      checked=$((checked + 1))
      gh attestation verify "oci://ghcr.io/${org}/${repo}@${digest}" \
        --repo "${org}/${repo}" \
        --signer-workflow "${org}/signer/.github/workflows/sign.yml" > /dev/null 2>&1 \
        || missing="${missing} ${repo}@latest(${digest:7:12}:store)"
    fi
  fi
done < <(gh api "orgs/${org}/repos" --paginate --jq '.[].name')
# The base-approval half, canon only: every pinned base digest carries
# its approval attestation (base-attest.yml) — a Renovate roll that
# outran the approval run must surface here, not at the next release.
if [[ -f docker/pgrx-base-images.toml ]]; then
  while IFS= read -r ref; do
    repo_part="${ref%%@*}"; repo_part="${repo_part%%:*}"; digest="${ref##*@}"
    [[ "${repo_part}" == */* ]] || repo_part="docker.io/library/${repo_part}"
    checked=$((checked + 1))
    gh attestation verify "oci://${repo_part}@${digest}" \
      --repo "${org}/.github" \
      --predicate-type https://monumental-archive.github.io/attestations/base-image-approval/v1 \
      > /dev/null 2>&1 \
      || missing="${missing} base(${ref})"
  done < <(grep -oE "\"[a-z0-9./:-]+@sha256:[a-f0-9]{64}\"" docker/pgrx-base-images.toml | tr -d "\"")
fi
[[ ${checked} -gt 0 ]] || { echo "audit:attestations: zero subjects checked — the walk found nothing" >&2; exit 1; }
# Immutable history with a written-down reason is debt, not failure —
# security/attestation-debt.txt is the VEX pattern for evidence gaps.
if [[ -f security/attestation-debt.txt ]]; then
  debt=""
  kept=""
  for m in ${missing}; do
    if grep -v "^#" security/attestation-debt.txt | grep -qxF "${m}"; then
      debt="${debt} ${m}"
    else
      kept="${kept} ${m}"
    fi
  done
  missing="${kept}"
  [[ -n "${debt}" ]] && echo "audit:attestations: written-down debt (security/attestation-debt.txt):${debt}"
fi
if [[ -n "${legacy}" ]]; then
  echo "audit:attestations: predate the machinery (reported, not failed):${legacy}"
fi
if [[ -n "${missing}" ]]; then
  echo "audit:attestations: shipped without full evidence:${missing}" >&2
  echo "  every published artifact carries SBOM + checksums + its class bundles;" >&2
  echo "  continuous digests and base pins verify against the attestation store (#117)" >&2
  exit 1
fi
echo "audit:attestations: ${checked} subject(s) checked, nothing ships unattested"
'''

[tasks."audit:source-vsa"]
description = "Every protected-ref revision since genesis has a verified chain link (network, canon only)"
dir = "{{cwd}}"
# The source track's coverage audit (#207): the emitter is per-push, so
# a lapse leaves a hole in the chain rather than going red anywhere —
# this is the cadence that finds the holes, the attestation-debt pattern
# for evidence gaps. For every org repo with a founded chain, walk main
# from the genesis link to the tip and assert each revision carries a
# link whose VSA verifies against that repo's pinned identity — the
# published root-of-trust contract, checked with exactly a stranger's
# inputs. The audit enumerates the POPULATION, not the enrolled set
# (#266): a repo with a main branch and no founded chain is a FINDING
# unless security/source-attest-optout.txt names it with a reason —
# an unactivated repo is otherwise silent by construction, the SBOM
# gap in a different track. "Deliberate and lab-first" survives as a
# written exception, never as silence.
run = '''
[[ "${GITHUB_REPOSITORY:-}" == "monumental-archive/.github" || -d source-policies ]] || {
  echo "audit:source-vsa: not the canon, skipped"; exit 0
}
command -v cosign > /dev/null || { echo "audit:source-vsa: cosign missing from the belt" >&2; exit 1; }
command -v gh > /dev/null || { echo "audit:source-vsa: gh missing" >&2; exit 1; }
issuer="https://token.actions.githubusercontent.com"
repos=$(gh api "orgs/monumental-archive/repos" --paginate --jq '.[].name')
failed=""
checked=0
optout="security/source-attest-optout.txt"
opted_out() { # repo — listed with a reason in the opt-out file
  [[ -f "${optout}" ]] && grep -qE "^${1}[[:space:]]" "${optout}"
}
while read -r repo; do
  [[ -n "${repo}" ]] || continue
  dir=$(mktemp -d)
  git init -q "${dir}"
  git -C "${dir}" remote add origin "https://github.com/monumental-archive/${repo}.git"
  git -C "${dir}" fetch -q origin "+refs/heads/main:refs/sa/main" \
    "+refs/notes/commits:refs/notes/commits" 2> /dev/null || {
    if opted_out "${repo}"; then
      echo "audit:source-vsa: ${repo}: no main or no notes ref, opted out (${optout})"
    else
      failed="${failed} ${repo}(no main or notes ref and not in ${optout})"
    fi
    continue
  }
  san="https://github.com/monumental-archive/${repo}/.github/workflows/source-attest.yml@refs/heads/main"
  # Walk first-parent from the tip; the genesis link (prev: null) ends
  # the walk. Revisions between links are the holes this audit reports.
  holes=""
  links=0
  c=$(git -C "${dir}" rev-parse refs/sa/main)
  while [[ -n "${c}" ]]; do
    note=$(git -C "${dir}" notes show "${c}" 2> /dev/null || true)
    if jq -e '.version and .provenance.bundle' <<< "${note}" > /dev/null 2>&1; then
      links=$((links + 1))
      jq -r '.provenance.statement' <<< "${note}" | base64 -d > "${dir}/st.json"
      jq -c '.provenance.bundle' <<< "${note}" > "${dir}/pb.json"
      jq -r '.vsa.statement' <<< "${note}" | base64 -d > "${dir}/vsa.json"
      jq -c '.vsa.bundle' <<< "${note}" > "${dir}/vb.json"
      for pair in "pb.json st.json" "vb.json vsa.json"; do
        set -- ${pair}
        cosign verify-blob --bundle "${dir}/${1}" \
          --certificate-identity "${san}" --certificate-oidc-issuer "${issuer}" \
          "${dir}/${2}" > /dev/null 2>&1 || failed="${failed} ${repo}@${c}(${1%.json})"
      done
      jq -e --arg c "${c}" '.subject[0].digest.gitCommit == $c' "${dir}/st.json" \
        > /dev/null || failed="${failed} ${repo}@${c}(subject)"
      checked=$((checked + 1))
      # Genesis ends the walk.
      jq -e '.predicate.prev == null' "${dir}/st.json" > /dev/null && break
    else
      [[ ${links} -gt 0 ]] && holes="${holes} ${c}"
    fi
    c=$(git -C "${dir}" rev-parse -q --verify "${c}^" 2> /dev/null || true)
  done
  if [[ ${links} -eq 0 ]]; then
    if opted_out "${repo}"; then
      echo "audit:source-vsa: ${repo}: no chain founded, opted out (${optout})"
    else
      failed="${failed} ${repo}(no chain founded and not in ${optout} — an unactivated repo is silent, #266)"
    fi
    continue
  fi
  if [[ -n "${holes}" ]]; then
    n=$(wc -w <<< "${holes}")
    failed="${failed} ${repo}(${n// /} unattested revision(s) since genesis:${holes})"
  fi
  echo "audit:source-vsa: ${repo}: ${links} link(s) verified"
done <<< "${repos}"
if [[ -n "${failed}" ]]; then
  echo "audit:source-vsa: chain defects:${failed}" >&2
  echo "  every revision since genesis carries a link; every link verifies" >&2
  echo "  against the repo's pinned source-attest identity (docs/source-track.md)" >&2
  exit 1
fi
echo "audit:source-vsa: ${checked} link(s) checked across activated repos"
'''

[tasks."audit:badges"]
description = "Every README shield re-checked against its source of truth (network, canon only)"
dir = "{{cwd}}"
# A badge is a fact computed by somebody else's service, earned once and
# then trusted forever — exactly the claim shape this org refuses
# everywhere else (#215; audit:attestations is the pattern). This walks
# every org repo's README and, for every shield found, asks the issuer
# whether it still agrees. Loud by construction: an unrecognised shield
# fails (a badge nobody can check is a badge nobody is checking), an
# issuer returning nothing fails (a check that reads nothing must never
# report clean), and a Scorecard shield with no floor line fails. The
# Scorecard leg is a per-repo ratcheted floor (security/
# scorecard-floors.txt) — regression is the signal, never the absolute.
run = '''
[[ "${GITHUB_REPOSITORY:-}" == "monumental-archive/.github" || -d source-policies ]] || {
  echo "audit:badges: not the canon, skipped"; exit 0
}
command -v gh > /dev/null || { echo "audit:badges: gh missing" >&2; exit 1; }
floors="security/scorecard-floors.txt"
repos=$(gh api "orgs/monumental-archive/repos" --paginate --jq '.[].name')
failed=""
checked=0
note() { echo "audit:badges: ${1}"; [[ -n ${GITHUB_STEP_SUMMARY:-} ]] && echo "- ${1}" >> "${GITHUB_STEP_SUMMARY}" || true; }
while read -r repo; do
  [[ -n "${repo}" ]] || continue
  readme=$(gh api "repos/monumental-archive/${repo}/readme" --jq '.content' 2> /dev/null || true)
  if [[ -z "${readme}" ]]; then
    note "${repo}: no README, nothing asserted"
    continue
  fi
  body=$(base64 -d <<< "${readme}")
  # Shields are markdown images; comments are stripped first so a
  # deferred (commented-out) badge line is not audited as live.
  urls=$(sed -e 's/<!--/\n<!--/g' -e 's/-->/-->\n/g' <<< "${body}" | sed '/<!--/,/-->/d' \
    | grep -oE '!\[[^]]*\]\([^)]+\)' | sed -E 's/^!\[[^]]*\]\(([^) ]+).*\)$/\1/' || true)
  if [[ -z "${urls}" ]]; then
    note "${repo}: no shields, nothing asserted"
    continue
  fi
  while read -r url; do
    [[ -n "${url}" ]] || continue
    checked=$((checked + 1))
    case "${url}" in
      https://api.scorecard.dev/projects/github.com/monumental-archive/*/badge)
        proj="${url#https://api.scorecard.dev/projects/}"
        proj="${proj%/badge}"
        score=$(curl -sf "https://api.scorecard.dev/projects/${proj}" | jq -r '.score // empty')
        if [[ -z "${score}" ]]; then
          failed="${failed} ${repo}(scorecard: issuer returned no score — a shield over nothing)"
          continue
        fi
        floor=$(awk -v r="${repo}" '$1 == r {print $2}' "${floors}")
        if [[ -z "${floor}" ]]; then
          failed="${failed} ${repo}(scorecard: no floor in ${floors} — an unfloored badge is unwatched)"
        elif awk -v s="${score}" -v f="${floor}" 'BEGIN {exit !(s < f)}'; then
          failed="${failed} ${repo}(scorecard: ${score} below floor ${floor} — regression)"
        elif awk -v s="${score}" -v f="${floor}" 'BEGIN {exit !(s >= f + 0.3)}'; then
          note "${repo}: scorecard ${score} well above floor ${floor} — ratchet: raise the floor"
        else
          note "${repo}: scorecard ${score} (floor ${floor})"
        fi
        ;;
      https://www.bestpractices.dev/projects/*/badge | https://bestpractices.dev/projects/*/badge)
        id="${url##*/projects/}"
        id="${id%/badge}"
        bp=$(curl -sf "https://www.bestpractices.dev/projects/${id}.json" || true)
        if [[ -z "${bp}" ]]; then
          failed="${failed} ${repo}(bestpractices: issuer returned nothing for project ${id})"
        elif ! jq -e '(.badge_percentage_0 // 0) >= 100' <<< "${bp}" > /dev/null; then
          failed="${failed} ${repo}(bestpractices: passing percentage below 100)"
        elif jq -e '[.lost_baseline_1_at, .lost_baseline_2_at, .lost_baseline_3_at] | any(. != null)' <<< "${bp}" > /dev/null 2>&1; then
          failed="${failed} ${repo}(bestpractices: issuer records a LOST baseline)"
        else
          note "${repo}: bestpractices ${id} passing"
        fi
        ;;
      https://api.reuse.software/badge/*)
        proj="${url#https://api.reuse.software/badge/}"
        st=$(curl -sf "https://api.reuse.software/status/${proj}" | jq -r '.status // empty')
        if [[ "${st}" != "compliant" ]]; then
          failed="${failed} ${repo}(reuse: status '${st:-none}' is not compliant)"
        else
          note "${repo}: reuse compliant"
        fi
        ;;
      https://img.shields.io/badge/SLSA-Build%20L3-*)
        # Self-asserted, so its source of truth is the canon's own table:
        # the shield may claim exactly what direction.md claims.
        if ! grep -q '^| Build | \*\*L3\*\* | Met' docs/direction.md; then
          failed="${failed} ${repo}(slsa-shield: direction.md no longer claims Build L3 Met)"
        else
          note "${repo}: SLSA shield matches direction.md"
        fi
        ;;
      https://zenodo.org/badge/DOI/*)
        doi="${url#https://zenodo.org/badge/DOI/}"
        doi="${doi%.svg}"
        if ! curl -sfI "https://doi.org/${doi}" > /dev/null; then
          failed="${failed} ${repo}(doi: ${doi} does not resolve)"
        else
          note "${repo}: DOI resolves"
        fi
        ;;
      https://img.shields.io/crates/v/* | https://img.shields.io/docsrs/*)
        crate="${url##*/}"
        crate="${crate%.svg}"
        if ! curl -sf "https://crates.io/api/v1/crates/${crate}" > /dev/null; then
          failed="${failed} ${repo}(crates: ${crate} not on crates.io)"
        else
          note "${repo}: crate ${crate} exists"
        fi
        ;;
      https://img.shields.io/npm/v/*)
        pkg="${url#https://img.shields.io/npm/v/}"
        pkg="${pkg%.svg}"
        if ! curl -sf "https://registry.npmjs.org/${pkg//%2F//}" > /dev/null; then
          failed="${failed} ${repo}(npm: package not on the registry)"
        else
          note "${repo}: npm package exists"
        fi
        ;;
      https://img.shields.io/badge/ghcr.io-*)
        if ! curl -sfI "https://github.com/orgs/monumental-archive/packages" > /dev/null; then
          failed="${failed} ${repo}(ghcr: the org packages page is unreachable)"
        else
          note "${repo}: ghcr link live"
        fi
        ;;
      https://codecov.io/gh/monumental-archive/*/graph/badge.svg | https://codecov.io/gh/monumental-archive/*/branch/*/graph/badge.svg)
        cc="${url#https://codecov.io/gh/monumental-archive/}"
        cc="${cc%%/*}"
        if ! curl -sf "https://api.codecov.io/api/v2/github/monumental-archive/repos/${cc}" | jq -e '.name' > /dev/null 2>&1; then
          failed="${failed} ${repo}(codecov: issuer has no data for ${cc})"
        else
          note "${repo}: codecov live"
        fi
        ;;
      *)
        # Not silently skipped, by design: silently skipping reproduces
        # the exact gap this audit closes.
        failed="${failed} ${repo}(unrecognised shield — nobody is checking it: ${url})"
        ;;
    esac
  done <<< "${urls}"
done <<< "${repos}"
if [[ -n "${failed}" ]]; then
  echo "audit:badges: shield defects:${failed}" >&2
  echo "  every shield must agree with its source of truth; fix the fact, the floor, or the badge" >&2
  exit 1
fi
echo "audit:badges: ${checked} shield(s) checked, all agree with their issuers"
'''

[tasks."audit:links"]
description = "Check links in tracked markdown (lychee — network, not in ci)"
dir = "{{cwd}}"
# audit:*, not lint:*: link liveness is a property of the internet, not the
# diff. Runs on demand locally and on a schedule in CI (step-3 workflow).
# Scaffold files carry deliberate placeholders a new repo fills in
# (<repo>, BP_ID, CONCEPT_DOI — README-badges.md above all); lychee
# resolves them to real requests and 404s. Excluded by exact token, not
# by skipping scaffold files wholesale: the scaffold's REAL links still
# deserve the check.
run = 'files=$(git ls-files "*.md" "*.markdown"); if [[ -n "${files}" ]]; then xargs lychee --no-progress --exclude "%3Crepo%3E|BP_ID|CONCEPT_DOI" <<<"${files}"; else echo "audit:links: no markdown tracked, skipped"; fi'

[tasks."audit:actions"]
description = "zizmor online + auditor persona — the audits the gate cannot run"
dir = "{{cwd}}"
# The gate runs zizmor --offline, which necessarily skips every audit that
# needs the GitHub API: impostor-commit, known-vulnerable-actions,
# ref-confusion, typosquat-uses, stale-action-refs. Those are exactly the
# checks that catch a compromised or impersonated action, so they run here
# on a schedule instead of nowhere. Auditor persona adds secrets-outside-env
# and misfeature. Needs GH_TOKEN.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "audit:actions: no workflows, skipped"; exit 0
}
zizmor --persona=auditor .github/workflows/
'''

[tasks."audit:template-pins"]
description = "Warn when the template pin misses shipped canon changes (scheduled, not the gate)"
dir = "{{cwd}}"
# The judgement call lint:template-pins deliberately leaves out, measured
# by the right yardstick. Days-behind is a proxy — the #110 incident was a
# ONE-day lag that already predated three shipped fixes, so no day
# threshold catches it. What makes a stale pin dangerous is commits between
# the pin and HEAD touching what the pin actually delivers: the shared
# workflows and the toolbelt (one SHA pins both). Diff those paths; HEAD
# moving on docs, rulesets or the profile README is not staleness worth a
# bump. audit:*, not lint:*: pin-vs-HEAD drift is a property of time
# passing on main, not of the diff under review.
run = '''
compgen -G "workflow-templates/*.y*ml" > /dev/null || {
  echo "audit:template-pins: no workflow-templates/, skipped"; exit 0
}
sha=$(grep -hoE "uses:[[:space:]]*monumental-archive/\.github/[^@]+@[0-9a-f]{40}" \
  workflow-templates/*.y*ml | grep -oE "[0-9a-f]{40}" | sort -u)
[[ -n "${sha}" ]] || { echo "audit:template-pins: no org pins in templates, skipped"; exit 0; }
if [[ "$(wc -l <<< "${sha}" | tr -d " ")" -gt 1 ]]; then
  echo "audit:template-pins: templates pin more than one SHA (lint:template-pins should have failed)" >&2
  exit 1
fi
if ! git cat-file -e "${sha}^{commit}" 2> /dev/null; then
  echo "audit:template-pins: pinned SHA ${sha:0:8} not in local history (shallow clone?)" >&2
  exit 1
fi
drift=$(git diff --name-only "${sha}..HEAD" -- .github/workflows/ mise/)
if [[ -n "${drift}" ]]; then
  # The post-release window (#290 finding 4, same shape as
  # audit:canon-pins): a release commit cannot pin itself (#227), so
  # right after a release the templates lawfully sit at the previous
  # tag until Renovate's chore(canon) bump lands. Pin at exactly the
  # previous release, latest tag under 24h old — notice, not red. All
  # local: tags and their dates are in the clone.
  pin_tag=$(git tag --points-at "${sha}" --list "v[0-9]*" | head -1)
  latest_tag=$(git tag --list "v[0-9]*" | sort -V | tail -1)
  prev_tag=$(git tag --list "v[0-9]*" | sort -V | tail -2 | head -1)
  if [[ -n "${pin_tag}" && -n "${prev_tag}" && "${pin_tag}" == "${prev_tag}" ]]; then
    age=$(($(date -u +%s) - $(git log -1 --format=%ct "${latest_tag}")))
    if [[ "${age}" -lt 86400 ]]; then
      echo "audit:template-pins: post-release window — pin at ${pin_tag}, ${latest_tag} cut $((age / 3600))h ago"
      echo "  the vN-1 state is structural (#227); Renovate's chore(canon)"
      echo "  bump closes it. Red only past the 24h grace (#290)."
      exit 0
    fi
  fi
  echo "audit:template-pins: pin ${sha:0:8} misses shipped canon changes:" >&2
  git log --no-decorate --oneline "${sha}..HEAD" -- .github/workflows/ mise/ | sed "s/^/  /" >&2
  echo "  a repo standing up from the templates would not get these —" >&2
  echo "  bump the template pins to current canon (see #110, #111)." >&2
  exit 1
fi
echo "audit:template-pins: pin ${sha:0:8} carries all shipped workflow and belt changes"
'''

[tasks."audit:canon-pins"]
description = "Warn when any canon reference lags the canon's latest tag (scheduled, not the gate)"
dir = "{{cwd}}"
# The alarm on the mechanism: Renovate bumps canon references (#133), and
# when Renovate is paused, misconfigured or dead, nothing else goes red —
# the v0.16.1 release shipped without its VSA off a three-merge-stale pin
# with every board green. lint:canon-pins proves the references are
# bumpable (shape, offline); this compares each claimed version against
# the canon's latest tag. Network-bound and time-dependent, so audit:*,
# never the gate.
#
# THE POST-RELEASE WINDOW IS EXPECTED, NOT MALFUNCTION (#290 finding 4).
# A commit cannot contain its own release SHA (#227), so every canon
# release vN structurally ships self-references at vN-1, and consumers
# sit at vN-1 until Renovate's chore(canon) bump lands — which cliff.toml
# deliberately skips, so the bump never triggers a release of its own.
# References exactly one release behind, within 24 hours of the latest
# tag, are therefore the healthy steady state and report as a notice.
# The 24-hour grace is a ceiling, not the expectation: with prPriority
# and the first-party group (default.json) the bump lands in one bot
# cycle plus CI, measured 10-30 minutes; the grace exists so a Monday
# cron landing just after a Sunday release does not cry wolf. Anything
# outside the window — more than one release behind, or one behind for
# over a day — is the real alarm: Renovate paused, misconfigured or
# dead, the v0.16.1 failure this audit exists to catch.
run = '''
tags=$(git ls-remote --tags https://github.com/monumental-archive/.github "v[0-9]*" \
  | sed -n "s|.*refs/tags/\(v[0-9][0-9.]*\)$|\1|p" | sort -V)
latest=$(tail -1 <<< "${tags}")
prev=$(tail -2 <<< "${tags}" | head -1)
[[ -n "${latest}" ]] || { echo "audit:canon-pins: canon has no tags, skipped"; exit 0; }
stale=""
nonprev=0
found=0
claims=$(git ls-files "*.yml" "*.yaml" | while IFS= read -r f; do
  grep -hE "^[^#]*uses:[[:space:]]*monumental-archive/\.github/" "${f}" \
    | grep -oE "# v[0-9][0-9.]*" | sed "s|# |${f}:|"
  if grep -qF "github.com/monumental-archive/.github" "${f}"; then
    grep -E "^[[:space:]]*ref:[[:space:]]*v[0-9]" "${f}" \
      | grep -oE "v[0-9][0-9.]*" | sed "s|^|${f}:|"
  fi
done; git ls-files "renovate.json" "*/renovate.json" ".github/renovate.json" \
  | while IFS= read -r f; do
  grep -oE "github>monumental-archive/\.github#v[0-9][0-9.]*" "${f}" \
    | sed "s|.*#|${f}:|"
done)
while IFS= read -r claim; do
  [[ -n "${claim}" ]] || continue
  found=$((found + 1))
  v="${claim##*:}"
  if [[ "${v}" != "${latest}" ]]; then
    stale="${stale} ${claim}"
    [[ "${v}" == "${prev}" && -n "${prev}" ]] || nonprev=1
  fi
done <<< "${claims}"
[[ ${found} -gt 0 ]] || { echo "audit:canon-pins: no canon references, skipped"; exit 0; }
if [[ -n "${stale}" ]]; then
  # Exactly one release behind: possibly the expected window. Age the
  # latest tag via the API (public repo; unauthenticated works) — the
  # date arithmetic lives in jq because ISO parsing in bash is not
  # portable between GNU and BSD date.
  if [[ ${nonprev} -eq 0 ]]; then
    age=$(gh api "repos/monumental-archive/.github/commits/${latest}" \
      --jq '((now - (.commit.committer.date | fromdateiso8601)) | floor)' \
      2> /dev/null || true)
    if [[ "${age}" =~ ^[0-9]+$ && "${age}" -lt 86400 ]]; then
      echo "audit:canon-pins: post-release window — references at ${prev}, canon ${latest} cut $((age / 3600))h ago"
      echo "  the vN-1 state is structural (#227): a commit cannot contain its"
      echo "  own release SHA, and Renovate's chore(canon) bump closes it in"
      echo "  one bot cycle. Red only past the 24h grace (#290)."
      exit 0
    fi
  fi
  echo "audit:canon-pins: references behind canon ${latest}:${stale}" >&2
  echo "  Outside the expected post-release window (one release behind," >&2
  echo "  under 24h) — Renovate should have bumped these. Check the" >&2
  echo "  Renovate dashboard and default.json's first-party rules before" >&2
  echo "  bumping by hand (#133, #290)." >&2
  exit 1
fi
echo "audit:canon-pins: ${found} canon references, all at ${latest}"
'''

[tasks."audit:spdx-list"]
description = "Warn when the vendored SPDX id list lags the published license list (scheduled, not the gate)"
dir = "{{cwd}}"
# The licence validation in release/resolve-oci-facts.sh checks ids
# against release/spdx-license-data.json — vendored so the release path
# stays offline and deterministic. Staleness fails closed (a brand-new id
# is refused until the vendored list is refreshed), and this audit is what
# turns that quiet lag into a red scheduled run. Guarded on the data file,
# so it skips clean everywhere but canon. Network- and time-dependent, so
# audit:*, never the gate.
run = '''
[[ -f release/spdx-license-data.json ]] || { echo "audit:spdx-list: no vendored list, skipped"; exit 0; }
have=$(jq -r .version release/spdx-license-data.json)
latest=$(git ls-remote --tags https://github.com/spdx/license-list-data "v[0-9]*" \
  | sed -n "s|.*refs/tags/\(v[0-9][0-9.]*\)$|\1|p" | sort -V | tail -1)
[[ -n "${latest}" ]] || { echo "audit:spdx-list: upstream unreachable, skipped"; exit 0; }
if [[ "${have}" != "${latest}" ]]; then
  echo "audit:spdx-list: vendored ${have}, upstream ${latest}" >&2
  echo "  regenerate release/spdx-license-data.json per its own regenerate field" >&2
  exit 1
fi
echo "audit:spdx-list: vendored list is current (${have})"
'''

[tasks."lint:trivy"]
description = "Misconfiguration + committed-secret scan (trivy)"
dir = "{{cwd}}"
# Deterministic scanners only: misconfig and secrets are properties of the
# diff. Vulnerability scanning is deliberately absent from the gate — it is
# non-deterministic CI (a new CVE fails unrelated PRs) and already enforced
# org-wide via Dependabot alerts/security updates + Renovate.
# --exit-code 1: trivy exits 0 on findings by default.
# --skip-dirs .org-toolbelt: in CI the shared workflows check the canon
# repo out INTO the workspace, and trivy walks directories rather than
# tracked files — so without this, every repo's gate re-scans the belt's
# own Dockerfiles and trips over findings whose .trivyignore lives in the
# canon repo, not here. The lefthook-remotes trap, in a new costume.
run = "trivy fs --skip-dirs .org-toolbelt --scanners misconfig,secret --exit-code 1 ."

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows (actionlint)"
# {{cwd}}: global-layer tasks otherwise run from the config root (~ locally)
dir = "{{cwd}}"
# actionlint calls shellcheck with --norc, so rc files are ignored; the env
# var is the only way to raise shellcheck to max (all optional checks on).
env = { SHELLCHECK_OPTS = "--enable=all" }
# Guard: actionlint exits 3 when a repo has no workflow YAML (including an
# existing-but-empty workflows directory).
# The -ignore is a documented exception in the capability-boundary
# spirit: GitHub's `$/` self-repository syntax (shipped 2026-07-30, the
# canon's only sanctioned way to reach its own tree — #165) postdates
# actionlint 1.7.12, the newest release. Remove the flag when
# rhysd/actionlint#711 lands. The regex is anchored to the `$/` prefix
# so every other malformed `uses:` still goes red.
run = 'if compgen -G ".github/workflows/*.y*ml" > /dev/null; then actionlint -color -ignore "specifying action \"\\$/" ; else echo "lint:actions: no workflows, skipped"; fi'

[tasks."release:preview"]
description = "What the next release would be (git-cliff — read-only, not in ci)"
dir = "{{cwd}}"
# The same pinned binary the shared release workflow runs, answering
# locally: next version and unreleased changelog. Guarded: repos without a
# cliff.toml (the continuous archetype, this repo) skip clean.
run = 'if [[ -f cliff.toml ]]; then echo "next: $(git cliff --bumped-version)"; git cliff --bump --unreleased --strip all; else echo "release:preview: no cliff.toml, skipped"; fi'

[tasks."lint:capability-boundary"]
description = "No caller-code workflow may hold a signing identity (SLSA L3 boundary)"
dir = "{{cwd}}"
# The org's L3 boundary, made mechanical. A job holding `id-token: write`
# must not also execute caller-supplied code, or a certificate bearing this
# repo's identity gets minted while running someone else's steps — and
# nothing goes red. `workflow_call` is the machine-checkable proxy for
# "runs caller code".
#
# The escape hatch is deliberate and visible: a signer legitimately IS a
# workflow_call workflow holding id-token, and must say so with a
# `capability-boundary:` comment explaining why it runs none. An exception
# you have to write down is an exception somebody reviews.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:capability-boundary: no workflows, skipped"; exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  grep -qE "^[[:space:]]*workflow_call:" "${f}" || continue
  # Only a real grant counts. A workflow that says "no id-token, ever" in
  # a comment is documenting the boundary, not breaching it — matching
  # comment text flagged exactly the files that get this right.
  grep -qE "^[^#]*id-token:[[:space:]]*write" "${f}" || continue
  grep -q "capability-boundary:" "${f}" && continue
  bad="${bad} ${f}"
done
if [[ -n "${bad}" ]]; then
  echo "lint:capability-boundary: workflow_call workflow holds id-token" >&2
  echo "  without a capability-boundary marker:${bad}" >&2
  exit 1
fi
echo "lint:capability-boundary: ok"
'''

[tasks."lint:signer-pin"]
description = "Every sign.yml uses: equals the declared signer pin (no half-bumps)"
dir = "{{cwd}}"
# The release verifier (verify-release.yml, verdict mode) checks the
# provenance it opens against the signer commit declared in
# security/signer.pin. The signer is also pinned as a literal SHA in
# every `uses:` line — GitHub requires that — so the two can drift: a
# Renovate bump that moves the uses: lines but not the pin would verify
# releases against a stale signer, silently. This makes the drift red.
# Deterministic — reads only tracked files — so it belongs in the gate.
#
# Applicability is the declared pin, not the signer reference. Repos that
# call the signer directly (release-lab's exercise-sign.yml) legitimately
# carry no security/signer.pin: the file exists so the CANON's verdict
# has an expected identity to check against, and a consumer has no
# verdict to render. Requiring it everywhere failed the lab's gate on
# canon v1.12.0 — a linter that cannot skip cannot be universal. The one
# case that still fails closed is a tree whose own workflows READ the
# pin but do not ship it, which is the canon with the file deleted.
run = '''
files=$(git ls-files ".github/workflows/*.y*ml")
[[ -n "${files}" ]] || { echo "lint:signer-pin: no workflows, skipped"; exit 0; }
refs=$(xargs grep -hoE "monumental-archive/signer/.github/workflows/sign\.yml@[0-9a-f]{40}" <<< "${files}" | sort -u || true)
[[ -n "${refs}" ]] || { echo "lint:signer-pin: no signer references, skipped"; exit 0; }
if [[ ! -f security/signer.pin ]]; then
  consumers=$(xargs grep -l "security/signer\.pin" <<< "${files}" || true)
  if [[ -n "${consumers}" ]]; then
    echo "lint:signer-pin: workflows read security/signer.pin but the file is missing:${consumers}" >&2
    exit 1
  fi
  echo "lint:signer-pin: no signer pin declared here, skipped"; exit 0
fi
pin=$(grep -Eo "^[0-9a-f]{40}$" security/signer.pin | head -1)
if [[ -z "${pin}" ]]; then
  echo "lint:signer-pin: security/signer.pin holds no 40-hex commit" >&2
  exit 1
fi
# THE FILE HOLDS THE DIGEST AND NOTHING ELSE, and that is load-bearing
# rather than tidy. Renovate's regex manager replaces the whole matched
# span, so the file's original form — an eight-line header, a
# `# renovate: signer-pin` marker, then the digest, with the marker
# INSIDE the match — destroyed its own marker on the first bump (#279
# rewrote ten lines to one). Nothing matched afterwards, so every later
# bump half-landed: the uses: lines moved, the pin did not, and this
# lint reddened each one until a human patched the file by hand. The
# contract now is a bare digest matched whole, which makes
# replace-the-match correct; a header re-added here would break the
# bumper again, silently, so it is refused loudly instead. Explanation
# lives in renovate.json and docs/release.md, where nothing rewrites it.
if [[ "$(wc -l < security/signer.pin | tr -d " ")" != "1" ]] \
  || [[ "$(cat security/signer.pin)" != "${pin}" ]]; then
  echo "lint:signer-pin: security/signer.pin must hold the digest and nothing else" >&2
  echo "  Renovate replaces the whole matched span, so a comment or header" >&2
  echo "  inside the match is destroyed on the next bump and the manager" >&2
  echo "  then matches nothing (#279). Document it in renovate.json instead." >&2
  exit 1
fi
bad=""
while IFS= read -r ref; do
  [[ -n "${ref}" ]] || continue
  [[ "${ref##*@}" == "${pin}" ]] || bad="${bad} ${ref}"
done <<< "${refs}"
if [[ -n "${bad}" ]]; then
  echo "lint:signer-pin: sign.yml pinned away from security/signer.pin (${pin}):${bad}" >&2
  echo "  bump the pin file and the uses: lines together" >&2
  exit 1
fi
echo "lint:signer-pin: all signer references match ${pin}"
'''

[tasks."lint:input-forwarding"]
description = "Every local caller forwards every universal input its callee declares (#305)"
dir = "{{cwd}}"
# The #299 failure class: two callers of one reusable workflow disagree
# about which inputs they forward, and omitting an optional input is
# legal YAML — actionlint validates it, zizmor has no opinion, and only
# the caller the PR happened to exercise goes red. The contract is
# therefore declared where each input is BORN, not at the call sites
# that consume it: every input and secret of a locally-called
# `workflow_call` workflow carries a `# forwarding: universal` (every
# local caller must set the key — any value, literals included) or
# `# forwarding: discretionary — <reason>` marker, and an unmarked
# input fails closed, so the classification #299 silently skipped is
# structurally unskippable. Consumer-surface workflows whose defaults
# ARE the API may declare `# forwarding-default: discretionary` once,
# file-level; a file-level default is never allowed to be universal.
# The marker lives in a comment because GitHub's workflow_call schema
# rejects extension fields — the platform ceiling, not a preference.
#
# Interlock: this lint forces the forwarding line; actionlint, ahead of
# it in the same gate, forces the caller-surface declaration any
# `${{ inputs.* }}` it forwards refers to. The chain closes only with
# both — do not "simplify" either away.
#
# Scope is local `uses: ./` call sites only: cross-repo callers pin by
# SHA and never reach the class builds directly. Indentation-keyed
# parsing is defensible because actionlint guarantees well-formed YAML
# and the canon's two-space style ahead of this in the same gate.
# Deterministic, tracked files only — belongs in `ci`. The error line
# format is fix:input-forwarding's parsing API; change them together.
run = '''
files=$(git ls-files ".github/workflows/*.y*ml")
[[ -n "${files}" ]] || { echo "lint:input-forwarding: no workflows, skipped"; exit 0; }
grep -l "uses: ./.github/workflows/" ${files} > /dev/null 2>&1 || {
  echo "lint:input-forwarding: no local reusable-workflow callers, skipped"; exit 0
}
awk '
FNR == 1 { split(FILENAME, P, "/"); base = P[length(P)]; in_wc = 0; sect = ""; curkey = ""; in_jobs = 0; job = ""; mode = "" }
/^[^ ]/ { in_wc = 0; sect = ""; in_jobs = ($0 ~ /^jobs:/); job = ""; mode = "" }
/^  workflow_call:/ { if (!in_jobs) { in_wc = 1; sect = ""; next } }
in_wc && /^  [^ ]/ { in_wc = 0; sect = "" }
/# forwarding-default: discretionary/ { fdef[base] = 1 }
in_wc && /^    inputs:/ { sect = "input"; curkey = ""; next }
in_wc && /^    secrets:/ { sect = "secret"; curkey = ""; next }
in_wc && /^    [^ ]/ { sect = ""; curkey = "" }
in_wc && sect != "" && /^      [A-Za-z0-9_-]+:/ {
  curkey = $1; sub(/:.*/, "", curkey)
  ndecl++; dbase[ndecl] = base; dkind[ndecl] = sect; dname[ndecl] = curkey; dclass[ndecl] = ""
  last[base SUBSEP sect SUBSEP curkey] = ndecl
}
in_wc && sect != "" && curkey != "" && /# forwarding: universal/ { dclass[last[base SUBSEP sect SUBSEP curkey]] = "universal" }
in_wc && sect != "" && curkey != "" && /# forwarding: discretionary/ { dclass[last[base SUBSEP sect SUBSEP curkey]] = "discretionary" }
in_jobs && /^  [A-Za-z0-9_-]+:/ { job = $1; sub(/:.*/, "", job); mode = "" }
in_jobs && job != "" && /^    uses: \.\/\.github\/workflows\// {
  callee = $2; sub(/^\.\/\.github\/workflows\//, "", callee)
  ncall++; cfile[ncall] = FILENAME; cjob[ncall] = job; cbase[ncall] = callee; called[callee] = 1
}
in_jobs && job != "" && /^    with:/ { mode = "input"; next }
in_jobs && job != "" && /^    secrets: inherit/ { inherited[FILENAME SUBSEP job] = 1; mode = ""; next }
in_jobs && job != "" && /^    secrets:/ { mode = "secret"; next }
in_jobs && job != "" && /^    [^ ]/ { mode = "" }
in_jobs && job != "" && mode != "" && /^      [A-Za-z0-9_-]+:/ {
  k = $1; sub(/:.*/, "", k); fwd[FILENAME SUBSEP job SUBSEP mode SUBSEP k] = 1
}
END {
  fail = 0
  for (i = 1; i <= ndecl; i++)
    if (dclass[i] == "" && called[dbase[i]] && !fdef[dbase[i]]) {
      printf "lint:input-forwarding: %s %s in %s carries no forwarding marker\n", dkind[i], dname[i], dbase[i] > "/dev/stderr"
      fail = 1
    }
  for (j = 1; j <= ncall; j++)
    for (i = 1; i <= ndecl; i++) {
      if (dbase[i] != cbase[j] || dclass[i] != "universal") continue
      if (dkind[i] == "secret" && inherited[cfile[j] SUBSEP cjob[j]]) continue
      if (!fwd[cfile[j] SUBSEP cjob[j] SUBSEP dkind[i] SUBSEP dname[i]]) {
        printf "lint:input-forwarding: %s:%s does not forward universal %s %s of %s\n", cfile[j], cjob[j], dkind[i], dname[i], dbase[i] > "/dev/stderr"
        fail = 1
      }
    }
  if (fail) exit 1
  print "lint:input-forwarding: every universal input is forwarded at every local call site"
}
' ${files}
'''

[tasks."fix:input-forwarding"]
description = "Insert the missing universal forwarding lines lint:input-forwarding demands"
dir = "{{cwd}}"
# The write-mode sibling (#305): universal forwarding lines are
# machine-written, never hand-authored — drift can only exist as an
# uncommittable dirty tree. Consumes the lint's error lines as its API
# (change the formats together) and inserts `key: ${{ inputs.key }}` /
# `key: ${{ secrets.key }}` at the top of the offending job's block.
# The inserted expression is the mechanical guess: review it (the right
# value may be a `needs.*` output or a literal), and declare the input
# on the caller's own surface if actionlint then reddens — that
# interlock is the other half of the chain.
run = '''
{% raw %}
missing=$(mise run lint:input-forwarding 2>&1 | awk '
/does not forward universal/ {
  for (i = 4; i < NF; i++)
    if ($i == "forward" && $(i + 1) == "universal") print $(i - 3), $(i + 2), $(i + 3)
}' || true)
if [[ -z "${missing}" ]]; then
  echo "fix:input-forwarding: nothing to fix"; exit 0
fi
while read -r loc kind key; do
  [[ -n "${loc}" ]] || continue
  file="${loc%%:*}"; jobname="${loc##*:}"
  if [[ "${kind}" == "secret" ]]; then
    blk="secrets:"; val='${{ secrets.'"${key}"' }}'
  else
    blk="with:"; val='${{ inputs.'"${key}"' }}'
  fi
  awk -v job="${jobname}" -v key="${key}" -v blk="${blk}" -v val="${val}" '
  { print }
  /^  [A-Za-z0-9_-]+:/ { cur = $1; sub(/:.*/, "", cur) }
  cur == job && $0 ~ "^    " blk "$" && !done { printf "      %s: %s\n", key, val; done = 1 }
  ' "${file}" > "${file}.fix-tmp" && mv "${file}.fix-tmp" "${file}"
  echo "fix:input-forwarding: ${file}:${jobname} += ${key}"
done <<< "${missing}"
echo "fix:input-forwarding: review the inserted expressions; rerun mise run lint:input-forwarding and lint:actions"
{% endraw %}
'''

[tasks."lint:source-attest"]
description = "Dry-run the source emitter end-to-end short of signing (#236)"
dir = "{{cwd}}"
# The emitter's execution layer must be exercisable without burning a
# lab run: the real claims/chain/emit/append scripts run against
# recorded rule fixtures and a file-protocol stand-in repo, signing
# skipped, push --dry-run, statements shape-checked against the spec.
# Deterministic — no network — so it belongs in the gate. Only the
# canon carries the emitter; everywhere else this skips clean.
run = '''
[ -x .github/actions/source-attest/dryrun.sh ] || {
  echo "lint:source-attest: no source-attest action, skipped"; exit 0
}
.github/actions/source-attest/dryrun.sh
'''

[tasks."lint:actions-allowed"]
description = "Every uses: names an action the org allowlist permits (workflows AND composite actions)"
dir = "{{cwd}}"
# The org restricts Actions to GitHub-owned plus four patterns. GitHub
# enforces it at `Set up job` — the run dies before a single step
# executes, with nothing red until then. Found by driving the first
# source-track activation (#207): sigstore/cosign-installer passed every
# local lint, every gate and code review, and died in the lab.
#
# The list below is the enforcement copy, delivered to every repo by the
# belt; security/README.md is the record and audit:actions-allowlist
# compares both against the live org setting on Mondays. Same shape as
# the rulesets decision (docs/rulesets.md): the org setting is the
# enforcement, this is the early warning.
#
# Composite actions are linted too, deliberately: every other workflow
# lint globs .github/workflows/ only, which is exactly the blind spot
# that let the bad `uses:` through.
run = '''
files=$(git ls-files ".github/workflows/*.y*ml" ".github/actions/*/action.y*ml")
[[ -n "${files}" ]] || { echo "lint:actions-allowed: no workflows or actions, skipped"; exit 0; }
# github_owned_allowed=true covers the actions/ and github/ orgs.
# verified_allowed=false — a Marketplace verification badge is a
# publisher check, not a supply-chain one, and it is not ours to revoke.
allowed="actions/* github/* monumental-archive/* jdx/mise-action@* codecov/codecov-action@* ossf/scorecard-action@*"
bad=""
checked=0
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  while IFS= read -r ref; do
    [[ -n "${ref}" ]] || continue
    # Local refs (./path, $/path) are the repo's own tree, never a
    # third party — the allowlist does not govern them.
    case "${ref}" in ./*|\$/*) continue ;; esac
    checked=$((checked + 1))
    owner_repo="${ref%%@*}"
    ok=""
    for pat in ${allowed}; do
      case "${pat}" in
        *@\*) [[ "${owner_repo}" == "${pat%@\*}" ]] && ok=1 ;;
        */\*) [[ "${owner_repo}" == "${pat%/\*}/"* ]] && ok=1 ;;
      esac
    done
    [[ -n "${ok}" ]] || bad="${bad} ${f}(${ref})"
  done <<< "$(grep -hoE "^[^#]*uses:[[:space:]]*[A-Za-z0-9._$/-]+/[A-Za-z0-9._-]+[^[:space:]]*" "${f}" \
    | sed -E "s|^.*uses:[[:space:]]*||")"
done <<< "${files}"
if [[ -n "${bad}" ]]; then
  echo "lint:actions-allowed: uses: an action the org allowlist forbids:${bad}" >&2
  echo "  allowed: GitHub-owned plus ${allowed}" >&2
  echo "  GitHub refuses these at 'Set up job', so nothing goes red until a run dies" >&2
  echo "  widen the org setting deliberately, or use an allowed action" >&2
  exit 1
fi
echo "lint:actions-allowed: ${checked} action reference(s), all permitted"
'''

[tasks."audit:actions-allowlist"]
description = "The live org Actions allowlist still matches the belt's enforcement copy (network, canon only)"
dir = "{{cwd}}"
# The drift half of lint:actions-allowed. That lint is only as true as
# its embedded list: widen the org setting and the lint silently over-
# blocks; narrow it and the lint silently under-blocks while runs start
# dying. This is the reconciliation, on the same cadence as every other
# settings-drift check.
run = '''
[[ -d security ]] || { echo "audit:actions-allowlist: not the canon, skipped"; exit 0; }
command -v gh > /dev/null || { echo "audit:actions-allowlist: gh missing" >&2; exit 1; }
live=$(gh api "orgs/monumental-archive/actions/permissions/selected-actions")
live_patterns=$(jq -r '.patterns_allowed | sort | join(" ")' <<< "${live}")
belt_patterns=$(mise tasks info "lint:actions-allowed" --json \
  | jq -r '.run[0]' | sed -n 's|^allowed="\(.*\)"$|\1|p' \
  | tr " " "\n" | grep -v "^actions/\*$" | grep -v "^github/\*$" \
  | sort | tr "\n" " " | sed "s| $||")
fail=""
[[ "${live_patterns}" == "${belt_patterns}" ]] \
  || fail="patterns differ — live: [${live_patterns}] belt: [${belt_patterns}]"
jq -e '.github_owned_allowed == true' <<< "${live}" > /dev/null \
  || fail="${fail}; github_owned_allowed is false but the belt allows actions/* and github/*"
jq -e '.verified_allowed == false' <<< "${live}" > /dev/null \
  || fail="${fail}; verified_allowed is true — the Marketplace badge is not a supply-chain control"
if [[ -n "${fail}" ]]; then
  echo "audit:actions-allowlist: ${fail}" >&2
  echo "  reconcile mise/config.toml lint:actions-allowed and security/README.md" >&2
  echo "  with the live setting, or put the live setting back" >&2
  exit 1
fi
echo "audit:actions-allowlist: live org allowlist matches the belt"
'''

[tasks."lint:from-digests"]
description = "Every FROM in a tracked Dockerfile is digest-pinned (a tag is a moving pointer into the build)"
dir = "{{cwd}}"
# Digest pinning is practiced (docker/pgrx-base-images.toml) but was not
# enforced — the lab's builder stage shipped as `rust:1.97-slim`, tag
# only, found in the #117 research. A tag names a stream; the digest
# names the bytes, and only named bytes can be verified before use
# (base-attest.yml). Renovate keeps tag AND digest current together, so
# a pin here never goes stale. Exempt: `FROM scratch` and references to
# named build stages. Tracked files only, like every belt linter.
run = '''
files=$(git ls-files "Dockerfile" "*/Dockerfile" "*.Dockerfile" "Dockerfile.*")
[[ -n "${files}" ]] || { echo "lint:from-digests: no Dockerfiles tracked, skipped"; exit 0; }
bad=""
while IFS= read -r f; do
  stages=$(grep -iE "^[[:space:]]*FROM[[:space:]]" "${f}" \
    | sed -nE 's/.*[[:space:]][Aa][Ss][[:space:]]+([A-Za-z0-9_.-]+).*/\1/p')
  while IFS= read -r line; do
    set -- ${line}
    ref="$2"
    case "${ref}" in --platform=*) ref="$3" ;; esac
    case "$(printf "%s" "${ref}" | tr "[:upper:]" "[:lower:]")" in scratch) continue ;; esac
    grep -qxF "${ref}" <<< "${stages}" && continue
    [[ "${ref}" == *"@sha256:"* ]] || bad="${bad} ${f}(${ref})"
  done < <(grep -iE "^[[:space:]]*FROM[[:space:]]" "${f}")
done <<< "${files}"
if [[ -n "${bad}" ]]; then
  echo "lint:from-digests: FROM without a digest pin:${bad}" >&2
  echo "  pin as image:tag@sha256:… — Renovate rolls tag and digest together" >&2
  exit 1
fi
echo "lint:from-digests: ok"
'''

[tasks."lint:installer-pinned"]
description = "Every mise-action step pins mise's own version — the installer is a build input (#117)"
dir = "{{cwd}}"
# Found the expensive way (v0.18.2 darwin leg): every tool was pinned,
# every uses: SHA-pinned — and the tool that installs them floated,
# pulling a same-day mise release that broke rustup mid-install. A gap a
# human "should have seen" is a gap the belt owns from then on: this
# asserts each jdx/mise-action step carries an explicit `version:`.
# Grep-shaped like every belt lint: count steps, count pins, any
# shortfall is red with the file named.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:installer-pinned: no workflows, skipped"; exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  steps=$(grep -cE "^[^#]*uses:[[:space:]]*jdx/mise-action@" "${f}") || true
  ((steps > 0)) || continue
  pins=$(grep -cE "^[^#]*version:[[:space:]]*[0-9]{4}\.[0-9]+\.[0-9]+" "${f}") || true
  if ((steps > pins)); then
    bad="${bad} ${f}(${steps} steps, ${pins} version pins)"
  fi
done
if [[ -n "${bad}" ]]; then
  echo "lint:installer-pinned: mise-action without a mise version pin:${bad}" >&2
  echo "  the installer is a build input — an unpinned mise delivers" >&2
  echo "  same-day releases straight into attested builds (v0.18.2 darwin leg)" >&2
  exit 1
fi
echo "lint:installer-pinned: ok"
'''

[tasks."lint:cold-attested"]
description = "No cache on any attested path — caches are unattested, writable-from-any-branch build inputs (#117)"
dir = "{{cwd}}"
# The cold-build rule, made mechanical. actions/cache (and every tool
# cache riding an action's `cache:` default) is state injected into the
# build that no provenance captures — cache poisoning is the classic
# attack the attestation cannot see. The rule: caches only where a human
# is waiting and nothing is signed. Structurally that means a workflow
# using a cache must say why its path is unattested, with an
# `unattested-path:` marker — the capability-boundary pattern: an
# exception you have to write down is an exception somebody reviews.
#
# Two shapes are caught: an explicit `uses: actions/cache*`, and a
# mise-action step without `cache: false` (its default is true — the
# silent shape). Both are per-file heuristics, deliberately: the gate is
# deterministic and this stays grep-shaped, like every belt lint.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:cold-attested: no workflows, skipped"; exit 0
}
bad=""
for f in .github/workflows/*.y*ml; do
  grep -q "unattested-path:" "${f}" && continue
  if grep -qE "^[^#]*uses:[[:space:]]*actions/cache" "${f}"; then
    bad="${bad} ${f}(actions/cache)"
    continue
  fi
  actions=$(grep -cE "^[^#]*uses:[[:space:]]*jdx/mise-action@" "${f}") || true
  cold=$(grep -cE "^[^#]*cache:[[:space:]]*false" "${f}") || true
  if ((actions > cold)); then
    bad="${bad} ${f}(mise-action without cache: false)"
  fi
done
if [[ -n "${bad}" ]]; then
  echo "lint:cold-attested: cache on a path with no unattested-path marker:${bad}" >&2
  echo "  attested paths build cold — a cache is an unattested input" >&2
  echo "  (docs/release.md); if this workflow truly signs nothing, say why" >&2
  echo "  with an 'unattested-path:' comment" >&2
  exit 1
fi
echo "lint:cold-attested: ok"
'''

[tasks."coverage:check"]
description = "Enforce the committed coverage floor (.coverage-floor); repos without one skip clean"
dir = "{{cwd}}"
# No task-time rustup, by rule: a component installed mid-run races
# every other task driving the toolchain (measured twice on the lab's
# v0.18.0 release PR; the wait_for chains that served as the workaround
# are deleted, #117). llvm-tools is a declared build input like
# cargo-auditable — pinned in the repo's mise.toml, installed before any
# task runs — and this task asserts it with a remedy, never installs.
# The ratchet: the floor is a committed number that only rises. A repo
# without a floor has not adopted coverage yet and skips clean; a repo
# with one cannot merge below it. Deterministic — the number is local,
# the run is local; the Codecov upload (the badge) lives in ci.yml as a
# separate non-blocking job.
run = """
[[ -f .coverage-floor && -f Cargo.toml ]] || {
  echo "coverage:check: no .coverage-floor, skipped"; exit 0
}
floor=$(tr -d '[:space:]' < .coverage-floor)
if [[ ! "${floor}" =~ ^[0-9]+(\\.[0-9]+)?$ ]]; then
  echo "coverage:check: .coverage-floor is not a number: ${floor}" >&2
  exit 1
fi
if ! rustup component list --installed 2> /dev/null | grep -q "^llvm-tools"; then
  echo "coverage:check: llvm-tools component missing — declare it with the" >&2
  echo "  rust pin in mise.toml: rust = { version = \\"1.xx.x\\", components = \\"llvm-tools\\" }" >&2
  echo "  (installed with the toolchain, before tasks run — never mid-run)" >&2
  exit 1
fi
cargo llvm-cov --workspace --locked --fail-under-lines "${floor}"
echo "coverage:check: floor ${floor} held"
"""

[tasks."lint:belt-available"]
description = "Every belt tool actually resolves — a missing belt must fail loudly, not lint nothing"
dir = "{{cwd}}"
# The belt arrives via MISE_GLOBAL_CONFIG_FILE in CI and a conf.d symlink
# locally. If either is absent, every guarded lint task "skips clean" and
# the gate goes green having checked nothing — the vacuous-success failure.
# This canary asserts the layer itself is present.
run = '''
missing=""
for tool in actionlint shellcheck typos lefthook trivy zizmor committed taplo shfmt rumdl cargo-deny osv-scanner vexctl; do
  command -v "${tool}" > /dev/null || missing="${missing} ${tool}"
done
if [[ -n "${missing}" ]]; then
  echo "lint:belt-available: belt tools missing:${missing}" >&2
  echo "  CI: MISE_GLOBAL_CONFIG_FILE not set or checkout missing" >&2
  echo "  locally: ~/.config/mise/conf.d symlink to the org belt is absent" >&2
  exit 1
fi
echo "lint:belt-available: ok"
'''

[tasks."lint:licence"]
description = "The repo carries its licence: tracked LICENSE or LICENSES/, and REUSE.toml's expression filled"
dir = "{{cwd}}"
# "Every repo carries its own" was a statement of intent that nothing
# implemented, and the predictable result was that no repo carried one
# (#214) — the same shape as the BuildEnv defect: a claim with no
# mechanism, believed because it was written down. This is the
# mechanism. The licence itself stays a per-repo choice (the canon is
# 0BSD; a crate repo will dual-license MIT OR Apache-2.0); what the
# belt enforces is only that the choice was MADE: a tracked licence
# text exists, and a tracked REUSE.toml does not still carry the
# scaffold's angle-bracket placeholder. Deterministic, offline,
# tracked files only. Skips only an empty tree — a repo with content
# and no licence is exactly the defect, never an exemption.
run = '''
[[ -n "$(git ls-files | head -1)" ]] || { echo "lint:licence: no tracked files, skipped"; exit 0; }
lic=$(git ls-files "LICENSE" "LICENSE.*" "LICENSES/*")
if [[ -z "${lic}" ]]; then
  echo "lint:licence: no tracked LICENSE or LICENSES/ — every repo carries its own licence (#214)" >&2
  echo "  with no licence the default is all rights reserved, the opposite of the intent" >&2
  exit 1
fi
if git ls-files --error-unmatch "REUSE.toml" > /dev/null 2>&1 \
  && grep -q "<SPDX expression>" "REUSE.toml"; then
  echo "lint:licence: REUSE.toml still carries the scaffold's <SPDX expression> placeholder — pick the licence (#214)" >&2
  exit 1
fi
echo "lint:licence: ok"
'''

[tasks."lint:release-stub"]
description = "A versioned repo carries the canonical release stubs (cliff.toml implies publish.yml + release.yml)"
dir = "{{cwd}}"
# The versioned archetype is three files: cliff.toml, release.yml,
# publish.yml — and the registries pin the publish.yml FILENAME, so a
# missing or renamed stub breaks trusted publishing with nothing local
# going red. cliff.toml is the archetype marker: continuous repositories
# do not have one and skip clean.
run = '''
[[ -f cliff.toml ]] || { echo "lint:release-stub: no cliff.toml, not a versioned repo, skipped"; exit 0; }
bad=""
for f in .github/workflows/release.yml .github/workflows/publish.yml; do
  if [[ ! -f "${f}" ]]; then
    bad="${bad} ${f}(missing)"
  # In the canon itself these two files ARE the reusable implementations
  # (they declare workflow_call), not caller stubs; the canon's wiring is
  # self-release.yml's local `uses:`, exercised on every push to main.
  elif grep -qE "^[[:space:]]+workflow_call:" "${f}"; then
    continue
  elif ! grep -qE "uses: monumental-archive/.github/.github/workflows/(release|publish)\.yml@[0-9a-f]{40}|uses: \./\.github/workflows/(release|publish)\.yml" "${f}"; then
    bad="${bad} ${f}(no pinned org uses)"
  fi
done
if [[ -n "${bad}" ]]; then
  echo "lint:release-stub: versioned repo with broken release stubs:${bad}" >&2
  echo "  copy scaffold/ from monumental-archive/.github; the publish.yml filename is load-bearing" >&2
  exit 1
fi
echo "lint:release-stub: ok"
'''

[tasks."lint:toolbelt-lock"]
description = "Every pinned tool has a locked entry (mise config vs mise.lock)"
dir = "{{cwd}}"
# Renovate can bump a version line but cannot always refresh the lock:
# `mise lock` is an unsafe execution, and `allowedUnsafeExecutions` is a
# self-hosted-only setting we do not control on the hosted App. A pin that
# moves while its checksums stay behind is what this catches, and it fails
# the pull request rather than installing something unverified.
run = '''
cfg=""
for c in mise/config.toml mise.toml .mise.toml; do
  [[ -f "${c}" ]] && { cfg="${c}"; break; }
done
[[ -n "${cfg}" ]] || { echo "lint:toolbelt-lock: no mise config, skipped"; exit 0; }
lock="mise.lock"
[[ "${cfg}" == */* ]] && lock="${cfg%/*}/mise.lock"
[[ -f "${lock}" ]] || { echo "lint:toolbelt-lock: no ${lock}, skipped"; exit 0; }
keys=$(sed -n "/^\\[tools\\]/,/^\\[/p" "${cfg}" | grep -vE "^(#|\\[|$)" | grep "=" | cut -d= -f1 | tr -d " \"")
# A verification loop that processes zero items and reports success is the
# check announcing that it checked nothing. Fail instead.
[[ -n "${keys}" ]] || { echo "lint:toolbelt-lock: no tools parsed from ${cfg}" >&2; exit 1; }
missing=""
while IFS= read -r k; do
  [[ -n "${k}" ]] || continue
  grep -qxF "[[tools.\"${k}\"]]" "${lock}" && continue
  grep -qxF "[[tools.${k}]]" "${lock}" && continue
  missing="${missing} ${k}"
done <<< "${keys}"
if [[ -n "${missing}" ]]; then
  echo "lint:toolbelt-lock: ${cfg} pins tools absent from ${lock}:${missing}" >&2
  exit 1
fi
echo "lint:toolbelt-lock: $(wc -w <<< "${keys}" | tr -d " ") tools locked in ${lock}"
'''

[tasks."lint:nested-permissions"]
description = "Every nested `uses:` job states its permissions (startup_failure trap)"
dir = "{{cwd}}"
# The trap, measured rather than read: a `uses:` job with no `permissions:`
# block inherits the WORKFLOW-level default of the file it is written in —
# not the grant its caller made. So `permissions: {}` at the top of a shared
# workflow, which is correct practice and which this org applies everywhere,
# silently starves every nested call beneath it. The callee then requests
# more than its calling job holds, which is an elevation, and the run dies as
# `startup_failure` with no jobs, no annotations and no log.
#
# Nothing else catches it. actionlint, zizmor --persona=pedantic and
# lint:capability-boundary all pass on the broken file, because each is
# correct in isolation and the contract spans two workflows.
#
# Scoped to workflow_call files: in an ordinary workflow the caller IS the
# top level, so omitting permissions there is merely the usual default.
run = '''
compgen -G ".github/workflows/*.y*ml" > /dev/null || {
  echo "lint:nested-permissions: no workflows, skipped"; exit 0
}
bad=""
checked=0
for f in .github/workflows/*.y*ml; do
  # Any file with a `uses:` job — reusable workflows AND caller stubs.
  # The trap is identical in both: a `uses:` job with no `permissions:`
  # block takes the WORKFLOW-level default, never the caller's grant.
  # Scoping this to workflow_call files missed every caller stub, which
  # is exactly where the grant has to be written — and a shared workflow
  # that gains a permission breaks all of its callers at once, silently.
  grep -qE "^    uses:" "${f}" || continue
  checked=$((checked + 1))
  offenders=$(awk '
    /^jobs:[[:space:]]*$/ { injobs = 1; next }
    injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ {
      if (job != "" && uses && !perms) print job
      job = $1; sub(/:$/, "", job); uses = 0; perms = 0; next
    }
    injobs && /^    uses:/ { uses = 1 }
    injobs && /^    permissions:/ { perms = 1 }
    END { if (job != "" && uses && !perms) print job }
  ' "${f}")
  for j in ${offenders}; do bad="${bad} ${f}:${j}"; done
done
if [[ -n "${bad}" ]]; then
  echo "lint:nested-permissions: nested uses: job with no permissions block:" >&2
  for b in ${bad}; do echo "  ${b}" >&2; done
  echo "  it inherits the workflow-level default, not the caller grant —" >&2
  echo "  state exactly what the called workflow needs, or the run dies as" >&2
  echo "  startup_failure with no jobs and no log." >&2
  exit 1
fi
echo "lint:nested-permissions: ${checked} workflow(s) with uses: jobs clean"
'''

[tasks."lint:template-pins"]
description = "Workflow templates pin one SHA that is an ancestor of HEAD; scorecard stays pinless"
dir = "{{cwd}}"
# Found by the #28 pre-close audit: all five templates sat a day behind
# canon, predating three shipped fixes, with nothing anywhere going red — a
# repo standing up from the templates would have inherited known bugs. The
# deterministic properties are: every pin is a full SHA that is an ancestor
# of HEAD (never unmerged or foreign history), all pinned templates agree
# on ONE SHA (stub pins move together), and scorecard.yml carries no org
# pin at all (it is self-contained by design — Scorecard's publish
# validation rejects reusables). Deliberately NOT required: pin == HEAD —
# that would couple every canon commit to a template touch. Staleness
# within merged history is the scheduled audit's judgement call, not the
# gate's.
run = '''
compgen -G "workflow-templates/*.y*ml" > /dev/null || {
  echo "lint:template-pins: no workflow-templates/, skipped"; exit 0
}
bad=""
shas=""
count=0
for f in workflow-templates/*.y*ml; do
  lines=$(grep -E "uses:[[:space:]]*monumental-archive/\.github/" "${f}" || true)
  if [[ "${f##*/}" == scorecard.* ]]; then
    [[ -z "${lines}" ]] || bad="${bad} ${f}(must stay pinless: self-contained by design)"
    continue
  fi
  [[ -n "${lines}" ]] || continue
  while IFS= read -r line; do
    sha=$(grep -oE "@[0-9a-f]{40}" <<< "${line}" | tr -d "@")
    if [[ -z "${sha}" ]]; then
      bad="${bad} ${f}(pin is not a full 40-hex SHA)"
      continue
    fi
    count=$((count + 1))
    git merge-base --is-ancestor "${sha}" HEAD 2> /dev/null \
      || bad="${bad} ${f}(${sha:0:8} not an ancestor of HEAD)"
    case " ${shas} " in *" ${sha} "*) ;; *) shas="${shas} ${sha}" ;; esac
  done <<< "${lines}"
done
n=$(wc -w <<< "${shas}" | tr -d " ")
[[ "${n}" -le 1 ]] || bad="${bad} (templates disagree, ${n} distinct SHAs:${shas})"
# Ancestor-of-HEAD is the weaker property (#233). What a copier depends
# on is that the pin names a RELEASED commit — tagged, published through
# the signer, evidence attached, immutable. An untagged mid-history
# commit satisfies "ancestor" and shouldn't: nothing was ever cut from
# it, so there is nothing to verify and nothing that survives a rebuild.
# The gate's checkout fetches tags for exactly this (ci.yml, fetch-tags).
released=""
if [[ -n "$(git tag --list "v[0-9]*" | head -1)" ]]; then
  for sha in ${shas}; do
    tag=$(git tag --points-at "${sha}" --list "v[0-9]*" | head -1)
    if [[ -z "${tag}" ]]; then
      bad="${bad} (${sha:0:8} names no released tag — pins must name a release, not any ancestor)"
    else
      released="${released} ${tag}"
    fi
  done
else
  # A repo before its first release has nothing to point at. Honest skip,
  # named — never a silent pass.
  released=" (no tags in this clone, released-tag check skipped)"
fi
if [[ -n "${bad}" ]]; then
  echo "lint:template-pins: template pin violations:${bad}" >&2
  echo "  templates pin one merged, RELEASED canon SHA and move together" >&2
  echo "  (#111, #233); scorecard.yml never pins a reusable." >&2
  exit 1
fi
echo "lint:template-pins: ${count} pins at one ancestor SHA, scorecard pinless, released as${released}"
'''

[tasks."lint:runner-pin"]
description = "No floating runner labels: every runs-on is a named version pin or a matrix indirection whose values are"
dir = "{{cwd}}"
# Found by the #290 audit: the signer's own sign.yml ran ubuntu-latest —
# the workflow holding `id-token: write`, whose identity every provenance
# certificate bears — while four documents claimed the runner image was a
# named pin everywhere. A floating label migrates on GitHub's schedule
# with no diff, no PR and no Renovate roll, which is exactly what the
# named pin exists to prevent; Renovate's github-runners manager rolls a
# named pin as a visible diff. Neither actionlint nor zizmor (pedantic)
# flags this, so the belt does. Two checks, tracked files only:
# a runs-on value is either a pinned literal (name-version, optionally
# suffixed: ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel) or a
# `${{ matrix.* }}` indirection — and no non-comment line anywhere in a
# workflow carries a `*-latest` runner label, which is what closes the
# matrix laundering hole: a floating value reaching runs-on through a
# matrix include or a bash case arm is the same float with indirection.
run = '''
files=$(git ls-files ".github/workflows/*.yml" ".github/workflows/*.yaml" \
  "workflow-templates/*.yml" "workflow-templates/*.yaml")
[[ -n "${files}" ]] || { echo "lint:runner-pin: no workflows, skipped"; exit 0; }
bad=""
while IFS= read -r f; do
  while IFS= read -r line; do
    [[ -n "${line}" ]] || continue
    v=$(sed -E "s/^[[:space:]]*runs-on:[[:space:]]*//; s/[[:space:]]*#.*$//" <<< "${line}" | tr -d "\"'")
    case "${v}" in
      \$\{\{*matrix.*\}\}) ;; # indirection; the value check below covers it
      *) [[ "${v}" =~ ^[a-z]+-[0-9][a-z0-9.-]*$ ]] \
        || bad="${bad} ${f}(runs-on: ${v})" ;;
    esac
  done <<< "$(grep -hE "^[[:space:]]*runs-on:" "${f}" || true)"
  float=$(grep -nE "(ubuntu|macos|windows)-latest" "${f}" | grep -vE "^[0-9]+:[[:space:]]*#" || true)
  [[ -z "${float}" ]] || bad="${bad} ${f}(floating label: $(head -1 <<< "${float}"))"
done <<< "${files}"
if [[ -n "${bad}" ]]; then
  echo "lint:runner-pin: floating or unpinned runner labels:${bad}" >&2
  echo "  pin every runs-on to a named image version (ubuntu-24.04, not" >&2
  echo "  ubuntu-latest) — Renovate rolls named pins as visible diffs;" >&2
  echo "  a floating label migrates with no diff at all (#290)." >&2
  exit 1
fi
echo "lint:runner-pin: every runs-on pinned or matrix-indirected, no floating labels"
'''

[tasks."lint:canon-pins"]
description = "Every canon reference is a version: workflow pins carry '# vX.Y.Z', lefthook/preset refs are tags, and no workflow checks the canon out — content comes via $/.github/actions/canon"
dir = "{{cwd}}"
# Renovate is the bump mechanism (#133); this lint makes the unbumpable
# state unrepresentable. Three surfaces consume the canon and each must
# carry a machine-readable version: a workflow pin's trailing '# vX.Y.Z'
# comment is what Renovate's github-actions manager reads and rewrites
# with the SHA; a lefthook branch ref or an untagged preset reference can
# be bumped by nothing, so it silently rots — the v0.16.1 failure class.
# Shape is the gate's business; freshness is audit:canon-pins (network).
# Comment lines are excluded: workflow headers quote the pin shape as
# documentation.
run = '''
bad=""
found=0
files=$(git ls-files "*.yml" "*.yaml")
if [[ -n "${files}" ]]; then
  while IFS= read -r f; do
    while IFS= read -r line; do
      [[ -n "${line}" ]] || continue
      found=$((found + 1))
      grep -qE "@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+" <<< "${line}" \
        || bad="${bad} ${f}(canon pin without '@<full-sha> # vX.Y.Z')"
    done < <(grep -hE "^[^#]*uses:[[:space:]]*monumental-archive/\.github/" "${f}" || true)
  done <<< "${files}"
fi
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  grep -qF "github.com/monumental-archive/.github" "${f}" || continue
  found=$((found + 1))
  grep -qE "^[[:space:]]*ref:[[:space:]]*v[0-9]" "${f}" \
    || bad="${bad} ${f}(lefthook canon remote must ref a v* tag, not a branch)"
done < <(git ls-files "lefthook.yml" "*/lefthook.yml")
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  grep -qF "github>monumental-archive/.github" "${f}" || continue
  found=$((found + 1))
  grep -qE "github>monumental-archive/\.github#v[0-9]" "${f}" \
    || bad="${bad} ${f}(preset reference must carry #vX.Y.Z)"
done < <(git ls-files "renovate.json" "*/renovate.json" ".github/renovate.json")
# The fourth surface is a prohibition: no workflow step may clone the
# canon with actions/checkout, at any ref. Canon content reaches a job
# only through `uses: $/.github/actions/canon` — GitHub's
# self-repository resolution, the same one that fetched the workflow
# file, so no second derivation exists to disagree with it (#165). Both
# prior carriers were such second derivations and both failed: the
# github.job_workflow_sha conditional evaluated empty and floated to
# main (#158); the release-time stamp needed workflow writes the
# tag-mint App must never hold (#164).
while IFS= read -r f; do
  [[ -n "${f}" ]] || continue
  checkouts=$(grep -cE "^[^#]*repository:[[:space:]]*monumental-archive/\.github[[:space:]]*$" "${f}") || continue
  found=$((found + checkouts))
  [[ "${checkouts}" -eq 0 ]] \
    || bad="${bad} ${f}(${checkouts} canon checkout(s) — use \$/.github/actions/canon)"
done < <(git ls-files ".github/workflows/*.yml" ".github/workflows/*.yaml")
[[ ${found} -gt 0 ]] || { echo "lint:canon-pins: no canon references, skipped"; exit 0; }
if [[ -n "${bad}" ]]; then
  echo "lint:canon-pins: unversioned canon references:${bad}" >&2
  echo "  every canon reference pins a tag Renovate can bump (#133);" >&2
  echo "  workflow pins: '@<sha> # vX.Y.Z', lefthook: 'ref: vX.Y.Z'," >&2
  echo "  preset: 'github>monumental-archive/.github#vX.Y.Z'; canon" >&2
  echo "  content in a job comes only via \$/.github/actions/canon (#165)." >&2
  exit 1
fi
echo "lint:canon-pins: ${found} canon references, all versioned"
'''

[tasks."lint:bash-portability"]
description = "No bash 4+ syntax: it runs on the runner and not on a Mac"
dir = "{{cwd}}"
# GitHub runners ship bash 5; macOS ships bash 3.2.57 and always will,
# because bash 4 changed licence. The toolbelt sets `shell = "bash -c"`, so
# every task and every release script is expected to run in both places.
#
# A bash-4-ism therefore passes CI and fails on the machine the code is
# written on — which is worse than failing everywhere, because it silently
# removes the ability to test a script before spending an irreversible
# release on it. Found exactly that way: `${name,,}` in the signer, green
# in CI, "bad substitution" locally.
#
# Comment lines are skipped so that documenting a forbidden form (as the
# signer now does) is not itself a violation.
run = '''
files=$(git ls-files | xargs shfmt --find 2>/dev/null; git ls-files ".github/workflows/*.y*ml")
[[ -n "${files}" ]] || { echo "lint:bash-portability: nothing to check, skipped"; exit 0; }
# ${v,,} ${v^^} ${v,} ${v^} — case modification, bash 4.0
# declare -A / typeset -A — associative arrays, bash 4.0
# mapfile / readarray     — bash 4.0
# &>>                     — append-both redirection, bash 4.0
bad4='\$\{[A-Za-z_][A-Za-z0-9_]*(\[[^]]*\])?(,,|\^\^|,|\^)\}|(declare|typeset)[[:space:]]+-[A-Za-z]*A|(^|[^A-Za-z_])(mapfile|readarray)[[:space:]]|&>>'
found=""
while IFS= read -r f; do
  [[ -f "${f}" ]] || continue
  hit=$(grep -vE "^[[:space:]]*#" "${f}" | grep -nE "${bad4}" || true)
  [[ -n "${hit}" ]] && found="${found}\n  ${f}: ${hit}"
done <<< "${files}"
if [[ -n "${found}" ]]; then
  echo "lint:bash-portability: bash 4+ syntax found (macOS ships 3.2):" >&2
  printf "%b\n" "${found}" >&2
  echo "  these pass in CI and fail locally, which is how a script reaches" >&2
  echo "  a release untested. Use tr, case, or an explicit loop instead." >&2
  exit 1
fi
echo "lint:bash-portability: $(wc -l <<< "${files}" | tr -d " ") files clean"
'''
