# The gate's shards and what each heavy lint costs (#2049).
#
# ci.yml runs the lint leg on `shards` runners side by side, and
# mise/gate_shard.py deals the `lint:*` tasks among them, longest first,
# so the heaviest lints land on different runners. A lint's cost is its
# row's `seconds` in a tree where one of its `when` pathspecs (git's
# default meaning; absent = every tree) names a tracked file, and
# `lint.default` everywhere else: a lint that skips in a tree weighs what a
# skip weighs, and the next heavy lint takes that runner.
#
# The seconds are the slowest the lint took in any repository's gate
# when this was measured (2026-11-23, every lint sharing one four-core
# runner), rounded. They decide only which lints share a runner, never
# whether one runs: a stale figure costs balance, not coverage.
# mise/test_gate_shard.py holds every row to a lint the belt defines. A
# repository's own lint is unlisted and weighs `lint.default`.

# The canon's DEFAULTS (#2160). How a repository's work is split and
# sharded is the repository's own content, in its tracked root
# `shards.toml` (mise/gate_shard.py reads it, in the plan only); these
# are what a repository gets for anything its file does not name. The
# lint leg's shards; one runner per test or properties task, so no test
# count lives here; and one count per language for repo-mutants.yml and
# repo-deep-tests.yml's properties. `ceiling` is the most any count may
# be, here or in a repository's file, so every matrix stays under
# GitHub's 256 jobs.
[shards]
lint = 4
ceiling = 128

# Rust and Go four, round-robin (edtf #107 set Rust's from its first
# run); Python four, a share of the modules each, mutmut's baseline
# paid once per shard (#2177; set from its first run);
# TypeScript eight, StrykerJS given a share of the files (#2153).
[shards.mutants]
rust = 4
go = 4
python = 4
typescript = 8

# The Monday properties at a random seed: Python by position, eight
# legs (#1631); TypeScript and Rust one job each.
[shards.deep-tests]
python = 8
typescript = 1
rust = 1

[lint]
default = 2

[lint.cost."lint:msrv"]
seconds = 323
when = ["Cargo.toml"]

[lint.cost."lint:rust"]
seconds = 322
when = ["Cargo.toml"]

[lint.cost."lint:pg-clippy"]
seconds = 222
when = ["Cargo.toml"]

[lint.cost."lint:pg-schema"]
seconds = 187
when = ["Cargo.toml"]

[lint.cost."lint:fuzz-build"]
seconds = 170
when = ["fuzz/Cargo.toml"]

[lint.cost."lint:go"]
seconds = 49
when = ["go.mod"]

[lint.cost."lint:scaffold-assembly"]
seconds = 46
when = ["scaffold/"]

[lint.cost."lint:shell"]
seconds = 44

[lint.cost."lint:belt-shell"]
seconds = 38

[lint.cost."lint:go-fuzz-seeds"]
seconds = 36
when = ["go.mod"]

[lint.cost."lint:python-types"]
seconds = 30
when = ["*.py"]

[lint.cost."lint:types"]
seconds = 27
when = ["*.ts", "*.tsx", "*.mts", "*.cts"]

[lint.cost."lint:shell-embedded"]
seconds = 26

[lint.cost."lint:sql"]
seconds = 24
when = ["*.sql"]

[lint.cost."lint:biome"]
seconds = 23

