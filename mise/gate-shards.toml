# The gate's lint shards and what each heavy lint costs (#2049).
#
# ci.yml runs the lint leg on `shards` runners side by side, and
# mise/gate_shard.py deals the `lint:*` tasks among them, longest first,
# so the heaviest lints land on different runners. A lint's cost is its
# row's `seconds` in a tree where one of its `when` pathspecs (git's
# default meaning; absent = every tree) names a tracked file, and
# `default` everywhere else: a lint that skips in a tree weighs what a
# skip weighs, and the next heavy lint takes that runner.
#
# The seconds are the slowest the lint took in any repository's gate
# when this was measured (2026-11-23, every lint sharing one four-core
# runner), rounded. They decide only which lints share a runner, never
# whether one runs: a stale figure costs balance, not coverage.
# mise/test_gate_shard.py holds every row to a lint the belt defines. A
# repository's own lint is unlisted and weighs `default`.

shards = 4
default = 2

[lint."lint:msrv"]
seconds = 323
when = ["Cargo.toml"]

[lint."lint:rust"]
seconds = 322
when = ["Cargo.toml"]

[lint."lint:pg-clippy"]
seconds = 222
when = ["Cargo.toml"]

[lint."lint:pg-schema"]
seconds = 187
when = ["Cargo.toml"]

[lint."lint:fuzz-build"]
seconds = 170
when = ["fuzz/Cargo.toml"]

[lint."lint:go"]
seconds = 49
when = ["go.mod"]

[lint."lint:scaffold-assembly"]
seconds = 46
when = ["scaffold/"]

[lint."lint:shell"]
seconds = 44

[lint."lint:belt-shell"]
seconds = 38

[lint."lint:go-fuzz-seeds"]
seconds = 36
when = ["go.mod"]

[lint."lint:python-types"]
seconds = 30
when = ["*.py"]

[lint."lint:types"]
seconds = 27
when = ["*.ts", "*.tsx", "*.mts", "*.cts"]

[lint."lint:shell-embedded"]
seconds = 26

[lint."lint:sql"]
seconds = 24
when = ["*.sql"]

[lint."lint:biome"]
seconds = 23
