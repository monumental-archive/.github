# When the gate needs each belt tool (#1410). One row per key in
# config.toml's [tools]; mise/gate_tools.py reads it against
# `git ls-files` and the gate job installs what it names.
#
#   tasks  the gate tasks that call the tool (`ci`'s lint:* wildcard,
#          its depends, and the squash-message step's commits:check)
#   when   the tracked-file pathspecs, git's default meaning, under which
#          one of them does not skip; absent = every repository; [] = no
#          gate task calls it
#   for    install dependencies: needed whenever one of these is
#   run    the commands the tool puts on PATH, where not its key's name
#
# The rows are derived, not remembered: mise/test_gate_tools.py reads
# every gate task and the belt scripts it runs, and fails when a task
# calls a tool missing here, or one whose `when` misses a pathspec the
# task's guard tests. A call before a task's first "skipped" exit, or a
# guard it cannot read, means no `when`.
#
# `scaffold/` is in every conditional row a lint or fixer reaches:
# lint:scaffold-assembly (the canon's own tree) runs every fix:* and
# lint:* task in a repository assembled from the stubs, so the canon
# installs every tool a task calls.

[tools.actionlint]
# lint:actions tests for workflows in an if/else, after its call site.
tasks = ["lint:actions", "lint:scaffold-assembly"]

[tools.shellcheck]
# lint:shell's guard is every tracked file through `shfmt --find`.
tasks = [
  "lint:belt-shell",
  "lint:scaffold-assembly",
  "lint:shell",
  "lint:shell-embedded",
  "lint:task-shell",
  "lint:workflow-shell",
]

[tools.typos]
tasks = ["lint:scaffold-assembly", "lint:typos"]

[tools.lefthook]
# hooks:install and the git hooks only; nothing in the gate.
tasks = []
when = []

[tools.trivy]
tasks = ["lint:scaffold-assembly", "lint:trivy"]

[tools.zizmor]
tasks = ["lint:scaffold-assembly", "lint:zizmor"]
when = [
  "*/action.yaml",
  "*/action.yml",
  ".github/workflows/*.y*ml",
  "action.yaml",
  "action.yml",
  "scaffold/",
]

[tools.committed]
# lint:commits and the squash-message step's commits:check.
tasks = ["commits:check", "lint:commits", "lint:scaffold-assembly"]

[tools.taplo]
tasks = ["lint:scaffold-assembly", "lint:toml", "lint:tracks"]
when = ["*.toml", "scaffold/", "security/identity.toml"]

[tools.shfmt]
# lint:shell finds its subject with `shfmt --find`, so it guards with it.
tasks = [
  "lint:bash-portability",
  "lint:belt-shell",
  "lint:scaffold-assembly",
  "lint:shell",
  "lint:shell-embedded",
  "lint:task-shell",
  "lint:workflow-shell",
]

[tools.rumdl]
# lint:markdown tests for markdown in an if/else, after its call site.
tasks = ["lint:markdown", "lint:scaffold-assembly"]

[tools.lychee]
# audit:links only; the gate is deterministic and checks no link.
tasks = []
when = []

[tools.jq]
# lint:audit-scheduled calls it with no guard. The finding writer
# (findings.sh) encodes each record with it, so every task whose belt
# script reports a finding calls it too (#1934).
tasks = [
  "break:check",
  "commits:check",
  "coverage:check",
  "lint:actions-allowed",
  "lint:audit-scheduled",
  "lint:badges",
  "lint:belt-current",
  "lint:bestpractices",
  "lint:biome",
  "lint:biome-domains",
  "lint:canon-pins",
  "lint:citation",
  "lint:commits",
  "lint:deny",
  "lint:from-digests",
  "lint:fuzz-build",
  "lint:gate-stub",
  "lint:input-forwarding",
  "lint:msrv",
  "lint:pg-schema",
  "lint:python-types",
  "lint:release-stub",
  "lint:rust-properties",
  "lint:scaffold-assembly",
  "lint:signer-pin",
  "lint:source-attest",
  "lint:sql",
  "lint:template-pins",
  "lint:tracks",
  "lint:typescript-properties",
  "lint:vendored",
  "test:pgrx",
  "test:python-properties",
  "test:typescript-properties",
]

[tools.yq]
# mise/embedded_shell.py reads every run: value through
# mise/workflow_yaml.py (#1846), one yq call per selected file: the
# action lints' selection (action-files.sh) and, for the ceiling, the
# workflow templates. lint:task-shell runs the same helper, so the
# derivation, which reads a helper whole, counts it too.
tasks = [
  "lint:scaffold-assembly",
  "lint:shell-embedded",
  "lint:task-shell",
  "lint:workflow-shell",
]
when = [
  "*/action.yaml",
  "*/action.yml",
  "*mise.*.toml",
  "*mise.toml",
  "*mise/config.*.toml",
  "*mise/config.toml",
  ".github/workflows/*.y*ml",
  "action.yaml",
  "action.yml",
  "scaffold/",
  "workflow-templates/*.y*ml",
]

[tools."aqua:suzuki-shunsuke/pinact"]
tasks = ["lint:action-pins", "lint:scaffold-assembly"]
when = [
  "*/action.yaml",
  "*/action.yml",
  ".github/workflows/*.y*ml",
  "action.yaml",
  "action.yml",
  "scaffold/",
]

[tools.ruff]
tasks = ["lint:python", "lint:scaffold-assembly"]
when = ["*.py", "*.pyi", "scaffold/"]

[tools."aqua:biomejs/biome"]
# Everything lint:biome selects, JSON and CSS included: every repository
# tracks renovate.json, so in practice every repository needs it.
tasks = ["lint:biome", "lint:biome-domains", "lint:scaffold-assembly"]
when = [
  "*.cjs",
  "*.css",
  "*.cts",
  "*.gql",
  "*.graphql",
  "*.js",
  "*.json",
  "*.jsonc",
  "*.jsx",
  "*.mjs",
  "*.mts",
  "*.ts",
  "*.tsx",
  "mise/biome-domains.tsv",
  "scaffold/",
]

[tools."github:microsoft/typescript-go"]
# lint:tsc-flags rules on the pinned compiler's options with no guard.
tasks = [
  "lint:scaffold-assembly",
  "lint:tsc-flags",
  "lint:tsconfig-dials",
  "lint:types",
]
run = ["tsc"]

[tools."aqua:taiki-e/cargo-llvm-cov"]
# coverage:check's guard is a committed floor AND a root Cargo.toml,
# go.mod, tracked *.py (#1331) or a root package.json (#1357); the row
# takes the wider half, and the guard cannot say which leg a tree's
# language needs. test:pgrx measures a pgrx extension with it where a
# floor is committed (#1656); an extension can sit in a member, so the
# row also installs it for a tracked member manifest.
tasks = ["coverage:check", "test:pgrx"]
when = ["*.py", "*/Cargo.toml", "Cargo.toml", "go.mod", "package.json"]

[tools."aqua:EmbarkStudios/cargo-deny"]
tasks = ["lint:deny", "lint:scaffold-assembly"]
when = ["*/Cargo.lock", "Cargo.lock", "scaffold/"]

[tools."aqua:google/osv-scanner"]
# audit:* and the release path only.
tasks = []
when = []

[tools."aqua:openvex/vexctl"]
tasks = []
when = []

[tools."aqua:sigstore/gitsign"]
tasks = []
when = []

[tools."aqua:astral-sh/uv"]
# No gate task runs it; mise installs every pipx: tool through it.
for = [
  "pipx:coverage",
  "pipx:hypothesis",
  "pipx:mypy",
  "pipx:reuse",
  "pipx:sqlfluff",
  "pipx:yamllint",
]
run = ["uv", "uvx"]
tasks = []
when = []

[tools.python]
# Every belt helper; lint:subject-budget runs one with no guard.
tasks = [
  "break:check",
  "coverage:check",
  "lint:audit-scheduled",
  "lint:badges",
  "lint:bash-portability",
  "lint:belt-shell",
  "lint:belt-tree",
  "lint:biome",
  "lint:caller-permissions",
  "lint:capability-boundary",
  "lint:citation",
  "lint:cold-attested",
  "lint:coverage-exclusions",
  "lint:deny",
  "lint:fuzz-build",
  "lint:licence",
  "lint:gate-stub",
  "lint:gate-surface",
  "lint:installer-pinned",
  "lint:lock-platforms",
  "lint:msrv",
  "lint:nested-permissions",
  "lint:pg-clippy",
  "lint:pg-schema",
  "lint:pg-upgrade-path",
  "lint:plan-producers",
  "lint:python-module-names",
  "lint:python-target",
  "lint:python-types",
  "lint:runner-pin",
  "lint:rust",
  "lint:rust-properties",
  "lint:scaffold-assembly",
  "lint:shell-embedded",
  "lint:signer-pin",
  "lint:sql",
  "lint:subject-budget",
  "lint:task-shell",
  "lint:template-pins",
  "lint:test-adoption",
  "lint:tsconfig-dials",
  "lint:typescript-properties",
  "lint:vex-one-per-merge",
  "lint:workflow-shell",
  "lint:workspace-inherit",
  "test:pgrx",
  "test:python-properties",
  "test:typescript-properties",
]
run = ["python3", "python"]

[tools."pipx:reuse"]
tasks = ["lint:reuse", "lint:scaffold-assembly"]
when = ["REUSE.toml", "scaffold/"]

[tools."aqua:sigstore/cosign"]
tasks = []
when = []

[tools."github:monumental-archive/stele"]
# lint:policy-load reads its guard from a loop the table cannot read.
tasks = [
  "lint:caller-permissions",
  "lint:policy-load",
  "lint:scaffold-assembly",
  "lint:source-attest",
  "lint:version-mirrors",
]

[tools."aqua:golangci/golangci-lint"]
tasks = ["lint:go", "lint:scaffold-assembly"]
when = ["*/*/go.mod", "*/go.mod", "go.mod", "scaffold/"]

[tools."pipx:sqlfluff"]
tasks = ["lint:scaffold-assembly", "lint:sql"]
when = ["*.sql", "scaffold/"]

[tools."github:obi1kenobi/cargo-semver-checks"]
# break:check, the gate's pull-request step (#1906); audit:semver too.
tasks = ["break:check"]
when = ["*/Cargo.toml", "Cargo.toml"]

[tools."pipx:cosmic-ray"]
# audit:mutants only, and pinned lazy: no bare install builds it (#1771).
tasks = []
when = []

[tools."cargo:cargo-mutants"]
# audit:mutants only, and pinned lazy: no bare install builds it (#1355).
tasks = []
when = []

[tools."go:github.com/sivchari/gomu/cmd/gomu"]
# audit:mutants only, and pinned lazy: no bare install fetches it (#1356).
tasks = []
when = []

[tools."go:github.com/rillig/gobco"]
# audit:coverage-go-branches only, and pinned lazy: no bare install
# fetches it (#1546).
tasks = []
when = []

[tools."github:bnjbvr/cargo-machete"]
tasks = ["lint:machete", "lint:scaffold-assembly"]
when = ["*/Cargo.toml", "Cargo.toml", "scaffold/"]

[tools."aqua:hadolint/hadolint"]
tasks = ["lint:hadolint", "lint:scaffold-assembly"]
when = [
  "*.Dockerfile",
  "*/Dockerfile",
  "*/Dockerfile.*",
  "Dockerfile",
  "Dockerfile.*",
  "scaffold/",
]

[tools."aqua:gitleaks/gitleaks"]
tasks = ["lint:gitleaks", "lint:scaffold-assembly"]

[tools."aqua:editorconfig-checker/editorconfig-checker"]
# lint:editorconfig's guard is every tracked file.
tasks = ["lint:editorconfig", "lint:scaffold-assembly"]

[tools."pipx:yamllint"]
tasks = ["lint:scaffold-assembly", "lint:yaml"]
when = ["*.yaml", "*.yml", "scaffold/"]

[tools."pipx:coverage"]
# coverage:check's python leg (#1331): the same guard as
# cargo-llvm-cov's row, so the same wider half.
tasks = ["coverage:check"]
when = ["*.py", "Cargo.toml", "go.mod", "package.json"]

[tools."pipx:hypothesis"]
# test:python-properties (#1332): its guard is a tracked prop_*.py, and
# git's default pathspec lets `*` cross a slash. lint:python-types
# (#1604) types a property file against Hypothesis's own venv, so its
# guard, any tracked .py or .pyi, installs it too.
tasks = [
  "lint:python-types",
  "lint:scaffold-assembly",
  "test:python-properties",
]
when = ["*.py", "*.pyi", "*prop_*.py", "scaffold/"]

[tools."pipx:mypy"]
# lint:python-types (#1604): its guard is a tracked .py or .pyi.
tasks = ["lint:python-types", "lint:scaffold-assembly"]
when = ["*.py", "*.pyi", "scaffold/"]
