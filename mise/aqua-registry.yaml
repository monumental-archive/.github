# The org's aqua registry corrections: packages where the upstream
# registry resolves an architecture wrongly, carried here until upstream
# and mise both catch up. Selected by `aqua.registries` in config.toml,
# which loads these definitions BEFORE the registry baked into mise.
#
# A package named here overrides the baked definition ENTIRELY — mise
# does not merge the two — which is why each entry below is upstream's
# package copied whole, with the correction inserted, rather than just
# the corrected fragment. A package NOT named here falls through to the
# baked registry untouched; measured on 2026-08-24 with this file
# holding wasm-pack alone, while `aqua:rhysd/actionlint` resolved its
# native `darwin_arm64` asset from the baked registry in the same run.
#
# WHEN THIS FILE DIES, and it is not when you would think (#811). mise
# does not read aqua-registry HEAD: it reads a snapshot compiled into
# its own binary (`aqua.baked_registry`, default true). On 2026-08-24
# that snapshot was aqua-registry commit 6291c29d, and it was fetched
# and diffed byte-for-byte identical to HEAD for wasm-pack. So an
# upstream merge does NOT retire an entry here — the mise version bump
# that carries the new snapshot does. The removal trigger is a mise
# bump, and the test is mechanical: drop the entry, run `mise lock`,
# and keep the deletion only if the lock is unchanged.
#
# `audit:lock-arch` is the other half of this file: it reds when a lock
# resolves an asset whose architecture is not the one its platform key
# declares. An entry here that stops being needed shows up there as a
# check that has nothing left to say, not as silence.
---
packages:
  # wasm-pack (#811). Upstream's current-version entry carries
  # `rosetta2: true` and one `goos: linux` override mapping
  # `arm64: aarch64`. There is no darwin case, so on darwin/arm64 there
  # is no native asset name to build and rosetta2 selects the amd64
  # one — `macos-arm64` resolved the x86_64 tarball, with that binary's
  # checksum pinned under a platform key naming a different
  # architecture.
  #
  # rosetta2 was RIGHT when it was written and became wrong under it:
  # `aarch64-apple-darwin` is absent from v0.13.1 and present from
  # v0.14.0 on (measured against the release assets, 2026-08-24). So
  # the correction is constrained to the versions that have the asset
  # and the fall-through entry keeps emulation for the ones that do
  # not — deleting `rosetta2` outright would break every version below
  # 0.14.0.
  #
  # Package body copied from aqua-registry 6291c29d, plus the
  # `semver(">= 0.14.0")` entry below. Order is load-bearing: aqua
  # takes the FIRST matching `version_constraint`, so this entry must
  # precede the `"true"` catch-all it narrows.
  - type: github_release
    repo_owner: wasm-bindgen
    repo_name: wasm-pack
    aliases:
      - name: rustwasm/wasm-pack
      - name: drager/wasm-pack
    description: your favorite rust -> wasm workflow tool
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        no_asset: true
      - version_constraint: semver("<= 0.4.2")
        asset: wasm-pack-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: wasm-pack
            src: "{{.AssetWithoutExt}}/wasm-pack"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.10.1")
        asset: wasm-pack-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: wasm-pack
            src: "{{.AssetWithoutExt}}/wasm-pack"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        supported_envs:
          - darwin
          - windows
          - amd64
      # THE CORRECTION. `arm64: aarch64` is added per-goos rather than
      # to the shared `replacements` map because windows arm64 has no
      # `aarch64-pc-windows-msvc` asset and still needs
      # `windows_arm_emulation`; a shared replacement would name a
      # Windows tarball that does not exist. Override replacements
      # MERGE with the shared map rather than replacing it — that is
      # what upstream's linux override already relies on to keep
      # `unknown-linux-musl`, and it is why naming `arm64` alone here
      # is enough.
      - version_constraint: semver(">= 0.14.0")
        asset: wasm-pack-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: wasm-pack
            src: "{{.AssetWithoutExt}}/wasm-pack"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            replacements:
              arm64: aarch64
          - goos: darwin
            replacements:
              arm64: aarch64
      - version_constraint: "true"
        asset: wasm-pack-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: wasm-pack
            src: "{{.AssetWithoutExt}}/wasm-pack"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            replacements:
              arm64: aarch64
  # committed (#854) — found by the sweep that `audit:lock-arch` now
  # runs standing, in the belt's OWN lock. Same cause as wasm-pack
  # above, `rosetta2: true` with no darwin arm64 case, but it reaches
  # further: committed is a belt tool on the commit-msg, pre-push and
  # CI path, so every repo and every arm64 machine in the org was
  # installing an x86_64 binary and running it emulated.
  #
  # TWO constraints rather than one, because the two arm64 assets
  # arrived at different versions — measured against the releases on
  # 2026-08-24, not inferred from one of them:
  #
  #   aarch64-apple-darwin        absent v1.1.5,      present v1.1.6+
  #   aarch64-unknown-linux-musl  absent thru v1.1.10, present v1.1.11+
  #
  # Ordered narrowest first, because aqua takes the FIRST matching
  # `version_constraint`. A pin in 1.1.6..1.1.10 therefore gets the
  # darwin correction without being promised a linux arm64 asset that
  # does not exist, and anything older falls through to upstream's
  # `rosetta2`, which is correct there.
  #
  # The 1.1.11 entry also widens `supported_envs`, and that is a
  # SECOND defect rather than more of the first: upstream lists
  # `darwin, windows, amd64`, so on linux/arm64 committed was not the
  # wrong architecture but NO PACKAGE AT ALL — the belt's lock carries
  # no linux-arm64 entry for it, and a linux-arm64 machine cannot
  # install the org's commit linter.
  #
  # Package body copied from aqua-registry 6291c29d, plus the two
  # entries marked below.
  - type: github_release
    repo_owner: crate-ci
    repo_name: committed
    description: Nitpicking commit history since beabf39
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.2") || Version == "v0.1.22"
        no_asset: true
      - version_constraint: Version == "v0.2.8"
        asset: committed-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            format: tar.gz
        supported_envs:
          - linux/amd64
          - windows
      - version_constraint: semver("<= 0.1.4")
        asset: committed-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          windows: pc-windows-msvc
        supported_envs:
          - windows
      - version_constraint: semver("<= 0.1.15")
        asset: committed-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.1.20")
        no_asset: true
      - version_constraint: Version == "v0.1.21"
        asset: committed-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: committed
            src: "{{.AssetWithoutExt}}/committed"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      # THE CORRECTION, narrower half first. v1.1.11 is where the
      # linux arm64 asset appears, and it is what the belt pins.
      - version_constraint: semver(">= 1.1.11")
        asset: committed-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            format: zip
          - goos: darwin
            replacements:
              arm64: aarch64
          - goos: linux
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
          - linux/arm64
      # v1.1.6 through v1.1.10 have the darwin arm64 asset but NOT the
      # linux one, so this half must not promise linux/arm64.
      - version_constraint: semver(">= 1.1.6")
        asset: committed-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            format: zip
          - goos: darwin
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        asset: committed-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
...
