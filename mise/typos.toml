# The ORG's vocabulary for `typos`, delivered from the belt (#445).
#
# `lint:typos` passes this with `-c`, and typos MERGES it with whatever
# `_typos.toml` the repo has (measured: a word allowed in either passes,
# a word in neither still fails). So this file carries what is true
# org-wide and a repo keeps adding its own jargon locally — the one-home
# rule without taking away the thing that is legitimately per-repo.
#
# The belt runs locale `en`, which accepts en-US and en-GB. This file is
# only for jargon the dictionary cannot know about — not for spelling
# preferences.

[files]
# Vendored SPDX identifiers, verbatim from spdx/license-list-data — ids
# like CC-BY-ND and Unicode-TOU read as misspellings to the dictionary.
# Data, not prose; regenerated, never edited.
#
# A cargo-fuzz corpus is machine-generated input (#2079): each file is
# the exact byte string that reached new code, so none can be edited,
# and the next run writes different bytes, so no vocabulary entry can
# keep up. The canon `.editorconfig` already unsets its checks for
# `[fuzz/corpus/**]` for the same reason. edtf's scheduled corpus PR
# went red on `iz` inside one kept input. The pattern is anchored at
# the tree's root, the one place cargo-fuzz writes it: a `fuzz/corpus/`
# anywhere deeper is still checked.
extend-exclude = ["release/spdx-license-data.json", "fuzz/corpus/"]

[default]
# Abbreviated commit SHAs are not words (#1249). typos reads the letters
# between the digits of `3ede177` as `ede` and asks for "edge", which
# reddened the v1.67.1 release PR's generated CHANGELOG — and the next
# SHA has a different run, so no vocabulary entry can keep up.
#
# Skipped: a standalone lowercase hex token of 7+ characters containing
# at least one digit. The digit is the point: `defaced` and `acceded`
# are all a–f letters, and a misspelling spelled only in a–f letters
# (typos knows one for "embedded") must still be checked. typos' regex engine refuses look-ahead (measured on 1.52.0:
# "look-around ... is not supported", exit 78), so the digit is required
# by position instead: one entry per place the first digit can sit —
# p hex characters, a digit, then at least 6-p more — and typos skips
# what any entry matches. There is no upper bound because none is
# observable: typos already skips hex tokens of 32+ characters on its
# own (measured: 31 red, 32/40/64 green), so any cap of 32 or more
# changes nothing. `mise/test_typos_config.py` drives the rows.
extend-ignore-re = [
  '\b[0-9][0-9a-f]{6,}\b',
  '\b[0-9a-f][0-9][0-9a-f]{5,}\b',
  '\b[0-9a-f]{2}[0-9][0-9a-f]{4,}\b',
  '\b[0-9a-f]{3}[0-9][0-9a-f]{3,}\b',
  '\b[0-9a-f]{4}[0-9][0-9a-f]{2,}\b',
  '\b[0-9a-f]{5}[0-9][0-9a-f]+\b',
  '\b[0-9a-f]{6,}[0-9][0-9a-f]*\b',
]

[default.extend-words]
# in-toto's attestation bundles are named `<artifact>.intoto.jsonl`. That
# filename is fixed by the in-toto spec and is what OpenSSF Scorecard's
# Signed-Releases check looks for, so it appears verbatim in prose and in
# the evidence bundle. `typos` reads it as a misspelling of "into".
intoto = "intoto"
# `CPY001` is ruff's missing-copyright-notice rule code (the CPY prefix is
# flake8-copyright). It appears in ruff.toml's ignore list and in the
# verdict that explains why it is ignored. `typos` reads the prefix as a
# misspelling of "COPY" — which is, in fairness, exactly what it abbreviates.
CPY = "CPY"

[default.extend-identifiers]
# "SHOULDs" — RFC-2119 keyword pluralised, in prose and in commit
# subjects the changelog reproduces. The tokenizer splits the trailing
# lowercase s as its own word ("SHOUL" + "Ds") and flags the stem,
# which reddened the v1.14.0 release PR's generated CHANGELOG.
SHOULDs = "SHOULDs"
