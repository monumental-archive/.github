# Release phase 1. This stub is a versioned repo's entire release-PR
# obligation: version decision, changelog, Release PR, and — on merge —
# the App-minted v* tag and draft release, all via the shared workflow.
# Phase 2 (this repository's own publish workflow, triggered by the tag)
# builds, proves and signs. See docs/release.md in monumental-archive/.github.
---
name: release

"on":
  push:
    branches:
      - $default-branch
  # Refresh the open Release PR when a publish completes (#358 seam 5).
  # Why the Release PR needs it is the shared workflow's to say, in its
  # own comments.
  release:
    types:
      - published
  # Recovery path: re-run the tag step against a release commit whose first
  # attempt failed. The shared workflow refuses anything else.
  workflow_dispatch: {}

permissions: {}

# Never cancel a release mid-flight; queue instead — and the group is the
# WORKFLOW, never the commit: per-commit keying let two pushes to main
# four minutes apart run two releases at once, and the first died
# mid-run (measured in release-lab, 2026-08-13). The canon's own
# self-release.yml always keyed on the workflow.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    # No `with:` at all: the caller passes no App identity, only the
    # private key below.
    uses: monumental-archive/.github/.github/workflows/release.yml@ab78e166fb2fada397b99d38ea9a1afdc3561c4b # v1.65.0
    permissions:
      # Required, and easy to omit. A `uses:` job with no `permissions:`
      # block inherits the WORKFLOW-level default — `permissions: {}` above
      # — not some ambient grant; without it the run dies as
      # startup_failure with no jobs and no log.
      contents: read # this repository's contents and releases, read-only
      id-token: write # gitsign's keyless signature on the release tag (#349 S4)
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
...
