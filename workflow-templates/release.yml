# Release phase 1. This stub is a versioned repo's entire release-PR
# obligation: version decision, changelog, Release PR, and — on merge —
# the App-minted v* tag and draft release, all via the shared workflow.
# Phase 2 (this repository's own publish workflow, triggered by the tag)
# builds, proves and signs. See docs/release.md in monumental-archive/.github.
name: release

on:
  push:
    branches: [$default-branch]
  # Recovery path: re-run the tag step against a release commit whose first
  # attempt failed. The shared workflow refuses anything else.
  workflow_dispatch: {}

permissions: {}

# Never cancel a release mid-flight; queue instead. Keyed per commit.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    # No `with:` at all. The App is identified by the org-wide variable
    # TAG_MINT_APP_CLIENT_ID, read by the shared workflow itself, so a
    # caller carries no App identity and never needs updating when it
    # changes.
    uses: monumental-archive/.github/.github/workflows/release.yml@f16ac9b15925563283c23b80cd5aaa75e03d8150 # v1.14.0
    permissions:
      # Required, and easy to omit. A `uses:` job with no `permissions:`
      # block inherits the WORKFLOW-level default — `permissions: {}` above
      # — not some ambient grant. git-cliff reads the repository's commits
      # through the GitHub API, so the shared workflow needs this; without
      # it the run dies as startup_failure with no jobs and no log.
      contents: read # git-cliff's API calls, and the checkout
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
