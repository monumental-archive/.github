# The repo's source-signing identity, live: the org's source-track
# emitter (#207).
#
# This file's path at @refs/heads/main IS the identity: a keyless
# certificate names the workflow path plus ref, so this path is what
# strangers pin — the root-of-trust contract in docs/source-assessment.md
# of monumental-archive/.github. RENAMING OR MOVING THIS FILE IS A
# BREAKING CHANGE to that contract. Content changes freely; the path
# never does.
#
# Copied per repository, deliberately, like the scorecard stub: an
# in-repo workflow's identity is stable forever, where a SHA-pinned
# shared workflow would rotate the org's signing identity on every pin
# bump and orphan chain verification of older links (the pick-two
# trilemma, .github#120). The logic lives once, in the canon action the
# single `uses:` below pins — composite steps run inside this job, so
# the certificate still names this file. Requires canon >= v1.9.0 (the
# release that ships the action); first run per repo is a genesis
# dispatch, see docs/source-track.md.
#
# capability-boundary: this job holds `id-token: write` and runs ZERO
# caller-supplied code — the attested repository is never checked out
# and nothing from its tree is executed; the body is the canon's
# reviewed action, which touches the repo only through git plumbing
# (notes fetch/push) and the rules API. `contents: write` is why source
# provenance does not route through the org signer: the chain append
# needs the one grant sign.yml must never hold (docs/release.md).
name: source-attest

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      genesis:
        description: Found the chain (refused if a link already exists)
        required: false
        default: "false"
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # a queued push must not cancel a chain append

jobs:
  attest:
    name: source-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write # append the signed link to refs/notes/commits
      id-token: write # mint the Sigstore identity — see the boundary marker
    steps:
      - name: Emit provenance and VSA, append the chain link
        uses: monumental-archive/.github/.github/actions/source-attest@9943d269fcdb888ef25d49bf03668e703813157c # v1.10.0
        with:
          genesis: ${{ github.event.inputs.genesis || 'false' }}
