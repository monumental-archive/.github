# The org gate. This stub is a repo's entire CI obligation: everything else
# (linters, versions, enforcement) arrives via the shared workflow and the
# toolbelt it pins. Renovate manages the pin below like any other.
---
name: gate

"on":
  # `edited` is load-bearing: the gate's verdict covers the pull
  # request's title and base, and changes to those arrive only as
  # `edited` events — without it a fixed title stays red and a broken
  # one stays green (.github#427). Do not slim back to the default types.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - $default-branch
  # The merge queue's own run: a queued pull request is squashed onto the
  # real tip of the default branch in a temporary branch, and the
  # required check must report there or the queue waits for a status
  # that never arrives. This is what makes rebasing-to-merge unnecessary
  # (.github#1117). Inert in a repository with no queue; lint:gate-stub
  # requires it either way.
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

# A pull request's runs group by its number, so they can only cancel
# each other. Everything else groups by ref and is never cancelled: an
# event on a pull request that has already merged has no merge ref, so
# its github.ref is the default branch, and a shared group let it cancel
# the push gate on main (.github#1195). Each commit on the default
# branch keeps its own verdict. lint:gate-stub requires both lines.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      # Stated, not inherited: a `uses:` job takes the WORKFLOW-level
      # default, never the caller's ambient grant, so a shared workflow
      # that gains a permission kills silent callers as startup_failure
      # (the gate.yml convention; lint:nested-permissions enforces it —
      # measured on stele's standup, where this template's silence was
      # the one gate finding).
      contents: read # this repository's contents, read-only
    uses: monumental-archive/.github/.github/workflows/ci.yml@ab335fddea081ed006ed3facf42d8db088dcd765 # v1.69.3
...
