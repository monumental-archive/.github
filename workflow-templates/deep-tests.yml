# A repository's fuzz targets, coverage floors and random-seed
# properties (#1858). This stub is the repository's whole obligation for
# this subject: which legs run is repo-deep-tests.yml's business, so a
# leg the canon adds later reaches this repository on its next pin bump
# with nothing to edit here (#681). One workflow per subject, named for
# what a red means: a red in this run is a test that found something.
---
name: deep-tests

"on":
  schedule:
    # Mondays 06:00 UTC, beside the other subject stubs.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deep-tests:
    permissions:
      contents: read # this repository's contents, read-only
