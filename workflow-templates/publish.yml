# Release phase 2. This stub is a versioned repository's entire phase-2
# obligation: build, prove, sign, attach and publish, all via the shared
# orchestrator.
#
# THE FILENAME IS CANON. Both crates.io and npm pin the *caller's* entry
# workflow filename, taken from the OIDC `workflow_ref` claim rather than
# `job_workflow_ref`. Renaming this file breaks trusted publishing, and
# nothing local goes red when it happens.
---
name: publish

"on":
  push:
    tags:
      - v*
  # Resume path. ALWAYS dispatch with --ref <tag>: the shared guard refuses
  # anything that is not a tag, because a branch ref would attest a moving
  # pointer and Sigstore is append-only.
  workflow_dispatch: {}

permissions: {}

# Never cancel a publish mid-flight; queue instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: monumental-archive/.github/.github/workflows/publish.yml@1e0a27ee8004e6f7cbce45054e45e1ea9d473b75 # v1.70.5
    with:
      # Comma-separated. A repository may need several: an image plus
      # binaries, or crates plus a wasm package.
      classes: rust-crate
    permissions:
      # The union every nested job needs, whatever `classes:` names:
      # GitHub checks the whole of it at startup, before any class is
      # skipped. A reusable workflow can only reduce what the caller
      # grants, so a missing scope here kills the run as startup_failure
      # with no jobs and no log.
      contents: read # this repository's contents, read-only
      id-token: write # an OIDC token for this run
      attestations: write # this repository's attestations, read and write
      artifact-metadata: write # this repository's artifact storage records, read and write
      packages: write # this repository's packages, read and write
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
...
