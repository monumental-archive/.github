# The repo-side Monday audit. This stub is a repo's entire audit
# obligation: the checks arrive via the shared workflow and the toolbelt
# it pins — same model as the gate, and deliberately not enumerated
# here. WHICH legs run is repo-audit.yml's business, so a leg the canon
# adds later reaches this repository on its next pin bump with nothing
# to edit in this file — which is how the per-tree link and online
# action checks arrived (#681).
---
name: audit

"on":
  schedule:
    # Mondays 06:00 UTC, beside the canon's own audit.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    permissions:
      contents: read # the audit reads the tree and the advisory feed
    uses: monumental-archive/.github/.github/workflows/repo-audit.yml@25cd10cf53853431ebf8ae6a9299687621a5bb56 # v1.58.0
...
